<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Limpando app…</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#08080f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
         display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;gap:16px;padding:24px;text-align:center}
    .icon{font-size:48px;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .title{font-size:18px;font-weight:700}
    .sub{font-size:13px;color:rgba(255,255,255,.45)}
    .done .icon{animation:none}
  </style>
</head>
<body>
  <div class="icon" id="icon">⟳</div>
  <div class="title" id="title">Limpando cache…</div>
  <div class="sub" id="sub">Aguarde um instante</div>

  <script>
  (async () => {
    try {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      }
    } catch(e) {}
    try {
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
    } catch(e) {}

    document.getElementById('icon').textContent = '✅';
    document.getElementById('icon').style.animation = 'none';
    document.getElementById('title').textContent = 'Pronto!';
    document.getElementById('sub').textContent = 'Redirecionando para o app…';

    setTimeout(() => {
      window.location.replace('/gn-home.html?_v=' + Date.now());
    }, 800);
  })();
  </script>
</body>
</html>
