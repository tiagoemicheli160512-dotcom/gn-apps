<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0D0D1A">
<title>GN Comissões — MESTRA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#080810;color:#E2E8F4;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;font-size:14px;overflow-x:hidden;-webkit-font-smoothing:antialiased}
:root{
  --or:#F26419;--or2:#FF8C42;--or-glow:rgba(242,100,25,.25);
  --gd:#F5D98A;--gd2:#FFE4A0;
  --gr:#16A34A;--gr2:#86EFAC;--gr-bg:rgba(22,163,74,.12);
  --rd:#EF4444;--rd2:#FCA5A5;--rd-bg:rgba(239,68,68,.12);
  --bl:#3B82F6;--bl2:#93C5FD;--bl-bg:rgba(59,130,246,.12);
  --cy:#22D3EE;--cy2:#A5F3FC;--cy-bg:rgba(34,211,238,.1);
  --pu:#A855F7;--pu2:#D8B4FE;
  --gy:#64748B;--gy2:#94A3B8;
  --wh:#10B981;--wh2:#6EE7B7;
  --bg:#080810;--bg2:#0F0F1A;--bg3:#141420;--bg4:#1A1A28;--bg5:#1E1E30;
  --bd:#1E1E35;--bd2:#252538;--bd3:#2E2E48;
  --txt:#E2E8F4;--txt2:#CBD5E1;--txt3:#94A3B8;
  --green:#3ecf4a;
}
button{cursor:pointer;border:none;font-family:inherit;font-size:inherit;transition:all .15s ease}
input,select,textarea{font-family:inherit;font-size:inherit;outline:none;transition:border-color .2s}
select option{background:#1A1A28;color:var(--txt)}
::-webkit-scrollbar{width:2px;height:2px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd3);border-radius:4px}

/* LOGIN */
#login{display:none;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:32px 24px;gap:20px;background:radial-gradient(ellipse at 50% 0%,rgba(242,100,25,.08) 0%,transparent 60%),var(--bg)}
.login-logo{font-size:52px;filter:drop-shadow(0 0 20px rgba(242,100,25,.4))}
.login-brand{font-size:10px;font-weight:800;color:var(--or);letter-spacing:3px;background:linear-gradient(90deg,var(--or),var(--or2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-nome-loja{font-size:26px;font-weight:700;color:var(--gd);letter-spacing:-.5px}
.login-divider{width:40px;height:2px;background:linear-gradient(90deg,var(--or),transparent);border-radius:2px}
.login-form{width:100%;display:flex;flex-direction:column;gap:10px}
.login-label{font-size:11px;font-weight:600;color:var(--gy2);letter-spacing:.5px;text-transform:uppercase}
input.login-in{background:var(--bg3);border:1.5px solid var(--bd2);color:var(--txt);padding:14px 16px;border-radius:12px;width:100%;font-size:15px;font-weight:500;box-shadow:inset 0 1px 3px rgba(0,0,0,.3)}
input.login-in:focus{border-color:var(--or);box-shadow:0 0 0 3px var(--or-glow),inset 0 1px 3px rgba(0,0,0,.3)}
.btn-login{background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;padding:15px;border-radius:12px;font-size:15px;font-weight:700;width:100%;box-shadow:0 4px 20px var(--or-glow);letter-spacing:.3px}
.btn-login:active{transform:scale(.98);opacity:.9}
.login-hint{font-size:11px;color:var(--gy);text-align:center;line-height:1.7}

/* APP */
#app{display:none;flex-direction:column;height:100vh;overflow:hidden}

/* HEADER */
.header{background:linear-gradient(180deg,rgba(20,8,0,.95),rgba(15,6,0,.9));border-bottom:1px solid rgba(242,100,25,.3);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 1px 0 rgba(242,100,25,.15),0 4px 24px rgba(0,0,0,.4)}
.h-logo{font-size:22px;filter:drop-shadow(0 0 8px rgba(242,100,25,.5))}
.h-info{flex:1;min-width:0}
.h-brand{font-size:8px;font-weight:800;color:var(--or);letter-spacing:2px;text-transform:uppercase;opacity:.8}
.h-loja{font-size:16px;font-weight:700;color:var(--gd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.3px}
.h-right{text-align:right;flex-shrink:0}
.h-sem{font-size:10px;color:var(--gy2)}
.h-sem span{color:var(--gd2);font-weight:700;font-family:Consolas,monospace}
.h-user{font-size:10px;color:var(--cy);font-weight:700;letter-spacing:.3px}
.sync-txt{font-size:9px;margin-top:1px}
.sync-ok{color:var(--wh)}.sync-err{color:var(--rd)}.sync-ing{color:var(--cy)}
.btn-pull{background:rgba(255,255,255,.05);border:1px solid var(--bd3);color:var(--gy2);padding:3px 8px;border-radius:6px;font-size:10px;cursor:pointer;margin-left:4px}
.btn-pull:active{background:var(--bd3)}

/* LOJA SELECTOR */
.loja-bar{display:flex;background:var(--bg2);border-bottom:1px solid var(--bd);overflow-x:auto;flex-shrink:0;scrollbar-width:none;padding:8px 12px;gap:6px}
.loja-bar::-webkit-scrollbar{display:none}
.loja-btn{padding:6px 13px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid var(--bd2);background:var(--bg3);color:var(--gy2);cursor:pointer;white-space:nowrap;flex-shrink:0;letter-spacing:.2px}
.loja-btn.on{background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;border-color:var(--or);box-shadow:0 2px 10px var(--or-glow)}

/* TABS */
.tab-bar{display:flex;background:var(--bg2);border-bottom:1px solid var(--bd);overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.tab-bar::-webkit-scrollbar{display:none}
.tab{padding:12px 16px;font-size:11px;font-weight:600;color:var(--gy2);border:none;background:none;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;flex-shrink:0;letter-spacing:.2px;position:relative}
.tab.on{color:var(--or2);border-bottom-color:var(--or)}
.tab.on::after{content:'';position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);width:6px;height:6px;background:var(--or);border-radius:50%;box-shadow:0 0 8px var(--or)}

.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:14px;max-width:700px;margin:0 auto;padding-bottom:32px}

/* WEEK NAV */
.wnav{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.wnav select{flex:1;background:var(--bg3);border:1px solid var(--bd2);color:var(--gd);padding:10px 12px;border-radius:10px;font-size:12px;font-weight:600;appearance:none;-webkit-appearance:none;box-shadow:inset 0 1px 3px rgba(0,0,0,.2)}
.wnav select:focus{border-color:var(--or)}
.wnav button{background:var(--bg4);border:1px solid var(--bd2);color:var(--gd2);padding:10px 15px;border-radius:10px;font-size:20px;line-height:1;flex-shrink:0}
.wnav button:active{background:var(--or);border-color:var(--or);color:#fff;transform:scale(.95)}

.sec-title{font-size:9px;font-weight:800;color:var(--or);letter-spacing:2px;text-transform:uppercase;margin:18px 0 10px;display:flex;align-items:center;gap:6px}
.sec-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--bd3),transparent)}
.row-sb{display:flex;justify-content:space-between;align-items:center}
.vv{font-size:12px;font-weight:700;font-family:Consolas,monospace}
.vv.gd{color:var(--gd)}.vv.or{color:var(--or2)}.vv.gr{color:var(--gr2)}.vv.bl{color:var(--bl2)}

/* CONSOLIDADO */
.cons-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:12px}
.cons-card{background:var(--bg3);border:1px solid var(--bd2);border-radius:14px;padding:14px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2);transition:border-color .2s,box-shadow .2s}
.cons-card:active{border-color:var(--or);transform:scale(.98)}
.cons-card.sel{border-color:rgba(242,100,25,.5);background:linear-gradient(135deg,rgba(242,100,25,.06),var(--bg3));box-shadow:0 0 20px rgba(242,100,25,.1)}
.cons-card.sem-dados{opacity:.45;filter:grayscale(.5)}
.cc-nome{font-size:11px;font-weight:700;color:var(--gd);margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px}
.cc-bruto{font-size:9px;color:var(--gy2);font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.cc-val{font-size:16px;font-weight:700;font-family:Consolas,monospace;color:var(--or2);margin-top:1px}
.cc-pool{font-size:10px;color:var(--wh2);margin-top:4px}
.cc-sync{font-size:9px;color:var(--gy);margin-top:2px}

/* RANKING */
.rank-row{background:var(--bg3);border:1px solid var(--bd2);border-radius:12px;padding:12px 14px;margin-bottom:7px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.rank-pos{width:28px;height:28px;border-radius:50%;background:var(--bg5);border:1px solid var(--bd3);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--gy2);flex-shrink:0}
.rank-pos.gold{background:linear-gradient(135deg,#3a2500,#5a3800);color:var(--gd);border-color:#8B6914;box-shadow:0 0 10px rgba(245,217,138,.15)}
.rank-pos.silver{background:linear-gradient(135deg,#252525,#353535);color:#C0C0C0;border-color:#606060}
.rank-pos.bronze{background:linear-gradient(135deg,#2a1500,#3a2000);color:#CD7F32;border-color:#8B5A00}
.rank-info{flex:1;min-width:0}
.rank-nome{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
.rank-loja{font-size:10px;color:var(--gy2);margin-top:1px}
.rank-val{font-size:15px;font-weight:700;font-family:Consolas,monospace;color:var(--gd);flex-shrink:0;text-shadow:0 0 20px rgba(245,217,138,.2)}

/* KPI */
.kpi-g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--bg3);border:1px solid var(--bd2);border-radius:12px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.kv{font-size:20px;font-weight:700;font-family:Consolas,monospace;color:var(--or2)}
.kl{font-size:10px;color:var(--gy2);margin-top:4px;font-weight:500}

/* CAIXA LOJA */
.caixa-row{background:var(--bg3);border:1px solid var(--bd2);border-radius:12px;padding:12px 14px;margin-bottom:7px;display:grid;grid-template-columns:52px 1fr 78px 78px;gap:10px;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.caixa-row.tot{background:linear-gradient(135deg,rgba(242,100,25,.1),rgba(15,6,0,.8));border-color:rgba(242,100,25,.4);box-shadow:0 0 20px rgba(242,100,25,.08)}
.dl{font-size:12px;color:var(--txt);font-weight:700}
.dd{font-size:10px;color:var(--gy2);margin-top:1px}
.vl{font-size:9px;color:var(--gy);margin-bottom:2px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}

/* FUNCS LOJA (detalhe) */
.fc{background:var(--bg3);border:1px solid var(--bd2);border-radius:14px;margin-bottom:9px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.fc.eleg{border-color:rgba(22,163,74,.35);box-shadow:0 2px 8px rgba(22,163,74,.08)}
.fc.falt{border-color:rgba(239,68,68,.35);box-shadow:0 2px 8px rgba(239,68,68,.08)}
.fc-hdr{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;background:var(--bg4)}
.fc-num{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--bg5),var(--bd2));border:1px solid var(--bd3);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--gy2);font-weight:700;flex-shrink:0}
.fc-nome-text{flex:1;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
.fc-liq{font-size:14px;font-weight:700;font-family:Consolas,monospace;color:var(--gd);white-space:nowrap;flex-shrink:0;text-shadow:0 0 20px rgba(245,217,138,.2)}
.fc-arr{color:var(--gy);font-size:11px;flex-shrink:0;margin-left:2px}
.fc-body{display:none;padding:10px 14px 14px;border-top:1px solid var(--bd)}.fc-body.open{display:block}
.fc-res{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.ri{text-align:center}.rl{font-size:8px;color:var(--gy);font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-bottom:3px}.rv{font-size:13px;font-weight:700;font-family:Consolas,monospace}
.badge{padding:3px 8px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;display:inline-block}
.b-eleg{background:var(--cy-bg);color:var(--cy);border:1px solid rgba(34,211,238,.2)}
.b-f50{background:rgba(245,158,11,.12);color:#FCD34D;border:1px solid rgba(245,158,11,.2)}
.b-f00{background:var(--rd-bg);color:var(--rd2);border:1px solid rgba(239,68,68,.2)}
.dias-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.dia-c{display:flex;flex-direction:column;align-items:center;gap:3px}
.dia-h{font-size:9px;color:var(--gy);text-align:center;font-weight:600}
.dia-badge{font-size:8px;padding:3px 1px;border-radius:5px;text-align:center;width:100%;font-weight:700}
.dia-val{font-size:8px;font-weight:700;font-family:Consolas,monospace;color:var(--gd);text-align:center;width:100%;opacity:.85}

/* ALERTAS */
.alert{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-left:3px solid var(--rd);padding:10px 14px;border-radius:0 10px 10px 0;margin-bottom:8px}
.alert .an{font-weight:700;color:var(--rd2);font-size:12px;margin-bottom:3px}
.alert .ad{font-size:11px;color:var(--txt3)}

/* RESUMO MENSAL */
.mes-tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;margin-bottom:12px}
.mes-tabs::-webkit-scrollbar{display:none}
.mt{padding:6px 14px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid var(--bd2);background:var(--bg3);color:var(--gy2);cursor:pointer;white-space:nowrap;flex-shrink:0;letter-spacing:.3px}
.mt.on{background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;border-color:var(--or);box-shadow:0 2px 12px var(--or-glow)}
.rtbl{width:100%;border-collapse:collapse;font-size:11px}
.rtbl th{background:var(--bg4);color:var(--or);padding:8px 10px;text-align:right;font-size:9px;font-weight:800;border-bottom:1px solid var(--bd2);white-space:nowrap;letter-spacing:.5px;text-transform:uppercase}
.rtbl th:first-child{text-align:left}
.rtbl td{padding:8px 10px;border-bottom:1px solid var(--bd);font-family:Consolas,monospace;text-align:right;white-space:nowrap}
.rtbl td:first-child{font-family:inherit;font-weight:600;text-align:left;color:var(--txt2);max-width:90px;overflow:hidden;text-overflow:ellipsis}
.rtbl tr:nth-child(even) td{background:rgba(255,255,255,.015)}
.rtbl tr.tot td{background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;font-weight:700}

/* WHATSAPP */
.wha-card{background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.2);border-radius:14px;padding:16px;margin-bottom:12px}
.wha-title{font-size:12px;font-weight:700;color:var(--wh2);margin-bottom:12px;letter-spacing:.3px}
.wha-preview{background:rgba(0,0,0,.3);border:1px solid var(--bd);border-radius:10px;padding:14px;font-family:'SF Mono',Consolas,monospace;font-size:11px;color:var(--txt2);white-space:pre-wrap;word-break:break-word;max-height:300px;overflow-y:auto;line-height:1.6;margin-bottom:12px}
.btn-wha{background:linear-gradient(135deg,#059669,var(--wh));color:#fff;border:none;padding:13px 16px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:7px;box-shadow:0 3px 12px rgba(16,185,129,.25)}
.btn-wha:active{transform:scale(.98);opacity:.9}
.btn-copy{background:var(--bg4);color:var(--gd);border:1px solid var(--bd2);padding:10px 16px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;width:100%}
.btn-copy:active{background:var(--bg5)}
.wha-tipo{padding:6px 14px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid var(--bd2);background:var(--bg3);color:var(--gy2);cursor:pointer}
.wha-tipo.on{background:rgba(16,185,129,.15);color:var(--wh2);border-color:rgba(16,185,129,.35)}

/* MISC */
.empty{text-align:center;padding:48px 20px;color:var(--gy)}
.empty .ei{font-size:48px;margin-bottom:12px}
hr.div{border:none;border-top:1px solid var(--bd);margin:12px 0}
.chip{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.chip.ok{background:var(--gr-bg);color:var(--gr2);border:1px solid rgba(22,163,74,.2)}
.chip.ng{background:var(--rd-bg);color:var(--rd2);border:1px solid rgba(239,68,68,.2)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#065F46,#059669);color:#fff;padding:11px 22px;border-radius:24px;font-size:13px;font-weight:700;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px rgba(16,185,129,.3)}
.toast.show{opacity:1}
.loading{text-align:center;padding:30px;color:var(--gy);font-size:13px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" style="display:none;flex-direction:column">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:32px 24px;gap:20px;background:radial-gradient(ellipse at 50% 0%,rgba(242,100,25,.08) 0%,transparent 60%),#080810">
    <div class="login-logo">📊</div>
    <div class="login-brand">GIGANTE NORDESTINO</div>
    <div class="login-nome-loja">Central Mestra</div>
    <div class="login-divider" style="width:40px;height:2px;background:linear-gradient(90deg,var(--or),transparent);border-radius:2px"></div>
    <div class="login-form" style="width:100%;display:flex;flex-direction:column;gap:10px">
      <div class="login-label" style="font-size:11px;font-weight:600;color:var(--gy2);letter-spacing:.5px;text-transform:uppercase">Seu nome</div>
      <input class="login-in" id="login-nome" type="text" placeholder="Ex: Tiago" autocomplete="name">
      <div class="login-label" style="font-size:11px;font-weight:600;color:var(--gy2);letter-spacing:.5px;text-transform:uppercase">Senha</div>
      <input class="login-in" id="login-senha" type="password" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key==='Enter')fazerLogin()">
      <button class="btn-login" id="login-btn" onclick="fazerLogin()">Entrar →</button>
      <div id="login-erro" style="font-size:12px;color:#FF6B6B;text-align:center;min-height:14px"></div>
    </div>
    <div class="login-hint" style="font-size:11px;color:var(--gy);text-align:center;line-height:1.7">Acesso consolidado · 11 lojas · Supabase</div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none;flex-direction:column">
  <div class="header">
    <div class="h-logo">📊</div>
    <div class="h-info">
      <div class="h-brand">GIGANTE NORDESTINO</div>
      <div class="h-loja">Central Mestra</div>
    </div>
    <div class="h-right">
      <div class="h-sem">Semana <span id="hdr-sem">—</span></div>
      <div style="display:flex;align-items:center;justify-content:flex-end;gap:4px">
        <span class="h-user" id="hdr-user"></span>
        <button class="btn-pull" onclick="carregarTodasLojas(true)">↓ Todas</button>
        <button class="btn-pull" onclick="limparCacheRecarregar()" title="Limpar cache e recarregar todos os dados">↺</button>
      </div>
      <div id="sync-txt" class="sync-txt"></div>
    </div>
  </div>

  <!-- Seletor de loja -->
  <div class="loja-bar" id="loja-bar"></div>

  <!-- Tabs -->
  <div class="tab-bar" id="tab-bar"></div>
  <div class="scroll" id="content"></div>
</div>

<div class="toast" id="toast"></div>

<script>

function _buildCAL() {
  const anchor = new Date(2026, 0, 5);
  const DN = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const MN = ['','Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const MA = ['','JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
  const today = new Date();
  const end = new Date(today.getFullYear() + 2, 11, 31);
  const p2 = n => String(n).padStart(2,'0');
  const cal = [];
  const cur = new Date(anchor);
  while (cur <= end) {
    const days = [];
    for (let di = 0; di < 7; di++) {
      const dt = new Date(cur); dt.setDate(dt.getDate() + di);
      days.push({d: dt.getDate(), m: dt.getMonth()+1, nome: DN[dt.getDay()]});
    }
    const thu = new Date(cur); thu.setDate(thu.getDate()+3);
    const ys = new Date(thu.getFullYear(),0,1);
    const num = Math.ceil(((thu - ys)/86400000 + 1)/7);
    const mon = days[0], sun = days[6];
    const month = mon.m;
    cal.push({num, year: cur.getFullYear(), month, abrev: MA[month],
      header: `${p2(mon.d)}/${p2(mon.m)} — ${p2(sun.d)}/${p2(sun.m)}`,
      days, mesNome: MN[month]});
    cur.setDate(cur.getDate() + 7);
  }
  return cal;
}

// Adaptação do getWD/calcSemana para loja específica
function getWDLoja(lojaKey, semIdx) {
  const ad = allDataPorLoja[lojaKey] || {};
  const k = String(semIdx);
  if (!ad[k]) return {brutos:Array(7).fill(0),funcs:Array.from({length:MAX_FUNC},(_,i)=>{return {id:i,nome:'',tipo:'CLT / MENSALISTA',dias:Array(7).fill('PRESENTE')}}),dist:'SIM',vDist:0,saldoSaida:0,motivo:''};
  const wd = {...ad[k]};
  if (!wd.funcs||wd.funcs.length<MAX_FUNC) {
    const cur=[...(wd.funcs||[])];
    while(cur.length<MAX_FUNC) cur.push({id:cur.length,nome:'',tipo:'CLT / MENSALISTA',dias:Array(7).fill('PRESENTE')});
    wd.funcs=cur;
  }
  // Garantir que nome é sempre string e dias sempre array de 7
  wd.funcs = wd.funcs.map((f,i) => ({
    ...f,
    nome: f.nome||'',
    tipo: f.tipo||'CLT / MENSALISTA',
    dias: Array.isArray(f.dias)&&f.dias.length===7 ? f.dias : Array(7).fill('PRESENTE')
  }));
  return wd;
}

function getSaldoAntesLoja(lojaKey, semIdx) {
  let s=0;
  for(let i=0;i<semIdx;i++) {
    const wd=getWDLoja(lojaKey,i);
    const c=calcSemana(wd,s);
    const saida=parseFloat(wd.saldoSaida)||0;
    s=c.retido-saida;
  }
  return s;
}

// calcSemana vem da lógica extraída do Boulevard

function fmtBRL(v) {
  if(isNaN(v)||v==null) v=0;
  return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v);
}
function fmtBRLShort(v) {
  if(isNaN(v)||v==null) v=0;
  return 'R$ '+new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(v);
}
function fmtBRLDia(v) {
  if(isNaN(v)||v==null||v===0) return '—';
  return new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(v);
}

function calcSemana(wd, saldoAnt=0) {
  const ativos=wd.funcs.filter(f=>f.nome.trim());
  const nAtivos=ativos.length;
  const dias=Array.from({length:7},(_,d)=>{
    const e90=(parseFloat(wd.brutos[d])||0)*0.9;
    const I=ativos.filter(f=>f.dias[d]!=='NÃO TRABALHADO').length;
    return {e90,cotaUnit:I>0?e90/I:0,I};
  });
  const funcCalc=ativos.map(f=>{
    let bruta=0;
    dias.forEach((dia,d)=>{ if(['PRESENTE','HORISTA','JOVEM APRENDIZ'].includes(f.dias[d])) bruta+=dia.cotaUnit; });
    const nFS=f.dias.filter(s=>['FALTA','SUSPENSÃO'].includes(s)).length;
    const mult=nFS>=2?0:nFS===1?0.5:1;
    const AF=bruta*mult;
    const elegivel=f.tipo!=='JOVEM APRENDIZ'&&nFS===0&&f.dias.filter(s=>s==='ATESTADO').length===0&&f.dias.filter(s=>['PRESENTE','HORISTA'].includes(s)).length>0;
    const diasEleg=elegivel?f.dias.filter(s=>['PRESENTE','HORISTA'].includes(s)).length:0;
    return {...f,bruta,mult,AF,elegivel,diasEleg,nFS};
  });
  const baseTotal=dias.reduce((s,d)=>s+d.e90,0);
  const sumAF=funcCalc.reduce((s,f)=>s+f.AF,0);
  const poolRateio=Math.max(0,baseTotal-sumAF);
  const saldoTotal=poolRateio+saldoAnt;
  const vD=parseFloat(wd.vDist)||0;
  const efetivo=wd.dist==='SIM'?(vD>0?Math.min(vD,saldoTotal):saldoTotal):0;
  const retido=saldoTotal-efetivo;
  const totalDE=funcCalc.reduce((s,f)=>s+f.diasEleg,0);
  // ADM dividido só por quem tem cota > 0 (AF > 0)
  // Quem está com mult=0% não tem saldo para cobrir o ADM — os outros dividem entre si
  const nPagantes=funcCalc.filter(f=>f.AF>0).length;
  const ff=funcCalc.map(f=>{
    const rateio=f.elegivel&&totalDE>0?efetivo*f.diasEleg/totalDE:0;
    const cota=f.AF+rateio;
    const adm=nPagantes>0&&f.AF>0?ADM/nPagantes:0;
    return {...f,rateio,cota,adm,liquido:cota-adm};
  });
  return {dias,funcCalc:ff,baseTotal,poolRateio,saldoAnt,saldoTotal,efetivo,retido,nAtivos,pct:saldoTotal>0?efetivo/saldoTotal:0};
}
function getSaldoAntes(semIdx) {
  let s=0;
  for(let i=0;i<semIdx;i++){ const c=calcSemana(getWD(i),s); s=c.retido; }
  return s;
}

function parseBRL(v) {
  // Aceita: 1000, 1.000, 1.000,00, 1000.00, 1000,00
  if(!v) return 0;
  v = String(v).trim();
  // Remove R$, espaços
  v = v.replace(/R\$\s*/g,'').trim();
  // Se tem vírgula e ponto: formato BR (1.000,00) ou US (1,000.00)
  if(v.includes(',') && v.includes('.')) {
    // BR: ponto = milhar, vírgula = decimal
    if(v.lastIndexOf(',') > v.lastIndexOf('.')) {
      v = v.replace(/\./g,'').replace(',','.');
    } else {
      v = v.replace(/,/g,'');
    }
  } else if(v.includes(',')) {
    // Só vírgula: pode ser decimal BR (1000,50) ou milhar US (1,000)
    const parts = v.split(',');
    if(parts[parts.length-1].length <= 2) {
      v = v.replace(',','.');
    } else {
      v = v.replace(/,/g,'');
    }
  }
  return parseFloat(v) || 0;
}

  if(!state.visibleSlots) state.visibleSlots={};
  const proximoIdx=wd.funcs.findIndex((f,i)=>!state.visibleSlots[i]);
  if(proximoIdx===-1){ showToast('Limite de funcionários atingido'); return; }
  state.visibleSlots[proximoIdx]=true;
  state.expanded[proximoIdx]=true;
  renderFuncs(document.getElementById('content'),CAL[state.semIdx]);
  setTimeout(()=>{
    const el=document.querySelector(`#fc-${proximoIdx} .fc-nome`);
    if(el) el.focus();
  },50);
}
function removerFuncionario(i, btnEl){
  const wd=getWD(state.semIdx);
  const nomeAtual=(wd.funcs[i]&&wd.funcs[i].nome||'').trim();

  // Se tem nome, exige clique de confirmação (sem usar confirm() nativo, que pode ser bloqueado)
  if(nomeAtual && btnEl && !btnEl.dataset.confirmando){
    btnEl.dataset.confirmando='1';
    const textoOriginal=btnEl.textContent;
    btnEl.textContent='⚠️ Toque de novo p/ confirmar';
    btnEl.style.background='#8B0000';
    setTimeout(()=>{
      if(btnEl.dataset.confirmando){
        delete btnEl.dataset.confirmando;
        btnEl.textContent=textoOriginal;
        btnEl.style.background='var(--rdk)';
      }
    },3000);
    return;
  }

  const wd2={...wd};
  wd2.funcs=[...wd2.funcs];
  wd2.funcs[i]={id:i,nome:'',tipo:'CLT / MENSALISTA',dias:Array(7).fill('PRESENTE'),_removidoEm:Date.now()};
  wd2._lastEdit = Date.now();
  state.allData[String(state.semIdx)]=wd2;
  sv('allData',state.allData);
  const entry={ts:new Date().toLocaleString('pt-BR'),usuario:usuarioAtual,semana:'S'+String(CAL[state.semIdx]?.num||'?').padStart(2,'0'),desc:'Funcionário removido'};
  logEntries.unshift(entry);
  if(logEntries.length>100) logEntries=logEntries.slice(0,100);
  sv('log',logEntries);
  if(state.visibleSlots) delete state.visibleSlots[i];
  if(state.expanded) delete state.expanded[i];
  renderFuncs(document.getElementById('content'),CAL[state.semIdx]);
  showToast('Removendo...');
  // Sync imediato (sem debounce) para evitar que o auto-refresh periódico
  // leia a versão remota antiga antes da remoção ser salva. Aguarda
  // confirmação antes de avisar sucesso.
  clearTimeout(syncTimer);
  syncPendente=true;
  _syncNow().then(()=>showToast(syncStatus==='ok' ? '✓ Removido e salvo' : '⚠️ Removido, mas falhou ao salvar — tente novamente'));
}

function updDia(fi,d,sel){
  const v=sel.value; sel.setAttribute('data-s',v);

function renderResumo(ct){
  const meses={}; CAL.forEach((w,i)=>{ if(!meses[w.month]) meses[w.month]=[]; meses[w.month].push({...w,idx:i}); });
  const mesArr=Object.entries(meses).map(([k,v])=>([+k,v]));
  const mi=state.mesIdx<mesArr.length?state.mesIdx:0;
  const [mesNum,semanas]=mesArr[mi];
  const calcs=semanas.map(w=>calcSemana(getWD(w.idx),getSaldoAntes(w.idx)));
  const nomes=[...new Set(semanas.flatMap(w=>getWD(w.idx).funcs.filter(f=>f.nome.trim()).map(f=>f.nome.trim())))];
  const getLiq=(nome,si)=>{
    const wd=getWD(semanas[si].idx); const fi=wd.funcs.findIndex(f=>f.nome.trim()===nome);
    if(fi===-1) return 0;
    const ai=wd.funcs.slice(0,fi).filter(f=>f.nome.trim()).length;
    return calcs[si].funcCalc[ai]?.liquido||0;
  };
  const thead=`<tr><th>Funcionário</th>${semanas.map(w=>`<th>S${String(w.num).padStart(2,'0')}</th>`).join('')}<th>Total</th></tr>`;
  const tbody=nomes.map(nome=>{
    const vals=semanas.map((_,i)=>getLiq(nome,i));
    const tot=vals.reduce((s,v)=>s+v,0);
    return `<tr><td>${nome}</td>${vals.map(v=>`<td style="color:${v<0?'var(--rd)':v>0?'var(--gd)':'var(--gy)'}">${fmtBRL(v)}</td>`).join('')}<td style="color:var(--gd);font-weight:700">${fmtBRL(tot)}</td></tr>`;
  }).join('');
  const totRow=`<tr class="tot"><td>TOTAL</td>${calcs.map(c=>`<td>${fmtBRL(c.funcCalc.reduce((s,f)=>s+f.liquido,0))}</td>`).join('')}<td>${fmtBRL(calcs.reduce((s,c)=>s+c.funcCalc.reduce((ss,f)=>ss+f.liquido,0),0))}</td></tr>`;
  const mesTabs=mesArr.map(([m],i)=>`<button class="mt${i===mi?' on':''}" onclick="setMesIdx(${i})">${MESES_PT[m].slice(0,3)}</button>`).join('');
  ct.innerHTML=`<div class="pad">
    <div class="mes-tabs">${mesTabs}</div>
    <div class="sec-title">${MESES_PT[mesNum]} 2026</div>
    <div style="overflow-x:auto"><table class="rtbl"><thead>${thead}</thead><tbody>${tbody}${totRow}</tbody></table></div>
    <hr class="div">
    <div class="sec-title">Caixa por semana</div>
    ${semanas.map((w,i)=>`<div class="row-sb" style="background:var(--bg2);border:1px solid var(--bd);border-radius:6px;padding:9px 12px;margin-bottom:5px">
      <span style="font-size:11px;color:var(--gy)">S${String(w.num).padStart(2,'0')} · ${w.header}</span>
      <span class="vv gd">${fmtBRL(getWD(w.idx).brutos.reduce((s,v)=>s+(parseFloat(v)||0),0))}</span>
    </div>`).join('')}
  </div>`;
}
function setMesIdx(i){ state.mesIdx=i; renderResumo(document.getElementById('content')); }

// ── TAB RELATÓRIO ─────────────────────────────────────────────────────────
function renderRelatorio(ct){
  const meses={}; CAL.forEach((w,i)=>{ if(!meses[w.month]) meses[w.month]=[]; meses[w.month].push({...w,idx:i}); });
  let totalLiq=0, mesMaxF='—', maxF=0; const alertas=[];
  Object.entries(meses).forEach(([m,sems])=>{
    const fMap={};
    sems.forEach(w=>{
      const wd=getWD(w.idx); const calc=calcSemana(wd,getSaldoAntes(w.idx));
      totalLiq+=calc.funcCalc.reduce((s,f)=>s+f.liquido,0);
      wd.funcs.forEach(f=>{
        if(!f.nome.trim()) return;
        if(!fMap[f.nome]) fMap[f.nome]={nFS:0,nAt:0};
        fMap[f.nome].nFS+=f.dias.filter(s=>['FALTA','SUSPENSÃO'].includes(s)).length;
        fMap[f.nome].nAt+=f.dias.filter(s=>s==='ATESTADO').length;
      });
    });
    const tf=Object.values(fMap).reduce((s,v)=>s+v.nFS,0);
    if(tf>maxF){ maxF=tf; mesMaxF=MESES_PT[+m]; }
    Object.entries(fMap).forEach(([nome,v])=>{
      if(v.nFS>=2) alertas.push({nome,mes:MESES_PT[+m],tipo:'⛔ FALTA',det:`${v.nFS} faltas/susp + ${v.nAt} atestados`});
      else if(v.nAt>=2) alertas.push({nome,mes:MESES_PT[+m],tipo:'⚠ ATESTADO',det:`${v.nAt} atestados`});
    });
  });
  const alertHtml=alertas.length?alertas.map(a=>`<div class="alert"><div class="an">${a.tipo} — ${a.nome}</div><div class="ad">${a.mes} · ${a.det}</div></div>`).join(''):`<div class="empty"><div class="ei">✅</div>Nenhum alerta</div>`;
  ct.innerHTML=`<div class="pad">
    <div class="sec-title">◄ Relatório Mestre 2026</div>
    <div class="kpi-g">
      <div class="kpi"><div class="kv" style="color:var(--rd)">${alertas.length}</div><div class="kl">Alertas ativos</div></div>
      <div class="kpi"><div class="kv">${mesMaxF.slice(0,3)}</div><div class="kl">Mês com mais faltas</div></div>
    </div>
    <div class="kpi" style="margin-bottom:14px"><div class="kv" style="font-size:18px">${fmtBRL(totalLiq)}</div><div class="kl">Total líquido distribuído no ano</div></div>
    <div class="sec-title">Alertas</div>
    ${alertHtml}</div>`;
}

function gerarTextoAlertas(){
  const meses={}; CAL.forEach((w,i)=>{ if(!meses[w.month]) meses[w.month]=[]; meses[w.month].push({...w,idx:i}); });
  const alertas=[];
  Object.entries(meses).forEach(([m,sems])=>{
    const fMap={};
    sems.forEach(w=>{
      const wd=getWD(w.idx);
      wd.funcs.forEach(f=>{
        if(!f.nome.trim()) return;
        if(!fMap[f.nome]) fMap[f.nome]={nFS:0,nAt:0,ocorrencias:[]};
        f.dias.forEach((s,d)=>{
          if(['FALTA','SUSPENSÃO'].includes(s)){
            fMap[f.nome].nFS++;
            fMap[f.nome].ocorrencias.push({tipo:s,sem:w.num,dia:w.days[d]});
          } else if(s==='ATESTADO'){
            fMap[f.nome].nAt++;
            fMap[f.nome].ocorrencias.push({tipo:s,sem:w.num,dia:w.days[d]});
          }
        });
      });
    });
    Object.entries(fMap).forEach(([nome,v])=>{
      if(v.nFS>=2||v.nAt>=2) alertas.push({nome,mes:MESES_PT[+m],nFS:v.nFS,nAt:v.nAt,ocorrencias:v.ocorrencias});
    });
  });
  const TIPO_ICO={FALTA:'❌',SUSPENSÃO:'🚫',ATESTADO:'📄'};
  let txt=`🏪 *GIGANTE NORDESTINO — ${LOJA_NOME}*
`;
  txt+=`🚨 *RELATÓRIO DE ALERTAS 2026*
`;
  txt+=`${'-'.repeat(32)}

`;
  if(!alertas.length){ txt+=`✅ Nenhum funcionário com alerta.
`; return txt; }
  alertas.forEach(a=>{
    txt+=`⛔ *${a.nome}* — ${a.mes}
`;
    if(a.nFS>=2) txt+=`  Total: ${a.nFS} faltas/suspensões → mult 0%
`;
    if(a.nAt>=2) txt+=`  Total: ${a.nAt} atestados
`;
    a.ocorrencias.forEach(o=>{
      const dataStr=`${String(o.dia.d).padStart(2,'0')}/${String(o.dia.m).padStart(2,'0')}`;
      txt+=`   ${TIPO_ICO[o.tipo]} ${o.tipo} — S${String(o.sem).padStart(2,'0')} (${o.dia.nome} ${dataStr})
`;
    });
    txt+=`
`;
  });
  txt+=`${'-'.repeat(32)}
`;
  txt+=`Total com alerta: *${alertas.length} funcionários*
`;
  return txt;
}

  const alertas=[]; let totalAnual=0;
  Object.entries(meses).forEach(([m,sems])=>{

      if(v.nFS>=2||v.nAt>=2) alertas.push({nome,mes:MESES_PT[+m]});

  });

  txt+=`🚨 *ALERTAS ATIVOS:* ${alertas.length}

`);
  txt+=`
`;

  txt+=`${'-'.repeat(32)}
`;

`;
  return txt;

function chkIco(pct) {
  if(pct===null||pct===undefined) return {ico:'○',cor:'var(--gy2)',label:'—'};
  if(pct===100) return {ico:'●',cor:'#3ecf4a',label:'100%'};
  if(pct>50)    return {ico:'●',cor:'#f0c050',label:pct+'%'};
  return          {ico:'●',cor:'#E8580A',label:pct+'%'};
}

async function carregarChecklistSemana(semIdx) {
  const sem=CAL[semIdx]; if(!sem) return;
  const datas=sem.days.map(day=>{
    const y=2026;
    const m=String(day.m).padStart(2,'0');
    const d=String(day.d).padStart(2,'0');
    return `${y}-${m}-${d}`;
  });
  try {
    const qs=datas.map(d=>`data_operacao=eq.${d}`).join(',');
    const url=`${SB_URL}/rest/v1/checklist_diario?or=(${qs})&select=loja,checklist_pct`;
    const res=await fetch(url,{headers:{'apikey':SB_ANON,'Authorization':'Bearer '+SB_ANON}});
    if(!res.ok) return;
    const rows=await res.json();
    checklistPctPorLoja={};
    const sums={},counts={};
    rows.forEach(r=>{
      if(r.checklist_pct==null) return;
      const k=r.loja;
      sums[k]=(sums[k]||0)+Number(r.checklist_pct);
      counts[k]=(counts[k]||0)+1;
    });
    Object.keys(sums).forEach(k=>{ checklistPctPorLoja[k]=Math.round(sums[k]/counts[k]); });
  } catch(e){}
}

function limparCacheRecarregar() {
  try { localStorage.removeItem('gn_mestra_allDataPorLoja'); } catch(_){}
  allDataPorLoja = {};
  syncStatusPorLoja = {};
  showToast('Cache limpo — recarregando...');
  carregarTodasLojas(true);
}

async function carregarLoja(lojaKey, silent) {
  const MAX_TENTATIVAS = 3;
  let ultimoErro;
  for (let tentativa = 0; tentativa < MAX_TENTATIVAS; tentativa++) {
    if (tentativa > 0) await new Promise(r => setTimeout(r, 800 * tentativa));
    try {
      const res = await fetch(`${SB_URL}/rest/v1/gn_comissoes?loja=eq.${lojaKey}&select=all_data`, {
        headers: {'apikey':SB_ANON,'Authorization':'Bearer '+SB_ANON}
      });
      if (!res.ok) throw new Error('HTTP '+res.status);
      const rows = await res.json();
      if (Array.isArray(rows) && rows.length && rows[0].all_data) {
        const keys = Object.keys(rows[0].all_data);
        if (keys.length) {
          allDataPorLoja[lojaKey] = rows[0].all_data;
        }
      }
      syncStatusPorLoja[lojaKey] = 'ok';
      return;
    } catch(e) {
      ultimoErro = e;
    }
  }
  syncStatusPorLoja[lojaKey] = 'err';
  if(!silent) showToast(`Erro ao carregar ${lojaKey}: ${ultimoErro?.message}`);
}

async function carregarTodasLojas(showFeedback) {
  // 1. Renderiza imediatamente com dados do localStorage (sem esperar rede)
  render();
  setSyncTxt('ing', '⟳ Atualizando...');

  // 2. Busca todas as lojas + checklist em paralelo em background
  const promises = LOJAS_LIST.map(([key]) => carregarLoja(key, true));
  await Promise.all([...promises, carregarChecklistSemana(state.semIdx)]);

  // 3. Salva no localStorage e re-renderiza com dados novos
  try { localStorage.setItem('gn_mestra_allDataPorLoja', JSON.stringify(allDataPorLoja)); } catch(_){}
  sv('lastSync', new Date().toISOString());
  const erros = LOJAS_LIST.filter(([k]) => syncStatusPorLoja[k] === 'err').map(([,n]) => n);
  if (erros.length) {
    setSyncTxt('err', `✗ Falha: ${erros.join(', ')}`);
    if (showFeedback) showToast(`⚠️ Falha ao carregar: ${erros.join(', ')}`);
  } else {
    setSyncTxt('ok', '✓ '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
    if(showFeedback) showToast('✓ Todas as lojas atualizadas!');
  }
  render();
}

// ── HELPERS ──────────────────────────────────────────────────────
function fmtBRL(v){if(isNaN(v)||v==null)v=0;return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v);}
function fmtBRLShort(v){if(isNaN(v)||v==null)v=0;return 'R$ '+new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(v);}
function fmtBRLDia(v){if(isNaN(v)||v==null||v===0)return '—';return new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(v);}
function parseBRL(v){
  if(!v) return 0; v=String(v).trim().replace(/R\$\s*/g,'').trim();
  if(v.includes(',')&&v.includes('.')){
    if(v.lastIndexOf(',')>v.lastIndexOf('.'))v=v.replace(/\./g,'').replace(',','.');
    else v=v.replace(/,/g,'');
  }else if(v.includes(',')){
    const parts=v.split(',');
    if(parts[parts.length-1].length<=2)v=v.replace(',','.');
    else v=v.replace(/,/g,'');
  }
  return parseFloat(v)||0;
}

  else if(state.tab==='ranking') renderRanking(ct,sem);
  else if(state.tab==='loja') renderLojaDetalhe(ct,sem);
  else if(state.tab==='resumo') renderResumoMensal(ct);
  else if(state.tab==='alertas') renderAlertas(ct);
  else if(state.tab==='whatsapp') renderWhatsAppMestra(ct,sem);
}

function setTab(t){state.tab=t;sv('tab',t);render();}
function setLoja(k){state.lojaAtiva=k;sv('lojaAtiva',k);render();}
function setSemIdx(i){
  state.semIdx=Math.max(0,Math.min(CAL.length-1,i));

}

// ── TAB RANKING ──────────────────────────────────────────────────
function renderRanking(ct, sem) {
  // Ranking de lojas por bruto
  const lojaRank = LOJAS_LIST.map(([key,nome]) => {
    const wd=getWDLoja(key,state.semIdx);
    const saldo=getSaldoAntesLoja(key,state.semIdx);
    const calc=calcSemana(wd,saldo);
    const bruto=wd.brutos.reduce((s,v)=>s+(parseFloat(v)||0),0);
    return {key,nome,bruto,base90:calc.baseTotal,pool:calc.poolRateio,nAtivos:calc.nAtivos,coms:calc.funcCalc.reduce((s,f)=>s+f.liquido,0)};
  }).sort((a,b)=>b.bruto-a.bruto);

  // Ranking de funcionários por comissão (todas as lojas)
  const funcRank=[];
  LOJAS_LIST.forEach(([key,nome]) => {
    const wd=getWDLoja(key,state.semIdx);
    const saldo=getSaldoAntesLoja(key,state.semIdx);
    const calc=calcSemana(wd,saldo);
    calc.funcCalc.filter(f=>f.nome&&f.liquido>0).forEach(f=>{
      funcRank.push({nome:f.nome,loja:nome,liquido:f.liquido});
    });
  });
  funcRank.sort((a,b)=>b.liquido-a.liquido);

  const posClass=i=>i===0?'gold':i===1?'silver':i===2?'bronze':'';

  const totalBrutoRank=lojaRank.reduce((s,l)=>s+l.bruto,0);
  const lojaRows=lojaRank.map((l,i)=>{
    const pct=totalBrutoRank>0?Math.round((l.bruto/totalBrutoRank)*100):0;
    return `<div class="rank-row" onclick="setLoja('${l.key}');setTab('loja')">
      <div class="rank-pos ${posClass(i)}">${i+1}</div>
      <div class="rank-info">
        <div class="rank-nome">${l.nome}</div>
        <div class="rank-loja">${l.nAtivos} func · Pool: ${fmtBRLShort(l.pool)}${pct>0?` · <span style="color:var(--or2)">${pct}%</span>`:''}</div>
      </div>
      <div class="rank-val">${fmtBRLShort(l.bruto)}</div>
    </div>`;
  }).join('');

  const funcRows=funcRank.slice(0,20).map((f,i)=>`
    <div class="rank-row">
      <div class="rank-pos ${posClass(i)}">${i+1}</div>
      <div class="rank-info">
        <div class="rank-nome">${f.nome}</div>
        <div class="rank-loja">${f.loja}</div>
      </div>
      <div class="rank-val" style="color:var(--green)">${fmtBRLShort(f.liquido)}</div>
    </div>`).join('');

  const opts=CAL.map((w,i)=>`<option value="${i}"${i===state.semIdx?' selected':''}>S${String(w.num).padStart(2,'0')} · ${w.mesNome} · ${w.header}</option>`).join('');

  ct.innerHTML=`<div class="pad">
    <div class="wnav">
      <button onclick="setSemIdx(${state.semIdx-1})">‹</button>
      <select onchange="setSemIdx(+this.value)">${opts}</select>
      <button onclick="setSemIdx(${state.semIdx+1})">›</button>
    </div>
    <div class="sec-title">🏆 Ranking Lojas — Bruto</div>
    ${lojaRows}
    <div class="sec-title" style="margin-top:16px">🥇 Top 20 Funcionários — Comissão Líquida</div>
    ${funcRows||'<div class="empty"><div class="ei">📭</div>Sem dados ainda</div>'}
  </div>`;
}

// ── TAB RESUMO MENSAL CONSOLIDADO ────────────────────────────────
function renderResumoMensal(ct) {
  const meses={};
  CAL.forEach((w,i)=>{if(!meses[w.month])meses[w.month]=[];meses[w.month].push({...w,idx:i});});
  const mesArr=Object.entries(meses).map(([k,v])=>([+k,v]));
  const mi=state.mesIdx<mesArr.length?state.mesIdx:0;
  const [mesNum,semanas]=mesArr[mi];

  // Para cada semana: somar bruto e coms de todas as lojas
  const semTotais=semanas.map(w=>{
    let bruto=0,coms=0,pool=0;
    LOJAS_LIST.forEach(([key])=>{
      const wd=getWDLoja(key,w.idx);
      const s=getSaldoAntesLoja(key,w.idx);
      const calc=calcSemana(wd,s);
      bruto+=wd.brutos.reduce((s,v)=>s+(parseFloat(v)||0),0);
      coms+=calc.funcCalc.reduce((s,f)=>s+f.liquido,0);
      pool+=calc.poolRateio;
    });
    return {w,bruto,coms,pool};
  });

  // Por loja no mês — bruto e comissões
  const lojaDados=LOJAS_LIST.map(([key,nome])=>{
    const brutoVals=semanas.map(w=>{
      const wd=getWDLoja(key,w.idx);
      return wd.brutos.reduce((s,v)=>s+(parseFloat(v)||0),0);
    });
    const comsVals=semanas.map(w=>{
      const wd=getWDLoja(key,w.idx);
      const s=getSaldoAntesLoja(key,w.idx);
      const calc=calcSemana(wd,s);
      return calc.funcCalc.reduce((s,f)=>s+f.liquido,0);
    });
    return {nome,brutoVals,comsVals,totBruto:brutoVals.reduce((s,v)=>s+v,0),totComs:comsVals.reduce((s,v)=>s+v,0)};
  });
  const lojaRows=lojaDados.map(l=>`<tr><td>${l.nome}</td>${l.brutoVals.map(v=>`<td style="color:${v>0?'var(--gd)':'var(--gy)'}">${fmtBRLShort(v).replace('R$ ','')}</td>`).join('')}<td style="color:var(--or);font-weight:700">${fmtBRLShort(l.totBruto).replace('R$ ','')}</td></tr>`).join('');
  const comsRows=lojaDados.map(l=>`<tr style="border-top:none"><td style="color:var(--gy2);font-size:9px;padding-left:12px">↳ Comissões</td>${l.comsVals.map(v=>`<td style="color:${v>0?'var(--wh2)':'var(--gy)'};font-size:10px">${fmtBRLShort(v).replace('R$ ','')}</td>`).join('')}<td style="color:var(--wh2);font-size:10px;font-weight:700">${fmtBRLShort(l.totComs).replace('R$ ','')}</td></tr>`).join('');

  const totalGeral=semTotais.reduce((s,t)=>s+t.bruto,0);
  const totComsGeral=semTotais.reduce((s,t)=>s+t.coms,0);
  const totRow=`<tr class="tot"><td>TOTAL BRUTO</td>${semTotais.map(t=>`<td>${fmtBRLShort(t.bruto).replace('R$ ','')}</td>`).join('')}<td>${fmtBRLShort(totalGeral).replace('R$ ','')}</td></tr>
  <tr style="background:rgba(16,185,129,.06)"><td style="color:var(--wh2);font-weight:700">TOTAL COMISSÕES</td>${semTotais.map(t=>`<td style="color:var(--wh2)">${fmtBRLShort(t.coms).replace('R$ ','')}</td>`).join('')}<td style="color:var(--wh2);font-weight:700">${fmtBRLShort(totComsGeral).replace('R$ ','')}</td></tr>`;
  const thead=`<tr><th>Loja</th>${semanas.map(w=>`<th>S${String(w.num).padStart(2,'0')}</th>`).join('')}<th>Total</th></tr>`;
  const mesTabs=mesArr.map(([m],i)=>`<button class="mt${i===mi?' on':''}" onclick="setMesIdx(${i})">${MESES_PT[m].slice(0,3)}</button>`).join('');

  ct.innerHTML=`<div class="pad">
    <div class="mes-tabs">${mesTabs}</div>
    <div class="sec-title">${MESES_PT[mesNum]} 2026 — Bruto por Loja</div>
    <div style="overflow-x:auto"><table class="rtbl"><thead>${thead}</thead><tbody>${lojaRows}${comsRows}${totRow}</tbody></table></div>
    <hr class="div">
    <div class="sec-title">Totais por Semana (todas as lojas)</div>
    ${semTotais.map(t=>`
      <div class="row-sb" style="background:var(--bg2);border:1px solid var(--bd);border-radius:8px;padding:9px 12px;margin-bottom:5px">
        <div><div style="font-size:11px;color:var(--gy)">S${String(t.w.num).padStart(2,'0')} · ${t.w.header}</div>
          <div style="font-size:10px;color:var(--green)">Comissões: ${fmtBRLShort(t.coms)}</div></div>
        <div class="vv or">${fmtBRLShort(t.bruto)}</div>
      </div>`).join('')}
  </div>`;
}
function setMesIdx(i){state.mesIdx=i;renderResumoMensal(document.getElementById('content'));}

// ── TAB ALERTAS ──────────────────────────────────────────────────
function renderAlertas(ct) {
  const alertas=[];
  const meses={};
  CAL.forEach((w,i)=>{if(!meses[w.month])meses[w.month]=[];meses[w.month].push({...w,idx:i});});

  LOJAS_LIST.forEach(([key,lojaName])=>{
    Object.entries(meses).forEach(([m,sems])=>{
      const fMap={};
      sems.forEach(w=>{
        const wd=getWDLoja(key,w.idx);
        wd.funcs.forEach(f=>{
          if(!f.nome.trim())return;
          if(!fMap[f.nome])fMap[f.nome]={nFS:0,nAt:0};
          fMap[f.nome].nFS+=f.dias.filter(s=>['FALTA','SUSPENSÃO'].includes(s)).length;
          fMap[f.nome].nAt+=f.dias.filter(s=>s==='ATESTADO').length;
        });
      });
      Object.entries(fMap).forEach(([nome,v])=>{
        if(v.nFS>=2) alertas.push({nome,loja:lojaName,mes:MESES_PT[+m],tipo:'⛔ FALTA',det:`${v.nFS} faltas/susp`});
        else if(v.nAt>=2) alertas.push({nome,loja:lojaName,mes:MESES_PT[+m],tipo:'⚠ ATESTADO',det:`${v.nAt} atestados`});
      });
    });
  });

  const alertHtml=alertas.length
    ?alertas.map(a=>`<div class="alert">
        <div class="an">${a.tipo} — ${a.nome} (${a.loja})</div>
        <div class="ad">${a.mes} · ${a.det}</div>
      </div>`).join('')
    :`<div class="empty"><div class="ei">✅</div>Nenhum alerta em todas as lojas</div>`;

  ct.innerHTML=`<div class="pad">
    <div class="sec-title">🚨 Alertas — Todas as Lojas</div>
    <div style="background:var(--bg2);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin-bottom:12px">
      <div class="row-sb">
        <span style="font-size:12px;color:var(--gy)">Total de alertas ativos</span>
        <span style="font-size:18px;font-weight:700;color:${alertas.length>0?'var(--rd)':'var(--green)'}">${alertas.length}</span>
      </div>
    </div>
    ${alertHtml}
  </div>`;
}

  const calc=calcSemana(wd,saldo);
  const bruto=wd.brutos.reduce((s,v)=>s+(parseFloat(v)||0),0);
  let txt=`🍖 *GN ${lojaNome} — COMISSÕES*
`;
  txt+=`📅 Semana ${String(sem.num).padStart(2,'0')} · ${sem.header}

`;
  txt+=`💰 Bruto: *${fmtBRLShort(bruto)}*
`;
  txt+=`Base 90%: ${fmtBRLShort(calc.baseTotal)}
`;
  txt+=`Total (90% − ADM): *${fmtBRLShort(calc.baseTotal-ADM)}*
`;
  txt+=`Pool rateio: ${fmtBRLShort(calc.poolRateio)}

`;
  txt+=`👥 *COMISSÕES*
`;
  calc.funcCalc.filter(f=>f.nome).forEach(f=>{
    txt+=`• ${f.nome}: *${fmtBRLShort(f.liquido)}*`;
    if(f.nFS>=2) txt+=` ⛔`;
    else if(f.nFS===1) txt+=` ⚠`;
    txt+=`
`;
  });
  return txt;
}

function gerarTextoRankingMestra(){
  const sem=CAL[state.semIdx];
  const lojaRank=LOJAS_LIST.map(([key,nome])=>{
    const wd=getWDLoja(key,state.semIdx);
    const bruto=wd.brutos.reduce((s,v)=>s+(parseFloat(v)||0),0);
    return {nome,bruto};
  }).sort((a,b)=>b.bruto-a.bruto);
  let txt=`🏆 *GN — RANKING LOJAS*
`;
  txt+=`📅 Semana ${String(sem.num).padStart(2,'0')} · ${sem.header}

`;
  lojaRank.forEach((l,i)=>{
    const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}º`;
    txt+=`${medal} ${l.nome}: *${fmtBRLShort(l.bruto)}*
`;
  });
  return txt;
}

function gerarTextoAlertasMestra(){
  const alertas=[];
  const meses={};
  CAL.forEach((w,i)=>{if(!meses[w.month])meses[w.month]=[];meses[w.month].push({...w,idx:i});});
  LOJAS_LIST.forEach(([key,lojaName])=>{
    Object.entries(meses).forEach(([m,sems])=>{
      const fMap={};
      sems.forEach(w=>{
        const wd=getWDLoja(key,w.idx);
        wd.funcs.forEach(f=>{
          if(!f.nome.trim())return;
          if(!fMap[f.nome])fMap[f.nome]={nFS:0,nAt:0};
          fMap[f.nome].nFS+=f.dias.filter(s=>['FALTA','SUSPENSÃO'].includes(s)).length;
          fMap[f.nome].nAt+=f.dias.filter(s=>s==='ATESTADO').length;
        });
      });
      Object.entries(fMap).forEach(([nome,v])=>{
        if(v.nFS>=2) alertas.push(`⛔ ${nome} (${lojaName}) — ${MESES_PT[+m]}: ${v.nFS} faltas/susp`);
        else if(v.nAt>=2) alertas.push(`⚠ ${nome} (${lojaName}) — ${MESES_PT[+m]}: ${v.nAt} atestados`);
      });
    });
  });
  let txt=`🚨 *GN — ALERTAS GERAIS*

`;
  if(!alertas.length) txt+=`✅ Nenhum alerta em todas as lojas`;
  else txt+=alertas.join('\n');
  return txt;
}

function renderWhatsAppMestra(ct,sem){
  const tipos=[
    {id:'consolidado',label:'🏠 Consolidado'},
    {id:'loja',label:'📋 Loja Detalhe'},
    {id:'ranking',label:'🏆 Ranking'},
    {id:'alertas',label:'🚨 Alertas'},
  ];
  const t=state.whaTipo||'consolidado';
  let txt='';
  if(t==='consolidado') txt=gerarTextoConsolidadoMestra();
  else if(t==='loja') txt=gerarTextoLojaDetalhe();
  else if(t==='ranking') txt=gerarTextoRankingMestra();
  else if(t==='alertas') txt=gerarTextoAlertasMestra();
  const tipoBar=tipos.map(tp=>`<button class="wha-tipo${tp.id===t?' on':''}" onclick="setWhaTipo('${tp.id}')">${tp.label}</button>`).join('');
  ct.innerHTML=`<div class="pad">
    <div class="sec-title">◄ Relatório WhatsApp</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">${tipoBar}</div>
    <div class="wha-card">
      <div class="wha-title">📲 Prévia</div>
      <div class="wha-preview">${txt.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
      <button class="btn-wha" onclick="enviarWppMestra()">📲 Enviar pelo WhatsApp</button>
      <button class="btn-copy" onclick="copiarWppMestra()">📋 Copiar texto</button>
    </div>
  </div>`;
}
function setWhaTipo(t){state.whaTipo=t;renderWhatsAppMestra(document.getElementById('content'),CAL[state.semIdx]);}
function getTextoWppMestra(){
  const t=state.whaTipo||'consolidado';
  if(t==='consolidado') return gerarTextoConsolidadoMestra();
  if(t==='loja') return gerarTextoLojaDetalhe();
  if(t==='ranking') return gerarTextoRankingMestra();
  if(t==='alertas') return gerarTextoAlertasMestra();
  return '';
}
function enviarWppMestra(){window.open('https://wa.me/?text='+encodeURIComponent(getTextoWppMestra()),'_blank');}
function copiarWppMestra(){
  const txt=getTextoWppMestra();
  if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>showToast('✓ Copiado!'));
  else{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast('✓ Copiado!');}
}

// ── INIT ─────────────────────────────────────────────────────────
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

(async function inicializar(){
  if(!usuarioAtual){showLogin();}
  else{
    try{
      var s=JSON.parse(localStorage.getItem('gn_session_v1')||'null');
      if(s&&s.loja==='GERAL'&&s.id){
        const r=await fetch(SB_URL+'/rest/v1/gn_usuarios?id=eq.'+s.id+'&ativo=eq.true',{headers:{'apikey':SB_ANON,'Authorization':'Bearer '+SB_ANON}});
        const d=await r.json();
        if(!d||!d.length){usuarioAtual='';sv('usuario','');localStorage.removeItem('gn_mestra_usuario');showLogin();return;}
        const _p=d[0].permissoes||{};
        const _hasAccess=_p.mestra!==false||_p.comissoes==='admin'||d[0].cargo==='mestre';
        if(!_hasAccess){usuarioAtual='';sv('usuario','');localStorage.removeItem('gn_mestra_usuario');showLogin();return;}
      }
    }catch(e){}
    hideLogin();carregarTodasLojas(false);
  }
})();
setInterval(()=>{if(usuarioAtual)carregarTodasLojas(false);},30000);
</script>
