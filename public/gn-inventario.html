<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>GN Inventário</title>
<style>
:root{--bg:#F5F6F8;--card:#FFFFFF;--card2:#EEF1F4;--laranja:#E8580A;--ouro:#B8860B;--ok:#16A34A;--erro:#DC2626;--mut:#5B6472;--warn:#D97706;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:#1A1D23;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}

/* LOGIN */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{background:var(--card);border-radius:16px;padding:32px 24px;width:100%;max-width:360px}
.login-logo{text-align:center;font-size:40px;margin-bottom:4px}
.login-title{text-align:center;font-size:20px;font-weight:800;color:var(--ouro);margin-bottom:2px}
.login-sub{text-align:center;font-size:11px;color:var(--mut);margin-bottom:24px;letter-spacing:.3px}
.login-input{width:100%;background:var(--card2);border:1px solid #E1E4E9;color:#1A1D23;border-radius:8px;padding:11px 13px;font-size:14px;font-family:inherit;margin-bottom:10px}
.login-input:focus{outline:none;border-color:var(--laranja)}
.login-btn{width:100%;background:var(--laranja);color:#fff;border:none;border-radius:8px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.login-btn:active{opacity:.85}
.login-err{color:var(--erro);font-size:12px;text-align:center;margin-top:8px;min-height:18px}

/* LAYOUT */
.hidden{display:none!important}
.hdr{background:var(--card);padding:11px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--card2)}
.hdr-title{font-size:15px;font-weight:800;color:var(--ouro)}
.hdr-sub{font-size:10px;color:var(--mut);margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:8px}
.hdr-user{font-size:10px;color:var(--mut);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-logout{background:none;border:none;color:var(--mut);font-size:11px;cursor:pointer;padding:4px 6px;border-radius:6px;font-family:inherit;opacity:.7}
.btn-logout:hover{opacity:1;color:var(--erro)}
#selLoja{font-size:11px;font-weight:700;padding:6px 8px;border-radius:10px;border:1px solid rgba(232,88,10,.3);background:rgba(232,88,10,.1);color:var(--laranja);flex-shrink:0;max-width:130px;font-family:inherit}

/* BOTTOM NAV */
.bot-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--card2);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom,0)}
.bot-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7px 2px 8px;cursor:pointer;font-size:9px;font-weight:700;color:var(--mut);letter-spacing:.3px;text-transform:uppercase;gap:2px;transition:color .15s;border:none;background:none;font-family:inherit}
.bot-tab.sel{color:var(--ouro)}
.bot-tab .ti{font-size:20px;line-height:1}

/* CHIPS / SETORES */
.chips-wrap{display:flex;overflow-x:auto;gap:6px;padding:10px 14px;scrollbar-width:none;-ms-overflow-style:none;background:var(--bg);border-bottom:1px solid var(--card2);position:sticky;top:48px;z-index:15}
.chips-wrap::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;background:var(--card2);border:1px solid #E1E4E9;color:var(--mut);border-radius:99px;padding:5px 14px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .15s}
.chip.sel{background:var(--laranja);border-color:var(--laranja);color:#fff}

/* CONTENT */
.content{padding:10px 14px 90px}

/* ITEM CARDS */
.icard{background:var(--card);border-radius:12px;margin-bottom:8px;border:1px solid var(--card2)}
.icard-head{padding:10px 12px 6px;display:flex;align-items:center;gap:10px}
.icard-icon{width:36px;height:36px;border-radius:9px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.icard-info{flex:1;min-width:0}
.icard-nome{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icard-meta{font-size:10px;color:var(--mut);margin-top:2px}
.icard-qty{font-size:22px;font-weight:800;color:var(--ouro);white-space:nowrap}
.icard-actions{padding:0 10px 10px;display:flex;gap:6px;flex-wrap:wrap}
.btn-sm{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;border:none;transition:opacity .1s}
.btn-sm:active{opacity:.75}
.btn-sm.pri{background:var(--laranja);color:#fff}
.btn-sm.sec{background:var(--card2);color:var(--mut);border:1px solid #E1E4E9}
.btn-sm.dan{background:rgba(220,38,38,.12);color:var(--erro);border:1px solid rgba(220,38,38,.25)}

/* FORM */
.form-card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid var(--card2)}
.form-title{font-size:14px;font-weight:800;color:var(--ouro);margin-bottom:14px}
.form-field{margin-bottom:10px}
.form-label{font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px}
.form-input{width:100%;background:var(--card2);border:1px solid #E1E4E9;color:#1A1D23;border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit}
.form-input:focus{outline:none;border-color:var(--laranja)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form-btns{display:flex;gap:8px;margin-top:12px}
.form-btn{flex:1;padding:11px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border:none;transition:opacity .1s}
.form-btn:active{opacity:.8}
.form-btn.pri{background:var(--laranja);color:#fff}
.form-btn.sec{background:var(--card2);color:var(--mut)}

/* MARKETING CARDS */
.mkt-card{background:var(--card);border-radius:12px;margin-bottom:8px;border:1px solid var(--card2)}
.mkt-head{padding:12px 14px 8px;display:flex;align-items:center;gap:12px}
.mkt-icon{font-size:28px;line-height:1}
.mkt-info{flex:1;min-width:0}
.mkt-nome{font-size:14px;font-weight:700}
.mkt-sub{font-size:10px;color:var(--mut);margin-top:2px}
.mkt-qty{font-size:26px;font-weight:800;color:var(--ouro);white-space:nowrap}
.mkt-controls{padding:0 14px 12px;display:flex;gap:8px;align-items:center}
.qty-wrap{display:flex;align-items:center;gap:6px;flex:1}
.qty-btn{width:34px;height:34px;border-radius:8px;background:var(--card2);border:1px solid #E1E4E9;color:#1A1D23;font-size:20px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;flex-shrink:0;line-height:1}
.qty-btn:active{opacity:.7}
.qty-input{flex:1;background:var(--card2);border:1px solid #E1E4E9;color:#1A1D23;border-radius:8px;padding:6px 10px;font-size:16px;font-weight:700;text-align:center;font-family:inherit;min-width:0}
.qty-input:focus{outline:none;border-color:var(--laranja)}

/* HISTORY */
.hist-item{padding:9px 12px;border-top:1px solid var(--card2);display:flex;align-items:flex-start;gap:8px}
.hist-date{color:var(--mut);font-size:10px;white-space:nowrap;min-width:55px}
.hist-qty{color:var(--erro);font-weight:800;font-size:14px;min-width:32px}
.hist-details{flex:1;min-width:0}
.hist-obs{color:#1A1D23;font-size:11px;line-height:1.4}
.hist-user{color:var(--mut);font-size:10px;margin-top:2px}
.hist-del{background:none;border:none;color:var(--mut);cursor:pointer;font-size:13px;padding:2px 4px;opacity:.6}
.hist-del:hover{opacity:1;color:var(--erro)}

/* RELATÓRIO */
.relat-card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid var(--card2)}
.relat-title{font-size:13px;font-weight:800;color:var(--ouro);margin-bottom:10px}
.relat-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--card2)}
.relat-row:last-child{border-bottom:none}
.relat-name{font-size:12px;font-weight:600;color:#1A1D23}
.relat-val{font-size:13px;font-weight:800;color:var(--ouro)}
.relat-total{padding:8px 0 0;display:flex;justify-content:space-between;font-size:13px;font-weight:800;border-top:2px solid var(--card2);margin-top:4px}
.wpp-btn{width:100%;background:#25D366;color:#fff;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px}
.wpp-btn:active{opacity:.8}
.btn-sm.ok{background:rgba(22,163,74,.12);color:var(--ok);border:1px solid rgba(22,163,74,.25)}
.btn-sm.edit{background:rgba(184,134,11,.07);color:var(--ouro);border:1px solid rgba(184,134,11,.18)}
.inv-busca{width:100%;background:var(--card2);border:1px solid #E1E4E9;color:#1A1D23;border-radius:8px;padding:8px 12px;font-size:13px;font-family:inherit;margin-bottom:10px}
.inv-busca:focus{outline:none;border-color:var(--laranja)}
.tab-badge{display:inline-block;background:var(--erro);color:#fff;border-radius:99px;font-size:8px;font-weight:800;padding:1px 5px;margin-left:3px;vertical-align:middle;line-height:1.5}

/* EMPTY */
.empty-state{text-align:center;padding:48px 20px;color:var(--mut)}
.empty-icon{font-size:40px;margin-bottom:10px}
.empty-hint{font-size:11px;margin-top:6px}

/* FAB */
.fab{position:fixed;bottom:74px;right:16px;width:52px;height:52px;border-radius:50%;background:var(--laranja);color:#fff;border:none;font-size:28px;font-weight:300;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(232,88,10,.4);z-index:25;font-family:inherit;line-height:1}
.fab:active{opacity:.85;transform:scale(.95)}

/* TOAST */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 18px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:999;white-space:nowrap}
#toast.show{opacity:1}

/* BACK HEADER */
.back-hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--card2);position:sticky;top:48px;z-index:15}
.back-btn{background:var(--card2);border:1px solid #E1E4E9;color:var(--mut);border-radius:8px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.back-title{font-size:13px;font-weight:700;color:var(--ouro);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* SECTION LABEL */
.section-label{font-size:9px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;padding:14px 14px 6px}

/* DESKTOP SIDEBAR */
#sidebar-nav{display:none}
@media(min-width:768px){
  body{padding-left:224px}
  .bot-nav{display:none!important}
  .fab{right:24px;bottom:24px}
  #sidebar-nav{display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;width:224px;background:var(--card);border-right:1px solid var(--card2);overflow-y:auto;z-index:50;padding-bottom:16px}
  .sidebar-brand{padding:14px 14px 10px;border-bottom:1px solid var(--card2);margin-bottom:6px;display:flex;align-items:center;gap:10px;flex-shrink:0}
  .sidebar-section{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);padding:10px 14px 4px}
  .sidebar-link{display:flex;align-items:center;gap:9px;padding:8px 14px;font-size:13px;font-weight:500;color:var(--mut);text-align:left;width:100%;border-left:3px solid transparent;transition:color .12s,background .12s;background:none;border-top:none;border-right:none;border-bottom:none;cursor:pointer;font-family:inherit}
  .sidebar-link:hover{color:#1A1D23;background:var(--card2)}
  .sidebar-link.active{color:var(--ouro);background:rgba(184,134,11,.10);border-left-color:var(--ouro);font-weight:600}
  .sidebar-link .sl-icon{width:20px;font-size:14px;line-height:1;text-align:center;flex-shrink:0}
  .chips-wrap{top:48px}
}
</style>
</head>

<!-- APP -->
<div id="app" class="hidden">
  <div class="hdr">
    <div>

<script>
const SB_URL = 'https://ncxttwvpafajnilpjbol.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jeHR0d3ZwYWZham5pbHBqYm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4NDcyMDEsImV4cCI6MjA5NzQyMzIwMX0.MGDZNGY8GfSzBKAgdR7OhvOeR71i4fj9YseJRhoh5sE';
const SESSION_KEY = 'gn_session_v1';

const SETORES = [
  { key:'Computadores',  icon:'💻' },
  { key:'Bancadas',      icon:'🪑' },
  { key:'Prateleiras',   icon:'📚' },
  { key:'Cozinha',       icon:'🍳' },
  { key:'Salão',         icon:'🍽️' },
  { key:'Escritório',    icon:'💼' },
  { key:'Estoque',       icon:'📦' },
  { key:'Frigorífico',   icon:'❄️' },
  { key:'Limpeza',       icon:'🧹' },
  { key:'Outros',        icon:'🔧' },
];

const MKT_ITEMS = [
  { key:'Cardápio',          icon:'📋' },
  { key:'Display de Mesa',   icon:'🖼️' },
  { key:'Triângulo de Mesa', icon:'🔺' },
  { key:'Pano Grande',       icon:'🧺' },
  { key:'Pano Pequeno',      icon:'🧤' },
];

const S = {
  usuario:    null,
  lojaAtiva:  null,        // loja cujo inventário/marketing está sendo visto/editado
  lojaForcada:null,        // != null => usuário travado nessa loja, sem seletor
  tab:        'inventario',
  setor:      'Computadores',
  view:       'list',       // 'list' | 'add' | 'addMkt' | 'edit'
  saidaCtx:   null,         // { type:'inv'|'mkt', ref:number|string }
  histCtx:    null,         // { type:'inv'|'mkt', ref:number|string }
  entradaCtx: null,         // { type:'inv', ref:number }
  editCtx:    null,         // index into S.data.items
  invBusca:   '',
  data:       null,
  patTransferCtx: null,     // { itemId, tipo:'patrimonio'|'mkt' } — item sendo transferido (form aberto)
  patManutCtx: null,        // { itemId } — item de patrimônio sendo enviado pra manutenção (form aberto)
};

// Catálogo global de nomes de patrimônio (gn_patrimonio_catalogo) — compartilhado entre
// todas as lojas, carregado uma vez no login. {id, nome}[]
let _patCatalogo = [];

// ─── UTILS ───────────────────────────────────────────────
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function toast(msg){ const e=$('toast'); e.textContent=msg; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),2200); }
function fmtDate(iso){ if(!iso)return'—'; const d=new Date(iso); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function nowISO(){ return new Date().toISOString(); }

async function sb(path, opts={}){
  const h={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'};
  if(opts.prefer) h['Prefer']=opts.prefer;
  // Timeout de 30s — sem isso, uma instabilidade de rede/gateway faz o fetch nunca
  // resolver, travando salvamentos pra sempre em vez de cair no catch e avisar.
  const controller=new AbortController();
  const timeoutId=setTimeout(()=>controller.abort(),30000);
  let r;
  try{
    r=await fetch(`${SB_URL}/rest/v1/${path}`,{method:opts.method||'GET',headers:h,body:opts.body?JSON.stringify(opts.body):undefined,signal:controller.signal});
  }catch(e){
    if(e.name==='AbortError') throw new Error('Tempo de conexão esgotado. Verifique sua internet e tente novamente.');
    throw e;
  }finally{
    clearTimeout(timeoutId);
  }
  if(!r.ok){const t=await r.text();throw new Error(t);}
  const txt=await r.text();
  if(!txt||!txt.trim()) return [];
  return JSON.parse(txt);
}

// ─── STORAGE ─────────────────────────────────────────────
function storageKey(){
  return 'gn_inv_v1_'+(S.lojaAtiva||'geral').replace(/[\s/]+/g,'_');
}

function loadData(){
  try{
    const raw=localStorage.getItem(storageKey());
    S.data=raw?JSON.parse(raw):null;
  }catch(e){ S.data=null; }
  if(!S.data) S.data={items:[],saidas:[],mkt:{},mktSaidas:[],mktCustomItems:[]};
  if(!S.data.mktSaidas) S.data.mktSaidas=[];
  if(!S.data.mktCustomItems) S.data.mktCustomItems=[];
  if(!S.data.entradas) S.data.entradas=[];
  if(!S.data.patrimonio) S.data.patrimonio=[];
  if(!S.data.patrimonioTransferencias) S.data.patrimonioTransferencias=[];

async function saveDataCloud(){
  if(!S.lojaAtiva) return;
  try{
    await sb('gn_inventario_cloud',{method:'POST',prefer:'resolution=merge-duplicates',body:{loja:S.lojaAtiva,dados:S.data,atualizado_em:new Date().toISOString(),atualizado_por:S.usuario.nome}});
    setCloudBadge('cloud');
  }catch(e){ setCloudBadge('local'); }
}

async function loadDataCloud(){
  if(!S.lojaAtiva){ loadData(); return; }
  try{
    const rows=await sb(`gn_inventario_cloud?loja=eq.${encodeURIComponent(S.lojaAtiva)}&select=dados,atualizado_em`);
    if(rows&&rows.length&&rows[0].dados){
      S.data=rows[0].dados;
      if(!S.data.mktSaidas) S.data.mktSaidas=[];
      if(!S.data.mktCustomItems) S.data.mktCustomItems=[];
      if(!S.data.entradas) S.data.entradas=[];
      if(!S.data.patrimonio) S.data.patrimonio=[];
      if(!S.data.patrimonioTransferencias) S.data.patrimonioTransferencias=[];
      if(!S.data.patrimonioManutencoes) S.data.patrimonioManutencoes=[];
      MKT_ITEMS.forEach(m=>{ if(S.data.mkt[m.key]==null) S.data.mkt[m.key]=0; });
      S.data.mktCustomItems.forEach(m=>{ if(S.data.mkt[m.id]==null) S.data.mkt[m.id]=0; });
      try{ localStorage.setItem(storageKey(),JSON.stringify(S.data)); }catch(_){}
      setCloudBadge('cloud');
      return;
    }
  }catch(e){}
  loadData();
  setCloudBadge('local');
}

// ─── AUTH ────────────────────────────────────────────────
async function doLogin(){
  const nome=$('ln-user').value.trim(), senha=$('ln-pass').value;
  const err=$('ln-err'); err.textContent='';
  if(!nome||!senha){ err.textContent='Preencha usuário e senha.'; return; }
  try{
    const rows=await sb(`gn_usuarios?nome=ilike.${encodeURIComponent(nome)}&senha=eq.${encodeURIComponent(senha)}&ativo=eq.true&select=id,nome,cargo,loja,permissoes`);
    if(!rows.length){ err.textContent='Usuário ou senha inválidos.'; return; }
    const u=rows[0]; const p=u.permissoes||{};
    const cargosOk=window.CARGOS_INVENTARIO;
    const temAcesso=p.inventario||p.master||cargosOk.includes(u.cargo||'');
    if(!temAcesso){ err.textContent='Sem permissão para acessar GN Inventário.'; return; }
    S.usuario=u;
    try{ localStorage.setItem(SESSION_KEY,JSON.stringify({...S.usuario,ts:Date.now()})); }catch(_){}
    iniciarApp();
  }catch(e){ err.textContent='Erro de conexão.'; }
}

async function iniciarApp(){
  if(!S.usuario){
    try{
      const s=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');
      if(s?.nome&&(Date.now()-s.ts)<43200000) S.usuario=s;
    }catch(_){}
  }
  if(!S.usuario) return;
  try{
    const rows=await sb(`gn_usuarios?id=eq.${S.usuario.id}&ativo=eq.true&select=nome,cargo,loja,permissoes`);
    if(!rows.length){ doLogout(); return; }
    S.usuario={...S.usuario,...rows[0]};
    const p=S.usuario.permissoes||{};
    const cargosOk=window.CARGOS_INVENTARIO;
    if(!p.inventario&&!p.master&&!cargosOk.includes(S.usuario.cargo||'')){ doLogout(); return; }
    try{ localStorage.setItem(SESSION_KEY,JSON.stringify({...S.usuario,ts:Date.now()})); }catch(_){}
  }catch(_){}
  _resolverLojaAtiva();
  await loadDataCloud();
  _carregarCatalogoPatrimonio();
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('hdr-user').textContent=S.usuario.nome+(S.usuario.loja?' · '+S.usuario.loja:'');
  atualizarHeaderLoja();
  render();
}

function doLogout(){
  try{ localStorage.removeItem(SESSION_KEY); }catch(_){}
  S.usuario=null; S.data=null; S.lojaAtiva=null; S.lojaForcada=null;
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
  $('ln-user').value=''; $('ln-pass').value=''; $('ln-err').textContent='';
  setTimeout(()=>$('ln-user').focus(),100);
}

// ─── LOJA ATIVA ──────────────────────────────────────────
// Antes o app usava direto S.usuario.loja pra tudo (chave de storage local,
// linha de gn_inventario_cloud, auditoria...) — funciona pra um(a) gerente,
// que só vê a própria loja, mas trava mestre/supervisor/administrador (cuja
// conta de gn_usuarios normalmente não tem uma loja fixa) numa loja "geral"
// sem seletor, sem sincronizar com a nuvem (saveDataCloud/loadDataCloud
// exigem loja) e sem jeito de ver ou editar o inventário de uma loja
// específica. Mesmo critério de "quem pode alternar loja" já usado no app
// Lojas (CARGOS_ALTERNAR_LOJA + flag master) — gerente/admin continuam
// travados na própria loja, sem seletor.
function _resolverLojaAtiva(){
  const cargo=(S.usuario.cargo||'').toLowerCase();
  const podeAlternar=(window.CARGOS_ALTERNAR_LOJA||[]).includes(cargo)
    || S.usuario.loja==='GERAL' || !!(S.usuario.permissoes && S.usuario.permissoes.master);
  S.lojaForcada=podeAlternar ? null : (S.usuario.loja||null);
  if(S.lojaForcada){ S.lojaAtiva=S.lojaForcada; return; }
  const lojasValidas=(window.GN_LOJAS||[]).map(l=>l.userKey);
  let salva=null;
  try{ salva=localStorage.getItem('gn_inv_loja_ativa'); }catch(_){}
  S.lojaAtiva = lojasValidas.includes(salva) ? salva
    : lojasValidas.includes(S.usuario.loja) ? S.usuario.loja
    : (lojasValidas[0]||null);
}

function atualizarHeaderLoja(){
  $('hdr-sub').textContent=S.lojaAtiva||'Sem loja definida';
  if($('sidebar-loja')) $('sidebar-loja').textContent=S.lojaAtiva||'';
  const sel=$('selLoja');
  if(!sel) return;
  if(!sel.dataset.built){
    (window.GN_LOJAS||[]).forEach(l=>{
      const o=document.createElement('option');
      o.value=l.userKey; o.textContent='● '+l.display; o.style.color=l.cor||'#1A1D23';
      sel.appendChild(o);
    });
    sel.dataset.built='1';
  }
  sel.value=S.lojaAtiva||'';
  sel.style.display=S.lojaForcada?'none':'';
  // Mesma cor de identidade da loja usada nos cards do Painel de Gestão (Home) — pinta o
  // seletor pra ficar óbvio qual loja está ativa de relance, sem precisar ler o texto.
  const lojaObj=(window.GN_LOJAS||[]).find(l=>l.userKey===S.lojaAtiva);
  const cor=lojaObj?.cor;
  sel.style.borderColor=cor?cor+'88':'';
  sel.style.background=cor?cor+'1a':'';
  sel.style.color=cor||'';
}

async function changeLojaAtiva(v){
  if(S.lojaForcada||!v||v===S.lojaAtiva) return;
  S.lojaAtiva=v;
  try{ localStorage.setItem('gn_inv_loja_ativa',v); }catch(_){}
  atualizarHeaderLoja();
  await loadDataCloud();
  setTab('inventario');
}

function setTab(tab){
  S.tab=tab; S.view='list'; S.saidaCtx=null; S.histCtx=null; S.entradaCtx=null; S.editCtx=null; S.invBusca=''; S.patTransferCtx=null; S.patManutCtx=null;

}

function setSetor(idx){ S.setor=SETORES[idx].key; render(); }

function onFabClick(){
  if(S.tab==='marketing'){ S.view='addMkt'; render(); }
  else if(S.tab==='patrimonio'){ S.view='addPat'; render(); }
  else{ S.view='add'; render(); }
}

function render(){
  // Bottom nav highlight
  ['inv','mkt','rel','aud','pat'].forEach(k=>{
    const t={inv:'inventario',mkt:'marketing',rel:'relatorio',aud:'auditoria',pat:'patrimonio'}[k];
    $('tab-'+k)?.classList.toggle('sel',S.tab===t);
  });
  // Badge de alertas na aba Inventário
  if(S.data?.items){
    const alertCount=S.data.items.filter(i=>i.minimo>0&&i.quantidade<i.minimo).length;
    const badge=alertCount>0?` <span class="tab-badge">${alertCount}</span>`:'';
    const tabInv=$('tab-inv');
    if(tabInv) tabInv.innerHTML=`<span class="ti">📦</span><span>Inventário${badge}</span>`;
    const slInv=$('sl-inventario');
    if(slInv){ slInv.innerHTML=`<span class="sl-icon">📦</span>Inventário${badge}`; slInv.classList.toggle('active',S.tab==='inventario'); }
  }
  // Sidebar highlight (others)
  ['marketing','relatorio','auditoria','patrimonio'].forEach(t=>{
    document.getElementById('sl-'+t)?.classList.toggle('active',S.tab===t);
  });
  // FAB on inventory, marketing or patrimônio list
  const fab=$('fab');
  const showFab=(S.tab==='inventario'||S.tab==='marketing'||S.tab==='patrimonio')&&S.view==='list'&&!S.saidaCtx&&!S.histCtx&&!S.entradaCtx&&!S.patTransferCtx&&!S.patManutCtx;
  if(showFab) fab.classList.remove('hidden');
  else fab.classList.add('hidden');

  const c=$('app-content');
  if(S.histCtx){ renderHistPanel(c); return; }
  if(S.saidaCtx){ renderSaidaPanel(c); return; }
  if(S.entradaCtx){ renderEntradaPanel(c); return; }
  if(S.patTransferCtx){ renderTransferPatrimonio(c); return; }
  if(S.patManutCtx){ renderManutencaoPatrimonio(c); return; }
  if(S.tab==='inventario'){
    if(S.view==='add') renderAddItem(c);
    else if(S.view==='edit') renderEditItem(c);
    else renderInventario(c);
  } else if(S.tab==='marketing'){
    if(S.view==='addMkt') renderAddMktItem(c);
    else renderMarketing(c);
  } else if(S.tab==='auditoria'){
    renderAuditoria(c);
  } else if(S.tab==='patrimonio'){
    if(S.view==='addPat') renderAddPatrimonioItem(c);
    else renderPatrimonio(c);
  } else {
    renderRelatorio(c);
  }
}

function addItem(){
  const nome=($('f-nome')?.value||'').trim();
  const setor=$('f-setor')?.value||S.setor;

function delItem(id){

  S.data.saidas=S.data.saidas.filter(s=>s.item_id!==id);
  saveData(); toast('Excluído'); render();

function addMktItem(){

function delMktItem(id){

  S.data.mktCustomItems=(S.data.mktCustomItems||[]).filter(m=>m.id!==id);
  S.data.mktSaidas=S.data.mktSaidas.filter(s=>s.item!==id);
  delete S.data.mkt[id];
  saveData(); toast('Excluído'); render();
  if(item) _logAuditoriaInv('EXCLUIR_ITEM_MKT',{item:item.nome});
}

function mktAdj(key,delta,idx){
  S.data.mkt[key]=Math.max(0,(S.data.mkt[key]||0)+delta);
  saveData();
  const v=S.data.mkt[key];
  const qi=$(`mkt-q-${idx}`); if(qi) qi.value=v;
  const dq=$(`mkt-dq-${idx}`); if(dq) dq.textContent=v;
}

function mktSetKey(key,val,idx){
  S.data.mkt[key]=Math.max(0,parseInt(val,10)||0);
  saveData();
  const v=S.data.mkt[key];
  const qi=$(`mkt-q-${idx}`); if(qi) qi.value=v;
  const dq=$(`mkt-dq-${idx}`); if(dq) dq.textContent=v;
}

    const item=S.data.items[ctx.ref];

    nome=item.nome; maxQty=item.quantidade;
  } else {
    const key=ctx.ref;
    const defItem=MKT_ITEMS.find(m=>m.key===key);
    const custItem=(S.data.mktCustomItems||[]).find(m=>m.id===key);
    nome=defItem?defItem.key:(custItem?custItem.nome:key);
    maxQty=S.data.mkt[key]||0;
  }
  c.innerHTML=`
    <div class="back-hdr">
      <button class="back-btn" onclick="cancelView()">← Voltar</button>
      <div class="back-title">↩ Registrar Saída</div>
    </div>

      <div class="form-card">
        <div class="form-title" style="color:var(--ouro)">${esc(nome)}</div>
        <div style="font-size:12px;color:var(--mut);margin-bottom:14px">Disponível: <strong style="color:#1A1D23">${maxQty}</strong></div>
        <div class="form-field">
          <label class="form-label">Quantidade de saída *</label>
          <input class="form-input" id="s-qty" type="number" min="1" max="${maxQty}" value="1" autofocus
            onkeydown="if(event.key==='Enter')document.getElementById('s-obs')?.focus()">
        </div>
        <div class="form-field">
          <label class="form-label">Observação (opcional)</label>
          <input class="form-input" id="s-obs" placeholder="Ex: devolvido ao fornecedor"
            onkeydown="if(event.key==='Enter')confirmarSaida()">
        </div>

          <button class="form-btn sec" onclick="cancelView()">Cancelar</button>
          <button class="form-btn pri" onclick="confirmarSaida()">✅ Confirmar Saída</button>
        </div>
      </div>
    </div>`;
  setTimeout(()=>$('s-qty')?.select(),60);
}

function confirmarSaida(){
  const ctx=S.saidaCtx;
  const qty=parseInt($('s-qty')?.value||0,10);
  const obs=($('s-obs')?.value||'').trim();
  if(!qty||qty<1){ toast('Quantidade inválida'); return; }

  let itemNome='';
  if(ctx.type==='inv'){
    const item=S.data.items[ctx.ref];
    if(!item){ toast('Item não encontrado'); return; }
    if(qty>item.quantidade){ toast(`Máximo: ${item.quantidade}`); return; }
    item.quantidade-=qty;
    itemNome=item.nome;
    S.data.saidas.push({id:uid(),item_id:item.id,item_nome:item.nome,setor:item.setor,quantidade:qty,obs,data:nowISO(),usuario:S.usuario.nome});
  } else {
    const key=ctx.ref;
    const avail=S.data.mkt[key]||0;
    if(qty>avail){ toast(`Máximo: ${avail}`); return; }
    S.data.mkt[key]=avail-qty;
    itemNome=key;
    S.data.mktSaidas.push({id:uid(),item:key,quantidade:qty,obs,data:nowISO(),usuario:S.usuario.nome});
  }
  saveData(); S.saidaCtx=null; toast('✅ Saída registrada!'); render();
  _logAuditoriaInv('SAIDA_ITEM',{item:itemNome,quantidade:qty,obs});
}

function delSaida(type,id){
  if(!confirm('Excluir este registro? A quantidade será restaurada.')) return;
  let itemNome='', qtdRestaurada=0;
  if(type==='inv'){
    const s=S.data.saidas.find(x=>x.id===id);
    if(s){
      const item=S.data.items.find(i=>i.id===s.item_id);
      if(item) item.quantidade+=s.quantidade;
      itemNome=s.item_nome; qtdRestaurada=s.quantidade;
      S.data.saidas=S.data.saidas.filter(x=>x.id!==id);
    }
  } else {
    const s=S.data.mktSaidas.find(x=>x.id===id);
    if(s){
      S.data.mkt[s.item]=(S.data.mkt[s.item]||0)+s.quantidade;
      itemNome=s.item; qtdRestaurada=s.quantidade;
      S.data.mktSaidas=S.data.mktSaidas.filter(x=>x.id!==id);
    }
  }
  saveData(); toast('Excluído'); render();
  if(itemNome) _logAuditoriaInv('EXCLUIR_SAIDA',{item:itemNome,quantidade:qtdRestaurada});
}

function _buildTextoInventario(){

  let txt=`GN Inventário — ${loja}\n${hoje}\n`;
  txt+=`\n─ INVENTÁRIO ─\n`;
  let hasInv=false;
  SETORES.forEach(s=>{
    const items=S.data.items.filter(i=>i.setor===s.key);
    if(!items.length) return;
    hasInv=true;
    txt+=`\n${s.icon} ${s.key}\n`;
    items.forEach(i=>{ txt+=`• ${i.nome}: ${i.quantidade}${i.minimo>0&&i.quantidade<i.minimo?' ⚠️':''}\n`; });

// ─── PATRIMÔNIO ──────────────────────────────────────────
// Bem fixo (freezer, balcão, prateleira, TV...), diferente do estoque de insumo: sem
// entrada/saída, sem mínimo/alerta — só cadastro com quantidade ajustada manualmente e
// movimentação entre lojas. O catálogo de nomes (gn_patrimonio_catalogo) é global, igual
// pra todas as lojas; cada loja tem sua própria lista de itens com quantidade
// (S.data.patrimonio) e suas próprias transferências (S.data.patrimonioTransferencias).
//
// Transferência: mesmo espírito do Empréstimo de Mercadorias do app Lojas — registro
// duplicado (mesmo id) na linha de gn_inventario_cloud das duas lojas, uma escreve
// diretamente na linha da outra pra ambas enxergarem o mesmo registro. Diferente do
// empréstimo de insumo (que tem devolução, confirmação dupla), patrimônio normalmente não
// volta — é uma transferência definitiva: quem envia debita na hora, quem recebe só
// confirma o recebimento (1 confirmação) pra creditar na loja de destino.

async function _carregarCatalogoPatrimonio(){
  try{ _patCatalogo=await sb('gn_patrimonio_catalogo?select=id,nome&order=nome.asc'); }
  catch(e){ _patCatalogo=[]; }
}

function _lojaDisplay(userKey){
  return (window.GN_LOJAS||[]).find(l=>l.userKey===userKey)?.display || userKey || '—';
}

// Lê/grava a linha de OUTRA loja em gn_inventario_cloud — necessário pra registrar a
// transferência dos dois lados (mesma técnica de sbPushLoja() do app Lojas). A mesma linha
// guarda TODOS os dados do Inventário/Marketing daquela loja (não só patrimônio) — por
// isso precisa completar todos os campos que loadDataCloud()/loadData() esperam (senão o
// próximo carregamento da OUTRA loja quebra em MKT_ITEMS.forEach por causa de "mkt"
// undefined, cai no catch, e descarta os dados da nuvem voltando pro armazenamento local).
async function _fetchDadosLoja(lojaKey){
  const rows=await sb(`gn_inventario_cloud?loja=eq.${encodeURIComponent(lojaKey)}&select=dados`);
  const d=(rows&&rows[0]&&rows[0].dados)||{};
  if(!d.items) d.items=[];
  if(!d.saidas) d.saidas=[];
  if(!d.entradas) d.entradas=[];
  if(!d.mkt) d.mkt={};
  if(!d.mktSaidas) d.mktSaidas=[];
  if(!d.mktCustomItems) d.mktCustomItems=[];
  if(!d.patrimonio) d.patrimonio=[];
  if(!d.patrimonioTransferencias) d.patrimonioTransferencias=[];
  return d;
}
async function _pushDadosLoja(lojaKey,dados){
  await sb('gn_inventario_cloud',{method:'POST',prefer:'resolution=merge-duplicates',body:{loja:lojaKey,dados,atualizado_em:nowISO(),atualizado_por:S.usuario.nome}});
}

// tipo: 'patrimonio' | 'mkt' — os dois compartilham S.data.patrimonioTransferencias,
// diferenciados pelo campo t.tipo (registros antigos sem o campo contam como 'patrimonio').
function _patPendentesDestino(tipo){ return (S.data.patrimonioTransferencias||[]).filter(t=>t.destino===S.lojaAtiva&&!t.confirmado&&(t.tipo||'patrimonio')===tipo); }
function _patPendentesOrigem(tipo){ return (S.data.patrimonioTransferencias||[]).filter(t=>t.origem===S.lojaAtiva&&!t.confirmado&&(t.tipo||'patrimonio')===tipo); }

function _transferPendHtml(tipo){
  const pendDestino=_patPendentesDestino(tipo), pendOrigem=_patPendentesOrigem(tipo);
  if(!pendDestino.length&&!pendOrigem.length) return '';
  return `<div class="content" style="padding-bottom:0">
    ${pendDestino.map(t=>`<div class="form-card" style="border-color:rgba(22,163,74,.3);background:rgba(22,163,74,.06)">
      <div style="font-size:12px;font-weight:700;color:var(--ok)">📥 Recebendo de ${esc(_lojaDisplay(t.origem))}</div>
      <div style="font-size:13px;font-weight:700;margin:4px 0">${esc(t.item_nome)} — ${t.quantidade}</div>
      ${t.motivo?`<div style="font-size:11px;color:var(--mut);margin-bottom:8px">${esc(t.motivo)}</div>`:''}

async function addPatrimonioItem(){
  const catId=$('fp-catalogo')?.value||'';
  const setor=$('fp-setor')?.value||S.setor;
  const qty=Math.max(0,parseInt($('fp-qty')?.value||0,10)||0);
  let nome,catalogoId;
  if(catId==='__novo__'){
    nome=($('fp-nome-novo')?.value||'').trim();
    if(!nome){ toast('Digite o nome do novo item'); return; }
    try{
      const rows=await sb('gn_patrimonio_catalogo',{method:'POST',prefer:'return=representation',body:{nome,criado_por:S.usuario.nome}});
      catalogoId=rows[0].id;
      _patCatalogo.push({id:catalogoId,nome});
      _patCatalogo.sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
    }catch(e){ toast('⚠️ Erro ao criar item no catálogo'); return; }
  }else{
    const cat=_patCatalogo.find(it=>it.id===catId);
    if(!cat){ toast('Escolha um item'); return; }
    nome=cat.nome; catalogoId=cat.id;
  }
  if(!S.data.patrimonio) S.data.patrimonio=[];
  S.data.patrimonio.push({id:uid(),catalogo_id:catalogoId,nome,setor,quantidade:qty,criado_em:nowISO(),criado_por:S.usuario.nome});
  saveData(); S.setor=setor; S.view='list';
  toast('✅ Item adicionado!');
  _logAuditoriaInv('ADICIONAR_PATRIMONIO',{item:nome,quantidade:qty,setor});
  render();
}

function patAdj(idx,delta){
  const it=S.data.patrimonio[idx]; if(!it) return;
  it.quantidade=Math.max(0,it.quantidade+delta);

}
function patSetQty(idx,val){
  const it=S.data.patrimonio[idx]; if(!it) return;
  it.quantidade=Math.max(0,parseInt(val,10)||0);
  saveData();
  const qi=$(`pat-q-${idx}`); if(qi) qi.value=it.quantidade;
}

async function confirmarTransferPatrimonio(){
  const ctx=S.patTransferCtx;
  const tipo=ctx.tipo||'patrimonio';
  const destino=$('ft-destino')?.value;
  const qty=Math.max(0,parseInt($('ft-qty')?.value||0,10)||0);
  const motivo=($('ft-motivo')?.value||'').trim();
  if(!destino){ toast('Escolha a loja de destino'); return; }

  let registro;
  if(tipo==='mkt'){
    const m=allMktList().find(x=>x.id===ctx.itemId);
    if(!m) return;
    const disponivel=S.data.mkt[m.id]||0;
    if(qty<=0||qty>disponivel){ toast('Quantidade inválida'); return; }
    registro={
      id:uid(), tipo:'mkt', origem:S.lojaAtiva, destino,
      item_ref:m.id, item_nome:m.nome, icon:m.icon, isDefault:m.isDefault, quantidade:qty, motivo,
      criado_em:nowISO(), criado_por:S.usuario.nome,
      confirmado:false, confirmado_em:null, confirmado_por:null,
    };
    // Debita na hora, igual ao empréstimo de mercadorias do app Lojas
    S.data.mkt[m.id]=disponivel-qty;
  }else{
    const item=(S.data.patrimonio||[]).find(i=>i.id===ctx.itemId);
    if(!item) return;
    if(qty<=0||qty>item.quantidade){ toast('Quantidade inválida'); return; }
    registro={
      id:uid(), tipo:'patrimonio', origem:S.lojaAtiva, destino, catalogo_id:item.catalogo_id,
      item_nome:item.nome, setor:item.setor, quantidade:qty, motivo,
      criado_em:nowISO(), criado_por:S.usuario.nome,
      confirmado:false, confirmado_em:null, confirmado_por:null,
    };
    item.quantidade-=qty;
  }

  if(!S.data.patrimonioTransferencias) S.data.patrimonioTransferencias=[];
  S.data.patrimonioTransferencias.push(registro);
  saveData();

  // Grava o mesmo registro (mesmo id) na linha da loja de destino, pra ela ver a pendência
  try{
    const dadosDestino=await _fetchDadosLoja(destino);
    dadosDestino.patrimonioTransferencias.push(registro);
    await _pushDadosLoja(destino,dadosDestino);
  }catch(e){
    toast('⚠️ Salvo aqui, mas não consegui avisar a loja de destino agora — tente novamente mais tarde');
  }

  _logAuditoriaInv(tipo==='mkt'?'TRANSFERIR_MKT':'TRANSFERIR_PATRIMONIO',{item:registro.item_nome,quantidade:qty,destino:_lojaDisplay(destino)});
  S.patTransferCtx=null;
  toast('✅ Transferência enviada!');
  render();
}

async function cancelarTransferPatrimonio(id){
  const t=(S.data.patrimonioTransferencias||[]).find(r=>r.id===id);
  if(!t||t.origem!==S.lojaAtiva||t.confirmado) return;
  if(!confirm('Cancelar esta transferência? A quantidade volta pra loja.')) return;
  const tipo=t.tipo||'patrimonio';

  if(tipo==='mkt'){
    S.data.mkt[t.item_ref]=(S.data.mkt[t.item_ref]||0)+t.quantidade;
  }else{
    const item=(S.data.patrimonio||[]).find(i=>(t.catalogo_id&&i.catalogo_id===t.catalogo_id)||i.nome===t.item_nome);
    if(item) item.quantidade+=t.quantidade;
  }
  S.data.patrimonioTransferencias=(S.data.patrimonioTransferencias||[]).filter(r=>r.id!==id);
  saveData();

  try{
    const dadosDestino=await _fetchDadosLoja(t.destino);
    dadosDestino.patrimonioTransferencias=(dadosDestino.patrimonioTransferencias||[]).filter(r=>r.id!==id);
    await _pushDadosLoja(t.destino,dadosDestino);
  }catch(e){}

  _logAuditoriaInv(tipo==='mkt'?'CANCELAR_TRANSFERENCIA_MKT':'CANCELAR_TRANSFERENCIA_PATRIMONIO',{item:t.item_nome,quantidade:t.quantidade});
  toast('Cancelado'); render();
}

async function confirmarRecebimentoPatrimonio(id){
  const t=(S.data.patrimonioTransferencias||[]).find(r=>r.id===id);
  if(!t||t.destino!==S.lojaAtiva||t.confirmado) return;
  t.confirmado=true; t.confirmado_em=nowISO(); t.confirmado_por=S.usuario.nome;
  const tipo=t.tipo||'patrimonio';

  if(tipo==='mkt'){
    if(!S.data.mktCustomItems) S.data.mktCustomItems=[];
    if(!t.isDefault&&!S.data.mktCustomItems.find(m=>m.id===t.item_ref)){
      S.data.mktCustomItems.push({id:t.item_ref,nome:t.item_nome,icon:t.icon||'📣',criado_em:nowISO(),criado_por:S.usuario.nome});
    }
    S.data.mkt[t.item_ref]=(S.data.mkt[t.item_ref]||0)+t.quantidade;
  }else{
    // Credita no patrimônio desta loja — reaproveita um item já existente (mesmo catálogo
    // ou mesmo nome) em vez de duplicar, se a loja já tiver esse item cadastrado.
    let item=(S.data.patrimonio||[]).find(i=>(t.catalogo_id&&i.catalogo_id===t.catalogo_id)||i.nome===t.item_nome);
    if(!item){
      item={id:uid(),catalogo_id:t.catalogo_id,nome:t.item_nome,setor:t.setor||'Outros',quantidade:0,criado_em:nowISO(),criado_por:S.usuario.nome};
      if(!S.data.patrimonio) S.data.patrimonio=[];
      S.data.patrimonio.push(item);
    }
    item.quantidade+=t.quantidade;
  }
  saveData();

  // Avisa a loja de origem que foi confirmado (best-effort — se a origem tiver cancelado
  // nesse meio-tempo, o registro já não existe lá e essa parte só não faz nada).
  try{
    const dadosOrigem=await _fetchDadosLoja(t.origem);
    const idx=dadosOrigem.patrimonioTransferencias.findIndex(r=>r.id===id);
    if(idx>=0){
      dadosOrigem.patrimonioTransferencias[idx].confirmado=true;
      dadosOrigem.patrimonioTransferencias[idx].confirmado_em=t.confirmado_em;
      dadosOrigem.patrimonioTransferencias[idx].confirmado_por=t.confirmado_por;
      await _pushDadosLoja(t.origem,dadosOrigem);
    }
  }catch(e){}

  _logAuditoriaInv(tipo==='mkt'?'CONFIRMAR_RECEBIMENTO_MKT':'CONFIRMAR_RECEBIMENTO_PATRIMONIO',{item:t.item_nome,quantidade:t.quantidade,origem:_lojaDisplay(t.origem)});
  toast('✅ Recebimento confirmado!');
  render();
}

function confirmarEnvioManutencao(){
  const item=(S.data.patrimonio||[]).find(i=>i.id===S.patManutCtx.itemId);
  if(!item) return;
  const qty=Math.max(0,parseInt($('fmn-qty')?.value||0,10)||0);
  const local=($('fmn-local')?.value||'').trim();
  const respNome=($('fmn-resp-nome')?.value||'').trim();
  const respContato=($('fmn-resp-contato')?.value||'').trim();
  if(qty<=0||qty>item.quantidade){ toast('Quantidade inválida'); return; }
  if(!local){ toast('Informe pra onde o item foi'); return; }
  if(!respNome){ toast('Informe o responsável'); return; }
  if(!respContato){ toast('Informe o contato do responsável'); return; }

  item.quantidade-=qty;
  if(!S.data.patrimonioManutencoes) S.data.patrimonioManutencoes=[];
  S.data.patrimonioManutencoes.push({
    id:uid(), item_id:item.id, item_nome:item.nome, quantidade:qty, local,
    responsavel_nome:respNome, responsavel_contato:respContato,
    enviado_em:nowISO(), enviado_por:S.usuario.nome,
    devolvido:false, devolvido_em:null, devolvido_por:null,
  });
  saveData();
  _logAuditoriaInv('ENVIAR_MANUTENCAO',{item:item.nome,quantidade:qty,local,responsavel:respNome});
  S.patManutCtx=null;
  toast('✅ Enviado pra manutenção!');
  render();
}

function confirmarDevolucaoManutencao(id){
  const m=(S.data.patrimonioManutencoes||[]).find(r=>r.id===id);
  if(!m||m.devolvido) return;
  m.devolvido=true; m.devolvido_em=nowISO(); m.devolvido_por=S.usuario.nome;
  const item=(S.data.patrimonio||[]).find(i=>i.id===m.item_id) || (S.data.patrimonio||[]).find(i=>i.nome===m.item_nome);
  if(item) item.quantidade+=m.quantidade;
  saveData();
  _logAuditoriaInv('CONFIRMAR_DEVOLUCAO_MANUTENCAO',{item:m.item_nome,quantidade:m.quantidade,local:m.local});
  toast('✅ Devolução confirmada!');
  render();
}

  EDITAR_ITEM:      { icon: '✏️', label: 'Editou item diretamente',  cor: '#2563EB' },
  ADICIONAR_PATRIMONIO:  { icon: '🏛️', label: 'Adicionou item de patrimônio', cor: '#16A34A' },
  EXCLUIR_PATRIMONIO:    { icon: '🗑️', label: 'Excluiu item de patrimônio',   cor: '#DC2626' },
  TRANSFERIR_PATRIMONIO: { icon: '🔁', label: 'Transferiu patrimônio pra outra loja', cor: '#D97706' },
  CANCELAR_TRANSFERENCIA_PATRIMONIO: { icon: '✖', label: 'Cancelou transferência de patrimônio', cor: '#DC2626' },
  CONFIRMAR_RECEBIMENTO_PATRIMONIO:  { icon: '✅', label: 'Confirmou recebimento de patrimônio',  cor: '#16A34A' },
  TRANSFERIR_MKT: { icon: '🔁', label: 'Transferiu item de marketing pra outra loja', cor: '#D97706' },
  CANCELAR_TRANSFERENCIA_MKT: { icon: '✖', label: 'Cancelou transferência de marketing', cor: '#DC2626' },
  CONFIRMAR_RECEBIMENTO_MKT:  { icon: '✅', label: 'Confirmou recebimento de marketing',  cor: '#16A34A' },
  ENVIAR_MANUTENCAO: { icon: '🔧', label: 'Enviou item pra manutenção', cor: '#2563EB' },
  CONFIRMAR_DEVOLUCAO_MANUTENCAO: { icon: '✅', label: 'Confirmou devolução da manutenção', cor: '#16A34A' },
};

async function _logAuditoriaInv(acao, detalhes){
  try{
    await sb('gn_inv_auditoria',{method:'POST',body:{
      loja: S.lojaAtiva || null, usuario: S.usuario?.nome || 'SISTEMA', acao, detalhes: detalhes || null
    }});
  }catch(e){ console.error('Erro ao registrar auditoria:', e.message||e); }
}

function _fmtDetalhesAuditoriaInv(acao, d){
  if(!d) return '';
  try{
    if(acao==='ENTRADA_ITEM' || acao==='SAIDA_ITEM') return `${d.item||''}${d.quantidade?' — '+d.quantidade+' un.':''}${d.obs?' ('+d.obs+')':''}`;
    if(acao==='EXCLUIR_SAIDA')    return `${d.item||''} — ${d.quantidade||0} un. restaurada(s)`;
    if(acao==='EXCLUIR_ITEM')     return d.item||'';
    if(acao==='EXCLUIR_ITEM_MKT') return d.item||'';
    if(acao==='EDITAR_ITEM')      return `${d.item||''} — qtd ${d.qty_antigo}→${d.qty_novo}`;
    if(acao==='ADICIONAR_PATRIMONIO') return `${d.item||''} — qtd ${d.quantidade||0} (${d.setor||''})`;
    if(acao==='EXCLUIR_PATRIMONIO')   return d.item||'';
    if(acao==='TRANSFERIR_PATRIMONIO')return `${d.item||''} — ${d.quantidade||0} un. para ${d.destino||''}`;
    if(acao==='CANCELAR_TRANSFERENCIA_PATRIMONIO') return `${d.item||''} — ${d.quantidade||0} un.`;
    if(acao==='CONFIRMAR_RECEBIMENTO_PATRIMONIO')  return `${d.item||''} — ${d.quantidade||0} un. de ${d.origem||''}`;
    if(acao==='TRANSFERIR_MKT')return `${d.item||''} — ${d.quantidade||0} un. para ${d.destino||''}`;
    if(acao==='CANCELAR_TRANSFERENCIA_MKT') return `${d.item||''} — ${d.quantidade||0} un.`;
    if(acao==='CONFIRMAR_RECEBIMENTO_MKT')  return `${d.item||''} — ${d.quantidade||0} un. de ${d.origem||''}`;
    if(acao==='ENVIAR_MANUTENCAO') return `${d.item||''} — ${d.quantidade||0} un. para ${d.local||''} (resp: ${d.responsavel||''})`;
    if(acao==='CONFIRMAR_DEVOLUCAO_MANUTENCAO') return `${d.item||''} — ${d.quantidade||0} un. voltou de ${d.local||''}`;
  }catch(e){}
  return '';
}

async function renderAuditoria(c){
  c.innerHTML=`<div class="content"><div style="text-align:center;padding:30px;color:var(--mut);font-size:12px">Carregando...</div></div>`;
  let rows=[];
  try{
    rows=await sb(`gn_inv_auditoria?loja=eq.${encodeURIComponent(S.lojaAtiva||'')}&order=criado_em.desc&limit=150`);
  }catch(e){
    c.innerHTML=`<div class="content"><div style="text-align:center;padding:30px;color:var(--erro);font-size:12px">⚠️ Erro ao carregar auditoria.</div></div>`;
    return;
  }
  const itensHtml = rows.length===0
    ? `<div style="text-align:center;padding:40px;color:var(--mut);font-size:12px">📭 Nenhum registro ainda.</div>`
    : rows.map(r=>{
        const meta=AUD_ACOES_INV[r.acao]||{icon:'•',label:r.acao,cor:'var(--mut)'};
        const dt=new Date(r.criado_em).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
        const det=_fmtDetalhesAuditoriaInv(r.acao,r.detalhes);
        return `<div class="hist-item" style="flex-direction:column;align-items:flex-start;gap:2px">
          <div style="font-size:12px;font-weight:700;color:${meta.cor}">${meta.icon} ${meta.label}</div>
          ${det?`<div style="font-size:11px;color:#1A1D23">${esc(det)}</div>`:''}
          <div style="font-size:10px;color:var(--mut)">👤 ${esc(r.usuario||'—')} · ${dt}</div>
        </div>`;
      }).join('');
  c.innerHTML=`
    <div class="content">
      <div class="form-card" style="padding:0;overflow:hidden">
        <div style="padding:12px 12px 0;display:flex;align-items:center;justify-content:space-between">
          <div style="font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px">📜 Auditoria — Quem fez o quê (${rows.length})</div>
          <button class="hist-del" onclick="renderAuditoria($('app-content'))" title="Atualizar">🔄</button>
        </div>
        ${itensHtml}
      </div>
    </div>`;
}
