// build: força novo deploy pra destravar cache de edge preso na versão anterior (#434)
// Debounce por campo (catalogoId+lojaSlug): oninput dispara a cada tecla digitada,
// então sem coalescer as gravações viravam upserts concorrentes que podiam chegar
// fora de ordem no servidor e sobrescrever o valor final com um dígito intermediário
// (relato: "as atualizações não estão ficando"). Cada entrada guarda também os dados
// da gravação pendente (não só o timer) pra poder forçar o disparo imediato
// (_flushQtdTimersPendentes) se a aba/app for pra segundo plano ou fechar antes dos
// 500ms do debounce — senão a última digitação era perdida sem nunca ser gravada.
const _qtdSaveTimers = {};

function _qtdSaveKey(catalogoId, lojaSlug) { return catalogoId + '|' + lojaSlug; }

async function _executarSalvarQtd(catalogoId, lojaSlug, custo, valor, cxUnd) {
  const qtd = parseFloat(valor) || 0;
  await salvarItem(catalogoId, lojaSlug, qtd, custo || null, cxUnd);
  renderTotalLoja();
  // Atualiza contagem na tab
  document.querySelectorAll('.store-tab').forEach(btn => {
    const slug = btn.getAttribute('onclick')?.match(/'([^']+)'/)?.[1];
    if (!slug) return;
    const n = contarItensLoja(slug);
    const span = btn.querySelector('.contagem');
    if (n > 0) {
      if (span) span.textContent = `(${n})`;
      else btn.innerHTML += `<span class="contagem">(${n})</span>`;
    } else if (span) span.remove();
  });
}

function qtdChanged(catalogoId, lojaSlug, custo, valor, imediato, cxUnd) {
  const key = _qtdSaveKey(catalogoId, lojaSlug);
  if (_qtdSaveTimers[key]) clearTimeout(_qtdSaveTimers[key].timer);
  delete _qtdSaveTimers[key];
  if (imediato) {
    _executarSalvarQtd(catalogoId, lojaSlug, custo, valor, cxUnd);
  } else {
    const timer = setTimeout(() => {
      delete _qtdSaveTimers[key];
      _executarSalvarQtd(catalogoId, lojaSlug, custo, valor, cxUnd);
    }, 500);
    _qtdSaveTimers[key] = { timer, catalogoId, lojaSlug, custo, valor, cxUnd };
  }
}

function _flushQtdTimersPendentes() {
  Object.keys(_qtdSaveTimers).forEach(key => {
    const pend = _qtdSaveTimers[key];
    clearTimeout(pend.timer);
    delete _qtdSaveTimers[key];
    _executarSalvarQtd(pend.catalogoId, pend.lojaSlug, pend.custo, pend.valor, pend.cxUnd);
  });
  // Também tenta reenviar quem já falhou antes (fila offline) — sem isso, um item que
  // caiu na fila só era reenviado no próximo tick de 25s, então minimizar/fechar logo
  // depois de ficar sem internet podia atrasar a sincronização até a próxima abertura.
  if (_ppCount() > 0) flushPendingItems(false);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) _flushQtdTimersPendentes(); });
window.addEventListener('pagehide', _flushQtdTimersPendentes);
window.addEventListener('blur', _flushQtdTimersPendentes);

async function ajustarQtd(catalogoId, lojaSlug, custo, delta) {
  const key = _qtdSaveKey(catalogoId, lojaSlug);
  clearTimeout(_qtdSaveTimers[key]);
  delete _qtdSaveTimers[key];

  const atual = S.pedidoItens[catalogoId]?.[lojaSlug]?.qtd ?? 0;
  const nova = Math.max(0, atual + delta);

  // Atualiza inputs visuais (modo loja e modo todos)
  document.querySelectorAll('.qty-input').forEach(inp => {
    const row = inp.closest('.prod-row');
    if (!row) return;
    const bts = row.querySelectorAll('.qty-btn');
    const onclick = bts[0]?.getAttribute('onclick') || '';
    if (onclick.includes(catalogoId) && onclick.includes(lojaSlug)) inp.value = nova || '';
  });
  document.querySelectorAll('.qty-input-sm').forEach(inp => {
    const row = inp.closest('.todos-loja-row');
    if (!row) return;
    const bts = row.querySelectorAll('.qty-btn-sm');
    const onclick = bts[0]?.getAttribute('onclick') || '';
    if (onclick.includes(catalogoId) && onclick.includes(lojaSlug)) inp.value = nova || '';
  });

  await _executarSalvarQtd(catalogoId, lojaSlug, custo, nova);
}

function nextInput(e, el) {
  if (e.key !== 'Enter' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  e.preventDefault();
  const all = [...document.querySelectorAll('.qty-input,.qty-input-sm')].filter(i => !i.disabled);
  const idx = all.indexOf(el);
  let target = null;
  if (e.key === 'ArrowUp') {
    if (idx > 0) target = all[idx - 1];
  } else {
    if (idx >= 0 && idx < all.length - 1) target = all[idx + 1];
  }
  if (target) {
    target.focus({ preventScroll: true });
    target.select();
    target.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }
}

async function toggleDiverg(catalogoId, lojaSlug) {
  if (!S.pedidoItens[catalogoId]) S.pedidoItens[catalogoId] = {};
  if (!S.pedidoItens[catalogoId][lojaSlug]) S.pedidoItens[catalogoId][lojaSlug] = { id: null, qtd: 0, custo: null, diverg: false };
  const item = S.pedidoItens[catalogoId][lojaSlug];
  const novaDiverg = !item.diverg;

  // Atualizar botões e linhas visualmente (sem re-render completo) — extraído numa função
  // pra poder desfazer visualmente também, se a gravação abaixo falhar.
  const _aplicarVisual = (v) => {
    document.querySelectorAll(`.prod-row[data-cid="${catalogoId}"][data-loja="${lojaSlug}"]`).forEach(row => {
      row.classList.toggle('diverg-ativo', v);
      row.querySelectorAll('.diverg-btn').forEach(btn => btn.classList.toggle('ativo', v));
    });
    document.querySelectorAll('.todos-loja-row').forEach(row => {
      const btn = row.querySelector('.diverg-btn');
      if (!btn) return;
      const onclick = btn.getAttribute('onclick') || '';
      if (onclick.includes(catalogoId) && onclick.includes(lojaSlug)) {
        btn.classList.toggle('ativo', v);
        row.classList.toggle('diverg-ativo', v);
      }
    });
  };
  item.diverg = novaDiverg;
  _aplicarVisual(novaDiverg);

  try {
    if (item.id) {
      const { error } = await db.from('gn_pedido_itens').update({ divergencia: novaDiverg }).eq('id', item.id);
      if (error) throw error;
    } else if (novaDiverg && S.pedidoAtual) {
      // Sem linha no banco ainda — cria com qtd=0 e divergencia=true
      const { data, error } = await db.from('gn_pedido_itens').insert([{
        pedido_id:      S.pedidoAtual.id,
        catalogo_id:    catalogoId,
        loja_slug:      lojaSlug,
        qtd_pedida:     0,
        custo_unitario: null,
        divergencia:    true
      }]).select('id').single();
      if (error) {
        // Conflito de linha única — outra sessão (ex.: a própria loja lançando a
        // quantidade) já criou essa linha nesse meio tempo, com valor real de qtd_pedida.
        // Busca o id existente e só marca a divergência, sem sobrescrever a quantidade.
        const { data: existente, error: e3 } = await db.from('gn_pedido_itens')
          .select('id').eq('pedido_id', S.pedidoAtual.id)
          .eq('catalogo_id', catalogoId).eq('loja_slug', lojaSlug).maybeSingle();
        if (e3 || !existente) throw error;
        const { error: e4 } = await db.from('gn_pedido_itens').update({ divergencia: true }).eq('id', existente.id);
        if (e4) throw e4;
        item.id = existente.id;
      } else if (data) {
        item.id = data.id;
      }
    }
    // novaDiverg=false + sem id: nada a desfazer no banco
  } catch(e) {
    console.error('toggleDiverg:', e.message);
    // A marcação visual já tinha sido aplicada antes da gravação (otimista) — desfaz os
    // dois lados (estado em memória e visual) já que a gravação falhou, senão a tela
    // mostrava "divergência" marcada sem isso persistir em lugar nenhum.
    item.diverg = !novaDiverg;
    _aplicarVisual(!novaDiverg);
    toast('⚠️ Não foi possível salvar a divergência — tente de novo.', 'err');
  }
}

// "Entrega ainda essa semana" — força a data calculada em _confirmarFornecedoresSelecionados()
// pra hoje, do mesmo jeito que ⚡ urgência, mas SEM marcar urgenciaTemplate (que é lido pelo
// app Lojas e mostra um aviso de urgência pro lado da loja — sinal diferente, que não devia
// disparar só porque o comprador não quer que o pedido caia na semana seguinte). Mesmo
// padrão de gravação de toggleDiverg().
async function toggleEntregaSemana(catalogoId, lojaSlug) {
  if (!S.pedidoItens[catalogoId]) S.pedidoItens[catalogoId] = {};
  if (!S.pedidoItens[catalogoId][lojaSlug]) S.pedidoItens[catalogoId][lojaSlug] = { id: null, qtd: 0, custo: null, diverg: false, entregaSemana: false };
  const item = S.pedidoItens[catalogoId][lojaSlug];
  const novoValor = !item.entregaSemana;

  const _aplicarVisual = (v) => {
    document.querySelectorAll(`.prod-row[data-cid="${catalogoId}"][data-loja="${lojaSlug}"] .semana-btn`).forEach(btn => btn.classList.toggle('ativo', v));
    document.querySelectorAll('.todos-loja-row').forEach(row => {
      const btn = row.querySelector('.semana-btn');
      if (!btn) return;
      const onclick = btn.getAttribute('onclick') || '';
      if (onclick.includes(catalogoId) && onclick.includes(lojaSlug)) btn.classList.toggle('ativo', v);
    });
  };
  item.entregaSemana = novoValor;
  _aplicarVisual(novoValor);

  try {
    if (item.id) {
      const { error } = await db.from('gn_pedido_itens').update({ entrega_semana: novoValor }).eq('id', item.id);
      if (error) throw error;
    } else if (novoValor && S.pedidoAtual) {
      const { data, error } = await db.from('gn_pedido_itens').insert([{
        pedido_id: S.pedidoAtual.id, catalogo_id: catalogoId, loja_slug: lojaSlug,
        qtd_pedida: 0, custo_unitario: null, entrega_semana: true
      }]).select('id').single();
      if (error) {
        const { data: existente, error: e3 } = await db.from('gn_pedido_itens')
          .select('id').eq('pedido_id', S.pedidoAtual.id)
          .eq('catalogo_id', catalogoId).eq('loja_slug', lojaSlug).maybeSingle();
        if (e3 || !existente) throw error;
        const { error: e4 } = await db.from('gn_pedido_itens').update({ entrega_semana: true }).eq('id', existente.id);
        if (e4) throw e4;
        item.id = existente.id;
      } else if (data) {
        item.id = data.id;
      }
    }
  } catch(e) {
    console.error('toggleEntregaSemana:', e.message);
    item.entregaSemana = !novoValor;
    _aplicarVisual(!novoValor);
    toast('⚠️ Não foi possível salvar — tente de novo.', 'err');
  }
}

// Salva o "Custo" de um produto direto na lista do Catálogo (modo edição em lote) —
// mesmo mecanismo do salvarUndCxLote, mas pro campo de custo. Registra na auditoria
// pra manter rastro de reajuste de preço (útil pra entender por que o valor previsto
// de uma provisão mudou de uma semana pra outra).
async function salvarCustoLote(id, valor) {
  const custo = parseFloat(String(valor).replace(',','.')) || null;
  const idxAntes = S.catalogo.findIndex(p => p.id === id);
  const custoAntigo = idxAntes >= 0 ? S.catalogo[idxAntes].custo : null;
  if (custo === custoAntigo) return;

  const { error } = await db.from('gn_catalogo')
    .update({ custo, atualizado_em: new Date().toISOString() })
    .eq('id', id);
  if (error) { toast('⚠️ Erro ao salvar: ' + error.message, 'err'); return; }
  const idx = S.catalogo.findIndex(p => p.id === id);
  if (idx >= 0) S.catalogo[idx].custo = custo;
  _logAuditoria('ALTERAR_CUSTO_CATALOGO', { produto: idx>=0?S.catalogo[idx].produto:null, custo_antigo: custoAntigo, custo_novo: custo }, { catalogo_id: id, fornecedor: idx>=0?S.catalogo[idx].fornecedor:null });
}

// ── Importar "Und por Cx" a partir do que já existe no app Lojas ──────────────
// O app Lojas tem um "fator de conversão" próprio (aba Pedido, calculadora de
// Cx/Und) guardado por nome de produto em cada loja — como é o mesmo objeto
// global replicado em todas, basta juntar (merge) o de todas as lojas pra ter o
// conjunto completo. Quando o nome não bate com nenhum fator lá, tenta extrair
// do próprio nome do produto no Catálogo (ex.: "... cx c/ 12 unds" → 12), já que
// muitos produtos já descrevem a caixa no nome. Nada é gravado sem confirmação.
async function _buscarFatoresConversaoLojas() {
  const { data, error } = await db.from('gn_lojas').select('all_data');
  if (error) throw error;
  const merged = {};
  (data || []).forEach(row => {
    const fc = row.all_data && row.all_data.fatoresConversao;
    if (fc && typeof fc === 'object') Object.assign(merged, fc);
  });
  return merged;
}

function _extrairFatorDoNome(nomeOrig) {
  // "3 mil" / "3mil" → 3000, antes de qualquer outro parse.
  const nome = nomeOrig.replace(/(\d+)\s*mil\b/gi, (_, n) => String(parseInt(n, 10) * 1000));
  // Embalagem aninhada — "cx c/ 16 pcts e cada pct com 250 unds" = 16×250, não 16.
  // Sem isso o valor extraído ficava só o número de pacotes, ignorando quantas
  // unidades cada pacote tem (bug real encontrado testando contra o catálogo real).
  const aninhado = nome.match(/(?:c\/|com)\s*(\d+)\s*(?:pcts?|cartelas?|bandejas?)\b[\s\S]{0,25}?(?:c\/|com|de)\s*(\d+)\s*und/i);
  if (aninhado) {
    const n = parseInt(aninhado[1], 10), m = parseInt(aninhado[2], 10);
    if (n > 1 && m > 1) return n * m;
  }
  const m = nome.match(/c\/\s*(\d+)\s*und/i) || nome.match(/cx\s+c\/\s*(\d+)/i);
  if (!m) return null;
  const n = parseInt(m[1], 10);
  return n > 1 ? n : null;
}

async function abrirImportarUndCx() {
  let fatores;
  try {
    toast('Buscando fatores cadastrados no app Lojas...', 'ok');
    fatores = await _buscarFatoresConversaoLojas();
  } catch (e) {
    toast('⚠️ Erro ao buscar do app Lojas: ' + (e.message || e), 'err');
    return;
  }

  const sugestoes = [];
  S.catalogo.filter(p => p.ativo && !p.und_por_caixa).forEach(p => {
    const nomeUp = p.produto.trim().toUpperCase();
    let valor = fatores[nomeUp];
    let fonte = 'app Lojas';
    if (!valor) { valor = _extrairFatorDoNome(p.produto); fonte = 'nome do produto'; }
    if (valor && valor > 1) sugestoes.push({ id: p.id, produto: p.produto, valor, fonte });
  });

  if (!sugestoes.length) {
    toast('Nenhuma sugestão encontrada — os produtos sem Und/Cx não bateram com nenhum fator do app Lojas nem seguem o padrão "cx c/ N und" no nome.', 'err');
    return;
  }

  S._sugestoesUndCx = sugestoes;
  abrirModal(`
    <div class="modal-titulo">📥 Importar Und/Cx
      <button class="modal-close" onclick="$('modal-bg').classList.remove('ativo')">×</button>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:10px">
      ${sugestoes.length} sugestão${sugestoes.length>1?'ões':''} — do app Lojas quando o nome bate, ou lido direto do nome do produto ("cx c/ N und"). Confira antes de aplicar.
    </div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:6px">
      <button class="btn-sm btn-outline" onclick="_toggleTodosSugestoesUndCx(this)" data-marcados="1">Desmarcar todos</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:14px;max-height:50vh;overflow-y:auto">
      ${sugestoes.map((s,i) => `
        <label style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(0,0,0,.04);border-radius:8px;cursor:pointer">
          <input type="checkbox" class="importUndCx-chk" data-idx="${i}" checked style="width:16px;height:16px;flex-shrink:0">
          <span style="flex:1;min-width:0">${s.produto}</span>
          <span style="color:#1A1D23;font-weight:700;white-space:nowrap">${s.valor} und/cx</span>
          <span style="font-size:9px;color:var(--muted);white-space:nowrap">${s.fonte}</span>
        </label>`).join('')}
    </div>
    <div class="modal-acoes">
      <button class="btn-sm btn-success" onclick="_aplicarImportacaoUndCx()">✓ Aplicar Selecionados</button>

  `);

async function _aplicarImportacaoUndCx() {
  const idxs = [...document.querySelectorAll('.importUndCx-chk:checked')].map(chk => parseInt(chk.dataset.idx, 10));
  if (!idxs.length) { toast('Selecione ao menos um produto.', 'err'); return; }
  $('modal-bg').classList.remove('ativo');
  toast('Aplicando...', 'ok');

  let erros = 0;
  for (const i of idxs) {
    const s = S._sugestoesUndCx[i];
    const { error } = await db.from('gn_catalogo')
      .update({ und_por_caixa: s.valor, atualizado_em: new Date().toISOString() })

  toast(erros > 0

// Relatório do Catálogo — reflete exatamente os filtros ativos na tela (grupo/fornecedor/
// busca/inativos), agrupado por grupo. wpp=true usa emoji/negrito pro WhatsApp; PDF fica liso.
function _catalogoRelatorioTexto(wpp) {
  const lista = _catalogoListaFiltrada();
  if (!lista.length) return null;
  const porGrupo = {};
  lista.forEach(p => (porGrupo[p.grupo] = porGrupo[p.grupo] || []).push(p));
  const grupos = Object.keys(porGrupo).sort();
  const filtros = [];
  if (S.catGrupo) filtros.push('Grupo: ' + S.catGrupo);
  if (S.catForn)  filtros.push('Fornecedor: ' + S.catForn);
  if (S.catBusca) filtros.push('Busca: "' + S.catBusca + '"');
  if (S.mostraInativos) filtros.push('incluindo inativos');
  const bullet = wpp ? '•' : '-';
  let msg = `${wpp ? '📦 ' : ''}CATÁLOGO${filtros.length ? ' — ' + filtros.join(' · ') : ''}\n${lista.length} produto${lista.length !== 1 ? 's' : ''}\n`;
  grupos.forEach(grupo => {
    const itens = porGrupo[grupo].slice().sort((a, b) => a.produto.localeCompare(b.produto));
    msg += `\n${wpp ? '🏷️ *' : ''}${grupo}${wpp ? '*' : ''}\n`;
    itens.forEach(p => {
      const custo = p.custo ? ` — R$ ${fmt(p.custo)}` : '';
      const status = p.ativo ? '' : ' (inativo)';
      msg += `  ${bullet} [${p.item_id}] ${p.produto} (${p.und}) · ${p.fornecedor}${custo}${status}\n`;
    });
  });
  return msg;
}

function gerarWppCatalogo() {
  const msg = _catalogoRelatorioTexto(true);
  if (!msg) { toast('Nenhum produto encontrado.', 'err'); return; }
  window.open('https://wa.me/?text=' + encodeURIComponent(msg));
}

function gerarPDFCatalogo() {
  const msg = _catalogoRelatorioTexto(false);

  gerarPDF(msg, 'Catálogo');
}

// Mostra/esconde o campo "UND POR CX" e explica pro setor de Compras o que cada UND
// significa no app Lojas (aba Pedido) — pra evitar o erro de cadastrar um produto tipo
// "Polpa" (KG) e uma loja acabar interpretando a quantidade digitada como se fosse caixa.
// Só CX/BB usam conversão; qualquer outra UND é a quantidade real digitada, sem multiplicar.
function _undPedidoOnChange() {
  const und = ($('m-und')||{}).value;
  const wrap = $('m-undcx-wrap');
  const help = $('m-und-help');
  const isCaixa = und === 'CX' || und === 'BB';
  if (wrap) wrap.style.display = isCaixa ? '' : 'none';
  if (!isCaixa && $('m-undcx')) $('m-undcx').value = '';
  if (help) {
    help.textContent = isCaixa
      ? `Informe quantas unidades tem 1 ${und} — no app Lojas, "1" no campo Pedido vale essa quantidade.`
      : `No app Lojas, o valor digitado é direto em ${und||'—'} (ex.: digitar 6 = 6 ${und||'un.'}), sem conversão.`;
  }
}

async function salvarNovoProduto() {
  const item_id = parseInt($('m-item-id').value);
  const produto  = $('m-produto').value.trim();
  const grupo    = $('m-grupo').value;
  const subgrupo = $('m-subgrupo').value.trim().toUpperCase() || 'GERAL';
  const fornecedor = $('m-forn').value;
  const und      = $('m-und').value;
  const custo    = parseFloat($('m-custo').value) || null;
  const undPorCaixa = (und === 'CX' || und === 'BB') ? (parseFloat($('m-undcx').value) || null) : null;

  if (!produto || !grupo || !item_id) { toast('Preencha código, produto e grupo.','err'); return; }

  const { data, error } = await db.from('gn_catalogo')
    .insert([{ item_id, produto, grupo, subgrupo, fornecedor, und, custo, und_por_caixa: undPorCaixa }]).select().single();

  if (error) { toast('Erro: '+error.message,'err'); return; }
  S.catalogo.push(data);
  S.catalogo.sort((a,b) => a.grupo.localeCompare(b.grupo)||a.produto.localeCompare(b.produto));
  $('modal-bg').classList.remove('ativo');
  toast('Produto adicionado!','ok');
  renderCatalogo();
}

// Histórico de preço de um produto do catálogo — lê os registros que a própria
// alteração de custo (salvarEdicaoProduto/salvarCustoLote) já grava em
// gn_auditoria_pedidos (ALTERAR_CUSTO_CATALOGO). Não é uma tabela nova nem um
// cálculo novo, só uma tela pra ver o que já fica registrado a cada reajuste.
async function abrirHistoricoPreco(id) {
  const p = S.catalogo.find(x => x.id === id);
  if (!p) return;
  abrirModal(`
    <div class="modal-titulo">
      Histórico de preço — ${p.produto}
      <button class="modal-close" onclick="$('modal-bg').classList.remove('ativo')">×</button>
    </div>
    <div id="hist-preco-lista" style="font-size:12px;color:var(--muted)">Carregando...</div>
    <div class="modal-acoes">
      <button class="btn-sm btn-outline" onclick="editarProduto('${id}')">← Voltar</button>
    </div>
  `);
  const el = $('hist-preco-lista');
  try {
    const { data, error } = await db.from('gn_auditoria_pedidos')
      .select('criado_em,usuario,fornecedor,detalhes')
      .eq('catalogo_id', id).eq('acao', 'ALTERAR_CUSTO_CATALOGO')
      .order('criado_em', { ascending: false }).limit(30);
    if (error) throw error;
    if (!data || !data.length) { el.innerHTML = 'Nenhuma alteração de custo registrada ainda pra este produto.'; return; }
    const fmtR = v => v == null ? '—' : 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    el.innerHTML = data.map(r => {
      const dt = new Date(r.criado_em);
      const dtStr = dt.toLocaleDateString('pt-BR') + ' ' + dt.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      const d = r.detalhes || {};
      return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">
        <div><b>${fmtR(d.custo_antigo)} → ${fmtR(d.custo_novo)}</b><div style="font-size:10px;color:var(--muted);margin-top:2px">${r.usuario || '—'}${r.fornecedor ? ' · ' + r.fornecedor : ''}</div></div>
        <div style="font-size:10px;color:var(--muted);white-space:nowrap;margin-left:8px">${dtStr}</div>
      </div>`;
    }).join('');
  } catch (e) {
    el.innerHTML = 'Erro ao carregar histórico.';
  }
}

async function salvarEdicaoProduto(id) {
  const produto  = $('m-produto').value.trim();
  const grupo    = $('m-grupo').value;
  const subgrupo = $('m-subgrupo').value.trim().toUpperCase() || 'GERAL';
  const fornecedor = $('m-forn').value;
  const und      = $('m-und').value;
  const custo    = parseFloat($('m-custo').value) || null;
  const undPorCaixa = (und === 'CX' || und === 'BB') ? (parseFloat($('m-undcx').value) || null) : null;

  if (!produto || !grupo) { toast('Preencha produto e grupo.','err'); return; }

  const idxAntes = S.catalogo.findIndex(p => p.id === id);
  const custoAntigo = idxAntes >= 0 ? S.catalogo[idxAntes].custo : null;

  const { error } = await db.from('gn_catalogo')
    .update({ produto, grupo, subgrupo, fornecedor, und, custo, und_por_caixa: undPorCaixa, atualizado_em: new Date().toISOString() })
    .eq('id', id);

  if (error) { toast('Erro: '+error.message,'err'); return; }
  const idx = S.catalogo.findIndex(p => p.id === id);
  if (idx >= 0) Object.assign(S.catalogo[idx], { produto, grupo, subgrupo, fornecedor, und, custo, und_por_caixa: undPorCaixa });
  if (custo !== custoAntigo) {
    _logAuditoria('ALTERAR_CUSTO_CATALOGO', { produto, custo_antigo: custoAntigo, custo_novo: custo }, { catalogo_id: id, fornecedor });
  }
  $('modal-bg').classList.remove('ativo');
  toast('Produto atualizado!','ok');
  renderCatalogo();
}

async function excluirProduto(id) {
  if (!confirm('Excluir produto do catálogo?\nEle será desativado permanentemente.')) return;
  await db.from('gn_catalogo').update({ ativo: false, atualizado_em: new Date().toISOString() }).eq('id', id);
  const idx = S.catalogo.findIndex(p => p.id === id);
  if (idx >= 0) S.catalogo[idx].ativo = false;
  $('modal-bg').classList.remove('ativo');
  toast('Produto excluído.','ok');
  renderCatalogo();
}

async function toggleDia(fornId, dia) {
  const idx = S.fornecedores.findIndex(f => f.id === fornId);
  if (idx < 0) return;
  const f = S.fornecedores[idx];
  const dias = [...(f.dias_entrega || [])];
  const pos = dias.indexOf(dia);
  if (pos >= 0) dias.splice(pos, 1);
  else dias.push(dia);

  S.fornecedores[idx].dias_entrega = dias;
  await db.from('gn_fornecedores_pedido')
    .update({ dias_entrega: dias, atualizado_em: new Date().toISOString() }).eq('id', fornId);

  // Atualiza só o botão
  const el = document.querySelector(`#forn-${fornId} .dias-grid`);
  if (el) {
    el.querySelectorAll('.dia-btn').forEach(btn => {
      const d = btn.textContent.trim();
      btn.classList.toggle('on', dias.includes(d));
    });
    const info = document.querySelector(`#forn-${fornId} .forn-item-header div:last-child`);
    if (info) info.textContent = dias.length>0?dias.join(', '):'Sem dias';
  }
}

async function salvarFornecedor(fornId) {
  const contato = $(`contato-${fornId}`)?.value.trim() || null;
  const obs     = $(`obs-${fornId}`)?.value.trim() || null;
  const dias    = S.fornecedores.find(f=>f.id===fornId)?.dias_entrega || [];

  const minRaw = $(`prazomin-${fornId}`)?.value.trim() || '';
  const maxRaw = $(`prazomax-${fornId}`)?.value.trim() || '';
  let prazoMin = minRaw === '' ? null : parseInt(minRaw, 10);
  let prazoMax = maxRaw === '' ? null : parseInt(maxRaw, 10);
  if (prazoMax != null && prazoMin == null) { prazoMin = prazoMax; }
  if (prazoMin != null && prazoMax != null && prazoMax < prazoMin) {
    toast('O prazo máximo não pode ser menor que o mínimo.', 'err'); return;
  }

  await db.from('gn_fornecedores_pedido')
    .update({
      contato, observacao: obs, dias_entrega: dias,
      prazo_dias_min: prazoMin, prazo_dias_max: prazoMax,
      atualizado_em: new Date().toISOString()
    })
    .eq('id', fornId);

  const idx = S.fornecedores.findIndex(f=>f.id===fornId);
  if (idx>=0) Object.assign(S.fornecedores[idx], { contato, observacao: obs, prazo_dias_min: prazoMin, prazo_dias_max: prazoMax });
  toast('Fornecedor salvo!','ok');
  renderFornecedores();
}

// situação de cada item abrindo o card.
function _provStatusBadges(itens) {
  const defs = [
    ['AGUARDANDO', '⏳', 'a receber', '#e8850a'],
    ['RECEBIDO_OK', '✅', 'recebido', '#1f9d55'],
    ['DIVERGENCIA', '⚠️', 'divergência', '#e8850a'],
    ['DEVOLVIDO', '↩️', 'devolvido', '#7c3aed'],
    ['CANCELADO', '🗑️', 'cancelado', '#94a3b8'],
  ];
  return defs.map(([st, ic, lbl, cor]) => {
    const n = itens.filter(p => p.status === st).length;
    if (!n) return '';
    return `<span style="font-size:9px;font-weight:800;color:${cor};background:${cor}1a;border-radius:20px;padding:2px 7px;white-space:nowrap">${ic} ${n} ${lbl}</span>`;
  }).filter(Boolean).join('');
}

async function renderProvisoes() {
  $('content').innerHTML = '<div class="empty"><div class="spin"></div></div>';
  await Promise.all([carregarProvisoes(), carregarProvisoesPendentes()]);

  const lojas = [{ slug_pedido:'', nome_display:'Todas as lojas' }, ...S.lojas];
  const lojaTabs = lojas.map(l =>
    `<button class="store-tab${S.provLoja===l.slug_pedido?' ativo':''}"
      onclick="filtrarProvisao('${l.slug_pedido}')">${l.nome_display}</button>`
  ).join('');

  // Filtro de status
  const STATUS_OPTS = [
    {v:'',l:'Todas'},
    {v:'AGUARDANDO',l:'Aguardando'},
    {v:'RECEBIDO_OK',l:'Recebido ✓'},
    {v:'DIVERGENCIA',l:'Divergência'},
    {v:'DEVOLVIDO',l:'Devolvido'},
    {v:'CANCELADO',l:'Cancelado'},
  ];
  const statusChips = STATUS_OPTS.map(o=>
    `<button class="store-tab${S.provStatus===o.v?' ativo':''}" onclick="S.provStatus='${o.v}';renderProvisoes()">${o.l}</button>`
  ).join('');

  // Filtro de comprador — pra ver (e gerar relatório) só do que Edu, Oseas ou Matheus
  // pediu, igual à confirmação já ser separada por aba neles.
  const COMPRADOR_OPTS = [
    {v:'',l:'Todos'},
    {v:'edu',l:'👤 Edu'},
    {v:'oseas',l:'👤 Oseas'},
    {v:'matheus',l:'👤 Matheus'},
  ];
  const compradorChips = COMPRADOR_OPTS.map(o=>
    `<button class="store-tab${S.provComprador===o.v?' ativo':''}" onclick="S.provComprador='${o.v}';renderProvisoes()">${o.l}</button>`
  ).join('');

  const lojaLabelAtual = S.provLoja ? (S.lojas.find(l=>l.slug_pedido===S.provLoja)?.nome_display||S.provLoja) : 'Todas as Lojas';

  // Filtrar e agrupar por fornecedor
  const provisoesFilt = (S.provStatus ? S.provisoes.filter(p=>p.status===S.provStatus) : S.provisoes)
    .filter(p => _fornecedorNoEscopoComprador(p.fornecedor));
  const por_forn = {};
  provisoesFilt.forEach(p => {
    const forn = p.fornecedor || 'SEM FORNECEDOR';
    if (!por_forn[forn]) por_forn[forn] = [];
    por_forn[forn].push(p);
  });

  const totalValor = provisoesFilt.reduce((a,p) => a + (parseFloat(p.valor_previsto)||0), 0);

  // Campo pra digitar o fornecedor (ou, em "Todas as lojas", a loja) e pular direto pro
  // grupo — mesmo mecanismo já usado na aba Entrega do app Lojas, útil aqui porque com
  // muitos fornecedores/lojas (ordem alfabética) rolar a tela até achar o certo era o
  // principal atrito.
  const fornsProv = Object.keys(por_forn).sort((a,b) => a.localeCompare(b));
  const fornBuscaHtml = (S.provLoja && fornsProv.length > 1) ? `
    <div style="margin-bottom:10px">
      <input list="prov-forn-datalist" id="prov-forn-jump" placeholder="🔍 Digite o fornecedor pra pular direto..." autocomplete="off"
        oninput="pularParaFornecedorProvisao(this.value)"
        style="width:100%;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:9px 10px;font-size:12px;font-weight:600;box-sizing:border-box">
      <datalist id="prov-forn-datalist">${fornsProv.map(f=>`<option value="${escapeHtml(f)}">`).join('')}</datalist>
    </div>` : '';
  const lojasComProvisao = [...new Set(provisoesFilt.map(p=>p.loja_slug||''))]
    .map(slug => S.lojas.find(l=>l.slug_pedido===slug)?.nome_display || slug || 'SEM LOJA')
    .sort((a,b) => a.localeCompare(b));
  const lojaBuscaHtml = (!S.provLoja && lojasComProvisao.length > 1) ? `
    <div style="margin-bottom:10px">
      <input list="prov-loja-datalist" id="prov-loja-jump" placeholder="🔍 Digite a loja pra pular direto..." autocomplete="off"
        oninput="pularParaLojaProvisao(this.value)"
        style="width:100%;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:9px 10px;font-size:12px;font-weight:600;box-sizing:border-box">
      <datalist id="prov-loja-datalist">${lojasComProvisao.map(l=>`<option value="${escapeHtml(l)}">`).join('')}</datalist>
    </div>` : '';

  const provHtml = Object.keys(por_forn).length === 0
    ? `<div class="empty"><div class="empty-icon">📬</div><div class="empty-texto">${S.provStatus?'Nenhuma provisão com esse status':'Nenhuma provisão encontrada'}</div></div>`
    : S.provLoja
      // Loja já filtrada pelas abas acima — mantém o agrupamento simples por fornecedor.
      ? Object.entries(por_forn).sort(([a],[b])=>a.localeCompare(b))
          .map(([forn, itens]) => _provFornGrupoHtml(forn, itens, 'prov_forn_'+forn.replace(/[^a-z0-9]/gi,'_'), false))
          .join('')
      // "Todas as lojas" — agrupa por loja primeiro (cada card fechado mostra o resumo de
      // status), e por fornecedor dentro de cada loja.
      : (() => {
          const porLoja = {};
          provisoesFilt.forEach(p => { const l=p.loja_slug||''; (porLoja[l]=porLoja[l]||[]).push(p); });
          const ordemLojas = S.lojas.map(l=>l.slug_pedido);
          return Object.keys(porLoja)
            .sort((a,b) => {
              const ia=ordemLojas.indexOf(a), ib=ordemLojas.indexOf(b);
              if (ia===-1 && ib===-1) return a.localeCompare(b);

async function filtrarProvisao(loja) {
  S.provLoja = loja;
  await renderProvisoes();
}

async function _navegarSemanaProvisao(delta) {
  const nova = datePlusWeeks(S.provSemana || getMondayOfWeek(), delta);
  if (nova > getMondayOfWeek()) return;
  S.provSemana = nova;
  await renderProvisoes();
}

// Filtro de comprador da TELA de Provisões (S.provComprador) — independente da aba
// Edu/Oseas/Matheus ativa (S.eduAtivo etc.), já que dá pra chegar em Provisões por fora
// dessas abas (sidebar) e o filtro continua valendo.
function _fornecedorNoEscopoComprador(forn) {
  if (S.provComprador === 'edu') return EDU_FORNECEDORES.includes(forn);
  if (S.provComprador === 'oseas') return OSEAS_FORNECEDORES.includes(forn);
  if (S.provComprador === 'matheus') return _ehFornecedorMatheus(forn);
  return true;
}
// Nome do comprador filtrado na tela de Provisões, pros títulos dos relatórios — null
// quando o filtro está em "Todos".
function _compradorAtualLabel() {
  if (S.provComprador === 'edu') return 'Edu';
  if (S.provComprador === 'oseas') return 'Oseas';
  if (S.provComprador === 'matheus') return 'Matheus';
  return null;
}

// Provisões dentro do escopo de comprador ativo na tela (Todos/Edu/Oseas/Matheus) — mesmo
// filtro usado na lista, aplicado também nos relatórios (geral e por fornecedor).
function _provisoesEscopoComprador() {
  return S.provComprador ? S.provisoes.filter(p => _fornecedorNoEscopoComprador(p.fornecedor)) : S.provisoes;
}

// Soma pedidos repetidos do mesmo produto na mesma loja/fornecedor (ex.: 2ª rodada de
// pedido na mesma semana) numa linha só nos relatórios, em vez de listar duas entradas
// separadas (ex.: pediu 20, depois mais 20 → aparece 40, não "20" e "20"). Se as rodadas
// somadas têm status diferentes, o total fica como AGUARDANDO — só marca como recebido
// quando TODAS as rodadas confirmarem.
function _agruparPorProdutoLoja(itens) {
  const out = [];
  itens.forEach(p => {
    const existente = out.find(e => e.catalogo_id === p.catalogo_id && e.loja_slug === p.loja_slug && e.fornecedor === p.fornecedor);
    if (existente) {
      existente.qtd_prevista = (parseFloat(existente.qtd_prevista) || 0) + (parseFloat(p.qtd_prevista) || 0);
      existente.valor_previsto = (parseFloat(existente.valor_previsto) || 0) + (parseFloat(p.valor_previsto) || 0);
      if (existente.status !== p.status) existente.status = 'AGUARDANDO';
    } else {
      out.push({ ...p });
    }
  });
  return out;
}

function gerarWppProvisoes() {
  const escopo = _agruparPorProdutoLoja(_provisoesEscopoComprador());
  if (!escopo.length) { toast('Nenhuma provisão para enviar.', 'err'); return; }
  const porForn = {};
  escopo.forEach(p => {
    const f = p.fornecedor || 'SEM FORNECEDOR';
    (porForn[f] = porForn[f] || []).push(p);
  });
  const fns = Object.keys(porForn).sort();
  const lojaLabel = S.provLoja
    ? (S.lojas.find(l => l.slug_pedido === S.provLoja)?.nome_display || S.provLoja)
    : 'Todas as lojas';
  const compradorLabel = _compradorAtualLabel() ? ' · ' + _compradorAtualLabel() : '';
  // Quando o relatório abrange mais de uma loja (nenhuma loja específica selecionada nos
  // chips), agrupa os itens de cada fornecedor por loja em vez de listar tudo misturado —
  // é justamente essa mistura que dificultava ler o relatório de um comprador (Edu/Oseas/
  // Matheus) com várias lojas de uma vez.
  const porLoja = !S.provLoja;
  let msg = `📦 *PROVISÕES — ${lojaLabel}${compradorLabel}*\n`;
  let total = 0;
  fns.forEach(forn => {
    const itens = porForn[forn];
    const totF = itens.reduce((a, p) => a + (parseFloat(p.valor_previsto) || 0), 0);
    msg += `\n🏭 *${forn}* — R$ ${fmt(totF)}\n`;
    if (porLoja) {
      const porLojaMap = {};
      itens.forEach(p => {
        const lojaNome = S.lojas.find(l => l.slug_pedido === p.loja_slug)?.nome_display || p.loja_slug;
        (porLojaMap[lojaNome] = porLojaMap[lojaNome] || []).push(p);
      });
      Object.entries(porLojaMap).sort(([a],[b]) => a.localeCompare(b)).forEach(([lojaNome, itensLoja]) => {
        const subLoja = itensLoja.reduce((a,p)=>a+(parseFloat(p.valor_previsto)||0),0);
        msg += `  📍 *${lojaNome}* — R$ ${fmt(subLoja)}\n`;
        itensLoja.forEach(p => {
          const icon = p.status === 'RECEBIDO_OK' ? '✅' : p.status === 'DIVERGENCIA' ? '⚠️' : p.status === 'DEVOLVIDO' ? '↩️' : '⏳';
          const dt = p.data_entrega ? ` (${p.data_entrega})` : '';
          msg += `    ${icon} ${p.gn_catalogo?.produto || '—'}: ${fmtQtd(p.qtd_prevista)} ${p.gn_catalogo?.und || ''} R$ ${fmt(p.valor_previsto)}${dt}\n`;
          total += parseFloat(p.valor_previsto) || 0;
        });
      });
    } else {
      itens.forEach(p => {
        const lojaNome = S.lojas.find(l => l.slug_pedido === p.loja_slug)?.nome_display || p.loja_slug;
        const icon = p.status === 'RECEBIDO_OK' ? '✅' : p.status === 'DIVERGENCIA' ? '⚠️' : p.status === 'DEVOLVIDO' ? '↩️' : '⏳';
        const dt = p.data_entrega ? ` (${p.data_entrega})` : '';
        msg += `  ${icon} ${lojaNome} — ${p.gn_catalogo?.produto || '—'}: ${fmtQtd(p.qtd_prevista)} ${p.gn_catalogo?.und || ''} R$ ${fmt(p.valor_previsto)}${dt}\n`;
        total += parseFloat(p.valor_previsto) || 0;
      });
    }
  });
  msg += `\n💰 *Total: R$ ${fmt(total)}*`;
  window.open('https://wa.me/?text=' + encodeURIComponent(msg));
}

function gerarWppPedidoForn(fornecedor) {
  if (!S.pedidoAtual) { toast('Nenhum pedido ativo.', 'err'); return; }
  const sem = formatarSemana(S.semanaAtiva);
  const titulo = S.todosModo ? 'TODAS AS LOJAS' : (S.lojas.find(l=>l.slug_pedido===S.lojaAtiva)?.nome_display||S.lojaAtiva);
  const itens = [];
  S.catalogo.filter(p=>p.ativo&&p.fornecedor===fornecedor).forEach(prod=>{
    if (S.todosModo) {
      S.lojas.forEach(loja=>{
        const qtd=S.pedidoItens[prod.id]?.[loja.slug_pedido]?.qtd||0;
        if(qtd>0) itens.push({produto:prod.produto,und:prod.und,custo:prod.custo||0,loja:loja.nome_display,qtd});
      });
    } else {
      const qtd=S.pedidoItens[prod.id]?.[S.lojaAtiva]?.qtd||0;
      if(qtd>0) itens.push({produto:prod.produto,und:prod.und,custo:prod.custo||0,qtd});
    }
  });
  if(!itens.length){toast('Nenhum item deste fornecedor no pedido.','err');return;}
  let msg=`🛒 *PEDIDO — ${fornecedor}*\nSemana ${sem.num}/${sem.ano} (${sem.periodo})\n📍 ${titulo}\n━━━━━━━━━━━━━━━━━━\n`;
  let total=0;
  if(S.todosModo){
    const lojaMap={};
    itens.forEach(i=>(lojaMap[i.loja]=lojaMap[i.loja]||[]).push(i));
    Object.entries(lojaMap).sort(([a],[b])=>a.localeCompare(b)).forEach(([lojaNome,items])=>{
      msg+=`📍 ${lojaNome}\n`;
      items.forEach(i=>{const sub=i.custo>0?` — R$ ${fmt(i.qtd*i.custo)}`:'';msg+=`  • ${i.produto}: ${fmtQtd(i.qtd)} ${i.und}${sub}\n`;total+=i.qtd*i.custo;});
    });
  } else {
    itens.forEach(i=>{const sub=i.custo>0?` — R$ ${fmt(i.qtd*i.custo)}`:'';msg+=`  • ${i.produto}: ${fmtQtd(i.qtd)} ${i.und}${sub}\n`;total+=i.qtd*i.custo;});
  }
  if(total>0) msg+=`\n💰 Total: *R$ ${fmt(total)}*`;
  window.open('https://wa.me/?text='+encodeURIComponent(msg));
}

// ── Relatório para fornecedor — SEMPRE todas as lojas ──────────────────
function _buildRelatorioFornAllLojas(fornecedor) {
  // Retorna { porForn, totalGeral } com dados de todas as lojas
  const porForn = {};
  // Sem fornecedor específico ("Pedido Completo"), respeita o escopo da aba
  // Edu/Oseas/Matheus ativa — mesma regra usada na listagem de itens.
  const prods = fornecedor
    ? S.catalogo.filter(p => p.ativo && p.fornecedor === fornecedor)
    : S.catalogo.filter(p => p.ativo && _fornecedorNoEscopoAtivo(p.fornecedor));
  prods.forEach(prod => {
    S.lojas.forEach(loja => {
      const qtd = S.pedidoItens[prod.id]?.[loja.slug_pedido]?.qtd || 0;
      if (qtd <= 0) return;
      (porForn[prod.fornecedor] = porForn[prod.fornecedor] || []).push({
        produto: prod.produto, und: prod.und, custo: prod.custo || 0,
        loja: loja.nome_display, qtd
      });
    });
  });
  return porForn;
}

function gerarWppFornAllLojas(fornecedor) {

  const sem = formatarSemana(S.semanaAtiva);

  const fns = Object.keys(porForn).sort();
  if (!fns.length) { toast('Nenhum item no pedido.', 'err'); return; }

  const cabecalho = fornecedor

// Converte um texto simples num PDF de verdade (multi-página, fonte monoespaçada),
// usando jsPDF — necessário pra ter um arquivo real pra anexar no WhatsApp (o botão
// de PDF "normal" só abre a janela de impressão do navegador, sem gerar um Blob).
function _textoParaPdfBlob(texto, titulo){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const marginX=40, topo=56, lineHeight=13;
  const pageHeight=doc.internal.pageSize.getHeight();
  const maxWidth=doc.internal.pageSize.getWidth()-marginX*2;
  doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text(titulo, marginX, 36);
  doc.setFont('courier','normal'); doc.setFontSize(9);
  let y=topo;
  texto.split('\n').forEach(linha=>{
    const partes=doc.splitTextToSize(linha||' ', maxWidth);
    partes.forEach(p=>{
      if(y>pageHeight-40){ doc.addPage(); y=40; }
      doc.text(p, marginX, y);
      y+=lineHeight;
    });
  });
  return doc.output('blob');
}

// Gera o PDF (a partir de msg/titulo) e abre o compartilhamento nativo do dispositivo
// pra enviar direto pelo WhatsApp. Sem suporte a compartilhar arquivo (ex.: desktop),
// baixa o PDF e abre o WhatsApp com um texto pra anexar manualmente. Compartilhado por
// todos os botões "PDF no Whats" da aba Pedido (geral e por fornecedor).
async function _compartilharPdfWpp(msg, titulo){
  try{
    const blob=_textoParaPdfBlob(msg, titulo);
    const file=new File([blob], titulo.replace(/\s+/g,'_')+'.pdf', { type:'application/pdf' });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:titulo, text:titulo });
      return;
    }
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=file.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 10000);
    toast('📄 PDF baixado — anexe no WhatsApp manualmente.');
    window.open('https://wa.me/?text='+encodeURIComponent(titulo));
  }catch(e){
    if(e && e.name==='AbortError') return; // usuário cancelou o share sheet
    toast('⚠️ Erro ao gerar PDF: '+(e.message||e), 'err');
  }
}

    const totF=itens.reduce((a,p)=>a+(parseFloat(p.valor_previsto)||0),0);
    msg+=`\n${forn} — R$ ${fmt(totF)}\n`;
    if (porLoja) {
      const porLojaMap = {};
      itens.forEach(p => {
        const lojaNome = S.lojas.find(l => l.slug_pedido === p.loja_slug)?.nome_display || p.loja_slug;
        (porLojaMap[lojaNome] = porLojaMap[lojaNome] || []).push(p);
      });
      Object.entries(porLojaMap).sort(([a],[b]) => a.localeCompare(b)).forEach(([lojaNome, itensLoja]) => {
        const subLoja = itensLoja.reduce((a,p)=>a+(parseFloat(p.valor_previsto)||0),0);
        msg += `  ${lojaNome} — R$ ${fmt(subLoja)}\n`;
        itensLoja.forEach(p => {
          const icon = p.status === 'RECEBIDO_OK' ? '✅' : p.status === 'DIVERGENCIA' ? '⚠️' : p.status === 'DEVOLVIDO' ? '↩️' : '⏳';
          const dt = p.data_entrega ? ` (${p.data_entrega})` : '';
          msg += `    ${icon} ${p.gn_catalogo?.produto || '—'}: ${fmtQtd(p.qtd_prevista)} ${p.gn_catalogo?.und || ''} R$ ${fmt(p.valor_previsto)}${dt}\n`;
          total += parseFloat(p.valor_previsto) || 0;
        });
      });
    } else {
      itens.forEach(p=>{
        const lojaNome=S.lojas.find(l=>l.slug_pedido===p.loja_slug)?.nome_display||p.loja_slug;
        const icon=p.status==='RECEBIDO_OK'?'✅':p.status==='DIVERGENCIA'?'⚠️':p.status==='DEVOLVIDO'?'↩️':'⏳';
        const dt=p.data_entrega?` (${p.data_entrega})`:'';
        msg+=`  ${icon} ${lojaNome} — ${p.gn_catalogo?.produto||'—'}: ${fmtQtd(p.qtd_prevista)} ${p.gn_catalogo?.und||''} R$ ${fmt(p.valor_previsto)}${dt}\n`;
        total+=parseFloat(p.valor_previsto)||0;
      });
    }
  });
  msg+=`\nTotal: R$ ${fmt(total)}`;
  gerarPDF(msg,`Provisões — ${lojaLabel}`);
}

  const ini = $('m-ent-ini')?.value || null;

    .update({ data_entrega: ini, data_entrega_fim: fim, atualizado_em: new Date().toISOString() })

async function carregarProvisoesPendentes() {
  // Busca por data_entrega (início) < hoje — quando há período (data_entrega_fim), o
  // prazo real só vence no fim, então filtra de novo no cliente com a data efetiva.
  const data = await _fetchTodasPaginas(() => db.from('gn_provisoes')
    .select('*, gn_catalogo(produto,und)')
    .eq('status', 'AGUARDANDO')
    .not('data_entrega', 'is', null)
    .lt('data_entrega', hoje())
    .order('data_entrega').order('id'));
  const h = hoje();
  S.provisoesAtrasadas = (data || []).filter(p => (p.data_entrega_fim || p.data_entrega) < h);
  _atualizarBadgeAtrasadas();
}

function _atualizarBadgeAtrasadas() {
  const btn = document.querySelector('[data-tab="provisoes"]');
  if (!btn) return;
  const n = S.provisoesAtrasadas.length;
  let badge = btn.querySelector('.badge-atrasadas');
  if (n > 0) {
    if (!badge) {
      badge = document.createElement('span');
      badge.className = 'badge-atrasadas';
      badge.style.cssText = 'position:absolute;top:4px;right:calc(50% - 16px);background:#ef4444;color:#fff;border-radius:20px;font-size:8px;font-weight:800;padding:1px 5px;min-width:14px;text-align:center;pointer-events:none';
      btn.style.position = 'relative';
      btn.appendChild(badge);
    }
    badge.textContent = n;
  } else if (badge) {
    badge.remove();
  }
}

function gerarMsgAlertaEntregaPedidos() {
  const at = S.provisoesAtrasadas;
  if (!at.length) return '';
  const dt = new Date().toLocaleDateString('pt-BR')+' '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const porLoja = {};
  at.forEach(p => {
    const nome = S.lojas.find(l => l.slug_pedido === p.loja_slug)?.nome_display || p.loja_slug;
    (porLoja[nome] = porLoja[nome] || []).push(p);
  });
  let msg = `🚨 *ENTREGAS ATRASADAS*\n📅 ${dt}\n\n⏰ *Provisões sem confirmação (prazo vencido):*\n`;
  Object.entries(porLoja).sort(([a],[b])=>a.localeCompare(b)).forEach(([nome, itens]) => {
    msg += `\n📍 *${nome}*\n`;
    itens.forEach(p => {
      msg += `  ▪️ ${p.fornecedor||'—'} — ${p.gn_catalogo?.produto||'—'}: ${fmtQtd(p.qtd_prevista)} ${p.gn_catalogo?.und||''} (previsto: ${p.data_entrega})\n`;
    });
  });
  msg += `\n⚠️ *${at.length} entrega${at.length>1?'s':''} atrasada${at.length>1?'s':''}. Verificar urgentemente!*`;
  return msg;
}

async function confirmarEntrega(provisaoId) {
  const qtdRec = parseFloat($('m-qtd-rec').value) || 0;
  const valRec = parseFloat($('m-val-rec').value) || 0;
  const obs    = $('m-obs-rec').value.trim() || null;
  const recebidoPor = ($('m-recebido-por')?.value || '').trim() || (() => {
    try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null')?.nome || 'SISTEMA'; } catch(e) { return 'SISTEMA'; }
  })();
  const prov   = S.provisoes.find(p => p.id === provisaoId);

  const qtdPrev = parseFloat(prov?.qtd_prevista) || 0;
  const diff    = qtdRec - qtdPrev;
  const status  = Math.abs(diff) < 0.01 ? 'RECEBIDO_OK' : 'DIVERGENCIA';

  // Salva recebimento — checa o erro (nem sempre o insert lança, pode só retornar
  // {error} no PostgREST), senão o toast de sucesso aparecia mesmo quando a gravação
  // falhou de verdade (RLS, rede instável etc.), igual ao já corrigido no lote
  // (confirmarEntregasEmLotePorLoja).
  try {
    // Reivindica a provisão primeiro, com update condicional (só avança se ainda estiver
    // AGUARDANDO) — se duas pessoas confirmarem a mesma entrega quase junto (duas sessões
    // vendo a mesma provisão pendente), só quem "ganhar" essa atualização segue pro insert,
    // evitando dois gn_recebimentos pra mesma entrega (já aconteceu com fornecedor, do
    // outro lado do fluxo — ver PR de _confirmarFornecedoresSelecionados).
    const { data: claim, error: eClaim } = await db.from('gn_provisoes')
      .update({ status, atualizado_em: new Date().toISOString() })
      .eq('id', provisaoId).eq('status', 'AGUARDANDO')
      .select('id');
    if (eClaim) throw eClaim;
    if (!claim || claim.length === 0) {
      toast('⚠️ Essa entrega já foi confirmada — provavelmente em outra sessão/aparelho. Atualize a tela.', 'err');
      $('modal-bg').classList.remove('ativo');
      await renderProvisoes();
      return;
    }

    const { error: e1 } = await db.from('gn_recebimentos').insert([{
      provisao_id: provisaoId,
      qtd_recebida: qtdRec,
      valor_recebido: valRec,
      diferenca_qtd: diff,
      observacao: obs,
      validado_por: recebidoPor
    }]);
    if (e1) {
      // reverte a provisão pra não ficar marcada como recebida sem nenhum registro
      await db.from('gn_provisoes').update({ status: 'AGUARDANDO' }).eq('id', provisaoId);
      throw e1;
    }
  } catch(e) {
    toast('⚠️ Erro ao confirmar entrega: ' + (e.message || e), 'err');
    return;
  }

  $('modal-bg').classList.remove('ativo');
  toast(status === 'RECEBIDO_OK' ? '✓ Entrega confirmada!' : '⚠ Divergência registrada.', status==='RECEBIDO_OK'?'ok':'err');
  await renderProvisoes();
}

// Confirma de uma vez todas as entregas pendentes de uma data, assumindo que qtd e valor
// recebidos bateram exatamente com o previsto — pra quando a entrega toda chegou certinha
// e não faz sentido abrir o modal item por item. Item que veio diferente do previsto
// continua precisando ser validado individualmente (clicando nele), sem passar por aqui.
async function confirmarEntregasEmLotePorLoja(lojaSlug) {
  const itens = S.entregasPendentes.filter(p => (p.loja_slug || '') === lojaSlug);
  if (!itens.length) return;

  const lojaDisplay = S.lojas.find(l=>l.slug_pedido===lojaSlug)?.nome_display || lojaSlug || 'SEM LOJA';
  const total = itens.reduce((a,p) => a+(parseFloat(p.valor_previsto)||0), 0);
  if (!confirm(`Confirmar TODAS as ${itens.length} entregas pendentes de ${lojaDisplay} como recebidas certinho (qtd e valor exatamente como previsto)?\n\nTotal: R$ ${fmt(total)}\n\nSe algum item veio diferente do previsto, valide ele individualmente em vez de usar este botão.`)) return;

  let recebidoPor = 'SISTEMA';
  try { recebidoPor = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null')?.nome || 'SISTEMA'; } catch(e) {}

  let erros = 0, jaConfirmados = 0;
  for (const p of itens) {
    try {
      // Mesmo update condicional de confirmarEntrega() — reivindica a provisão antes de
      // inserir o recebimento, pra não duplicar se outra sessão já confirmou esse item.
      const { data: claim, error: eClaim } = await db.from('gn_provisoes')
        .update({ status: 'RECEBIDO_OK', atualizado_em: new Date().toISOString() })
        .eq('id', p.id).eq('status', 'AGUARDANDO')
        .select('id');
      if (eClaim) throw eClaim;
      if (!claim || claim.length === 0) { jaConfirmados++; continue; }

      const { error: e1 } = await db.from('gn_recebimentos').insert([{
        provisao_id: p.id,
        qtd_recebida: p.qtd_prevista,
        valor_recebido: p.valor_previsto,
        diferenca_qtd: 0,
        observacao: null,
        validado_por: recebidoPor
      }]);
      if (e1) {
        await db.from('gn_provisoes').update({ status: 'AGUARDANDO' }).eq('id', p.id);
        throw e1;
      }
    } catch (e) { erros++; console.error('Erro ao confirmar em lote:', p.id, e.message||e); }
  }

  const confirmados = itens.length - erros - jaConfirmados;
  toast(erros > 0
    ? `Confirmado com ${erros} erro(s) de ${itens.length}. Verifique o console.`
    : jaConfirmados > 0
      ? `✓ ${confirmados} entrega${confirmados>1?'s':''} confirmada${confirmados>1?'s':''}! ${jaConfirmados} já ${jaConfirmados>1?'estavam':'estava'} confirmada${jaConfirmados>1?'s':''} (outra sessão).`
      : `✓ ${itens.length} entrega${itens.length>1?'s':''} confirmada${itens.length>1?'s':''}!`, erros>0?'err':'ok');
  _logAuditoria('CONFIRMAR_ENTREGA_LOTE', { loja: lojaSlug, itens: confirmados, valor_total: total }, {});
  await renderEntrega();
}

// ═══════════════════════════════════════════════
// RENDER: ENTREGA (pendentes + confirmados semana)
// ═══════════════════════════════════════════════
async function renderEntrega() {
  $('content').innerHTML = '<div class="empty"><div class="spin"></div></div>';
  await Promise.all([carregarEntregasPendentes(), carregarEntregasConfirmadas()]);

  // ── Seção pendentes ──
  let htmlPendentes = '';
  if (S.entregasPendentes.length === 0) {
    htmlPendentes = `<div class="empty" style="padding:20px 0">
      <div class="empty-icon">✅</div>
      <div class="empty-texto">Nenhuma entrega pendente!</div>
    </div>`;
  } else {
    // Agrupado por loja (não mais por data) — dentro de cada loja os itens já vêm
    // ordenados por data de entrega (mais próxima primeiro), e como um Map preserva a
    // ordem de inserção, a primeira loja encontrada na varredura já é a com a entrega
    // mais próxima, então os cards saem naturalmente na ordem certa sem sort extra.
    const porLoja = new Map();
    [...S.entregasPendentes].sort((a,b)=>(a.data_entrega||'9999').localeCompare(b.data_entrega||'9999')).forEach(p => {
      const slug = p.loja_slug || '';
      if (!porLoja.has(slug)) porLoja.set(slug, []);
      porLoja.get(slug).push(p);
    });
    htmlPendentes = [...porLoja.entries()].map(([lojaSlug, itens]) => {
      const lojaDisplay = S.lojas.find(l=>l.slug_pedido===lojaSlug)?.nome_display || lojaSlug || 'SEM LOJA';
      const total = itens.reduce((a,p)=>a+(parseFloat(p.valor_previsto)||0),0);
      const gid = 'entrega_pend_loja_'+String(lojaSlug||'sem_loja').replace(/[^a-z0-9]/gi,'_');
      const itensHtml = itens.map(p => {
        const dtDisplay = p.data_entrega ? new Date(p.data_entrega+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'}) : 'Sem data';
        return `<div class="prov-item" style="cursor:pointer" onclick="modalValidar('${p.id}')">
          <div class="prov-item-header">
            <div>
              <div class="prov-forn">${p.fornecedor}</div>
              <div class="prov-produto">${p.gn_catalogo?.produto||'—'}</div>
              <div style="font-size:11px;color:var(--muted)">${dtDisplay}</div>
            </div>
            <div style="text-align:right">
              <div class="num" style="font-size:13px;font-weight:700">R$ ${fmt(p.valor_previsto)}</div>
              <div style="font-size:11px;color:var(--muted)">${fmtQtd(p.qtd_prevista)} ${p.gn_catalogo?.und||''}</div>
              <div style="font-size:10px;color:var(--text);margin-top:4px">Toque para validar →</div>
            </div>
          </div>
        </div>`;
      }).join('');
      return `<div class="grupo-bloco${porLoja.size===1||S.provGruposAbertos.has(gid)?' aberto':''}" id="${gid}" style="margin-bottom:8px">
        <div class="grupo-header" onclick="toggleEpGrupoProvisao('${gid}')">

      </div>`;

  // ── Seção divergências esta semana ──
  let htmlDiverg = '';
  const divItems = S.entregasConfirmadas.filter(p => p.status === 'DIVERGENCIA');
  if (divItems.length > 0) {
    const porLojaDiv = new Map();
    divItems.forEach(p => {
      const slug = p.loja_slug || '';
      if (!porLojaDiv.has(slug)) porLojaDiv.set(slug, []);
      porLojaDiv.get(slug).push(p);
    });
    const divItensHtml = [...porLojaDiv.entries()].map(([lojaSlug, itens]) => {
      const lojaDisplay = S.lojas.find(l=>l.slug_pedido===lojaSlug)?.nome_display || lojaSlug || 'SEM LOJA';
      const gid = 'entrega_div_loja_'+String(lojaSlug||'sem_loja').replace(/[^a-z0-9]/gi,'_');
      const rows = itens.map(p => {
        const rec = Array.isArray(p.gn_recebimentos) ? p.gn_recebimentos[0] : p.gn_recebimentos;
        const difQtd = rec?.diferenca_qtd ?? 0;
        const difStr = difQtd ? (difQtd > 0 ? `+${fmtQtd(difQtd)}` : fmtQtd(difQtd)) : '—';
        return `<div class="prov-item" style="border-left:2px solid #fbbf24">
          <div class="prov-item-header">
            <div>
              <div class="prov-forn">${p.fornecedor}</div>
              <div class="prov-produto">${p.gn_catalogo?.produto||'—'}</div>

            <div style="text-align:right;font-size:11px">

              <div>Rec: <span class="val">${fmtQtd(rec?.qtd_recebida??p.qtd_prevista)} ${p.gn_catalogo?.und||''}</span></div>

      }).join('');
      return `<div class="grupo-bloco${porLojaDiv.size===1||S.provGruposAbertos.has(gid)?' aberto':''}" id="${gid}" style="margin-bottom:8px;border:1px solid rgba(251,191,36,.25)">
        <div class="grupo-header" onclick="toggleEpGrupoProvisao('${gid}')" style="background:rgba(251,191,36,.06)">

          <div style="display:flex;gap:12px;align-items:center">
            <span style="font-size:11px;color:var(--muted)">${itens.length} item${itens.length>1?'s':''}</span>

      </div>`;

      ${divItensHtml}
    </div>`;
  }

  // ── Seção confirmados semana vigente ──
  let htmlConfirmados = '';
  if (S.entregasConfirmadas.length > 0) {
    const porLojaConf = new Map();
    S.entregasConfirmadas.forEach(p => {
      const slug = p.loja_slug || '';
      if (!porLojaConf.has(slug)) porLojaConf.set(slug, []);
      porLojaConf.get(slug).push(p);
    });
    const confItensHtml = [...porLojaConf.entries()].map(([lojaSlug, itens]) => {
      const lojaDisplay = S.lojas.find(l=>l.slug_pedido===lojaSlug)?.nome_display || lojaSlug || 'SEM LOJA';
      const gid = 'entrega_conf_loja_'+String(lojaSlug||'sem_loja').replace(/[^a-z0-9]/gi,'_');
      const rows = itens.map(p => {
        const rec = Array.isArray(p.gn_recebimentos) ? p.gn_recebimentos[0] : p.gn_recebimentos;
        const recebidoPor = rec?.validado_por || '—';
        const isDiv = p.status === 'DIVERGENCIA';
        const statusBadge = isDiv
          ? '<span class="status-badge s-div" style="font-size:9px">DIVERGÊNCIA</span>'
          : '<span class="status-badge s-ok" style="font-size:9px">RECEBIDO ✓</span>';
        return `<div class="prov-item">
          <div class="prov-item-header">
            <div>
              <div class="prov-forn">${p.fornecedor}</div>
              <div class="prov-produto">${p.gn_catalogo?.produto||'—'}</div>
            </div>
            <div style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px">
              ${statusBadge}
              <div class="num" style="font-size:12px;font-weight:700">R$ ${fmt(rec?.valor_recebido ?? p.valor_previsto)}</div>
              <div style="font-size:10px;color:var(--muted)">${fmtQtd(rec?.qtd_recebida ?? p.qtd_prevista)} ${p.gn_catalogo?.und||''}</div>

          </div>
          ${rec?.observacao ? `<div style="font-size:10px;color:var(--muted);margin-top:4px;font-style:italic">"${rec.observacao}"</div>` : ''}
        </div>`;
      }).join('');
      return `<div class="grupo-bloco${porLojaConf.size===1||S.provGruposAbertos.has(gid)?' aberto':''}" id="${gid}" style="margin-bottom:8px">

          <span class="grupo-nome">🏪 ${lojaDisplay}</span>
          <div style="display:flex;gap:12px;align-items:center">
            <span style="font-size:11px;color:var(--muted)">${itens.length} item${itens.length>1?'s':''}</span>

  const totalGeral = S.entregasPendentes.reduce((a,p)=>a+(parseFloat(p.valor_previsto)||0),0);

  $('content').innerHTML = `

async function renderFaltaDia() {
  $('content').innerHTML = '<div class="empty"><div class="spin"></div></div>';
  const hojeIso = hoje();

  const { data: rows } = await db.from('checklist_diario')
    .select('loja, faltas')
    .eq('data_operacao', hojeIso);

  const registros = (rows || []).filter(r => Array.isArray(r.faltas) && r.faltas.length > 0);

  const lojasFiltro = [{ slug_pedido: '', nome_display: 'Todas as lojas' }, ...S.lojas];
  const tabsHtml = lojasFiltro.map(l =>
    `<button class="store-tab${S.faltaDiaLoja === l.slug_pedido ? ' ativo' : ''}"
      onclick="S.faltaDiaLoja='${l.slug_pedido}';renderFaltaDia()">${l.nome_display}</button>`
  ).join('');

  const registrosFiltrados = S.faltaDiaLoja
    ? registros.filter(r => {
        const loja = S.lojas.find(l => l.slug_pedido === S.faltaDiaLoja || l.slug_checklist === S.faltaDiaLoja || l.nome_display === S.faltaDiaLoja);
        return r.loja === S.faltaDiaLoja || (loja && r.loja === loja.loja);
      })
    : registros;

  const urgenciaIcon = u => u === 'Alta' ? '🔴' : u === 'Media' ? '🟡' : '🟢';

  const itensHtml = registrosFiltrados.length === 0
    ? `<div class="empty" style="padding:30px 0">
        <div class="empty-icon">✅</div>
        <div class="empty-texto">${S.faltaDiaLoja ? 'Nenhuma falta registrada nessa loja hoje.' : 'Nenhuma falta registrada hoje.'}</div>
      </div>`
    : registrosFiltrados.map(r => {
        const lojaObj = S.lojas.find(l =>
          l.slug_pedido === r.loja || l.loja === r.loja || l.nome_display === r.loja
        );
        const lojaDisplay = lojaObj?.nome_display || r.loja;
        // "+ Pedido" só aparece quando dá pra resolver a loja no cadastro de Pedido e
        // existe um rascunho ativo pra semana — sem isso não tem onde salvar o item.
        const podeAdicionar = !!(lojaObj && S.pedidoAtual?.id);
        const itensLoja = r.faltas.map(f => {
          const icon = urgenciaIcon(f.urgencia);
          const qtdNum = parseFloat(String(f.quantidade||'').replace(',','.')) || 0;
          const btnAdd = podeAdicionar
            ? `<button onclick="modalAdicionarFalta('${lojaObj.slug_pedido}','${(f.nome||'').replace(/'/g,"\\'")}',${qtdNum})" title="Adicionar ao pedido" style="flex-shrink:0;background:rgba(232,88,10,.12);border:1px solid rgba(232,88,10,.35);border-radius:6px;padding:4px 8px;color:#1A1D23;font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap">+ Pedido</button>`
            : '';
          return `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)">
            <span style="font-size:16px;flex-shrink:0">${icon}</span>
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:600;color:var(--text)">${f.nome || '—'}</div>
              ${f.quantidade ? `<div style="font-size:11px;color:var(--muted)">Qtd: ${f.quantidade}</div>` : ''}
            </div>
            <span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;flex-shrink:0;${
              f.urgencia==='Alta' ? 'background:rgba(239,68,68,.15);color:#1A1D23' :
              f.urgencia==='Media' ? 'background:rgba(251,191,36,.15);color:#1A1D23' :
              'background:rgba(34,197,94,.15);color:#1A1D23'
            }">${f.urgencia || 'Média'}</span>
            ${btnAdd}
          </div>`;
        }).join('');
        return `<div class="grupo-bloco aberto" style="margin-bottom:10px">
          <div class="grupo-header" style="cursor:default">
            <span class="grupo-nome">${lojaDisplay}</span>
            <span class="badge badge-r" style="font-size:10px">${r.faltas.length} falta${r.faltas.length>1?'s':''}</span>
          </div>
          <div class="grupo-body" style="display:block;padding:0 12px">${itensLoja}</div>
        </div>`;
      }).join('');

  const totalFaltas = registrosFiltrados.reduce((n, r) => n + (r.faltas?.length || 0), 0);
  const dataStr = new Date(hojeIso+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'});

  window._gerarWppFaltas = function(){
    const dataFull = new Date(hojeIso+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
    let txt = `⚠️ *GN — Faltas do Dia*\n📅 ${dataFull}\n`;
    if(registrosFiltrados.length===0){
      txt += '\n✅ Nenhuma falta registrada hoje.';
    } else {
      registrosFiltrados.forEach(r => {
        const lojaD = S.lojas.find(l=>l.slug_pedido===r.loja||l.loja===r.loja||l.nome_display===r.loja)?.nome_display||r.loja;
        txt += `\n🏪 *${lojaD}*\n`;
        r.faltas.forEach(f => {
          const ic = f.urgencia==='Alta'?'🔴':f.urgencia==='Media'?'🟡':'🟢';
          txt += `${ic} ${f.nome||'—'}${f.quantidade?' ('+f.quantidade+')':''}${f.urgencia?' — '+f.urgencia:''}\n`;
        });
      });
    }
    txt += `\n_Gerado em ${new Date().toLocaleString('pt-BR')}_`;
    if(navigator.share&&navigator.canShare({text:txt})){
      navigator.share({text:txt}).catch(()=>window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank'));
    } else {
      window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
    }
  };

  $('content').innerHTML = `
    <div class="sec-header">
      <div class="sec-titulo">Faltas do Dia <span class="badge badge-r">${totalFaltas}</span></div>
      <div style="display:flex;align-items:center;gap:8px">
        <div style="font-size:11px;color:var(--muted)">${dataStr}</div>
        <button onclick="renderFaltaDia()" style="padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:none;color:var(--muted);font-size:11px;cursor:pointer">↻ Atualizar</button>
      </div>
    </div>
    <div class="store-tabs" style="margin-bottom:12px">${tabsHtml}</div>
    ${itensHtml}
    ${totalFaltas>0?`
    <button onclick="window._gerarWppFaltas()" style="margin-top:12px;width:100%;background:rgba(37,211,102,.15);border:1px solid rgba(37,211,102,.4);border-radius:11px;padding:12px;color:#1A1D23;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer">
      📲 Enviar Faltas por WhatsApp
    </button>`:''}
  `;
  _atualizarFaltasBadge(registros.reduce((n,r)=>n+(r.faltas?.length||0),0));
}

// Abre um modal pra escolher, no Catálogo, o produto correspondente à falta reportada
// pela loja (o nome vem digitado livre pela loja, não é garantido bater com o produto
// cadastrado) e a quantidade a acrescentar no rascunho da semana atual.
function modalAdicionarFalta(lojaSlug, nomeFalta, qtdFalta) {
  const lojaObj = S.lojas.find(l => l.slug_pedido === lojaSlug);
  if (!lojaObj) { toast('Loja não encontrada.', 'err'); return; }
  if (!S.pedidoAtual?.id) { toast('Nenhum pedido em rascunho nesta semana.', 'err'); return; }

  const nomeUp = (nomeFalta||'').trim().toUpperCase();
  const candidatos = S.catalogo.filter(p => p.ativo && p.produto.toUpperCase().includes(nomeUp));
  const opcoes = (candidatos.length ? candidatos : S.catalogo.filter(p=>p.ativo))
    .slice().sort((a,b)=>a.produto.localeCompare(b.produto));

  if (!opcoes.length) { toast('Nenhum produto ativo no catálogo.', 'err'); return; }

  const optsHtml = opcoes.map(p => `<option value="${p.id}">${p.produto} — ${p.fornecedor}</option>`).join('');

  abrirModal(`
    <div class="modal-titulo">+ Adicionar ao Pedido
      <button class="modal-close" onclick="$('modal-bg').classList.remove('ativo')">×</button>
    </div>
    <div style="background:var(--card2);border-radius:var(--rs);padding:12px;margin-bottom:14px;font-size:12px">
      Falta reportada: <b>${nomeFalta||'—'}</b><br>${lojaObj.nome_display}
    </div>
    <div class="form-group">
      <label class="form-label">PRODUTO NO CATÁLOGO${candidatos.length?'':' (nenhum nome parecido — escolha manualmente)'}</label>
      <select class="form-select" id="m-falta-prod">${optsHtml}</select>
    </div>
    <div class="form-group">
      <label class="form-label">QTD A ACRESCENTAR NO PEDIDO</label>
      <input class="form-input" id="m-falta-qtd" type="number" step="0.5" min="0" value="${qtdFalta>0?qtdFalta:1}">
    </div>
    <div class="modal-acoes">
      <button class="btn-sm btn-outline" onclick="$('modal-bg').classList.remove('ativo')">Cancelar</button>
      <button class="btn-sm btn-orange" onclick="_confirmarAdicionarFalta('${lojaSlug}')">+ Adicionar</button>
    </div>
  `);
}

async function _confirmarAdicionarFalta(lojaSlug) {
  const catalogoId = $('m-falta-prod').value;
  const qtdAdd = parseFloat($('m-falta-qtd').value) || 0;
  if (!catalogoId || qtdAdd <= 0) { toast('Selecione o produto e uma quantidade válida.', 'err'); return; }

  const prod = S.catalogo.find(p => p.id === catalogoId);
  const qtdAtual = S.pedidoItens[catalogoId]?.[lojaSlug]?.qtd || 0;
  const custo = prod?.custo ?? S.pedidoItens[catalogoId]?.[lojaSlug]?.custo ?? 0;
  const novaQtd = qtdAtual + qtdAdd;

  await salvarItem(catalogoId, lojaSlug, novaQtd, custo, null);

  $('modal-bg').classList.remove('ativo');
  const lojaDisplay = S.lojas.find(l=>l.slug_pedido===lojaSlug)?.nome_display || lojaSlug;
  toast(`✓ ${fmtQtd(qtdAdd)} ${prod?.und||''} de "${prod?.produto||'—'}" ${qtdAtual>0?'somado ao':'adicionado ao'} pedido de ${lojaDisplay}.`, 'ok');
}

// ═══════════════════════════════════════════════
// RENDER: HISTÓRICO (auditoria de ações)
// ═══════════════════════════════════════════════
const HISTORICO_ACOES = {
  CONFIRMAR_FORNECEDOR:    { icon: '✅', label: 'Confirmou fornecedor(es)', cor: '#4ade80' },
  REVERTER_CONFIRMACAO:    { icon: '↩️', label: 'Reverteu confirmação',     cor: '#f87171' },
  CANCELAR_PEDIDO:         { icon: '🗑️', label: 'Cancelou pedido',          cor: '#f87171' },
  ALTERAR_CUSTO_CATALOGO:  { icon: '💰', label: 'Alterou custo',            cor: '#fbbf24' },
  CONFIRMAR_ENTREGA_LOTE:  { icon: '📦', label: 'Confirmou entregas em lote', cor: '#4ade80' },
  CONFIRMAR_VALOR_TERCEIRO:{ icon: '🤝', label: 'Confirmou valor — Terceiro/Empréstimo', cor: '#60a5fa' },
};

function _formatarDetalhesAuditoria(acao, d) {
  if (!d) return '';
  try {
    if (acao === 'CONFIRMAR_FORNECEDOR')   return `${(d.fornecedores||[]).join(', ')} — ${d.provisoes_geradas||0} provisõe(s)`;
    if (acao === 'REVERTER_CONFIRMACAO')   return `${d.fornecedor||''} — ${d.provisoes_apagadas||0} provisõe(s) apagada(s)${d.ja_recebidas?` (${d.ja_recebidas} já recebida(s) preservada(s))`:''}`;
    if (acao === 'CANCELAR_PEDIDO')        return d.itens_ocultados ? `${d.itens_ocultados} item(ns) ficaram ocultos` : '';
    if (acao === 'ALTERAR_CUSTO_CATALOGO') return `${d.produto||''}: ${d.custo_antigo!=null?'R$'+fmt(d.custo_antigo):'—'} → ${d.custo_novo!=null?'R$'+fmt(d.custo_novo):'—'}`;
    if (acao === 'CONFIRMAR_ENTREGA_LOTE') return `${d.data||''} — ${d.itens||0} item(ns), R$ ${fmt(d.valor_total||0)}`;
    if (acao === 'CONFIRMAR_VALOR_TERCEIRO') return `${d.loja||''} — ${d.insumo||''} → ${d.terceiro||''}: R$ ${fmt(d.valor||0)}`;
  } catch(e) {}
  return '';
}
