async function salvarItem(catalogoId, lojaSlug, qtd, custo, cxUnd) {
  if (!S.pedidoItens[catalogoId]) S.pedidoItens[catalogoId] = {};

  // Preserva o id e o estado de divergência ANTES de sobrescrever
  const idExistente  = S.pedidoItens[catalogoId][lojaSlug]?.id;
  const divExistente = S.pedidoItens[catalogoId][lojaSlug]?.diverg || false;

  // Atualiza estado preservando id e divergência. cxUnd (quando veio da digitação nos
  // campos Cx/Und) grava a quebra real digitada — pra não confundir com o total, o
  // Pedido usa isso pra exibir exatamente o que foi digitado em vez de decompor.
  S.pedidoItens[catalogoId][lojaSlug] = {
    id: idExistente, qtd, custo, diverg: divExistente,
    qtdCx: cxUnd ? cxUnd.cx : null, qtdUnd: cxUnd ? cxUnd.und : null
  };
  calcularTotais();
  renderTotalLoja();

  try {
    // Upsert (não insert/update condicionados a idExistente): o estado local pode ficar
    // desatualizado sobre se a linha já existe (ex.: mesmo item salvo por outro
    // dispositivo/aba, ou reenvio de uma fila offline antiga) — nesse caso um "insert"
    // batia num "duplicate key value violates unique constraint" e falhava pra sempre.
    const payload = {
      pedido_id: S.pedidoAtual.id,
      catalogo_id: catalogoId,
      loja_slug: lojaSlug,
      qtd_pedida: qtd,
      custo_unitario: custo
    };
    if (cxUnd) { payload.qtd_cx = cxUnd.cx; payload.qtd_und = cxUnd.und; }
    const { data, error } = await db.from('gn_pedido_itens')
      .upsert(payload, { onConflict: 'pedido_id,catalogo_id,loja_slug' })
      .select('id').single();
    if (error) throw error;
    if (data) S.pedidoItens[catalogoId][lojaSlug].id = data.id;
    _ppDel(catalogoId, lojaSlug);
  } catch (e) {
    console.error('Erro salvarItem:', e.message);
    _ppSet(catalogoId, lojaSlug, qtd, custo, cxUnd);
    toast('⚠️ Offline — salvo localmente', 'err');
  }
}

// Fornecedores com pelo menos um item com qtd > 0 em qualquer loja, no pedido atual.
function _fornecedoresComItensPedido() {
  return [...new Set(
    S.catalogo.filter(p => p.ativo).filter(prod =>
      S.lojas.some(l => (S.pedidoItens[prod.id]?.[l.slug_pedido]?.qtd || 0) > 0)
    ).map(p => p.fornecedor)
  )].sort();
}

async function confirmarPedido() {
  if (!S.pedidoAtual) return;

  // Na aba Edu/Oseas/Matheus, só entram os fornecedores dessa aba — impede confirmar (e
  // gerar provisões de) fornecedores de quem ainda está lançando o pedido em outra aba.
  const escopoAtivo = S.eduAtivo || S.oseasAtivo || S.matheusAtivo;
  let comItens = _fornecedoresComItensPedido();
  if (escopoAtivo) comItens = comItens.filter(f => _fornecedorNoEscopoAtivo(f));
  // Fornecedor reaberto pra uma 2ª rodada (ver _limparFornecedoresAba) volta a contar
  // como pendente — senão nunca dava pra confirmar a rodada nova.
  const pendentes = comItens.filter(f => !S.fornecedoresConfirmados.has(f) || S.fornecedoresReabertos.has(f));

  if (pendentes.length === 0) {
    const jaConfirmouAlgum = comItens.some(f => S.fornecedoresConfirmados.has(f));
    toast(jaConfirmouAlgum
      ? 'Todos os fornecedores desta aba já foram confirmados.'
      : 'Nenhum item com quantidade para confirmar nesta aba.', 'err');
    return;
  }

  abrirModal(`
    <div class="modal-titulo">✓ Confirmar Pedido${escopoAtivo?' — '+(S.eduAtivo?'Edu':S.oseasAtivo?'Oseas':'Matheus'):''}
      <button class="modal-close" onclick="$('modal-bg').classList.remove('ativo')">×</button>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:10px">Selecione os fornecedores pra gerar as provisões agora. Os demais continuam em aberto pra confirmar depois.</div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:6px">
      <button class="btn-sm btn-outline" onclick="_toggleTodosFornConfirm(this)" data-marcados="1">Desmarcar todos</button>
    </div>
    <div id="confirmForn-lista" style="display:flex;flex-direction:column;gap:6px;margin-bottom:14px;max-height:40vh;overflow-y:auto">
      ${pendentes.map(f => `
        <label style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(0,0,0,.04);border-radius:8px;cursor:pointer">
          <input type="checkbox" class="confirmForn-chk" value="${f.replace(/"/g,'&quot;')}" checked style="width:16px;height:16px">
          <span>${f}</span>
        </label>`).join('')}
    </div>
    <div class="modal-acoes">
      <button class="btn-sm btn-success" onclick="_confirmarFornecedoresSelecionados()">✓ Confirmar Selecionados</button>
    </div>
  `);
}

function _toggleTodosFornConfirm(btn) {
  const marcado = btn.getAttribute('data-marcados') === '1';
  document.querySelectorAll('.confirmForn-chk').forEach(chk => { chk.checked = !marcado; });
  btn.setAttribute('data-marcados', marcado ? '0' : '1');
  btn.textContent = marcado ? 'Marcar todos' : 'Desmarcar todos';
}

async function _confirmarFornecedoresSelecionados() {
  let selecionados = [...document.querySelectorAll('.confirmForn-chk:checked')].map(chk => chk.value);
  if (selecionados.length === 0) {
    toast('Selecione ao menos um fornecedor.', 'err'); return;
  }

  // Confirmação em duas etapas antes de gerar as provisões — confirmar gera pedido de
  // verdade pro fornecedor (a entrega é registrada e alguém vai receber), e confirmar
  // fornecedor errado (ou todos de uma vez sem querer, pela aba Pedido geral) já
  // aconteceu mais de uma vez.
  if (!confirm(`Confirmar pedido de ${selecionados.length} fornecedor${selecionados.length>1?'es':''}?\n\n${selecionados.join(', ')}\n\nIsso gera as provisões de entrega pra cada um.`)) return;
  if (!confirm(`Tem certeza mesmo? Depois de confirmar, os itens desses fornecedores ficam travados pra edição (dá pra desfazer com o botão "↩️ Reverter" depois, mas só enquanto a entrega ainda não foi recebida).`)) return;

  $('modal-bg').classList.remove('ativo');

  try {
    // 0. Reconferir no banco (não no Set local, que pode estar desatualizado se outra
    // aba/sessão já confirmou esse fornecedor nesse meio tempo) quem já tem provisão
    // gerada pra este pedido — foi exatamente essa janela que já duplicou entrega inteira
    // de fornecedor (TOP ALTO/DIFERENCIAL confirmados 2x, cada um em uma sessão, gerando
    // provisões e recebimentos em dobro). Fornecedor em "2ª rodada" (fornecedoresReabertos)
    // é esperado já ter provisão da rodada anterior, então não conta como duplicidade.
    const { data: jaNoBanco } = await db.from('gn_provisoes')
      .select('fornecedor')
      .eq('pedido_id', S.pedidoAtual.id)
      .neq('status', 'CANCELADO')
      .in('fornecedor', selecionados);
    const fornsJaNoBanco = new Set((jaNoBanco || []).map(p => p.fornecedor));
    const fornsDuplicados = selecionados.filter(f => fornsJaNoBanco.has(f) && !S.fornecedoresReabertos.has(f));
    if (fornsDuplicados.length > 0) {
      alert('⚠️ ' + fornsDuplicados.join(', ') + ' já ' + (fornsDuplicados.length > 1 ? 'foram confirmados' : 'foi confirmado') + ' — provavelmente em outra aba/sessão, sem essa página saber. Pra não duplicar a entrega, essa parte foi pulada; atualize a página (F5) pra ver o estado atual antes de confirmar de novo.');
      fornsDuplicados.forEach(f => S.fornecedoresConfirmados.add(f));
      selecionados = selecionados.filter(f => !fornsDuplicados.includes(f));
      if (selecionados.length === 0) { renderPedido(); return; }
    }

    // 1. Recarregar itens do banco para garantir que todos têm id
    await carregarItensPedido();

    const fornsSet = new Set(selecionados);

    // 2. Gerar provisões — uma por produto×loja com qtd > 0, só dos fornecedores selecionados
    const provisoes = [];
    S.catalogo.forEach(prod => {
      if (!fornsSet.has(prod.fornecedor)) return;
      const itensLoja = S.pedidoItens[prod.id];
      if (!itensLoja) return;
      S.lojas.forEach(loja => {
        const item = itensLoja[loja.slug_pedido];
        if (!item || !item.qtd || item.qtd <= 0) return;

        const forn = S.fornecedores.find(f => f.nome === prod.fornecedor);
        const diasForn = forn?.dias_entrega || [];
        const isoDate = dt => dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');

        // Item marcado com ⚡ urgência (giro rápido, fora do cronograma normal do
        // fornecedor) OU 📅 "entrega essa semana" (item.entregaSemana — mesmo efeito na
        // data, mas sem marcar urgenciaTemplate, que o app Lojas lê como aviso de urgência
        // pra loja: são dois sinais diferentes, não pode disparar um só porque o comprador
        // não quer que o pedido caia na semana seguinte): a entrega é hoje mesmo. Sem
        // nenhum dos dois, a data calculada caía no próximo dia de entrega do fornecedor
        // (podia ser semana que vem) mesmo pra pedidos que já saíram e foram entregues no
        // mesmo dia, deixando a Saída da Produção "atrasada" até alguém editar a mão.
        // Sem nenhum dos dois: data (ou janela) de entrega do fornecedor — prazo em dias
        // após o pedido tem prioridade sobre o cálculo por dia da semana, quando cadastrado.
        let dataEntrega = null, dataEntregaFim = null;
        if (_pedidoItemUrgente(prod, loja.slug_pedido) || item.entregaSemana) {
          dataEntrega = isoDate(new Date());
        } else if (forn?.prazo_dias_min != null) {
          const ref = new Date();
          const dMin = new Date(ref); dMin.setDate(ref.getDate() + forn.prazo_dias_min);
          dataEntrega = isoDate(dMin);
          if (forn.prazo_dias_max != null && forn.prazo_dias_max > forn.prazo_dias_min) {
            const dMax = new Date(ref); dMax.setDate(ref.getDate() + forn.prazo_dias_max);
            dataEntregaFim = isoDate(dMax);
          }
        } else if (diasForn.length > 0) {
          const ref = new Date();
          for (let d = 1; d <= 14; d++) {
            const dt = new Date(ref);
            dt.setDate(ref.getDate() + d);
            if (diasForn.includes(DIAS_SEMANA[dt.getDay()])) {
              dataEntrega = isoDate(dt);
              break;
            }
          }
        }

        provisoes.push({
          pedido_id:       S.pedidoAtual.id,
          pedido_item_id:  item.id || null,   // nullable agora
          catalogo_id:     prod.id,
          loja_slug:       loja.slug_pedido,
          fornecedor:      prod.fornecedor,
          data_entrega:    dataEntrega,
          data_entrega_fim:dataEntregaFim,
          qtd_prevista:    item.qtd,
          // Custo do catálogo manda (ver mesmo comentário em calcularTotais) — a provisão
          // gerada na confirmação precisa refletir o preço corrigido, não o retrato de
          // quando a quantidade foi lançada.
          valor_previsto:  item.qtd * (prod.custo ?? item.custo ?? 0),
          status:          'AGUARDANDO'
        });
      });
    });

    // 3. Inserir provisões por fornecedor — cada fornecedor é tratado como uma unidade:
    // internet instável (ex.: loja com conexão ruim, ou o próprio comprador em rede
    // fraca) tenta de novo automaticamente (_tentarComRetry) antes de desistir, e só
    // marca aquele fornecedor como confirmado se as provisões dele realmente foram
    // gravadas — sem isso, uma falha de rede no meio do batch travava a edição do
    // fornecedor (marcado como "confirmado") sem nenhuma provisão existir de verdade,
    // e a entrega dele nunca aparecia pra ninguém confirmar recebimento.
    const porFornecedor = {};
    provisoes.forEach(p => { (porFornecedor[p.fornecedor] = porFornecedor[p.fornecedor] || []).push(p); });

    const fornsOk = [], fornsComErro = [];
    for (const forn of selecionados) {
      const itensForn = porFornecedor[forn] || [];
      if (!itensForn.length) { fornsOk.push(forn); continue; } // nada com qtd>0 pra esse fornecedor
      try {
        for (let i = 0; i < itensForn.length; i += 50) {
          const lote = itensForn.slice(i, i + 50);
          await _tentarComRetry(async () => {
            const { error } = await db.from('gn_provisoes').insert(lote);
            if (error) throw error;
          });
        }
        fornsOk.push(forn);
      } catch (e) {
        console.error('Erro ao gerar provisões de ' + forn + ':', e.message || e);
        fornsComErro.push(forn);
      }
    }

    // 4. Marca como confirmados só os fornecedores que realmente tiveram as provisões
    // geradas — os com erro continuam pendentes (voltam a aparecer em "Confirmar
    // Pedido" pra tentar de novo, sem duplicar o que já foi criado).
    fornsOk.forEach(f => { S.fornecedoresConfirmados.add(f); S.fornecedoresReabertos.delete(f); delete S.fornecedoresRevertidos[f]; });

    // 5. Se todos os fornecedores com itens já estão confirmados, finaliza o pedido —
    // um fornecedor ainda reaberto pra 2ª rodada (de outro comprador, fora deste confirm)
    // conta como pendente, senão o pedido fecharia com uma rodada ainda em andamento.
    const aindaPendentes = _fornecedoresComItensPedido().filter(f => !S.fornecedoresConfirmados.has(f) || S.fornecedoresReabertos.has(f));
    if (aindaPendentes.length === 0) {
      const semIsoStr = S.semanaAtiva.toISOString().split('T')[0];
      try {
        await _tentarComRetry(async () => {
          const { error: errPed } = await db.from('gn_pedidos')
            .update({ status: 'CONFIRMADO', semana_inicio: semIsoStr, atualizado_em: new Date().toISOString() })
            .eq('id', S.pedidoAtual.id);
          if (errPed) throw errPed;
        });
        S.pedidoAtual.status = 'CONFIRMADO';
      } catch (e) {
        console.error('Erro ao marcar pedido como CONFIRMADO:', e.message || e);
        toast('⚠️ Fornecedores confirmados, mas não deu pra fechar o pedido (sem conexão). Tente confirmar de novo em instantes.', 'err');
      }
    }

    if (fornsComErro.length > 0) {
      alert('⚠️ ATENÇÃO — ' + fornsComErro.length + ' fornecedor(es) NÃO foram confirmados (falha de conexão, mesmo após tentar de novo):\n\n'
        + fornsComErro.join('\n') + '\n\nOs itens desses fornecedores continuam liberados pra edição. Tente confirmar de novo assim que a conexão melhorar.');
    }
    if (fornsOk.length > 0) {
      toast(`✓ ${fornsOk.length} fornecedor${fornsOk.length>1?'es':''} confirmado${fornsOk.length>1?'s':''}!${aindaPendentes.length>0?' '+aindaPendentes.length+' fornecedor(es) ainda em aberto.':''}`, 'ok');
    }
    if (fornsOk.length > 0) {
      _logAuditoria('CONFIRMAR_FORNECEDOR', { fornecedores: fornsOk, provisoes_geradas: porFornecedor && fornsOk.reduce((s,f)=>s+(porFornecedor[f]?.length||0),0) }, { pedido_id: S.pedidoAtual.id });
    }

    // 6. Atualizar estado local e re-renderizar
    calcularTotais();
    renderPedido();

  } catch (e) {
    console.error('Erro confirmarPedido:', e);
    toast('Erro ao confirmar: ' + (e.message || e), 'err');
  }
}

// Desfaz a confirmação de um fornecedor (ex.: clicou "Confirmar" sem querer, confirmou o
// fornecedor errado). Só apaga as provisões que ainda estão AGUARDANDO — uma entrega que
// já foi validada/recebida (RECEBIDO_OK/DIVERGENCIA) é um evento real que já aconteceu, e
// nunca é tocada aqui. Confirmação em duas etapas, dado que provisões apagadas não têm
// volta (é preciso confirmar de novo do zero pra recriar).
async function reverterConfirmacaoFornecedor(fornecedor) {
  if (!S.pedidoAtual?.id) return;
  if (!S.fornecedoresConfirmados.has(fornecedor)) { toast('Esse fornecedor não está confirmado.', 'err'); return; }

  let provisoesForn;
  try {
    provisoesForn = await _fetchTodasPaginas(() => db.from('gn_provisoes')
      .select('id,status')
      .eq('pedido_id', S.pedidoAtual.id)
      .eq('fornecedor', fornecedor)
      .order('id'));
  } catch (e) {
    toast('Erro ao verificar provisões: ' + (e.message || e), 'err');
    return;
  }

  const reversiveis = (provisoesForn || []).filter(p => p.status === 'AGUARDANDO');
  const jaRecebidas = (provisoesForn || []).length - reversiveis.length;

  if (reversiveis.length === 0) {
    toast(`Todas as provisões de ${fornecedor} já foram recebidas/validadas — não dá pra reverter.`, 'err');
    return;
  }

  const avisoRecebidas = jaRecebidas > 0
    ? `\n\n⚠️ ${jaRecebidas} item(ns) já foram recebidos/validados e NÃO serão afetados — só as ${reversiveis.length} provisões ainda aguardando entrega vão ser apagadas.`
    : '';
  if (!confirm(`Reverter a confirmação de ${fornecedor}?${avisoRecebidas}\n\nOs itens voltam a ficar editáveis, e alguém vai precisar confirmar de novo pra gerar as provisões.`)) return;
  if (!confirm(`Tem certeza mesmo? Essa ação apaga ${reversiveis.length} provisão(ões) e não pode ser desfeita — depois de reverter, é preciso confirmar de novo do zero.`)) return;

  try {
    const ids = reversiveis.map(p => p.id);
    for (let i = 0; i < ids.length; i += 100) {
      const { error } = await db.from('gn_provisoes').delete().in('id', ids.slice(i, i + 100));
      if (error) throw error;
    }

    S.fornecedoresConfirmados.delete(fornecedor);
    S.fornecedoresReabertos.delete(fornecedor);

    // Se o pedido já tinha virado CONFIRMADO (todo mundo tinha confirmado), reverter um
    // fornecedor tira ele dessa lista — o pedido não está mais 100% confirmado.
    if (S.pedidoAtual.status === 'CONFIRMADO') {
      const { error: errPed } = await db.from('gn_pedidos')
        .update({ status: 'RASCUNHO', atualizado_em: new Date().toISOString() })
        .eq('id', S.pedidoAtual.id);
      if (errPed) throw errPed;
      S.pedidoAtual.status = 'RASCUNHO';
    }

    toast(`↩️ Confirmação de ${fornecedor} revertida (${reversiveis.length} provisão(ões) apagada(s)).`, 'ok');
    _logAuditoria('REVERTER_CONFIRMACAO', { fornecedor, provisoes_apagadas: reversiveis.length, ja_recebidas: jaRecebidas }, { pedido_id: S.pedidoAtual.id, fornecedor });
    // Marca aqui na hora (não só no banco) pra o aviso aparecer imediatamente, sem esperar
    // recarregar a página — ver _fornecedoresRevertidosAlertHtml().
    let _usuarioRevert = 'SISTEMA';
    try { _usuarioRevert = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null')?.nome || 'SISTEMA'; } catch(e) {}
    S.fornecedoresRevertidos[fornecedor] = {
      acao: 'REVERTER_CONFIRMACAO', fornecedor, usuario: _usuarioRevert, criado_em: new Date().toISOString(),
      detalhes: { fornecedor, provisoes_apagadas: reversiveis.length, ja_recebidas: jaRecebidas }
    };
    renderPedido();
  } catch (e) {
    toast('Erro ao reverter: ' + (e.message || e), 'err');
  }
}

async function novoPedido() {
  // Na aba Edu/Oseas, "Novo" não pode cancelar o rascunho inteiro — é compartilhado com
  // quem ainda está lançando na outra aba. Em vez disso, limpa só os itens dos
  // fornecedores dessa aba, deixando o resto do pedido intocado.
  if (S.eduAtivo || S.oseasAtivo || S.matheusAtivo) { await _limparFornecedoresAba(); return; }
  const ehConfirmado = S.pedidoAtual?.status === 'CONFIRMADO';
  // Quantos itens (de qualquer loja) já têm quantidade lançada no rascunho atual —
  // cancelar o pedido sem avisar isso claramente já fez itens de 9 lojas sumirem
  // "de vista" de uma vez (o pedido cancelado continua no banco, mas ninguém mais
  // olha pra ele). Um confirm() genérico não deixava claro o tamanho do estrago.
  const totalItensAtuais = Object.values(S.pedidoItens).flatMap(l => Object.values(l)).filter(i => i.qtd > 0).length;
  const avisoItens = totalItensAtuais > 0
    ? `\n\n⚠️ O rascunho atual TEM ${totalItensAtuais} ITEM(NS) JÁ LANÇADO(S) PELAS LOJAS.\nEsses itens não aparecem mais pra ninguém depois de cancelar (continuam no banco, mas escondidos).`
    : '';
  const msg = ehConfirmado
    ? 'O pedido desta semana já está CONFIRMADO.\nDeseja criar um novo rascunho em branco (sem cancelar o confirmado)?'
    : `Criar novo pedido em branco?\nO rascunho atual será descartado.${avisoItens}`;
  if (!confirm(msg)) return;
  if (!ehConfirmado && totalItensAtuais > 0) {
    if (!confirm(`Tem certeza mesmo? ${totalItensAtuais} itens lançados pelas lojas vão ficar escondidos até alguém recuperar manualmente no banco.`)) return;
  }
  const semIsoStr = S.semanaAtiva.toISOString().split('T')[0];
  if (!ehConfirmado && S.pedidoAtual?.id) {
    const pedidoCanceladoId = S.pedidoAtual.id;
    await db.from('gn_pedidos').update({ status: 'CANCELADO' }).eq('id', pedidoCanceladoId);
    // Provisões de fornecedores que já tinham sido confirmados nesse rascunho (2ª rodada,
    // ou confirmação parcial antes de cancelar o resto) não podem ficar "aguardando
    // entrega" pra sempre — a loja continuaria vendo essa entrega na aba Entrega, duplicada
    // com a do próximo pedido dessa mesma semana (foi exatamente isso que aconteceu: um
    // pedido cancelado deixou 286 provisões órfãs ainda AGUARDANDO).
    await db.from('gn_provisoes').update({ status: 'CANCELADO', atualizado_em: new Date().toISOString() })
      .eq('pedido_id', pedidoCanceladoId).eq('status', 'AGUARDANDO');
    _logAuditoria('CANCELAR_PEDIDO', { itens_ocultados: totalItensAtuais }, { pedido_id: pedidoCanceladoId });
  }
  const { data } = await db.from('gn_pedidos')
    .insert([{ data_pedido: hoje(), semana_inicio: semIsoStr, status: 'RASCUNHO', regiao: 'RJ' }])
    .select().single();
  S.pedidoAtual = data;
  S.pedidoItens = {};
  calcularTotais();
  renderPedido();
  toast('Novo pedido criado.', 'ok');
}

// Botão "Limpar" da aba Edu/Oseas — dois casos:
// 1. Tem fornecedor da aba AINDA NÃO confirmado: zera só esses, do jeito de sempre.
// 2. TODOS os fornecedores da aba já estão confirmados (provisão de entrega já gerada,
//    ex.: Petiscos pediu de manhã e precisa pedir mais à tarde): a rodada anterior fica
//    intacta em gn_provisoes — isso só reabre a digitação (fornecedoresReabertos) e zera
//    gn_pedido_itens pra começar uma 2ª rodada, sem tocar no que já foi confirmado.
async function _limparFornecedoresAba() {
  const label = S.eduAtivo ? 'Edu' : S.oseasAtivo ? 'Oseas' : 'Matheus';
  const todosForns = _fornecedoresDaAbaAtiva();
  const pendentes = todosForns.filter(f => !S.fornecedoresConfirmados.has(f));

  if (pendentes.length > 0) {
    if (!await _confirmarELimparFornecedores(pendentes, label,
      `Limpar o pedido de ${label} (${pendentes.join('/')}) pra lançar de novo?`,
      `Os itens dos outros fornecedores (de quem ainda está lançando na outra aba) não são afetados.`)) return;
    toast(`Pedido de ${label} limpo — pode lançar de novo.`, 'ok');
    return;
  }

  const jaConfirmados = todosForns.filter(f => S.fornecedoresConfirmados.has(f) && !S.fornecedoresReabertos.has(f));
  if (jaConfirmados.length === 0) {
    toast(`Nenhum fornecedor de ${label} com item lançado.`, 'err');
    return;
  }
  const ok = await _confirmarELimparFornecedores(jaConfirmados, label,
    `${jaConfirmados.join('/')} já ${jaConfirmados.length>1?'foram':'foi'} confirmado(s) essa semana (entrega já registrada).`,
    `Isso NÃO mexe no pedido já confirmado — só libera os campos pra você lançar um NOVO pedido de ${jaConfirmados.join('/')} nessa mesma semana. Continuar?`);
  if (!ok) return;
  jaConfirmados.forEach(f => {
    S.fornecedoresReabertos.add(f);
    // Registrado pra sobreviver a um reload/outra sessão — sem isso, "2ª rodada" era só
    // um Set em memória que zerava ao recarregar a página, travando os itens de novo como
    // se estivessem confirmados (mesma classe de confusão do aviso de reversão).
    _logAuditoria('ABRIR_2A_RODADA', { fornecedor: f }, { pedido_id: S.pedidoAtual.id, fornecedor: f });
  });
  renderPedido();
  toast(`Nova rodada de ${label} liberada — pode lançar de novo.`, 'ok');
}

// Zera gn_pedido_itens (local e no banco) pros fornecedores informados, com um confirm()
// antes mostrando quantos itens já lançados seriam apagados. Não toca em outros
// fornecedores nem no gn_pedidos. Retorna false se o usuário cancelar ou der erro.
async function _confirmarELimparFornecedores(forns, label, msgTitulo, msgRodape) {
  const fornsSet = new Set(forns);
  const catalogoIdsAba = S.catalogo.filter(p => fornsSet.has(p.fornecedor)).map(p => p.id);

  let totalItens = 0;
  catalogoIdsAba.forEach(cid => {
    Object.values(S.pedidoItens[cid] || {}).forEach(item => { if (item.qtd > 0) totalItens++; });
  });
  const aviso = totalItens > 0 ? `\n\n⚠️ ${totalItens} item(ns) lançado(s) vão ser zerados.` : '';
  if (!confirm(`${msgTitulo}${aviso}\n\n${msgRodape}`)) return false;

  if (S.pedidoAtual?.id && catalogoIdsAba.length > 0) {
    try {
      // Reconferir no banco imediatamente antes de zerar — entre o aviso acima e aqui pode
      // passar tempo (usuário lendo o confirm()), e uma loja pode ter salvado uma
      // quantidade nova nesse intervalo; zerar sem checar apagaria esse lançamento sem
      // ninguém perceber (ruptura de estoque silenciosa).
      const { data: atuais } = await db.from('gn_pedido_itens')
        .select('catalogo_id,loja_slug,qtd_pedida')
        .eq('pedido_id', S.pedidoAtual.id)
        .in('catalogo_id', catalogoIdsAba);
      const mudouAgora = (atuais || []).some(row => {
        const item = S.pedidoItens[row.catalogo_id]?.[row.loja_slug];
        const qtdLocal = item?.qtd || 0;
        return (parseFloat(row.qtd_pedida) || 0) !== qtdLocal;
      });
      if (mudouAgora) {
        toast('⚠️ Uma loja lançou/alterou um item desses agora mesmo — atualize a tela e tente de novo pra não apagar o lançamento dela.', 'err');
        return false;
      }

      const { error } = await db.from('gn_pedido_itens')
        .update({ qtd_pedida: 0, qtd_cx: null, qtd_und: null })
        .eq('pedido_id', S.pedidoAtual.id)
        .in('catalogo_id', catalogoIdsAba);
      if (error) throw error;
    } catch (e) {
      toast('Erro ao limpar: ' + (e.message || e), 'err');
      return false;
    }
  }

  catalogoIdsAba.forEach(cid => {
    Object.values(S.pedidoItens[cid] || {}).forEach(item => {
      item.qtd = 0; item.qtdCx = null; item.qtdUnd = null; item.diverg = false;
    });
  });

  calcularTotais();
  renderPedido();
  return true;
}

// ═══════════════════════════════════════════════
// CÁLCULOS
// ═══════════════════════════════════════════════
function calcularTotais() {
  S.totaisPorLoja = {};
  S.lojas.forEach(l => { S.totaisPorLoja[l.slug_pedido] = 0; });

  Object.entries(S.pedidoItens).forEach(([cid, lojas]) => {
    const prod = S.catalogo.find(p => p.id === cid);
    // Na aba Edu/Oseas/Matheus, o total só considera os fornecedores daquela aba —
    // mesma regra de _fornecedorNoEscopoAtivo usada na listagem de itens.
    if (!prod || !_fornecedorNoEscopoAtivo(prod.fornecedor)) return;
    Object.entries(lojas).forEach(([loja, item]) => {
      if (item.qtd > 0) {
        // Custo do catálogo manda — o custo gravado no item (custo_unitario) é só um
        // retrato de quando a quantidade foi lançada, e não acompanha reajuste de preço
        // feito depois no Catálogo. Sem isso, corrigir o custo lá não refletia no total
        // do pedido nem no valor previsto das provisões dos itens já lançados.
        const custo = prod.custo ?? item.custo ?? 0;
        S.totaisPorLoja[loja] = (S.totaisPorLoja[loja] || 0) + item.qtd * custo;
      }
    });
  });
}

function totalPedidoGeral() {
  return Object.values(S.totaisPorLoja).reduce((a,b) => a+b, 0);
}

function contarItensLoja(lojaSlug) {
  let n = 0;
  Object.entries(S.pedidoItens).forEach(([cid, lojas]) => {
    if (lojas[lojaSlug]?.qtd > 0) {
      const prod = S.catalogo.find(p => p.id === cid);
      if (prod && _fornecedorNoEscopoAtivo(prod.fornecedor)) n++;
    }
  });
  return n;
}

function setTab(tab) {
  // "guia" é documentação, não uma ação restrita — sempre acessível, independente das
  // permissões de aba do usuário.
  if (tab !== 'guia' && S.abasPermitidas && !S.abasPermitidas.has(tab)) return;
  S.tab = tab;
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  const sl = document.querySelector(`.sidebar-link[data-sidebar-tab="${tab}"]`);
  if (sl) sl.classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('ativo', b.dataset.tab === tab);
  });
  renderContent();
}

function renderContent() {
  S.eduAtivo = S.tab === 'edu';
  S.oseasAtivo = S.tab === 'oseas';
  S.matheusAtivo = S.tab === 'matheus';
  // Some por padrão — só a aba Pedido (e Edu/Oseas/Matheus, que reaproveitam o mesmo
  // render) volta a mostrar, via renderPedido(), se fizer sentido (loja selecionada e
  // fora do modo "Todas as lojas").
  const _hdrLoja = document.getElementById('header-loja-ativa');
  if (_hdrLoja) _hdrLoja.style.display = 'none';
  switch(S.tab) {
    case 'pedido':      renderPedido(); break;
    case 'edu':         renderPedido(); break;
    case 'oseas':       renderPedido(); break;
    case 'matheus':     renderPedido(); break;
    case 'catalogo':    renderCatalogo(); break;
    case 'fornecedores':renderFornecedores(); break;
    case 'provisoes':   renderProvisoes(); break;
    case 'entrega':     renderEntrega(); break;
    case 'fichas':      renderFichas(); break;
    case 'faltas-dia':  renderFaltaDia(); break;
    case 'carnes':      renderCarnesCtrl(); break;
    case 'trios':       renderTrios(); break;
    case 'historico':   renderHistorico(); break;
    case 'producao':    renderProducao(); break;
    case 'terceiros':   renderTerceiros(); break;
    case 'guia':        renderGuia(); break;
  }
}

function _nthWeekdayPed(ano, mes, weekday, n) {
  const d = new Date(ano, mes - 1, 1);
  let count = 0;
  for (let i = 0; i < 60; i++) {
    if (d.getDay() === weekday && ++count === n) return d.toISOString().slice(0,10);
    d.setDate(d.getDate() + 1);
  }
  return null;
}

function _getDatasEspeciaisPed(ano) {
  const maes = _nthWeekdayPed(ano, 5, 0, 2);
  const pais = _nthWeekdayPed(ano, 8, 0, 2);
  const base = DATAS_ESPECIAIS_BASE_PED.filter(f => f.data.startsWith(String(ano)));
  const extra = [];
  if (maes) extra.push({data: maes, nome:'Dia das Mães', tipo:'comercial'});
  if (pais) extra.push({data: pais, nome:'Dia dos Pais', tipo:'comercial'});
  const seen = new Set();
  return [...base, ...extra].filter(f => { const k=f.data+'|'+f.nome; if(seen.has(k))return false; seen.add(k); return true; }).sort((a,b)=>a.data.localeCompare(b.data));
}

// ── VENDA DA SEMANA ANTERIOR (por loja) ─────────────────────────────────────
// Card auxiliar pra conferir, na hora de fazer o pedido/contagem da semana atual,
// se o volume de venda da semana anterior condiz com o estoque contado — mesma
// grade "dia a dia" (Fat) que já existe nos cards de loja do Painel de Gestão
// (gn-home.html), só que aqui já vem direto na semana anterior à ativa, sem
// precisar abrir outro app pra comparar.
// checklist_diario.loja usa o "chkKey" de GN_LOJAS (ex.: "Rancho"), não o
// lojaSlug/userKey usados no resto do app Pedidos.
const LOJA_CHKKEY_BY_SLUG = Object.fromEntries((window.GN_LOJAS || []).map(l => [l.lojaSlug, l.chkKey]));

// Normaliza pra comparar com checklist_diario.loja — cobre as mesmas exceções
// legadas já tratadas em gn-home.html (_normLoja), mais "NORTE" (comKey antigo
// que também aparece nessa coluna pra Norte Shopping).
function _normLojaPed(n) {
  if (n === 'SAO_GONCALO') return 'SÃO GONÇALO';
  if (n === 'NORTE') return 'NORTE SHOPPING';
  return (n || '').toUpperCase().replace('AMÉRICA', 'AMERICA');
}

async function _carregarVendaSemanaAnterior(lojaSlug, semanaAtivaDate) {
  const chkKey = LOJA_CHKKEY_BY_SLUG[lojaSlug];
  if (!chkKey) return;
  const segAnt = datePlusWeeks(semanaAtivaDate, -1);
  const domAnt = new Date(segAnt); domAnt.setDate(domAnt.getDate() + 6);
  const isoSeg = segAnt.toISOString().split('T')[0];
  const isoDom = domAnt.toISOString().split('T')[0];
  const cacheKey = lojaSlug + '|' + isoSeg;
  if (S.vendaAntCache[cacheKey]) return; // já carregado ou carregando
  S.vendaAntCache[cacheKey] = { loading: true };
  try {
    const { data, error } = await db.from('checklist_diario')
      .select('data_operacao,loja,venda_salao,venda_delivery')
      .gte('data_operacao', isoSeg).lte('data_operacao', isoDom);
    if (error) throw error;
    const alvo = _normLojaPed(chkKey);
    const dias = Array(7).fill(0);
    (data || []).forEach(r => {
      if (_normLojaPed(r.loja) !== alvo) return;
      const idx = Math.round((new Date(r.data_operacao + 'T12:00:00') - new Date(isoSeg + 'T12:00:00')) / 86400000);
      if (idx < 0 || idx > 6) return;
      dias[idx] += (parseFloat(r.venda_salao) || 0) + (parseFloat(r.venda_delivery) || 0);
    });
    S.vendaAntCache[cacheKey] = { loading: false, dias, total: dias.reduce((a, b) => a + b, 0) };
  } catch (e) {
    S.vendaAntCache[cacheKey] = { loading: false, erro: true };
  }
  const aindaNaMesmaTela = S.lojaAtiva === lojaSlug && S.semanaAtiva &&
    S.semanaAtiva.toISOString().split('T')[0] === semanaAtivaDate.toISOString().split('T')[0] &&
    (S.tab === 'pedido' || S.tab === 'edu' || S.tab === 'oseas' || S.tab === 'matheus');
  if (aindaNaMesmaTela) renderPedido();
}

function _vendaSemanaAntCardHtml() {
  if (S.todosModo || !S.lojaAtiva) return '';
  const chkKey = LOJA_CHKKEY_BY_SLUG[S.lojaAtiva];
  if (!chkKey) return '';
  const segAnt = datePlusWeeks(S.semanaAtiva, -1);
  const domAnt = new Date(segAnt); domAnt.setDate(domAnt.getDate() + 6);
  const isoSeg = segAnt.toISOString().split('T')[0];
  const cacheKey = S.lojaAtiva + '|' + isoSeg;
  const cache = S.vendaAntCache[cacheKey];
  if (!cache) _carregarVendaSemanaAnterior(S.lojaAtiva, S.semanaAtiva);

  const lojaNome = S.lojas.find(l => l.slug_pedido === S.lojaAtiva)?.nome_display || chkKey;
  const fmtD = d => d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
  const DSEM = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];

  let corpo;
  if (!cache || cache.loading) {
    corpo = `<div style="font-size:11px;color:var(--muted);padding:4px 0">Carregando…</div>`;
  } else if (cache.erro) {
    corpo = `<div style="font-size:11px;color:var(--muted);padding:4px 0">Não foi possível carregar a venda dessa semana.</div>`;
  } else if (!cache.total) {
    corpo = `<div style="font-size:11px;color:var(--muted);padding:4px 0">Sem venda lançada no Check-list nessa semana.</div>`;
  } else {
    const fmtV = v => v > 0 ? (v >= 1000 ? 'R$' + (v / 1000).toFixed(1).replace('.', ',') + 'k' : 'R$' + Math.round(v)) : '—';
    corpo = `
      <table style="width:100%;border-collapse:collapse;table-layout:fixed;margin-top:6px">
        <thead><tr>${DSEM.map(d => `<th style="font-size:9px;font-weight:700;color:var(--muted);text-align:center;padding:2px 0">${d}</th>`).join('')}</tr></thead>
        <tbody><tr>${cache.dias.map(v => `<td style="font-size:10px;font-weight:800;color:${v > 0 ? 'var(--text)' : 'var(--muted)'};text-align:center;padding:2px 0">${fmtV(v)}</td>`).join('')}</tr></tbody>
      </table>
      <div style="text-align:right;font-size:11px;font-weight:800;color:#1A1D23;margin-top:6px">Total: R$ ${cache.total.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</div>`;
  }

  return `<div style="background:var(--card2);border:1px solid var(--border);border-left:3px solid #22c55e;border-radius:var(--r);padding:12px 14px;margin-bottom:10px">
    <div style="font-size:12px;font-weight:700;margin-bottom:3px">📊 Venda da Semana Anterior · ${lojaNome}</div>
    <div style="font-size:10px;color:var(--muted);margin-bottom:2px">${fmtD(segAnt)} – ${fmtD(domAnt)} · confira se bate com o estoque contado nesta semana.</div>
    ${corpo}
  </div>`;
}

// Fornecedores da aba "Edu" — espelho do Pedido restrito a esses fornecedores. Tudo que é
// digitado aqui grava direto em S.pedidoItens, então aparece na aba Pedido normalmente e
// "Confirmar" gera provisões/pedidos pelas lojas do jeito de sempre (mesma função/estado).
const EDU_FORNECEDORES = ['AMBEV', 'JBS', 'FAFS /VILLA PESCADOS', 'SAUDALI/CIACARNE', 'DUGOMES'];
// Fornecedores da aba "Oseas" — mesmo esquema da aba Edu, restrito ao fornecedor PETISCOS.
const OSEAS_FORNECEDORES = ['PETISCOS'];
// Fornecedores da aba "Matheus" — todo o resto (não é uma lista fixa, é "tudo que não é
// do Edu nem do Oseas"), pra nunca precisar atualizar essa lista quando um fornecedor
// novo for cadastrado.
function _ehFornecedorMatheus(forn) {
  return !EDU_FORNECEDORES.includes(forn) && !OSEAS_FORNECEDORES.includes(forn);
}
// Escopo de fornecedores da aba de comprador ativa (Edu/Oseas/Matheus) — null = aba
// Pedido geral, sem filtro. Centraliza a regra usada em Confirmar/Limpar/Provisões pra
// não ter que lembrar de estender os três lugares toda vez que mudar alguma coisa.
function _fornecedorNoEscopoAtivo(forn) {
  if (S.eduAtivo) return EDU_FORNECEDORES.includes(forn);
  if (S.oseasAtivo) return OSEAS_FORNECEDORES.includes(forn);
  if (S.matheusAtivo) return _ehFornecedorMatheus(forn);
  return true;
}
// Lista de fornecedores "donos" da aba de comprador ativa — universo usado por
// _limparFornecedoresAba() pra saber quem ainda está pendente vs. já confirmado.
function _fornecedoresDaAbaAtiva() {
  if (S.eduAtivo) return EDU_FORNECEDORES;
  if (S.oseasAtivo) return OSEAS_FORNECEDORES;
  if (S.matheusAtivo) return S.fornecedores.map(f => f.nome).filter(_ehFornecedorMatheus);
  return [];
}
// Rótulo curto do comprador ativo — usado nos pedidos gerados (WhatsApp/PDF) pra deixar
// claro que aquele pedido saiu escopado (ex.: "PEDIDO · 👤 Oseas"), evitando confundir
// com um pedido geral de todos os fornecedores.
function _labelCompradorAtivo() {
  return S.eduAtivo ? ' · 👤 Edu' : S.oseasAtivo ? ' · 👤 Oseas' : S.matheusAtivo ? ' · 👤 Matheus' : '';
}

// ── TOTAL PEDIDO DA SEMANA POR ITEM (aba Edu/Oseas) ────────────────────────
// O comprador (Edu/Oseas) manda pro fornecedor um pedido ÚNICO por item, consolidando
// o que cada uma das 11 lojas pediu — pra saber esse total ele precisava somar loja por
// loja manualmente. Este card mostra, por item do fornecedor da aba ativa, o total já
// pedido nesta semana somando as 11 lojas originais (Maglia, Mandacaru — destino interno,
// não é loja — e Loja Teste ficam de fora — não são uma das 11 lojas).
const LOJAS_SLUG_PEDIDO_REAIS = (window.GN_LOJAS || [])
  .filter(l => l.display !== 'Maglia')
  .map(l => l.lojaSlug);

async function _carregarTotalCompradorSemana(pedidoId, fornecedores) {
  if (S.totalCompradorCache[pedidoId]) return; // já carregado ou carregando
  S.totalCompradorCache[pedidoId] = { loading: true };
  try {
    const itens = await _fetchTodasPaginas(() => db.from('gn_pedido_itens')
      .select('catalogo_id,loja_slug,qtd_pedida').eq('pedido_id', pedidoId));
    const porItem = {};
    (itens || []).forEach(it => {
      if (!LOJAS_SLUG_PEDIDO_REAIS.includes(it.loja_slug)) return;
      const qtd = parseFloat(it.qtd_pedida) || 0;
      if (qtd <= 0) return;
      porItem[it.catalogo_id] = (porItem[it.catalogo_id] || 0) + qtd;
    });
    const lista = S.catalogo
      .filter(p => fornecedores.includes(p.fornecedor) && porItem[p.id] > 0)
      .map(p => ({ produto: p.produto, und: p.und, total: porItem[p.id] }))
      .sort((a, b) => b.total - a.total);
    S.totalCompradorCache[pedidoId] = { loading: false, itens: lista };
  } catch (e) {
    S.totalCompradorCache[pedidoId] = { loading: false, erro: true };
  }
  if (S.pedidoAtual && S.pedidoAtual.id === pedidoId && (S.tab === 'edu' || S.tab === 'oseas')) renderPedido();
}

// Aviso de "fornecedor revertido, esperando confirmar de novo" — ver
// carregarFornecedoresRevertidos(). Some sozinho assim que o fornecedor for confirmado de
// novo (deixa de estar em S.fornecedoresRevertidos).
function _fornecedoresRevertidosAlertHtml() {
  const forns = Object.keys(S.fornecedoresRevertidos || {}).filter(f => _fornecedorNoEscopoAtivo(f));
  if (!forns.length) return '';
  return forns.map(f => {
    const r = S.fornecedoresRevertidos[f];
    const d = r.detalhes || {};
    const dt = r.criado_em ? new Date(r.criado_em) : null;
    const hora = dt ? dt.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '';
    const dia = dt ? dt.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) : '';
    const jaRecebidasTxt = d.ja_recebidas > 0 ? ` (${d.ja_recebidas} já recebido${d.ja_recebidas > 1 ? 's' : ''} — preservado${d.ja_recebidas > 1 ? 's' : ''})` : '';
    return `<div style="background:rgba(217,119,6,.1);border:1px solid rgba(217,119,6,.4);border-left:3px solid #D97706;border-radius:var(--r);padding:10px 14px;margin-bottom:10px;font-size:12px;color:var(--text)">
      ⚠️ <strong>${esc(f)}</strong> foi revertido por ${esc(r.usuario || '—')} às ${hora} de ${dia} — ${d.provisoes_apagadas || 0} item(ns) ficaram sem provisão gerada${jaRecebidasTxt}. Ajuste as quantidades se precisar e confirme de novo.
    </div>`;
  }).join('');
}

function _totalCompradorSemanaCardHtml() {
  if (!S.eduAtivo && !S.oseasAtivo) return '';
  if (!S.pedidoAtual) return '';
  const fornecedores = S.eduAtivo ? EDU_FORNECEDORES : OSEAS_FORNECEDORES;
  const pedidoId = S.pedidoAtual.id;
  const cache = S.totalCompradorCache[pedidoId];
  if (!cache) _carregarTotalCompradorSemana(pedidoId, fornecedores);

  let corpo;
  if (!cache || cache.loading) {
    corpo = `<div style="font-size:11px;color:var(--muted);padding:4px 0">Carregando…</div>`;
  } else if (cache.erro) {
    corpo = `<div style="font-size:11px;color:var(--muted);padding:4px 0">Não foi possível carregar o total da semana.</div>`;
  } else if (!cache.itens.length) {
    corpo = `<div style="font-size:11px;color:var(--muted);padding:4px 0">Nenhum item pedido ainda nesta semana.</div>`;
  } else {
    corpo = `<div style="max-height:260px;overflow-y:auto;margin-top:4px">
      ${cache.itens.map(it => `
        <div style="display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 0;border-bottom:1px solid rgba(0,0,0,.04)">
          <span style="flex:1;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${it.produto}</span>
          <span style="font-weight:800;color:#1A1D23;font-family:monospace;flex-shrink:0">${fmtQtd(it.total)} ${it.und}</span>
        </div>`).join('')}
    </div>`;
  }

  return `<div style="background:var(--card2);border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:var(--r);padding:12px 14px;margin-bottom:10px">
    <div style="font-size:12px;font-weight:700;margin-bottom:3px">📦 Total Pedido da Semana · ${S.eduAtivo?'Edu':'Oseas'}</div>
    <div style="font-size:10px;color:var(--muted);margin-bottom:2px">Soma do que já foi pedido nas 11 lojas nesta semana — use pra saber quanto pedir na próxima.</div>
    ${corpo}
  </div>`;
}

// ── URGÊNCIA (raio) — compartilhada com o app Lojas ────────────────────────
// gn_lojas_pedido usa slug_pedido (ex.: 'boulevard'); o app Lojas guarda a urgência em
// gn_lojas.all_data.urgenciaTemplate, chaveado pelo "loja" dele (ex.: 'BOULEVARD', o
// mesmo userKey de GN_LOJAS). Esse mapa traduz um pro outro pra marcar/ler no lugar certo.
const LOJA_USERKEY_BY_SLUG = Object.fromEntries((window.GN_LOJAS || []).map(l => [l.lojaSlug, l.userKey]));

// Loja fictícia de teste (mesma usada nos outros apps) — não fica gravada em
// gn_lojas_pedido de propósito, pra nunca entrar em S.lojas (que alimenta o pedido
// consolidado enviado pro fornecedor, os totais em modo TODOS e as provisões geradas
// ao confirmar). Só é oferecida como opção via lojasComTeste(), nos seletores de loja
// específica (aba por loja, carnes, trios) — nunca no modo "TODOS".
const LOJA_TESTE_PEDIDO = { slug_pedido: 'loja_teste', nome_display: 'Loja Teste' };
function lojasComTeste() { return [...S.lojas, LOJA_TESTE_PEDIDO]; }

async function carregarUrgenciaTemplate() {
  const userKeys = [...new Set(Object.values(LOJA_USERKEY_BY_SLUG))];
  if (!userKeys.length) return;
  try {
    const { data } = await db.from('gn_lojas').select('loja,all_data').in('loja', userKeys);
    (data || []).forEach(row => {
      S.urgenciaTemplate[row.loja] = (row.all_data && row.all_data.urgenciaTemplate && row.all_data.urgenciaTemplate[row.loja]) || [];
    });
  } catch (e) {}
}

// Marca/desmarca manualmente um item como urgência pra uma loja — grava direto na mesma
// gn_lojas.all_data.urgenciaTemplate que o app Lojas lê, então aparece de lá também.
async function toggleUrgenciaPedido(itemId, lojaSlug) {
  const userKey = LOJA_USERKEY_BY_SLUG[lojaSlug];
  if (!userKey) { toast('Esta loja não tem urgência configurada.', 'err'); return; }
  const idStr = String(itemId);
  const atual = S.urgenciaTemplate[userKey] ? [...S.urgenciaTemplate[userKey]] : [];
  const idx = atual.indexOf(idStr);
  if (idx >= 0) atual.splice(idx, 1); else atual.push(idStr);
  S.urgenciaTemplate[userKey] = atual;
  renderPedido();
  try {
    const { data } = await db.from('gn_lojas').select('all_data').eq('loja', userKey);
    const allData = (data && data[0] && data[0].all_data) || {};
    allData.urgenciaTemplate = { [userKey]: atual };
    if (data && data.length) {
      await db.from('gn_lojas').update({ all_data: allData }).eq('loja', userKey);
    } else {
      await db.from('gn_lojas').insert({ loja: userKey, all_data: allData });
    }
  } catch (e) {
    toast('Erro ao salvar urgência.', 'err');
  }
}

function _pedidoItemUrgente(prod, lojaSlug) {
  const idStr = String(prod.item_id);
  if (lojaSlug) {
    const uk = LOJA_USERKEY_BY_SLUG[lojaSlug];
    return !!uk && (S.urgenciaTemplate[uk] || []).includes(idStr);
  }
  return S.lojas.some(l => {
    const uk = LOJA_USERKEY_BY_SLUG[l.slug_pedido];
    return uk && (S.urgenciaTemplate[uk] || []).includes(idStr);
  });
}

function _pedidoItemPreenchido(prod, lojaSlug) {
  if (lojaSlug) return (S.pedidoItens[prod.id]?.[lojaSlug]?.qtd || 0) > 0;
  return S.lojas.some(l => (S.pedidoItens[prod.id]?.[l.slug_pedido]?.qtd || 0) > 0);
}

// Filtro de fornecedor ativo — isolado por aba só pra Oseas (ver fornFiltroOseas). As
// demais abas (Pedido geral, Edu, Matheus) continuam compartilhando S.fornFiltro.
function _fornFiltroAtivo() { return S.oseasAtivo ? S.fornFiltroOseas : S.fornFiltro; }
function _setFornFiltroAtivo(v) { if (S.oseasAtivo) S.fornFiltroOseas = v; else S.fornFiltro = v; }

// ═══════════════════════════════════════════════
// RENDER: PEDIDO
// ═══════════════════════════════════════════════
function renderPedido() {
  // Início/fim (ISO) da semana ativa — usado pra destacar em verde quando a contagem
  // (Est.vig) foi feita DENTRO dessa semana, e não é um saldo carregado de outra semana.
  const { monISO: _semAtivaMonISO, sunISO: _semAtivaSunISO } = _semanaAtivaBounds();

  const sem = formatarSemana(S.semanaAtiva);
  const mondayHoje = getMondayOfWeek();
  const podeAvancar = S.semanaAtiva < mondayHoje;

  // Barra de semana (sempre visível)
  const semNavHtml = `
    <div class="semana-nav">
      <button class="semana-nav-arrow" onclick="navegarSemana(-1)" title="Semana anterior">‹</button>
      <div class="semana-info">
        <div class="semana-label">SEMANA ${sem.num} · ${sem.ano}</div>
        <div class="semana-periodo">${sem.periodo}</div>
        ${sem.ehAtual ? '<div class="semana-atual-badge">▶ SEMANA ATUAL</div>' : '<div class="semana-atual-badge" style="color:var(--muted)">semana passada</div>'}
      </div>
      <button class="semana-nav-arrow" onclick="navegarSemana(1)" ${podeAvancar?'':'disabled'} title="Próxima semana">›</button>
    </div>
    ${!sem.ehAtual?`<div style="text-align:center;margin-bottom:6px"><button onclick="irParaSemanaAtual()" style="padding:5px 16px;border-radius:20px;border:1px solid var(--primary);background:rgba(232,88,10,.1);color:var(--text);font-size:11px;font-weight:700;cursor:pointer">▶ Ir para semana atual</button></div>`:''}`;

  if (!S.pedidoAtual) {
    $('content').innerHTML = semNavHtml + _datasEspeciaisCardHtml() + _vendaSemanaAntCardHtml() + `
      <div class="empty" style="margin-top:20px">
        <div class="empty-icon">📋</div>
        <div class="empty-texto">Nenhum pedido nesta semana</div>
      </div>`;
    return;
  }

  const statusChip = {
    'RASCUNHO': '<span class="chip chip-rascunho">RASCUNHO</span>',
    'CONFIRMADO': '<span class="chip chip-confirmado">CONFIRMADO</span>',
    'ENVIADO': '<span class="chip chip-enviado">ENVIADO</span>',
  }[S.pedidoAtual.status] || '';

  const totalGeral = totalPedidoGeral();
  const totalItensGeral = S.todosModo
    ? S.lojas.reduce((sum,l)=>sum+contarItensLoja(l.slug_pedido),0)
    : contarItensLoja(S.lojaAtiva);

  // Grupos únicos do catálogo ativo (na aba Edu/Oseas/Matheus, só os grupos com itens
  // dos fornecedores daquela aba — ver _fornecedorNoEscopoAtivo)
  const grupos = [...new Set(S.catalogo.filter(p=>p.ativo && _fornecedorNoEscopoAtivo(p.fornecedor)).map(p=>p.grupo))].sort();
  const busca   = S.busca.toLowerCase();
  const lojaAtiva = S.lojaAtiva;

  // ── Toggle Modo ──
  const toggleModo = `
    <div class="toggle-modo">
      <button class="toggle-modo-btn${!S.todosModo?' ativo':''}" onclick="setModo(false)">POR LOJA</button>
      <button class="toggle-modo-btn${S.todosModo?' ativo':''}" onclick="setModo(true)">TODOS</button>
    </div>`;

  // ── Store Tabs (só no modo POR LOJA) ──
  const storeTabs = !S.todosModo ? lojasComTeste().map(l => {
    const n = contarItensLoja(l.slug_pedido);
    return `<button class="store-tab${lojaAtiva===l.slug_pedido?' ativo':''}"
      onclick="selecionarLoja('${l.slug_pedido}')">
      ${l.nome_display}${n>0?`<span class="contagem">(${n})</span>`:''}
    </button>`;
  }).join('') : '';

  // ── Produtos filtrados ──
  function prodsFiltrados(grupo) {
    let lista = S.catalogo.filter(p =>
      p.ativo && p.grupo === grupo &&
      _fornecedorNoEscopoAtivo(p.fornecedor) &&
      (!S.grupoFiltro || p.grupo === S.grupoFiltro) &&
      (!_fornFiltroAtivo() || p.fornecedor === _fornFiltroAtivo()) &&
      (!busca || p.produto.toLowerCase().includes(busca) || p.fornecedor.toLowerCase().includes(busca))
    );
    const lojaFiltro = S.todosModo ? null : lojaAtiva;
    if (S.pedFiltro === 'vazios') lista = lista.filter(p => !_pedidoItemPreenchido(p, lojaFiltro));
    else if (S.pedFiltro === 'preenchidos') lista = lista.filter(p => _pedidoItemPreenchido(p, lojaFiltro));
    else if (S.pedFiltro === 'urgencia') lista = lista.filter(p => _pedidoItemUrgente(p, lojaFiltro));
    return lista;
  }

  // ── MODO: POR LOJA ──
  function renderGruposPorLoja() {
    return grupos.map(grupo => {
      const prods = prodsFiltrados(grupo);
      if (prods.length === 0) return '';
      const fors = [...new Set(prods.map(p=>p.fornecedor))].sort();
      const aberto = S.gruposAbertos.has(grupo);

      const fornsHtml = fors.map(forn => {
        const pp = prods.filter(p => p.fornecedor === forn);
        const rowsHtml = pp.map(prod => {
          const contagem = S.contagens[prod.id]?.[lojaAtiva];
          const itemAtual = S.pedidoItens[prod.id]?.[lojaAtiva];
          const qtdAtual  = itemAtual?.qtd ?? 0;
          const divAtual  = itemAtual?.diverg ?? false;
          const semanaAtual = itemAtual?.entregaSemana ?? false;
          const jaPedido  = (S.pedidosConfirmados[prod.id]?.[lojaAtiva] ?? 0) > 0;
          const dash = '<span style="color:var(--muted)">—</span>';
          const { estAnt, estVig, estVigCx, estVigUnd } = _estAntVigEfetivo(contagem, _semAtivaMonISO, _semAtivaSunISO);
          const estAntFator = prod.und_por_caixa > 1 ? prod.und_por_caixa : null;
          // Est.ant não tem quebra própria salva (é herdado do histórico, não digitado
          // agora) — deriva Cx/Und pelo fator, no mesmo formato do Est.vig, só pra exibir
          // os dois badges de forma consistente.
          const estAntCxUndTxt = (estAnt != null && estAntFator)
            ? _fmtEstVigBreakdown(Math.floor(estAnt / estAntFator), estAnt - Math.floor(estAnt / estAntFator) * estAntFator, prod.und)
            : '';
          const ulEstDisp = estAnt != null
            ? `<span class="val">${fmtQtd(estAnt)}${estAntCxUndTxt}</span>` : dash;
          const provAntQtd = S.provisaoAnterior[prod.id]?.[lojaAtiva];
          const provAntDisp = provAntQtd != null
            ? `<span class="val">${fmtQtd(provAntQtd)}</span>` : dash;
          // Espelho do que a loja digitou em Cx/Und no app Lojas (Est. Atual) — exatamente
          // como foi digitado, não uma decomposição estimada. Some quando não existir
          // (contagem antiga, anterior a essa quebra) e cai pro total simples de sempre.
          const estVigCxUndTxt = (estVigCx != null || estVigUnd != null)
            ? _fmtEstVigBreakdown(estVigCx, estVigUnd, prod.und) : '';
          // Sem contagem nenhuma essa semana mostra "0" em vez de traço — pra não deixar
          // dúvida se o item foi esquecido ou realmente não tem contagem registrada.
          const estVigDisp = estVig != null
            ? `<span class="val" style="color:#1A1D23;font-weight:700">✓ ${fmtQtd(estVig)}${estVigCxUndTxt}</span>` : `<span class="val">0</span>`;
          const contInfoTxt = _contagemInfoTxt(contagem);
          const contInfoBtn = contInfoTxt
            ? `<span onclick="event.stopPropagation();mostrarInfoContagem('${prod.id}','${lojaAtiva}')" title="${contInfoTxt.replace(/"/g,'&quot;')}" style="cursor:pointer;opacity:.7">🕒</span>` : '';
          const corrigirBtn = `<span onclick="event.stopPropagation();corrigirEstVig('${prod.id}','${lojaAtiva}','${prod.produto.replace(/'/g,"\\'")}')" title="Corrigir Est.vig" style="cursor:pointer;opacity:.7">✏️</span>`;
          const isUrgente = _pedidoItemUrgente(prod, lojaAtiva);
          const prodConfirmado = S.fornecedoresConfirmados.has(prod.fornecedor) && !S.fornecedoresReabertos.has(prod.fornecedor);
          const fator = prod.und_por_caixa > 1 ? prod.und_por_caixa : null;
          // O campo Pedido é sempre um número simples — a quebra Cx/Und real (quando
          // existe fator) aparece só como espelho, visual, no Est.vig (ver estVigDisp).
          const qtyCtrlHtml = `<div class="qty-ctrl">
                <button class="qty-btn" onclick="ajustarQtd('${prod.id}','${lojaAtiva}',${prod.custo||0},-1)" ${prodConfirmado?'disabled':''}>−</button>
                <input class="qty-input" type="text" inputmode="decimal" min="0"
                  value="${qtdAtual||''}" placeholder="0" ${prodConfirmado?'disabled':''}
                  oninput="qtdChanged('${prod.id}','${lojaAtiva}',${prod.custo||0},this.value)"
                  onchange="qtdChanged('${prod.id}','${lojaAtiva}',${prod.custo||0},this.value,true)"
                  onblur="qtdChanged('${prod.id}','${lojaAtiva}',${prod.custo||0},this.value,true)"
                  onkeydown="nextInput(event,this)">
                <button class="qty-btn" onclick="ajustarQtd('${prod.id}','${lojaAtiva}',${prod.custo||0},1)" ${prodConfirmado?'disabled':''}>+</button>
              </div>`;
          return `<div class="prod-row${divAtual?' diverg-ativo':jaPedido?' ja-pedido':''}" data-cid="${prod.id}" data-loja="${lojaAtiva}">
            <div class="prod-info">
              <div class="prod-nome" title="${prod.produto}">${prod.produto}</div>
              <div class="prod-meta">
                <span class="prod-und">${prod.und}</span>
                ${prod.custo?`<span class="prod-custo num">R$${fmt(prod.custo)}</span>`:''}
                <span class="prod-est">Est.ant: ${ulEstDisp}</span>
                <span class="prod-prov" title="Provisionado pelo Compras na semana anterior, independente de entrada de nota">Prov.ant: ${provAntDisp}</span>
                <span class="prod-vig">Est.vig: ${estVigDisp} ${contInfoBtn}${corrigirBtn}</span>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:0">
              ${qtyCtrlHtml}
              <button class="diverg-btn${divAtual?' ativo':''}" title="Marcar divergência na contagem" onclick="toggleDiverg('${prod.id}','${lojaAtiva}')">⚑</button>
              <button class="urg-btn${isUrgente?' ativo':''}${isUrgente&&prodConfirmado?' finalizada':''}" title="${isUrgente?(prodConfirmado?'Urgência — fornecedor já confirmado':'Urgência — remover'):'Marcar como urgência'}" onclick="toggleUrgenciaPedido('${prod.item_id}','${lojaAtiva}')">⚡</button>
              <button class="semana-btn${semanaAtual?' ativo':''}" title="${semanaAtual?'Entrega ainda essa semana — remover':'Forçar entrega ainda essa semana (sem avisar a loja como urgência)'}" onclick="toggleEntregaSemana('${prod.id}','${lojaAtiva}')">📅</button>
            </div>
          </div>`;
        }).join('');
        const fornConfirmadoBadge = S.fornecedoresReabertos.has(forn)
          ? ' <span style="color:#1A1D23;font-weight:700">🔓 nova rodada (pedido anterior já confirmado)</span>'
          : S.fornecedoresConfirmados.has(forn)
            ? ` <span style="color:#1A1D23;font-weight:700">✓ confirmado</span> <span onclick="event.stopPropagation();reverterConfirmacaoFornecedor('${forn.replace(/'/g,"\\'")}')" title="Reverter confirmação (voltar a editar)" style="cursor:pointer;font-size:11px;color:#1A1D23;font-weight:700">↩️ Reverter</span>`
            : '';
        return `<div><div class="forn-header">${forn}${fornConfirmadoBadge}</div>${rowsHtml}</div>`;
      }).join('');

      const totalItens = prods.reduce((n,p)=>n+(S.pedidoItens[p.id]?.[lojaAtiva]?.qtd>0?1:0),0);
      return `<div class="grupo-bloco${aberto?' aberto':''}" id="grupo-${grupo.replace(/[^a-z0-9]/gi,'_')}">
        <div class="grupo-header" onclick="toggleGrupo('${grupo}')">
          <span class="grupo-nome">${grupo}</span>
          <div style="display:flex;align-items:center;gap:8px">
            ${totalItens>0?`<span class="grupo-qtd num">${totalItens} item${totalItens>1?'s':''}</span>`:''}
            <svg class="grupo-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>
        <div class="grupo-body">${fornsHtml}</div>
      </div>`;
    }).join('');
  }

  // ── MODO: TODOS ──
  function renderGruposTodos() {
    return grupos.map(grupo => {
      const prods = prodsFiltrados(grupo);
      if (prods.length === 0) return '';
      const fors = [...new Set(prods.map(p=>p.fornecedor))].sort();
      const aberto = S.gruposAbertos.has(grupo);

      const fornsHtml = fors.map(forn => {
        const pp = prods.filter(p => p.fornecedor === forn);
        const cardsHtml = pp.map(prod => {
          const prodConfirmado = S.fornecedoresConfirmados.has(prod.fornecedor) && !S.fornecedoresReabertos.has(prod.fornecedor);
          const fator = prod.und_por_caixa > 1 ? prod.und_por_caixa : null;
          const totalProd = S.lojas.reduce((sum, l) => {
            const qtd = S.pedidoItens[prod.id]?.[l.slug_pedido]?.qtd || 0;
            return sum + qtd * (prod.custo || 0);
          }, 0);
          const totalQtd = S.lojas.reduce((sum, l) => sum + (S.pedidoItens[prod.id]?.[l.slug_pedido]?.qtd || 0), 0);

          const lojasHtml = S.lojas.map(loja => {
            const contagem = S.contagens[prod.id]?.[loja.slug_pedido];
            const itemLoja  = S.pedidoItens[prod.id]?.[loja.slug_pedido];
            const qtdL = itemLoja?.qtd ?? 0;
            const divL = itemLoja?.diverg ?? false;
            const ulPedQtd = (S.pedidosConfirmados[prod.id]?.[loja.slug_pedido] ?? 0);
            const dsh = '<span style="opacity:.35">—</span>';
            const { estAnt: estAntL, estVig: estVigL, estVigCx: estVigCxL, estVigUnd: estVigUndL } = _estAntVigEfetivo(contagem, _semAtivaMonISO, _semAtivaSunISO);
            const antCxUndTxtL = (estAntL != null && fator)
              ? _fmtEstVigBreakdown(Math.floor(estAntL / fator), estAntL - Math.floor(estAntL / fator) * fator, prod.und)
              : '';
            const ulEstV = estAntL != null ? `<span class="v">${fmtQtd(estAntL)}${antCxUndTxtL}</span>` : dsh;
            const provAntQtdL = S.provisaoAnterior[prod.id]?.[loja.slug_pedido];
            const provAntVL = provAntQtdL != null ? `<span class="v">${fmtQtd(provAntQtdL)}</span>` : dsh;
            const vigCxUndTxtL = (estVigCxL != null || estVigUndL != null)
              ? _fmtEstVigBreakdown(estVigCxL, estVigUndL, prod.und) : '';
            // Sem contagem nenhuma essa semana mostra "0" em vez de traço — mesmo motivo
            // do modo "por loja".
            const vigV   = estVigL != null ? `<span class="v" style="color:#1A1D23;font-weight:700">✓${fmtQtd(estVigL)}${vigCxUndTxtL}</span>` : `<span class="v">0</span>`;
            const subT = qtdL > 0 ? `<span class="v">R$${fmt(qtdL*(prod.custo||0))}</span>` : '';
            const isUrgenteL = _pedidoItemUrgente(prod, loja.slug_pedido);
            const semanaL = itemLoja?.entregaSemana ?? false;
            const contInfoTxtL = _contagemInfoTxt(contagem);
            const contInfoBtnL = contInfoTxtL
              ? `<span onclick="event.stopPropagation();mostrarInfoContagem('${prod.id}','${loja.slug_pedido}')" title="${contInfoTxtL.replace(/"/g,'&quot;')}" style="cursor:pointer;opacity:.7">🕒</span>` : '';
            const corrigirBtnL = `<span onclick="event.stopPropagation();corrigirEstVig('${prod.id}','${loja.slug_pedido}','${prod.produto.replace(/'/g,"\\'")}')" title="Corrigir Est.vig" style="cursor:pointer;opacity:.7">✏️</span>`;
            const qtyCtrlSmHtml = `<div class="qty-ctrl-sm">
                  <button class="qty-btn-sm" onclick="ajustarQtd('${prod.id}','${loja.slug_pedido}',${prod.custo||0},-1)" ${prodConfirmado?'disabled':''}>−</button>
                  <input class="qty-input-sm" type="text" inputmode="decimal" min="0"
                    value="${qtdL||''}" placeholder="0" ${prodConfirmado?'disabled':''}
                    oninput="qtdChanged('${prod.id}','${loja.slug_pedido}',${prod.custo||0},this.value)"
                    onchange="qtdChanged('${prod.id}','${loja.slug_pedido}',${prod.custo||0},this.value,true)"
                    onblur="qtdChanged('${prod.id}','${loja.slug_pedido}',${prod.custo||0},this.value,true)"
                    onkeydown="nextInput(event,this)">
                  <button class="qty-btn-sm" onclick="ajustarQtd('${prod.id}','${loja.slug_pedido}',${prod.custo||0},1)" ${prodConfirmado?'disabled':''}>+</button>
                </div>`;
            return `<div class="todos-loja-row${divL?' diverg-ativo':ulPedQtd>0?' ja-pedido':''}" data-cid="${prod.id}" data-loja="${loja.slug_pedido}">
              <span class="todos-loja-nome">${loja.nome_display}</span>
              <span class="todos-loja-est">Est.ant:${ulEstV}</span>
              <span class="todos-loja-prov" title="Provisionado pelo Compras na semana anterior, independente de entrada de nota">Prov.ant:${provAntVL}</span>
              <span class="todos-loja-vig">Est.vig:${vigV}${contInfoBtnL}${corrigirBtnL}</span>
              <div style="display:flex;align-items:center;gap:0">
                ${qtyCtrlSmHtml}
                <button class="diverg-btn${divL?' ativo':''}" style="width:22px;height:22px;font-size:10px" title="Marcar divergência" onclick="toggleDiverg('${prod.id}','${loja.slug_pedido}')">⚑</button>
                <button class="urg-btn${isUrgenteL?' ativo':''}${isUrgenteL&&prodConfirmado?' finalizada':''}" style="width:22px;height:22px;font-size:10px" title="${isUrgenteL?(prodConfirmado?'Urgência — fornecedor já confirmado':'Urgência — remover'):'Marcar como urgência'}" onclick="toggleUrgenciaPedido('${prod.item_id}','${loja.slug_pedido}')">⚡</button>
                <button class="semana-btn${semanaL?' ativo':''}" style="width:22px;height:22px;font-size:10px" title="${semanaL?'Entrega ainda essa semana — remover':'Forçar entrega ainda essa semana'}" onclick="toggleEntregaSemana('${prod.id}','${loja.slug_pedido}')">📅</button>
              </div>
              ${subT?`<span class="todos-loja-total">${subT}</span>`:''}
            </div>`;
          }).join('');

          return `<div class="todos-prod-card">
            <div class="todos-prod-header">
              <div class="todos-prod-nome">${prod.produto}</div>
              <div class="todos-prod-custo num">${prod.custo?`R$${fmt(prod.custo)}`:''} <span style="color:var(--muted);font-size:10px">${prod.und}</span></div>
            </div>
            <div class="todos-lojas-grid">${lojasHtml}</div>
            ${totalQtd>0?`<div class="todos-prod-total">
              <span style="color:var(--muted);font-size:11px">Total: <span style="font-family:Consolas;color:var(--text)">${totalQtd} ${prod.und}</span></span>
              <span class="num" style="font-size:12px;font-weight:700">R$ ${fmt(totalProd)}</span>
            </div>`:''}
          </div>`;
        }).join('');

        const fornConfirmadoBadgeT = S.fornecedoresReabertos.has(forn)
          ? ' <span style="color:#1A1D23;font-weight:700">🔓 nova rodada (pedido anterior já confirmado)</span>'
          : S.fornecedoresConfirmados.has(forn)
            ? ` <span style="color:#1A1D23;font-weight:700">✓ confirmado</span> <span onclick="event.stopPropagation();reverterConfirmacaoFornecedor('${forn.replace(/'/g,"\\'")}')" title="Reverter confirmação (voltar a editar)" style="cursor:pointer;font-size:11px;color:#1A1D23;font-weight:700">↩️ Reverter</span>`
            : '';
        return `<div><div class="forn-header">${forn}${fornConfirmadoBadgeT}</div>${cardsHtml}</div>`;
      }).join('');

      const totalItensGrupo = prods.reduce((n,p) => {
        return n + S.lojas.reduce((m,l) => m+(S.pedidoItens[p.id]?.[l.slug_pedido]?.qtd>0?1:0),0);
      },0);

      return `<div class="grupo-bloco${aberto?' aberto':''}" id="grupo-${grupo.replace(/[^a-z0-9]/gi,'_')}">
        <div class="grupo-header" onclick="toggleGrupo('${grupo}')">
          <span class="grupo-nome">${grupo}</span>
          <div style="display:flex;align-items:center;gap:8px">
            ${totalItensGrupo>0?`<span class="grupo-qtd num">${totalItensGrupo} item${totalItensGrupo>1?'s':''}</span>`:''}
            <svg class="grupo-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>
        <div class="grupo-body">${fornsHtml}</div>
      </div>`;
    }).join('');
  }

  const gruposHtml = S.todosModo ? renderGruposTodos() : renderGruposPorLoja();
  const totalLoja  = S.totaisPorLoja[lojaAtiva] || 0;
  const lojaDisplay = S.lojas.find(l=>l.slug_pedido===lojaAtiva)?.nome_display || '';
  // Na aba Edu/Oseas/Matheus, os botões de envio (por fornecedor e "Geral"/PDF) só
  // consideram os fornecedores daquela aba — mesma regra usada na listagem de itens.
  const fornsComItens = [...new Set(
    S.catalogo.filter(p=>p.ativo).filter(prod=>_fornecedorNoEscopoAtivo(prod.fornecedor)).filter(prod=>
      S.todosModo
        ? S.lojas.some(l=>(S.pedidoItens[prod.id]?.[l.slug_pedido]?.qtd||0)>0)
        : (S.pedidoItens[prod.id]?.[lojaAtiva]?.qtd||0)>0
    ).map(p=>p.fornecedor)
  )].sort();

  // Fornecedores com itens em QUALQUER loja (para relatórios pós-confirmação)
  const fornsTodasLojas = [...new Set(
    S.catalogo.filter(p=>p.ativo).filter(prod=>_fornecedorNoEscopoAtivo(prod.fornecedor)).filter(prod=>
      S.lojas.some(l=>(S.pedidoItens[prod.id]?.[l.slug_pedido]?.qtd||0)>0)
    ).map(p=>p.fornecedor)
  )].sort();

  const _lojaFiltroUrg = S.todosModo ? null : lojaAtiva;
  const _idsEscopoAtivo = new Set(S.catalogo.filter(p=>_fornecedorNoEscopoAtivo(p.fornecedor)).map(p=>String(p.id)));
  const _urgEscopo = ids => (ids||[]).filter(id=>_idsEscopoAtivo.has(String(id))).length;
  const urgTotal = _lojaFiltroUrg
    ? _urgEscopo(S.urgenciaTemplate[LOJA_USERKEY_BY_SLUG[_lojaFiltroUrg]])
    : S.lojas.reduce((sum,l)=>sum+_urgEscopo(S.urgenciaTemplate[LOJA_USERKEY_BY_SLUG[l.slug_pedido]]),0);

  // Na aba Edu/Oseas/Matheus, o botão "Confirmar" só considera (e mostra pendência de)
  // fornecedores dessa aba — evita confirmar por engano os do outro comprador.
  const escopoAtivoBar = S.eduAtivo || S.oseasAtivo || S.matheusAtivo;
  const fornsPendentes = fornsTodasLojas.filter(f =>
    (!S.fornecedoresConfirmados.has(f) || S.fornecedoresReabertos.has(f)) && (!escopoAtivoBar || _fornecedorNoEscopoAtivo(f)));
  const labelAba = S.eduAtivo ? ' · 👤 EDU ('+EDU_FORNECEDORES.join('/')+')' : S.oseasAtivo ? ' · 👤 OSEAS ('+OSEAS_FORNECEDORES.join('/')+')' : S.matheusAtivo ? ' · 👤 MATHEUS' : '';

  // Indicador da loja selecionada, dentro do cabeçalho (que já é sticky/fixo de verdade —
  // o app não tem uma área de rolagem própria, quem rola é a página toda, então um card
  // "sticky" solto no meio do conteúdo não fica fixo). Fica sempre visível ao rolar a
  // lista de produtos, sem depender de a loja iterar; some no modo "Todas as lojas".
  const hdrLojaEl = document.getElementById('header-loja-ativa');
  if (hdrLojaEl) {
    if (!S.todosModo && lojaAtiva) {
      document.getElementById('header-loja-ativa-nome').textContent = '📍 ' + lojaDisplay;
      const nItens = contarItensLoja(lojaAtiva);
      document.getElementById('header-loja-ativa-info').textContent = `${nItens} item${nItens!==1?'s':''} · R$ ${fmt(totalLoja)}`;
      hdrLojaEl.style.display = 'flex';
    } else {
      hdrLojaEl.style.display = 'none';
    }
  }

  $('content').innerHTML = semNavHtml + _datasEspeciaisCardHtml() + _vendaSemanaAntCardHtml() + `
    <div class="pedido-bar">
      <div class="pedido-info">
        <div class="pedido-label">PEDIDO${labelAba}</div>
        <div class="pedido-valor">${statusChip} &nbsp;<span style="font-size:11px;color:var(--muted)">Semana ${_fmtDDMM(_semAtivaMonISO)} – ${_fmtDDMM(_semAtivaSunISO)}</span></div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">${S.todosModo ? 'Total geral' : lojaDisplay} : <span class="num" id="hdr-total">${S.todosModo ? `R$ ${fmt(totalGeral)}` : `R$ ${fmt(totalLoja)}`}</span> · <span style="color:var(--text)">${totalItensGeral} item${totalItensGeral!==1?'s':''}</span></div>
      </div>
      <div class="pedido-acoes">
        <button class="btn-sm btn-outline" onclick="novoPedido()" title="${escopoAtivoBar?'Limpa só os itens desta aba — não afeta quem ainda está lançando':'Cancela o rascunho inteiro e começa do zero'}">${escopoAtivoBar?'Novo Pedido':'Novo'}</button>
        <button class="btn-sm" onclick="flushPendingItems(true)" title="Forçar salvamento agora" style="background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.4);color:#1A1D23">💾 Salvar</button>
        <button class="btn-sm" onclick="gerarWppPedido()" style="background:rgba(37,211,102,.15);border:1px solid rgba(37,211,102,.4);color:#1A1D23">📲</button>
        <button class="btn-sm" onclick="gerarPDFPedido()" style="background:rgba(192,57,43,.15);border:1px solid rgba(192,57,43,.4);color:#1A1D23">📄</button>
        <button class="btn-sm" onclick="enviarPDFPedidoWpp()" title="Enviar PDF pelo WhatsApp" style="background:rgba(37,211,102,.15);border:1px solid rgba(37,211,102,.4);color:#1A1D23">📄📲</button>
        ${fornsPendentes.length > 0 ? `
          <button class="btn-sm btn-success" onclick="confirmarPedido()">✓ Confirmar${S.fornecedoresConfirmados.size>0?` (${fornsPendentes.length} pend.)`:''}</button>
        ` : ''}
        ${S.fornecedoresConfirmados.size > 0 ? `
          <button class="btn-sm btn-orange" onclick="verProvisoes()">Ver Provisões</button>
        ` : ''}
      </div>
    </div>

    ${_fornecedoresRevertidosAlertHtml()}
    ${_totalCompradorSemanaCardHtml()}

    ${toggleModo}
    ${!S.todosModo ? `<div class="store-tabs-wrap">
      <button class="store-tabs-arrow" onclick="_scrollStoreTabs('storeTabsPedido',-1)" aria-label="Lojas anteriores">‹</button>
      <div class="store-tabs" id="storeTabsPedido">${storeTabs}</div>
      <button class="store-tabs-arrow" onclick="_scrollStoreTabs('storeTabsPedido',1)" aria-label="Próximas lojas">›</button>
    </div>` : ''}

    <div class="filtros">
      <input class="filtro-input" type="search" placeholder="🔍 Buscar produto..."
        value="${S.busca}" oninput="_buscaPedido(this)">
      <select class="filtro-select" onchange="S.grupoFiltro=this.value;renderPedido()">
        <option value="">Todos grupos</option>
        ${grupos.map(g=>`<option value="${g}"${S.grupoFiltro===g?' selected':''}>${g}</option>`).join('')}
      </select>
      <select class="filtro-select" onchange="_setFornFiltroAtivo(this.value);renderPedido()">
        <option value="">Todos fornec.</option>
        ${[...new Set(S.catalogo.filter(p=>p.ativo && _fornecedorNoEscopoAtivo(p.fornecedor)).map(p=>p.fornecedor))].sort().map(f=>`<option value="${esc(f)}"${_fornFiltroAtivo()===f?' selected':''}>${esc(f)}</option>`).join('')}
      </select>
    </div>

    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px">
      ${urgTotal>0 ? `
      <button onclick="S.pedFiltro=(S.pedFiltro==='urgencia'?'':'urgencia');renderPedido()"
        style="background:${S.pedFiltro==='urgencia'?'#b45309':'var(--card2)'};border:none;border-radius:10px;padding:5px 10px;color:${S.pedFiltro==='urgencia'?'#fff':'var(--muted)'};font-size:11px;font-weight:700;cursor:pointer">
        ⚡ Urg (${urgTotal})
      </button>` : ''}
      <button onclick="S.pedFiltro=(S.pedFiltro==='vazios'?'':'vazios');renderPedido()"
        style="background:${S.pedFiltro==='vazios'?'#6366f1':'var(--card2)'};border:none;border-radius:10px;padding:5px 10px;color:${S.pedFiltro==='vazios'?'#fff':'var(--muted)'};font-size:11px;font-weight:700;cursor:pointer">
        ⬜ Vazios
      </button>
      <button onclick="S.pedFiltro=(S.pedFiltro==='preenchidos'?'':'preenchidos');renderPedido()"
        style="background:${S.pedFiltro==='preenchidos'?'#34d399':'var(--card2)'};border:none;border-radius:10px;padding:5px 10px;color:${S.pedFiltro==='preenchidos'?'#1e293b':'var(--muted)'};font-size:11px;font-weight:700;cursor:pointer">
        ✓ Preench
      </button>
    </div>

    <div style="display:flex;justify-content:flex-end;gap:6px;margin-bottom:6px">
      <button class="btn-sm btn-outline" onclick="expandirTodos()" style="padding:5px 10px;font-size:11px">↕ Expandir todos</button>
      <button class="btn-sm btn-outline" onclick="fecharTodos()" style="padding:5px 10px;font-size:11px">↕ Fechar todos</button>
    </div>

    <div id="grupos-lista">${gruposHtml}</div>

    ${S.todosModo ? `
      <div class="loja-total">
        <div>
          <div style="font-size:11px;color:var(--muted)">TOTAL GERAL — TODAS AS LOJAS</div>
          <div style="font-size:10px;color:var(--muted)">${Object.values(S.totaisPorLoja).filter(v=>v>0).length} lojas com itens</div>
        </div>
        <div class="loja-total-val num" id="total-loja">R$ ${fmt(totalGeral)}</div>
      </div>` : `
      <div class="loja-total">
        <div>
          <div style="font-size:11px;color:var(--muted)">TOTAL — ${lojaDisplay}</div>
          <div style="font-size:10px;color:var(--muted)">${contarItensLoja(lojaAtiva)} itens com pedido</div>
        </div>
        <div class="loja-total-val num" id="total-loja">R$ ${fmt(totalLoja)}</div>
      </div>`}

    ${fornsComItens.length ? `
    <div style="margin-top:10px">
      <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:7px;letter-spacing:.5px">📲 Enviar por WhatsApp / PDF</div>
      <div style="display:flex;flex-wrap:wrap;gap:7px">
        <button onclick="gerarWppPedido()" style="background:rgba(37,211,102,.2);border:1px solid rgba(37,211,102,.5);border-radius:11px;padding:10px 16px;color:#1A1D23;font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px">📲 Geral</button>
        <button onclick="gerarPDFPedido()" style="background:rgba(192,57,43,.15);border:1px solid rgba(192,57,43,.4);border-radius:11px;padding:10px 16px;color:#1A1D23;font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px">📄 PDF</button>
        <button onclick="enviarPDFPedidoWpp()" style="background:rgba(37,211,102,.2);border:1px solid rgba(37,211,102,.5);border-radius:11px;padding:10px 16px;color:#1A1D23;font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px">📄📲 PDF no Whats</button>
        ${fornsComItens.map(f=>`<button onclick="gerarWppPedidoForn('${f.replace(/'/g,"\\'")}')" style="background:rgba(37,211,102,.08);border:1px solid rgba(37,211,102,.3);border-radius:11px;padding:10px 13px;color:#1A1D23;font-weight:700;font-size:11px;display:flex;align-items:center;gap:5px">📦 ${f}</button>`).join('')}
      </div>
    </div>` : ''}

    ${fornsTodasLojas.length ? `
    <div style="margin-top:14px;border-top:1px solid var(--border);padding-top:14px">
      <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:10px;letter-spacing:.5px">📋 Relatórios para Fornecedores — Todas as Lojas</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(232,88,10,.08);border:1px solid rgba(232,88,10,.25);border-radius:10px">
          <span style="flex:1;font-size:12px;font-weight:700;color:var(--text)">Pedido Completo — Todas as Lojas</span>
          <button onclick="gerarWppFornAllLojas(null)" style="background:rgba(37,211,102,.2);border:1px solid rgba(37,211,102,.5);border-radius:8px;padding:6px 12px;color:#1A1D23;font-weight:700;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:4px">📲 WPP</button>
