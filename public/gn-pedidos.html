  const hoje = new Date().toISOString().slice(0, 10);
  const lojaOpts = lojasComTeste().map(l =>
    `<option value="${l.slug_pedido}"${p.loja===l.slug_pedido?' selected':''}>${l.nome_display}</option>`
  ).join('');
  const TRIOS_KNOWN = Object.keys(TRIOS_CACHES).filter((k,i,arr)=>arr.indexOf(k)===i).sort();
  const trioOpts = TRIOS_KNOWN.map(k =>
    `<option value="${k}"${p.artista===k?' selected':''}>${k}</option>`
  ).join('');
  $('modal-box').innerHTML = `
    <div class="modal-titulo">Nova apresentação <button class="modal-close" onclick="fecharModal(event)">×</button></div>
    <div class="form-group">
      <label class="form-label">DATA</label>
      <input type="date" id="trio-f-data" class="form-input" value="${p.data||hoje}">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">INÍCIO</label>
        <input type="time" id="trio-f-hi" class="form-input" value="${p.horario_inicio||'13:00'}">
      </div>
      <div class="form-group">
        <label class="form-label">FIM</label>
        <input type="time" id="trio-f-hf" class="form-input" value="${p.horario_fim||'17:00'}">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">LOJA</label>
      <select id="trio-f-loja" class="form-select"><option value="">Selecione a loja</option>${lojaOpts}</select>
    </div>
    <div class="form-group">
      <label class="form-label">TRIO / ARTISTA</label>
      <select id="trio-f-artista-sel" class="form-select" onchange="_triosArtistaSelChange()">
        <option value="">Selecione o trio</option>
        ${trioOpts}
        <option value="__outro__"${p.artista && !TRIOS_KNOWN.includes(p.artista) ? ' selected' : ''}>+ Outro (digitar nome)</option>
      </select>
      <input type="text" id="trio-f-artista" class="form-input" placeholder="Nome do trio ou artista"
        style="margin-top:6px;display:${p.artista && !TRIOS_KNOWN.includes(p.artista) ? '' : 'none'}"
        value="${p.artista||''}" oninput="_triosAutoCache()">
    </div>
    <div class="form-group">
      <label class="form-label">CACHÊ (R$)</label>
      <input type="number" id="trio-f-cache" class="form-input" placeholder="0,00" step="50" min="0" value="${p.cache||''}">
    </div>
    <div class="modal-acoes">
      <button class="btn-sm btn-outline" onclick="fecharModal(event)">Cancelar</button>
      <button class="btn-sm btn-orange" onclick="_triosSalvarNovo()">Salvar</button>
    </div>`;
  $('modal-bg').classList.add('ativo');
}

function _triosArtistaSelChange() {
  const sel = document.getElementById('trio-f-artista-sel');
  const inp = document.getElementById('trio-f-artista');
  if (!sel || !inp) return;
  if (sel.value === '__outro__') {
    inp.style.display = '';
    inp.value = '';
    inp.focus();
  } else {
    inp.style.display = 'none';
    inp.value = sel.value;
    _triosAutoCache();
  }
}

function _triosAutoCache() {
  const artista = document.getElementById('trio-f-artista')?.value || '';
  const cache = _triosCacheFor(artista);
  const el = document.getElementById('trio-f-cache');
  if (el && cache > 0 && !el.value) el.value = cache;
}

async function _triosSalvarNovo(id) {
  const data = document.getElementById('trio-f-data')?.value;
  const hi   = document.getElementById('trio-f-hi')?.value;
  const hf   = document.getElementById('trio-f-hf')?.value;
  const loja = document.getElementById('trio-f-loja')?.value;
  const artista = document.getElementById('trio-f-artista')?.value?.trim();
  const cache = parseFloat(document.getElementById('trio-f-cache')?.value) || 0;
  if (!data || !loja || !artista) { toast('Preencha data, loja e artista.', 'err'); return; }
  const payload = { data, horario_inicio: hi||null, horario_fim: hf||null, loja, artista, cache };
  try {
    let err;
    if (id) {
      ({ error: err } = await db.from('gn_trios_agenda').update(payload).eq('id', id));
    } else {
      ({ error: err } = await db.from('gn_trios_agenda').insert(payload));
    }
    if (err) throw err;
    toast(id ? '✓ Apresentação atualizada!' : '✓ Apresentação cadastrada!', 'ok');
    fecharModal({ target: document.getElementById('modal-bg') });
    renderTrios();
  } catch(e) {
    toast('Erro: ' + (e.message || e), 'err');
  }
}

function _triosEditarModal(id) {
  const r = S.triosData.find(x => x.id === id);
  if (!r) return;
  _triosNovoModal(r);
  // Substituir ação do botão Salvar
  const btn = document.querySelector('#modal-box .btn-orange');
  if (btn) btn.onclick = () => _triosSalvarNovo(id);
  document.querySelector('#modal-box .modal-titulo').childNodes[0].textContent = 'Editar apresentação ';
}

function _triosImportarModal() {
  $('modal-box').innerHTML = `
    <div class="modal-titulo">Importar agenda <button class="modal-close" onclick="fecharModal(event)">×</button></div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.5">
      Cole o texto da agenda no formato de WhatsApp. O sistema detecta as datas, horários, lojas e trios automaticamente.
    </div>
    <div class="form-group">
      <label class="form-label">ANO DE REFERÊNCIA</label>
      <input type="number" id="trio-imp-ano" class="form-input" value="${new Date().getFullYear()}" min="2024" max="2030">
    </div>
    <div class="form-group">
      <label class="form-label">TEXTO DA AGENDA</label>
      <textarea id="trio-imp-texto" style="width:100%;height:200px;background:var(--card2);border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px;color:var(--text);font-size:12px;outline:none;resize:vertical;font-family:inherit" placeholder="Cole aqui o texto copiado do WhatsApp..."></textarea>
    </div>
    <div id="trio-imp-preview" style="display:none;margin-bottom:10px"></div>
    <div class="modal-acoes">
      <button class="btn-sm btn-outline" onclick="_triosImportarPreview()">Visualizar</button>
      <button class="btn-sm btn-orange" id="trio-imp-btn" disabled onclick="_triosImportarConfirmar()">Importar</button>
    </div>`;
  $('modal-bg').classList.add('ativo');
  window._triosImportParsed = [];
}

function _triosImportarPreview() {
  const texto = document.getElementById('trio-imp-texto')?.value || '';
  const ano = parseInt(document.getElementById('trio-imp-ano')?.value) || new Date().getFullYear();
  const parsed = _triosParseAgenda(texto, ano);
  window._triosImportParsed = parsed;
  const btn = document.getElementById('trio-imp-btn');
  const prev = document.getElementById('trio-imp-preview');
  if (!parsed.length) {
    prev.style.display = '';
    prev.innerHTML = `<div style="color:var(--text);font-size:12px">Nenhuma apresentação identificada. Verifique o formato do texto.</div>`;
    if (btn) btn.disabled = true;
    return;
  }
  const linhas = parsed.map(r => {
    const lojaDisplay = S.lojas.find(l => l.slug_pedido === r.loja)?.nome_display || r.loja_raw;
    return `<div style="font-size:11px;padding:3px 0;border-bottom:1px solid var(--border)">
      <span style="color:var(--text)">${r.data}</span>
      <span style="color:var(--muted);margin:0 4px">${r.horario_inicio}–${r.horario_fim}</span>
      <span style="color:var(--text)">${lojaDisplay}</span>
      <span style="margin-left:6px">${r.artista}</span>
      ${r.cache ? `<span style="color:var(--text);margin-left:4px">R$ ${r.cache}</span>` : ''}
    </div>`;
  }).join('');
  prev.style.display = '';
  prev.innerHTML = `
    <div style="font-size:11px;color:var(--text);font-weight:700;margin-bottom:6px">${parsed.length} apresentações encontradas</div>
    <div style="max-height:150px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--rs);padding:8px">${linhas}</div>`;
  if (btn) btn.disabled = false;
}

async function _triosImportarConfirmar() {
  const parsed = window._triosImportParsed || [];
  if (!parsed.length) return;
  const btn = document.getElementById('trio-imp-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Importando...'; }
  try {
    const rows = parsed.map(r => ({
      data: r.data,
      horario_inicio: r.horario_inicio,
      horario_fim: r.horario_fim,
      loja: r.loja,
      artista: r.artista,
      cache: r.cache || 0,
      confirmado: false,
    }));
    const { error } = await db.from('gn_trios_agenda').insert(rows);
    if (error) throw error;
    toast(`✓ ${rows.length} apresentações importadas!`, 'ok');
    fecharModal({ target: document.getElementById('modal-bg') });
    renderTrios();
  } catch(e) {
    toast('Erro na importação: ' + (e.message || e), 'err');
    if (btn) { btn.disabled = false; btn.textContent = 'Importar'; }
  }
}

function _triosParseAgenda(texto, ano) {
  // Mapeamento de nomes de lojas do texto para slug_pedido
  const LOJA_MAP = [
    { re: /bang[uú]\s+shopping|bang[uú]/i, slug: 'bangu' },
    { re: /boulevard/i, slug: 'boulevard' },
    { re: /nova\s+am[eé]rica/i, slug: 'nova_america' },
    { re: /caxias/i, slug: 'caxias' },
    { re: /s[aã]o\s+gon[cç]alo/i, slug: 'sao_goncalo' },
    { re: /itaquera|metr[oô]\s+itaquera/i, slug: 'itaquera' },
    { re: /guarulhos/i, slug: 'guarulhos' },
    { re: /nova\s+igua[cç][uú]|nova\s+igua[cç]u/i, slug: 'nova_iguacu' },
    { re: /norte\s+shopping|norte/i, slug: 'norte' },
    { re: /campo\s+grande/i, slug: 'campo_grande' },
  ];

  function normalizeLoja(texto) {
    for (const m of LOJA_MAP) {
      if (m.re.test(texto)) {
        return S.lojas.find(l => l.slug_pedido === m.slug || l.nome_display?.toLowerCase().includes(m.slug.replace('_',' ')))?.slug_pedido || m.slug;
      }
    }
    // Fallback: buscar pelo nome display
    const match = S.lojas.find(l => l.nome_display && texto.toLowerCase().includes(l.nome_display.toLowerCase().split(' ')[0].toLowerCase()));
    return match?.slug_pedido || null;
  }

  const result = [];
  const linhas = texto.split('\n').map(l => l.trim()).filter(Boolean);

  let dataAtual = null;
  let horaIni = null;
  let horaFim = null;
  const MESES = {
    janeiro:1, fevereiro:2, março:3, marco:3, abril:4, maio:5, junho:6,
    julho:7, agosto:8, setembro:9, outubro:10, novembro:11, dezembro:12
  };

  for (const linha of linhas) {
    // Linha de data + horário: "Sábado dia 01/08 das 13 as 17 horas"
    const mData = linha.match(/(\d{1,2})\/(\d{1,2})\s+das?\s+(\d{1,2})\s*as?\s+(\d{1,2})/i);
    if (mData) {
      const dia = mData[1].padStart(2,'0');
      const mes = mData[2].padStart(2,'0');
      dataAtual = `${ano}-${mes}-${dia}`;
      horaIni = mData[3].padStart(2,'0') + ':00';
      horaFim = mData[4].padStart(2,'0') + ':00';
      continue;
    }
    // Linha de data alternativa: "Sexta feira dia 07/08 das 19 as 23 horas"
    const mData2 = linha.match(/dia\s+(\d{1,2})\/(\d{1,2})\s+das?\s+(\d{1,2})/i);
    if (mData2 && !mData) {
      const dia = mData2[1].padStart(2,'0');
      const mes = mData2[2].padStart(2,'0');
      dataAtual = `${ano}-${mes}-${dia}`;
      const horaMatch = linha.match(/das?\s+(\d{1,2})\s*as?\s+(\d{1,2})/i);
      if (horaMatch) { horaIni = horaMatch[1].padStart(2,'0')+':00'; horaFim = horaMatch[2].padStart(2,'0')+':00'; }
      continue;
    }

    if (!dataAtual) continue;

    // Linha de apresentação: "Shopping Boulevard - Trio Silvas do Forró"
    const mApres = linha.match(/^(.+?)\s*[-–—]\s*(.+)$/);
    if (mApres) {
      const lojaRaw = mApres[1].trim();
      const artista = mApres[2].trim();
      const loja = normalizeLoja(lojaRaw);
      if (loja && artista && artista.length > 2) {
        const cache = _triosCacheFor(artista);
        result.push({ data: dataAtual, horario_inicio: horaIni, horario_fim: horaFim, loja, loja_raw: lojaRaw, artista, cache });
      }
    }
  }
  return result;
}

async function init() {
  try {
    const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    if (s && Date.now() - s.ts < TTL && s.permissoes && (s.permissoes.pedidos || s.permissoes.master)) {
      await iniciarApp();
      return;
    }
  } catch(e) {}
  $('splash').style.display = 'none';
  $('login').classList.add('ativo');
}

window.addEventListener('offline', () => {
  const b = $('offline-banner'), t = $('offline-banner-txt');
  if (b) { b.style.display = ''; if (t) t.textContent = 'Sem conexão — alterações serão sincronizadas ao reconectar.'; }
});
window.addEventListener('online', () => {
  flushPendingItems(false);
});
// O evento 'online' do navegador nem sempre dispara de forma confiável em conexões
// instáveis (comum em Wi-Fi de loja) — sem isso, uma falha de sincronização podia
// deixar o banner "alterações offline" preso pra sempre, sem nova tentativa automática.
setInterval(() => { if (_ppCount() > 0) flushPendingItems(false); }, 25000);
// $('header-data') só era escrito uma vez, no login (iniciarApp) — quem deixa a aba
// aberta durante a virada do dia (comum em tablet/computador de loja) ficava vendo a
// data de ontem no cabeçalho, mesmo com o resto do app já operando no dia novo.
setInterval(() => { const el = $('header-data'); if (el) el.textContent = hojeDisplay(); }, 60000);

init();
</script>
