}

async function renderHistorico() {
  $('content').innerHTML = '<div class="empty"><div class="spin"></div></div>';

  let rows = [];
  try {
    const { data, error } = await db.from('gn_auditoria_pedidos')
      .select('*').order('criado_em', { ascending: false }).limit(150);
    if (error) throw error;
    rows = data || [];
  } catch (e) {
    $('content').innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-texto">Erro ao carregar histórico</div></div>`;
    return;
  }

  const filtroAcao = S.histAcaoFiltro || '';
  const rowsFiltradas = filtroAcao ? rows.filter(r => r.acao === filtroAcao) : rows;

  const itensHtml = rowsFiltradas.length === 0
    ? `<div class="empty" style="padding:30px 0"><div class="empty-icon">📜</div><div class="empty-texto">Nenhum registro ainda</div></div>`
    : rowsFiltradas.map(r => {
        const meta = HISTORICO_ACOES[r.acao] || { icon: '•', label: r.acao, cor: 'var(--muted)' };
        const dt = new Date(r.criado_em).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
        const detalheStr = _formatarDetalhesAuditoria(r.acao, r.detalhes);
        return `<div class="prov-item">
          <div style="flex:1;min-width:0">
            <div style="font-size:12px;font-weight:700;color:${meta.cor}">${meta.icon} ${meta.label}</div>
            ${detalheStr?`<div style="font-size:11px;color:var(--text);margin-top:2px">${detalheStr}</div>`:''}
            <div style="font-size:10px;color:var(--muted);margin-top:3px">👤 ${r.usuario||'—'} · ${dt}</div>
          </div>
        </div>`;
      }).join('');

  const opcoesAcao = Object.entries(HISTORICO_ACOES).map(([k,v]) =>
    `<option value="${k}"${filtroAcao===k?' selected':''}>${v.icon} ${v.label}</option>`).join('');

  $('content').innerHTML = `
    <div class="sec-header">
      <div class="sec-titulo">Histórico de Ações <span class="badge badge-r">${rowsFiltradas.length}</span></div>
      <button onclick="renderHistorico()" style="padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:none;color:var(--muted);font-size:11px;cursor:pointer">↻ Atualizar</button>
    </div>
    <div class="filtros">
      <select class="filtro-select" onchange="S.histAcaoFiltro=this.value;renderHistorico()">
        <option value="">Todas as ações</option>
        ${opcoesAcao}
      </select>
    </div>
    <div style="font-size:11px;color:var(--muted);margin:6px 0 12px">Últimos ${rows.length} registros.</div>
    ${itensHtml}
  `;
}

// ═══════════════════════════════════════════════
// RENDER: PRODUÇÃO (controle de estoque dos itens do fornecedor PETISCOS)
// ═══════════════════════════════════════════════
// Margem 2, Sexta e Entrada são digitados à mão, e valem só pra semana selecionada
// (mesmo padrão de navegação por semana já usado em Provisões). Estoque NÃO é
// digitado — é sempre calculado pela mesma fórmula da planilha original: Sexta
// (contagem que abre a semana) + Entrada (produzido) − Saída. Saída soma TODAS as
// provisões de PETISCOS com entrega prevista na semana (qualquer status, menos
// CANCELADO) — não só as ainda pendentes, pra bater tanto na semana atual quanto
// numa semana passada já toda recebida.
//
// O estoque de domingo vira o ponto de partida da semana seguinte: na primeira vez
// que uma semana é aberta (sem registro ainda), o Sexta e a Margem 2 são semeados a
// partir do resultado (Sexta+Entrada−Saída) e da Margem 2 da semana anterior — e já
// gravados, pra não precisar repetir esse cálculo indefinidamente pra trás a cada
// nova semana (mesma ideia do _seedInicialFromPrevWeek do Livro Caixa/Carnes).
//
// "Contagem" mostra a quantidade lançada na aba Pedido pra essa mesma semana (antes
// mesmo de o fornecedor ser confirmado) — filtrável por loja ou somada em "Todas as
// lojas", pelos chips no topo.
// Produção foi zerada (Entrada/Contagem Sexta) pra recomeçar do zero — Saída segue o
// mesmo espírito: a semana em que isso aconteceu fica sem Saída contabilizada, e o
// controle passa a valer de verdade a partir da semana seguinte em diante.
const PRODUCAO_SAIDA_INICIO = '2026-08-10';

async function _producaoDadosSemana(ids, semanaMonday) {
  const monday = semanaMonday.toISOString().split('T')[0];
  const sunday = getSundayOfWeek(semanaMonday).toISOString().split('T')[0];
  if (monday < PRODUCAO_SAIDA_INICIO) {
    const baseRes = await db.from('gn_producao_estoque').select('*').eq('semana_inicio', monday).in('catalogo_id', ids);
    if (baseRes.error) throw baseRes.error;
    const baseMap = {};
    (baseRes.data||[]).forEach(r => { baseMap[r.catalogo_id] = r; });
    return { baseMap, saidaMap: {}, saidaPorLoja: {} };
  }
  const [baseRes, saida] = await Promise.all([
    db.from('gn_producao_estoque').select('*').eq('semana_inicio', monday).in('catalogo_id', ids),
    _fetchTodasPaginas(() => db.from('gn_provisoes').select('catalogo_id,qtd_prevista,loja_slug')
      .eq('fornecedor','PETISCOS').neq('status','CANCELADO')
      .gte('data_entrega', monday).lte('data_entrega', sunday)
      .in('catalogo_id', ids)),
  ]);
  if (baseRes.error) throw baseRes.error;
  const baseMap = {};
  (baseRes.data||[]).forEach(r => { baseMap[r.catalogo_id] = r; });
  const saidaMap = {};
  // Saída por loja — pro campo que mostra quanto foi só pra loja selecionada na aba
  // Produção, sem mudar o Estoque Real (que é do estoque central, soma de todas as lojas).
  const saidaPorLoja = {};
  (saida||[]).forEach(p => {
    const qtd = parseFloat(p.qtd_prevista) || 0;
    saidaMap[p.catalogo_id] = (saidaMap[p.catalogo_id]||0) + qtd;
    if (!saidaPorLoja[p.catalogo_id]) saidaPorLoja[p.catalogo_id] = {};
    saidaPorLoja[p.catalogo_id][p.loja_slug] = (saidaPorLoja[p.catalogo_id][p.loja_slug]||0) + qtd;
  });
  return { baseMap, saidaMap, saidaPorLoja };
}

async function renderProducao(silent) {
  // Preserva a posição de rolagem entre re-renders — ao salvar um campo, a
  // tela recarrega inteira (pra refletir Estoque Real/Saída na hora) e sem
  // isso o scroll sempre voltava pro topo, perdendo o lugar do item editado.
  const _contentEl = $('content');
  const _scrollAnterior = _contentEl ? _contentEl.scrollTop : 0;
  // silent=true (refresh depois de salvar um campo) mantém a tela atual visível
  // enquanto busca os dados novos, em vez de apagar tudo pra um spinner — sem
  // isso a tela "piscava" pro topo (conteúdo sumia por inteiro) e só voltava ao
  // lugar certo quando a busca terminava, alguns instantes depois — mesmo com o
  // scrollTop já sendo restaurado corretamente no fim.
  if (!silent) $('content').innerHTML = '<div class="empty"><div class="spin"></div></div>';

  const produtos = S.catalogo.filter(p => p.ativo && p.fornecedor === 'PETISCOS')
    .sort((a,b) => (a.item_id||0) - (b.item_id||0));

  if (!produtos.length) {
    $('content').innerHTML = `<div class="empty"><div class="empty-icon">🏭</div><div class="empty-texto">Nenhum produto ativo do fornecedor PETISCOS no catálogo</div></div>`;
    return;
  }
  const ids = produtos.map(p => p.id);

  const semAtiva = S.producaoSemana || getMondayOfWeek();
  const monday = semAtiva.toISOString().split('T')[0];
  const sunday = getSundayOfWeek(semAtiva).toISOString().split('T')[0];
  const semAnterior = datePlusWeeks(semAtiva, -1);

  let baseMap = {}, saidaMap = {}, saidaPorLoja = {}, pedidoItensSemana = [];
  try {
    const { data: pedidosSemana } = await db.from('gn_pedidos').select('id')
      .or(`semana_inicio.eq.${monday},and(data_pedido.gte.${monday},data_pedido.lte.${sunday})`);
    const pedidoIds = (pedidosSemana || []).map(p => p.id);

    const [atual, anterior, itensSem] = await Promise.all([
      _producaoDadosSemana(ids, semAtiva),
      _producaoDadosSemana(ids, semAnterior),
      pedidoIds.length
        ? _fetchTodasPaginas(() => db.from('gn_pedido_itens').select('catalogo_id,loja_slug,qtd_pedida')
            .in('pedido_id', pedidoIds).in('catalogo_id', ids))
        : Promise.resolve([]),
    ]);
    baseMap = atual.baseMap; saidaMap = atual.saidaMap; saidaPorLoja = atual.saidaPorLoja; pedidoItensSemana = itensSem || [];

    // Semeia (só quando ainda não existe registro nesta semana) o Sexta a partir do
    // resultado final da semana anterior, e a Margem 2 também é herdada — só preenche
    // quem ainda está em branco, nunca sobrescreve o que já foi editado nesta semana.
    const rowsSeed = [];
    produtos.forEach(prod => {
      if (baseMap[prod.id]) return;
      const prevBase = anterior.baseMap[prod.id];
      const prevSexta = prevBase ? parseFloat(prevBase.sexta)||0 : 0;
      const prevEntrada = prevBase ? parseFloat(prevBase.entrada)||0 : 0;
      const prevSaida = anterior.saidaMap[prod.id] || 0;
      const estoqueAnterior = prevBase ? (prevSexta + prevEntrada - prevSaida) : 0;
      const row = {
        catalogo_id: prod.id, semana_inicio: monday,
        margem2: prevBase ? (parseFloat(prevBase.margem2)||0) : 0,
        sexta: estoqueAnterior, entrada: 0,
        atualizado_em: new Date().toISOString(),
      };
      rowsSeed.push(row);
      baseMap[prod.id] = row;
    });
    if (rowsSeed.length) {
      try { await db.from('gn_producao_estoque').upsert(rowsSeed, { onConflict: 'catalogo_id,semana_inicio' }); }
      catch (e) { console.error('Erro semeando Produção da semana:', e.message||e); }
    }
  } catch (e) {
    $('content').innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-texto">Erro ao carregar Produção</div></div>`;
    return;
  }

  const contagemMap = {};
  pedidoItensSemana.forEach(it => {
    if (S.producaoLoja && it.loja_slug !== S.producaoLoja) return;
    const qtd = parseFloat(it.qtd_pedida) || 0;
    if (qtd <= 0) return;
    contagemMap[it.catalogo_id] = (contagemMap[it.catalogo_id]||0) + qtd;
  });

  const lojaTabs = [{ slug_pedido:'', nome_display:'Todas as lojas' }, ...S.lojas].map(l =>
    `<button class="store-tab${S.producaoLoja===l.slug_pedido?' ativo':''}" onclick="S.producaoLoja='${l.slug_pedido}';renderProducao()">${l.nome_display}</button>`
  ).join('');

  const _semFmt = formatarSemana(semAtiva);
  const _semNavHtml = `
    <div style="display:flex;align-items:center;justify-content:space-between;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:7px 10px;margin-bottom:10px;gap:8px">
      <button onclick="_navegarSemanaProducao(-1)" style="background:rgba(0,0,0,.07);border:1px solid var(--border);border-radius:8px;padding:5px 12px;color:var(--text);font-size:16px;cursor:pointer">←</button>
      <div style="text-align:center;flex:1">
        <div style="font-size:12px;font-weight:800;color:var(--text)">Semana ${_semFmt.num}${_semFmt.ehAtual?' · <span style="color:#1A1D23;font-size:11px">Atual</span>':''}</div>
        <div style="font-size:11px;color:var(--muted)">${_semFmt.periodo}</div>
      </div>
      <button onclick="_navegarSemanaProducao(1)" style="background:rgba(0,0,0,.07);border:1px solid var(--border);border-radius:8px;padding:5px 12px;color:${_semFmt.ehAtual?'var(--muted)':'var(--text)'};font-size:16px;cursor:pointer;opacity:${_semFmt.ehAtual?'.35':'1'}" ${_semFmt.ehAtual?'disabled':''}>→</button>
    </div>`;

  const lojaLabelAtual = S.producaoLoja ? (S.lojas.find(l=>l.slug_pedido===S.producaoLoja)?.nome_display||S.producaoLoja) : 'todas';

  const rowsData = [];
  let linhasHtml;

  if (S.producaoLoja) {
    // Visão por loja: só o que foi pra ela — produto + quantidade enviada (a Saída
    // gerada pelo pedido). Sem Margem/Entrada/Contagem Sexta/Estoque Real, que são
    // dados centrais e não fazem sentido do ponto de vista de uma única loja.
    const enviados = produtos
      .map(prod => ({ produto: prod.produto, qtd: (saidaPorLoja[prod.id]||{})[S.producaoLoja] || 0 }))
      .filter(e => e.qtd > 0);
    enviados.forEach(e => rowsData.push(e));
    linhasHtml = enviados.length
      ? enviados.map(e => `<div class="prov-item" style="padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px">
          <div style="font-size:12px;font-weight:700;color:var(--text)">${e.produto}</div>
          <div style="font-size:14px;font-weight:800;color:#1A1D23;white-space:nowrap">${fmtQtd(e.qtd)} enviado${e.qtd>1?'s':''}</div>
        </div>`).join('')
      : `<div class="empty"><div class="empty-icon">📦</div><div class="empty-texto">Nenhum item enviado pra ${lojaLabelAtual} nesta semana</div></div>`;
  } else {
    linhasHtml = produtos.map(prod => {
      const base = baseMap[prod.id] || {};
      const margem2 = parseFloat(base.margem2)||0;
      const sexta = parseFloat(base.sexta)||0;
      const entrada = parseFloat(base.entrada)||0;
      const saida = saidaMap[prod.id] || 0;
      const contagem = contagemMap[prod.id] || 0;
      // Mesma fórmula da planilha original: Estoque = Sexta + Entrada − Saída. Não é
      // digitado — sempre recalculado, pra Entrada (e Saída) refletirem na hora.
      const estoqueAtual = sexta + entrada - saida;
      const abaixoMargem = margem2 > 0 && estoqueAtual < margem2;
      // Estoque Real x Margem: azul quando bate certinho, verde quando sobra, vermelho
      // quando falta — mesmo critério usado no banner de divergência abaixo.
      const corEstoque = margem2<=0 ? 'var(--text)' : estoqueAtual===margem2 ? '#60a5fa' : estoqueAtual>margem2 ? '#4ade80' : '#ef4444';
      // Divergência do Estoque Real (já com a Entrada somada) em relação à Margem —
      // recalculada toda vez que a Entrada é preenchida, pra mostrar o que de fato
      // ainda está sobrando ou faltando depois do que já chegou.
      const diffMargem = margem2 > 0 ? estoqueAtual - margem2 : 0;

      rowsData.push({ produto: prod.produto, margem2, estoqueAtual, sexta, entrada, saida, contagem, diffMargem, abaixoMargem });

      const campoEdit = (label, campoNome, valor) => `
        <div>
          <div style="font-size:9px;color:var(--muted);text-transform:uppercase;margin-bottom:2px;text-align:center">${label}</div>
          <input type="number" step="1" class="form-input" style="padding:5px 2px;font-size:12px;text-align:center"
            value="${valor}" onchange="salvarProducaoCampo('${prod.id}','${campoNome}',this.value)">
        </div>`;
      const campoView = (label, valor, cor, sub) => `
        <div>
          <div style="font-size:9px;color:var(--muted);text-transform:uppercase;margin-bottom:2px;text-align:center">${label}</div>
          <div style="padding:5px 2px;font-size:12px;text-align:center;font-weight:700;color:${cor}">${fmtQtd(valor)}</div>
          ${sub ? `<div style="font-size:9px;text-align:center;color:var(--muted)">${sub}</div>` : ''}
        </div>`;

      // Ordem pedida: Margem (mantém a atual) → Entrada → Contagem Sexta → Saída → Estoque Real.
      return `<div class="prov-item" data-produto="${escapeHtml(prod.produto)}" style="padding:10px 12px;border-left:3px solid ${abaixoMargem?'#ef4444':'transparent'}">
        <div style="font-size:12px;font-weight:700;color:var(--text);margin-bottom:8px">${prod.produto}${abaixoMargem?' <span style="color:#1A1D23;font-size:10px;font-weight:700">⚠️ abaixo da margem</span>':''}</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px">
          ${campoEdit('Margem','margem2', margem2)}
          ${campoEdit('Entrada','entrada', entrada)}
          ${campoEdit('Contagem Sexta','sexta', sexta)}
        </div>
        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px">
          ${campoView('Saída', saida, saida>0?'#fbbf24':'var(--muted)')}
          ${campoView('Estoque Real', estoqueAtual, corEstoque)}
        </div>
        ${contagem>0 ? `<div style="margin-top:6px;font-size:9px;color:var(--muted);text-align:center">Qtd. pedida na semana: ${fmtQtd(contagem)}</div>` : ''}
        ${margem2<=0 ? '' : diffMargem===0
          ? `<div style="margin-top:8px;padding:6px 8px;background:rgba(96,165,250,.1);border:1px solid rgba(96,165,250,.35);border-radius:6px;font-size:11px;color:#1A1D23;font-weight:700">🔵 Bateu a margem certinho</div>`
          : diffMargem>0
            ? `<div style="margin-top:8px;padding:6px 8px;background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.35);border-radius:6px;font-size:11px;color:#1A1D23;font-weight:700">🟢 ${fmtQtd(diffMargem)} a mais que a margem</div>`
            : `<div style="margin-top:8px;padding:6px 8px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35);border-radius:6px;font-size:11px;color:#1A1D23;font-weight:700">🔴 Faltam ${fmtQtd(-diffMargem)} pra bater a margem</div>`}
      </div>`;
    }).join('');
  }

  // Cache pros geradores de relatório (WhatsApp/PDF) lerem sem precisar refazer a busca —
  // reflete exatamente o que está na tela (semana e loja selecionadas).
  S._producaoCache = { semFmt: _semFmt, lojaLabel: lojaLabelAtual, porLoja: !!S.producaoLoja, rows: rowsData };

  // Busca só faz sentido na visão com todos os produtos (na visão por loja a
  // lista já vem filtrada só com o que foi enviado, geralmente bem curta).
  const buscaHtml = !S.producaoLoja ? `
    <div style="margin-bottom:10px">
      <input type="text" list="producao-produtos-list" id="producao-busca" placeholder="🔍 Buscar produto e ir até ele..."
        onchange="_irParaProdutoProducao(this.value)"
        style="width:100%;box-sizing:border-box;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:12px">
      <datalist id="producao-produtos-list">${produtos.map(p=>`<option value="${escapeHtml(p.produto)}">`).join('')}</datalist>
    </div>` : '';

  $('content').innerHTML = `
    <div class="sec-header">
      <div class="sec-titulo">🏭 Produção</div>
      <button onclick="renderProducao()" style="padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:none;color:var(--muted);font-size:11px;cursor:pointer">↻ Atualizar</button>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
      <button onclick="gerarWppProducao()" style="background:rgba(37,211,102,.12);border:1px solid rgba(37,211,102,.3);border-radius:6px;padding:5px 10px;color:#1A1D23;font-size:11px;font-weight:700;cursor:pointer">📲 WhatsApp</button>
      <button onclick="gerarPDFProducao()" style="background:rgba(192,57,43,.12);border:1px solid rgba(192,57,43,.3);border-radius:6px;padding:5px 10px;color:#1A1D23;font-size:11px;font-weight:700;cursor:pointer">📄 PDF</button>
      <button onclick="enviarPDFProducaoWpp()" title="Enviar PDF pelo WhatsApp" style="background:rgba(37,211,102,.12);border:1px solid rgba(37,211,102,.3);border-radius:6px;padding:5px 10px;color:#1A1D23;font-size:11px;font-weight:700;cursor:pointer">📄📲 PDF no Whats</button>
    </div>
    ${_semNavHtml}
    <div class="store-tabs-wrap" style="margin-bottom:12px">
      <button class="store-tabs-arrow" onclick="_scrollStoreTabs('storeTabsProducao',-1)" aria-label="Lojas anteriores">‹</button>
      <div class="store-tabs" id="storeTabsProducao">${lojaTabs}</div>
      <button class="store-tabs-arrow" onclick="_scrollStoreTabs('storeTabsProducao',1)" aria-label="Próximas lojas">›</button>
    </div>
    ${buscaHtml}
    <div style="font-size:11px;color:var(--muted);margin-bottom:12px">
      ${S.producaoLoja
        ? `Mostrando só o que foi enviado pra ${lojaLabelAtual} nesta semana (Saída gerada pelo pedido).`
        : `Estoque Real = Contagem Sexta + Entrada − Saída (soma de todas as lojas). O Estoque Real de domingo já entra automaticamente como a Contagem Sexta da semana seguinte. 🔵 bateu a margem · 🟢 acima da margem · 🔴 abaixo da margem.`}
    </div>
    ${linhasHtml}
  `;

  if (_contentEl) _contentEl.scrollTop = _scrollAnterior;
}

// Pula até o card do produto buscado no seletor do topo e dá um destaque
// visual rápido, pra ficar claro onde a busca caiu.
function _irParaProdutoProducao(nome) {
  const input = $('producao-busca');
  if (!nome) return;
  const el = document.querySelector(`.prov-item[data-produto="${CSS.escape(nome)}"]`);
  if (!el) { toast('Produto não encontrado', 'err'); return; }
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.style.transition = 'background-color .4s';
  el.style.backgroundColor = 'rgba(96,165,250,.18)';
  setTimeout(() => { el.style.backgroundColor = ''; }, 1400);
  if (input) input.value = '';
}

// Texto plano (sem markdown) compartilhado entre o PDF "normal" (impressão) e o PDF
// anexado no WhatsApp — mesmo padrão de _pedidoMsgETitulo().
function _producaoRelatorioTexto() {
  const cache = S._producaoCache;
  if (!cache || !cache.rows.length) return null;
  const { semFmt, lojaLabel, rows, porLoja } = cache;
  let msg = `PRODUÇÃO — ${lojaLabel}\nSemana ${semFmt.num} (${semFmt.periodo})\n`;
  if (porLoja) {
    rows.forEach(r => { msg += `\n${r.produto}: ${fmtQtd(r.qtd)} enviado${r.qtd>1?'s':''}\n`; });
    return { msg, titulo: `Produção — ${lojaLabel} — Semana ${semFmt.num}` };
  }
  rows.forEach(r => {
    msg += `\n${r.produto}\n`;
    msg += `  Margem: ${fmtQtd(r.margem2)} | Entrada: ${fmtQtd(r.entrada)} | Contagem Sexta: ${fmtQtd(r.sexta)}\n`;
    msg += `  Saída: ${fmtQtd(r.saida)} | Estoque Real: ${fmtQtd(r.estoqueAtual)}${r.abaixoMargem ? ' (abaixo da margem)' : ''}\n`;
    if (r.contagem > 0) msg += `  Qtd. pedida na semana: ${fmtQtd(r.contagem)}\n`;
    if (r.margem2 > 0) {
      if (r.diffMargem === 0) msg += `  Bateu a margem certinho\n`;
      else if (r.diffMargem > 0) msg += `  ${fmtQtd(r.diffMargem)} a mais que a margem\n`;
      else msg += `  Faltam ${fmtQtd(-r.diffMargem)} pra bater a margem\n`;
    }
  });
  return { msg, titulo: `Produção — ${lojaLabel} — Semana ${semFmt.num}` };
}

function gerarWppProducao() {
  const cache = S._producaoCache;
  if (!cache || !cache.rows.length) { toast('Nenhum item de produção pra enviar.', 'err'); return; }
  const { semFmt, lojaLabel, rows, porLoja } = cache;
  let msg = `🏭 *PRODUÇÃO — ${lojaLabel}*\nSemana ${semFmt.num} (${semFmt.periodo})\n`;
  if (porLoja) {
    rows.forEach(r => { msg += `\n📦 *${r.produto}*: ${fmtQtd(r.qtd)} enviado${r.qtd>1?'s':''}\n`; });
    window.open('https://wa.me/?text=' + encodeURIComponent(msg));
    return;
  }
  const abaixoMargem = rows.filter(r => r.abaixoMargem);
  rows.forEach(r => {
    const icon = r.abaixoMargem ? '⚠️' : '✅';
    msg += `\n${icon} *${r.produto}*\n`;
    msg += `  Margem: ${fmtQtd(r.margem2)} | Entrada: ${fmtQtd(r.entrada)} | Contagem Sexta: ${fmtQtd(r.sexta)}\n`;
    msg += `  Saída: ${fmtQtd(r.saida)} | Estoque Real: ${fmtQtd(r.estoqueAtual)}\n`;
    if (r.contagem > 0) msg += `  Qtd. pedida na semana: ${fmtQtd(r.contagem)}\n`;
    if (r.margem2 > 0) {
      if (r.diffMargem === 0) msg += `  🔵 Bateu a margem certinho\n`;
      else if (r.diffMargem > 0) msg += `  🟢 ${fmtQtd(r.diffMargem)} a mais que a margem\n`;
      else msg += `  🔴 Faltam *${fmtQtd(-r.diffMargem)}* pra bater a margem\n`;
    }
  });
  if (abaixoMargem.length) msg += `\n⚠️ *${abaixoMargem.length} produto${abaixoMargem.length>1?'s':''} abaixo da margem*`;
  window.open('https://wa.me/?text=' + encodeURIComponent(msg));
}

function gerarPDFProducao() {
  const r = _producaoRelatorioTexto();
  if (!r) { toast('Nenhum item de produção pra enviar.', 'err'); return; }
  gerarPDF(r.msg, r.titulo);
}

async function enviarPDFProducaoWpp() {
  const r = _producaoRelatorioTexto();
  if (!r) { toast('Nenhum item de produção pra enviar.', 'err'); return; }
  await _compartilharPdfWpp(r.msg, r.titulo);
}

async function _navegarSemanaProducao(delta) {
  const nova = datePlusWeeks(S.producaoSemana || getMondayOfWeek(), delta);
  if (nova > getMondayOfWeek()) return;
  S.producaoSemana = nova;
  await renderProducao();
}

async function salvarProducaoCampo(catalogoId, campo, valor) {
  const num = parseFloat(String(valor).replace(',','.')) || 0;
  const monday = (S.producaoSemana || getMondayOfWeek()).toISOString().split('T')[0];
  const payload = { catalogo_id: catalogoId, semana_inicio: monday, [campo]: num, atualizado_em: new Date().toISOString() };
  const { error } = await db.from('gn_producao_estoque')
    .upsert(payload, { onConflict: 'catalogo_id,semana_inicio' });
  if (error) { toast('Erro ao salvar: ' + error.message, 'err'); return; }
  // Estoque é calculado (Sexta + Entrada − Saída), não gravado — mudar Margem/Sexta/

  await renderProducao(true);

// ═══════════════════════════════════════════════
// RENDER: TERCEIROS (confirmar valor negociado das Saídas para Terceiros, dos
// empréstimos entre lojas pagos em dinheiro/PIX e das Avarias/Desperdício comuns,
// todos registrados no app Lojas)
// ═══════════════════════════════════════════════
// A loja registra a saída/o acordo de pagamento (aba Empréstimo ou aba Avarias do app
// Lojas) — mas quem define o valor negociado é sempre o setor de Compras (aqui), nunca a
// loja. Isso fica gravado como um registro do mecanismo de Avarias do app Lojas
// (avariasAll, tipo 'saida_terceiro'/'transferencia_dinheiro'/sem tipo = avaria comum),
// guardado dentro de gn_lojas.all_data — mesma tabela/coluna que o app Lojas e o app RH
// já leem e escrevem pra esse fluxo. Depois que o valor é confirmado aqui, o registro cai
// automaticamente na fila do Financeiro no app RH (mesmo mecanismo que já existe pra
// avarias) — sem precisar de nenhuma mudança lá.
// Avarias comuns só entram aqui enquanto ainda não foram finalizadas (pendente ou
// aguardando o Financeiro) — uma vez finalizadas, o histórico completo já fica só na aba
// Avarias do app RH, pra não acumular anos de avarias antigas nesta tela.
async function _fetchSaidasTerceiros() {
  const chaves = [...new Set((window.GN_LOJAS||[]).flatMap(l => [l.userKey, l.comKey]))];
  const { data, error } = await db.from('gn_lojas').select('loja,all_data').in('loja', chaves);
  if (error) throw error;
  const itens = [];
  (data||[]).forEach(row => {
    const lojaObj = (window.GN_LOJAS||[]).find(l => l.userKey === row.loja || l.comKey === row.loja);
    const display = lojaObj ? lojaObj.display : row.loja;
    const avarias = (row.all_data?.avariasAll || {})[row.loja] || [];
    avarias.filter(a => a.tipo === 'saida_terceiro' || a.tipo === 'transferencia_dinheiro' || (!a.tipo && a.status !== 'finalizado')).forEach(a => {
      itens.push({ ...a, _lojaKey: row.loja, _lojaDisplay: display });
    });
  });
  itens.sort((a,b) => new Date(b.ts||0) - new Date(a.ts||0));
  return itens;
}

// Todos os empréstimos de mercadoria entre lojas ainda em aberto (não quitados), de
// TODAS as lojas — não só os que já viraram pedido de pagamento em dinheiro/PIX (esses já
// aparecem acima via _fetchSaidasTerceiros/tipo='transferencia_dinheiro'). Cada transferência
// fica gravada tanto em gn_lojas.all_data.transferAll da loja origem quanto da destino
// (mesmo registro duplicado), então dedupa por id. Só pra visão/acompanhamento do Compras —
// quem define o valor do pagamento em dinheiro continua sendo o card de cima.
async function _fetchEmprestimosAbertos() {
  const chaves = [...new Set((window.GN_LOJAS||[]).flatMap(l => [l.userKey, l.comKey]))];
  const { data, error } = await db.from('gn_lojas').select('loja,all_data').in('loja', chaves);
  if (error) throw error;
  const vistos = new Set();
  const abertos = [];
  (data||[]).forEach(row => {
    const transferAll = row.all_data?.transferAll || {};
    Object.values(transferAll).forEach(lista => {
      (lista||[]).forEach(t => {
        if (!t || !t.id || vistos.has(t.id) || t.quitado) return;
        vistos.add(t.id);
        abertos.push(t);
      });
    });
  });
  abertos.sort((a,b) => new Date(b.data||0) - new Date(a.data||0));
  return abertos;
}

function _lojaDisplayEmp(key) {
  const l = (window.GN_LOJAS||[]).find(l => l.userKey === key || l.comKey === key);
  return l ? l.display : (key || '—');
}

// Dias corridos desde uma data ISO até agora — usado pra mostrar há quanto tempo um
// item está em aberto (Saída pra Terceiros aguardando valor, empréstimo sem devolução).
function _diasAberto(dataIso) {
  if (!dataIso) return null;
  const dias = Math.floor((Date.now() - new Date(dataIso).getTime()) / 86400000);
  return dias < 0 ? 0 : dias;
}
function _fmtDiasAberto(dataIso) {
  const dias = _diasAberto(dataIso);
  if (dias == null) return '';
  return dias === 0 ? 'aberto hoje' : `${dias} dia${dias > 1 ? 's' : ''} em aberto`;
}
function _fmtDataHoraBR(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

function _terceirosRelatorioTexto() {
  const itens = S._terceirosCache || [];

    ? `${a.transferOrigemLoja||'?'} recebe · ${a.transferDestinoLoja||'?'} fica com o produto`
    : a.tipo === 'saida_terceiro'
    ? `${a.terceiro||'—'}${a.motivo?' · '+a.motivo:''}`

  let msg = `🤝 TERCEIROS\n📅 ${new Date().toLocaleDateString('pt-BR')}\n━━━━━━━━━━━━━━━━━━\n`;

    msg += `    Aberto em ${t.data?new Date(t.data).toLocaleDateString('pt-BR'):'—'} · ${_fmtDiasAberto(t.data)}\n`;
  });

  msg += `\n💰 AGUARDANDO VALOR NEGOCIADO (${pendentes.length})\n`;
  if (!pendentes.length) msg += '  Nenhuma saída aguardando valor.\n';
  pendentes.forEach(a => {
    msg += `  • ${a._lojaDisplay}: ${a.insumo} (${fmtQtd(a.qtdOriginal!=null?a.qtdOriginal:a.qtd)} ${a.unidade||'UN'}) → ${_destinoTxt(a)}\n`;
    msg += `    Aberto em ${a.ts?new Date(a.ts).toLocaleDateString('pt-BR'):'—'} · ${_fmtDiasAberto(a.ts)}\n`;

  if (aguardFin.length) {

      msg += `  • ${a._lojaDisplay}: ${a.insumo} — R$ ${fmt(a.valorTotal)}\n`;

  return { msg, titulo: 'Terceiros — Empréstimos e Saídas' };

async function confirmarValorTerceiro(lojaKey, avId) {
  const valor = parseFloat((document.getElementById('m-valor-terceiro')?.value||'').replace(',','.')) || 0;
  if (valor <= 0) { toast('Informe um valor válido.', 'err'); return; }
  if (!confirm('Confirmar R$ ' + fmt(valor) + ' como valor negociado? Depois de confirmado, vai direto pra fila do Financeiro.')) return;

  try {
    const { data: rows, error } = await db.from('gn_lojas').select('loja,all_data').eq('loja', lojaKey);
    if (error) throw error;
    const row = (rows||[])[0];
    if (!row) throw new Error('Loja não encontrada');

    const allData = JSON.parse(JSON.stringify(row.all_data || {}));
    const avarias = (allData.avariasAll || {})[lojaKey] || [];
    const idx = avarias.findIndex(a => a.id === avId);
    if (idx < 0) throw new Error('Registro não encontrado');
    if (avarias[idx].status !== 'pendente') { toast('Esse registro já foi confirmado.', 'err'); return; }

    let sessNome = 'Compras';
    try { sessNome = JSON.parse(localStorage.getItem(SESSION_KEY)||'null')?.nome || 'Compras'; } catch(e) {}

    const qtd = parseFloat(avarias[idx].qtd) || 0;
    const insumoNome = avarias[idx].insumo;
    const terceiroNome = avarias[idx].tipo === 'transferencia_dinheiro'
      ? (avarias[idx].transferOrigemLoja||'?') + ' → ' + (avarias[idx].transferDestinoLoja||'?')
      : (avarias[idx].terceiro || 'Avaria/Desperdício');
    avarias[idx].status = 'loja_confirmou';
    avarias[idx].custoUnit = qtd > 0 ? +(valor/qtd).toFixed(4) : 0;
    avarias[idx].valorTotal = valor;
    avarias[idx].loja_conf_por = sessNome;
    avarias[idx].loja_conf_ts = new Date().toISOString();
    if (!allData.avariasAll) allData.avariasAll = {};
    allData.avariasAll[lojaKey] = avarias;

    const { error: errUp } = await db.from('gn_lojas')
      .update({ all_data: allData, updated_at: new Date().toISOString(), updated_by: lojaKey+'/'+sessNome })
      .eq('loja', lojaKey);
    if (errUp) throw errUp;

    _logAuditoria('CONFIRMAR_VALOR_TERCEIRO', { loja: lojaKey, insumo: insumoNome, terceiro: terceiroNome, valor }, {});
    $('modal-bg').classList.remove('ativo');
    toast('✓ Valor confirmado! Enviado pro Financeiro.', 'ok');
    renderTerceiros();
  } catch (e) {
    toast('Erro: ' + (e.message||e), 'err');
  }
}

    });
    if (S.abasPermitidas) {
      const primeira = ALL_TABS.find(t => S.abasPermitidas.has(t)) || 'pedido';
      setTab(primeira);
    } else {
      setTab('pedido');
    }
  } catch(e) { setTab('pedido'); }

  // Mostrar badge de pendências offline (se houver da sessão anterior)
  setTimeout(_ppBadge, 0);

  // Verificar entregas atrasadas em background (auto-alerta após 6s)
  setTimeout(_verificarAlertasEntregaAuto, 6000);

  // Registrar push subscription se já tem permissão
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').then(reg => {
      reg.update();
      if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
        setTimeout(registrarPushSubscription, 3000);
      }
    }).catch(() => {});
    navigator.serviceWorker.addEventListener('controllerchange', () => window.location.reload());
    navigator.serviceWorker.addEventListener('message', e => {
      if (e.data && e.data.type === 'GN_SW_UPDATED') window.location.reload();
    });
  }

  // Atualizar visual do botão de notificação
  _atualizarBtnNotif();

  // Carregar badge de faltas do dia em background
  setTimeout(_carregarFaltasBadge, 4000);
}

async function carregarMasterConfig() {
  try {
    const { data, error } = await db.from('gn_lojas')
      .select('all_data')
      .eq('loja', 'MASTER_CONFIG')
      .single();
    if (error || !data || !data.all_data) return;
    const d = data.all_data;
    if (d.fichasCustom)  Object.assign(fichasCustom,  d.fichasCustom);
    if (d.fichasRemoved) fichasRemoved = [...new Set([...fichasRemoved, ...d.fichasRemoved])];
    if (d.insumosCustom) insumosCustom = [...new Set([...insumosCustom, ...d.insumosCustom])];
  } catch(e) {
    console.warn('MASTER_CONFIG load error:', e);
  }
}

async function sbPushMasterConfig() {
  try {
    // Busca o all_data mais recente da linha MASTER_CONFIG antes de gravar — essa mesma
    // linha guarda fatoresConversao/alertasWpp/nfMapeamentos/fichasMapeamentos (lidos por
    // gn-lojas.html), gravados por outros apps/telas fora deste payload conhecido aqui.
    // Sobrescrever com só {fichasCustom, fichasRemoved, insumosCustom} apagava esses campos
    // silenciosamente toda vez que alguém salvava/removia uma ficha técnica.
    const { data: baseRow } = await db.from('gn_lojas')
      .select('all_data').eq('loja', 'MASTER_CONFIG').maybeSingle();
    const baseAllData = (baseRow && baseRow.all_data) || {};
    const payload = { ...baseAllData, fichasCustom, fichasRemoved, insumosCustom };
    const { error } = await db.from('gn_lojas')
      .update({ all_data: payload, updated_at: new Date().toISOString(), updated_by: 'MASTER' })
      .eq('loja', 'MASTER_CONFIG');
    if (error) throw error;
  } catch(e) {
    toast('⚠️ Erro ao enviar fichas: ' + (e.message || e), 'err');
  }
}

function getAllFichas() {
  const removed = new Set(fichasRemoved);
  const result = {};
  Object.entries(FICHAS_SEED.fichas_orig).forEach(([cod, f]) => {
    if (!removed.has(cod)) result[cod] = { ...f, codigo: cod, isCustom: false };
  });
  Object.entries(fichasCustom).forEach(([cod, f]) => {
    if (!removed.has(cod)) result[cod] = { ...f, isCustom: true };
  });
  return result;
}

function getAllInsumos() {
  const base = [...FICHAS_SEED.insumos, ...FICHAS_SEED.bebidas_insumos];
  return [...base, ...insumosCustom.filter(n => !base.includes(n))];
}

function salvarFichaCustom(data) {
  fichasCustom[data.codigo] = data;
  fichasRemoved = fichasRemoved.filter(c => c !== data.codigo);
  data.insumos.forEach(it => {
    const n = it.insumo.trim().toUpperCase();
    if (!getAllInsumos().includes(n)) insumosCustom.push(n);
  });
  sbPushMasterConfig();
  toast("✅ Ficha '" + data.nome + "' salva para todas as lojas!", 'ok');
}

function removerFichaCustom(cod) {
  const all = getAllFichas();
  const ficha = all[cod];
  if (!ficha) return;
  const nome = ficha.nome;
  if (!confirm('Remover a ficha "' + nome + '" de TODAS as lojas?')) return;
  if (ficha.isCustom) delete fichasCustom[cod];
  else fichasRemoved.push(cod);
  sbPushMasterConfig();
  toast("🗑 Ficha '" + nome + "' removida de todas as lojas.", 'ok');
  renderFichas();
}

function adicionarInsumoCustom(nome) {
  const n = nome.trim().toUpperCase();
  if (!n || getAllInsumos().includes(n)) { toast('⚠️ Insumo já existe ou nome vazio.', 'err'); return false; }
  insumosCustom.push(n);
  sbPushMasterConfig();
  toast("✅ Insumo '" + n + "' adicionado para todas as lojas!", 'ok');
  return true;
}

function resetFormFicha() {
  const fCod  = document.getElementById('fCod');
  const fNome = document.getElementById('fNome');
  if (fCod)  { fCod.value = ''; fCod.readOnly = false; fCod.style.opacity = '1'; fCod.style.cursor = ''; }
  if (fNome) fNome.value = '';
  const cont = document.getElementById('fichaLinhas');
  if (cont) { cont.innerHTML = ''; adicionarLinhaFicha(); }
  const btn = document.getElementById('btnSalvarFicha');
  if (btn) { btn.textContent = '💾 Salvar Ficha Técnica'; btn.style.background = 'linear-gradient(135deg,#1d4ed8,#1e40af)'; }
  const titulo = document.getElementById('fichaFormTitulo');
  if (titulo) titulo.textContent = '➕ Nova Ficha Técnica';
}

function editarFicha(codigo) {
  const todasFichas = getAllFichas();
  const f = todasFichas[codigo];
  if (!f) { toast('⚠️ Ficha não encontrada.', 'err'); return; }
  const fCod  = document.getElementById('fCod');
  const fNome = document.getElementById('fNome');
  if (!fCod || !fNome) { toast('⚠️ Role para cima até o formulário.', 'err'); return; }
  fCod.value = f.codigo;
  fNome.value = f.nome;
  fCod.readOnly = true;
  fCod.style.opacity = '.6';
  fCod.style.cursor = 'not-allowed';
  const cont = document.getElementById('fichaLinhas');
  if (cont) {
    cont.innerHTML = '';
    (f.insumos || []).forEach(it => {
      adicionarLinhaFicha();
      const linhas = cont.querySelectorAll('.ficha-linha');
      const ultima = linhas[linhas.length - 1];
      if (!ultima) return;
      const ins = ultima.querySelector('.fi-ins'); if (ins) ins.value = it.insumo || '';
      const qtd = ultima.querySelector('.fi-qtd'); if (qtd) qtd.value = it.qtd || it.qtd_kg || '';
      const und = ultima.querySelector('.fi-und'); if (und) und.value = it.unidade || 'KG';
    });
  }
  const titulo = document.getElementById('fichaFormTitulo');
  if (titulo) titulo.textContent = '✏️ Editando: ' + f.nome;
  const btn = document.getElementById('btnSalvarFicha');
  if (btn) { btn.textContent = '💾 Salvar edição de ' + f.nome; btn.style.background = 'linear-gradient(135deg,#E8580A,#c04a08)'; }
  fCod.scrollIntoView({ behavior: 'smooth', block: 'center' });
  toast('✏️ Editando: ' + f.nome, 'ok');
}

function submitNovaFicha() {
  const cod  = ((document.getElementById('fCod')  || {}).value || '').trim().toUpperCase();
  const nome = ((document.getElementById('fNome') || {}).value || '').trim().toUpperCase();
  if (!cod || !nome) { toast('⚠️ Preencha código e nome.', 'err'); return; }
  const linhas = [];
  document.querySelectorAll('.ficha-linha').forEach(row => {
    const ins = (row.querySelector('.fi-ins') || {}).value || '';
    const qtd = parseFloat((row.querySelector('.fi-qtd') || {}).value) || 0;
    const und = (row.querySelector('.fi-und') || {}).value || 'KG';
    if (ins && qtd > 0) {
      const qtd_kg = (und === 'GR' || und === 'ML') ? qtd / 1000 : qtd;
      linhas.push({ insumo: ins.trim().toUpperCase(), qtd, unidade: und, qtd_kg });
    }
  });
  if (linhas.length === 0) { toast('⚠️ Adicione pelo menos 1 insumo.', 'err'); return; }
  salvarFichaCustom({ codigo: cod, nome, insumos: linhas });
  resetFormFicha();
  renderFichas();
}

async function renderCarnesCtrl() {
  $('content').innerHTML = '<div class="empty"><div class="spin"></div></div>';

  if (!S.carnesSemana) S.carnesSemana = getMondayOfWeek();
  if (!S.carnesLoja) S.carnesLoja = S.lojaAtiva || (S.lojas[0]?.slug_pedido);

  const sem = formatarSemana(S.carnesSemana);
  const mondayHoje = getMondayOfWeek();
  const podeAvancar = S.carnesSemana < mondayHoje;
  const semIni = S.carnesSemana.toISOString().slice(0, 10);

  const lojaObj = lojasComTeste().find(l => l.slug_pedido === S.carnesLoja);

  let carnesData = null;
  try {
    // checklist_carnes.loja stores the display name (e.g. "Bangu", "São Gonçalo")
    // Try nome_display first, then loja field, then slug_pedido as last resort
    const candidatos = [lojaObj?.nome_display, lojaObj?.loja, S.carnesLoja].filter(Boolean);
    for (const candidato of candidatos) {
      const { data } = await db.from('checklist_carnes')
        .select('carnes,semana_fim')
        .eq('semana_inicio', semIni)
        .eq('loja', candidato)
        .maybeSingle();
      if (data?.carnes) { carnesData = data.carnes; break; }
    }
  } catch(e) {}

  const lojaTabsHtml = lojasComTeste().map(l =>
    `<button class="store-tab${S.carnesLoja === l.slug_pedido ? ' ativo' : ''}"
      onclick="S.carnesLoja='${l.slug_pedido}';renderCarnesCtrl()">${l.nome_display}</button>`
  ).join('');

  const semNavHtml = `
    <div class="semana-nav">
      <button class="semana-nav-arrow" onclick="_carnesNavSemana(-1)">‹</button>
      <div class="semana-info">
        <div class="semana-label">SEMANA ${sem.num} · ${sem.ano}</div>
        <div class="semana-periodo">${sem.periodo}</div>
        ${sem.ehAtual
          ? '<div class="semana-atual-badge">▶ SEMANA ATUAL</div>'
          : '<div class="semana-atual-badge" style="color:var(--muted)">semana passada</div>'}
      </div>
      <button class="semana-nav-arrow" onclick="_carnesNavSemana(1)" ${!podeAvancar ? 'disabled style="opacity:.3"' : ''}>›</button>
    </div>`;

  window._carnesRelatorio = function() {
    if (!carnesData) { toast('Sem dados para relatório.'); return; }
    const lojaDisplayNome = lojaObj?.nome_display || S.carnesLoja;
    let txt = `🥩 *GN — Controle de Carnes*\n🏪 ${lojaDisplayNome} · ${sem.periodo}\n\n`;
    CARNES_DEF_PED.forEach(carne => {
      const d = carnesData[carne.key] || {};
      let totIni = 0, totEnt = 0, totFim = 0;
      carne.rows.forEach(r => {
        const rd = d[r.key] || {};
        totIni += parseFloat(rd.inicial) || 0;
        totFim += parseFloat(rd.contagem_final) || 0;
      });
      const rawRow = carne.rows.find(r => r.key === 'in_natura' || r.key === 'cru') || carne.rows[0];
      const rawRd = d[rawRow.key] || {};
      totEnt = DIAS_SEM_PED.reduce((a, dia) => a + (parseFloat(rawRd['ent_' + dia]) || 0), 0);
      if (totIni === 0 && totEnt === 0 && totFim === 0) return;
      const venda = totIni + totEnt - totFim;
      txt += `${carne.icon} *${carne.label}*\n`;
      txt += `  Início: ${totIni.toFixed(1)} ${carne.unit}\n`;
      txt += `  + Compras: +${totEnt.toFixed(1)} ${carne.unit}\n`;
      txt += `  − Contagem: ${totFim.toFixed(1)} ${carne.unit}\n`;
      txt += `  = Venda estimada: ${venda.toFixed(1)} ${carne.unit}${venda < -0.05 ? ' ⚠️' : ''}\n\n`;
    });
    txt += `_Gerado em ${new Date().toLocaleString('pt-BR')}_`;
    if (navigator.share && navigator.canShare({ text: txt })) {
      navigator.share({ text: txt }).catch(() => window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank'));
    } else {
      window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank');
    }
  };

  const cardsHtml = _carnesCardsHtml(carnesData);
  const temDados = carnesData && cardsHtml.indexOf('empty') === -1;

  $('content').innerHTML = `
    <div class="sec-header">
      <div class="sec-titulo">Controle de Carnes</div>
      <button onclick="renderCarnesCtrl()" style="padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:none;color:var(--muted);font-size:11px;cursor:pointer">↻</button>
    </div>
    <div class="store-tabs" style="margin-bottom:12px">${lojaTabsHtml}</div>
    ${semNavHtml}
    ${carnesData
      ? cardsHtml
      : `<div class="empty" style="padding:30px 0"><div class="empty-icon">🥩</div><div class="empty-texto">Nenhum dado de carnes nesta semana.</div></div>`}
    ${carnesData ? `
    <button onclick="window._carnesRelatorio()" style="margin-top:12px;width:100%;background:rgba(37,211,102,.15);border:1px solid rgba(37,211,102,.4);border-radius:11px;padding:12px;color:#1A1D23;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer">
      📲 Enviar Relatório por WhatsApp
    </button>` : ''}
  `;
}

window._carnesNavSemana = function(dir) {
  const d = new Date(S.carnesSemana);
  d.setDate(d.getDate() + dir * 7);
  if (d > getMondayOfWeek()) return;
  S.carnesSemana = d;
  renderCarnesCtrl();
};

function _carnesCardsHtml(carnes) {
  if (!carnes) return '';
  const cards = CARNES_DEF_PED.map(carne => {
    const d = carnes[carne.key] || {};
    let totIni = 0, totFim = 0;
    const iniParts = [], fimParts = [];
    carne.rows.forEach(r => {
      const rd = d[r.key] || {};
      const ini = parseFloat(rd.inicial) || 0, fim = parseFloat(rd.contagem_final) || 0;
      totIni += ini; totFim += fim;
      if (ini > 0) iniParts.push(r.label + ' ' + ini.toFixed(1));
      if (fim > 0) fimParts.push(r.label + ' ' + fim.toFixed(1));
    });
    const rawRow = carne.rows.find(r => r.key === 'in_natura' || r.key === 'cru') || carne.rows[0];
    const rawRd = d[rawRow.key] || {};
    const totEnt = DIAS_SEM_PED.reduce((a, dia) => a + (parseFloat(rawRd['ent_' + dia]) || 0), 0);
    if (totIni === 0 && totEnt === 0 && totFim === 0) return '';
    const venda = totIni + totEnt - totFim;
    const vCol = venda >= -0.05 ? '#6bcb77' : '#d05050';
    return `<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px;margin-bottom:10px">
      <div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px">${carne.icon} ${carne.label}</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px">
        <div style="background:var(--card2);border-radius:8px;padding:8px;text-align:center">
          <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">Início</div>
          <div style="font-size:14px;font-weight:700;color:#1A1D23;font-variant-numeric:tabular-nums">${totIni.toFixed(1)}</div>
          ${iniParts.length ? `<div style="font-size:8px;color:var(--muted);margin-top:2px">${iniParts.join(' · ')}</div>` : ''}
        </div>
        <div style="background:var(--card2);border-radius:8px;padding:8px;text-align:center">
          <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">+ Compras</div>
          <div style="font-size:14px;font-weight:700;color:#1A1D23;font-variant-numeric:tabular-nums">+${totEnt.toFixed(1)}</div>
          <div style="font-size:8px;color:var(--muted);margin-top:2px">${rawRow.label}</div>
        </div>
        <div style="background:var(--card2);border-radius:8px;padding:8px;text-align:center">
          <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">− Contagem</div>
          <div style="font-size:14px;font-weight:700;color:#1A1D23;font-variant-numeric:tabular-nums">${totFim.toFixed(1)}</div>
          ${fimParts.length ? `<div style="font-size:8px;color:var(--muted);margin-top:2px">${fimParts.join(' · ')}</div>` : ''}
        </div>
      </div>
      <div style="background:var(--card2);border-radius:8px;padding:10px;display:flex;justify-content:space-between;align-items:center">
        <div style="font-size:11px;font-weight:700;color:var(--muted)">= Venda estimada</div>
        <div style="font-size:17px;font-weight:700;color:${vCol};font-variant-numeric:tabular-nums">${Math.abs(venda).toFixed(1)} ${carne.unit}${venda < -0.05 ? ' ⚠️' : ''}</div>
      </div>
    </div>`;
  }).filter(Boolean);
  return cards.length
    ? cards.join('')
    : `<div class="empty" style="padding:30px 0"><div class="empty-icon">🥩</div><div class="empty-texto">Sem dados preenchidos para esta semana.</div></div>`;
}

};

function _triosCacheFor(artista) {
  if (!artista) return 0;
  const key = Object.keys(TRIOS_CACHES).find(k =>
    k.trim().toLowerCase() === artista.trim().toLowerCase()
  );
  return key ? TRIOS_CACHES[key] : 0;
}

function _triosMesLabel(ym) {
  if (!ym) return '';
  const [y, m] = ym.split('-').map(Number);
  const nomes = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  return nomes[m - 1] + ' ' + y;
}

function _triosNavMes(delta) {
  const [y, m] = S.triosMes.split('-').map(Number);
  let nm = m + delta, ny = y;
  if (nm > 12) { nm = 1; ny++; }
  if (nm < 1)  { nm = 12; ny--; }
  S.triosMes = ny + '-' + String(nm).padStart(2, '0');
  renderTrios();
}

async function renderTrios(silent) {
  // Preserva a posição de rolagem entre re-renders — sem isso, confirmar uma
  // apresentação (que recarrega a aba inteira pra refletir o status na hora)
  // sempre jogava a tela de volta pro topo, perdendo o lugar do item confirmado.
  // silent=true (refresh depois de confirmar) mantém a tela atual visível
  // enquanto busca os dados novos, em vez de apagar tudo pra um spinner — sem
  // isso a tela "piscava" pro topo e só voltava ao lugar certo quando a busca
  // terminava, alguns instantes depois.
  const _contentEl = $('content');
  const _scrollAnterior = _contentEl ? _contentEl.scrollTop : 0;
  if (!silent) $('content').innerHTML = '<div class="empty"><div class="spin"></div></div>';

  // Mês padrão: mês atual
  if (!S.triosMes) {
    const hoje = new Date();
    S.triosMes = hoje.getFullYear() + '-' + String(hoje.getMonth() + 1).padStart(2, '0');
  }

  // Carregar dados do Supabase
  try {
    const { data, error } = await db.from('gn_trios_agenda')
      .select('*')
      .gte('data', S.triosMes + '-01')
      .lte('data', S.triosMes + '-31')
      .order('data', { ascending: true })
      .order('horario_inicio', { ascending: true });
    if (!error) S.triosData = data || [];
  } catch(e) {
    S.triosData = [];
  }

  const registros = S.triosLoja
    ? S.triosData.filter(r => r.loja === S.triosLoja)
    : S.triosData;

  // Agrupar por data + horário
  const grupos = {};
  registros.forEach(r => {
    const chave = r.data + '|' + (r.horario_inicio || '') + '|' + (r.horario_fim || '');
    if (!grupos[chave]) grupos[chave] = { data: r.data, hi: r.horario_inicio, hf: r.horario_fim, itens: [] };
    grupos[chave].itens.push(r);
  });

  const DIAS_PT = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const MESES_PT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

  function fmtData(d) {
    const dt = new Date(d + 'T12:00:00');
    const dia = DIAS_PT[dt.getDay()];
    return `${dia} ${dt.getDate()}/${String(dt.getMonth()+1).padStart(2,'0')}`;
  }

  function fmtR(v) {
    return 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  // Sessão atual (para confirmação)
  const sess = (() => { try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch(e) { return null; } })();
  const podeCadastrar = sess?.permissoes?.master || sess?.permissoes?.pedidos;
  const _lojaDisplay = (slug) => lojasComTeste().find(l => l.slug_pedido === slug)?.nome_display || slug;

  // Tabs de loja
  const lojaTabsHtml = `
    <button class="store-tab${!S.triosLoja ? ' ativo' : ''}" onclick="S.triosLoja=null;renderTrios()">Todas</button>
    ${lojasComTeste().map(l => `<button class="store-tab${S.triosLoja===l.slug_pedido?' ativo':''}" onclick="S.triosLoja='${l.slug_pedido}';renderTrios()">${l.nome_display}</button>`).join('')}`;

  // Resumo financeiro do mês — exclui a loja teste dos totais (a lista "Todas" continua
  // mostrando o lançamento de teste normalmente, só os somatórios ficam de fora).
  const triosDataReais = S.triosData.filter(r => r.loja !== LOJA_TESTE_PEDIDO.slug_pedido);
  const totalApresent = triosDataReais.length;
  const totalCache = triosDataReais.reduce((sum, r) => sum + (parseFloat(r.cache) || 0), 0);
  const totalConf = triosDataReais.filter(r => r.confirmado).length;

  const resumoHtml = `
    <div class="trio-resumo">
      <div class="trio-resumo-item">
        <span class="trio-resumo-label">APRESENTAÇÕES</span>
        <span class="trio-resumo-val" style="color:var(--text)">${totalApresent}</span>
      </div>
      <div class="trio-resumo-item">
        <span class="trio-resumo-label">TOTAL CACHÊ</span>
        <span class="trio-resumo-val" style="color:var(--text)">${fmtR(totalCache)}</span>
      </div>
      <div class="trio-resumo-item">
        <span class="trio-resumo-label">CONFIRMADAS</span>
        <span class="trio-resumo-val" style="color:${totalConf===totalApresent&&totalApresent>0?'var(--ok)':'var(--muted)'}">${totalConf}/${totalApresent}</span>
      </div>
    </div>`;

  // Painel financeiro: couvert × cachê por loja (também de fora a loja teste)
  const lojaFinMap = {};
  triosDataReais.forEach(r => {
    const slug = r.loja;
    if (!lojaFinMap[slug]) lojaFinMap[slug] = { cache: 0, couver: 0, conf: 0 };
    lojaFinMap[slug].cache  += parseFloat(r.cache) || 0;
    lojaFinMap[slug].couver += parseFloat(r.couver_valor) || 0;
    if (r.presenca_confirmada) lojaFinMap[slug].conf++;
  });
  const lojaFinEntries = Object.entries(lojaFinMap);
  const temDadosCouvert = lojaFinEntries.some(([,v]) => v.couver > 0);
  const totalCouverGeral = lojaFinEntries.reduce((s,[,v])=>s+v.couver,0);
  const totalCacheGeral  = lojaFinEntries.reduce((s,[,v])=>s+v.cache,0);
  const totalResGeral    = totalCouverGeral - totalCacheGeral;
  const lojasNeg = lojaFinEntries.filter(([,v]) => v.couver > 0 && (v.couver - v.cache) < 0);

  // Saldo por semana (Seg–Dom, mesma referência usada em Pedidos) — acumulado no mês
  const semanaFinMap = {};
  triosDataReais.forEach(r => {
    const seg = getMondayOfWeek(new Date(r.data + 'T12:00:00'));
    const key = seg.toISOString().slice(0, 10);
    if (!semanaFinMap[key]) semanaFinMap[key] = { monday: seg, cache: 0, couver: 0 };
    semanaFinMap[key].cache  += parseFloat(r.cache) || 0;
    semanaFinMap[key].couver += parseFloat(r.couver_valor) || 0;
  });
  let _acumSemana = 0;
  const semanasResumo = Object.values(semanaFinMap).sort((a, b) => a.monday - b.monday).map(sem => {
    const res = sem.couver - sem.cache;
    _acumSemana += res;
    return { ...sem, res, acumulado: _acumSemana, semInfo: formatarSemana(sem.monday) };
  });

  const finPainelHtml = lojaFinEntries.length > 0 ? `
    <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px;margin-bottom:10px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;">Couvert × Cachê por Loja</div>
        ${!temDadosCouvert ? `<span style="font-size:10px;color:var(--muted);">Aguardando confirmações das lojas</span>` : ''}
      </div>
      ${lojasNeg.length > 0 ? `<div style="background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.3);border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:11px;color:var(--text);font-weight:700;">⚠️ ${lojasNeg.length} loja(s) no negativo: ${lojasNeg.map(([slug])=>_lojaDisplay(slug)).join(', ')}</div>` : temDadosCouvert ? `<div style="background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.25);border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:11px;color:var(--text);font-weight:700;">✓ Todas as lojas fechando positivo</div>` : ''}
      <div style="display:flex;flex-direction:column;gap:6px;">
        ${lojaFinEntries.map(([slug,v]) => {
          const res = v.couver - v.cache;
          const resOk = res >= 0;
          const temCouver = v.couver > 0;
          return `<div style="display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:6px;padding:7px 8px;background:var(--card2);border-radius:8px;border:1px solid ${temCouver ? (resOk?'rgba(34,197,94,0.15)':'rgba(239,68,68,0.25)') : 'transparent'};">
            <div style="font-size:11px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;">${_lojaDisplay(slug)}</div>
            <div style="text-align:right;min-width:64px;">
              <div style="font-size:9px;color:var(--muted);">Couvert</div>
              <div style="font-size:11px;font-weight:700;color:${temCouver?'var(--ok)':'var(--muted)'};">${temCouver?fmtR(v.couver):'—'}</div>
            </div>
            <div style="text-align:right;min-width:64px;">
              <div style="font-size:9px;color:var(--muted);">Cachê</div>
              <div style="font-size:11px;font-weight:700;color:var(--text);">${fmtR(v.cache)}</div>
            </div>
            <div style="text-align:right;min-width:64px;">
              <div style="font-size:9px;color:var(--muted);">Resultado</div>
              <div style="font-size:12px;font-weight:800;color:${temCouver?(resOk?'var(--ok)':'var(--err)'):'var(--muted)'};">${temCouver?(resOk?'+':'')+fmtR(res):'—'}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
      ${temDadosCouvert ? `
      <div style="display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:6px;padding:8px;margin-top:8px;border-top:1px solid var(--border);">
        <div style="font-size:11px;font-weight:700;color:var(--text);">TOTAL GERAL</div>
        <div style="text-align:right;min-width:64px;"><div style="font-size:12px;font-weight:800;color:var(--text);">${fmtR(totalCouverGeral)}</div></div>
        <div style="text-align:right;min-width:64px;"><div style="font-size:12px;font-weight:800;color:var(--text);">${fmtR(totalCacheGeral)}</div></div>
        <div style="text-align:right;min-width:64px;"><div style="font-size:13px;font-weight:800;color:${totalResGeral>=0?'var(--ok)':'var(--err)'};">${totalResGeral>=0?'+':''}${fmtR(totalResGeral)}</div></div>
      </div>` : ''}
      ${temDadosCouvert && semanasResumo.length > 0 ? `
      <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border);">
        <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;">Saldo por Semana (acumulado no mês)</div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          ${semanasResumo.map(sem => {
            const resOk = sem.res >= 0;
            const acOk = sem.acumulado >= 0;
            const temCouver = sem.couver > 0;
            return `<div style="padding:8px 10px;background:var(--card2);border-radius:8px;border:1px solid ${temCouver ? (resOk?'rgba(34,197,94,0.15)':'rgba(239,68,68,0.25)') : 'transparent'};">
              <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;">
                <span style="font-size:11px;font-weight:700;color:var(--text);">${sem.semInfo.periodo}</span>
                <span style="font-size:13px;font-weight:800;color:${temCouver?(resOk?'var(--ok)':'var(--err)'):'var(--muted)'};">Saldo: ${temCouver?(resOk?'+':'')+fmtR(sem.res):'—'}</span>
              </div>
              <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:4px;">
                <span style="font-size:10px;color:var(--muted);">Couvert <b style="color:${temCouver?'var(--ok)':'var(--muted)'};font-weight:700;">${temCouver?fmtR(sem.couver):'—'}</b></span>
                <span style="font-size:10px;color:var(--muted);">Cachê <b style="color:var(--text);font-weight:700;">${fmtR(sem.cache)}</b></span>
                <span style="font-size:10px;color:var(--muted);">Acumulado <b style="color:${acOk?'var(--ok)':'var(--err)'};font-weight:700;">${(acOk?'+':'')+fmtR(sem.acumulado)}</b></span>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>` : ''}
    </div>` : '';

  // Cards por grupo de data/horário
  const gruposOrdenados = Object.values(grupos).sort((a, b) => {
    if (a.data !== b.data) return a.data.localeCompare(b.data);
    return (a.hi || '').localeCompare(b.hi || '');
  });

  const gruposHtml = gruposOrdenados.length ? gruposOrdenados.map(g => {
    const horaLabel = g.hi && g.hf ? `${g.hi} – ${g.hf}` : (g.hi || '');
    const itensHtml = g.itens.map(r => {
      const cache = parseFloat(r.cache) || 0;
      const lojaNome = _lojaDisplay(r.loja) || r.loja_nome || r.loja;
      const conf = r.confirmado;
      const presConf = r.presenca_confirmada;
      const couverVal = parseFloat(r.couver_valor) || 0;
      const resultado = couverVal - cache;
      const resOk = resultado >= 0;
      const btnLabel = conf ? '✓ Confirmado' : 'Confirmar';
      const btnClass = conf ? 'trio-confirmar-btn sim' : 'trio-confirmar-btn';
      return `
        <div class="trio-apresent${conf ? ' confirmado' : ''}" data-id="${r.id}">
          <div class="trio-apresent-info" style="flex:1;min-width:0;">
            <div class="trio-artista">${r.artista}</div>
            <div style="margin-top:2px;">
              <span class="trio-loja-chip">${lojaNome}</span>
              ${cache > 0 ? `<span class="trio-cache-chip">${fmtR(cache)}</span>` : ''}
              ${conf && r.confirmado_por ? `<span style="font-size:10px;color:var(--text);margin-left:4px">por ${r.confirmado_por}</span>` : ''}
            </div>
            ${presConf ? `<div style="margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;">
              <span style="font-size:10px;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.25);border-radius:6px;padding:2px 7px;color:var(--text);">✓ Presença confirmada</span>
              ${couverVal > 0 ? `<span style="font-size:10px;background:rgba(245,217,138,0.08);border:1px solid rgba(245,217,138,0.2);border-radius:6px;padding:2px 7px;color:var(--text);">Couvert ${fmtR(couverVal)}</span>` : ''}
              ${couverVal > 0 ? `<span style="font-size:10px;border-radius:6px;padding:2px 7px;font-weight:700;background:${resOk?'rgba(34,197,94,0.08)':'rgba(239,68,68,0.08)'};border:1px solid ${resOk?'rgba(34,197,94,0.2)':'rgba(239,68,68,0.3)'};color:${resOk?'var(--ok)':'var(--err)'};">${resOk?'+':''}${fmtR(resultado)}</span>` : ''}
            </div>` : ''}
          </div>
          <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;flex-shrink:0">
            <button class="${btnClass}" onclick="_triosConfirmar('${r.id}',${conf})">${btnLabel}</button>
            ${podeCadastrar ? `<button class="btn-sm btn-outline" style="font-size:10px;padding:3px 8px" onclick="_triosEditarModal('${r.id}')">✏️</button>` : ''}
          </div>
        </div>`;
    }).join('');
    return `
      <div class="trio-dia-bloco">
        <div class="trio-dia-header">
          <span class="trio-dia-label">${fmtData(g.data)}</span>
          ${horaLabel ? `<span class="trio-dia-hora">${horaLabel}</span>` : ''}
        </div>
        ${itensHtml}
      </div>`;
  }).join('') : `<div class="empty"><div class="empty-icon">🎵</div><div class="empty-texto">Nenhuma apresentação cadastrada para ${_triosMesLabel(S.triosMes)}.</div></div>`;

  const html = `
    <div class="trio-mes-nav">
      <button class="semana-nav-arrow" onclick="_triosNavMes(-1)">‹</button>
      <div style="text-align:center;flex:1">
        <div class="trio-mes-label">AGENDA DE TRIOS</div>
        <div class="trio-mes-val">${_triosMesLabel(S.triosMes)}</div>
      </div>
      <button class="semana-nav-arrow" onclick="_triosNavMes(1)">›</button>
    </div>
    <div class="store-tabs">${lojaTabsHtml}</div>
    ${resumoHtml}
    ${finPainelHtml}
    <div class="trio-acoes-bar">
      <span style="font-size:12px;color:var(--muted);font-weight:700">${registros.length} apresent.${S.triosLoja?' — '+_lojaDisplay(S.triosLoja):''}</span>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${totalApresent > 0 ? `
          <button class="btn-sm" onclick="_triosWpp()" style="background:rgba(37,211,102,.15);border:1px solid rgba(37,211,102,.4);color:#1A1D23">📲</button>
          <button class="btn-sm btn-outline" onclick="_triosPDF()">📄 PDF</button>` : ''}
        ${podeCadastrar ? `
          <button class="btn-sm btn-outline" onclick="_triosImportarModal()">📋 Importar agenda</button>
          <button class="btn-sm btn-orange" onclick="_triosNovoModal()">+ Nova</button>` : ''}
      </div>
    </div>
    ${gruposHtml}`;

  $('content').innerHTML = html;
  if (_contentEl) _contentEl.scrollTop = _scrollAnterior;
}

function _triosRelatorioTexto() {
  const fmtR = v => 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const _lojaDisplay = (slug) => lojasComTeste().find(l => l.slug_pedido === slug)?.nome_display || slug;
  const triosDataReais = S.triosData.filter(r => r.loja !== LOJA_TESTE_PEDIDO.slug_pedido);

  const totalApresent = triosDataReais.length;
  const totalCache = triosDataReais.reduce((sum, r) => sum + (parseFloat(r.cache) || 0), 0);
  const totalConf = triosDataReais.filter(r => r.confirmado).length;

  const lojaFinMap = {};
  triosDataReais.forEach(r => {
    const slug = r.loja;
    if (!lojaFinMap[slug]) lojaFinMap[slug] = { cache: 0, couver: 0 };
    lojaFinMap[slug].cache  += parseFloat(r.cache) || 0;
    lojaFinMap[slug].couver += parseFloat(r.couver_valor) || 0;
  });
  const lojaFinEntries = Object.entries(lojaFinMap);
  const temDadosCouvert = lojaFinEntries.some(([,v]) => v.couver > 0);
  const totalCouverGeral = lojaFinEntries.reduce((s,[,v])=>s+v.couver,0);
  const totalCacheGeral  = lojaFinEntries.reduce((s,[,v])=>s+v.cache,0);
  const totalResGeral    = totalCouverGeral - totalCacheGeral;

  const semanaFinMap = {};
  triosDataReais.forEach(r => {
    const seg = getMondayOfWeek(new Date(r.data + 'T12:00:00'));
    const key = seg.toISOString().slice(0, 10);
    if (!semanaFinMap[key]) semanaFinMap[key] = { monday: seg, cache: 0, couver: 0 };
    semanaFinMap[key].cache  += parseFloat(r.cache) || 0;
    semanaFinMap[key].couver += parseFloat(r.couver_valor) || 0;
  });
  let acumulado = 0;
  const semanasResumo = Object.values(semanaFinMap).sort((a, b) => a.monday - b.monday).map(sem => {
    const res = sem.couver - sem.cache;
    acumulado += res;
    return { ...sem, res, acumulado, semInfo: formatarSemana(sem.monday) };
  });

  let txt = `🎵 *RELATÓRIO DE TRIOS — ${_triosMesLabel(S.triosMes)}*\n\n`;
  txt += `📊 RESUMO\n`;
  txt += `Apresentações: ${totalApresent}\n`;
  txt += `Total Cachê: ${fmtR(totalCache)}\n`;
  txt += `Confirmadas: ${totalConf}/${totalApresent}\n`;

  if (lojaFinEntries.length > 0) {
    txt += `\n💰 COUVERT × CACHÊ POR LOJA\n`;
    lojaFinEntries.forEach(([slug, v]) => {
      const res = v.couver - v.cache;
      const temCouver = v.couver > 0;
      txt += `${_lojaDisplay(slug)}: Couvert ${temCouver?fmtR(v.couver):'—'} | Cachê ${fmtR(v.cache)} | Saldo ${temCouver?(res>=0?'+':'')+fmtR(res):'—'}\n`;
    });
    if (temDadosCouvert) {
      txt += `TOTAL GERAL: Couvert ${fmtR(totalCouverGeral)} | Cachê ${fmtR(totalCacheGeral)} | Saldo ${totalResGeral>=0?'+':''}${fmtR(totalResGeral)}\n`;
    }
  }

  if (temDadosCouvert && semanasResumo.length > 0) {
    txt += `\n📅 SALDO POR SEMANA (acumulado no mês)\n`;
    semanasResumo.forEach(sem => {
      const temCouver = sem.couver > 0;
      txt += `Sem ${sem.semInfo.num} (${sem.semInfo.periodo}): Couvert ${temCouver?fmtR(sem.couver):'—'} | Cachê ${fmtR(sem.cache)} | Saldo ${temCouver?(sem.res>=0?'+':'')+fmtR(sem.res):'—'} | Acumulado ${sem.acumulado>=0?'+':''}${fmtR(sem.acumulado)}\n`;
    });
  }

  return txt.trim();
}

function _triosWpp() {
  const txt = _triosRelatorioTexto();
  window.open('https://wa.me/?text=' + encodeURIComponent(txt));
}

function _triosPDF() {
  const txt = _triosRelatorioTexto();
  gerarPDF(txt, `Relatório de Trios — ${_triosMesLabel(S.triosMes)}`);
}

async function _triosConfirmar(id, atualConf) {
  const sess = (() => { try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch(e) { return null; } })();
  const novoConf = !atualConf;
  try {
    const { error } = await db.from('gn_trios_agenda').update({
      confirmado: novoConf,
      confirmado_por: novoConf ? (sess?.nome || 'Gerente') : null,
      confirmado_em: novoConf ? new Date().toISOString() : null,
    }).eq('id', id);
    if (error) throw error;
    toast(novoConf ? '✓ Apresentação confirmada!' : 'Confirmação removida', novoConf ? 'ok' : '');
  } catch(e) {
    toast('Erro ao confirmar: ' + (e.message || e), 'err');
  }
  renderTrios(true);
}

function _triosNovoModal(prefill) {
