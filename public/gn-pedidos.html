<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GN — Estoque e Pedidos</title>
<style>
:root {
  --bg: #0D0D1A;
  --card: #12122A;
  --card2: #1A1A35;
  --border: #2A2A45;
  --primary: #E8580A;
  --primary-d: #C04A08;
  --gold: #F5D98A;
  --text: #E8E8E8;
  --muted: #8892A4;
  --ok: #22C55E;
  --warn: #F59E0B;
  --err: #EF4444;
  --r: 10px;
  --rs: 6px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden}
.num{font-family:'Consolas','Courier New',monospace;color:var(--gold)}

/* ── LOADING ── */
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:16px}
.spin{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── LOGIN ── */
#login{display:none;min-height:100vh;align-items:center;justify-content:center;flex-direction:column;padding:24px}
#login.ativo{display:flex}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:32px 28px;width:100%;max-width:360px}
.login-logo{font-size:13px;letter-spacing:3px;color:var(--primary);font-weight:700;text-align:center;margin-bottom:6px}
.login-titulo{font-size:22px;font-weight:700;text-align:center;margin-bottom:4px}
.login-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:28px}
.login-card input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:var(--rs);padding:12px 14px;color:var(--text);font-size:16px;outline:none;margin-bottom:12px;letter-spacing:2px}
.login-card input:focus{border-color:var(--primary)}
.login-erro{color:var(--err);font-size:12px;margin-bottom:12px;text-align:center;display:none}
.login-erro.ativo{display:block}
.btn-primary{width:100%;background:var(--primary);color:#fff;border:none;border-radius:var(--rs);padding:14px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
.btn-primary:hover{background:var(--primary-d)}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}

/* ── APP SHELL ── */
#app{display:none;flex-direction:column;min-height:100vh;max-width:900px;margin:0 auto}
#app.ativo{display:flex}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header-logo{font-size:11px;letter-spacing:2px;color:var(--primary);font-weight:700}
.header-titulo{font-size:15px;font-weight:600}
.header-data{font-size:11px;color:var(--muted)}
.btn-logout{background:none;border:1px solid var(--border);border-radius:var(--rs);padding:6px 10px;color:var(--muted);font-size:11px;cursor:pointer}
.btn-logout:hover{border-color:var(--primary);color:var(--primary)}

/* ── NAV BOTTOM ── */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:100;max-width:900px;margin:0 auto}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px 8px;cursor:pointer;gap:3px;transition:.15s;border:none;background:none;color:var(--muted)}
.nav-item.ativo{color:var(--primary)}
.nav-item svg{width:20px;height:20px}
.nav-item span{font-size:9px;font-weight:600;letter-spacing:.5px}

/* ── CONTENT ── */
.content{flex:1;padding:12px 12px 80px;overflow-y:auto}

/* ── TOAST ── */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1E2035;border:1px solid var(--border);border-radius:var(--r);padding:10px 18px;font-size:13px;font-weight:500;z-index:500;opacity:0;transition:.3s;white-space:nowrap;pointer-events:none}
#toast.ativo{opacity:1}
#toast.ok{border-color:var(--ok);color:var(--ok)}
#toast.err{border-color:var(--err);color:var(--err)}

/* ── SECTION HEADER ── */
.sec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.sec-titulo{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;letter-spacing:.5px}
.badge-r{background:#3D1A0A;color:var(--primary)}
.badge-c{background:#143D26;color:var(--ok)}
.badge-e{background:#2D1A3E;color:#A78BFA}

/* ── STORE TABS ── */
.store-tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.store-tabs::-webkit-scrollbar{display:none}
.store-tab{flex-shrink:0;padding:7px 13px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--muted);transition:.15s;white-space:nowrap}
.store-tab.ativo{background:var(--primary);border-color:var(--primary);color:#fff}
.store-tab .contagem{font-size:10px;margin-left:4px;opacity:.7}

/* ── FILTROS ── */
.filtros{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filtro-input{flex:1;min-width:120px;background:var(--card2);border:1px solid var(--border);border-radius:var(--rs);padding:9px 12px;color:var(--text);font-size:13px;outline:none}
.filtro-input:focus{border-color:var(--primary)}
.filtro-select{background:var(--card2);border:1px solid var(--border);border-radius:var(--rs);padding:9px 12px;color:var(--text);font-size:13px;outline:none;cursor:pointer}

/* ── GRUPO ACCORDION ── */
.grupo-bloco{margin-bottom:8px;border-radius:var(--r);overflow:hidden;border:1px solid var(--border)}
.grupo-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--card);cursor:pointer;user-select:none}
.grupo-nome{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--primary)}
.grupo-qtd{font-size:11px;color:var(--muted)}
.grupo-chevron{transition:.2s;color:var(--muted)}
.grupo-bloco.aberto .grupo-chevron{transform:rotate(180deg)}
.grupo-body{display:none;background:var(--card)}
.grupo-bloco.aberto .grupo-body{display:block}

/* ── FORNECEDOR HEADER ── */
.forn-header{padding:6px 14px;background:#16162E;border-top:1px solid var(--border);font-size:10px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase}

/* ── PRODUTO CARD ── */
.prod-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--border);transition:.1s}
.prod-row:hover{background:rgba(232,88,10,.04)}
.prod-info{flex:1;min-width:0}
.prod-nome{font-size:13px;font-weight:500;line-height:1.3;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prod-und{font-size:10px;color:var(--muted);background:var(--card2);padding:2px 6px;border-radius:4px}
.prod-custo{font-size:11px}
.prod-est{font-size:11px;color:var(--muted)}
.prod-est .val{font-family:'Consolas',monospace;color:var(--warn);font-size:13px;font-weight:800}
.prod-ulp{font-size:11px;color:var(--muted)}
.prod-ulp .val{font-family:'Consolas',monospace;color:#93c5fd;font-size:13px;font-weight:700}

/* ── QTY CONTROL ── */
.qty-ctrl{display:flex;align-items:center;gap:0;flex-shrink:0}
.qty-btn{width:28px;height:32px;background:var(--card2);border:1px solid var(--border);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;line-height:1}
.qty-btn:first-child{border-radius:var(--rs) 0 0 var(--rs)}
.qty-btn:last-child{border-radius:0 var(--rs) var(--rs) 0}
.qty-btn:hover{background:var(--primary);border-color:var(--primary);color:#fff}
.qty-btn:active{transform:scale(.92)}
.qty-input{width:52px;height:32px;background:var(--card2);border:1px solid var(--border);border-left:none;border-right:none;color:var(--gold);font-family:'Consolas','Courier New',monospace;font-size:14px;text-align:center;outline:none;padding:0 4px}
.qty-input:focus{background:#1E1E3F}

/* ── PEDIDO SUMMARY BAR ── */
.pedido-bar{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pedido-info{display:flex;flex-direction:column;gap:2px}
.pedido-label{font-size:10px;color:var(--muted);letter-spacing:.5px}
.pedido-valor{font-size:14px;font-weight:600}
.pedido-acoes{display:flex;gap:8px;flex-wrap:wrap}
.btn-sm{padding:8px 14px;border-radius:var(--rs);font-size:12px;font-weight:600;cursor:pointer;border:none;transition:.15s;letter-spacing:.3px}
.btn-outline{background:none;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-success{background:#143D26;border:1px solid var(--ok);color:var(--ok)}
.btn-success:hover{background:var(--ok);color:#000}
.btn-danger{background:#3D1208;border:1px solid var(--err);color:var(--err)}
.btn-danger:hover{background:var(--err);color:#fff}
.btn-orange{background:var(--primary);color:#fff}
.btn-orange:hover{background:var(--primary-d)}
.btn-sm:active{transform:scale(.96)}
.btn-sm:disabled{opacity:.4;cursor:not-allowed}

/* ── LOJA TOTAL ── */
.loja-total{background:var(--card2);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-top:10px;display:flex;align-items:center;justify-content:space-between}
.loja-total-label{font-size:12px;color:var(--muted)}
.loja-total-val{font-size:18px;font-weight:700}

/* ── CATÁLOGO ── */
.cat-item{background:var(--card);border:1px solid var(--border);border-radius:var(--rs);padding:12px 14px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.cat-item-info{flex:1;min-width:0}
.cat-item-nome{font-size:13px;font-weight:500;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-item-meta{font-size:11px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.cat-item-meta span{background:var(--card2);padding:2px 6px;border-radius:4px}
.cat-item-custo{font-size:13px;font-weight:600;white-space:nowrap;flex-shrink:0}
.cat-item-acoes{display:flex;gap:6px;flex-shrink:0}
.icon-btn{width:30px;height:30px;border-radius:var(--rs);border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.icon-btn:hover{border-color:var(--primary);color:var(--primary)}
.icon-btn.del:hover{border-color:var(--err);color:var(--err)}
.toggle-ativo{width:36px;height:20px;border-radius:10px;cursor:pointer;border:none;transition:.2s;flex-shrink:0;position:relative}
.toggle-ativo::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s}
.toggle-ativo.on{background:var(--ok)}
.toggle-ativo.on::after{left:18px}
.toggle-ativo.off{background:var(--border)}
.inativo{opacity:.45}

/* ── FORNECEDORES ── */
.forn-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:8px}
.forn-item-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.forn-item-nome{font-size:14px;font-weight:600}
.dias-grid{display:flex;gap:6px;flex-wrap:wrap}
.dia-btn{width:36px;height:28px;border-radius:var(--rs);border:1px solid var(--border);background:var(--card2);color:var(--muted);font-size:10px;font-weight:700;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;letter-spacing:.3px}
.dia-btn.on{background:#1B3D5A;border-color:#4EA8DE;color:#4EA8DE}
.forn-contato{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:var(--rs);padding:8px 10px;color:var(--text);font-size:12px;outline:none;margin-top:8px;resize:none}
.forn-contato:focus{border-color:var(--primary)}
.btn-salvar-forn{margin-top:8px;padding:6px 14px;font-size:11px;font-weight:600;background:var(--primary);color:#fff;border:none;border-radius:var(--rs);cursor:pointer;transition:.15s}
.btn-salvar-forn:hover{background:var(--primary-d)}
.btn-salvar-forn:active{transform:scale(.96)}

/* ── PROVISÕES ── */
.prov-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:6px}
.prov-item-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px}
.prov-forn{font-size:12px;font-weight:700;color:var(--primary);letter-spacing:.5px}
.prov-data{font-size:11px;color:var(--muted)}
.prov-produto{font-size:13px;font-weight:500;margin-bottom:4px}
.prov-detalhes{display:flex;gap:12px;flex-wrap:wrap}
.prov-det{font-size:11px;color:var(--muted)}
.prov-det .val{font-family:'Consolas',monospace;color:var(--gold)}
.status-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;letter-spacing:.5px}
.s-aguardando{background:#1B2D3E;color:#4EA8DE}
.s-ok{background:#143D26;color:var(--ok)}
.s-div{background:#3D2A0A;color:var(--warn)}
.s-cancel{background:#2D1515;color:var(--err)}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-bg.ativo{display:flex}
@media(min-width:600px){.modal-bg{align-items:center}}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:var(--r) var(--r) 0 0;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:20px;animation:slideUp .25s ease}
@media(min-width:600px){.modal-box{border-radius:var(--r);max-height:80vh}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-titulo{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.modal-close{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
.modal-close:hover{color:var(--text)}
.form-group{margin-bottom:12px}
.form-label{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:5px;display:block;letter-spacing:.5px}
.form-input,.form-select{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px;color:var(--text);font-size:13px;outline:none}
.form-input:focus,.form-select:focus{border-color:var(--primary)}
.form-row{display:flex;gap:8px}
.form-row .form-group{flex:1}
.modal-acoes{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-icon{font-size:36px;margin-bottom:10px}
.empty-texto{font-size:13px}

/* ── CHIPS ── */
.chip{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;letter-spacing:.5px}
.chip-rascunho{background:#2A1F0A;color:var(--warn)}
.chip-confirmado{background:#0D3025;color:var(--ok)}
.chip-enviado{background:#1A1040;color:#A78BFA}

/* ── CONFIRM PEDIDO VIEW ── */
.confirm-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:12px}
.confirm-table th{padding:7px 10px;background:var(--card2);color:var(--muted);font-weight:600;text-align:left;font-size:10px;letter-spacing:.5px;border-bottom:1px solid var(--border)}
.confirm-table td{padding:7px 10px;border-bottom:1px solid var(--border)}
.confirm-table tr:last-child td{border-bottom:none}
.confirm-table td.num{color:var(--gold);font-family:'Consolas',monospace}

/* ── SEMANA NAV ── */
.semana-nav{background:var(--card2);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.semana-nav-arrow{width:34px;height:34px;border-radius:var(--rs);border:1px solid var(--border);background:none;color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
.semana-nav-arrow:hover{border-color:var(--primary);color:var(--primary)}
.semana-nav-arrow:disabled{opacity:.25;cursor:default}
.semana-nav-arrow:active:not(:disabled){transform:scale(.9)}
.semana-info{text-align:center;flex:1}
.semana-label{font-size:11px;color:var(--muted);letter-spacing:1px;font-weight:700}
.semana-periodo{font-family:'Consolas','Courier New',monospace;font-size:15px;color:var(--gold);font-weight:700;margin-top:2px}
.semana-atual-badge{font-size:9px;color:var(--primary);font-weight:700;letter-spacing:.5px;margin-top:2px}


/* ── TODOS MODO ── */
.toggle-modo{display:flex;gap:0;margin-bottom:10px;border-radius:var(--rs);overflow:hidden;border:1px solid var(--border);width:fit-content}
.toggle-modo-btn{padding:7px 16px;font-size:11px;font-weight:700;cursor:pointer;border:none;background:var(--card2);color:var(--muted);transition:.15s;letter-spacing:.5px}
.toggle-modo-btn.ativo{background:var(--primary);color:#fff}
.todos-prod-card{border-top:1px solid var(--border);padding:10px 14px}
.todos-prod-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px}
.todos-prod-nome{font-size:13px;font-weight:500;flex:1}
.todos-prod-custo{font-size:11px;white-space:nowrap;flex-shrink:0}
.todos-lojas-grid{display:flex;flex-direction:column;gap:5px}
.todos-loja-row{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.todos-loja-row:last-child{border-bottom:none}
.todos-loja-nome{font-size:11px;font-weight:600;color:var(--muted);min-width:90px;flex-shrink:0}
.todos-loja-est{font-size:11px;color:var(--muted);min-width:60px}
.todos-loja-est .v{font-family:'Consolas',monospace;color:var(--warn);font-size:12px;font-weight:700}
.todos-loja-ulp{font-size:11px;color:var(--muted);min-width:56px}
.todos-loja-ulp .v{font-family:'Consolas',monospace;color:#93c5fd;font-size:12px;font-weight:700}
.todos-loja-total{font-size:11px;margin-left:auto;white-space:nowrap}
.todos-loja-total .v{font-family:'Consolas',monospace;color:var(--gold)}
.todos-prod-total{font-size:11px;margin-top:7px;padding-top:6px;border-top:1px solid var(--border);display:flex;justify-content:space-between}
.qty-ctrl-sm{display:flex;align-items:center;gap:0;flex-shrink:0}
.qty-btn-sm{width:24px;height:28px;background:var(--card2);border:1px solid var(--border);color:var(--text);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.qty-btn-sm:first-child{border-radius:4px 0 0 4px}
.qty-btn-sm:last-child{border-radius:0 4px 4px 0}
.qty-btn-sm:hover{background:var(--primary);border-color:var(--primary);color:#fff}
.qty-input-sm{width:44px;height:28px;background:var(--card2);border:1px solid var(--border);border-left:none;border-right:none;color:var(--gold);font-family:'Consolas',monospace;font-size:13px;text-align:center;outline:none}
.qty-input-sm:focus{background:#1E1E3F}
/* ── RESPONSIVE ── */
@media(max-width:400px){
  .prod-nome{font-size:12px}
  .qty-input{width:44px}
  .qty-btn{width:26px}
}
</style>
</head>
<body>

<div id="splash"><div class="spin"></div><span style="font-size:12px;color:var(--muted)">Carregando...</span></div>

<!-- LOGIN -->
<div id="login">
  <div class="login-card">
    <div class="login-logo">GIGANTE NORDESTINO</div>
    <div class="login-titulo">Estoque e Pedidos</div>
    <div class="login-sub">Acesso restrito — Compras</div>
    <input type="text" id="inp-nome" placeholder="Usuário" autocomplete="username" style="margin-bottom:12px;width:100%;background:var(--card2);border:1px solid var(--border);border-radius:var(--rs);padding:12px 14px;color:var(--text);font-size:16px;outline:none">
    <input type="password" id="inp-senha" placeholder="Senha" autocomplete="current-password">
    <div class="login-erro" id="login-erro">Usuário, senha incorretos ou sem permissão.</div>

// SEMANA — FUNÇÕES

function getMondayOfWeek(date = new Date()) {
  const d = new Date(date);
  d.setHours(0, 0, 0, 0);
  const dow = d.getDay(); // 0=Dom, 1=Seg...6=Sáb
  const diff = (dow === 0) ? -6 : 1 - dow;
  d.setDate(d.getDate() + diff);
  return d;
}

function getSundayOfWeek(monday) {
  const sun = new Date(monday);
  sun.setDate(monday.getDate() + 6);
  return sun;
}

function getNumeroSemana(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dow = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dow);
  const anoInicio = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil(((d - anoInicio) / 86400000 + 1) / 7);
}

function formatarSemana(monday) {
  const sunday = getSundayOfWeek(monday);
  const fmtD  = d => d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
  const fmtDL = d => d.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit' });
  const num   = getNumeroSemana(monday);
  const ehAtual = monday.toDateString() === getMondayOfWeek().toDateString();
  return {
    num,
    periodo: `${fmtD(monday)} – ${fmtD(sunday)}`,
    inicioLabel: fmtDL(monday),
    fimLabel: fmtDL(sunday),
    ehAtual,
    ano: monday.getFullYear(),
    isoStr: monday.toISOString().split('T')[0],
  };
}

function datePlusWeeks(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n * 7);
  return d;
}

async function navegarSemana(delta) {
  const nova = datePlusWeeks(S.semanaAtiva, delta);
  const mondayHoje = getMondayOfWeek();
  if (nova > mondayHoje) return; // não avança além da semana atual
  S.semanaAtiva = nova;
  $('content').innerHTML = '<div style="padding:20px;text-align:center"><div class="spin" style="margin:0 auto"></div></div>';

  renderPedido();
}

async function carregarCatalogo() {
  const { data } = await db.from('gn_catalogo')
    .select('*').order('grupo').order('fornecedor').order('produto');

}

async function carregarFornecedores() {

async function carregarLojas() {

async function carregarPedidoAtual() {
  if (!S.semanaAtiva) S.semanaAtiva = getMondayOfWeek();

  const semIsoStr  = S.semanaAtiva.toISOString().split('T')[0];
  const mondayHoje = getMondayOfWeek();
  const ehSemAtual = S.semanaAtiva.toDateString() === mondayHoje.toDateString();

  // Busca pedido da semana selecionada
  const { data } = await db.from('gn_pedidos')
    .select('*')
    .eq('semana_inicio', semIsoStr)
    .eq('regiao', 'RJ')
    .order('criado_em', { ascending: false })
    .limit(1);

  if (data && data.length > 0) {
    S.pedidoAtual = data[0];
  } else if (ehSemAtual) {
    // Semana atual sem pedido → cria rascunho
    const { data: novo } = await db.from('gn_pedidos')
      .insert([{ data_pedido: hoje(), semana_inicio: semIsoStr, status: 'RASCUNHO', regiao: 'RJ' }])
      .select().single();
    S.pedidoAtual = novo;
  } else {
    // Semana passada sem pedido
    S.pedidoAtual = null;
    S.pedidoItens = {};
    S.ultimoPedido = {};
    calcularTotais();
    return;
  }

  await carregarItensPedido();
  await carregarUltimoPedido();
}

async function carregarItensPedido() {
  if (!S.pedidoAtual) return;
  const { data } = await db.from('gn_pedido_itens')
    .select('*, gn_catalogo(id,produto,grupo,fornecedor,und,custo)')
    .eq('pedido_id', S.pedidoAtual.id);

  S.pedidoItens = {};
  (data || []).forEach(item => {
    const cid = item.catalogo_id;
    if (!S.pedidoItens[cid]) S.pedidoItens[cid] = {};
    S.pedidoItens[cid][item.loja_slug] = { id: item.id, qtd: parseFloat(item.qtd_pedida) || 0, custo: item.custo_unitario };
  });
  calcularTotais();
}

async function salvarItem(catalogoId, lojaSlug, qtd, custo) {
  if (!S.pedidoItens[catalogoId]) S.pedidoItens[catalogoId] = {};

  // Preserva o id ANTES de sobrescrever — bug crítico estava aqui
  const idExistente = S.pedidoItens[catalogoId][lojaSlug]?.id;

  // Atualiza estado preservando o id
  S.pedidoItens[catalogoId][lojaSlug] = { id: idExistente, qtd, custo };
  calcularTotais();
  renderTotalLoja();

  try {
    if (idExistente) {
      const { error } = await db.from('gn_pedido_itens')
        .update({ qtd_pedida: qtd, custo_unitario: custo })
        .eq('id', idExistente);
      if (error) throw error;
    } else {
      const { data, error } = await db.from('gn_pedido_itens').insert([{
        pedido_id: S.pedidoAtual.id,
        catalogo_id: catalogoId,
        loja_slug: lojaSlug,
        qtd_pedida: qtd,
        custo_unitario: custo
      }]).select('id').single();
      if (error) throw error;
      if (data) S.pedidoItens[catalogoId][lojaSlug].id = data.id;
    }
  } catch (e) {
    console.error('Erro salvarItem:', e.message);
    toast('Erro ao salvar: ' + e.message, 'err');
  }
}

async function confirmarPedido() {
  if (!S.pedidoAtual) return;
  if (S.pedidoAtual.status === 'CONFIRMADO') {
    toast('Este pedido já foi confirmado.', 'err'); return;
  }

  const totalItens = Object.values(S.pedidoItens)
    .flatMap(l => Object.values(l))
    .filter(i => i.qtd > 0).length;

  if (totalItens === 0) {
    toast('Nenhum item com quantidade para confirmar.', 'err'); return;
  }

  if (!confirm('Confirmar pedido e gerar provisões para todas as lojas?')) return;

  try {
    // 1. Recarregar itens do banco para garantir que todos têm id
    await carregarItensPedido();

    // 2. Confirmar pedido
    const semIsoStr = S.semanaAtiva.toISOString().split('T')[0];
    const { error: errPed } = await db.from('gn_pedidos')
      .update({ status: 'CONFIRMADO', semana_inicio: semIsoStr, atualizado_em: new Date().toISOString() })
      .eq('id', S.pedidoAtual.id);
    if (errPed) throw errPed;
    S.pedidoAtual.status = 'CONFIRMADO';

    // 3. Gerar provisões — uma por produto×loja com qtd > 0
    const provisoes = [];
    S.catalogo.forEach(prod => {
      const itensLoja = S.pedidoItens[prod.id];
      if (!itensLoja) return;
      S.lojas.forEach(loja => {
        const item = itensLoja[loja.slug_pedido];
        if (!item || !item.qtd || item.qtd <= 0) return;

        const forn = S.fornecedores.find(f => f.nome === prod.fornecedor);
        const diasForn = forn?.dias_entrega || [];

        // Próxima data de entrega do fornecedor
        let dataEntrega = null;
        if (diasForn.length > 0) {
          const ref = new Date();
          for (let d = 1; d <= 14; d++) {
            const dt = new Date(ref);
            dt.setDate(ref.getDate() + d);
            if (diasForn.includes(DIAS_SEMANA[dt.getDay()])) {
              dataEntrega = dt.toISOString().split('T')[0];
              break;
            }
          }
        }

        provisoes.push({
          pedido_id:      S.pedidoAtual.id,
          pedido_item_id: item.id || null,   // nullable agora
          catalogo_id:    prod.id,
          loja_slug:      loja.slug_pedido,
          fornecedor:     prod.fornecedor,
          data_entrega:   dataEntrega,
          qtd_prevista:   item.qtd,
          valor_previsto: item.qtd * (item.custo ?? prod.custo ?? 0),
          status:         'AGUARDANDO'
        });
      });
    });

    // 4. Inserir provisões em batches
    let erros = 0;
    for (let i = 0; i < provisoes.length; i += 50) {
      const { error } = await db.from('gn_provisoes').insert(provisoes.slice(i, i + 50));
      if (error) { console.error('Erro provisão batch:', error.message); erros++; }
    }

    if (erros > 0) {
      toast(`Pedido confirmado com ${erros} erro(s) nas provisões. Verifique o console.`, 'err');
    } else {
      toast(`✓ Pedido confirmado! ${provisoes.length} provisões geradas.`, 'ok');
    }

    // 5. Atualizar estado local e re-renderizar
    calcularTotais();
    renderPedido();

  } catch (e) {
    console.error('Erro confirmarPedido:', e);
    toast('Erro ao confirmar: ' + (e.message || e), 'err');
  }
}

async function novoPedido() {
  if (!confirm('Criar novo pedido em branco?\nO rascunho atual será descartado.')) return;
  const semIsoStr = S.semanaAtiva.toISOString().split('T')[0];
  await db.from('gn_pedidos').update({ status: 'CANCELADO' }).eq('id', S.pedidoAtual.id);
  const { data } = await db.from('gn_pedidos')
    .insert([{ data_pedido: hoje(), semana_inicio: semIsoStr, status: 'RASCUNHO', regiao: 'RJ' }])
    .select().single();
  S.pedidoAtual = data;
  S.pedidoItens = {};
  calcularTotais();
  renderPedido();
  toast('Novo pedido criado.', 'ok');
}

// ═══════════════════════════════════════════════
function calcularTotais() {
  S.totaisPorLoja = {};
  S.lojas.forEach(l => { S.totaisPorLoja[l.slug_pedido] = 0; });

  Object.entries(S.pedidoItens).forEach(([cid, lojas]) => {
    const prod = S.catalogo.find(p => p.id === cid);
    if (!prod) return;
    Object.entries(lojas).forEach(([loja, item]) => {
      if (item.qtd > 0) {
        const custo = item.custo ?? prod.custo ?? 0;
        S.totaisPorLoja[loja] = (S.totaisPorLoja[loja] || 0) + item.qtd * custo;
      }
    });
  });
}

function totalPedidoGeral() {
  return Object.values(S.totaisPorLoja).reduce((a,b) => a+b, 0);
}

function contarItensLoja(lojaSlug) {
  let n = 0;
  Object.values(S.pedidoItens).forEach(lojas => {
    if (lojas[lojaSlug]?.qtd > 0) n++;
  });
  return n;
}

// ═══════════════════════════════════════════════
// NAVEGAÇÃO
// ═══════════════════════════════════════════════
function setTab(tab) {
  S.tab = tab;
  document.querySelectorAll('.nav-item').forEach(b => {
    b.classList.toggle('ativo', b.dataset.tab === tab);
  });
  renderContent();
}

function renderContent() {
  switch(S.tab) {
    case 'pedido':      renderPedido(); break;
    case 'catalogo':    renderCatalogo(); break;
    case 'fornecedores':renderFornecedores(); break;
    case 'provisoes':   renderProvisoes(); break;
    case 'entrega':     renderEntrega(); break;
  }
}

// ═══════════════════════════════════════════════
// RENDER: PEDIDO
// ═══════════════════════════════════════════════
function renderPedido() {
  if (!S.semanaAtiva) S.semanaAtiva = getMondayOfWeek();

  const sem = formatarSemana(S.semanaAtiva);
  const mondayHoje = getMondayOfWeek();
  const podeAvancar = S.semanaAtiva < mondayHoje;

  // Barra de semana (sempre visível)
  const semNavHtml = `
    <div class="semana-nav">
      <button class="semana-nav-arrow" onclick="navegarSemana(-1)" title="Semana anterior">‹</button>
      <div class="semana-info">
        <div class="semana-label">SEMANA ${sem.num} · ${sem.ano}</div>
        <div class="semana-periodo">${sem.periodo}</div>
        ${sem.ehAtual ? '<div class="semana-atual-badge">▶ SEMANA ATUAL</div>' : '<div class="semana-atual-badge" style="color:var(--muted)">semana passada</div>'}
      </div>
      <button class="semana-nav-arrow" onclick="navegarSemana(1)" ${podeAvancar?'':'disabled'} title="Próxima semana">›</button>
    </div>`;

  if (!S.pedidoAtual) {
    $('content').innerHTML = semNavHtml + `
      <div class="empty" style="margin-top:20px">
        <div class="empty-icon">📋</div>
        <div class="empty-texto">Nenhum pedido nesta semana</div>
      </div>`;
    return;
  }

  const statusChip = {
    'RASCUNHO': '<span class="chip chip-rascunho">RASCUNHO</span>',
    'CONFIRMADO': '<span class="chip chip-confirmado">CONFIRMADO</span>',
    'ENVIADO': '<span class="chip chip-enviado">ENVIADO</span>',
  }[S.pedidoAtual.status] || '';

  const totalGeral = totalPedidoGeral();
  const pedConfirmado = S.pedidoAtual.status === 'CONFIRMADO';

  // Grupos únicos do catálogo ativo
  const grupos = [...new Set(S.catalogo.filter(p=>p.ativo).map(p=>p.grupo))].sort();
  const busca   = S.busca.toLowerCase();
  const lojaAtiva = S.lojaAtiva;

  // ── Toggle Modo ──
  const toggleModo = `
    <div class="toggle-modo">
      <button class="toggle-modo-btn${!S.todosModo?' ativo':''}" onclick="setModo(false)">POR LOJA</button>
      <button class="toggle-modo-btn${S.todosModo?' ativo':''}" onclick="setModo(true)">TODOS</button>
    </div>`;

  // ── Store Tabs (só no modo POR LOJA) ──
  const storeTabs = !S.todosModo ? S.lojas.map(l => {
    const n = contarItensLoja(l.slug_pedido);
    return `<button class="store-tab${lojaAtiva===l.slug_pedido?' ativo':''}"
      onclick="selecionarLoja('${l.slug_pedido}')">
      ${l.nome_display}${n>0?`<span class="contagem">(${n})</span>`:''}
    </button>`;
  }).join('') : '';

  // ── Produtos filtrados ──
  function prodsFiltrados(grupo) {
    return S.catalogo.filter(p =>
      p.ativo && p.grupo === grupo &&
      (!S.grupoFiltro || p.grupo === S.grupoFiltro) &&
      (!S.fornFiltro  || p.fornecedor === S.fornFiltro) &&
      (!busca || p.produto.toLowerCase().includes(busca) || p.fornecedor.toLowerCase().includes(busca))
    );
  }

  // ── MODO: POR LOJA ──
  function renderGruposPorLoja() {
    return grupos.map(grupo => {
      const prods = prodsFiltrados(grupo);
      if (prods.length === 0) return '';
      const fors = [...new Set(prods.map(p=>p.fornecedor))].sort();
      const aberto = S.gruposAbertos.has(grupo);

      const fornsHtml = fors.map(forn => {
        const pp = prods.filter(p => p.fornecedor === forn);
        const rowsHtml = pp.map(prod => {
          const contagem = S.contagens[prod.id]?.[lojaAtiva];
          const ultimoPed = S.ultimoPedido[prod.id]?.[lojaAtiva];
          const itemAtual = S.pedidoItens[prod.id]?.[lojaAtiva];
          const qtdAtual  = itemAtual?.qtd ?? 0;
          const estDisp = contagem?.atual != null
            ? `<span class="val">${fmtQtd(contagem.atual)}</span>`
            : '<span style="color:var(--muted)">—</span>';
          const ulpDisp = ultimoPed != null
            ? `<span class="val">${fmtQtd(ultimoPed)}</span>`
            : '<span style="color:var(--muted)">—</span>';
          return `<div class="prod-row">
            <div class="prod-info">
              <div class="prod-nome" title="${prod.produto}">${prod.produto}</div>
              <div class="prod-meta">
                <span class="prod-und">${prod.und}</span>
                ${prod.custo?`<span class="prod-custo num">R$${fmt(prod.custo)}`:''}
                <span class="prod-est">Est: ${estDisp}</span>
                <span class="prod-ulp">Últ: ${ulpDisp}</span>
              </div>
            </div>
            <div class="qty-ctrl">
              <button class="qty-btn" onclick="ajustarQtd('${prod.id}','${lojaAtiva}',${prod.custo||0},-1)" ${pedConfirmado?'disabled':''}>−</button>
              <input class="qty-input" type="number" min="0" step="0.5"
                value="${qtdAtual||''}" placeholder="0" ${pedConfirmado?'disabled':''}
                onchange="qtdChanged('${prod.id}','${lojaAtiva}',${prod.custo||0},this.value)"
                onblur="qtdChanged('${prod.id}','${lojaAtiva}',${prod.custo||0},this.value)">
              <button class="qty-btn" onclick="ajustarQtd('${prod.id}','${lojaAtiva}',${prod.custo||0},1)" ${pedConfirmado?'disabled':''}>+</button>
            </div>
          </div>`;
        }).join('');
        return `<div><div class="forn-header">${forn}</div>${rowsHtml}</div>`;
      }).join('');

      const totalItens = prods.reduce((n,p)=>n+(S.pedidoItens[p.id]?.[lojaAtiva]?.qtd>0?1:0),0);
      return `<div class="grupo-bloco${aberto?' aberto':''}" id="grupo-${grupo.replace(/[^a-z0-9]/gi,'_')}">
        <div class="grupo-header" onclick="toggleGrupo('${grupo}')">
          <span class="grupo-nome">${grupo}</span>
          <div style="display:flex;align-items:center;gap:8px">
            ${totalItens>0?`<span class="grupo-qtd num">${totalItens} item${totalItens>1?'s':''}</span>`:''}
            <svg class="grupo-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>
        <div class="grupo-body">${fornsHtml}</div>
      </div>`;
    }).join('');
  }

  // ── MODO: TODOS ──
  function renderGruposTodos() {
    return grupos.map(grupo => {
      const prods = prodsFiltrados(grupo);
      if (prods.length === 0) return '';
      const fors = [...new Set(prods.map(p=>p.fornecedor))].sort();
      const aberto = S.gruposAbertos.has(grupo);

      const fornsHtml = fors.map(forn => {
        const pp = prods.filter(p => p.fornecedor === forn);
        const cardsHtml = pp.map(prod => {
          const totalProd = S.lojas.reduce((sum, l) => {
            const qtd = S.pedidoItens[prod.id]?.[l.slug_pedido]?.qtd || 0;
            return sum + qtd * (prod.custo || 0);
          }, 0);
          const totalQtd = S.lojas.reduce((sum, l) => sum + (S.pedidoItens[prod.id]?.[l.slug_pedido]?.qtd || 0), 0);

          const lojasHtml = S.lojas.map(loja => {
            const contagem = S.contagens[prod.id]?.[loja.slug_pedido];
            const ultimoPed = S.ultimoPedido[prod.id]?.[loja.slug_pedido];
            const itemLoja  = S.pedidoItens[prod.id]?.[loja.slug_pedido];
            const qtdL = itemLoja?.qtd ?? 0;
            const estV = contagem?.atual != null ? `<span class="v">${fmtQtd(contagem.atual)}</span>` : '<span style="opacity:.35">—</span>';
            const ulpV = ultimoPed != null ? `<span class="v">${fmtQtd(ultimoPed)}</span>` : '<span style="opacity:.35">—</span>';
            const subT = qtdL > 0 ? `<span class="v">R$${fmt(qtdL*(prod.custo||0))}</span>` : '';
            return `<div class="todos-loja-row">
              <span class="todos-loja-nome">${loja.nome_display}</span>
              <span class="todos-loja-est">Est:${estV}</span>
              <span class="todos-loja-ulp">Últ:${ulpV}</span>
              <div class="qty-ctrl-sm">
                <button class="qty-btn-sm" onclick="ajustarQtd('${prod.id}','${loja.slug_pedido}',${prod.custo||0},-1)" ${pedConfirmado?'disabled':''}>−</button>
                <input class="qty-input-sm" type="number" min="0" step="0.5"
                  value="${qtdL||''}" placeholder="0" ${pedConfirmado?'disabled':''}
                  onchange="qtdChanged('${prod.id}','${loja.slug_pedido}',${prod.custo||0},this.value)"
                  onblur="qtdChanged('${prod.id}','${loja.slug_pedido}',${prod.custo||0},this.value)">
                <button class="qty-btn-sm" onclick="ajustarQtd('${prod.id}','${loja.slug_pedido}',${prod.custo||0},1)" ${pedConfirmado?'disabled':''}>+</button>
              </div>
              ${subT?`<span class="todos-loja-total">${subT}</span>`:''}
            </div>`;
          }).join('');

          return `<div class="todos-prod-card">
            <div class="todos-prod-header">
              <div class="todos-prod-nome">${prod.produto}</div>
              <div class="todos-prod-custo num">${prod.custo?`R$${fmt(prod.custo)}`:''} <span style="color:var(--muted);font-size:10px">${prod.und}</span></div>
            </div>
            <div class="todos-lojas-grid">${lojasHtml}</div>
            ${totalQtd>0?`<div class="todos-prod-total">
              <span style="color:var(--muted);font-size:11px">Total: <span style="font-family:Consolas;color:var(--text)">${totalQtd} ${prod.und}</span></span>
              <span class="num" style="font-size:12px;font-weight:700">R$ ${fmt(totalProd)}</span>
            </div>`:''}
          </div>`;
        }).join('');

        return `<div><div class="forn-header">${forn}</div>${cardsHtml}</div>`;
      }).join('');

      const totalItensGrupo = prods.reduce((n,p) => {
        return n + S.lojas.reduce((m,l) => m+(S.pedidoItens[p.id]?.[l.slug_pedido]?.qtd>0?1:0),0);
      },0);

      return `<div class="grupo-bloco${aberto?' aberto':''}" id="grupo-${grupo.replace(/[^a-z0-9]/gi,'_')}">
        <div class="grupo-header" onclick="toggleGrupo('${grupo}')">
          <span class="grupo-nome">${grupo}</span>
          <div style="display:flex;align-items:center;gap:8px">
            ${totalItensGrupo>0?`<span class="grupo-qtd num">${totalItensGrupo} item${totalItensGrupo>1?'s':''}</span>`:''}
            <svg class="grupo-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        </div>
        <div class="grupo-body">${fornsHtml}</div>
      </div>`;
    }).join('');
  }

  const gruposHtml = S.todosModo ? renderGruposTodos() : renderGruposPorLoja();
  const totalLoja  = S.totaisPorLoja[lojaAtiva] || 0;
  const lojaDisplay = S.lojas.find(l=>l.slug_pedido===lojaAtiva)?.nome_display || '';

  $('content').innerHTML = semNavHtml + `
    <div class="pedido-bar">
      <div class="pedido-info">
        <div class="pedido-label">PEDIDO</div>
        <div class="pedido-valor">${statusChip} &nbsp;<span style="font-size:11px;color:var(--muted)">${S.pedidoAtual.data_pedido}</span></div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">Total geral: <span class="num">R$ ${fmt(totalGeral)}</span></div>
      </div>
      <div class="pedido-acoes">
        <button class="btn-sm btn-outline" onclick="novoPedido()">Novo</button>
        <button class="btn-sm" onclick="gerarWppPedido()" style="background:rgba(37,211,102,.15);border:1px solid rgba(37,211,102,.4);color:#22c55e">📲</button>
        ${!pedConfirmado ? `
          <button class="btn-sm btn-success" onclick="confirmarPedido()">✓ Confirmar</button>
        ` : `
          <button class="btn-sm btn-orange" onclick="verProvisoes()">Ver Provisões</button>
        `}
      </div>
    </div>

    ${toggleModo}
    ${!S.todosModo ? `<div class="store-tabs">${storeTabs}</div>` : ''}

    <div class="filtros">
      <input class="filtro-input" type="search" placeholder="🔍 Buscar produto..." 
        value="${S.busca}" oninput="S.busca=this.value;renderPedido()">
      <select class="filtro-select" onchange="S.grupoFiltro=this.value;renderPedido()">
        <option value="">Todos grupos</option>
        ${grupos.map(g=>`<option value="${g}"${S.grupoFiltro===g?' selected':''}>${g}</option>`).join('')}
      </select>
    </div>

    <div id="grupos-lista">${gruposHtml}</div>

    ${S.todosModo ? `
      <div class="loja-total">
        <div>
          <div style="font-size:11px;color:var(--muted)">TOTAL GERAL — TODAS AS LOJAS</div>
          <div style="font-size:10px;color:var(--muted)">${Object.values(S.totaisPorLoja).filter(v=>v>0).length} lojas com itens</div>
        </div>
        <div class="loja-total-val num" id="total-loja">R$ ${fmt(totalGeral)}</div>
      </div>` : `
      <div class="loja-total">
        <div>
          <div style="font-size:11px;color:var(--muted)">TOTAL — ${lojaDisplay}</div>
          <div style="font-size:10px;color:var(--muted)">${contarItensLoja(lojaAtiva)} itens com pedido</div>
        </div>
        <div class="loja-total-val num" id="total-loja">R$ ${fmt(totalLoja)}</div>
      </div>`}
  `;
}

function renderTotalLoja() {
  const t = $('total-loja');
  if (t) t.textContent = `R$ ${fmt(S.totaisPorLoja[S.lojaAtiva] || 0)}`;
}

function selecionarLoja(slug) {
  S.lojaAtiva = slug;
  S.todosModo = false;
  renderPedido();
}

function setModo(todos) {
  S.todosModo = todos;
  renderPedido();
}

function toggleGrupo(grupo) {
  if (S.gruposAbertos.has(grupo)) S.gruposAbertos.delete(grupo);
  else S.gruposAbertos.add(grupo);
  const el = document.getElementById('grupo-' + grupo.replace(/[^a-z0-9]/gi,'_'));
  if (el) el.classList.toggle('aberto', S.gruposAbertos.has(grupo));
}

async function qtdChanged(catalogoId, lojaSlug, custo, valor) {
  const qtd = parseFloat(valor) || 0;
  await salvarItem(catalogoId, lojaSlug, qtd, custo || null);
  renderTotalLoja();
  // Atualiza contagem na tab
  document.querySelectorAll('.store-tab').forEach(btn => {
    const slug = btn.getAttribute('onclick')?.match(/'([^']+)'/)?.[1];
    if (!slug) return;
    const n = contarItensLoja(slug);
    const span = btn.querySelector('.contagem');
    if (n > 0) {
      if (span) span.textContent = `(${n})`;
      else btn.innerHTML += `<span class="contagem">(${n})</span>`;
    } else if (span) span.remove();
  });
}

async function ajustarQtd(catalogoId, lojaSlug, custo, delta) {
  const atual = S.pedidoItens[catalogoId]?.[lojaSlug]?.qtd ?? 0;
  const nova = Math.max(0, atual + delta);

  // Atualiza input visual
  const inputs = document.querySelectorAll('.qty-input');
  inputs.forEach(inp => {
    const row = inp.closest('.prod-row');
    if (!row) return;
    // Match pelo contexto do onclick dos botões irmãos
    const bts = row.querySelectorAll('.qty-btn');
    const onclickAttr = bts[0]?.getAttribute('onclick') || '';
    if (onclickAttr.includes(catalogoId) && onclickAttr.includes(lojaSlug)) {
      inp.value = nova || '';
    }
  });

  await salvarItem(catalogoId, lojaSlug, nova, custo || null);
}

function verProvisoes() {
  S.tab = 'provisoes';
  setTab('provisoes');
}

// ═══════════════════════════════════════════════
// RENDER: CATÁLOGO
// ═══════════════════════════════════════════════
function renderCatalogo() {
  const grupos = [...new Set(S.catalogo.map(p=>p.grupo))].sort();
  const forns  = [...new Set(S.catalogo.map(p=>p.fornecedor))].sort();
  const busca  = S.catBusca.toLowerCase();

  const lista = S.catalogo.filter(p =>
    (S.mostraInativos || p.ativo) &&
    (!S.catGrupo || p.grupo === S.catGrupo) &&
    (!S.catForn  || p.fornecedor === S.catForn) &&
    (!busca || p.produto.toLowerCase().includes(busca) || p.fornecedor.toLowerCase().includes(busca))
  );

  const itensHtml = lista.length === 0
    ? '<div class="empty"><div class="empty-icon">📦</div><div class="empty-texto">Nenhum produto encontrado</div></div>'
    : lista.map(p => `
      <div class="cat-item${p.ativo?'':' inativo'}">
        <button class="toggle-ativo ${p.ativo?'on':'off'}" onclick="toggleAtivoProd('${p.id}',${!p.ativo})" title="${p.ativo?'Desativar':'Ativar'}"></button>
        <div class="cat-item-info">
          <div class="cat-item-nome">[${p.item_id}] ${p.produto}</div>
          <div class="cat-item-meta">
            <span>${p.grupo}</span>
            <span>${p.subgrupo}</span>
            <span>${p.fornecedor}</span>
            <span>${p.und}</span>
          </div>
        </div>
        <div class="cat-item-custo num">${p.custo ? 'R$'+fmt(p.custo) : '—'}</div>
        <div class="cat-item-acoes">
          <button class="icon-btn" onclick="editarProduto('${p.id}')" title="Editar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
        </div>
      </div>`).join('');

  $('content').innerHTML = `
    <div class="sec-header">
      <div class="sec-titulo">
        <span>Catálogo</span>
        <span class="badge badge-r">${lista.length}</span>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn-sm btn-outline" onclick="toggleInativos()" style="font-size:11px">
          ${S.mostraInativos?'Ocultar inat.':'Ver inat.'}
        </button>
        <button class="btn-sm btn-orange" onclick="modalNovoProduto()">+ Novo</button>
      </div>
    </div>

    <div class="filtros">
      <input class="filtro-input" type="search" placeholder="🔍 Buscar produto..."
        value="${S.catBusca}" oninput="S.catBusca=this.value;renderCatalogo()">
      <select class="filtro-select" onchange="S.catGrupo=this.value;renderCatalogo()">
        <option value="">Todos grupos</option>
        ${grupos.map(g=>`<option value="${g}"${S.catGrupo===g?' selected':''}>${g}</option>`).join('')}
      </select>
      <select class="filtro-select" onchange="S.catForn=this.value;renderCatalogo()">
        <option value="">Todos fornec.</option>
        ${forns.map(f=>`<option value="${f}"${S.catForn===f?' selected':''}>${f}</option>`).join('')}
      </select>
    </div>

    <div id="cat-lista">${itensHtml}</div>
  `;
}

function toggleInativos() {
  S.mostraInativos = !S.mostraInativos;
  renderCatalogo();
}

async function toggleAtivoProd(id, novoStatus) {
  await db.from('gn_catalogo').update({ ativo: novoStatus, atualizado_em: new Date().toISOString() }).eq('id', id);
  const idx = S.catalogo.findIndex(p => p.id === id);
  if (idx >= 0) S.catalogo[idx].ativo = novoStatus;
  renderCatalogo();
  toast(novoStatus ? 'Produto ativado.' : 'Produto desativado.', 'ok');
}

function modalNovoProduto() {
  const grupos = [...new Set(S.catalogo.map(p=>p.grupo))].sort();
  const forns  = S.fornecedores.map(f=>f.nome).sort();

  abrirModal(`
    <div class="modal-titulo">
      Novo Produto
      <button class="modal-close" onclick="$('modal-bg').classList.remove('ativo')">×</button>
    </div>
    <div class="form-group">
      <label class="form-label">CÓDIGO (item_id)</label>
      <input class="form-input" id="m-item-id" type="number" placeholder="Ex: 400">
    </div>
    <div class="form-group">
      <label class="form-label">PRODUTO</label>
      <input class="form-input" id="m-produto" type="text" placeholder="Nome completo do produto">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">GRUPO</label>
        <select class="form-select" id="m-grupo">
          ${grupos.map(g=>`<option value="${g}">${g}</option>`).join('')}
          <option value="__novo__">+ Novo grupo</option>
        </select>
      </div>

async function salvarNovoProduto() {
  const item_id = parseInt($('m-item-id').value);
  const produto  = $('m-produto').value.trim();
  const grupo    = $('m-grupo').value;
  const subgrupo = $('m-subgrupo').value.trim().toUpperCase() || 'GERAL';
  const fornecedor = $('m-forn').value;
  const und      = $('m-und').value;
  const custo    = parseFloat($('m-custo').value) || null;

  if (!produto || !grupo || !item_id) { toast('Preencha código, produto e grupo.','err'); return; }

  const { data, error } = await db.from('gn_catalogo')
    .insert([{ item_id, produto, grupo, subgrupo, fornecedor, und, custo }]).select().single();

  if (error) { toast('Erro: '+error.message,'err'); return; }
  S.catalogo.push(data);
  S.catalogo.sort((a,b) => a.grupo.localeCompare(b.grupo)||a.produto.localeCompare(b.produto));
  $('modal-bg').classList.remove('ativo');
  toast('Produto adicionado!','ok');
  renderCatalogo();
}

async function salvarEdicaoProduto(id) {
  const produto  = $('m-produto').value.trim();
  const grupo    = $('m-grupo').value;
  const subgrupo = $('m-subgrupo').value.trim().toUpperCase() || 'GERAL';
  const fornecedor = $('m-forn').value;
  const und      = $('m-und').value;
  const custo    = parseFloat($('m-custo').value) || null;

  if (!produto || !grupo) { toast('Preencha produto e grupo.','err'); return; }

  const { error } = await db.from('gn_catalogo')
    .update({ produto, grupo, subgrupo, fornecedor, und, custo, atualizado_em: new Date().toISOString() })
    .eq('id', id);

  if (error) { toast('Erro: '+error.message,'err'); return; }
  const idx = S.catalogo.findIndex(p => p.id === id);
  if (idx >= 0) Object.assign(S.catalogo[idx], { produto, grupo, subgrupo, fornecedor, und, custo });
  $('modal-bg').classList.remove('ativo');
  toast('Produto atualizado!','ok');
  renderCatalogo();
}

async function excluirProduto(id) {
  if (!confirm('Excluir produto do catálogo?\nEle será desativado permanentemente.')) return;
  await db.from('gn_catalogo').update({ ativo: false, atualizado_em: new Date().toISOString() }).eq('id', id);
  const idx = S.catalogo.findIndex(p => p.id === id);
  if (idx >= 0) S.catalogo[idx].ativo = false;
  $('modal-bg').classList.remove('ativo');
  toast('Produto excluído.','ok');
  renderCatalogo();
}

async function toggleDia(fornId, dia) {
  const idx = S.fornecedores.findIndex(f => f.id === fornId);
  if (idx < 0) return;
  const f = S.fornecedores[idx];
  const dias = [...(f.dias_entrega || [])];
  const pos = dias.indexOf(dia);
  if (pos >= 0) dias.splice(pos, 1);
  else dias.push(dia);

  S.fornecedores[idx].dias_entrega = dias;
  await db.from('gn_fornecedores_pedido')
    .update({ dias_entrega: dias, atualizado_em: new Date().toISOString() }).eq('id', fornId);

  // Atualiza só o botão
  const el = document.querySelector(`#forn-${fornId} .dias-grid`);
  if (el) {
    el.querySelectorAll('.dia-btn').forEach(btn => {
      const d = btn.textContent.trim();
      btn.classList.toggle('on', dias.includes(d));
    });
    const info = document.querySelector(`#forn-${fornId} .forn-item-header div:last-child`);
    if (info) info.textContent = dias.length>0?dias.join(', '):'Sem dias';
  }
}

async function salvarFornecedor(fornId) {
  const contato = $(`contato-${fornId}`)?.value.trim() || null;
  const obs     = $(`obs-${fornId}`)?.value.trim() || null;
  const dias    = S.fornecedores.find(f=>f.id===fornId)?.dias_entrega || [];

  await db.from('gn_fornecedores_pedido')
    .update({ contato, observacao: obs, dias_entrega: dias, atualizado_em: new Date().toISOString() })
    .eq('id', fornId);

  const idx = S.fornecedores.findIndex(f=>f.id===fornId);
  if (idx>=0) Object.assign(S.fornecedores[idx], { contato, observacao: obs });
  toast('Fornecedor salvo!','ok');
}

function gerarWppProvisoes() {
  if (!S.provisoes.length) { toast('Nenhuma provisão para enviar.', 'err'); return; }
  const porForn = {};
  S.provisoes.forEach(p => {
    const f = p.fornecedor || 'SEM FORNECEDOR';
    (porForn[f] = porForn[f] || []).push(p);
  });
  const fns = Object.keys(porForn).sort();
  const lojaLabel = S.provLoja
    ? (S.lojas.find(l => l.slug_pedido === S.provLoja)?.nome_display || S.provLoja)
    : 'Todas as lojas';
  let msg = `📦 *PROVISÕES — ${lojaLabel}*\n`;
  let total = 0;
  fns.forEach(forn => {
    const itens = porForn[forn];
    const totF = itens.reduce((a, p) => a + (parseFloat(p.valor_previsto) || 0), 0);
    msg += `\n🏭 *${forn}* — R$ ${fmt(totF)}\n`;
    itens.forEach(p => {
      const lojaNome = S.lojas.find(l => l.slug_pedido === p.loja_slug)?.nome_display || p.loja_slug;
      const icon = p.status === 'RECEBIDO_OK' ? '✅' : p.status === 'DIVERGENCIA' ? '⚠️' : '⏳';
      const dt = p.data_entrega ? ` (${p.data_entrega})` : '';
      msg += `  ${icon} ${lojaNome} — ${p.gn_catalogo?.produto || '—'}: ${fmtQtd(p.qtd_prevista)} ${p.gn_catalogo?.und || ''} R$ ${fmt(p.valor_previsto)}${dt}\n`;
      total += parseFloat(p.valor_previsto) || 0;
    });
  });
  msg += `\n💰 *Total: R$ ${fmt(total)}*`;
  window.open('https://wa.me/?text=' + encodeURIComponent(msg));
}

function gerarWppPedido() {
  if (!S.pedidoAtual) { toast('Nenhum pedido ativo.', 'err'); return; }
  const sem = formatarSemana(S.semanaAtiva);
  const porForn = {};
  S.catalogo.filter(p => p.ativo).forEach(prod => {
    if (S.todosModo) {
      S.lojas.forEach(loja => {
        const qtd = S.pedidoItens[prod.id]?.[loja.slug_pedido]?.qtd || 0;
        if (qtd <= 0) return;
        (porForn[prod.fornecedor] = porForn[prod.fornecedor] || [])
          .push({ produto: prod.produto, und: prod.und, custo: prod.custo || 0, loja: loja.nome_display, qtd });
      });
    } else {
      const qtd = S.pedidoItens[prod.id]?.[S.lojaAtiva]?.qtd || 0;
      if (qtd <= 0) return;
      const lojaNome = S.lojas.find(l => l.slug_pedido === S.lojaAtiva)?.nome_display || S.lojaAtiva;
      (porForn[prod.fornecedor] = porForn[prod.fornecedor] || [])
        .push({ produto: prod.produto, und: prod.und, custo: prod.custo || 0, loja: lojaNome, qtd });
    }
  });
  const fns = Object.keys(porForn).sort();
  if (!fns.length) { toast('Nenhum item com pedido para enviar.', 'err'); return; }
  const titulo = S.todosModo ? 'TODAS AS LOJAS' : (S.lojas.find(l => l.slug_pedido === S.lojaAtiva)?.nome_display || S.lojaAtiva);
  let msg = `🛒 *PEDIDO — Semana ${sem.num}/${sem.ano}* (${sem.periodo})\n📍 ${titulo}\n`;
  let totalGeral = 0;
  fns.forEach(forn => {
    const itens = porForn[forn];
    msg += `\n🏭 *${forn}*\n`;
    if (S.todosModo) {
      const lojaMap = {};
      itens.forEach(i => (lojaMap[i.loja] = lojaMap[i.loja] || []).push(i));
      Object.entries(lojaMap).sort(([a], [b]) => a.localeCompare(b)).forEach(([lojaNome, items]) => {
        msg += `  📍 ${lojaNome}\n`;
        items.forEach(i => {
          const sub = i.custo > 0 ? ` — R$ ${fmt(i.qtd * i.custo)}` : '';
          msg += `    • ${i.produto}: ${fmtQtd(i.qtd)} ${i.und}${sub}\n`;
          totalGeral += i.qtd * i.custo;
        });
      });
    } else {
      itens.forEach(i => {
        const sub = i.custo > 0 ? ` — R$ ${fmt(i.qtd * i.custo)}` : '';
        msg += `  • ${i.produto}: ${fmtQtd(i.qtd)} ${i.und}${sub}\n`;
        totalGeral += i.qtd * i.custo;
      });
    }
  });
  if (totalGeral > 0) msg += `\n💰 *Total Geral: R$ ${fmt(totalGeral)}*`;
  window.open('https://wa.me/?text=' + encodeURIComponent(msg));
}

function modalValidar(provisaoId) {
  const prov = S.provisoes.find(p => p.id === provisaoId);
  if (!prov) return;

  abrirModal(`
    <div class="modal-titulo">
      Validar Entrega
      <button class="modal-close" onclick="$('modal-bg').classList.remove('ativo')">×</button>
    </div>
    <div style="background:var(--card2);border-radius:var(--rs);padding:12px;margin-bottom:14px;font-size:12px">
      <div style="font-weight:600;margin-bottom:4px">${prov.gn_catalogo?.produto||'—'}</div>
      <div style="color:var(--muted)">Pedido: <span class="num">${fmtQtd(prov.qtd_prevista)} ${prov.gn_catalogo?.und||''}</span> | Valor previsto: <span class="num">R$ ${fmt(prov.valor_previsto)}</span></div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">QTD RECEBIDA</label>
        <input class="form-input" id="m-qtd-rec" type="number" step="0.5" value="${fmtQtd(prov.qtd_prevista)}" placeholder="0">
      </div>
      <div class="form-group">
        <label class="form-label">VALOR RECEBIDO (R$)</label>
        <input class="form-input" id="m-val-rec" type="number" step="0.01" value="${parseFloat(prov.valor_previsto)||''}" placeholder="0.00">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">OBSERVAÇÃO</label>
      <input class="form-input" id="m-obs-rec" type="text" placeholder="Divergência, motivo, etc.">
    </div>
    <div class="modal-acoes">
      <button class="btn-sm btn-outline" onclick="$('modal-bg').classList.remove('ativo')">Cancelar</button>
      <button class="btn-sm btn-success" onclick="confirmarEntrega('${provisaoId}')">✓ Confirmar</button>
    </div>
  `);
}

// ═══════════════════════════════════════════════
// ALERTAS DE ENTREGA ATRASADA
// ═══════════════════════════════════════════════
async function carregarProvisoesPendentes() {
  const { data } = await db.from('gn_provisoes')
    .select('*, gn_catalogo(produto,und)')
    .eq('status', 'AGUARDANDO')
    .not('data_entrega', 'is', null)
    .lt('data_entrega', hoje())
    .order('data_entrega');
  S.provisoesAtrasadas = data || [];
  _atualizarBadgeAtrasadas();
}

function _atualizarBadgeAtrasadas() {
  const btn = document.querySelector('[data-tab="provisoes"]');
  if (!btn) return;
  const n = S.provisoesAtrasadas.length;
  let badge = btn.querySelector('.badge-atrasadas');
  if (n > 0) {
    if (!badge) {
      badge = document.createElement('span');
      badge.className = 'badge-atrasadas';
      badge.style.cssText = 'position:absolute;top:4px;right:calc(50% - 16px);background:#ef4444;color:#fff;border-radius:20px;font-size:8px;font-weight:800;padding:1px 5px;min-width:14px;text-align:center;pointer-events:none';
      btn.style.position = 'relative';
      btn.appendChild(badge);
    }
    badge.textContent = n;
  } else if (badge) {
    badge.remove();
  }
}

function gerarMsgAlertaEntregaPedidos() {
  const at = S.provisoesAtrasadas;
  if (!at.length) return '';
  const dt = new Date().toLocaleDateString('pt-BR')+' '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const porLoja = {};
  at.forEach(p => {
    const nome = S.lojas.find(l => l.slug_pedido === p.loja_slug)?.nome_display || p.loja_slug;
    (porLoja[nome] = porLoja[nome] || []).push(p);
  });
  let msg = `🚨 *ENTREGAS ATRASADAS*\n📅 ${dt}\n\n⏰ *Provisões sem confirmação (prazo vencido):*\n`;
  Object.entries(porLoja).sort(([a],[b])=>a.localeCompare(b)).forEach(([nome, itens]) => {
    msg += `\n📍 *${nome}*\n`;
    itens.forEach(p => {
      msg += `  ▪️ ${p.fornecedor||'—'} — ${p.gn_catalogo?.produto||'—'}: ${fmtQtd(p.qtd_prevista)} ${p.gn_catalogo?.und||''} (previsto: ${p.data_entrega})\n`;
    });
  });
  msg += `\n⚠️ *${at.length} entrega${at.length>1?'s':''} atrasada${at.length>1?'s':''}. Verificar urgentemente!*`;
  return msg;
}

function dispararAlertaEntregaPedidos() {
  const msg = gerarMsgAlertaEntregaPedidos();
  if (!msg) { toast('✅ Nenhuma entrega atrasada.', 'ok'); return; }
  if (!alertasEntregaWpp.length) { abrirModalContatosEntrega(); return; }
  alertasEntregaWpp.forEach((c, i) => {
    setTimeout(() => {
      window.open('https://wa.me/'+(c.numero||'').replace(/\D/g,'')+'?text='+encodeURIComponent(msg), '_blank');
      toast('📲 '+c.nome+' alertado', 'ok');
    }, i * 1800);
  });
}

function _salvarContatosEntrega() {
  try { localStorage.setItem('gn_alertas_entrega_contatos', JSON.stringify(alertasEntregaWpp)); } catch(e) {}
}
function _renderContatosEntrega() {
  const lista = document.getElementById('contatoEntregaLista');
  if (!lista) return;
  lista.innerHTML = !alertasEntregaWpp.length
    ? '<div style="font-size:11px;color:var(--muted);text-align:center;padding:8px">Nenhum contato cadastrado</div>'
    : alertasEntregaWpp.map((c, i) => `
        <div style="display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:var(--rs);padding:8px 12px">
          <div style="flex:1;min-width:0">
            <div style="font-size:12px;font-weight:700">${c.nome}</div>
            <div style="font-size:10px;color:var(--muted)">${c.numero}</div>
          </div>
          <button onclick="_removerContatoEntrega(${i})" style="background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);border-radius:var(--rs);padding:4px 8px;color:#f87171;font-size:11px;cursor:pointer">✕</button>
        </div>`).join('');
}
function _adicionarContatoEntrega() {
  const nome = ($('novo-ent-nome')?.value || '').trim();
  const num  = ($('novo-ent-num')?.value || '').replace(/\D/g,'').trim();
  if (!nome || num.length < 10) { toast('Preencha nome e número válido.', 'err'); return; }
  alertasEntregaWpp.push({ nome, numero: num });
  _salvarContatosEntrega();
  $('novo-ent-nome').value = ''; $('novo-ent-num').value = '';
  _renderContatosEntrega();
}
function _removerContatoEntrega(idx) {
  alertasEntregaWpp.splice(idx, 1);
  _salvarContatosEntrega();
  _renderContatosEntrega();
}
function abrirModalContatosEntrega() {
  abrirModal(`
    <div class="modal-titulo">📲 Contatos — Alertas de Entrega
      <button class="modal-close" onclick="$('modal-bg').classList.remove('ativo')">×</button>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:12px">Recebem alerta WhatsApp quando uma entrega passa da data prevista sem confirmação.</div>
    <div id="contatoEntregaLista" style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px">
      <input id="novo-ent-nome" type="text" placeholder="Nome (ex: Compras)" maxlength="30" class="form-input">
      <input id="novo-ent-num" type="tel" placeholder="5521..." maxlength="15" class="form-input">
    </div>
    <div style="font-size:10px;color:var(--muted);margin-bottom:10px">Formato: 55 + DDD + número (ex: 5521999887766)</div>
    <div class="modal-acoes">
      <button class="btn-sm btn-outline" onclick="_adicionarContatoEntrega()">+ Adicionar</button>
      <button class="btn-sm btn-success" onclick="$('modal-bg').classList.remove('ativo')">✓ Fechar</button>
    </div>
  `);
  _renderContatosEntrega();
}

async function _verificarAlertasEntregaAuto() {
  await carregarProvisoesPendentes();
  if (!S.provisoesAtrasadas.length) return;
  try {
    const ts = parseInt(localStorage.getItem('gn_alerta_entrega_ped_ts') || '0');
    if (Date.now() - ts < 4 * 3600000) return;
  } catch(e) {}
  try { localStorage.setItem('gn_alerta_entrega_ped_ts', String(Date.now())); } catch(e) {}
  if (alertasEntregaWpp.length) dispararAlertaEntregaPedidos();
}

async function confirmarEntrega(provisaoId) {
  const qtdRec = parseFloat($('m-qtd-rec').value) || 0;
  const valRec = parseFloat($('m-val-rec').value) || 0;
  const obs    = $('m-obs-rec').value.trim() || null;
  const prov   = S.provisoes.find(p => p.id === provisaoId);

  const qtdPrev = parseFloat(prov?.qtd_prevista) || 0;
  const diff    = qtdRec - qtdPrev;
  const status  = Math.abs(diff) < 0.01 ? 'RECEBIDO_OK' : 'DIVERGENCIA';

  // Salva recebimento
  await db.from('gn_recebimentos').insert([{
    provisao_id: provisaoId,
    qtd_recebida: qtdRec,
    valor_recebido: valRec,
    diferenca_qtd: diff,
    observacao: obs,
    validado_por: 'MATHEUS'
  }]);

  // Atualiza status da provisão
  await db.from('gn_provisoes').update({ status, atualizado_em: new Date().toISOString() }).eq('id', provisaoId);

  $('modal-bg').classList.remove('ativo');
  toast(status === 'RECEBIDO_OK' ? '✓ Entrega confirmada!' : '⚠ Divergência registrada.', status==='RECEBIDO_OK'?'ok':'err');
  await renderProvisoes();
}

// ═══════════════════════════════════════════════
// RENDER: ENTREGA (resumo de pendentes)
// ═══════════════════════════════════════════════
async function renderEntrega() {
  $('content').innerHTML = '<div class="empty"><div class="spin"></div></div>';
  await carregarEntregasPendentes();

  if (S.entregasPendentes.length === 0) {
    $('content').innerHTML = `
      <div class="sec-header"><div class="sec-titulo">Validar Entregas</div></div>
      <div class="empty">
        <div class="empty-icon">✅</div>
        <div class="empty-texto">Nenhuma entrega pendente!</div>
      </div>`;
    return;
  }

  // Agrupar por data de entrega
  const porData = {};
  S.entregasPendentes.forEach(p => {
    const d = p.data_entrega || 'Sem data';
    if (!porData[d]) porData[d] = [];
    porData[d].push(p);
  });

  const html = Object.entries(porData).sort(([a],[b])=>a.localeCompare(b)).map(([data, itens]) => {
    const total = itens.reduce((a,p)=>a+(parseFloat(p.valor_previsto)||0),0);
    const itensHtml = itens.map(p => {
      const lojaDisplay = S.lojas.find(l=>l.slug_pedido===p.loja_slug)?.nome_display || p.loja_slug;
      return `<div class="prov-item" style="cursor:pointer" onclick="modalValidar('${p.id}')">
        <div class="prov-item-header">
          <div>
            <div class="prov-forn">${p.fornecedor}</div>
            <div class="prov-produto">${p.gn_catalogo?.produto||'—'}</div>
            <div style="font-size:11px;color:var(--muted)">${lojaDisplay}</div>
          </div>
          <div style="text-align:right">
            <div class="num" style="font-size:13px;font-weight:700">R$ ${fmt(p.valor_previsto)}</div>
            <div style="font-size:11px;color:var(--muted)">${fmtQtd(p.qtd_prevista)} ${p.gn_catalogo?.und||''}</div>
            <div style="font-size:10px;color:var(--primary);margin-top:4px">Toque para validar →</div>
          </div>
        </div>
      </div>`;
    }).join('');

    const dtDisplay = data !== 'Sem data' ? new Date(data+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'}) : 'Sem data';

    return `<div class="grupo-bloco aberto" style="margin-bottom:8px">
      <div class="grupo-header" style="cursor:default">
        <span class="grupo-nome">${dtDisplay}</span>
        <div style="display:flex;gap:12px;align-items:center">
          <span style="font-size:11px;color:var(--muted)">${itens.length} item${itens.length>1?'s':''}</span>
          <span class="num" style="font-size:12px">R$ ${fmt(total)}</span>
        </div>
      </div>
      <div class="grupo-body" style="display:block">${itensHtml}</div>
    </div>`;
  }).join('');

  const totalGeral = S.entregasPendentes.reduce((a,p)=>a+(parseFloat(p.valor_previsto)||0),0);

  $('content').innerHTML = `
    <div class="sec-header">
      <div class="sec-titulo">Entregas Pendentes <span class="badge badge-r">${S.entregasPendentes.length}</span></div>
      <div class="num" style="font-size:13px;font-weight:700">R$ ${fmt(totalGeral)}</div>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:12px">
      Toque em um item para registrar o que foi recebido.
    </div>
    ${html}
  `;
}

// ═══════════════════════════════════════════════
// INICIALIZAÇÃO
// ═══════════════════════════════════════════════
async function iniciarApp() {
  $('login').classList.remove('ativo');
  $('app').classList.add('ativo');
  $('header-data').textContent = hojeDisplay();
  try {
    const sess = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    if (sess) $('header-usuario').textContent = sess.nome;
  } catch(e) {}

  // Semana atual
  S.semanaAtiva = getMondayOfWeek();

  // Carregar dados
  await Promise.all([
    carregarCatalogo(),
    carregarFornecedores(),
    carregarLojas(),
    carregarContagens(),
  ]);

  await carregarPedidoAtual();

  // Esconder splash
  $('splash').style.display = 'none';

  // Render inicial
  setTab('pedido');

  // Verificar entregas atrasadas em background (auto-alerta após 6s)
  setTimeout(_verificarAlertasEntregaAuto, 6000);
}

async function init() {
  try {
    const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    if (s && Date.now() - s.ts < TTL && s.permissoes && (s.permissoes.pedidos || s.permissoes.master)) {
      await iniciarApp();
      return;
    }
  } catch(e) {}
  $('splash').style.display = 'none';
  $('login').classList.add('ativo');
}

init();
</script>
