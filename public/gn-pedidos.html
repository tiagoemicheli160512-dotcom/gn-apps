<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GN — Estoque e Pedidos</title>
<style>
:root {
  --bg: #484848;
  --card: #363636;
  --card2: #404040;
  --border: #505050;
  --primary: #E8580A;
  --primary-d: #C04A08;
  --gold: #F5D98A;
  --text: #E8E8E8;
  --muted: #8892A4;
  --ok: #22C55E;
  --warn: #F59E0B;
  --err: #EF4444;
  --r: 10px;
  --rs: 6px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden}
.num{font-family:'Consolas','Courier New',monospace;color:var(--gold)}

/* ── LOADING ── */
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:16px}
.spin{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── LOGIN ── */
#login{display:none;min-height:100vh;align-items:center;justify-content:center;flex-direction:column;padding:24px}
#login.ativo{display:flex}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:32px 28px;width:100%;max-width:360px}
.login-logo{font-size:13px;letter-spacing:3px;color:var(--primary);font-weight:700;text-align:center;margin-bottom:6px}
.login-titulo{font-size:22px;font-weight:700;text-align:center;margin-bottom:4px}
.login-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:28px}
.login-card input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:var(--rs);padding:12px 14px;color:var(--text);font-size:16px;outline:none;margin-bottom:12px;letter-spacing:2px}
.login-card input:focus{border-color:var(--primary)}
.login-erro{color:var(--err);font-size:12px;margin-bottom:12px;text-align:center;display:none}
.login-erro.ativo{display:block}
.btn-primary{width:100%;background:var(--primary);color:#fff;border:none;border-radius:var(--rs);padding:14px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
.btn-primary:hover{background:var(--primary-d)}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}

/* ── APP SHELL ── */
#app{display:none;flex-direction:column;min-height:100vh;max-width:900px;margin:0 auto}
#app.ativo{display:flex}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header-logo{font-size:11px;letter-spacing:2px;color:var(--primary);font-weight:700}
.header-titulo{font-size:15px;font-weight:600}
.header-data{font-size:11px;color:var(--muted)}
.btn-logout{background:none;border:1px solid var(--border);border-radius:var(--rs);padding:6px 10px;color:var(--muted);font-size:11px;cursor:pointer}
.btn-logout:hover{border-color:var(--primary);color:var(--primary)}

/* ── NAV BOTTOM ── */
.nav{position:fixed;bottom:0;left:0;right:0;background:#222222;border-top:1px solid rgba(232,88,10,.25);display:flex;z-index:100;max-width:900px;margin:0 auto}
.nav-btn{flex:1;padding:9px 1px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:#3d3d52;position:relative;min-width:0;transition:color .12s;cursor:pointer;font-family:inherit}
.nav-btn.ativo{color:#E8580A}
.nav-btn.ativo .nav-icon{filter:drop-shadow(0 0 6px rgba(232,88,10,.5))}
.nav-btn.ativo::before{content:'';position:absolute;top:0;left:25%;right:25%;height:2px;background:#E8580A;border-radius:0 0 4px 4px}
.nav-icon{font-size:18px;line-height:1}
.nav-label{font-size:10px;font-weight:700;line-height:1.1;white-space:nowrap}

/* ── CONTENT ── */
.content{flex:1;padding:12px 12px 80px;overflow-y:auto}

/* ── TOAST ── */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#353545;border:1px solid var(--border);border-radius:var(--r);padding:10px 18px;font-size:13px;font-weight:500;z-index:500;opacity:0;transition:.3s;white-space:nowrap;pointer-events:none}
#toast.ativo{opacity:1}
#toast.ok{border-color:var(--ok);color:var(--ok)}
#toast.err{border-color:var(--err);color:var(--err)}

/* ── SECTION HEADER ── */
.sec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.sec-titulo{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;letter-spacing:.5px}
.badge-r{background:#3D1A0A;color:var(--primary)}
.badge-c{background:#143D26;color:var(--ok)}
.badge-e{background:#2D1A3E;color:#A78BFA}

/* ── STORE TABS ── */
.store-tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.store-tabs::-webkit-scrollbar{display:none}
.store-tab{flex-shrink:0;padding:7px 13px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--muted);transition:.15s;white-space:nowrap}
.store-tab.ativo{background:var(--primary);border-color:var(--primary);color:#fff}
.store-tab .contagem{font-size:10px;margin-left:4px;opacity:.7}

/* ── FILTROS ── */
.filtros{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filtro-input{flex:1;min-width:120px;background:var(--card2);border:1px solid var(--border);border-radius:var(--rs);padding:9px 12px;color:var(--text);font-size:13px;outline:none}
.filtro-input:focus{border-color:var(--primary)}
.filtro-select{background:var(--card2);border:1px solid var(--border);border-radius:var(--rs);padding:9px 12px;color:var(--text);font-size:13px;outline:none;cursor:pointer}

/* ── GRUPO ACCORDION ── */
.grupo-bloco{margin-bottom:8px;border-radius:var(--r);overflow:hidden;border:1px solid var(--border)}
.grupo-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--card);cursor:pointer;user-select:none}
.grupo-nome{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--primary)}
.grupo-qtd{font-size:11px;color:var(--muted)}
.grupo-chevron{transition:.2s;color:var(--muted)}
.grupo-bloco.aberto .grupo-chevron{transform:rotate(180deg)}
.grupo-body{display:none;background:var(--card)}
.grupo-bloco.aberto .grupo-body{display:block}

/* ── FORNECEDOR HEADER ── */
.forn-header{padding:6px 14px;background:#303030;border-top:1px solid var(--border);font-size:10px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase}

/* ── PRODUTO CARD ── */
.prod-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--border);transition:.1s}
.prod-row:hover{background:rgba(232,88,10,.04)}
.prod-info{flex:1;min-width:0}
.prod-nome{font-size:13px;font-weight:500;line-height:1.3;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prod-und{font-size:10px;color:var(--muted);background:var(--card2);padding:2px 6px;border-radius:4px}
.prod-custo{font-size:11px}
.prod-est{font-size:12px;color:var(--muted);font-weight:500}
.prod-est .val{font-family:'Consolas',monospace;color:var(--warn);font-size:13px;font-weight:800;background:rgba(245,158,11,.18);border:1px solid rgba(245,158,11,.4);border-radius:5px;padding:1px 7px}
.prod-ulp{font-size:12px;color:var(--muted);font-weight:500}
.prod-ulp .val{font-family:'Consolas',monospace;color:#93c5fd;font-size:13px;font-weight:700;background:rgba(147,197,253,.15);border:1px solid rgba(147,197,253,.35);border-radius:5px;padding:1px 7px}
.prod-vig{font-size:12px;color:var(--muted);font-weight:500}
.prod-vig .val{font-family:'Consolas',monospace;color:#34d399;font-size:13px;font-weight:800;background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.35);border-radius:5px;padding:1px 7px}

/* ── QTY CONTROL ── */
.qty-ctrl{display:flex;align-items:center;gap:0;flex-shrink:0}
.qty-btn{width:28px;height:32px;background:var(--card2);border:1px solid var(--border);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;line-height:1}
.qty-btn:first-child{border-radius:var(--rs) 0 0 var(--rs)}
.qty-btn:last-child{border-radius:0 var(--rs) var(--rs) 0}
.qty-btn:hover{background:var(--primary);border-color:var(--primary);color:#fff}
.qty-btn:active{transform:scale(.92)}
.qty-input{width:52px;height:32px;background:var(--card2);border:1px solid var(--border);border-left:none;border-right:none;color:var(--gold);font-family:'Consolas','Courier New',monospace;font-size:14px;text-align:center;outline:none;padding:0 4px}
.qty-input:focus{background:#3a3a3a}
.diverg-btn{width:26px;height:26px;background:transparent;border:1.5px solid rgba(239,68,68,.35);border-radius:6px;color:rgba(239,68,68,.45);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s;margin-left:4px;line-height:1}
.diverg-btn:hover{border-color:#ef4444;color:#ef4444;background:rgba(239,68,68,.1)}
.diverg-btn.ativo{background:rgba(239,68,68,.18);border-color:#ef4444;color:#ef4444}
.urg-btn{width:26px;height:26px;background:transparent;border:1.5px solid rgba(245,158,11,.35);border-radius:6px;color:rgba(245,158,11,.5);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s;margin-left:4px;line-height:1}
.urg-btn:hover{border-color:#f59e0b;color:#f59e0b;background:rgba(245,158,11,.1)}
.urg-btn.ativo{background:rgba(180,83,9,.3);border-color:#b45309;color:#fbbf24}
.urg-btn.ativo.finalizada{background:rgba(34,197,94,.25);border-color:#22c55e;color:#4ade80}
.prod-row.diverg-ativo{border-left:3px solid #ef4444 !important;background:rgba(239,68,68,.04) !important}
.prod-row.ja-pedido{border-left:3px solid #22c55e;background:rgba(34,197,94,.15)}
.todos-loja-row.ja-pedido{border-left:3px solid #22c55e;background:rgba(34,197,94,.15);padding-left:5px}

/* ── PEDIDO SUMMARY BAR ── */
.pedido-bar{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pedido-info{display:flex;flex-direction:column;gap:2px}
.pedido-label{font-size:10px;color:var(--muted);letter-spacing:.5px}
.pedido-valor{font-size:14px;font-weight:600}
.pedido-acoes{display:flex;gap:8px;flex-wrap:wrap}
.btn-sm{padding:8px 14px;border-radius:var(--rs);font-size:12px;font-weight:600;cursor:pointer;border:none;transition:.15s;letter-spacing:.3px}
.btn-outline{background:none;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-success{background:#143D26;border:1px solid var(--ok);color:var(--ok)}
.btn-success:hover{background:var(--ok);color:#000}
.btn-danger{background:#3D1208;border:1px solid var(--err);color:var(--err)}
.btn-danger:hover{background:var(--err);color:#fff}
.btn-orange{background:var(--primary);color:#fff}
.btn-orange:hover{background:var(--primary-d)}
.btn-sm:active{transform:scale(.96)}
.btn-sm:disabled{opacity:.4;cursor:not-allowed}

/* ── LOJA TOTAL ── */
.loja-total{background:var(--card2);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-top:10px;display:flex;align-items:center;justify-content:space-between}
.loja-total-label{font-size:12px;color:var(--muted)}
.loja-total-val{font-size:18px;font-weight:700}

/* ── CATÁLOGO ── */
.cat-item{background:var(--card);border:1px solid var(--border);border-radius:var(--rs);padding:12px 14px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.cat-item-info{flex:1;min-width:0}
.cat-item-nome{font-size:13px;font-weight:500;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-item-meta{font-size:11px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.cat-item-meta span{background:var(--card2);padding:2px 6px;border-radius:4px}
.cat-item-custo{font-size:13px;font-weight:600;white-space:nowrap;flex-shrink:0}
.cat-item-acoes{display:flex;gap:6px;flex-shrink:0}
.icon-btn{width:30px;height:30px;border-radius:var(--rs);border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.icon-btn:hover{border-color:var(--primary);color:var(--primary)}
.icon-btn.del:hover{border-color:var(--err);color:var(--err)}
.toggle-ativo{width:36px;height:20px;border-radius:10px;cursor:pointer;border:none;transition:.2s;flex-shrink:0;position:relative}
.toggle-ativo::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s}
.toggle-ativo.on{background:var(--ok)}
.toggle-ativo.on::after{left:18px}
.toggle-ativo.off{background:var(--border)}
.inativo{opacity:.45}

/* ── FORNECEDORES ── */
.forn-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:8px}
.forn-item-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.forn-item-nome{font-size:14px;font-weight:600}
.dias-grid{display:flex;gap:6px;flex-wrap:wrap}
.dia-btn{width:36px;height:28px;border-radius:var(--rs);border:1px solid var(--border);background:var(--card2);color:var(--muted);font-size:10px;font-weight:700;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;letter-spacing:.3px}
.dia-btn.on{background:#1B3D5A;border-color:#4EA8DE;color:#4EA8DE}
.forn-contato{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:var(--rs);padding:8px 10px;color:var(--text);font-size:12px;outline:none;margin-top:8px;resize:none}
.forn-contato:focus{border-color:var(--primary)}
.btn-salvar-forn{margin-top:8px;padding:6px 14px;font-size:11px;font-weight:600;background:var(--primary);color:#fff;border:none;border-radius:var(--rs);cursor:pointer;transition:.15s}
.btn-salvar-forn:hover{background:var(--primary-d)}
.btn-salvar-forn:active{transform:scale(.96)}

/* ── PROVISÕES ── */
.prov-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:6px}
.prov-item-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px}
.prov-forn{font-size:12px;font-weight:700;color:var(--primary);letter-spacing:.5px}
.prov-data{font-size:11px;color:var(--muted)}
.prov-produto{font-size:13px;font-weight:500;margin-bottom:4px}
.prov-detalhes{display:flex;gap:12px;flex-wrap:wrap}
.prov-det{font-size:11px;color:var(--muted)}
.prov-det .val{font-family:'Consolas',monospace;color:var(--gold)}
.status-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;letter-spacing:.5px}
.s-aguardando{background:#1B2D3E;color:#4EA8DE}
.s-ok{background:#143D26;color:var(--ok)}
.s-div{background:#3D2A0A;color:var(--warn)}
.s-cancel{background:#2D1515;color:var(--err)}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-bg.ativo{display:flex}
@media(min-width:600px){.modal-bg{align-items:center}}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:var(--r) var(--r) 0 0;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:20px;animation:slideUp .25s ease}
@media(min-width:600px){.modal-box{border-radius:var(--r);max-height:80vh}}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-titulo{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.modal-close{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
.modal-close:hover{color:var(--text)}
.form-group{margin-bottom:12px}
.form-label{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:5px;display:block;letter-spacing:.5px}
.form-input,.form-select{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px;color:var(--text);font-size:13px;outline:none}
.form-input:focus,.form-select:focus{border-color:var(--primary)}
.form-row{display:flex;gap:8px}
.form-row .form-group{flex:1}
.modal-acoes{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-icon{font-size:36px;margin-bottom:10px}
.empty-texto{font-size:13px}

/* ── CHIPS ── */
.chip{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;letter-spacing:.5px}
.chip-rascunho{background:#2A1F0A;color:var(--warn)}
.chip-confirmado{background:#0D3025;color:var(--ok)}
.chip-enviado{background:#1A1040;color:#A78BFA}

/* ── CONFIRM PEDIDO VIEW ── */
.confirm-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:12px}
.confirm-table th{padding:7px 10px;background:var(--card2);color:var(--muted);font-weight:600;text-align:left;font-size:10px;letter-spacing:.5px;border-bottom:1px solid var(--border)}
.confirm-table td{padding:7px 10px;border-bottom:1px solid var(--border)}
.confirm-table tr:last-child td{border-bottom:none}
.confirm-table td.num{color:var(--gold);font-family:'Consolas',monospace}

/* ── SEMANA NAV ── */
.semana-nav{background:var(--card2);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.semana-nav-arrow{width:34px;height:34px;border-radius:var(--rs);border:1px solid var(--border);background:none;color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
.semana-nav-arrow:hover{border-color:var(--primary);color:var(--primary)}
.semana-nav-arrow:disabled{opacity:.25;cursor:default}
.semana-nav-arrow:active:not(:disabled){transform:scale(.9)}
.semana-info{text-align:center;flex:1}
.semana-label{font-size:11px;color:var(--muted);letter-spacing:1px;font-weight:700}
.semana-periodo{font-family:'Consolas','Courier New',monospace;font-size:15px;color:var(--gold);font-weight:700;margin-top:2px}
.semana-atual-badge{font-size:9px;color:var(--primary);font-weight:700;letter-spacing:.5px;margin-top:2px}


/* ── TODOS MODO ── */
.toggle-modo{display:flex;gap:0;margin-bottom:10px;border-radius:var(--rs);overflow:hidden;border:1px solid var(--border);width:fit-content}
.toggle-modo-btn{padding:7px 16px;font-size:11px;font-weight:700;cursor:pointer;border:none;background:var(--card2);color:var(--muted);transition:.15s;letter-spacing:.5px}
.toggle-modo-btn.ativo{background:var(--primary);color:#fff}
.todos-prod-card{border-top:1px solid var(--border);padding:10px 14px}
.todos-prod-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px}
.todos-prod-nome{font-size:13px;font-weight:500;flex:1}
.todos-prod-custo{font-size:11px;white-space:nowrap;flex-shrink:0}
.todos-lojas-grid{display:flex;flex-direction:column;gap:5px}
.todos-loja-row{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.todos-loja-row:last-child{border-bottom:none}
.todos-loja-row.diverg-ativo{background:rgba(239,68,68,.06);border-left:3px solid #ef4444;padding-left:5px}
.todos-loja-nome{font-size:11px;font-weight:600;color:var(--muted);min-width:90px;flex-shrink:0}
.todos-loja-est{font-size:12px;color:var(--muted);min-width:64px;font-weight:500}

function _urlB64ToUint8Array(b64) {
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  const arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}

async function registrarPushSubscription() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    const existing = await reg.pushManager.getSubscription();
    const sub = existing || await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: _urlB64ToUint8Array(GN_VAPID_PUBLIC)
    });
    const sess = (() => { try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch(e) { return null; } })();
    await db.from('gn_push_subscriptions').upsert({
      endpoint: sub.endpoint,
      subscription: sub.toJSON(),
      loja: sess?.loja || 'GERAL',
      user_nome: sess?.nome || ''
    }, { onConflict: 'endpoint' });
    localStorage.setItem('gn_push_ativo', '1');
  } catch(_) {}
}

async function ativarNotifPedidos() {
  if (typeof Notification === 'undefined') { toast('⚠️ Notificações não suportadas', 'err'); return; }
  if (Notification.permission === 'denied') {
    toast('🔕 Bloqueado. Vá em Ajustes → Notificações e habilite para este site.', 'err'); return;
  }
  try {
    const p = await Notification.requestPermission();
    if (p !== 'granted') { toast('⚠️ Permissão negada', 'err'); return; }
    await registrarPushSubscription();
    _atualizarBtnNotif();
    toast('🔔 Notificações de pedidos ativadas!', 'ok');
  } catch(_) {
    toast('⚠️ Para receber alertas, adicione o app à tela inicial: Compartilhar → Adicionar à Tela de Início', 'err');
  }
}

function _atualizarBtnNotif() {
  const btn = document.getElementById('btn-notif-ped');
  if (!btn) return;
  const ativo = typeof Notification !== 'undefined' && Notification.permission === 'granted';
  if (ativo) {
    btn.textContent = '🔔';
    btn.style.color = '#22C55E';
    btn.style.borderColor = 'rgba(34,197,94,.4)';
    btn.title = 'Notificações ativas';
    btn.onclick = () => toast('🔔 Notificações ativas — alertas de pedidos e entregas serão enviados.', 'ok');
  } else {
    btn.textContent = '🔕';
    btn.style.color = Notification.permission === 'denied' ? '#f87171' : 'rgba(255,255,255,.35)';
    btn.style.borderColor = Notification.permission === 'denied' ? 'rgba(248,113,113,.3)' : 'rgba(255,255,255,.15)';
    btn.title = Notification.permission === 'denied' ? 'Bloqueado — toque para ver como ativar' : 'Ativar alertas de pedidos';
    btn.onclick = ativarNotifPedidos;
  }
}

// SEMANA — FUNÇÕES
// ═══════════════════════════════════════════════
function getMondayOfWeek(date = new Date()) {
  const d = new Date(date);
  d.setHours(0, 0, 0, 0);
  const dow = d.getDay(); // 0=Dom, 1=Seg...6=Sáb
  const diff = (dow === 0) ? -6 : 1 - dow;
  d.setDate(d.getDate() + diff);
  return d;
}

function getSundayOfWeek(monday) {
  const sun = new Date(monday);
  sun.setDate(monday.getDate() + 6);
  return sun;
}

function getNumeroSemana(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dow = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dow);
  const anoInicio = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil(((d - anoInicio) / 86400000 + 1) / 7);
}

function formatarSemana(monday) {
  const sunday = getSundayOfWeek(monday);
  const fmtD  = d => d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
  const fmtDL = d => d.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit' });
  const num   = getNumeroSemana(monday);
  const ehAtual = monday.toDateString() === getMondayOfWeek().toDateString();
  return {
    num,
    periodo: `${fmtD(monday)} – ${fmtD(sunday)}`,
    inicioLabel: fmtDL(monday),
    fimLabel: fmtDL(sunday),
    ehAtual,
    ano: monday.getFullYear(),
    isoStr: monday.toISOString().split('T')[0],
  };
}

function datePlusWeeks(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n * 7);
  return d;
}

async function navegarSemana(delta) {
  const nova = datePlusWeeks(S.semanaAtiva, delta);
  const mondayHoje = getMondayOfWeek();
  if (nova > mondayHoje) return; // não avança além da semana atual
  S.semanaAtiva = nova;
  // Est.ant/Est.vig se recalculam sozinhos em renderPedido() com base na data real da
  // última contagem (_estAntVigEfetivo) — não precisa mais zerar nada aqui na mão.
  $('content').innerHTML = '<div style="padding:20px;text-align:center"><div class="spin" style="margin:0 auto"></div></div>';
  await carregarPedidoAtual();
  renderPedido();
}

$('btn-entrar').onclick = async () => {
  const nome  = ($('inp-nome').value || '').trim();
  const senha = ($('inp-senha').value || '').trim();
  const errEl = $('login-erro');
  errEl.classList.remove('ativo');
  if (!nome || !senha) { errEl.textContent = 'Preencha usuário e senha.'; errEl.classList.add('ativo'); return; }
  $('btn-entrar').disabled = true;
  $('btn-entrar').textContent = 'Verificando...';
  try {
    const res = await fetch(
      `${SUPA_URL}/rest/v1/gn_usuarios?nome=eq.${encodeURIComponent(nome)}&senha=eq.${encodeURIComponent(senha)}&ativo=eq.true`,
      { headers: { apikey: SUPA_KEY, Authorization: 'Bearer ' + SUPA_KEY } }
    );
    const data = await res.json();
    if (!data || !data.length) {
      errEl.textContent = 'Usuário ou senha incorretos.';
      errEl.classList.add('ativo');
      $('btn-entrar').disabled = false; $('btn-entrar').textContent = 'Entrar';
      return;
    }
    const u = data[0];
    if (!(u.permissoes && (u.permissoes.pedidos || u.permissoes.master))) {
      errEl.textContent = 'Sem permissão de acesso a este módulo.';
      errEl.classList.add('ativo');
      $('btn-entrar').disabled = false; $('btn-entrar').textContent = 'Entrar';
      return;
    }
    const sess = { id: u.id, nome: u.nome, loja: u.loja, cargo: u.cargo, permissoes: u.permissoes || {}, ts: Date.now() };
    localStorage.setItem(SESSION_KEY, JSON.stringify(sess));
    await iniciarApp();
  } catch(e) {
    errEl.textContent = '⚠️ Erro de conexão.';
    errEl.classList.add('ativo');
    $('btn-entrar').disabled = false; $('btn-entrar').textContent = 'Entrar';
  }
};

async function carregarCatalogo() {
  const { data } = await db.from('gn_catalogo')
    .select('*').order('grupo').order('fornecedor').order('produto');
  S.catalogo = data || [];
}

async function carregarFornecedores() {
  const { data } = await db.from('gn_fornecedores_pedido')
    .select('*').eq('ativo', true).order('nome');
  S.fornecedores = data || [];
}

async function carregarLojas() {
  const { data } = await db.from('gn_lojas_pedido')
    .select('*').eq('ativo', true).order('ordem');
  S.lojas = data || [];
  if (!S.lojaAtiva && S.lojas.length > 0) S.lojaAtiva = S.lojas[0].slug_pedido;
}

async function carregarDevolucoesLojas() {
  try {
    const { data } = await db.from('gn_lojas').select('loja,all_data');
    S.devolucoesLojas = [];
    (data || []).forEach(row => {
      const devs = (row.all_data?.devolucoesAll || {})[row.loja] || [];
      const lojaDisplay = S.lojas.find(l => l.nome_display?.toUpperCase() === row.loja || l.slug_pedido === (row.loja||'').toLowerCase().replace(/ /g,'_'))?.nome_display || row.loja;
      devs.forEach(dev => {
        S.devolucoesLojas.push({ ...dev, lojaKey: row.loja, lojaDisplay });
      });
    });
  } catch(e) {}
}

async function confirmarDevolucaoPedidos(lojaKey, devId) {
  try {
    const { data } = await db.from('gn_lojas').select('loja,all_data').eq('loja', lojaKey).single();
    if (!data) { toast('Loja não encontrada.', 'err'); return; }
    const allData = data.all_data || {};
    const devs = (allData.devolucoesAll || {})[lojaKey] || [];
    const dev = devs.find(d => d.id === devId);
    if (!dev) { toast('Devolução não encontrada.', 'err'); return; }
    if (dev.status !== 'loja_confirmou') { toast('Aguardando confirmação da loja primeiro.', 'err'); return; }
    const sess = JSON.parse(localStorage.getItem('gn_session_v1') || 'null');
    const user = (sess && sess.nome) || 'pedidos';
    dev.status = 'finalizado';
    dev.pedidos_conf_por = user;
    dev.pedidos_conf_ts = new Date().toISOString();
    allData.devolucoesAll = allData.devolucoesAll || {};
    allData.devolucoesAll[lojaKey] = devs;
    const { error } = await db.from('gn_lojas').update({ all_data: allData, updated_at: new Date().toISOString(), updated_by: 'pedidos' }).eq('loja', lojaKey);
    if (error) throw error;
    toast('✅ Devolução finalizada!', 'ok');
    await carregarDevolucoesLojas();
    renderProvisoes();
  } catch(e) { toast('Erro: ' + (e.message || e), 'err'); }
}

async function carregarPedidoAtual() {
  if (!S.semanaAtiva) S.semanaAtiva = getMondayOfWeek();

  const semIsoStr  = S.semanaAtiva.toISOString().split('T')[0];
  const mondayHoje = getMondayOfWeek();
  const ehSemAtual = S.semanaAtiva.toDateString() === mondayHoje.toDateString();

  // Busca pedido da semana — prioriza CONFIRMADO/ENVIADO sobre RASCUNHO, ignora CANCELADO
  const { data } = await db.from('gn_pedidos')
    .select('*')
    .eq('semana_inicio', semIsoStr)
    .eq('regiao', 'RJ')
    .in('status', ['CONFIRMADO', 'ENVIADO', 'RASCUNHO'])
    .order('status', { ascending: true })
    .order('criado_em', { ascending: false })
    .limit(1);

  if (data && data.length > 0) {
    S.pedidoAtual = data[0];
  } else if (ehSemAtual) {
    // Semana atual sem pedido → cria rascunho
    const { data: novo } = await db.from('gn_pedidos')
      .insert([{ data_pedido: hoje(), semana_inicio: semIsoStr, status: 'RASCUNHO', regiao: 'RJ' }])
      .select().single();
    S.pedidoAtual = novo;
  } else {
    // Semana passada sem pedido
    S.pedidoAtual = null;
    S.pedidoItens = {};
    S.ultimoPedido = {};
    S.pedidosConfirmados = {};
    calcularTotais();
    return;
  }

  await carregarItensPedido();
  await carregarUltimoPedido();
  await carregarConfirmadosSemana();
  await carregarFornecedoresConfirmados();
}

// Fornecedores do pedido atual que já tiveram provisões geradas (confirmarFornecedores) —
// usado pra travar a edição só daqueles itens e permitir confirmar o resto depois.
async function carregarFornecedoresConfirmados() {
  S.fornecedoresConfirmados = new Set();
  if (!S.pedidoAtual?.id) return;
  const { data } = await db.from('gn_provisoes')
    .select('fornecedor')
    .eq('pedido_id', S.pedidoAtual.id);
  (data || []).forEach(p => { if (p.fornecedor) S.fornecedoresConfirmados.add(p.fornecedor); });

// Texto "Contado por Fulano em DD/MM HH:MM" (ou só a data, se não houver hora) pra
// garantir que o Est.vig exibido foi realmente contado — e não um saldo carregado de
// outra semana. Usado como observação junto ao Est.vig no Pedido.
function _contagemInfoTxt(c) {
  if (!c || c.atual == null) return null;
  const quem = c.criado_por || null;
  let quando = null;
  if (c.criado_em) {
    const dt = new Date(c.criado_em);
    quando = dt.toLocaleDateString('pt-BR') + ' ' + dt.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
  } else if (c.data_contagem) {
    quando = c.data_contagem.split('-').reverse().join('/');
  }
  if (!quem && !quando) return null;
  return `Contado${quem?' por '+quem:''}${quando?' em '+quando:''}`;
}

// True quando a contagem foi feita dentro da semana ativa (monISO/sunISO, formato
// 'YYYY-MM-DD') — usado pra destacar em verde que o Est.vig é fresco (contado essa
// semana), não um saldo velho carregado de outra semana.
function _contagemNaSemana(c, monISO, sunISO) {
  if (!c || c.atual == null) return false;
  const dataISO = c.data_contagem || (c.criado_em ? String(c.criado_em).slice(0,10) : null);
  if (!dataISO) return false;
  return dataISO >= monISO && dataISO <= sunISO;
}

// Est.ant/Est.vig "efetivos" pra exibição: a última contagem salva (S.contagens) é
// sempre a mais recente já feita, não importa a semana. Ao virar a semana sem a loja
// ainda ter recontado, ela continua sendo a mais recente — mas mostrá-la como "Est.vig"
// (estoque vigente) confunde, porque na verdade é o estoque ANTIGO (da semana passada)
// esperando a nova contagem. Se não é fresca (não é dessa semana), ela vira o Est.ant
// exibido e o Est.vig some até a loja contar de novo.
function _estAntVigEfetivo(contagem, monISO, sunISO) {
  if (!contagem) return { estAnt: null, estVig: null, fresh: false };
  const fresh = _contagemNaSemana(contagem, monISO, sunISO);
  return fresh
    ? { estAnt: contagem.ul_estoque, estVig: contagem.atual, fresh: true }
    : { estAnt: contagem.atual, estVig: null, fresh: false };
}

function mostrarInfoContagem(catalogoId, lojaSlug) {
  const c = S.contagens[catalogoId]?.[lojaSlug];
  const txt = _contagemInfoTxt(c);
  if (txt) toast('📋 ' + txt);
  else toast('Sem registro de quem/quando contou.', 'err');
}

// Formata uma data ISO (YYYY-MM-DD) como DD/MM.
function _fmtDDMM(iso) {
  const p = iso.split('-');
  return p[2] + '/' + p[1];
}

// Início/fim (ISO) da semana ativa do Pedido — mesma lógica usada em renderPedido().
function _semanaAtivaBounds() {
  if (!S.semanaAtiva) S.semanaAtiva = getMondayOfWeek();
  return {
    monISO: S.semanaAtiva.toISOString().slice(0,10),
    sunISO: getSundayOfWeek(S.semanaAtiva).toISOString().slice(0,10)
  };
}

// Prefixo que marca uma contagem como corrigida manualmente pelo setor de Compras (em
// vez de uma contagem física feita pela loja) — usado tanto pra colorir/rotular aqui
// quanto pra a loja identificar essas correções no app Lojas (carregarCorrecoesSetor).
const CORRECAO_SETOR_PREFIX = '🏢 Compras: ';

// Corrige o Est.vig (estoque vigente) direto pelo app Pedidos, sem precisar que a loja
// reconte. Grava em gn_contagens_pedido marcado com CORRECAO_SETOR_PREFIX, pra a loja
// ver no app Lojas que aquele valor foi ajustado pelo setor.
async function corrigirEstVig(catalogoId, lojaSlug, nomeProduto) {
  const contagemAtual = S.contagens[catalogoId]?.[lojaSlug];
  const { monISO, sunISO } = _semanaAtivaBounds();
  const { estAnt } = _estAntVigEfetivo(contagemAtual, monISO, sunISO);
  const sugestao = contagemAtual?.atual != null ? String(contagemAtual.atual) : '';
  const resp = prompt(`Corrigir Est.vig de "${nomeProduto}":`, sugestao);
  if (resp === null) return;
  const novoValor = parseFloat(resp.replace(',', '.'));
  if (isNaN(novoValor) || novoValor < 0) { toast('⚠️ Informe um valor válido.', 'err'); return; }

  const nome = (() => {
    try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null')?.nome || 'Compras'; }
    catch(e) { return 'Compras'; }
  })();
  const hoje = new Date().toISOString().slice(0,10);
  const criadoPor = CORRECAO_SETOR_PREFIX + nome;
  const payload = {
    catalogo_id: catalogoId, loja_slug: lojaSlug,
    atual: novoValor, data_contagem: hoje, criado_por: criadoPor
  };
  // Preserva o Est.ant (não sobrescreve com null) — só a contagem "atual" está sendo corrigida.
  if (estAnt != null) payload.ul_estoque = estAnt;
  if (contagemAtual?.ul_pedido != null) payload.ul_pedido = contagemAtual.ul_pedido;

  try {
    await db.from('gn_contagens_pedido').upsert(payload, { onConflict: 'catalogo_id,loja_slug,data_contagem' });
    if (!S.contagens[catalogoId]) S.contagens[catalogoId] = {};
    S.contagens[catalogoId][lojaSlug] = {
      ...(S.contagens[catalogoId][lojaSlug] || {}),
      atual: novoValor, data_contagem: hoje, criado_por: criadoPor, criado_em: new Date().toISOString(),
      ul_estoque: payload.ul_estoque ?? (S.contagens[catalogoId][lojaSlug]?.ul_estoque ?? null)
    };
    toast('✏️ Est.vig corrigido!');
    renderPedido();
  } catch(e) {
    toast('⚠️ Erro ao corrigir: ' + (e.message || e), 'err');
  }
}

async function carregarProvisoes() {
  const semAtiva = S.provSemana || getMondayOfWeek();
  const monday = semAtiva.toISOString().split('T')[0];
  const sunday = getSundayOfWeek(semAtiva).toISOString().split('T')[0];

  const SEL = '*, gn_catalogo(produto,und,grupo), gn_recebimentos(validado_por,qtd_recebida,valor_recebido,diferenca_qtd)';

  // Itens pendentes: filtro direto por data_entrega da semana
  let qPend = db.from('gn_provisoes').select(SEL)
    .eq('status', 'AGUARDANDO')
    .gte('data_entrega', monday).lte('data_entrega', sunday)
    .order('data_entrega', {ascending:true}).order('fornecedor');
  if (S.provLoja) qPend = qPend.eq('loja_slug', S.provLoja);

  // Itens confirmados: via pedido_id da semana (mesma lógica de carregarEntregasConfirmadas)
  const { data: pedidos } = await db.from('gn_pedidos').select('id')
    .or(`semana_inicio.eq.${monday},and(data_pedido.gte.${monday},data_pedido.lte.${sunday})`);
  const pedidoIds = (pedidos || []).map(p => p.id);

  let qConf = Promise.resolve({ data: [] });
  if (pedidoIds.length) {
    let q2 = db.from('gn_provisoes').select(SEL)
      .in('status', ['RECEBIDO_OK', 'DIVERGENCIA'])
      .in('pedido_id', pedidoIds)
      .order('data_entrega', {ascending:true}).order('fornecedor');
    if (S.provLoja) q2 = q2.eq('loja_slug', S.provLoja);
    qConf = q2;
  }

  const [{ data: pending }, { data: confirmed }] = await Promise.all([qPend, qConf]);
  const seen = new Set();
  const all = [...(pending || []), ...(confirmed || [])];
  S.provisoes = all.filter(p => { if (seen.has(p.id)) return false; seen.add(p.id); return true; });
}

// ═══════════════════════════════════════════════
// SUPABASE — MUTATIONS
// ═══════════════════════════════════════════════
// ─── FILA OFFLINE ─────────────────────────────────────────────
function _ppKey(){ return 'gn_ped_pend_'+(S.pedidoAtual?.id||''); }
function _ppLoad(){ try{ return JSON.parse(localStorage.getItem(_ppKey())||'{}'); }catch(_){ return {}; } }
function _ppSave(q){ try{ localStorage.setItem(_ppKey(),JSON.stringify(q)); }catch(_){} }
function _ppSet(catalogoId, lojaSlug, qtd, custo, cxUnd){
  const q=_ppLoad(); if(!q[catalogoId]) q[catalogoId]={};
  q[catalogoId][lojaSlug]={qtd,custo,cxUnd:cxUnd||null}; _ppSave(q); _ppBadge();
}
function _ppDel(catalogoId, lojaSlug){
  const q=_ppLoad(); if(q[catalogoId]) delete q[catalogoId][lojaSlug];
  if(q[catalogoId]&&!Object.keys(q[catalogoId]).length) delete q[catalogoId];
  _ppSave(q); _ppBadge();
}
function _ppCount(){ const q=_ppLoad(); return Object.values(q).reduce((n,ls)=>n+Object.keys(ls).length,0); }
function _ppBadge(){
  const n=_ppCount();
  const b=$('offline-banner'), t=$('offline-banner-txt'), btn=$('btn-salvar-pedidos');
  if(!b) return;
  if(n>0){
    b.style.display=''; if(t) t.textContent=`${n} alteração(ões) offline — sincronizando ao reconectar...`;
    if(btn) btn.style.display='';
  } else {
    b.style.display='none'; if(btn) btn.style.display='none';
  }
}
async function flushPendingItems(manual){
  if(!S.pedidoAtual?.id) return;
  const q=_ppLoad();
  if(!Object.keys(q).length){
    if(manual) toast('✓ Tudo já está salvo!','ok');
    return;
  }
  if(manual) toast('Sincronizando...','ok');
  let ultimoErro=null;
  // Não usa "break" ao falhar um item: um único item com problema (ex.: produto
  // removido do catálogo) não pode travar pra sempre a sincronização dos demais —
  // foi exatamente isso que deixava o banner "alterações offline" preso indefinidamente.
  for(const catalogoId of Object.keys(q)){
    for(const lojaSlug of Object.keys(q[catalogoId])){
      const {qtd,custo,cxUnd}=q[catalogoId][lojaSlug];
      try{
        // Upsert (não insert/update por idExistente) — a fila offline pode ser antiga
        // e o item já ter sido salvo nesse meio-tempo (outro dispositivo, ou uma
        // tentativa anterior que na verdade deu certo mas não limpou a fila local);
        // um "insert" nesse caso batia num "duplicate key" e falhava pra sempre.
        const payload={
          pedido_id:S.pedidoAtual.id, catalogo_id:catalogoId, loja_slug:lojaSlug,
          qtd_pedida:qtd, custo_unitario:custo
        };
        if(cxUnd){ payload.qtd_cx=cxUnd.cx; payload.qtd_und=cxUnd.und; }
        const {data,error}=await db.from('gn_pedido_itens')
          .upsert(payload, { onConflict:'pedido_id,catalogo_id,loja_slug' })
          .select('id').single();
        if(error) throw error;
        if(data&&S.pedidoItens[catalogoId]?.[lojaSlug]) S.pedidoItens[catalogoId][lojaSlug].id=data.id;
        _ppDel(catalogoId,lojaSlug);
      } catch(e){
        ultimoErro=e;
        console.error('Erro ao sincronizar item pendente:', catalogoId, lojaSlug, e.message||e);
      }
    }
  }
  if(manual && ultimoErro && _ppCount()>0){
    toast('⚠️ Falha ao sincronizar: '+(ultimoErro.message||ultimoErro), 'err');
  }
  if(_ppCount()===0&&manual) toast('✓ Alterações sincronizadas!','ok');
  _ppBadge();
}

function _atualizarFaltasBadge(total) {
  const b=$('nav-faltas-badge'), sb=$('sl-faltas-badge');
  if(b){ b.textContent=total>99?'99+':total; b.style.display=total>0?'':'none'; }
  if(sb){ sb.textContent=total; sb.style.display=total>0?'':'none'; }

    _atualizarFaltasBadge((rows||[]).reduce((n,r)=>n+(Array.isArray(r.faltas)?r.faltas.length:0),0));

async function salvarItem(catalogoId, lojaSlug, qtd, custo, cxUnd) {
  if (!S.pedidoItens[catalogoId]) S.pedidoItens[catalogoId] = {};

  // Preserva o id e o estado de divergência ANTES de sobrescrever
  const idExistente  = S.pedidoItens[catalogoId][lojaSlug]?.id;
  const divExistente = S.pedidoItens[catalogoId][lojaSlug]?.diverg || false;

  // Atualiza estado preservando id e divergência. cxUnd (quando veio da digitação nos
  // campos Cx/Und) grava a quebra real digitada — pra não confundir com o total, o
  // Pedido usa isso pra exibir exatamente o que foi digitado em vez de decompor.
  S.pedidoItens[catalogoId][lojaSlug] = {
    id: idExistente, qtd, custo, diverg: divExistente,
    qtdCx: cxUnd ? cxUnd.cx : null, qtdUnd: cxUnd ? cxUnd.und : null
  };
  calcularTotais();
  renderTotalLoja();

  try {
    // Upsert (não insert/update condicionados a idExistente): o estado local pode ficar
    // desatualizado sobre se a linha já existe (ex.: mesmo item salvo por outro
    // dispositivo/aba, ou reenvio de uma fila offline antiga) — nesse caso um "insert"
    // batia num "duplicate key value violates unique constraint" e falhava pra sempre.
    const payload = {
      pedido_id: S.pedidoAtual.id,
      catalogo_id: catalogoId,
      loja_slug: lojaSlug,
      qtd_pedida: qtd,
      custo_unitario: custo
    };
    if (cxUnd) { payload.qtd_cx = cxUnd.cx; payload.qtd_und = cxUnd.und; }
    const { data, error } = await db.from('gn_pedido_itens')
      .upsert(payload, { onConflict: 'pedido_id,catalogo_id,loja_slug' })
      .select('id').single();
    if (error) throw error;
    if (data) S.pedidoItens[catalogoId][lojaSlug].id = data.id;
    _ppDel(catalogoId, lojaSlug);
  } catch (e) {
    console.error('Erro salvarItem:', e.message);
    _ppSet(catalogoId, lojaSlug, qtd, custo, cxUnd);
    toast('⚠️ Offline — salvo localmente', 'err');
  }
}

// Fornecedores com pelo menos um item com qtd > 0 em qualquer loja, no pedido atual.

function _toggleTodosFornConfirm(btn) {
  const marcado = btn.getAttribute('data-marcados') === '1';
  document.querySelectorAll('.confirmForn-chk').forEach(chk => { chk.checked = !marcado; });
  btn.setAttribute('data-marcados', marcado ? '0' : '1');
  btn.textContent = marcado ? 'Marcar todos' : 'Desmarcar todos';
}

async function _confirmarFornecedoresSelecionados() {
  const selecionados = [...document.querySelectorAll('.confirmForn-chk:checked')].map(chk => chk.value);
  if (selecionados.length === 0) {
    toast('Selecione ao menos um fornecedor.', 'err'); return;
  }
  $('modal-bg').classList.remove('ativo');

  try {
    // 1. Recarregar itens do banco para garantir que todos têm id
    await carregarItensPedido();

    const fornsSet = new Set(selecionados);

    // 2. Gerar provisões — uma por produto×loja com qtd > 0, só dos fornecedores selecionados
    const provisoes = [];
    S.catalogo.forEach(prod => {
      if (!fornsSet.has(prod.fornecedor)) return;
      const itensLoja = S.pedidoItens[prod.id];
      if (!itensLoja) return;
      S.lojas.forEach(loja => {
        const item = itensLoja[loja.slug_pedido];
        if (!item || !item.qtd || item.qtd <= 0) return;

        const forn = S.fornecedores.find(f => f.nome === prod.fornecedor);
        const diasForn = forn?.dias_entrega || [];
        const isoDate = dt => dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');

        // Data (ou janela) de entrega do fornecedor: prazo em dias após o pedido tem
        // prioridade sobre o cálculo por dia da semana, quando cadastrado.
        let dataEntrega = null, dataEntregaFim = null;
        if (forn?.prazo_dias_min != null) {
          const ref = new Date();
          const dMin = new Date(ref); dMin.setDate(ref.getDate() + forn.prazo_dias_min);
          dataEntrega = isoDate(dMin);
          if (forn.prazo_dias_max != null && forn.prazo_dias_max > forn.prazo_dias_min) {
            const dMax = new Date(ref); dMax.setDate(ref.getDate() + forn.prazo_dias_max);
            dataEntregaFim = isoDate(dMax);
          }
        } else if (diasForn.length > 0) {
          const ref = new Date();
          for (let d = 1; d <= 14; d++) {
            const dt = new Date(ref);
            dt.setDate(ref.getDate() + d);
            if (diasForn.includes(DIAS_SEMANA[dt.getDay()])) {
              dataEntrega = isoDate(dt);
              break;
            }
          }
        }

        provisoes.push({
          pedido_id:       S.pedidoAtual.id,
          pedido_item_id:  item.id || null,   // nullable agora
          catalogo_id:     prod.id,
          loja_slug:       loja.slug_pedido,
          fornecedor:      prod.fornecedor,
          data_entrega:    dataEntrega,
          data_entrega_fim:dataEntregaFim,
          qtd_prevista:    item.qtd,
          valor_previsto:  item.qtd * (item.custo ?? prod.custo ?? 0),
          status:          'AGUARDANDO'
        });
      });
    });

    // 3. Inserir provisões em batches
    let erros = 0;
    for (let i = 0; i < provisoes.length; i += 50) {
      const { error } = await db.from('gn_provisoes').insert(provisoes.slice(i, i + 50));
      if (error) { console.error('Erro provisão batch:', error.message); erros++; }
    }

    // 4. Marca os fornecedores selecionados como confirmados localmente
    fornsSet.forEach(f => S.fornecedoresConfirmados.add(f));

    // 5. Se todos os fornecedores com itens já estão confirmados, finaliza o pedido
    const aindaPendentes = _fornecedoresComItensPedido().filter(f => !S.fornecedoresConfirmados.has(f));
    if (aindaPendentes.length === 0) {
      const semIsoStr = S.semanaAtiva.toISOString().split('T')[0];
      const { error: errPed } = await db.from('gn_pedidos')
        .update({ status: 'CONFIRMADO', semana_inicio: semIsoStr, atualizado_em: new Date().toISOString() })
        .eq('id', S.pedidoAtual.id);
      if (errPed) throw errPed;
      S.pedidoAtual.status = 'CONFIRMADO';
    }

    if (erros > 0) {
      toast(`Fornecedores confirmados com ${erros} erro(s) nas provisões. Verifique o console.`, 'err');
    } else {
      toast(`✓ ${selecionados.length} fornecedor${selecionados.length>1?'es':''} confirmado${selecionados.length>1?'s':''}! ${provisoes.length} provisões geradas.${aindaPendentes.length>0?' '+aindaPendentes.length+' fornecedor(es) ainda em aberto.':''}`, 'ok');
    }

    // 6. Atualizar estado local e re-renderizar
    calcularTotais();
    renderPedido();

  } catch (e) {
    console.error('Erro confirmarPedido:', e);
    toast('Erro ao confirmar: ' + (e.message || e), 'err');
  }
}

async function novoPedido() {
  const ehConfirmado = S.pedidoAtual?.status === 'CONFIRMADO';
  const msg = ehConfirmado
    ? 'O pedido desta semana já está CONFIRMADO.\nDeseja criar um novo rascunho em branco (sem cancelar o confirmado)?'
    : 'Criar novo pedido em branco?\nO rascunho atual será descartado.';
  if (!confirm(msg)) return;
  const semIsoStr = S.semanaAtiva.toISOString().split('T')[0];
  if (!ehConfirmado && S.pedidoAtual?.id) {
    await db.from('gn_pedidos').update({ status: 'CANCELADO' }).eq('id', S.pedidoAtual.id);
  }
  const { data } = await db.from('gn_pedidos')
    .insert([{ data_pedido: hoje(), semana_inicio: semIsoStr, status: 'RASCUNHO', regiao: 'RJ' }])
    .select().single();
  S.pedidoAtual = data;
  S.pedidoItens = {};
  calcularTotais();
  renderPedido();
  toast('Novo pedido criado.', 'ok');
}

function calcularTotais() {
  S.totaisPorLoja = {};
  S.lojas.forEach(l => { S.totaisPorLoja[l.slug_pedido] = 0; });

  Object.entries(S.pedidoItens).forEach(([cid, lojas]) => {
    const prod = S.catalogo.find(p => p.id === cid);
    if (!prod) return;
    Object.entries(lojas).forEach(([loja, item]) => {
      if (item.qtd > 0) {
        const custo = item.custo ?? prod.custo ?? 0;
        S.totaisPorLoja[loja] = (S.totaisPorLoja[loja] || 0) + item.qtd * custo;
      }
    });
  });
}

function totalPedidoGeral() {
  return Object.values(S.totaisPorLoja).reduce((a,b) => a+b, 0);
}

function contarItensLoja(lojaSlug) {
  let n = 0;
  Object.values(S.pedidoItens).forEach(lojas => {
    if (lojas[lojaSlug]?.qtd > 0) n++;
  });
  return n;
}

function _nthWeekdayPed(ano, mes, weekday, n) {
  const d = new Date(ano, mes - 1, 1);
  let count = 0;
  for (let i = 0; i < 60; i++) {
    if (d.getDay() === weekday && ++count === n) return d.toISOString().slice(0,10);
    d.setDate(d.getDate() + 1);
  }
  return null;
}

function _getDatasEspeciaisPed(ano) {
  const maes = _nthWeekdayPed(ano, 5, 0, 2);
  const pais = _nthWeekdayPed(ano, 8, 0, 2);
  const base = DATAS_ESPECIAIS_BASE_PED.filter(f => f.data.startsWith(String(ano)));
  const extra = [];
  if (maes) extra.push({data: maes, nome:'Dia das Mães', tipo:'comercial'});
  if (pais) extra.push({data: pais, nome:'Dia dos Pais', tipo:'comercial'});
  const seen = new Set();
  return [...base, ...extra].filter(f => { const k=f.data+'|'+f.nome; if(seen.has(k))return false; seen.add(k); return true; }).sort((a,b)=>a.data.localeCompare(b.data));
}

// ── VENDA DA SEMANA ANTERIOR (por loja) ─────────────────────────────────────
// Card auxiliar pra conferir, na hora de fazer o pedido/contagem da semana atual,
// se o volume de venda da semana anterior condiz com o estoque contado — mesma
// grade "dia a dia" (Fat) que já existe nos cards de loja do Painel de Gestão
// (gn-home.html), só que aqui já vem direto na semana anterior à ativa, sem
// precisar abrir outro app pra comparar.
// checklist_diario.loja usa o "chkKey" de GN_LOJAS (ex.: "Rancho"), não o
// lojaSlug/userKey usados no resto do app Pedidos.
const LOJA_CHKKEY_BY_SLUG = Object.fromEntries((window.GN_LOJAS || []).map(l => [l.lojaSlug, l.chkKey]));

// Normaliza pra comparar com checklist_diario.loja — cobre as mesmas exceções
// legadas já tratadas em gn-home.html (_normLoja), mais "NORTE" (comKey antigo
// que também aparece nessa coluna pra Norte Shopping).
function _normLojaPed(n) {
  if (n === 'SAO_GONCALO') return 'SÃO GONÇALO';
  if (n === 'NORTE') return 'NORTE SHOPPING';
  return (n || '').toUpperCase().replace('AMÉRICA', 'AMERICA');
}

async function _carregarVendaSemanaAnterior(lojaSlug, semanaAtivaDate) {
  const chkKey = LOJA_CHKKEY_BY_SLUG[lojaSlug];
  if (!chkKey) return;
  const segAnt = datePlusWeeks(semanaAtivaDate, -1);
  const domAnt = new Date(segAnt); domAnt.setDate(domAnt.getDate() + 6);
  const isoSeg = segAnt.toISOString().split('T')[0];
  const isoDom = domAnt.toISOString().split('T')[0];
  const cacheKey = lojaSlug + '|' + isoSeg;
  if (S.vendaAntCache[cacheKey]) return; // já carregado ou carregando
  S.vendaAntCache[cacheKey] = { loading: true };
  try {
    const { data, error } = await db.from('checklist_diario')
      .select('data_operacao,loja,venda_salao,venda_delivery')
      .gte('data_operacao', isoSeg).lte('data_operacao', isoDom);
    if (error) throw error;
    const alvo = _normLojaPed(chkKey);
    const dias = Array(7).fill(0);
    (data || []).forEach(r => {
      if (_normLojaPed(r.loja) !== alvo) return;
      const idx = Math.round((new Date(r.data_operacao + 'T12:00:00') - new Date(isoSeg + 'T12:00:00')) / 86400000);
      if (idx < 0 || idx > 6) return;
      dias[idx] += (parseFloat(r.venda_salao) || 0) + (parseFloat(r.venda_delivery) || 0);
    });
    S.vendaAntCache[cacheKey] = { loading: false, dias, total: dias.reduce((a, b) => a + b, 0) };
  } catch (e) {
    S.vendaAntCache[cacheKey] = { loading: false, erro: true };
  }
  const aindaNaMesmaTela = S.lojaAtiva === lojaSlug && S.semanaAtiva &&
    S.semanaAtiva.toISOString().split('T')[0] === semanaAtivaDate.toISOString().split('T')[0] &&
    (S.tab === 'pedido' || S.tab === 'edu' || S.tab === 'oseas');
  if (aindaNaMesmaTela) renderPedido();
}

function _vendaSemanaAntCardHtml() {
  if (S.todosModo || !S.lojaAtiva) return '';
  const chkKey = LOJA_CHKKEY_BY_SLUG[S.lojaAtiva];
  if (!chkKey) return '';

  const isoSeg = segAnt.toISOString().split('T')[0];

  const cache = S.vendaAntCache[cacheKey];
  if (!cache) _carregarVendaSemanaAnterior(S.lojaAtiva, S.semanaAtiva);

  const lojaNome = S.lojas.find(l => l.slug_pedido === S.lojaAtiva)?.nome_display || chkKey;
  const fmtD = d => d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
  const DSEM = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];

  let corpo;
  if (!cache || cache.loading) {
    corpo = `<div style="font-size:11px;color:var(--muted);padding:4px 0">Carregando…</div>`;
  } else if (cache.erro) {
    corpo = `<div style="font-size:11px;color:var(--muted);padding:4px 0">Não foi possível carregar a venda dessa semana.</div>`;
  } else if (!cache.total) {
    corpo = `<div style="font-size:11px;color:var(--muted);padding:4px 0">Sem venda lançada no Check-list nessa semana.</div>`;
  } else {
    const fmtV = v => v > 0 ? (v >= 1000 ? 'R$' + (v / 1000).toFixed(1).replace('.', ',') + 'k' : 'R$' + Math.round(v)) : '—';
    corpo = `
      <table style="width:100%;border-collapse:collapse;table-layout:fixed;margin-top:6px">
        <thead><tr>${DSEM.map(d => `<th style="font-size:9px;font-weight:700;color:var(--muted);text-align:center;padding:2px 0">${d}</th>`).join('')}</tr></thead>
        <tbody><tr>${cache.dias.map(v => `<td style="font-size:10px;font-weight:800;color:${v > 0 ? 'var(--text)' : 'var(--muted)'};text-align:center;padding:2px 0">${fmtV(v)}</td>`).join('')}</tr></tbody>
      </table>
      <div style="text-align:right;font-size:11px;font-weight:800;color:#22c55e;margin-top:6px">Total: R$ ${cache.total.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</div>`;
  }

  return `<div style="background:var(--card2);border:1px solid var(--border);border-left:3px solid #22c55e;border-radius:var(--r);padding:12px 14px;margin-bottom:10px">
    <div style="font-size:12px;font-weight:700;margin-bottom:3px">📊 Venda da Semana Anterior · ${lojaNome}</div>
    <div style="font-size:10px;color:var(--muted);margin-bottom:2px">${fmtD(segAnt)} – ${fmtD(domAnt)} · confira se bate com o estoque contado nesta semana.</div>

}

// digitado aqui grava direto em S.pedidoItens, então aparece na aba Pedido normalmente e
// "Confirmar" gera provisões/pedidos pelas lojas do jeito de sempre (mesma função/estado).
const EDU_FORNECEDORES = ['AMBEV', 'JBS', 'FAFS /VILLA PESCADOS'];
// Fornecedores da aba "Oseas" — mesmo esquema da aba Edu, restrito ao fornecedor PETISCOS.
const OSEAS_FORNECEDORES = ['PETISCOS'];

// ── URGÊNCIA (raio) — compartilhada com o app Lojas ────────────────────────
// gn_lojas_pedido usa slug_pedido (ex.: 'boulevard'); o app Lojas guarda a urgência em
// gn_lojas.all_data.urgenciaTemplate, chaveado pelo "loja" dele (ex.: 'BOULEVARD', o
// mesmo userKey de GN_LOJAS). Esse mapa traduz um pro outro pra marcar/ler no lugar certo.
const LOJA_USERKEY_BY_SLUG = Object.fromEntries((window.GN_LOJAS || []).map(l => [l.lojaSlug, l.userKey]));

// Loja fictícia de teste (mesma usada nos outros apps) — não fica gravada em
// gn_lojas_pedido de propósito, pra nunca entrar em S.lojas (que alimenta o pedido
// consolidado enviado pro fornecedor, os totais em modo TODOS e as provisões geradas
// ao confirmar). Só é oferecida como opção via lojasComTeste(), nos seletores de loja
// específica (aba por loja, carnes, trios) — nunca no modo "TODOS".
const LOJA_TESTE_PEDIDO = { slug_pedido: 'loja_teste', nome_display: 'Loja Teste' };
function lojasComTeste() { return [...S.lojas, LOJA_TESTE_PEDIDO]; }

async function carregarUrgenciaTemplate() {
  const userKeys = [...new Set(Object.values(LOJA_USERKEY_BY_SLUG))];
  if (!userKeys.length) return;
  try {
    const { data } = await db.from('gn_lojas').select('loja,all_data').in('loja', userKeys);
    (data || []).forEach(row => {
      S.urgenciaTemplate[row.loja] = (row.all_data && row.all_data.urgenciaTemplate && row.all_data.urgenciaTemplate[row.loja]) || [];
    });
  } catch (e) {}
}

// Marca/desmarca manualmente um item como urgência pra uma loja — grava direto na mesma
// gn_lojas.all_data.urgenciaTemplate que o app Lojas lê, então aparece de lá também.
async function toggleUrgenciaPedido(itemId, lojaSlug) {
  const userKey = LOJA_USERKEY_BY_SLUG[lojaSlug];
  if (!userKey) { toast('Esta loja não tem urgência configurada.', 'err'); return; }
  const idStr = String(itemId);
  const atual = S.urgenciaTemplate[userKey] ? [...S.urgenciaTemplate[userKey]] : [];
  const idx = atual.indexOf(idStr);
  if (idx >= 0) atual.splice(idx, 1); else atual.push(idStr);
  S.urgenciaTemplate[userKey] = atual;
  renderPedido();
  try {
    const { data } = await db.from('gn_lojas').select('all_data').eq('loja', userKey);
    const allData = (data && data[0] && data[0].all_data) || {};
    allData.urgenciaTemplate = { [userKey]: atual };
    if (data && data.length) {
      await db.from('gn_lojas').update({ all_data: allData }).eq('loja', userKey);
    } else {
      await db.from('gn_lojas').insert({ loja: userKey, all_data: allData });
    }
  } catch (e) {
    toast('Erro ao salvar urgência.', 'err');
  }
}

function _pedidoItemUrgente(prod, lojaSlug) {
  const idStr = String(prod.item_id);
  if (lojaSlug) {
    const uk = LOJA_USERKEY_BY_SLUG[lojaSlug];
    return !!uk && (S.urgenciaTemplate[uk] || []).includes(idStr);
  }
  return S.lojas.some(l => {
    const uk = LOJA_USERKEY_BY_SLUG[l.slug_pedido];
    return uk && (S.urgenciaTemplate[uk] || []).includes(idStr);
  });
}

function _pedidoItemPreenchido(prod, lojaSlug) {
  if (lojaSlug) return (S.pedidoItens[prod.id]?.[lojaSlug]?.qtd || 0) > 0;
  return S.lojas.some(l => (S.pedidoItens[prod.id]?.[l.slug_pedido]?.qtd || 0) > 0);
}

// ═══════════════════════════════════════════════
// RENDER: PEDIDO
// ═══════════════════════════════════════════════
function renderPedido() {
  // Início/fim (ISO) da semana ativa — usado pra destacar em verde quando a contagem
  // (Est.vig) foi feita DENTRO dessa semana, e não é um saldo carregado de outra semana.
  const { monISO: _semAtivaMonISO, sunISO: _semAtivaSunISO } = _semanaAtivaBounds();

  const sem = formatarSemana(S.semanaAtiva);
  const mondayHoje = getMondayOfWeek();
  const podeAvancar = S.semanaAtiva < mondayHoje;

  // Barra de semana (sempre visível)
  const semNavHtml = `
    <div class="semana-nav">
      <button class="semana-nav-arrow" onclick="navegarSemana(-1)" title="Semana anterior">‹</button>
      <div class="semana-info">
        <div class="semana-label">SEMANA ${sem.num} · ${sem.ano}</div>
        <div class="semana-periodo">${sem.periodo}</div>
        ${sem.ehAtual ? '<div class="semana-atual-badge">▶ SEMANA ATUAL</div>' : '<div class="semana-atual-badge" style="color:var(--muted)">semana passada</div>'}
      </div>
      <button class="semana-nav-arrow" onclick="navegarSemana(1)" ${podeAvancar?'':'disabled'} title="Próxima semana">›</button>
    </div>
    ${!sem.ehAtual?`<div style="text-align:center;margin-bottom:6px"><button onclick="irParaSemanaAtual()" style="padding:5px 16px;border-radius:20px;border:1px solid var(--primary);background:rgba(232,88,10,.1);color:var(--primary);font-size:11px;font-weight:700;cursor:pointer">▶ Ir para semana atual</button></div>`:''}`;

  if (!S.pedidoAtual) {
    $('content').innerHTML = semNavHtml + _datasEspeciaisCardHtml() + _vendaSemanaAntCardHtml() + `
      <div class="empty" style="margin-top:20px">
        <div class="empty-icon">📋</div>
        <div class="empty-texto">Nenhum pedido nesta semana</div>
      </div>`;
    return;
  }

  const statusChip = {
    'RASCUNHO': '<span class="chip chip-rascunho">RASCUNHO</span>',
    'CONFIRMADO': '<span class="chip chip-confirmado">CONFIRMADO</span>',
    'ENVIADO': '<span class="chip chip-enviado">ENVIADO</span>',
  }[S.pedidoAtual.status] || '';

  const totalGeral = totalPedidoGeral();
  const totalItensGeral = S.todosModo
    ? S.lojas.reduce((sum,l)=>sum+contarItensLoja(l.slug_pedido),0)
    : contarItensLoja(S.lojaAtiva);

  // Grupos únicos do catálogo ativo (na aba Edu, só os grupos com itens de EDU_FORNECEDORES)
  const grupos = [...new Set(S.catalogo.filter(p=>p.ativo && (!S.eduAtivo || EDU_FORNECEDORES.includes(p.fornecedor)) && (!S.oseasAtivo || OSEAS_FORNECEDORES.includes(p.fornecedor))).map(p=>p.grupo))].sort();
  const busca   = S.busca.toLowerCase();
  const lojaAtiva = S.lojaAtiva;

  // ── Toggle Modo ──
  const toggleModo = `
    <div class="toggle-modo">
      <button class="toggle-modo-btn${!S.todosModo?' ativo':''}" onclick="setModo(false)">POR LOJA</button>
      <button class="toggle-modo-btn${S.todosModo?' ativo':''}" onclick="setModo(true)">TODOS</button>
    </div>`;

  // ── Store Tabs (só no modo POR LOJA) ──
  const storeTabs = !S.todosModo ? lojasComTeste().map(l => {
    const n = contarItensLoja(l.slug_pedido);
    return `<button class="store-tab${lojaAtiva===l.slug_pedido?' ativo':''}"
      onclick="selecionarLoja('${l.slug_pedido}')">
      ${l.nome_display}${n>0?`<span class="contagem">(${n})</span>`:''}
    </button>`;
  }).join('') : '';

  // ── Produtos filtrados ──
  function prodsFiltrados(grupo) {
    let lista = S.catalogo.filter(p =>
      p.ativo && p.grupo === grupo &&
      (!S.eduAtivo    || EDU_FORNECEDORES.includes(p.fornecedor)) &&
      (!S.oseasAtivo  || OSEAS_FORNECEDORES.includes(p.fornecedor)) &&
      (!S.grupoFiltro || p.grupo === S.grupoFiltro) &&
      (!S.fornFiltro  || p.fornecedor === S.fornFiltro) &&
      (!busca || p.produto.toLowerCase().includes(busca) || p.fornecedor.toLowerCase().includes(busca))
    );
    const lojaFiltro = S.todosModo ? null : lojaAtiva;
    if (S.pedFiltro === 'vazios') lista = lista.filter(p => !_pedidoItemPreenchido(p, lojaFiltro));
    else if (S.pedFiltro === 'preenchidos') lista = lista.filter(p => _pedidoItemPreenchido(p, lojaFiltro));
    else if (S.pedFiltro === 'urgencia') lista = lista.filter(p => _pedidoItemUrgente(p, lojaFiltro));
    return lista;
  }

  // ── MODO: POR LOJA ──
  function renderGruposPorLoja() {
    return grupos.map(grupo => {
      const prods = prodsFiltrados(grupo);
      if (prods.length === 0) return '';
      const fors = [...new Set(prods.map(p=>p.fornecedor))].sort();
      const aberto = S.gruposAbertos.has(grupo);

      const fornsHtml = fors.map(forn => {
        const pp = prods.filter(p => p.fornecedor === forn);
        const rowsHtml = pp.map(prod => {
          const contagem = S.contagens[prod.id]?.[lojaAtiva];
          const itemAtual = S.pedidoItens[prod.id]?.[lojaAtiva];
          const qtdAtual  = itemAtual?.qtd ?? 0;
          const divAtual  = itemAtual?.diverg ?? false;
          const jaPedido  = (S.pedidosConfirmados[prod.id]?.[lojaAtiva] ?? 0) > 0;
          const dash = '<span style="color:var(--muted)">—</span>';
          const { estAnt, estVig } = _estAntVigEfetivo(contagem, _semAtivaMonISO, _semAtivaSunISO);
          const ulEstDisp = estAnt != null
            ? `<span class="val">${fmtQtd(estAnt)}</span>` : dash;
          const ulPedDisp = contagem?.ul_pedido != null
            ? `<span class="val">${fmtQtd(contagem.ul_pedido)}</span>` : dash;
          const estVigDisp = estVig != null
            ? `<span class="val" style="color:#22c55e;font-weight:700">✓ ${fmtQtd(estVig)}</span>` : dash;
          const contInfoTxt = _contagemInfoTxt(contagem);
          const contInfoBtn = contInfoTxt
            ? `<span onclick="event.stopPropagation();mostrarInfoContagem('${prod.id}','${lojaAtiva}')" title="${contInfoTxt.replace(/"/g,'&quot;')}" style="cursor:pointer;opacity:.7">🕒</span>` : '';
          const corrigirBtn = `<span onclick="event.stopPropagation();corrigirEstVig('${prod.id}','${lojaAtiva}','${prod.produto.replace(/'/g,"\\'")}')" title="Corrigir Est.vig" style="cursor:pointer;opacity:.7">✏️</span>`;
          const isUrgente = _pedidoItemUrgente(prod, lojaAtiva);
          const prodConfirmado = S.fornecedoresConfirmados.has(prod.fornecedor);
          const fator = prod.und_por_caixa > 1 ? prod.und_por_caixa : null;
          const qtyCtrlHtml = fator ? (() => {
            // Usa a quebra REAL digitada (no app Lojas ou aqui mesmo) quando existir —
            // só decompõe o total "na marra" se nunca houve uma quebra registrada.
            const { cx, und } = (itemAtual?.qtdCx != null || itemAtual?.qtdUnd != null)
              ? { cx: itemAtual.qtdCx || 0, und: itemAtual.qtdUnd || 0 }
              : _decomporCxUnd(qtdAtual, fator);

                <div style="display:flex;flex-direction:column;align-items:center;gap:1px">

                </div>
                <div style="display:flex;flex-direction:column;align-items:center;gap:1px">
                  <input class="qty-input qty-und" type="text" inputmode="decimal" min="0" style="width:40px;border:1px solid var(--border);border-radius:var(--rs)"
                    value="${und||''}" placeholder="0" ${prodConfirmado?'disabled':''}
                    oninput="qtdCxUndInput(this,'${prod.id}','${lojaAtiva}',${prod.custo||0},${fator})"
                    onchange="qtdCxUndInput(this,'${prod.id}','${lojaAtiva}',${prod.custo||0},${fator},true)"
                    onblur="qtdCxUndInput(this,'${prod.id}','${lojaAtiva}',${prod.custo||0},${fator},true)">
                  <span style="font-size:8px;color:var(--muted)">UND</span>
                </div>
                <span class="cxund-total num" style="font-size:10px;color:var(--muted);white-space:nowrap">= ${fmtQtd(qtdAtual)}</span>

          })() : `<div class="qty-ctrl">
                <button class="qty-btn" onclick="ajustarQtd('${prod.id}','${lojaAtiva}',${prod.custo||0},-1)" ${prodConfirmado?'disabled':''}>−</button>

                  onchange="qtdChanged('${prod.id}','${lojaAtiva}',${prod.custo||0},this.value,true)"
                  onblur="qtdChanged('${prod.id}','${lojaAtiva}',${prod.custo||0},this.value,true)"
                  onkeydown="nextInput(event,this)">
                <button class="qty-btn" onclick="ajustarQtd('${prod.id}','${lojaAtiva}',${prod.custo||0},1)" ${prodConfirmado?'disabled':''}>+</button>
              </div>`;
          return `<div class="prod-row${divAtual?' diverg-ativo':jaPedido?' ja-pedido':''}" data-cid="${prod.id}" data-loja="${lojaAtiva}">

              <div class="prod-nome" title="${prod.produto}">${prod.produto}</div>
              <div class="prod-meta">
                <span class="prod-und">${prod.und}</span>
                ${prod.custo?`<span class="prod-custo num">R$${fmt(prod.custo)}</span>`:''}
                <span class="prod-est">Est.ant: ${ulEstDisp}</span>

                <span class="prod-vig">Est.vig: ${estVigDisp} ${contInfoBtn}${corrigirBtn}</span>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:0">
              ${qtyCtrlHtml}
              <button class="diverg-btn${divAtual?' ativo':''}" title="Marcar divergência na contagem" onclick="toggleDiverg('${prod.id}','${lojaAtiva}')">⚑</button>
              <button class="urg-btn${isUrgente?' ativo':''}${isUrgente&&prodConfirmado?' finalizada':''}" title="${isUrgente?(prodConfirmado?'Urgência — fornecedor já confirmado':'Urgência — remover'):'Marcar como urgência'}" onclick="toggleUrgenciaPedido('${prod.item_id}','${lojaAtiva}')">⚡</button>
            </div>
          </div>`;
        }).join('');
        const fornConfirmadoBadge = S.fornecedoresConfirmados.has(forn) ? ' <span style="color:#22c55e;font-weight:700">✓ confirmado</span>' : '';
        return `<div><div class="forn-header">${forn}${fornConfirmadoBadge}</div>${rowsHtml}</div>`;
      }).join('');

      const totalItens = prods.reduce((n,p)=>n+(S.pedidoItens[p.id]?.[lojaAtiva]?.qtd>0?1:0),0);
      return `<div class="grupo-bloco${aberto?' aberto':''}" id="grupo-${grupo.replace(/[^a-z0-9]/gi,'_')}">
        <div class="grupo-header" onclick="toggleGrupo('${grupo}')">
          <span class="grupo-nome">${grupo}</span>
          <div style="display:flex;align-items:center;gap:8px">
            ${totalItens>0?`<span class="grupo-qtd num">${totalItens} item${totalItens>1?'s':''}</span>`:''}

          </div>
        </div>
        <div class="grupo-body">${fornsHtml}</div>
      </div>`;
    }).join('');
  }

// build: força novo deploy pra destravar cache de edge preso na versão anterior (#434)
// Debounce por campo (catalogoId+lojaSlug): oninput dispara a cada tecla digitada,
// então sem coalescer as gravações viravam upserts concorrentes que podiam chegar
// fora de ordem no servidor e sobrescrever o valor final com um dígito intermediário
// (relato: "as atualizações não estão ficando"). Cada entrada guarda também os dados
// da gravação pendente (não só o timer) pra poder forçar o disparo imediato
// (_flushQtdTimersPendentes) se a aba/app for pra segundo plano ou fechar antes dos
// 500ms do debounce — senão a última digitação era perdida sem nunca ser gravada.
const _qtdSaveTimers = {};

function _qtdSaveKey(catalogoId, lojaSlug) { return catalogoId + '|' + lojaSlug; }

async function _executarSalvarQtd(catalogoId, lojaSlug, custo, valor, cxUnd) {
  const qtd = parseFloat(valor) || 0;
  await salvarItem(catalogoId, lojaSlug, qtd, custo || null, cxUnd);
  renderTotalLoja();
  // Atualiza contagem na tab
  document.querySelectorAll('.store-tab').forEach(btn => {
    const slug = btn.getAttribute('onclick')?.match(/'([^']+)'/)?.[1];
    if (!slug) return;
    const n = contarItensLoja(slug);
    const span = btn.querySelector('.contagem');
    if (n > 0) {
      if (span) span.textContent = `(${n})`;
      else btn.innerHTML += `<span class="contagem">(${n})</span>`;
    } else if (span) span.remove();
  });
}

function qtdChanged(catalogoId, lojaSlug, custo, valor, imediato, cxUnd) {
  const key = _qtdSaveKey(catalogoId, lojaSlug);
  if (_qtdSaveTimers[key]) clearTimeout(_qtdSaveTimers[key].timer);
  delete _qtdSaveTimers[key];
  if (imediato) {
    _executarSalvarQtd(catalogoId, lojaSlug, custo, valor, cxUnd);
  } else {
    const timer = setTimeout(() => {
      delete _qtdSaveTimers[key];
      _executarSalvarQtd(catalogoId, lojaSlug, custo, valor, cxUnd);
    }, 500);
    _qtdSaveTimers[key] = { timer, catalogoId, lojaSlug, custo, valor, cxUnd };
  }
}

// Decompõe uma quantidade total (o que fica salvo) em Cx + Und, usando o fator de
// conversão do produto (und_por_caixa) — só pra exibir os dois campos separados no
// Pedido, facilitando pro pessoal do estoque que já pensa em caixas. O que é salvo no
// banco continua sendo sempre o total (qtd_pedida), igual antes.
function _decomporCxUnd(total, fator) {
  const t = parseFloat(total) || 0;
  const cx = Math.floor(t / fator);
  const und = Math.round((t - cx * fator) * 100) / 100;
  return { cx, und };
}

// Lida com a digitação nos campos Cx/Und: recalcula o total, atualiza o "= X UND" ao
// lado na hora (sem esperar o debounce salvar) e segue o mesmo fluxo de gravação/
// debounce de sempre (qtdChanged) com o total resultante.
function qtdCxUndInput(el, catalogoId, lojaSlug, custo, fator, imediato) {
  const row = el.closest('[data-cid]');
  const cx = parseFloat(row?.querySelector('.qty-cx')?.value) || 0;
  const und = parseFloat(row?.querySelector('.qty-und')?.value) || 0;
  const total = cx * fator + und;
  const totalEl = row?.querySelector('.cxund-total');
  if (totalEl) totalEl.textContent = '= ' + fmtQtd(total);
  qtdChanged(catalogoId, lojaSlug, custo, total, imediato, { cx, und });
}

function _flushQtdTimersPendentes() {
  Object.keys(_qtdSaveTimers).forEach(key => {
    const pend = _qtdSaveTimers[key];
    clearTimeout(pend.timer);
    delete _qtdSaveTimers[key];
    _executarSalvarQtd(pend.catalogoId, pend.lojaSlug, pend.custo, pend.valor, pend.cxUnd);
  });
}
document.addEventListener('visibilitychange', () => { if (document.hidden) _flushQtdTimersPendentes(); });
window.addEventListener('pagehide', _flushQtdTimersPendentes);
window.addEventListener('blur', _flushQtdTimersPendentes);

async function ajustarQtd(catalogoId, lojaSlug, custo, delta) {
  const key = _qtdSaveKey(catalogoId, lojaSlug);
  clearTimeout(_qtdSaveTimers[key]);
  delete _qtdSaveTimers[key];

  const atual = S.pedidoItens[catalogoId]?.[lojaSlug]?.qtd ?? 0;
  const nova = Math.max(0, atual + delta);

  // Atualiza inputs visuais (modo loja e modo todos)
  document.querySelectorAll('.qty-input').forEach(inp => {
    const row = inp.closest('.prod-row');
    if (!row) return;
    const bts = row.querySelectorAll('.qty-btn');
    const onclick = bts[0]?.getAttribute('onclick') || '';
    if (onclick.includes(catalogoId) && onclick.includes(lojaSlug)) inp.value = nova || '';
  });
  document.querySelectorAll('.qty-input-sm').forEach(inp => {
    const row = inp.closest('.todos-loja-row');
    if (!row) return;
    const bts = row.querySelectorAll('.qty-btn-sm');
    const onclick = bts[0]?.getAttribute('onclick') || '';
    if (onclick.includes(catalogoId) && onclick.includes(lojaSlug)) inp.value = nova || '';
  });

  await _executarSalvarQtd(catalogoId, lojaSlug, custo, nova);
}

function nextInput(e, el) {
  if (e.key !== 'Enter' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  e.preventDefault();
  const all = [...document.querySelectorAll('.qty-input,.qty-input-sm')].filter(i => !i.disabled);
  const idx = all.indexOf(el);
  let target = null;
  if (e.key === 'ArrowUp') {
    if (idx > 0) target = all[idx - 1];
  } else {
    if (idx >= 0 && idx < all.length - 1) target = all[idx + 1];
  }
  if (target) {
    target.focus({ preventScroll: true });
    target.select();
    target.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }
}

async function toggleDiverg(catalogoId, lojaSlug) {
  if (!S.pedidoItens[catalogoId]) S.pedidoItens[catalogoId] = {};
  if (!S.pedidoItens[catalogoId][lojaSlug]) S.pedidoItens[catalogoId][lojaSlug] = { id: null, qtd: 0, custo: null, diverg: false };
  const item = S.pedidoItens[catalogoId][lojaSlug];
  const novaDiverg = !item.diverg;
  item.diverg = novaDiverg;

  // Atualizar botões e linhas visualmente (sem re-render completo)
  document.querySelectorAll(`.prod-row[data-cid="${catalogoId}"][data-loja="${lojaSlug}"]`).forEach(row => {
    row.classList.toggle('diverg-ativo', novaDiverg);
    row.querySelectorAll('.diverg-btn').forEach(btn => btn.classList.toggle('ativo', novaDiverg));
  });
  document.querySelectorAll('.todos-loja-row').forEach(row => {
    const btn = row.querySelector('.diverg-btn');
    if (!btn) return;
    const onclick = btn.getAttribute('onclick') || '';
    if (onclick.includes(catalogoId) && onclick.includes(lojaSlug)) {
      btn.classList.toggle('ativo', novaDiverg);
      row.classList.toggle('diverg-ativo', novaDiverg);
    }
  });

  try {
    if (item.id) {
      await db.from('gn_pedido_itens').update({ divergencia: novaDiverg }).eq('id', item.id);
    } else if (novaDiverg && S.pedidoAtual) {
      // Sem linha no banco ainda — cria com qtd=0 e divergencia=true
      const { data, error } = await db.from('gn_pedido_itens').insert([{
        pedido_id:      S.pedidoAtual.id,
        catalogo_id:    catalogoId,
        loja_slug:      lojaSlug,
        qtd_pedida:     0,
        custo_unitario: null,
        divergencia:    true
      }]).select('id').single();
      if (!error && data) item.id = data.id;
    }
    // novaDiverg=false + sem id: nada a desfazer no banco
  } catch(e) { console.error('toggleDiverg:', e.message); }
}

// Mesmo filtro (grupo/fornecedor/busca/inativos) usado na lista da tela e nos relatórios,
// pra o relatório sempre refletir exatamente o que está sendo visto no Catálogo.
function _catalogoListaFiltrada() {
  const busca = S.catBusca.toLowerCase();
  return S.catalogo.filter(p =>
    (S.mostraInativos || p.ativo) &&
    (!S.catGrupo || p.grupo === S.catGrupo) &&
    (!S.catForn  || p.fornecedor === S.catForn) &&
    (!busca || p.produto.toLowerCase().includes(busca) || p.fornecedor.toLowerCase().includes(busca))
  );
}

              style="width:64px;height:32px;padding:2px 4px;text-align:center;font-size:12px"

// Salva o "Und por Cx" de um produto direto na lista do Catálogo (modo edição em
// lote) — sem abrir o modal individual, pra dar pra preencher vários produtos
// seguidos rapidamente. Silencioso no sucesso (só avisa em erro) pra não interromper
// quem está digitando vários campos em sequência.
async function salvarUndCxLote(id, valor) {
  const undPorCaixa = parseFloat(valor) || null;
  const { error } = await db.from('gn_catalogo')
    .update({ und_por_caixa: undPorCaixa, atualizado_em: new Date().toISOString() })
    .eq('id', id);
  if (error) { toast('⚠️ Erro ao salvar: ' + error.message, 'err'); return; }
  const idx = S.catalogo.findIndex(p => p.id === id);
  if (idx >= 0) S.catalogo[idx].und_por_caixa = undPorCaixa;
}

async function toggleAtivoProd(id, novoStatus) {
  await db.from('gn_catalogo').update({ ativo: novoStatus, atualizado_em: new Date().toISOString() }).eq('id', id);
  const idx = S.catalogo.findIndex(p => p.id === id);
  if (idx >= 0) S.catalogo[idx].ativo = novoStatus;
  renderCatalogo();
  toast(novoStatus ? 'Produto ativado.' : 'Produto desativado.', 'ok');
}

// Relatório do Catálogo — reflete exatamente os filtros ativos na tela (grupo/fornecedor/
// busca/inativos), agrupado por grupo. wpp=true usa emoji/negrito pro WhatsApp; PDF fica liso.
function _catalogoRelatorioTexto(wpp) {
  const lista = _catalogoListaFiltrada();
  if (!lista.length) return null;
  const porGrupo = {};
  lista.forEach(p => (porGrupo[p.grupo] = porGrupo[p.grupo] || []).push(p));
  const grupos = Object.keys(porGrupo).sort();
  const filtros = [];
  if (S.catGrupo) filtros.push('Grupo: ' + S.catGrupo);
  if (S.catForn)  filtros.push('Fornecedor: ' + S.catForn);
  if (S.catBusca) filtros.push('Busca: "' + S.catBusca + '"');
  if (S.mostraInativos) filtros.push('incluindo inativos');
  const bullet = wpp ? '•' : '-';
  let msg = `${wpp ? '📦 ' : ''}CATÁLOGO${filtros.length ? ' — ' + filtros.join(' · ') : ''}\n${lista.length} produto${lista.length !== 1 ? 's' : ''}\n`;
  grupos.forEach(grupo => {
    const itens = porGrupo[grupo].slice().sort((a, b) => a.produto.localeCompare(b.produto));
    msg += `\n${wpp ? '🏷️ *' : ''}${grupo}${wpp ? '*' : ''}\n`;
    itens.forEach(p => {
      const custo = p.custo ? ` — R$ ${fmt(p.custo)}` : '';
      const status = p.ativo ? '' : ' (inativo)';
      msg += `  ${bullet} [${p.item_id}] ${p.produto} (${p.und}) · ${p.fornecedor}${custo}${status}\n`;
    });
  });
  return msg;
}

function gerarWppCatalogo() {
  const msg = _catalogoRelatorioTexto(true);
  if (!msg) { toast('Nenhum produto encontrado.', 'err'); return; }
  window.open('https://wa.me/?text=' + encodeURIComponent(msg));
}

function gerarPDFCatalogo() {
  const msg = _catalogoRelatorioTexto(false);
  if (!msg) { toast('Nenhum produto encontrado.', 'err'); return; }
  gerarPDF(msg, 'Catálogo');
}
