async function salvarNovoProduto() {
  const item_id = parseInt($('m-item-id').value);
  const produto  = $('m-produto').value.trim();
  const grupo    = $('m-grupo').value;
  const subgrupo = $('m-subgrupo').value.trim().toUpperCase() || 'GERAL';
  const fornecedor = $('m-forn').value;
  const und      = $('m-und').value;
  const custo    = parseFloat($('m-custo').value) || null;

  if (!produto || !grupo || !item_id) { toast('Preencha código, produto e grupo.','err'); return; }

  const { data, error } = await db.from('gn_catalogo')
    .insert([{ item_id, produto, grupo, subgrupo, fornecedor, und, custo }]).select().single();

  if (error) { toast('Erro: '+error.message,'err'); return; }
  S.catalogo.push(data);
  S.catalogo.sort((a,b) => a.grupo.localeCompare(b.grupo)||a.produto.localeCompare(b.produto));
  $('modal-bg').classList.remove('ativo');
  toast('Produto adicionado!','ok');
  renderCatalogo();
}

async function salvarEdicaoProduto(id) {
  const produto  = $('m-produto').value.trim();
  const grupo    = $('m-grupo').value;
  const subgrupo = $('m-subgrupo').value.trim().toUpperCase() || 'GERAL';
  const fornecedor = $('m-forn').value;
  const und      = $('m-und').value;
  const custo    = parseFloat($('m-custo').value) || null;
  const undPorCaixa = parseFloat($('m-undcx').value) || null;

  if (!produto || !grupo) { toast('Preencha produto e grupo.','err'); return; }

  const { error } = await db.from('gn_catalogo')
    .update({ produto, grupo, subgrupo, fornecedor, und, custo, und_por_caixa: undPorCaixa, atualizado_em: new Date().toISOString() })
    .eq('id', id);

  if (error) { toast('Erro: '+error.message,'err'); return; }
  const idx = S.catalogo.findIndex(p => p.id === id);
  if (idx >= 0) Object.assign(S.catalogo[idx], { produto, grupo, subgrupo, fornecedor, und, custo, und_por_caixa: undPorCaixa });
  $('modal-bg').classList.remove('ativo');
  toast('Produto atualizado!','ok');
  renderCatalogo();
}

async function excluirProduto(id) {
  if (!confirm('Excluir produto do catálogo?\nEle será desativado permanentemente.')) return;
  await db.from('gn_catalogo').update({ ativo: false, atualizado_em: new Date().toISOString() }).eq('id', id);
  const idx = S.catalogo.findIndex(p => p.id === id);
  if (idx >= 0) S.catalogo[idx].ativo = false;
  $('modal-bg').classList.remove('ativo');
  toast('Produto excluído.','ok');
  renderCatalogo();
}

function renderFornecedores() {
  const lista = S.fornecedores;

  const itensHtml = lista.length === 0
    ? '<div class="empty"><div class="empty-icon">🏭</div><div class="empty-texto">Nenhum fornecedor</div></div>'
    : lista.map(f => {
        const dias = f.dias_entrega || [];
        const diasHtml = DIAS_SEMANA.map(d =>
          `<button class="dia-btn${dias.includes(d)?' on':''}" 
            onclick="toggleDia('${f.id}','${d}')">${d}</button>`
        ).join('');

        const pMin = f.prazo_dias_min ?? '';
        const pMax = f.prazo_dias_max ?? '';
        const prazoLbl = f.prazo_dias_min != null
          ? (f.prazo_dias_max != null && f.prazo_dias_max !== f.prazo_dias_min
              ? `${f.prazo_dias_min}–${f.prazo_dias_max} dias`

        return `<div class="forn-item" id="forn-${f.id}">
          <div class="forn-item-header">
            <div class="forn-item-nome">${f.nome}</div>
            <div style="font-size:11px;color:var(--muted)">${dias.length>0?dias.join(', '):'Sem dias'}${prazoLbl?' · '+prazoLbl:''}</div>
          </div>
          <div class="dias-grid">${diasHtml}</div>
          <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:8px 0 4px">Prazo de entrega (dias após o pedido)</div>
          <div style="display:flex;gap:8px;margin-bottom:8px">
            <input class="form-input" id="prazomin-${f.id}" type="number" min="0" step="1"
              placeholder="Mín" value="${pMin}" style="flex:1">
            <input class="form-input" id="prazomax-${f.id}" type="number" min="0" step="1"
              placeholder="Máx (opcional)" value="${pMax}" style="flex:1">

            placeholder="Contato / WhatsApp" value="${f.contato||''}">

      <div class="sec-titulo">Fornecedores <span class="badge badge-r">${lista.length}</span></div>

    </div>

      para calcular automaticamente as datas nas provisões. Se preencher o prazo em dias, ele tem
      prioridade sobre os dias da semana. Preencher só o "Mín" define uma data fixa; preencher os
      dois define um período (janela) de entrega prevista.
    </div>
    ${itensHtml}
  `;
}

async function toggleDia(fornId, dia) {
  const idx = S.fornecedores.findIndex(f => f.id === fornId);
  if (idx < 0) return;
  const f = S.fornecedores[idx];
  const dias = [...(f.dias_entrega || [])];
  const pos = dias.indexOf(dia);
  if (pos >= 0) dias.splice(pos, 1);
  else dias.push(dia);

  S.fornecedores[idx].dias_entrega = dias;
  await db.from('gn_fornecedores_pedido')
    .update({ dias_entrega: dias, atualizado_em: new Date().toISOString() }).eq('id', fornId);

  // Atualiza só o botão
  const el = document.querySelector(`#forn-${fornId} .dias-grid`);
  if (el) {
    el.querySelectorAll('.dia-btn').forEach(btn => {
      const d = btn.textContent.trim();
      btn.classList.toggle('on', dias.includes(d));
    });
    const info = document.querySelector(`#forn-${fornId} .forn-item-header div:last-child`);
    if (info) info.textContent = dias.length>0?dias.join(', '):'Sem dias';
  }
}

async function salvarFornecedor(fornId) {
  const contato = $(`contato-${fornId}`)?.value.trim() || null;
  const obs     = $(`obs-${fornId}`)?.value.trim() || null;
  const dias    = S.fornecedores.find(f=>f.id===fornId)?.dias_entrega || [];

  const minRaw = $(`prazomin-${fornId}`)?.value.trim() || '';
  const maxRaw = $(`prazomax-${fornId}`)?.value.trim() || '';
  let prazoMin = minRaw === '' ? null : parseInt(minRaw, 10);
  let prazoMax = maxRaw === '' ? null : parseInt(maxRaw, 10);
  if (prazoMax != null && prazoMin == null) { prazoMin = prazoMax; }
  if (prazoMin != null && prazoMax != null && prazoMax < prazoMin) {
    toast('O prazo máximo não pode ser menor que o mínimo.', 'err'); return;
  }

  await db.from('gn_fornecedores_pedido')
    .update({
      contato, observacao: obs, dias_entrega: dias,
      prazo_dias_min: prazoMin, prazo_dias_max: prazoMax,
      atualizado_em: new Date().toISOString()
    })
    .eq('id', fornId);

  const idx = S.fornecedores.findIndex(f=>f.id===fornId);
  if (idx>=0) Object.assign(S.fornecedores[idx], { contato, observacao: obs, prazo_dias_min: prazoMin, prazo_dias_max: prazoMax });
  toast('Fornecedor salvo!','ok');
  renderFornecedores();
}

async function salvarNovoFornecedor() {
  const nome    = $('m-forn-nome').value.trim().toUpperCase();
  const contato = $('m-forn-contato').value.trim() || null;
  if (!nome) { toast('Informe o nome.','err'); return; }

  const { data, error } = await db.from('gn_fornecedores_pedido')
    .insert([{ nome, contato, dias_entrega: [] }]).select().single();
  if (error) { toast('Erro: '+error.message,'err'); return; }
  S.fornecedores.push(data);
  S.fornecedores.sort((a,b)=>a.nome.localeCompare(b.nome));
  $('modal-bg').classList.remove('ativo');
  toast('Fornecedor adicionado!','ok');
  renderFornecedores();
}

async function filtrarProvisao(loja) {
  S.provLoja = loja;
  await renderProvisoes();
}

async function _navegarSemanaProvisao(delta) {
  const nova = datePlusWeeks(S.provSemana || getMondayOfWeek(), delta);
  if (nova > getMondayOfWeek()) return;
  S.provSemana = nova;
  await renderProvisoes();
}

function gerarWppProvisoes() {
  if (!S.provisoes.length) { toast('Nenhuma provisão para enviar.', 'err'); return; }
  const porForn = {};
  S.provisoes.forEach(p => {
    const f = p.fornecedor || 'SEM FORNECEDOR';
    (porForn[f] = porForn[f] || []).push(p);
  });
  const fns = Object.keys(porForn).sort();
  const lojaLabel = S.provLoja
    ? (S.lojas.find(l => l.slug_pedido === S.provLoja)?.nome_display || S.provLoja)
    : 'Todas as lojas';
  let msg = `📦 *PROVISÕES — ${lojaLabel}*\n`;
  let total = 0;
  fns.forEach(forn => {
    const itens = porForn[forn];
    const totF = itens.reduce((a, p) => a + (parseFloat(p.valor_previsto) || 0), 0);
    msg += `\n🏭 *${forn}* — R$ ${fmt(totF)}\n`;
    itens.forEach(p => {
      const lojaNome = S.lojas.find(l => l.slug_pedido === p.loja_slug)?.nome_display || p.loja_slug;
      const icon = p.status === 'RECEBIDO_OK' ? '✅' : p.status === 'DIVERGENCIA' ? '⚠️' : '⏳';
      const dt = p.data_entrega ? ` (${p.data_entrega})` : '';
      msg += `  ${icon} ${lojaNome} — ${p.gn_catalogo?.produto || '—'}: ${fmtQtd(p.qtd_prevista)} ${p.gn_catalogo?.und || ''} R$ ${fmt(p.valor_previsto)}${dt}\n`;
      total += parseFloat(p.valor_previsto) || 0;
    });
  });
  msg += `\n💰 *Total: R$ ${fmt(total)}*`;

// Converte um texto simples num PDF de verdade (multi-página, fonte monoespaçada),
// usando jsPDF — necessário pra ter um arquivo real pra anexar no WhatsApp (o botão
// de PDF "normal" só abre a janela de impressão do navegador, sem gerar um Blob).
function _textoParaPdfBlob(texto, titulo){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const marginX=40, topo=56, lineHeight=13;
  const pageHeight=doc.internal.pageSize.getHeight();
  const maxWidth=doc.internal.pageSize.getWidth()-marginX*2;
  doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text(titulo, marginX, 36);
  doc.setFont('courier','normal'); doc.setFontSize(9);
  let y=topo;
  texto.split('\n').forEach(linha=>{
    const partes=doc.splitTextToSize(linha||' ', maxWidth);
    partes.forEach(p=>{
      if(y>pageHeight-40){ doc.addPage(); y=40; }
      doc.text(p, marginX, y);
      y+=lineHeight;
    });
  });
  return doc.output('blob');
}

// pra enviar direto pelo WhatsApp. Sem suporte a compartilhar arquivo (ex.: desktop),
// baixa o PDF e abre o WhatsApp com um texto pra anexar manualmente. Compartilhado por
// todos os botões "PDF no Whats" da aba Pedido (geral e por fornecedor).
async function _compartilharPdfWpp(msg, titulo){
  try{
    const blob=_textoParaPdfBlob(msg, titulo);
    const file=new File([blob], titulo.replace(/\s+/g,'_')+'.pdf', { type:'application/pdf' });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:titulo, text:titulo });
      return;
    }
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=file.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 10000);
    toast('📄 PDF baixado — anexe no WhatsApp manualmente.');
    window.open('https://wa.me/?text='+encodeURIComponent(titulo));
  }catch(e){
    if(e && e.name==='AbortError') return; // usuário cancelou o share sheet
    toast('⚠️ Erro ao gerar PDF: '+(e.message||e), 'err');
  }
}

async function enviarPDFPedidoWpp(){
  if(!S.pedidoAtual){toast('Nenhum pedido ativo.','err');return;}
  const r=_pedidoMsgETitulo();
  if(!r){toast('Nenhum item com pedido.','err');return;}
  await _compartilharPdfWpp(r.msg, r.titulo);
}
function gerarPDFProvisoes(){
  if(!S.provisoes.length){toast('Nenhuma provisão.','err');return;}
  const porForn={};
  S.provisoes.forEach(p=>{const f=p.fornecedor||'SEM FORNECEDOR';(porForn[f]=porForn[f]||[]).push(p);});
  const fns=Object.keys(porForn).sort();
  const lojaLabel=S.provLoja?(S.lojas.find(l=>l.slug_pedido===S.provLoja)?.nome_display||S.provLoja):'Todas as lojas';
  let msg=`PROVISÕES — ${lojaLabel}\n`;
  let total=0;
  fns.forEach(forn=>{
    const itens=porForn[forn];
    const totF=itens.reduce((a,p)=>a+(parseFloat(p.valor_previsto)||0),0);
    msg+=`\n${forn} — R$ ${fmt(totF)}\n`;
    itens.forEach(p=>{
      const lojaNome=S.lojas.find(l=>l.slug_pedido===p.loja_slug)?.nome_display||p.loja_slug;
      const icon=p.status==='RECEBIDO_OK'?'✅':p.status==='DIVERGENCIA'?'⚠️':'⏳';
      const dt=p.data_entrega?` (${p.data_entrega})`:'';
      msg+=`  ${icon} ${lojaNome} — ${p.gn_catalogo?.produto||'—'}: ${fmtQtd(p.qtd_prevista)} ${p.gn_catalogo?.und||''} R$ ${fmt(p.valor_previsto)}${dt}\n`;
      total+=parseFloat(p.valor_previsto)||0;
    });
  });
  msg+=`\nTotal: R$ ${fmt(total)}`;
  gerarPDF(msg,`Provisões — ${lojaLabel}`);
}

async function salvarEditarEntrega(provisaoId) {
  const ini = $('m-ent-ini')?.value || null;
  const fim = $('m-ent-fim')?.value || null;
  if (fim && ini && fim < ini) { toast('O fim do período não pode ser antes do início.', 'err'); return; }

  const { error } = await db.from('gn_provisoes')
    .update({ data_entrega: ini, data_entrega_fim: fim, atualizado_em: new Date().toISOString() })
    .eq('id', provisaoId);
  if (error) { toast('Erro: '+error.message, 'err'); return; }

  const idx = S.provisoes.findIndex(p => p.id === provisaoId);
  if (idx >= 0) Object.assign(S.provisoes[idx], { data_entrega: ini, data_entrega_fim: fim });
  $('modal-bg').classList.remove('ativo');
  toast('Entrega atualizada!', 'ok');
  renderProvisoes();
}

// ALERTAS DE ENTREGA ATRASADA

async function carregarProvisoesPendentes() {
  // Busca por data_entrega (início) < hoje — quando há período (data_entrega_fim), o
  // prazo real só vence no fim, então filtra de novo no cliente com a data efetiva.
  const { data } = await db.from('gn_provisoes')
    .select('*, gn_catalogo(produto,und)')
    .eq('status', 'AGUARDANDO')
    .not('data_entrega', 'is', null)
    .lt('data_entrega', hoje())
    .order('data_entrega');
  const h = hoje();
  S.provisoesAtrasadas = (data || []).filter(p => (p.data_entrega_fim || p.data_entrega) < h);
  _atualizarBadgeAtrasadas();
}

function _atualizarBadgeAtrasadas() {
  const btn = document.querySelector('[data-tab="provisoes"]');
  if (!btn) return;
  const n = S.provisoesAtrasadas.length;
  let badge = btn.querySelector('.badge-atrasadas');
  if (n > 0) {
    if (!badge) {
      badge = document.createElement('span');
      badge.className = 'badge-atrasadas';
      badge.style.cssText = 'position:absolute;top:4px;right:calc(50% - 16px);background:#ef4444;color:#fff;border-radius:20px;font-size:8px;font-weight:800;padding:1px 5px;min-width:14px;text-align:center;pointer-events:none';
      btn.style.position = 'relative';
      btn.appendChild(badge);
    }
    badge.textContent = n;
  } else if (badge) {
    badge.remove();
  }
}

function gerarMsgAlertaEntregaPedidos() {
  const at = S.provisoesAtrasadas;
  if (!at.length) return '';
  const dt = new Date().toLocaleDateString('pt-BR')+' '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const porLoja = {};
  at.forEach(p => {
    const nome = S.lojas.find(l => l.slug_pedido === p.loja_slug)?.nome_display || p.loja_slug;
    (porLoja[nome] = porLoja[nome] || []).push(p);
  });
  let msg = `🚨 *ENTREGAS ATRASADAS*\n📅 ${dt}\n\n⏰ *Provisões sem confirmação (prazo vencido):*\n`;
  Object.entries(porLoja).sort(([a],[b])=>a.localeCompare(b)).forEach(([nome, itens]) => {
    msg += `\n📍 *${nome}*\n`;
    itens.forEach(p => {
      msg += `  ▪️ ${p.fornecedor||'—'} — ${p.gn_catalogo?.produto||'—'}: ${fmtQtd(p.qtd_prevista)} ${p.gn_catalogo?.und||''} (previsto: ${p.data_entrega})\n`;
    });
  });
  msg += `\n⚠️ *${at.length} entrega${at.length>1?'s':''} atrasada${at.length>1?'s':''}. Verificar urgentemente!*`;
  return msg;
}

function dispararAlertaEntregaPedidos() {
  const msg = gerarMsgAlertaEntregaPedidos();
  if (!msg) { toast('✅ Nenhuma entrega atrasada.', 'ok'); return; }
  if (!alertasEntregaWpp.length) { abrirModalContatosEntrega(); return; }
  alertasEntregaWpp.forEach((c, i) => {
    setTimeout(() => {
      window.open('https://wa.me/'+(c.numero||'').replace(/\D/g,'')+'?text='+encodeURIComponent(msg), '_blank');
      toast('📲 '+c.nome+' alertado', 'ok');
    }, i * 1800);
  });
}

async function _verificarAlertasEntregaAuto() {
  await carregarProvisoesPendentes();
  if (!S.provisoesAtrasadas.length) return;
  try {
    const ts = parseInt(localStorage.getItem('gn_alerta_entrega_ped_ts') || '0');
    if (Date.now() - ts < 4 * 3600000) return;
  } catch(e) {}
  try { localStorage.setItem('gn_alerta_entrega_ped_ts', String(Date.now())); } catch(e) {}
  if (alertasEntregaWpp.length) dispararAlertaEntregaPedidos();
}

async function confirmarEntrega(provisaoId) {
  const qtdRec = parseFloat($('m-qtd-rec').value) || 0;
  const valRec = parseFloat($('m-val-rec').value) || 0;
  const obs    = $('m-obs-rec').value.trim() || null;
  const recebidoPor = ($('m-recebido-por')?.value || '').trim() || (() => {
    try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null')?.nome || 'SISTEMA'; } catch(e) { return 'SISTEMA'; }
  })();
  const prov   = S.provisoes.find(p => p.id === provisaoId);

  const qtdPrev = parseFloat(prov?.qtd_prevista) || 0;
  const diff    = qtdRec - qtdPrev;
  const status  = Math.abs(diff) < 0.01 ? 'RECEBIDO_OK' : 'DIVERGENCIA';

  // Salva recebimento
  await db.from('gn_recebimentos').insert([{
    provisao_id: provisaoId,
    qtd_recebida: qtdRec,
    valor_recebido: valRec,
    diferenca_qtd: diff,
    observacao: obs,
    validado_por: recebidoPor
  }]);

  // Atualiza status da provisão
  await db.from('gn_provisoes').update({ status, atualizado_em: new Date().toISOString() }).eq('id', provisaoId);

  $('modal-bg').classList.remove('ativo');
  toast(status === 'RECEBIDO_OK' ? '✓ Entrega confirmada!' : '⚠ Divergência registrada.', status==='RECEBIDO_OK'?'ok':'err');
  await renderProvisoes();
}

// RENDER: ENTREGA (pendentes + confirmados semana)

async function renderEntrega() {
  $('content').innerHTML = '<div class="empty"><div class="spin"></div></div>';
  await Promise.all([carregarEntregasPendentes(), carregarEntregasConfirmadas()]);

  // ── Seção pendentes ──
  let htmlPendentes = '';
  if (S.entregasPendentes.length === 0) {
    htmlPendentes = `<div class="empty" style="padding:20px 0">
      <div class="empty-icon">✅</div>
      <div class="empty-texto">Nenhuma entrega pendente!</div>
    </div>`;
  } else {
    const porData = {};
    S.entregasPendentes.forEach(p => {
      const d = p.data_entrega || 'Sem data';
      if (!porData[d]) porData[d] = [];
      porData[d].push(p);
    });
    htmlPendentes = Object.entries(porData).sort(([a],[b])=>a.localeCompare(b)).map(([data, itens]) => {
      const total = itens.reduce((a,p)=>a+(parseFloat(p.valor_previsto)||0),0);
      const itensHtml = itens.map(p => {
        const lojaDisplay = S.lojas.find(l=>l.slug_pedido===p.loja_slug)?.nome_display || p.loja_slug;
        return `<div class="prov-item" style="cursor:pointer" onclick="modalValidar('${p.id}')">
          <div class="prov-item-header">
            <div>
              <div class="prov-forn">${p.fornecedor}</div>
              <div class="prov-produto">${p.gn_catalogo?.produto||'—'}</div>
              <div style="font-size:11px;color:var(--muted)">${lojaDisplay}</div>
            </div>
            <div style="text-align:right">
              <div class="num" style="font-size:13px;font-weight:700">R$ ${fmt(p.valor_previsto)}</div>
              <div style="font-size:11px;color:var(--muted)">${fmtQtd(p.qtd_prevista)} ${p.gn_catalogo?.und||''}</div>
              <div style="font-size:10px;color:var(--primary);margin-top:4px">Toque para validar →</div>
            </div>
          </div>
        </div>`;
      }).join('');
      const dtDisplay = data !== 'Sem data' ? new Date(data+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'}) : 'Sem data';
      return `<div class="grupo-bloco aberto" style="margin-bottom:8px">
        <div class="grupo-header" style="cursor:default">
          <span class="grupo-nome">${dtDisplay}</span>
          <div style="display:flex;gap:12px;align-items:center">
            <span style="font-size:11px;color:var(--muted)">${itens.length} item${itens.length>1?'s':''}</span>
            <span class="num" style="font-size:12px">R$ ${fmt(total)}</span>
          </div>
        </div>
        <div class="grupo-body" style="display:block">${itensHtml}</div>
      </div>`;
    }).join('');
  }

  // ── Seção divergências esta semana ──
  let htmlDiverg = '';
  const divItems = S.entregasConfirmadas.filter(p => p.status === 'DIVERGENCIA');
  if (divItems.length > 0) {
    const porFornDiv = {};
    divItems.forEach(p => { const f = p.fornecedor || 'SEM FORNECEDOR'; (porFornDiv[f] = porFornDiv[f]||[]).push(p); });
    const divItensHtml = Object.entries(porFornDiv).sort(([a],[b])=>a.localeCompare(b)).map(([forn, itens]) => {
      const rows = itens.map(p => {
        const lojaDisplay = S.lojas.find(l=>l.slug_pedido===p.loja_slug)?.nome_display || p.loja_slug;
        const rec = Array.isArray(p.gn_recebimentos) ? p.gn_recebimentos[0] : p.gn_recebimentos;
        const difQtd = rec?.diferenca_qtd ?? 0;
        const difStr = difQtd ? (difQtd > 0 ? `+${fmtQtd(difQtd)}` : fmtQtd(difQtd)) : '—';
        return `<div class="prov-item" style="border-left:2px solid #fbbf24">
          <div class="prov-item-header">
            <div>
              <div class="prov-produto">${p.gn_catalogo?.produto||'—'}</div>
              <div style="font-size:11px;color:var(--muted)">${lojaDisplay}</div>
            </div>
            <div style="text-align:right;font-size:11px">
              <div>Prev: <span class="val">${fmtQtd(p.qtd_prevista)} ${p.gn_catalogo?.und||''}</span></div>
              <div>Rec: <span class="val">${fmtQtd(rec?.qtd_recebida??p.qtd_prevista)} ${p.gn_catalogo?.und||''}</span></div>
              <div style="color:#fbbf24;font-weight:700">Dif: ${difStr}</div>
            </div>
          </div>
          ${rec?.observacao?`<div style="font-size:10px;color:var(--muted);margin-top:4px;font-style:italic">"${rec.observacao}"</div>`:''}
        </div>`;
      }).join('');
      return `<div class="grupo-bloco aberto" style="margin-bottom:8px;border:1px solid rgba(251,191,36,.25)">
        <div class="grupo-header" style="cursor:default;background:rgba(251,191,36,.06)">
          <span class="grupo-nome" style="color:#fbbf24">⚠️ ${forn}</span>
          <span style="font-size:11px;color:var(--muted)">${itens.length} item${itens.length>1?'s':''}</span>
        </div>
        <div class="grupo-body" style="display:block">${rows}</div>
      </div>`;
    }).join('');

      <div class="sec-titulo" style="font-size:13px;margin-bottom:8px">⚠️ Divergências esta semana <span class="badge" style="background:rgba(251,191,36,.15);color:#fbbf24;font-size:10px">${divItems.length}</span></div>
      ${divItensHtml}
    </div>`;
  }

  // ── Seção confirmados semana vigente ──
  let htmlConfirmados = '';
  if (S.entregasConfirmadas.length > 0) {
    const itensHtml = S.entregasConfirmadas.map(p => {
      const lojaDisplay = S.lojas.find(l=>l.slug_pedido===p.loja_slug)?.nome_display || p.loja_slug;
      const rec = Array.isArray(p.gn_recebimentos) ? p.gn_recebimentos[0] : p.gn_recebimentos;
      const recebidoPor = rec?.validado_por || '—';
      const isDiv = p.status === 'DIVERGENCIA';
      const statusBadge = isDiv
        ? '<span class="status-badge s-div" style="font-size:9px">DIVERGÊNCIA</span>'
        : '<span class="status-badge s-ok" style="font-size:9px">RECEBIDO ✓</span>';
      return `<div class="prov-item">
        <div class="prov-item-header">
          <div>
            <div class="prov-forn">${p.fornecedor}</div>
            <div class="prov-produto">${p.gn_catalogo?.produto||'—'}</div>

async function renderFaltaDia() {
  $('content').innerHTML = '<div class="empty"><div class="spin"></div></div>';
  const hojeIso = hoje();

  const { data: rows } = await db.from('checklist_diario')
    .select('loja, faltas')
    .eq('data_operacao', hojeIso);

  const registros = (rows || []).filter(r => Array.isArray(r.faltas) && r.faltas.length > 0);

  const lojasFiltro = [{ slug_pedido: '', nome_display: 'Todas as lojas' }, ...S.lojas];
  const tabsHtml = lojasFiltro.map(l =>
    `<button class="store-tab${S.faltaDiaLoja === l.slug_pedido ? ' ativo' : ''}"
      onclick="S.faltaDiaLoja='${l.slug_pedido}';renderFaltaDia()">${l.nome_display}</button>`
  ).join('');

  const registrosFiltrados = S.faltaDiaLoja
    ? registros.filter(r => {
        const loja = S.lojas.find(l => l.slug_pedido === S.faltaDiaLoja || l.slug_checklist === S.faltaDiaLoja || l.nome_display === S.faltaDiaLoja);
        return r.loja === S.faltaDiaLoja || (loja && r.loja === loja.loja);
      })
    : registros;

  const urgenciaIcon = u => u === 'Alta' ? '🔴' : u === 'Media' ? '🟡' : '🟢';

  const itensHtml = registrosFiltrados.length === 0
    ? `<div class="empty" style="padding:30px 0">
        <div class="empty-icon">✅</div>
        <div class="empty-texto">${S.faltaDiaLoja ? 'Nenhuma falta registrada nessa loja hoje.' : 'Nenhuma falta registrada hoje.'}</div>
      </div>`
    : registrosFiltrados.map(r => {
        const lojaDisplay = S.lojas.find(l =>
          l.slug_pedido === r.loja || l.loja === r.loja || l.nome_display === r.loja
        )?.nome_display || r.loja;
        const itensLoja = r.faltas.map(f => {
          const icon = urgenciaIcon(f.urgencia);
          return `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)">
            <span style="font-size:16px;flex-shrink:0">${icon}</span>
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:600;color:var(--text)">${f.nome || '—'}</div>
              ${f.quantidade ? `<div style="font-size:11px;color:var(--muted)">Qtd: ${f.quantidade}</div>` : ''}
            </div>
            <span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;flex-shrink:0;${
              f.urgencia==='Alta' ? 'background:rgba(239,68,68,.15);color:#fca5a5' :
              f.urgencia==='Media' ? 'background:rgba(251,191,36,.15);color:#fbbf24' :
              'background:rgba(34,197,94,.15);color:#4ade80'
            }">${f.urgencia || 'Média'}</span>
          </div>`;
        }).join('');
        return `<div class="grupo-bloco aberto" style="margin-bottom:10px">
          <div class="grupo-header" style="cursor:default">
            <span class="grupo-nome">${lojaDisplay}</span>
            <span class="badge badge-r" style="font-size:10px">${r.faltas.length} falta${r.faltas.length>1?'s':''}</span>
          </div>
          <div class="grupo-body" style="display:block;padding:0 12px">${itensLoja}</div>
        </div>`;
      }).join('');

  const totalFaltas = registrosFiltrados.reduce((n, r) => n + (r.faltas?.length || 0), 0);
  const dataStr = new Date(hojeIso+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'});

  window._gerarWppFaltas = function(){
    const dataFull = new Date(hojeIso+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
    let txt = `⚠️ *GN — Faltas do Dia*\n📅 ${dataFull}\n`;
    if(registrosFiltrados.length===0){
      txt += '\n✅ Nenhuma falta registrada hoje.';
    } else {
      registrosFiltrados.forEach(r => {
        const lojaD = S.lojas.find(l=>l.slug_pedido===r.loja||l.loja===r.loja||l.nome_display===r.loja)?.nome_display||r.loja;
        txt += `\n🏪 *${lojaD}*\n`;
        r.faltas.forEach(f => {
          const ic = f.urgencia==='Alta'?'🔴':f.urgencia==='Media'?'🟡':'🟢';
          txt += `${ic} ${f.nome||'—'}${f.quantidade?' ('+f.quantidade+')':''}${f.urgencia?' — '+f.urgencia:''}\n`;
        });
      });
    }
    txt += `\n_Gerado em ${new Date().toLocaleString('pt-BR')}_`;
    if(navigator.share&&navigator.canShare({text:txt})){
      navigator.share({text:txt}).catch(()=>window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank'));
    } else {
      window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
    }
  };

  $('content').innerHTML = `
    <div class="sec-header">
      <div class="sec-titulo">Faltas do Dia <span class="badge badge-r">${totalFaltas}</span></div>
      <div style="display:flex;align-items:center;gap:8px">
        <div style="font-size:11px;color:var(--muted)">${dataStr}</div>
        <button onclick="renderFaltaDia()" style="padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:none;color:var(--muted);font-size:11px;cursor:pointer">↻ Atualizar</button>
      </div>
    </div>
    <div class="store-tabs" style="margin-bottom:12px">${tabsHtml}</div>
    ${itensHtml}
    ${totalFaltas>0?`
    <button onclick="window._gerarWppFaltas()" style="margin-top:12px;width:100%;background:rgba(37,211,102,.15);border:1px solid rgba(37,211,102,.4);border-radius:11px;padding:12px;color:#22c55e;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer">
      📲 Enviar Faltas por WhatsApp
    </button>`:''}
  `;
  _atualizarFaltasBadge(registros.reduce((n,r)=>n+(r.faltas?.length||0),0));
}

async function iniciarApp() {
  $('login').classList.remove('ativo');
  $('app').classList.add('ativo');
  $('header-data').textContent = hojeDisplay();
  try {
    const sess = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    if (sess) $('header-usuario').textContent = sess.nome;
  } catch(e) {}

  // Semana atual
  S.semanaAtiva = getMondayOfWeek();

  // Carregar dados
  await Promise.all([
    carregarCatalogo(),
    carregarFornecedores(),
    carregarLojas(),
    carregarContagens(),
    carregarMasterConfig(),
    carregarUrgenciaTemplate(),
  ]);
  // Load devoluções after lojas (needs S.lojas for display names)
  carregarDevolucoesLojas().catch(() => {});

  await carregarPedidoAtual();

  // Esconder splash
  $('splash').style.display = 'none';

  // Aplicar permissões de abas
  try {
    const _sess = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    const abasArr = _sess && _sess.permissoes && _sess.permissoes.pedidos_abas;
    S.abasPermitidas = Array.isArray(abasArr) ? new Set(abasArr) : null;
    const ALL_TABS = ['pedido','edu','oseas','catalogo','fornecedores','provisoes','entrega','fichas','faltas-dia','carnes','trios'];
    ALL_TABS.forEach(t => {
      const hidden = S.abasPermitidas && !S.abasPermitidas.has(t);
      document.querySelectorAll(`.sidebar-link[data-sidebar-tab="${t}"], .nav-btn[data-tab="${t}"]`).forEach(b => {
        b.style.display = hidden ? 'none' : '';
      });
    });
    if (S.abasPermitidas) {
      const primeira = ALL_TABS.find(t => S.abasPermitidas.has(t)) || 'pedido';
      setTab(primeira);
    } else {
      setTab('pedido');
    }
  } catch(e) { setTab('pedido'); }

  // Mostrar badge de pendências offline (se houver da sessão anterior)
  setTimeout(_ppBadge, 0);

  // Verificar entregas atrasadas em background (auto-alerta após 6s)
  setTimeout(_verificarAlertasEntregaAuto, 6000);

  // Registrar push subscription se já tem permissão
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').then(reg => {
      reg.update();
      if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
        setTimeout(registrarPushSubscription, 3000);
      }
    }).catch(() => {});
    navigator.serviceWorker.addEventListener('controllerchange', () => window.location.reload());
    navigator.serviceWorker.addEventListener('message', e => {
      if (e.data && e.data.type === 'GN_SW_UPDATED') window.location.reload();
    });
  }

  // Atualizar visual do botão de notificação
  _atualizarBtnNotif();

  // Carregar badge de faltas do dia em background
  setTimeout(_carregarFaltasBadge, 4000);
}

async function carregarMasterConfig() {
  try {
    const { data, error } = await db.from('gn_lojas')
      .select('all_data')
      .eq('loja', 'MASTER_CONFIG')
      .single();
    if (error || !data || !data.all_data) return;
    const d = data.all_data;
    if (d.fichasCustom)  Object.assign(fichasCustom,  d.fichasCustom);
    if (d.fichasRemoved) fichasRemoved = [...new Set([...fichasRemoved, ...d.fichasRemoved])];
    if (d.insumosCustom) insumosCustom = [...new Set([...insumosCustom, ...d.insumosCustom])];
  } catch(e) {
    console.warn('MASTER_CONFIG load error:', e);
  }
}

async function sbPushMasterConfig() {
  try {
    const payload = { fichasCustom, fichasRemoved, insumosCustom };
    const { error } = await db.from('gn_lojas')
      .update({ all_data: payload, updated_at: new Date().toISOString(), updated_by: 'MASTER' })
      .eq('loja', 'MASTER_CONFIG');
    if (error) throw error;
  } catch(e) {
    toast('⚠️ Erro ao enviar fichas: ' + (e.message || e), 'err');
  }
}

function getAllFichas() {
  const removed = new Set(fichasRemoved);
  const result = {};
  Object.entries(FICHAS_SEED.fichas_orig).forEach(([cod, f]) => {
    if (!removed.has(cod)) result[cod] = { ...f, codigo: cod, isCustom: false };
  });
  Object.entries(fichasCustom).forEach(([cod, f]) => {
    if (!removed.has(cod)) result[cod] = { ...f, isCustom: true };
  });
  return result;
}

function getAllInsumos() {
  const base = [...FICHAS_SEED.insumos, ...FICHAS_SEED.bebidas_insumos];
  return [...base, ...insumosCustom.filter(n => !base.includes(n))];
}

function salvarFichaCustom(data) {
  fichasCustom[data.codigo] = data;
  fichasRemoved = fichasRemoved.filter(c => c !== data.codigo);
  data.insumos.forEach(it => {
    const n = it.insumo.trim().toUpperCase();
    if (!getAllInsumos().includes(n)) insumosCustom.push(n);
  });
  sbPushMasterConfig();
  toast("✅ Ficha '" + data.nome + "' salva para todas as lojas!", 'ok');
}

function removerFichaCustom(cod) {
  const all = getAllFichas();
  const ficha = all[cod];
  if (!ficha) return;
  const nome = ficha.nome;
  if (!confirm('Remover a ficha "' + nome + '" de TODAS as lojas?')) return;
  if (ficha.isCustom) delete fichasCustom[cod];
  else fichasRemoved.push(cod);
  sbPushMasterConfig();
  toast("🗑 Ficha '" + nome + "' removida de todas as lojas.", 'ok');
  renderFichas();
}

function adicionarInsumoCustom(nome) {
  const n = nome.trim().toUpperCase();
  if (!n || getAllInsumos().includes(n)) { toast('⚠️ Insumo já existe ou nome vazio.', 'err'); return false; }
  insumosCustom.push(n);
  sbPushMasterConfig();
  toast("✅ Insumo '" + n + "' adicionado para todas as lojas!", 'ok');
  return true;
}

function adicionarLinhaFicha() {
  const cont = document.getElementById('fichaLinhas');
  if (!cont) return;
  const allIns = getAllInsumos();
  const id = 'dl_fi_' + Date.now();
  const div = document.createElement('div');
  div.className = 'ficha-linha';
  div.style.cssText = 'display:flex;gap:6px;align-items:center;margin-bottom:6px';
  div.innerHTML = `
    <input class="fi-ins filtro-input" list="${id}" type="text" placeholder="Insumo" autocomplete="off" style="flex:1;min-width:0;font-size:12px;padding:8px 10px"/>
    <datalist id="${id}">${allIns.map(n => `<option value="${n}"></option>`).join('')}</datalist>
    <input class="fi-qtd filtro-input" type="number" step="0.001" min="0" placeholder="Qtd" style="width:72px;flex-shrink:0;font-size:12px;padding:8px 6px"/>
    <select class="fi-und filtro-select" style="width:60px;flex-shrink:0;font-size:12px;padding:8px 4px">
      ${['KG','GR','UN','ML','LT','PCT'].map(u => `<option>${u}</option>`).join('')}
    </select>
    <button onclick="this.parentElement.remove()" style="background:rgba(239,68,68,.2);border:none;border-radius:6px;color:#fca5a5;width:28px;height:28px;flex-shrink:0;font-size:16px;cursor:pointer">×</button>`;
  cont.appendChild(div);
}

function resetFormFicha() {
  const fCod  = document.getElementById('fCod');
  const fNome = document.getElementById('fNome');
  if (fCod)  { fCod.value = ''; fCod.readOnly = false; fCod.style.opacity = '1'; fCod.style.cursor = ''; }
  if (fNome) fNome.value = '';
  const cont = document.getElementById('fichaLinhas');
  if (cont) { cont.innerHTML = ''; adicionarLinhaFicha(); }
  const btn = document.getElementById('btnSalvarFicha');
  if (btn) { btn.textContent = '💾 Salvar Ficha Técnica'; btn.style.background = 'linear-gradient(135deg,#1d4ed8,#1e40af)'; }
  const titulo = document.getElementById('fichaFormTitulo');
  if (titulo) titulo.textContent = '➕ Nova Ficha Técnica';
}

function editarFicha(codigo) {
  const todasFichas = getAllFichas();
  const f = todasFichas[codigo];
  if (!f) { toast('⚠️ Ficha não encontrada.', 'err'); return; }
  const fCod  = document.getElementById('fCod');
  const fNome = document.getElementById('fNome');
  if (!fCod || !fNome) { toast('⚠️ Role para cima até o formulário.', 'err'); return; }
  fCod.value = f.codigo;
  fNome.value = f.nome;
  fCod.readOnly = true;
  fCod.style.opacity = '.6';
  fCod.style.cursor = 'not-allowed';
  const cont = document.getElementById('fichaLinhas');
  if (cont) {
    cont.innerHTML = '';
    (f.insumos || []).forEach(it => {
      adicionarLinhaFicha();
      const linhas = cont.querySelectorAll('.ficha-linha');
      const ultima = linhas[linhas.length - 1];
      if (!ultima) return;
      const ins = ultima.querySelector('.fi-ins'); if (ins) ins.value = it.insumo || '';
      const qtd = ultima.querySelector('.fi-qtd'); if (qtd) qtd.value = it.qtd || it.qtd_kg || '';
      const und = ultima.querySelector('.fi-und'); if (und) und.value = it.unidade || 'KG';
    });
  }
  const titulo = document.getElementById('fichaFormTitulo');
  if (titulo) titulo.textContent = '✏️ Editando: ' + f.nome;
  const btn = document.getElementById('btnSalvarFicha');
  if (btn) { btn.textContent = '💾 Salvar edição de ' + f.nome; btn.style.background = 'linear-gradient(135deg,#E8580A,#c04a08)'; }
  fCod.scrollIntoView({ behavior: 'smooth', block: 'center' });
  toast('✏️ Editando: ' + f.nome, 'ok');
}

function submitNovaFicha() {
  const cod  = ((document.getElementById('fCod')  || {}).value || '').trim().toUpperCase();
  const nome = ((document.getElementById('fNome') || {}).value || '').trim().toUpperCase();
  if (!cod || !nome) { toast('⚠️ Preencha código e nome.', 'err'); return; }
  const linhas = [];
  document.querySelectorAll('.ficha-linha').forEach(row => {
    const ins = (row.querySelector('.fi-ins') || {}).value || '';
    const qtd = parseFloat((row.querySelector('.fi-qtd') || {}).value) || 0;
    const und = (row.querySelector('.fi-und') || {}).value || 'KG';
    if (ins && qtd > 0) {
      const qtd_kg = (und === 'GR' || und === 'ML') ? qtd / 1000 : qtd;
      linhas.push({ insumo: ins.trim().toUpperCase(), qtd, unidade: und, qtd_kg });
    }
  });
  if (linhas.length === 0) { toast('⚠️ Adicione pelo menos 1 insumo.', 'err'); return; }
  salvarFichaCustom({ codigo: cod, nome, insumos: linhas });
  resetFormFicha();
  renderFichas();
}

function renderFichas() {
  const todasFichas = getAllFichas();

      <div style="background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.25);border-radius:10px;padding:10px 13px;font-size:11px;color:#93c5fd;line-height:1.5">

      <!-- FORM NOVA/EDITAR FICHA -->
      <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <div id="fichaFormTitulo" style="font-size:13px;font-weight:700;color:var(--primary)">➕ Nova Ficha Técnica</div>
          <button onclick="resetFormFicha()" style="font-size:11px;color:var(--muted);background:none;border:none;cursor:pointer;text-decoration:underline">Limpar</button>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:8px">
          <div style="flex:1">
            <label style="font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;display:block;margin-bottom:4px">Código *</label>
            <input id="fCod" class="filtro-input" type="text" placeholder="ex: P201" style="width:100%"/>
          </div>
          <div style="flex:2">
            <label style="font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;display:block;margin-bottom:4px">Nome do Prato *</label>
            <input id="fNome" class="filtro-input" type="text" placeholder="ex: PEIXE COM PIRÃO" style="width:100%"/>
          </div>
        </div>
        <div style="font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:6px">Insumos *</div>
        <div id="fichaLinhas"></div>
        <button onclick="adicionarLinhaFicha()" style="width:100%;background:rgba(255,255,255,.06);border:1px dashed rgba(255,255,255,.2);border-radius:8px;padding:8px 0;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;margin-bottom:8px">

async function renderCarnesCtrl() {
  $('content').innerHTML = '<div class="empty"><div class="spin"></div></div>';

  if (!S.carnesSemana) S.carnesSemana = getMondayOfWeek();
  if (!S.carnesLoja) S.carnesLoja = S.lojaAtiva || (S.lojas[0]?.slug_pedido);

  const sem = formatarSemana(S.carnesSemana);
  const mondayHoje = getMondayOfWeek();
  const podeAvancar = S.carnesSemana < mondayHoje;
  const semIni = S.carnesSemana.toISOString().slice(0, 10);

  const lojaObj = lojasComTeste().find(l => l.slug_pedido === S.carnesLoja);

  let carnesData = null;
  try {
    // checklist_carnes.loja stores the display name (e.g. "Bangu", "São Gonçalo")
    // Try nome_display first, then loja field, then slug_pedido as last resort
    const candidatos = [lojaObj?.nome_display, lojaObj?.loja, S.carnesLoja].filter(Boolean);
    for (const candidato of candidatos) {
      const { data } = await db.from('checklist_carnes')
        .select('carnes,semana_fim')
        .eq('semana_inicio', semIni)
        .eq('loja', candidato)
        .maybeSingle();
      if (data?.carnes) { carnesData = data.carnes; break; }
    }
  } catch(e) {}

  const lojaTabsHtml = lojasComTeste().map(l =>
    `<button class="store-tab${S.carnesLoja === l.slug_pedido ? ' ativo' : ''}"
      onclick="S.carnesLoja='${l.slug_pedido}';renderCarnesCtrl()">${l.nome_display}</button>`
  ).join('');

  const semNavHtml = `
    <div class="semana-nav">
      <button class="semana-nav-arrow" onclick="_carnesNavSemana(-1)">‹</button>
      <div class="semana-info">
        <div class="semana-label">SEMANA ${sem.num} · ${sem.ano}</div>
        <div class="semana-periodo">${sem.periodo}</div>
        ${sem.ehAtual
          ? '<div class="semana-atual-badge">▶ SEMANA ATUAL</div>'
          : '<div class="semana-atual-badge" style="color:var(--muted)">semana passada</div>'}
      </div>
      <button class="semana-nav-arrow" onclick="_carnesNavSemana(1)" ${!podeAvancar ? 'disabled style="opacity:.3"' : ''}>›</button>
    </div>`;

  window._carnesRelatorio = function() {
    if (!carnesData) { toast('Sem dados para relatório.'); return; }
    const lojaDisplayNome = lojaObj?.nome_display || S.carnesLoja;
    let txt = `🥩 *GN — Controle de Carnes*\n🏪 ${lojaDisplayNome} · ${sem.periodo}\n\n`;
    CARNES_DEF_PED.forEach(carne => {
      const d = carnesData[carne.key] || {};
      let totIni = 0, totEnt = 0, totFim = 0;
      carne.rows.forEach(r => {
        const rd = d[r.key] || {};
        totIni += parseFloat(rd.inicial) || 0;
        totFim += parseFloat(rd.contagem_final) || 0;
      });
      const rawRow = carne.rows.find(r => r.key === 'in_natura' || r.key === 'cru') || carne.rows[0];
      const rawRd = d[rawRow.key] || {};
      totEnt = DIAS_SEM_PED.reduce((a, dia) => a + (parseFloat(rawRd['ent_' + dia]) || 0), 0);
      if (totIni === 0 && totEnt === 0 && totFim === 0) return;
      const venda = totIni + totEnt - totFim;
      txt += `${carne.icon} *${carne.label}*\n`;
      txt += `  Início: ${totIni.toFixed(1)} ${carne.unit}\n`;
      txt += `  + Compras: +${totEnt.toFixed(1)} ${carne.unit}\n`;
      txt += `  − Contagem: ${totFim.toFixed(1)} ${carne.unit}\n`;
      txt += `  = Venda estimada: ${venda.toFixed(1)} ${carne.unit}${venda < -0.05 ? ' ⚠️' : ''}\n\n`;
    });
    txt += `_Gerado em ${new Date().toLocaleString('pt-BR')}_`;
    if (navigator.share && navigator.canShare({ text: txt })) {
      navigator.share({ text: txt }).catch(() => window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank'));
    } else {
      window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank');
    }
  };

  const cardsHtml = _carnesCardsHtml(carnesData);
  const temDados = carnesData && cardsHtml.indexOf('empty') === -1;

  $('content').innerHTML = `
    <div class="sec-header">
      <div class="sec-titulo">Controle de Carnes</div>
      <button onclick="renderCarnesCtrl()" style="padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:none;color:var(--muted);font-size:11px;cursor:pointer">↻</button>
    </div>
    <div class="store-tabs" style="margin-bottom:12px">${lojaTabsHtml}</div>
    ${semNavHtml}
    ${carnesData
      ? cardsHtml
      : `<div class="empty" style="padding:30px 0"><div class="empty-icon">🥩</div><div class="empty-texto">Nenhum dado de carnes nesta semana.</div></div>`}
    ${carnesData ? `
    <button onclick="window._carnesRelatorio()" style="margin-top:12px;width:100%;background:rgba(37,211,102,.15);border:1px solid rgba(37,211,102,.4);border-radius:11px;padding:12px;color:#22c55e;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer">
      📲 Enviar Relatório por WhatsApp
    </button>` : ''}
  `;
}

window._carnesNavSemana = function(dir) {
  const d = new Date(S.carnesSemana);
  d.setDate(d.getDate() + dir * 7);
  if (d > getMondayOfWeek()) return;
  S.carnesSemana = d;
  renderCarnesCtrl();
};

function _carnesCardsHtml(carnes) {
  if (!carnes) return '';
  const cards = CARNES_DEF_PED.map(carne => {
    const d = carnes[carne.key] || {};
    let totIni = 0, totFim = 0;
    const iniParts = [], fimParts = [];
    carne.rows.forEach(r => {
      const rd = d[r.key] || {};
      const ini = parseFloat(rd.inicial) || 0, fim = parseFloat(rd.contagem_final) || 0;
      totIni += ini; totFim += fim;
      if (ini > 0) iniParts.push(r.label + ' ' + ini.toFixed(1));
      if (fim > 0) fimParts.push(r.label + ' ' + fim.toFixed(1));
    });
    const rawRow = carne.rows.find(r => r.key === 'in_natura' || r.key === 'cru') || carne.rows[0];
    const rawRd = d[rawRow.key] || {};
    const totEnt = DIAS_SEM_PED.reduce((a, dia) => a + (parseFloat(rawRd['ent_' + dia]) || 0), 0);
    if (totIni === 0 && totEnt === 0 && totFim === 0) return '';
    const venda = totIni + totEnt - totFim;
    const vCol = venda >= -0.05 ? '#6bcb77' : '#d05050';
    return `<div style="background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px;margin-bottom:10px">
      <div style="font-size:13px;font-weight:700;color:var(--primary);margin-bottom:10px">${carne.icon} ${carne.label}</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px">
        <div style="background:var(--card2);border-radius:8px;padding:8px;text-align:center">
          <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">Início</div>
          <div style="font-size:14px;font-weight:700;color:#6b9bcb;font-variant-numeric:tabular-nums">${totIni.toFixed(1)}</div>
          ${iniParts.length ? `<div style="font-size:8px;color:var(--muted);margin-top:2px">${iniParts.join(' · ')}</div>` : ''}
        </div>
        <div style="background:var(--card2);border-radius:8px;padding:8px;text-align:center">
          <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">+ Compras</div>
          <div style="font-size:14px;font-weight:700;color:#6bcb77;font-variant-numeric:tabular-nums">+${totEnt.toFixed(1)}</div>
          <div style="font-size:8px;color:var(--muted);margin-top:2px">${rawRow.label}</div>
        </div>
        <div style="background:var(--card2);border-radius:8px;padding:8px;text-align:center">
          <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px">− Contagem</div>
          <div style="font-size:14px;font-weight:700;color:#6b9bcb;font-variant-numeric:tabular-nums">${totFim.toFixed(1)}</div>
          ${fimParts.length ? `<div style="font-size:8px;color:var(--muted);margin-top:2px">${fimParts.join(' · ')}</div>` : ''}
        </div>
      </div>
      <div style="background:var(--card2);border-radius:8px;padding:10px;display:flex;justify-content:space-between;align-items:center">
        <div style="font-size:11px;font-weight:700;color:var(--muted)">= Venda estimada</div>
        <div style="font-size:17px;font-weight:700;color:${vCol};font-variant-numeric:tabular-nums">${Math.abs(venda).toFixed(1)} ${carne.unit}${venda < -0.05 ? ' ⚠️' : ''}</div>
      </div>
    </div>`;
  }).filter(Boolean);
  return cards.length
    ? cards.join('')
    : `<div class="empty" style="padding:30px 0"><div class="empty-icon">🥩</div><div class="empty-texto">Sem dados preenchidos para esta semana.</div></div>`;
}

function _triosCacheFor(artista) {
  if (!artista) return 0;
  const key = Object.keys(TRIOS_CACHES).find(k =>
    k.trim().toLowerCase() === artista.trim().toLowerCase()
  );
  return key ? TRIOS_CACHES[key] : 0;
}

function _triosMesLabel(ym) {
  if (!ym) return '';
  const [y, m] = ym.split('-').map(Number);
  const nomes = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  return nomes[m - 1] + ' ' + y;
}

function _triosNavMes(delta) {
  const [y, m] = S.triosMes.split('-').map(Number);
  let nm = m + delta, ny = y;
  if (nm > 12) { nm = 1; ny++; }
  if (nm < 1)  { nm = 12; ny--; }
  S.triosMes = ny + '-' + String(nm).padStart(2, '0');
  renderTrios();
}

async function renderTrios() {
  $('content').innerHTML = '<div class="empty"><div class="spin"></div></div>';

  // Mês padrão: mês atual
  if (!S.triosMes) {
    const hoje = new Date();
    S.triosMes = hoje.getFullYear() + '-' + String(hoje.getMonth() + 1).padStart(2, '0');
  }

  // Carregar dados do Supabase
  try {
    const { data, error } = await db.from('gn_trios_agenda')
      .select('*')
      .gte('data', S.triosMes + '-01')
      .lte('data', S.triosMes + '-31')
      .order('data', { ascending: true })
      .order('horario_inicio', { ascending: true });
    if (!error) S.triosData = data || [];
  } catch(e) {
    S.triosData = [];
  }

  const registros = S.triosLoja
    ? S.triosData.filter(r => r.loja === S.triosLoja)
    : S.triosData;

  // Agrupar por data + horário
  const grupos = {};
  registros.forEach(r => {
    const chave = r.data + '|' + (r.horario_inicio || '') + '|' + (r.horario_fim || '');
    if (!grupos[chave]) grupos[chave] = { data: r.data, hi: r.horario_inicio, hf: r.horario_fim, itens: [] };
    grupos[chave].itens.push(r);
  });

  const DIAS_PT = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const MESES_PT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

  function fmtData(d) {
    const dt = new Date(d + 'T12:00:00');
    const dia = DIAS_PT[dt.getDay()];
    return `${dia} ${dt.getDate()}/${String(dt.getMonth()+1).padStart(2,'0')}`;
  }

  function fmtR(v) {
    return 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  // Sessão atual (para confirmação)
  const sess = (() => { try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch(e) { return null; } })();
  const podeCadastrar = sess?.permissoes?.master || sess?.permissoes?.pedidos;
  const _lojaDisplay = (slug) => lojasComTeste().find(l => l.slug_pedido === slug)?.nome_display || slug;

  // Tabs de loja
  const lojaTabsHtml = `
    <button class="store-tab${!S.triosLoja ? ' ativo' : ''}" onclick="S.triosLoja=null;renderTrios()">Todas</button>
    ${lojasComTeste().map(l => `<button class="store-tab${S.triosLoja===l.slug_pedido?' ativo':''}" onclick="S.triosLoja='${l.slug_pedido}';renderTrios()">${l.nome_display}</button>`).join('')}`;

  // Resumo financeiro do mês — exclui a loja teste dos totais (a lista "Todas" continua
  // mostrando o lançamento de teste normalmente, só os somatórios ficam de fora).
  const triosDataReais = S.triosData.filter(r => r.loja !== LOJA_TESTE_PEDIDO.slug_pedido);
  const totalApresent = triosDataReais.length;
  const totalCache = triosDataReais.reduce((sum, r) => sum + (parseFloat(r.cache) || 0), 0);
  const totalConf = triosDataReais.filter(r => r.confirmado).length;

  const resumoHtml = `
    <div class="trio-resumo">
      <div class="trio-resumo-item">
        <span class="trio-resumo-label">APRESENTAÇÕES</span>
        <span class="trio-resumo-val" style="color:var(--text)">${totalApresent}</span>
      </div>
      <div class="trio-resumo-item">
        <span class="trio-resumo-label">TOTAL CACHÊ</span>
        <span class="trio-resumo-val" style="color:var(--gold)">${fmtR(totalCache)}</span>
      </div>
      <div class="trio-resumo-item">
        <span class="trio-resumo-label">CONFIRMADAS</span>
        <span class="trio-resumo-val" style="color:${totalConf===totalApresent&&totalApresent>0?'var(--ok)':'var(--muted)'}">${totalConf}/${totalApresent}</span>
      </div>
    </div>`;

  // Painel financeiro: couvert × cachê por loja (também de fora a loja teste)
  const lojaFinMap = {};
  triosDataReais.forEach(r => {
    const slug = r.loja;
    if (!lojaFinMap[slug]) lojaFinMap[slug] = { cache: 0, couver: 0, conf: 0 };
    lojaFinMap[slug].cache  += parseFloat(r.cache) || 0;
    lojaFinMap[slug].couver += parseFloat(r.couver_valor) || 0;
    if (r.presenca_confirmada) lojaFinMap[slug].conf++;
  });
  const lojaFinEntries = Object.entries(lojaFinMap);
  const temDadosCouvert = lojaFinEntries.some(([,v]) => v.couver > 0);
  const totalCouverGeral = lojaFinEntries.reduce((s,[,v])=>s+v.couver,0);
  const totalCacheGeral  = lojaFinEntries.reduce((s,[,v])=>s+v.cache,0);
  const totalResGeral    = totalCouverGeral - totalCacheGeral;
  const lojasNeg = lojaFinEntries.filter(([,v]) => v.couver > 0 && (v.couver - v.cache) < 0);

  // Saldo por semana (Seg–Dom, mesma referência usada em Pedidos) — acumulado no mês
  const semanaFinMap = {};
  triosDataReais.forEach(r => {
    const seg = getMondayOfWeek(new Date(r.data + 'T12:00:00'));
    const key = seg.toISOString().slice(0, 10);
    if (!semanaFinMap[key]) semanaFinMap[key] = { monday: seg, cache: 0, couver: 0 };
    semanaFinMap[key].cache  += parseFloat(r.cache) || 0;
    semanaFinMap[key].couver += parseFloat(r.couver_valor) || 0;
  });
  let _acumSemana = 0;
  const semanasResumo = Object.values(semanaFinMap).sort((a, b) => a.monday - b.monday).map(sem => {
    const res = sem.couver - sem.cache;
    _acumSemana += res;
    return { ...sem, res, acumulado: _acumSemana, semInfo: formatarSemana(sem.monday) };
  });

  const finPainelHtml = lojaFinEntries.length > 0 ? `
    <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px;margin-bottom:10px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">

function _triosRelatorioTexto() {
  const fmtR = v => 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const _lojaDisplay = (slug) => lojasComTeste().find(l => l.slug_pedido === slug)?.nome_display || slug;
  const triosDataReais = S.triosData.filter(r => r.loja !== LOJA_TESTE_PEDIDO.slug_pedido);

  const totalApresent = triosDataReais.length;
  const totalCache = triosDataReais.reduce((sum, r) => sum + (parseFloat(r.cache) || 0), 0);
  const totalConf = triosDataReais.filter(r => r.confirmado).length;

  const lojaFinMap = {};
  triosDataReais.forEach(r => {
    const slug = r.loja;
    if (!lojaFinMap[slug]) lojaFinMap[slug] = { cache: 0, couver: 0 };
    lojaFinMap[slug].cache  += parseFloat(r.cache) || 0;
    lojaFinMap[slug].couver += parseFloat(r.couver_valor) || 0;
  });
  const lojaFinEntries = Object.entries(lojaFinMap);
  const temDadosCouvert = lojaFinEntries.some(([,v]) => v.couver > 0);
  const totalCouverGeral = lojaFinEntries.reduce((s,[,v])=>s+v.couver,0);
  const totalCacheGeral  = lojaFinEntries.reduce((s,[,v])=>s+v.cache,0);
  const totalResGeral    = totalCouverGeral - totalCacheGeral;

  const semanaFinMap = {};
  triosDataReais.forEach(r => {
    const seg = getMondayOfWeek(new Date(r.data + 'T12:00:00'));
    const key = seg.toISOString().slice(0, 10);
    if (!semanaFinMap[key]) semanaFinMap[key] = { monday: seg, cache: 0, couver: 0 };
    semanaFinMap[key].cache  += parseFloat(r.cache) || 0;
    semanaFinMap[key].couver += parseFloat(r.couver_valor) || 0;
  });
  let acumulado = 0;
  const semanasResumo = Object.values(semanaFinMap).sort((a, b) => a.monday - b.monday).map(sem => {
    const res = sem.couver - sem.cache;
    acumulado += res;
    return { ...sem, res, acumulado, semInfo: formatarSemana(sem.monday) };
  });

  let txt = `🎵 *RELATÓRIO DE TRIOS — ${_triosMesLabel(S.triosMes)}*\n\n`;
  txt += `📊 RESUMO\n`;
  txt += `Apresentações: ${totalApresent}\n`;
  txt += `Total Cachê: ${fmtR(totalCache)}\n`;
  txt += `Confirmadas: ${totalConf}/${totalApresent}\n`;

  if (lojaFinEntries.length > 0) {
    txt += `\n💰 COUVERT × CACHÊ POR LOJA\n`;
    lojaFinEntries.forEach(([slug, v]) => {
      const res = v.couver - v.cache;
      const temCouver = v.couver > 0;
      txt += `${_lojaDisplay(slug)}: Couvert ${temCouver?fmtR(v.couver):'—'} | Cachê ${fmtR(v.cache)} | Saldo ${temCouver?(res>=0?'+':'')+fmtR(res):'—'}\n`;
    });
    if (temDadosCouvert) {
      txt += `TOTAL GERAL: Couvert ${fmtR(totalCouverGeral)} | Cachê ${fmtR(totalCacheGeral)} | Saldo ${totalResGeral>=0?'+':''}${fmtR(totalResGeral)}\n`;
    }
  }

  if (temDadosCouvert && semanasResumo.length > 0) {
    txt += `\n📅 SALDO POR SEMANA (acumulado no mês)\n`;
    semanasResumo.forEach(sem => {
      const temCouver = sem.couver > 0;
      txt += `Sem ${sem.semInfo.num} (${sem.semInfo.periodo}): Couvert ${temCouver?fmtR(sem.couver):'—'} | Cachê ${fmtR(sem.cache)} | Saldo ${temCouver?(sem.res>=0?'+':'')+fmtR(sem.res):'—'} | Acumulado ${sem.acumulado>=0?'+':''}${fmtR(sem.acumulado)}\n`;
    });
  }

  return txt.trim();
}

function _triosWpp() {
  const txt = _triosRelatorioTexto();
  window.open('https://wa.me/?text=' + encodeURIComponent(txt));
}

function _triosPDF() {
  const txt = _triosRelatorioTexto();
  gerarPDF(txt, `Relatório de Trios — ${_triosMesLabel(S.triosMes)}`);
}

async function _triosConfirmar(id, atualConf) {
  const sess = (() => { try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch(e) { return null; } })();
  const novoConf = !atualConf;
  try {
    const { error } = await db.from('gn_trios_agenda').update({
      confirmado: novoConf,
      confirmado_por: novoConf ? (sess?.nome || 'Gerente') : null,
      confirmado_em: novoConf ? new Date().toISOString() : null,
    }).eq('id', id);
    if (error) throw error;
    toast(novoConf ? '✓ Apresentação confirmada!' : 'Confirmação removida', novoConf ? 'ok' : '');
  } catch(e) {
    toast('Erro ao confirmar: ' + (e.message || e), 'err');
  }
  renderTrios();
}

        <label class="form-label">INÍCIO</label>
        <input type="time" id="trio-f-hi" class="form-input" value="${p.horario_inicio||'13:00'}">

      </select>
      <input type="text" id="trio-f-artista" class="form-input" placeholder="Nome do trio ou artista"
        style="margin-top:6px;display:${p.artista && !TRIOS_KNOWN.includes(p.artista) ? '' : 'none'}"
        value="${p.artista||''}" oninput="_triosAutoCache()">
    </div>

      <label class="form-label">CACHÊ (R$)</label>

    </div>
    <div class="modal-acoes">
      <button class="btn-sm btn-outline" onclick="fecharModal(event)">Cancelar</button>
      <button class="btn-sm btn-orange" onclick="_triosSalvarNovo()">Salvar</button>
    </div>`;
  $('modal-bg').classList.add('ativo');
}

function _triosArtistaSelChange() {
  const sel = document.getElementById('trio-f-artista-sel');
  const inp = document.getElementById('trio-f-artista');
  if (!sel || !inp) return;
  if (sel.value === '__outro__') {
    inp.style.display = '';
    inp.value = '';
    inp.focus();
  } else {
    inp.style.display = 'none';
    inp.value = sel.value;
    _triosAutoCache();
  }
}

function _triosAutoCache() {
  const artista = document.getElementById('trio-f-artista')?.value || '';
  const cache = _triosCacheFor(artista);
  const el = document.getElementById('trio-f-cache');
  if (el && cache > 0 && !el.value) el.value = cache;
}

async function _triosSalvarNovo(id) {
  const data = document.getElementById('trio-f-data')?.value;
  const hi   = document.getElementById('trio-f-hi')?.value;
  const hf   = document.getElementById('trio-f-hf')?.value;
  const loja = document.getElementById('trio-f-loja')?.value;
  const artista = document.getElementById('trio-f-artista')?.value?.trim();
  const cache = parseFloat(document.getElementById('trio-f-cache')?.value) || 0;
  if (!data || !loja || !artista) { toast('Preencha data, loja e artista.', 'err'); return; }
  const payload = { data, horario_inicio: hi||null, horario_fim: hf||null, loja, artista, cache };
  try {
    let err;
    if (id) {
      ({ error: err } = await db.from('gn_trios_agenda').update(payload).eq('id', id));
    } else {
      ({ error: err } = await db.from('gn_trios_agenda').insert(payload));
    }
    if (err) throw err;
    toast(id ? '✓ Apresentação atualizada!' : '✓ Apresentação cadastrada!', 'ok');
    fecharModal({ target: document.getElementById('modal-bg') });
    renderTrios();
  } catch(e) {
    toast('Erro: ' + (e.message || e), 'err');
  }
}

function _triosEditarModal(id) {
  const r = S.triosData.find(x => x.id === id);
  if (!r) return;
  _triosNovoModal(r);
  // Substituir ação do botão Salvar
  const btn = document.querySelector('#modal-box .btn-orange');
  if (btn) btn.onclick = () => _triosSalvarNovo(id);
  document.querySelector('#modal-box .modal-titulo').childNodes[0].textContent = 'Editar apresentação ';
}

function _triosImportarPreview() {
  const texto = document.getElementById('trio-imp-texto')?.value || '';
  const ano = parseInt(document.getElementById('trio-imp-ano')?.value) || new Date().getFullYear();
  const parsed = _triosParseAgenda(texto, ano);
  window._triosImportParsed = parsed;
  const btn = document.getElementById('trio-imp-btn');
  const prev = document.getElementById('trio-imp-preview');
  if (!parsed.length) {
    prev.style.display = '';
    prev.innerHTML = `<div style="color:var(--err);font-size:12px">Nenhuma apresentação identificada. Verifique o formato do texto.</div>`;
    if (btn) btn.disabled = true;
    return;
  }
  const linhas = parsed.map(r => {
    const lojaDisplay = S.lojas.find(l => l.slug_pedido === r.loja)?.nome_display || r.loja_raw;
    return `<div style="font-size:11px;padding:3px 0;border-bottom:1px solid var(--border)">
      <span style="color:var(--gold)">${r.data}</span>
      <span style="color:var(--muted);margin:0 4px">${r.horario_inicio}–${r.horario_fim}</span>
      <span style="color:var(--primary)">${lojaDisplay}</span>
      <span style="margin-left:6px">${r.artista}</span>
      ${r.cache ? `<span style="color:var(--gold);margin-left:4px">R$ ${r.cache}</span>` : ''}
    </div>`;
  }).join('');
  prev.style.display = '';
  prev.innerHTML = `
    <div style="font-size:11px;color:var(--ok);font-weight:700;margin-bottom:6px">${parsed.length} apresentações encontradas</div>
    <div style="max-height:150px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--rs);padding:8px">${linhas}</div>`;
  if (btn) btn.disabled = false;
}

async function _triosImportarConfirmar() {
  const parsed = window._triosImportParsed || [];
  if (!parsed.length) return;
  const btn = document.getElementById('trio-imp-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Importando...'; }
  try {
    const rows = parsed.map(r => ({
      data: r.data,
      horario_inicio: r.horario_inicio,
      horario_fim: r.horario_fim,
      loja: r.loja,
      artista: r.artista,
      cache: r.cache || 0,
      confirmado: false,
    }));
    const { error } = await db.from('gn_trios_agenda').insert(rows);
    if (error) throw error;
    toast(`✓ ${rows.length} apresentações importadas!`, 'ok');
    fecharModal({ target: document.getElementById('modal-bg') });
    renderTrios();
  } catch(e) {
    toast('Erro na importação: ' + (e.message || e), 'err');
    if (btn) { btn.disabled = false; btn.textContent = 'Importar'; }
  }
}

function _triosParseAgenda(texto, ano) {
  // Mapeamento de nomes de lojas do texto para slug_pedido
  const LOJA_MAP = [
    { re: /bang[uú]\s+shopping|bang[uú]/i, slug: 'bangu' },
    { re: /boulevard/i, slug: 'boulevard' },
    { re: /nova\s+am[eé]rica/i, slug: 'nova_america' },
    { re: /caxias/i, slug: 'caxias' },
    { re: /s[aã]o\s+gon[cç]alo/i, slug: 'sao_goncalo' },
    { re: /itaquera|metr[oô]\s+itaquera/i, slug: 'itaquera' },
    { re: /guarulhos/i, slug: 'guarulhos' },
    { re: /nova\s+igua[cç][uú]|nova\s+igua[cç]u/i, slug: 'nova_iguacu' },
    { re: /norte\s+shopping|norte/i, slug: 'norte' },
    { re: /campo\s+grande/i, slug: 'campo_grande' },
  ];

  function normalizeLoja(texto) {
    for (const m of LOJA_MAP) {
      if (m.re.test(texto)) {
        return S.lojas.find(l => l.slug_pedido === m.slug || l.nome_display?.toLowerCase().includes(m.slug.replace('_',' ')))?.slug_pedido || m.slug;
      }
    }
    // Fallback: buscar pelo nome display
    const match = S.lojas.find(l => l.nome_display && texto.toLowerCase().includes(l.nome_display.toLowerCase().split(' ')[0].toLowerCase()));
    return match?.slug_pedido || null;
  }

  const result = [];
  const linhas = texto.split('\n').map(l => l.trim()).filter(Boolean);

  let dataAtual = null;
  let horaIni = null;
  let horaFim = null;
  const MESES = {
    janeiro:1, fevereiro:2, março:3, marco:3, abril:4, maio:5, junho:6,
    julho:7, agosto:8, setembro:9, outubro:10, novembro:11, dezembro:12
  };

  for (const linha of linhas) {
    // Linha de data + horário: "Sábado dia 01/08 das 13 as 17 horas"
    const mData = linha.match(/(\d{1,2})\/(\d{1,2})\s+das?\s+(\d{1,2})\s*as?\s+(\d{1,2})/i);
    if (mData) {
      const dia = mData[1].padStart(2,'0');
      const mes = mData[2].padStart(2,'0');
      dataAtual = `${ano}-${mes}-${dia}`;
      horaIni = mData[3].padStart(2,'0') + ':00';
      horaFim = mData[4].padStart(2,'0') + ':00';
      continue;
    }
    // Linha de data alternativa: "Sexta feira dia 07/08 das 19 as 23 horas"
    const mData2 = linha.match(/dia\s+(\d{1,2})\/(\d{1,2})\s+das?\s+(\d{1,2})/i);
    if (mData2 && !mData) {
      const dia = mData2[1].padStart(2,'0');
      const mes = mData2[2].padStart(2,'0');
      dataAtual = `${ano}-${mes}-${dia}`;
      const horaMatch = linha.match(/das?\s+(\d{1,2})\s*as?\s+(\d{1,2})/i);
      if (horaMatch) { horaIni = horaMatch[1].padStart(2,'0')+':00'; horaFim = horaMatch[2].padStart(2,'0')+':00'; }
      continue;
    }

    if (!dataAtual) continue;

    // Linha de apresentação: "Shopping Boulevard - Trio Silvas do Forró"
    const mApres = linha.match(/^(.+?)\s*[-–—]\s*(.+)$/);
    if (mApres) {
      const lojaRaw = mApres[1].trim();
      const artista = mApres[2].trim();
      const loja = normalizeLoja(lojaRaw);
      if (loja && artista && artista.length > 2) {
        const cache = _triosCacheFor(artista);
        result.push({ data: dataAtual, horario_inicio: horaIni, horario_fim: horaFim, loja, loja_raw: lojaRaw, artista, cache });
      }
    }
  }
  return result;
}

async function init() {
  try {
    const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    if (s && Date.now() - s.ts < TTL && s.permissoes && (s.permissoes.pedidos || s.permissoes.master)) {
      await iniciarApp();
      return;
    }
  } catch(e) {}
  $('splash').style.display = 'none';
  $('login').classList.add('ativo');
}

window.addEventListener('offline', () => {
  const b = $('offline-banner'), t = $('offline-banner-txt');
  if (b) { b.style.display = ''; if (t) t.textContent = 'Sem conexão — alterações serão sincronizadas ao reconectar.'; }
});
window.addEventListener('online', () => {
  flushPendingItems(false);
});
// O evento 'online' do navegador nem sempre dispara de forma confiável em conexões
// instáveis (comum em Wi-Fi de loja) — sem isso, uma falha de sincronização podia
// deixar o banner "alterações offline" preso pra sempre, sem nova tentativa automática.
setInterval(() => { if (_ppCount() > 0) flushPendingItems(false); }, 25000);

init();
</script>
