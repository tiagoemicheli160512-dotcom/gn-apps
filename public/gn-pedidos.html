<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GN — Estoque e Pedidos</title>
<style>
:root {
  --bg: #F5F6F8;
  --card: #FFFFFF;
  --card2: #EEF1F4;
  --border: #E1E4E9;
  --primary: #E8580A;
  --primary-d: #C04A08;
  --gold: #F5D98A;
  --text: #1A1D23;
  --muted: #5B6472;
  --ok: #22C55E;
  --warn: #F59E0B;
  --err: #EF4444;
  --r: 10px;
  --rs: 6px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden}
.num{font-family:'Consolas','Courier New',monospace;color:var(--text)}

/* ── LOADING ── */
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:16px}
.spin{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── LOGIN ── */
#login{display:none;min-height:100vh;align-items:center;justify-content:center;flex-direction:column;padding:24px}
#login.ativo{display:flex}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:32px 28px;width:100%;max-width:360px}
.login-logo{font-size:13px;letter-spacing:3px;color:var(--text);font-weight:700;text-align:center;margin-bottom:6px}
.login-titulo{font-size:22px;font-weight:700;text-align:center;margin-bottom:4px}
.login-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:28px}
.login-card input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:var(--rs);padding:12px 14px;color:var(--text);font-size:16px;outline:none;margin-bottom:12px;letter-spacing:2px}
.login-card input:focus{border-color:var(--primary)}
.login-erro{color:var(--text);font-size:12px;margin-bottom:12px;text-align:center;display:none}
.login-erro.ativo{display:block}
.btn-primary{width:100%;background:var(--primary);color:#fff;border:none;border-radius:var(--rs);padding:14px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
.btn-primary:hover{background:var(--primary-d)}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}

/* ── APP SHELL ── */
#app{display:none;flex-direction:column;min-height:100vh;max-width:900px;margin:0 auto}
#app.ativo{display:flex}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;flex-direction:column;gap:8px;position:sticky;top:0;z-index:100}
.header-row{display:flex;align-items:center;justify-content:space-between}
.header-loja-ativa{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--primary);color:#fff;font-weight:800;font-size:13px;padding:7px 12px;border-radius:10px}
.header-loja-ativa .n{font-size:11px;font-weight:600;opacity:.9}
.header-logo{font-size:11px;letter-spacing:2px;color:var(--text);font-weight:700}
.header-titulo{font-size:15px;font-weight:600}
.header-data{font-size:11px;color:var(--muted)}
.btn-logout{background:none;border:1px solid var(--border);border-radius:var(--rs);padding:6px 10px;color:var(--muted);font-size:11px;cursor:pointer}
.btn-logout:hover{border-color:var(--primary);color:var(--primary)}

/* ── NAV BOTTOM ── */
/* Antes os 15 botões dividiam a largura da tela igualmente (flex:1) — espremidos,
   ícone e texto ficavam minúsculos/cortados. Agora a barra rola horizontalmente com
   largura fixa por botão (sempre legível), e uma linha divisória marca o início de
   cada grupo (mesmo agrupamento Compras/Logística/Gestão já usado na sidebar de
   desktop, ver .sidebar-section abaixo). */
.nav{position:fixed;bottom:0;left:0;right:0;background:#EEF1F4;border-top:1px solid rgba(232,88,10,.25);display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;z-index:100;max-width:900px;margin:0 auto}
.nav::-webkit-scrollbar{display:none}
.nav-btn{flex:0 0 64px;padding:9px 1px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:#3d3d52;position:relative;transition:color .12s;cursor:pointer;font-family:inherit}
.nav-btn.grp-log{border-left:1px solid rgba(0,0,0,.09)}
.nav-btn.grp-ges{border-left:1px solid rgba(0,0,0,.09)}
.nav-btn.ativo{color:#1A1D23}
.nav-btn.ativo .nav-icon{filter:drop-shadow(0 0 6px rgba(232,88,10,.5))}
.nav-btn.ativo::before{content:'';position:absolute;top:0;left:25%;right:25%;height:2px;background:#E8580A;border-radius:0 0 4px 4px}
.nav-icon{font-size:18px;line-height:1}
.nav-label{font-size:10px;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60px}

/* ── CONTENT ── */
.content{flex:1;padding:12px 12px 80px;overflow-y:auto}

/* ── TOAST ── */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#EEF1F4;border:1px solid var(--border);border-radius:var(--r);padding:10px 18px;font-size:13px;font-weight:500;z-index:500;opacity:0;transition:.3s;white-space:nowrap;pointer-events:none}
#toast.ativo{opacity:1}
#toast.ok{border-color:var(--ok);color:var(--ok)}
#toast.err{border-color:var(--err);color:var(--err)}

/* ── SECTION HEADER ── */
.sec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.sec-titulo{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;letter-spacing:.5px}
.badge-r{background:#F7EDE9;color:var(--text)}
.badge-c{background:#E9F7EF;color:var(--text)}
.badge-e{background:#F0E9F6;color:#1A1D23}

/* ── STORE TABS ── */
.store-tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.store-tabs::-webkit-scrollbar{display:none}
.store-tab{flex-shrink:0;padding:7px 13px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--muted);transition:.15s;white-space:nowrap}
.store-tab.ativo{background:var(--primary);border-color:var(--primary);color:#fff}
.store-tab .contagem{font-size:10px;margin-left:4px;opacity:.7}

/* Setas de navegação pros store-tabs — no celular já dá pra arrastar (touch), mas no
   computador (mouse, sem touch/trackpad de swipe) não tinha como rolar a lista de lojas
   sem essas setas. Escondidas em telas de toque pra não duplicar a interação. */
.store-tabs-wrap{display:flex;align-items:center;gap:4px}
.store-tabs-wrap .store-tabs{flex:1;min-width:0;padding-bottom:2px}
.store-tabs-arrow{flex-shrink:0;width:24px;height:24px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;padding:0}
.store-tabs-arrow:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
@media (pointer:coarse){.store-tabs-arrow{display:none}}

/* ── FILTROS ── */
.filtros{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filtro-input{flex:1;min-width:120px;background:var(--card2);border:1px solid var(--border);border-radius:var(--rs);padding:9px 12px;color:var(--text);font-size:13px;outline:none}
.filtro-input:focus{border-color:var(--primary)}
.filtro-select{background:var(--card2);border:1px solid var(--border);border-radius:var(--rs);padding:9px 12px;color:var(--text);font-size:13px;outline:none;cursor:pointer}

/* ── GRUPO ACCORDION ── */
.grupo-bloco{margin-bottom:8px;border-radius:var(--r);overflow:hidden;border:1px solid var(--border)}
.grupo-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--card);cursor:pointer;user-select:none}
.grupo-nome{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--text)}
.grupo-qtd{font-size:11px;color:var(--muted)}
.grupo-chevron{transition:.2s;color:var(--muted)}
.grupo-bloco.aberto .grupo-chevron{transform:rotate(180deg)}
.grupo-body{display:none;background:var(--card)}
.grupo-bloco.aberto .grupo-body{display:block}

/* ── FORNECEDOR HEADER ── */
.forn-header{padding:6px 14px;background:#EEF1F4;border-top:1px solid var(--border);font-size:10px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase}

/* ── PRODUTO CARD ── */
.prod-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--border);transition:.1s}
.prod-row:hover{background:rgba(232,88,10,.04)}
.prod-info{flex:1;min-width:0}
.prod-nome{font-size:13px;font-weight:500;line-height:1.3;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prod-und{font-size:10px;color:var(--muted);background:var(--card2);padding:2px 6px;border-radius:4px}
.prod-custo{font-size:11px}
.prod-est{font-size:12px;color:var(--muted);font-weight:500}
.prod-est .val{font-family:'Consolas',monospace;color:var(--text);font-size:13px;font-weight:800;background:rgba(245,158,11,.18);border:1px solid rgba(245,158,11,.4);border-radius:5px;padding:1px 7px}
.prod-prov{font-size:12px;color:var(--muted);font-weight:500}
.prod-prov .val{font-family:'Consolas',monospace;color:#1A1D23;font-size:13px;font-weight:700;background:rgba(167,139,250,.15);border:1px solid rgba(167,139,250,.4);border-radius:5px;padding:1px 7px}
.prod-vig{font-size:12px;color:var(--muted);font-weight:500}
.prod-vig .val{font-family:'Consolas',monospace;color:#1A1D23;font-size:13px;font-weight:800;background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.35);border-radius:5px;padding:1px 7px}

/* ── QTY CONTROL ── */
.qty-ctrl{display:flex;align-items:center;gap:0;flex-shrink:0}
.qty-btn{width:28px;height:32px;background:var(--card2);border:1px solid var(--border);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;line-height:1}
.qty-btn:first-child{border-radius:var(--rs) 0 0 var(--rs)}
.qty-btn:last-child{border-radius:0 var(--rs) var(--rs) 0}
.qty-btn:hover{background:var(--primary);border-color:var(--primary);color:#fff}
.qty-btn:active{transform:scale(.92)}
.qty-input{width:52px;height:32px;background:var(--card2);border:1px solid var(--border);border-left:none;border-right:none;color:var(--text);font-family:'Consolas','Courier New',monospace;font-size:14px;text-align:center;outline:none;padding:0 4px}
.qty-input:focus{background:#EBEEF2}
.diverg-btn{width:26px;height:26px;background:transparent;border:1.5px solid rgba(239,68,68,.35);border-radius:6px;color:rgba(239,68,68,.45);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s;margin-left:4px;line-height:1}
.diverg-btn:hover{border-color:#ef4444;color:#ef4444;background:rgba(239,68,68,.1)}
.diverg-btn.ativo{background:rgba(239,68,68,.18);border-color:#ef4444;color:#ef4444}
.urg-btn{width:26px;height:26px;background:transparent;border:1.5px solid rgba(245,158,11,.35);border-radius:6px;color:rgba(245,158,11,.5);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s;margin-left:4px;line-height:1}
.urg-btn:hover{border-color:#f59e0b;color:#f59e0b;background:rgba(245,158,11,.1)}
.urg-btn.ativo{background:rgba(180,83,9,.3);border-color:#b45309;color:#fbbf24}
.urg-btn.ativo.finalizada{background:rgba(34,197,94,.25);border-color:#22c55e;color:#4ade80}
.semana-btn{width:26px;height:26px;background:transparent;border:1.5px solid rgba(14,165,233,.35);border-radius:6px;color:rgba(14,165,233,.5);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s;margin-left:4px;line-height:1}
.semana-btn:hover{border-color:#0ea5e9;color:#0ea5e9;background:rgba(14,165,233,.1)}
.semana-btn.ativo{background:rgba(14,165,233,.2);border-color:#0ea5e9;color:#0ea5e9}
.guia-intro{background:var(--card2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:14px;font-size:13px;color:var(--muted);line-height:1.6}
.guia-legenda{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12px}
.guia-legenda span{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.guia-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0;display:inline-block}
.guia-acc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.guia-acc summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;color:var(--text)}
.guia-acc summary::-webkit-details-marker{display:none}
.guia-acc summary::after{content:'+';margin-left:auto;font-size:18px;color:var(--muted);flex-shrink:0}
.guia-acc[open] summary::after{content:'−'}
.guia-acc summary .guia-num{font-family:monospace;font-size:11px;color:var(--muted);font-weight:700}
.guia-acc-body{padding:0 16px 16px}
.guia-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.guia-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--border);color:var(--muted);background:var(--card2);display:inline-flex;align-items:center;gap:5px}
.guia-purpose{font-size:14px;color:var(--text);margin:0 0 14px;line-height:1.55}
.guia-sub{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.guia-steps{margin:0 0 14px;padding:0;list-style:none;counter-reset:gstep}
.guia-steps li{counter-increment:gstep;position:relative;padding:8px 0 8px 30px;font-size:13.5px;color:var(--text);border-top:1px solid var(--card2)}
.guia-steps li:first-child{border-top:none}
.guia-steps li::before{content:counter(gstep);position:absolute;left:0;top:8px;font-size:10.5px;font-weight:700;color:#fff;background:var(--primary);width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center}
.guia-ui{font-family:monospace;font-size:.88em;background:var(--card2);border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:var(--primary-d)}
.guia-plain{margin:0 0 14px;padding:0 0 0 18px}
.guia-plain li{margin-bottom:6px;font-size:13.5px;color:var(--text)}
.guia-fields{border:1px solid var(--border);border-radius:var(--rs);overflow:hidden;margin:0 0 14px}
.guia-field{display:grid;grid-template-columns:minmax(90px,1fr) 2fr;gap:10px;padding:8px 12px;background:var(--card2);border-top:1px solid var(--border)}
.guia-field:first-child{border-top:none}
.guia-field b{font-family:monospace;font-size:12px;color:var(--text)}
.guia-field span{font-size:12.5px;color:var(--muted)}
.guia-callout{display:flex;gap:9px;padding:11px 13px;border-radius:var(--rs);margin:0 0 14px;font-size:13px;line-height:1.5}
.guia-callout.warn{background:rgba(245,158,11,.12)}
.guia-callout.danger{background:rgba(239,68,68,.1)}
.guia-callout.tip{background:rgba(34,197,94,.1)}
.guia-callout.info{background:rgba(232,88,10,.08)}
@media (max-width:480px){.guia-field{grid-template-columns:1fr}}
.prod-row.diverg-ativo{border-left:3px solid #ef4444 !important;background:rgba(239,68,68,.04) !important}
.prod-row.ja-pedido{border-left:3px solid #22c55e;background:rgba(34,197,94,.15)}
.todos-loja-row.ja-pedido{border-left:3px solid #22c55e;background:rgba(34,197,94,.15);padding-left:5px}

/* ── PEDIDO SUMMARY BAR ── */
.pedido-bar{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pedido-info{display:flex;flex-direction:column;gap:2px}
.pedido-label{font-size:10px;color:var(--muted);letter-spacing:.5px}
.pedido-valor{font-size:14px;font-weight:600}
.pedido-acoes{display:flex;gap:8px;flex-wrap:wrap}
.btn-sm{padding:8px 14px;border-radius:var(--rs);font-size:12px;font-weight:600;cursor:pointer;border:none;transition:.15s;letter-spacing:.3px}
.btn-outline{background:none;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-success{background:#E9F7EF;border:1px solid var(--ok);color:var(--text)}
.btn-success:hover{background:var(--ok);color:#000}
.btn-danger{background:#F7EBE9;border:1px solid var(--err);color:var(--text)}
.btn-danger:hover{background:var(--err);color:#fff}
.btn-orange{background:var(--primary);color:#fff}
.btn-orange:hover{background:var(--primary-d)}
.btn-sm:active{transform:scale(.96)}
.btn-sm:disabled{opacity:.4;cursor:not-allowed}

/* ── LOJA TOTAL ── */
.loja-total{background:var(--card2);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-top:10px;display:flex;align-items:center;justify-content:space-between}
.loja-total-label{font-size:12px;color:var(--muted)}
.loja-total-val{font-size:18px;font-weight:700}

/* ── CATÁLOGO ── */
.cat-item{background:var(--card);border:1px solid var(--border);border-radius:var(--rs);padding:12px 14px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.cat-item-info{flex:1;min-width:0}
.cat-item-nome{font-size:13px;font-weight:500;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-item-meta{font-size:11px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.cat-item-meta span{background:var(--card2);padding:2px 6px;border-radius:4px}
.cat-item-custo{font-size:13px;font-weight:600;white-space:nowrap;flex-shrink:0}
.cat-item-acoes{display:flex;gap:6px;flex-shrink:0}
.icon-btn{width:30px;height:30px;border-radius:var(--rs);border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.icon-btn:hover{border-color:var(--primary);color:var(--primary)}
.icon-btn.del:hover{border-color:var(--err);color:var(--err)}
.toggle-ativo{width:36px;height:20px;border-radius:10px;cursor:pointer;border:none;transition:.2s;flex-shrink:0;position:relative}
.toggle-ativo::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s}
.toggle-ativo.on{background:var(--ok)}
.toggle-ativo.on::after{left:18px}
.toggle-ativo.off{background:var(--border)}
.inativo{opacity:.45}

/* ── FORNECEDORES ── */
.forn-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:8px}
.forn-item-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.forn-item-nome{font-size:14px;font-weight:600}
.dias-grid{display:flex;gap:6px;flex-wrap:wrap}
.dia-btn{width:36px;height:28px;border-radius:var(--rs);border:1px solid var(--border);background:var(--card2);color:var(--muted);font-size:10px;font-weight:700;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;letter-spacing:.3px}
.dia-btn.on{background:#E9F0F7;border-color:#4EA8DE;color:#1A1D23}
.forn-contato{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:var(--rs);padding:8px 10px;color:var(--text);font-size:12px;outline:none;margin-top:8px;resize:none}
.forn-contato:focus{border-color:var(--primary)}
.btn-salvar-forn{margin-top:8px;padding:6px 14px;font-size:11px;font-weight:600;background:var(--primary);color:#fff;border:none;border-radius:var(--rs);cursor:pointer;transition:.15s}
.btn-salvar-forn:hover{background:var(--primary-d)}
.btn-salvar-forn:active{transform:scale(.96)}

/* ── PROVISÕES ── */
.prov-item{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:6px}
.prov-item-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px}

@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-titulo{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}

.form-input,.form-select{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px;color:var(--text);font-size:13px;outline:none}

.empty-icon{font-size:36px;margin-bottom:10px}
.empty-texto{font-size:13px}

.chip-confirmado{background:#E9F7F2;color:var(--text)}

.confirm-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:12px}

.confirm-table tr:last-child td{border-bottom:none}
.confirm-table td.num{color:var(--text);font-family:'Consolas',monospace}

/* ── SEMANA NAV ── */

.semana-atual-badge{font-size:9px;color:var(--text);font-weight:700;letter-spacing:.5px;margin-top:2px}

.todos-loja-prov{font-size:12px;color:var(--muted);min-width:60px;font-weight:500}
.todos-loja-prov .v{font-family:'Consolas',monospace;color:#1A1D23;font-size:12px;font-weight:700;background:rgba(167,139,250,.15);border:1px solid rgba(167,139,250,.4);border-radius:4px;padding:1px 5px}
.todos-loja-vig{font-size:12px;color:var(--muted);min-width:60px;font-weight:500}

// Timeout global (30s) em toda chamada feita via `db` — sem isso, uma instabilidade de
// rede/gateway faz o fetch nunca resolver, travando "Verificando..."/"Salvando..." pra sempre.
function _dbFetchComTimeout(url, options = {}) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 30000);
  return fetch(url, { ...options, signal: options.signal || controller.signal }).finally(() => clearTimeout(timeoutId));
}
const db = supabase.createClient(SUPA_URL, SUPA_KEY, { global: { fetch: _dbFetchComTimeout } });

const GN_VAPID_PUBLIC = 'BJTEqdQLTZ1ix8DeXWwytbo1OjNfPc5Kt6RYgHq50dWq3T7514Pv3kb14Gce0MgcOx3ySRtddqtCC41TZyAsBVQ';

function _urlB64ToUint8Array(b64) {
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  const arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}

async function registrarPushSubscription() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    const existing = await reg.pushManager.getSubscription();
    const sub = existing || await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: _urlB64ToUint8Array(GN_VAPID_PUBLIC)
    });
    const sess = (() => { try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch(e) { return null; } })();
    await db.from('gn_push_subscriptions').upsert({
      endpoint: sub.endpoint,
      subscription: sub.toJSON(),
      loja: sess?.loja || 'GERAL',
      user_nome: sess?.nome || ''
    }, { onConflict: 'endpoint' });
    localStorage.setItem('gn_push_ativo', '1');
  } catch(_) {}
}

async function ativarNotifPedidos() {
  if (typeof Notification === 'undefined') { toast('⚠️ Notificações não suportadas', 'err'); return; }
  if (Notification.permission === 'denied') {
    toast('🔕 Bloqueado. Vá em Ajustes → Notificações e habilite para este site.', 'err'); return;
  }
  try {
    const p = await Notification.requestPermission();
    if (p !== 'granted') { toast('⚠️ Permissão negada', 'err'); return; }
    await registrarPushSubscription();
    _atualizarBtnNotif();
    toast('🔔 Notificações de pedidos ativadas!', 'ok');
  } catch(_) {
    toast('⚠️ Para receber alertas, adicione o app à tela inicial: Compartilhar → Adicionar à Tela de Início', 'err');
  }
}

function _atualizarBtnNotif() {
  const btn = document.getElementById('btn-notif-ped');
  if (!btn) return;
  const ativo = typeof Notification !== 'undefined' && Notification.permission === 'granted';
  if (ativo) {
    btn.textContent = '🔔';
    btn.style.color = '#22C55E';
    btn.style.borderColor = 'rgba(34,197,94,.4)';
    btn.title = 'Notificações ativas';
    btn.onclick = () => toast('🔔 Notificações ativas — alertas de pedidos e entregas serão enviados.', 'ok');
  } else {
    btn.textContent = '🔕';
    btn.style.color = Notification.permission === 'denied' ? '#f87171' : 'rgba(0,0,0,.35)';
    btn.style.borderColor = Notification.permission === 'denied' ? 'rgba(248,113,113,.3)' : 'rgba(0,0,0,.15)';
    btn.title = Notification.permission === 'denied' ? 'Bloqueado — toque para ver como ativar' : 'Ativar alertas de pedidos';
    btn.onclick = ativarNotifPedidos;
  }
}

// (ex.: "4CX+0UN" pra um item de KG). Só mostra a quebra em duas partes quando o produto
// realmente é vendido em caixa (CX ou BB); senão soma tudo num único valor com a unidade certa.
function _fmtEstVigBreakdown(cx, und, prodUnd) {
  const c = cx || 0, u = und || 0;
  if (prodUnd === 'CX' || prodUnd === 'BB') {
    return ` <span style="font-weight:400;opacity:.85">(${fmtQtd(c)}${prodUnd}+${fmtQtd(u)}UN)</span>`;
  }
  return ` <span style="font-weight:400;opacity:.85">(${fmtQtd(c + u)}${prodUnd || 'UN'})</span>`;
}

// ═══════════════════════════════════════════════
// SEMANA — FUNÇÕES
// ═══════════════════════════════════════════════
function getMondayOfWeek(date = new Date()) {
  const d = new Date(date);
  d.setHours(0, 0, 0, 0);
  const dow = d.getDay(); // 0=Dom, 1=Seg...6=Sáb
  const diff = (dow === 0) ? -6 : 1 - dow;
  d.setDate(d.getDate() + diff);
  return d;
}

function getSundayOfWeek(monday) {
  const sun = new Date(monday);
  sun.setDate(monday.getDate() + 6);
  return sun;
}

function getNumeroSemana(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dow = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dow);
  const anoInicio = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil(((d - anoInicio) / 86400000 + 1) / 7);
}

function formatarSemana(monday) {
  const sunday = getSundayOfWeek(monday);
  const fmtD  = d => d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
  const fmtDL = d => d.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit' });
  const num   = getNumeroSemana(monday);
  const ehAtual = monday.toDateString() === getMondayOfWeek().toDateString();
  return {
    num,
    periodo: `${fmtD(monday)} – ${fmtD(sunday)}`,
    inicioLabel: fmtDL(monday),
    fimLabel: fmtDL(sunday),
    ehAtual,
    ano: monday.getFullYear(),
    isoStr: monday.toISOString().split('T')[0],
  };
}

function datePlusWeeks(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n * 7);
  return d;
}

async function navegarSemana(delta) {
  const nova = datePlusWeeks(S.semanaAtiva, delta);
  const mondayHoje = getMondayOfWeek();
  if (nova > mondayHoje) return; // não avança além da semana atual
  S.semanaAtiva = nova;
  // Est.ant/Est.vig se recalculam sozinhos em renderPedido() com base na data real da
  // última contagem (_estAntVigEfetivo) — não precisa mais zerar nada aqui na mão.
  $('content').innerHTML = '<div style="padding:20px;text-align:center"><div class="spin" style="margin:0 auto"></div></div>';
  await carregarPedidoAtual();
  renderPedido();
}

// ═══════════════════════════════════════════════
// SUPABASE — DATA LOADING
// ═══════════════════════════════════════════════
// Busca TODAS as linhas de uma query, paginando em blocos de 1000 via .range().
// O Supabase tem um teto de linhas por resposta configurado no servidor (~1000)
// que um simples .limit(N maior) do lado do cliente NÃO consegue ultrapassar — só
// pedir um limite maior continua vindo cortado em 1000, sem erro nenhum. Isso já
// escondeu itens/contagens reais de várias lojas (pedido da semana passa de 1200
// linhas, contagens já passam de 3500). queryFn deve retornar uma query do Supabase
// ainda SEM .range() encadeado (ele é aplicado aqui, em cada página).
async function _fetchTodasPaginas(queryFn, paginaSize) {
  paginaSize = paginaSize || 1000;
  let offset = 0;
  let todas = [];
  while (true) {
    const { data, error } = await queryFn().range(offset, offset + paginaSize - 1);
    if (error) { console.error('Erro paginando:', error.message); break; }
    if (!data || data.length === 0) break;
    todas = todas.concat(data);
    if (data.length < paginaSize) break;
    offset += paginaSize;
  }
  return todas;
}

async function confirmarDevolucaoPedidos(lojaKey, devId) {
  try {
    const { data } = await db.from('gn_lojas').select('loja,all_data').eq('loja', lojaKey).single();
    if (!data) { toast('Loja não encontrada.', 'err'); return; }
    const allData = data.all_data || {};
    const devs = (allData.devolucoesAll || {})[lojaKey] || [];
    const dev = devs.find(d => d.id === devId);
    if (!dev) { toast('Devolução não encontrada.', 'err'); return; }
    if (dev.status !== 'loja_confirmou') { toast('Aguardando confirmação da loja primeiro.', 'err'); return; }
    const sess = JSON.parse(localStorage.getItem('gn_session_v1') || 'null');
    const user = (sess && sess.nome) || 'pedidos';
    dev.status = 'finalizado';
    dev.pedidos_conf_por = user;
    dev.pedidos_conf_ts = new Date().toISOString();
    allData.devolucoesAll = allData.devolucoesAll || {};
    allData.devolucoesAll[lojaKey] = devs;
    const { error } = await db.from('gn_lojas').update({ all_data: allData, updated_at: new Date().toISOString(), updated_by: 'pedidos' }).eq('loja', lojaKey);
    if (error) throw error;
    toast('✅ Devolução finalizada!', 'ok');
    await carregarDevolucoesLojas();
    renderProvisoes();
  } catch(e) { toast('Erro: ' + (e.message || e), 'err'); }
}

// Prov.ant: o que o setor de Compras efetivamente provisionou pra cada loja na semana
// anterior (gn_provisoes.qtd_prevista), independente de a loja já ter dado entrada da
// nota — ao contrário do Ped.ant (ul_pedido), que só reflete entradas de NF já lançadas.
// Exclui só CANCELADO (provisão desfeita, nunca chegou a ser enviada de fato); AGUARDANDO,
// RECEBIDO_OK, DIVERGENCIA e DEVOLVIDO contam, porque o pedido foi de fato feito ao
// fornecedor pra aquela loja, independente do desfecho na ponta.
async function carregarProvisaoAnterior() {
  const semAnt = new Date(S.semanaAtiva);
  semAnt.setDate(semAnt.getDate() - 7);
  const monday = semAnt.toISOString().split('T')[0];
  const sunday = getSundayOfWeek(semAnt).toISOString().split('T')[0];
  const data = await _fetchTodasPaginas(() => db.from('gn_provisoes')
    .select('catalogo_id,loja_slug,qtd_prevista,status')
    .gte('data_entrega', monday).lte('data_entrega', sunday)
    .neq('status', 'CANCELADO')
    .order('id'));
  S.provisaoAnterior = {};
  (data || []).forEach(p => {
    if (!S.provisaoAnterior[p.catalogo_id]) S.provisaoAnterior[p.catalogo_id] = {};
    const atual = S.provisaoAnterior[p.catalogo_id][p.loja_slug] || 0;
    S.provisaoAnterior[p.catalogo_id][p.loja_slug] = atual + (parseFloat(p.qtd_prevista) || 0);
  });
}

async function carregarPedidoAtual() {
  if (!S.semanaAtiva) S.semanaAtiva = getMondayOfWeek();

  const semIsoStr  = S.semanaAtiva.toISOString().split('T')[0];
  const mondayHoje = getMondayOfWeek();
  const ehSemAtual = S.semanaAtiva.toDateString() === mondayHoje.toDateString();
  await carregarProvisaoAnterior();

  // Busca pedido da semana — prioriza CONFIRMADO/ENVIADO sobre RASCUNHO, ignora CANCELADO
  const { data } = await db.from('gn_pedidos')
    .select('*')
    .eq('semana_inicio', semIsoStr)
    .eq('regiao', 'RJ')
    .in('status', ['CONFIRMADO', 'ENVIADO', 'RASCUNHO'])
    .order('status', { ascending: true })
    .order('criado_em', { ascending: false })
    .limit(1);

  if (data && data.length > 0) {
    S.pedidoAtual = data[0];
  } else if (ehSemAtual) {
    // Semana atual sem pedido → cria rascunho
    const { data: novo } = await db.from('gn_pedidos')
      .insert([{ data_pedido: hoje(), semana_inicio: semIsoStr, status: 'RASCUNHO', regiao: 'RJ' }])
      .select().single();
    // Corrida: se duas sessões abrirem o app quase juntas sem nenhum pedido ainda criado
    // pra semana, as duas veem "nenhum pedido" e cada uma insere o seu — itens lançados
    // pelas lojas ficariam divididos entre dois pedido_id (um deles nunca confirmado/
    // entregue, igual ao caso das "provisões órfãs" já visto nesta base). Reconfere logo
    // após o insert e, se achar mais de um, todo mundo converge pro mais antigo.
    const { data: concorrentes } = await db.from('gn_pedidos')
      .select('*')
      .eq('semana_inicio', semIsoStr).eq('regiao', 'RJ')
      .in('status', ['CONFIRMADO', 'ENVIADO', 'RASCUNHO'])
      .order('criado_em', { ascending: true });
    if (concorrentes && concorrentes.length > 1) {
      S.pedidoAtual = concorrentes[0];
      if (S.pedidoAtual.id !== novo?.id && novo?.id) {
        await db.from('gn_pedidos').delete().eq('id', novo.id);
      }
    } else {
      S.pedidoAtual = novo;
    }
  } else {
    // Semana passada sem pedido
    S.pedidoAtual = null;
    S.pedidoItens = {};
    S.ultimoPedido = {};
    S.pedidosConfirmados = {};
    calcularTotais();
    return;
  }

  await carregarItensPedido();
  await carregarUltimoPedido();
  await carregarConfirmadosSemana();
  await carregarFornecedoresConfirmados();
  await carregarEstadoAuditoriaFornecedores();
}

// Reconstrói, a partir do log de auditoria, dois estados que hoje só existiam em memória
// (zeravam ao recarregar a página ou noutra sessão/aparelho, travando os itens de novo
// como se nada tivesse acontecido — mesma confusão real já vista com o PETISCOS):
// - S.fornecedoresRevertidos: última ação foi "↩️ Reverter Confirmação" — sobrou pendência
//   sem aviso nenhum na tela.
// - S.fornecedoresReabertos: última ação foi "🔓 Abrir 2ª rodada" — itens destravados pra
//   um pedido novo do mesmo fornecedor na semana, sem sobrescrever o que já foi confirmado.
// CONFIRMAR_FORNECEDOR sempre "reconfirma" e limpa os dois pra aquele fornecedor.
async function carregarEstadoAuditoriaFornecedores() {
  S.fornecedoresRevertidos = {};
  S.fornecedoresReabertos = new Set();
  if (!S.pedidoAtual?.id) return;
  const data = await _fetchTodasPaginas(() => db.from('gn_auditoria_pedidos')
    .select('acao,fornecedor,detalhes,usuario,criado_em')
    .eq('pedido_id', S.pedidoAtual.id)
    .in('acao', ['CONFIRMAR_FORNECEDOR', 'REVERTER_CONFIRMACAO', 'ABRIR_2A_RODADA'])
    .order('criado_em', { ascending: true }));
  (data || []).forEach(row => {
    if (row.acao === 'REVERTER_CONFIRMACAO') {
      const forn = row.fornecedor || row.detalhes?.fornecedor;
      if (forn) { S.fornecedoresRevertidos[forn] = row; S.fornecedoresReabertos.delete(forn); }
    } else if (row.acao === 'ABRIR_2A_RODADA') {
      const forn = row.fornecedor || row.detalhes?.fornecedor;
      if (forn) { S.fornecedoresReabertos.add(forn); delete S.fornecedoresRevertidos[forn]; }
    } else {
      (row.detalhes?.fornecedores || []).forEach(f => { delete S.fornecedoresRevertidos[f]; S.fornecedoresReabertos.delete(f); });
    }
  });
}

async function carregarItensPedido() {
  if (!S.pedidoAtual) return;
  // O pedido da semana já passa de 1200 itens (catálogo × lojas) — o servidor corta
  // em ~1000 linhas por página não importa o .limit() pedido pelo cliente, então
  // isso precisa paginar de verdade (ver _fetchTodasPaginas) pra não sumir com
  // quantidades reais de várias lojas mesmo já gravadas no banco.
  const data = await _fetchTodasPaginas(() => db.from('gn_pedido_itens')
    .select('*, gn_catalogo(id,produto,grupo,fornecedor,und,custo)')
    .eq('pedido_id', S.pedidoAtual.id)
    .order('id'));

  S.pedidoItens = {};
  S.pedidosConfirmados = {};
  (data || []).forEach(item => {
    const cid = item.catalogo_id;
    if (!S.pedidoItens[cid]) S.pedidoItens[cid] = {};
    S.pedidoItens[cid][item.loja_slug] = {
      id: item.id, qtd: parseFloat(item.qtd_pedida) || 0, custo: item.custo_unitario, diverg: item.divergencia || false,
      // Quebra real em Cx/Und (quando veio do app Lojas ou foi digitada aqui mesmo nos
      // campos separados) — null quando só existe o total, aí o Pedido decompõe na hora.
      qtdCx: item.qtd_cx != null ? parseFloat(item.qtd_cx) : null,
      qtdUnd: item.qtd_und != null ? parseFloat(item.qtd_und) : null,
      // Força a entrega pra hoje na hora de confirmar, sem marcar ⚡ urgência (que também
      // avisa a loja) — ver toggleEntregaSemana() e o cálculo de data em
      // _confirmarFornecedoresSelecionados().
      entregaSemana: item.entrega_semana || false
    };
  });
  calcularTotais();
}

async function carregarUltimoPedido() {
  // Busca pedido da semana ANTERIOR para referência (coluna "Últ.")
  const semanaAnteriorDate = datePlusWeeks(S.semanaAtiva, -1);
  const semAntIso = semanaAnteriorDate.toISOString().split('T')[0];

  const { data: ultPed } = await db.from('gn_pedidos')
    .select('id')
    .eq('semana_inicio', semAntIso)
    .eq('regiao', 'RJ')
    .in('status', ['CONFIRMADO', 'RASCUNHO'])
    .order('criado_em', { ascending: false })
    .limit(1);

  if (!ultPed || ultPed.length === 0) {
    // Tenta qualquer confirmado anterior à semana atual
    const { data: qq } = await db.from('gn_pedidos')
      .select('id').eq('status','CONFIRMADO')
      .lt('semana_inicio', S.semanaAtiva.toISOString().split('T')[0])
      .order('semana_inicio', { ascending: false }).limit(1);
    if (!qq || qq.length === 0) { S.ultimoPedido = {}; return; }
    const itens = await _fetchTodasPaginas(() => db.from('gn_pedido_itens')
      .select('catalogo_id,loja_slug,qtd_pedida').eq('pedido_id', qq[0].id).order('id'));
    S.ultimoPedido = {};
    (itens || []).forEach(i => {
      if (!S.ultimoPedido[i.catalogo_id]) S.ultimoPedido[i.catalogo_id] = {};
      S.ultimoPedido[i.catalogo_id][i.loja_slug] = parseFloat(i.qtd_pedida) || 0;
    });
    return;
  }

  const data = await _fetchTodasPaginas(() => db.from('gn_pedido_itens')
    .select('catalogo_id,loja_slug,qtd_pedida').eq('pedido_id', ultPed[0].id).order('id'));

  S.ultimoPedido = {};
  (data || []).forEach(item => {
    if (!S.ultimoPedido[item.catalogo_id]) S.ultimoPedido[item.catalogo_id] = {};
    S.ultimoPedido[item.catalogo_id][item.loja_slug] = parseFloat(item.qtd_pedida) || 0;
  });
}

async function carregarConfirmadosSemana() {
  S.pedidosConfirmados = {};
  if (!S.semanaAtiva) return;
  const semIsoStr = S.semanaAtiva.toISOString().split('T')[0];
  try {
    const { data: peds } = await db.from('gn_pedidos')
      .select('id')
      .eq('semana_inicio', semIsoStr)
      .eq('regiao', 'RJ')
      .in('status', ['CONFIRMADO', 'ENVIADO']);
    if (!peds || peds.length === 0) return;

    const ids = peds.map(p => p.id);

    const itens = await _fetchTodasPaginas(() => db.from('gn_pedido_itens')
      .select('catalogo_id,loja_slug,qtd_pedida')
      .in('pedido_id', ids)
      .order('id'));

    (itens || []).forEach(i => {
      if (!S.pedidosConfirmados[i.catalogo_id]) S.pedidosConfirmados[i.catalogo_id] = {};
      const qtdAtual = S.pedidosConfirmados[i.catalogo_id][i.loja_slug] || 0;
      S.pedidosConfirmados[i.catalogo_id][i.loja_slug] = qtdAtual + (parseFloat(i.qtd_pedida) || 0);
    });
  } catch(_) {}
}

async function carregarContagens() {
  // Última contagem por produto por loja. A tabela já passa de 3500 linhas e cresce
  // todo dia — mesmo com paginação, sem limitar por data isso ficaria lento à toa.
  // Uma janela de 45 dias cobre folgado o "Est.ant" mais antigo que a tela realmente usa.
  // .order('id') no final garante ordenação totalmente determinística entre páginas
  // (sem isso, paginar com .range() não tem garantia de não pular ou repetir linha
  // quando há empate no data_contagem, que é o normal aqui).
  const cutoffISO = new Date(Date.now() - 45 * 86400000).toISOString().slice(0, 10);
  const data = await _fetchTodasPaginas(() => db.from('gn_contagens_pedido')
    .select('catalogo_id,loja_slug,ul_estoque,ul_pedido,atual,atual_cx,atual_und,data_contagem,criado_por,criado_em')
    .gte('data_contagem', cutoffISO)
    .order('data_contagem', {ascending:false})
    .order('id'));

  S.contagens = {};
  (data || []).forEach(c => {
    if (!S.contagens[c.catalogo_id]) S.contagens[c.catalogo_id] = {};
    if (!S.contagens[c.catalogo_id][c.loja_slug]) {
      // só pega a mais recente (já ordenado DESC)
      S.contagens[c.catalogo_id][c.loja_slug] = {
        atual: c.atual, ul_estoque: c.ul_estoque, ul_pedido: c.ul_pedido,
        atualCx: c.atual_cx, atualUnd: c.atual_und,
        data_contagem: c.data_contagem, criado_por: c.criado_por, criado_em: c.criado_em
      };
    }
  });
}

// Texto "Contado por Fulano em DD/MM HH:MM" (ou só a data, se não houver hora) pra
// garantir que o Est.vig exibido foi realmente contado — e não um saldo carregado de
// outra semana. Usado como observação junto ao Est.vig no Pedido.
function _contagemInfoTxt(c) {
  if (!c || c.atual == null) return null;
  const quem = c.criado_por || null;
  let quando = null;
  if (c.criado_em) {
    const dt = new Date(c.criado_em);
    quando = dt.toLocaleDateString('pt-BR') + ' ' + dt.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
  } else if (c.data_contagem) {
    quando = c.data_contagem.split('-').reverse().join('/');
  }
  if (!quem && !quando) return null;
  return `Contado${quem?' por '+quem:''}${quando?' em '+quando:''}`;
}

// True quando a contagem foi feita dentro da semana ativa (monISO/sunISO, formato
// 'YYYY-MM-DD') — usado pra destacar em verde que o Est.vig é fresco (contado essa
// semana), não um saldo velho carregado de outra semana.
function _contagemNaSemana(c, monISO, sunISO) {
  if (!c || c.atual == null) return false;
  const dataISO = c.data_contagem || (c.criado_em ? String(c.criado_em).slice(0,10) : null);
  if (!dataISO) return false;
  return dataISO >= monISO && dataISO <= sunISO;
}

// Est.ant/Est.vig "efetivos" pra exibição: a última contagem salva (S.contagens) é
// sempre a mais recente já feita, não importa a semana. Ao virar a semana sem a loja
// ainda ter recontado, ela continua sendo a mais recente — mas mostrá-la como "Est.vig"
// (estoque vigente) confunde, porque na verdade é o estoque ANTIGO (da semana passada)
// esperando a nova contagem. Se não é fresca (não é dessa semana), ela vira o Est.ant
// exibido e o Est.vig some até a loja contar de novo.
function _estAntVigEfetivo(contagem, monISO, sunISO) {
  if (!contagem) return { estAnt: null, estVig: null, estVigCx: null, estVigUnd: null, fresh: false };
  const fresh = _contagemNaSemana(contagem, monISO, sunISO);
  return fresh
    ? { estAnt: contagem.ul_estoque, estVig: contagem.atual, estVigCx: contagem.atualCx, estVigUnd: contagem.atualUnd, fresh: true }
    : { estAnt: contagem.atual, estVig: null, estVigCx: null, estVigUnd: null, fresh: false };
}

function mostrarInfoContagem(catalogoId, lojaSlug) {
  const c = S.contagens[catalogoId]?.[lojaSlug];
  const txt = _contagemInfoTxt(c);
  if (txt) toast('📋 ' + txt);
  else toast('Sem registro de quem/quando contou.', 'err');
}

// Formata uma data ISO (YYYY-MM-DD) como DD/MM.
function _fmtDDMM(iso) {
  const p = iso.split('-');
  return p[2] + '/' + p[1];
}

// Início/fim (ISO) da semana ativa do Pedido — mesma lógica usada em renderPedido().
function _semanaAtivaBounds() {
  if (!S.semanaAtiva) S.semanaAtiva = getMondayOfWeek();
  return {
    monISO: S.semanaAtiva.toISOString().slice(0,10),
    sunISO: getSundayOfWeek(S.semanaAtiva).toISOString().slice(0,10)
  };
}

// Prefixo que marca uma contagem como corrigida manualmente pelo setor de Compras (em
// vez de uma contagem física feita pela loja) — usado tanto pra colorir/rotular aqui
// quanto pra a loja identificar essas correções no app Lojas (carregarCorrecoesSetor).
const CORRECAO_SETOR_PREFIX = '🏢 Compras: ';

// Corrige o Est.vig (estoque vigente) direto pelo app Pedidos, sem precisar que a loja
// reconte. Grava em gn_contagens_pedido marcado com CORRECAO_SETOR_PREFIX, pra a loja
// ver no app Lojas que aquele valor foi ajustado pelo setor.
// Corrigir Est.vig — mesma quebra Cx/Avulso(UN) do app Estoque e Pedido (aba Pedido):
// produto cujo "und" no catálogo é CX ou BB entra em duas caixas (a loja conta em caixas
// fechadas + avulso), os demais entram como um total único. Sem essa quebra, uma correção
// feita aqui apagava o atual_cx/atual_und que a loja tinha lançado, e o Est.vig passava a
// mostrar só o total, sem o "(1CX+7UN)" ao lado.
function corrigirEstVig(catalogoId, lojaSlug, nomeProduto) {
  const prod = S.catalogo.find(p => p.id === catalogoId);
  const contagemAtual = S.contagens[catalogoId]?.[lojaSlug];
  const isCaixa = prod && (prod.und === 'CX' || prod.und === 'BB');
  const fator = prod && prod.und_por_caixa > 1 ? prod.und_por_caixa : null;

  let corpoHtml;
  if (isCaixa) {
    let sugCx = contagemAtual?.atualCx, sugUnd = contagemAtual?.atualUnd;
    if (sugCx == null && sugUnd == null && contagemAtual?.atual != null && fator) {
      // Sem quebra salva ainda — decompõe o total pelo fator só como ponto de partida.
      sugCx = Math.floor(contagemAtual.atual / fator);
      sugUnd = contagemAtual.atual - sugCx * fator;
    }
    corpoHtml = `
      <div class="modal-titulo">✏️ Corrigir Est.vig
        <button class="modal-close" onclick="$('modal-bg').classList.remove('ativo')">×</button>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:12px">${esc(nomeProduto)}</div>
      <div style="display:flex;gap:8px">
        <div style="flex:1">
          <label style="font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase">Est. Atual (${prod.und})</label>
          <input id="corrigir-ev-cx" type="text" inputmode="decimal" class="form-input" value="${sugCx ?? ''}" placeholder="0">
        </div>
        <div style="flex:1">
          <label style="font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase">+ Avulso (UN)</label>
          <input id="corrigir-ev-und" type="text" inputmode="decimal" class="form-input" value="${sugUnd ?? ''}" placeholder="0">
        </div>
      </div>
      <div class="modal-acoes">
        <button class="btn-sm btn-outline" onclick="$('modal-bg').classList.remove('ativo')">Cancelar</button>
        <button class="btn-sm btn-success" onclick="_salvarCorrecaoEstVig('${catalogoId}','${lojaSlug}',${fator||'null'})">✓ Salvar</button>
      </div>`;
  } else {
    const sugestao = contagemAtual?.atual != null ? String(contagemAtual.atual) : '';
    corpoHtml = `
      <div class="modal-titulo">✏️ Corrigir Est.vig
        <button class="modal-close" onclick="$('modal-bg').classList.remove('ativo')">×</button>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:12px">${esc(nomeProduto)}</div>
      <label style="font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase">Est. Atual (${(prod&&prod.und)||'UN'})</label>
      <input id="corrigir-ev-total" type="text" inputmode="decimal" class="form-input" value="${sugestao}" placeholder="0">
      <div class="modal-acoes">
        <button class="btn-sm btn-outline" onclick="$('modal-bg').classList.remove('ativo')">Cancelar</button>
        <button class="btn-sm btn-success" onclick="_salvarCorrecaoEstVig('${catalogoId}','${lojaSlug}',null)">✓ Salvar</button>
      </div>`;
  }
  abrirModal(corpoHtml);
}

async function _salvarCorrecaoEstVig(catalogoId, lojaSlug, fator) {
  const contagemAtual = S.contagens[catalogoId]?.[lojaSlug];
  const { monISO, sunISO } = _semanaAtivaBounds();
  const { estAnt } = _estAntVigEfetivo(contagemAtual, monISO, sunISO);

  let novoValor, atualCx = null, atualUnd = null;
  if (fator) {
    const cx = parseFloat(($('corrigir-ev-cx').value || '0').replace(',', '.')) || 0;
    const und = parseFloat(($('corrigir-ev-und').value || '0').replace(',', '.')) || 0;
    if (cx < 0 || und < 0) { toast('⚠️ Informe valores válidos.', 'err'); return; }
    novoValor = cx * fator + und;
    atualCx = cx; atualUnd = und;
  } else {
    novoValor = parseFloat(($('corrigir-ev-total').value || '').replace(',', '.'));
    if (isNaN(novoValor) || novoValor < 0) { toast('⚠️ Informe um valor válido.', 'err'); return; }
  }

  const nome = (() => {
    try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null')?.nome || 'Compras'; }
    catch(e) { return 'Compras'; }
  })();
  const hoje = new Date().toISOString().slice(0,10);
  const criadoPor = CORRECAO_SETOR_PREFIX + nome;
  const payload = {
    catalogo_id: catalogoId, loja_slug: lojaSlug,
    atual: novoValor, atual_cx: atualCx, atual_und: atualUnd, data_contagem: hoje, criado_por: criadoPor
  };
  // Preserva o Est.ant (não sobrescreve com null) — só a contagem "atual" está sendo corrigida.
  if (estAnt != null) payload.ul_estoque = estAnt;
  if (contagemAtual?.ul_pedido != null) payload.ul_pedido = contagemAtual.ul_pedido;

  try {
    await db.from('gn_contagens_pedido').upsert(payload, { onConflict: 'catalogo_id,loja_slug,data_contagem' });
    if (!S.contagens[catalogoId]) S.contagens[catalogoId] = {};
    S.contagens[catalogoId][lojaSlug] = {
      ...(S.contagens[catalogoId][lojaSlug] || {}),
      atual: novoValor, atualCx, atualUnd, data_contagem: hoje, criado_por: criadoPor, criado_em: new Date().toISOString(),
      ul_estoque: payload.ul_estoque ?? (S.contagens[catalogoId][lojaSlug]?.ul_estoque ?? null)
    };
    $('modal-bg').classList.remove('ativo');
    toast('✏️ Est.vig corrigido!');
    renderPedido();
  } catch(e) {
    toast('⚠️ Erro ao corrigir: ' + (e.message || e), 'err');
  }
}

async function carregarProvisoes() {
  const semAtiva = S.provSemana || getMondayOfWeek();
  const monday = semAtiva.toISOString().split('T')[0];
  const sunday = getSundayOfWeek(semAtiva).toISOString().split('T')[0];

  const SEL = '*, gn_catalogo(produto,und,grupo), gn_recebimentos(validado_por,qtd_recebida,valor_recebido,diferenca_qtd)';

  // Itens pendentes: filtro direto por data_entrega da semana
  const qPend = _fetchTodasPaginas(() => {
    let q = db.from('gn_provisoes').select(SEL)
      .eq('status', 'AGUARDANDO')
      .gte('data_entrega', monday).lte('data_entrega', sunday)
      .order('data_entrega', {ascending:true}).order('fornecedor').order('id');
    if (S.provLoja) q = q.eq('loja_slug', S.provLoja);
    return q;
  });

  // Itens confirmados: via pedido_id da semana (mesma lógica de carregarEntregasConfirmadas)
  const { data: pedidos } = await db.from('gn_pedidos').select('id')
    .or(`semana_inicio.eq.${monday},and(data_pedido.gte.${monday},data_pedido.lte.${sunday})`);
  const pedidoIds = (pedidos || []).map(p => p.id);

  const qConf = pedidoIds.length
    ? _fetchTodasPaginas(() => {
        let q = db.from('gn_provisoes').select(SEL)
          .in('status', ['RECEBIDO_OK', 'DIVERGENCIA', 'DEVOLVIDO'])
          .in('pedido_id', pedidoIds)
          .order('data_entrega', {ascending:true}).order('fornecedor').order('id');
        if (S.provLoja) q = q.eq('loja_slug', S.provLoja);
        return q;
      })
    : Promise.resolve([]);

  const [pending, confirmed] = await Promise.all([qPend, qConf]);
  const seen = new Set();
  const all = [...(pending || []), ...(confirmed || [])];
  S.provisoes = all.filter(p => { if (seen.has(p.id)) return false; seen.add(p.id); return true; });
}

// ═══════════════════════════════════════════════
// SUPABASE — MUTATIONS
// ═══════════════════════════════════════════════
// Tenta uma operação assíncrona algumas vezes com espera crescente antes de desistir —
// cobre quedas passageiras de conexão sem precisar de fila persistida. Só deve ser usada
// em passos que são seguros de repetir (idempotentes, ou uma inserção única que ou falha
// inteira ou não roda de novo — ver chamadas em _confirmarFornecedoresSelecionados).
async function _tentarComRetry(fn, tentativas=3, esperaMs=1500) {
  let ultimoErro=null;
  for (let i=0; i<tentativas; i++) {
    try { return await fn(); }
    catch(e) { ultimoErro=e; if (i<tentativas-1) await new Promise(r=>setTimeout(r, esperaMs*(i+1))); }
  }
  throw ultimoErro;
}

// ─── FILA OFFLINE ─────────────────────────────────────────────
function _ppKey(){ return 'gn_ped_pend_'+(S.pedidoAtual?.id||''); }
function _ppLoad(){ try{ return JSON.parse(localStorage.getItem(_ppKey())||'{}'); }catch(_){ return {}; } }
function _ppSave(q){ try{ localStorage.setItem(_ppKey(),JSON.stringify(q)); }catch(_){} }
function _ppSet(catalogoId, lojaSlug, qtd, custo, cxUnd){
  const q=_ppLoad(); if(!q[catalogoId]) q[catalogoId]={};
  q[catalogoId][lojaSlug]={qtd,custo,cxUnd:cxUnd||null}; _ppSave(q); _ppBadge();
}
function _ppDel(catalogoId, lojaSlug){
  const q=_ppLoad(); if(q[catalogoId]) delete q[catalogoId][lojaSlug];
  if(q[catalogoId]&&!Object.keys(q[catalogoId]).length) delete q[catalogoId];
  _ppSave(q); _ppBadge();
}
function _ppCount(){ const q=_ppLoad(); return Object.values(q).reduce((n,ls)=>n+Object.keys(ls).length,0); }
function _ppBadge(){
  const n=_ppCount();
  const b=$('offline-banner'), t=$('offline-banner-txt'), btn=$('btn-salvar-pedidos');
  if(!b) return;
  if(n>0){
    b.style.display=''; if(t) t.textContent=`${n} alteração(ões) offline — sincronizando ao reconectar...`;
    if(btn) btn.style.display='';
  } else {
    b.style.display='none'; if(btn) btn.style.display='none';
  }
}
async function flushPendingItems(manual){
  if(!S.pedidoAtual?.id) return;
  const q=_ppLoad();
  if(!Object.keys(q).length){
    if(manual) toast('✓ Tudo já está salvo!','ok');
    return;
  }
  if(manual) toast('Sincronizando...','ok');
  let ultimoErro=null;
  // Não usa "break" ao falhar um item: um único item com problema (ex.: produto
  // removido do catálogo) não pode travar pra sempre a sincronização dos demais —
  // foi exatamente isso que deixava o banner "alterações offline" preso indefinidamente.
  for(const catalogoId of Object.keys(q)){
    for(const lojaSlug of Object.keys(q[catalogoId])){
      const {qtd,custo,cxUnd}=q[catalogoId][lojaSlug];
      try{
        // Upsert (não insert/update por idExistente) — a fila offline pode ser antiga
        // e o item já ter sido salvo nesse meio-tempo (outro dispositivo, ou uma
        // tentativa anterior que na verdade deu certo mas não limpou a fila local);
        // um "insert" nesse caso batia num "duplicate key" e falhava pra sempre.
        const payload={
          pedido_id:S.pedidoAtual.id, catalogo_id:catalogoId, loja_slug:lojaSlug,
          qtd_pedida:qtd, custo_unitario:custo
        };
        if(cxUnd){ payload.qtd_cx=cxUnd.cx; payload.qtd_und=cxUnd.und; }
        const {data,error}=await db.from('gn_pedido_itens')
          .upsert(payload, { onConflict:'pedido_id,catalogo_id,loja_slug' })
          .select('id').single();
        if(error) throw error;
        if(data&&S.pedidoItens[catalogoId]?.[lojaSlug]) S.pedidoItens[catalogoId][lojaSlug].id=data.id;
        _ppDel(catalogoId,lojaSlug);
      } catch(e){
        ultimoErro=e;
        console.error('Erro ao sincronizar item pendente:', catalogoId, lojaSlug, e.message||e);
      }
    }
  }
  if(manual && ultimoErro && _ppCount()>0){
    toast('⚠️ Falha ao sincronizar: '+(ultimoErro.message||ultimoErro), 'err');
  }
  if(_ppCount()===0&&manual) toast('✓ Alterações sincronizadas!','ok');
  _ppBadge();
}

function _atualizarFaltasBadge(total) {

  if(sb){ sb.textContent=total; sb.style.display=total>0?'':'none'; }
