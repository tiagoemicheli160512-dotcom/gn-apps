<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#080810">
<title>GN Gorjetas 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#080810;color:#E2E8F4;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;font-size:14px;overflow-x:hidden;-webkit-font-smoothing:antialiased}
:root{
  --or:#F26419;--or2:#FF8C42;--or-glow:rgba(242,100,25,.25);
  --gd:#F5D98A;--gd2:#FFE4A0;
  --gr:#16A34A;--gr2:#86EFAC;--gr-bg:rgba(22,163,74,.12);
  --rd:#EF4444;--rd2:#FCA5A5;--rd-bg:rgba(239,68,68,.12);
  --bl:#3B82F6;--bl2:#93C5FD;--bl-bg:rgba(59,130,246,.12);
  --cy:#22D3EE;--cy2:#A5F3FC;--cy-bg:rgba(34,211,238,.1);
  --pu:#A855F7;--pu2:#D8B4FE;--pu-bg:rgba(168,85,247,.12);
  --gy:#64748B;--gy2:#94A3B8;
  --wh:#10B981;--wh2:#6EE7B7;
  --bg:#080810;--bg2:#0F0F1A;--bg3:#141420;--bg4:#1A1A28;--bg5:#1E1E30;
  --bd:#1E1E35;--bd2:#252538;--bd3:#2E2E48;
  --txt:#E2E8F4;--txt2:#CBD5E1;--txt3:#94A3B8;
}
button{cursor:pointer;border:none;font-family:inherit;font-size:inherit;transition:all .15s ease}
input,select,textarea{font-family:inherit;font-size:inherit;outline:none;transition:border-color .2s}
select option{background:#1A1A28;color:var(--txt)}
::-webkit-scrollbar{width:2px;height:2px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd3);border-radius:4px}
.hidden{display:none!important}

/* ── LOGIN ─────────────────────────────────────────────────────── */
#login{
  display:none;flex-direction:column;align-items:center;justify-content:center;
  height:100vh;padding:32px 24px;gap:20px;
  background:radial-gradient(ellipse at 50% 0%,rgba(242,100,25,.08) 0%,transparent 60%),var(--bg);
}
.login-logo{font-size:48px;margin-bottom:4px;filter:drop-shadow(0 0 20px rgba(242,100,25,.4))}
.login-brand{
  font-size:10px;font-weight:800;color:var(--or);letter-spacing:3px;text-transform:uppercase;
  background:linear-gradient(90deg,var(--or),var(--or2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.login-nome-loja{font-size:26px;font-weight:700;color:var(--gd);letter-spacing:-.5px;margin-bottom:4px}
.login-divider{width:40px;height:2px;background:linear-gradient(90deg,var(--or),transparent);border-radius:2px}
.login-form{width:100%;display:flex;flex-direction:column;gap:10px}
.login-label{font-size:11px;font-weight:600;color:var(--gy2);letter-spacing:.5px;text-transform:uppercase}
input.login-in{
  background:var(--bg3);border:1.5px solid var(--bd2);color:var(--txt);
  padding:14px 16px;border-radius:12px;width:100%;font-size:15px;font-weight:500;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.3);
}
input.login-in:focus{border-color:var(--or);box-shadow:0 0 0 3px var(--or-glow),inset 0 1px 3px rgba(0,0,0,.3)}
.btn-login{
  background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;
  padding:15px;border-radius:12px;font-size:15px;font-weight:700;width:100%;
  box-shadow:0 4px 20px var(--or-glow);letter-spacing:.3px;
}
.btn-login:active{transform:scale(.98);opacity:.9}
.login-hint{font-size:11px;color:var(--gy);text-align:center;line-height:1.7;max-width:260px}

/* ── APP ────────────────────────────────────────────────────────── */
#app{display:none;flex-direction:column;height:100vh;overflow:hidden}

/* ── HEADER ─────────────────────────────────────────────────────── */
.header{
  background:linear-gradient(180deg,rgba(20,8,0,.95) 0%,rgba(15,6,0,.9) 100%);
  border-bottom:1px solid rgba(242,100,25,.3);
  padding:12px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 1px 0 rgba(242,100,25,.15),0 4px 24px rgba(0,0,0,.4);
}
.h-logo{font-size:22px;filter:drop-shadow(0 0 8px rgba(242,100,25,.5))}
.h-info{flex:1;min-width:0}
.h-brand{font-size:8px;font-weight:800;color:var(--or);letter-spacing:2px;text-transform:uppercase;opacity:.8}
.h-loja{font-size:16px;font-weight:700;color:var(--gd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.3px}
.h-right{text-align:right;flex-shrink:0}
.h-sem{font-size:10px;color:var(--gy2)}
.h-sem span{color:var(--gd2);font-weight:700;font-family:Consolas,monospace}
.h-user{font-size:10px;color:var(--cy);font-weight:700;letter-spacing:.3px}
.sync-txt{font-size:9px;margin-top:1px}
.sync-ok{color:var(--wh)}.sync-err{color:var(--rd)}.sync-ing{color:var(--cy)}
.btn-pull{
  background:rgba(255,255,255,.05);border:1px solid var(--bd3);color:var(--gy2);
  padding:3px 8px;border-radius:6px;font-size:10px;cursor:pointer;margin-left:4px;
}
.btn-pull:active{background:var(--bd3)}

/* ── TABS ───────────────────────────────────────────────────────── */
.tab-bar{
  display:flex;background:var(--bg2);border-bottom:1px solid var(--bd);
  overflow-x:auto;flex-shrink:0;scrollbar-width:none;
}
.tab-bar::-webkit-scrollbar{display:none}
.tab{
  padding:12px 16px;font-size:11px;font-weight:600;color:var(--gy2);
  border:none;background:none;cursor:pointer;white-space:nowrap;
  border-bottom:2px solid transparent;flex-shrink:0;letter-spacing:.2px;
  position:relative;
}
.tab.on{color:var(--or2);border-bottom-color:var(--or);}
.tab.on::after{
  content:'';position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);
  width:6px;height:6px;background:var(--or);border-radius:50%;
  box-shadow:0 0 8px var(--or);
}

/* ── SCROLL & PAD ───────────────────────────────────────────────── */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:14px;max-width:640px;margin:0 auto;padding-bottom:32px}

/* ── WEEK NAV ───────────────────────────────────────────────────── */
.wnav{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.wnav select{
  flex:1;background:var(--bg3);border:1px solid var(--bd2);color:var(--gd);
  padding:10px 12px;border-radius:10px;font-size:12px;font-weight:600;
  appearance:none;-webkit-appearance:none;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.2);
}
.wnav select:focus{border-color:var(--or)}
.wnav button{
  background:var(--bg4);border:1px solid var(--bd2);color:var(--gd2);
  padding:10px 15px;border-radius:10px;font-size:20px;line-height:1;flex-shrink:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
}
.wnav button:active{background:var(--or);border-color:var(--or);color:#fff;transform:scale(.95)}

/* ── SECTION TITLE ──────────────────────────────────────────────── */
.sec-title{
  font-size:9px;font-weight:800;color:var(--or);letter-spacing:2px;
  text-transform:uppercase;margin:18px 0 10px;display:flex;align-items:center;gap:6px;
}
.sec-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--bd3),transparent)}

/* ── CAIXA SEMANA ───────────────────────────────────────────────── */
.caixa-row{
  background:var(--bg3);border:1px solid var(--bd2);border-radius:12px;
  padding:12px 14px;margin-bottom:7px;
  display:grid;grid-template-columns:52px 1fr 78px 78px;gap:10px;align-items:center;
  box-shadow:0 1px 4px rgba(0,0,0,.2);
}
.caixa-row.tot{
  background:linear-gradient(135deg,rgba(242,100,25,.1),rgba(15,6,0,.8));
  border-color:rgba(242,100,25,.4);
  box-shadow:0 0 20px rgba(242,100,25,.08),0 1px 4px rgba(0,0,0,.3);
}
.dl{font-size:12px;color:var(--txt);font-weight:700}
.dd{font-size:10px;color:var(--gy2);margin-top:1px}
.vl{font-size:9px;color:var(--gy);margin-bottom:2px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.vv{font-size:13px;font-weight:700;font-family:Consolas,monospace}
.vv.gd{color:var(--gd)}.vv.bl{color:var(--bl2)}.vv.gr{color:var(--gr2)}.vv.or{color:var(--or2)}
input.bruto{
  background:rgba(242,100,25,.08);border:1.5px solid rgba(242,100,25,.4);
  color:var(--gd2);padding:9px 10px;border-radius:8px;width:100%;
  text-align:right;font-size:14px;font-weight:700;font-family:Consolas,monospace;
}
input.bruto:focus{
  border-color:var(--or);background:rgba(242,100,25,.12);
  box-shadow:0 0 0 3px var(--or-glow);
}

/* ── KPI BOX ────────────────────────────────────────────────────── */
.kpi-sum{
  background:linear-gradient(135deg,var(--gr-bg),rgba(22,163,74,.06));
  border:1px solid rgba(22,163,74,.25);border-radius:12px;padding:14px;
  margin-bottom:6px;box-shadow:0 0 20px rgba(22,163,74,.06);
}
.row-sb{display:flex;justify-content:space-between;align-items:center}

/* ── FUNCIONÁRIOS ───────────────────────────────────────────────── */
.fc{
  background:var(--bg3);border:1px solid var(--bd2);border-radius:14px;
  margin-bottom:9px;overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
  transition:border-color .2s;
}
.fc.eleg{border-color:rgba(22,163,74,.35);box-shadow:0 2px 8px rgba(22,163,74,.08)}
.fc.falt{border-color:rgba(239,68,68,.35);box-shadow:0 2px 8px rgba(239,68,68,.08)}
.fc-hdr{
  display:flex;align-items:center;gap:10px;padding:12px 14px;
  cursor:pointer;background:var(--bg4);
}
.fc-num{
  width:28px;height:28px;border-radius:50%;
  background:linear-gradient(135deg,var(--bg5),var(--bd2));
  border:1px solid var(--bd3);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;color:var(--gy2);font-weight:700;flex-shrink:0;
}
.fc-nome{
  flex:1;background:transparent;border:none;color:var(--txt);
  font-size:14px;font-weight:600;outline:none;min-width:0;letter-spacing:-.2px;
}
.fc-nome::placeholder{color:var(--bd3)}
.fc-liq{
  font-size:14px;font-weight:700;font-family:Consolas,monospace;
  color:var(--gd);white-space:nowrap;flex-shrink:0;
  text-shadow:0 0 20px rgba(245,217,138,.2);
}
.fc-arr{color:var(--gy);font-size:11px;flex-shrink:0;margin-left:2px}
.fc-body{display:none}.fc-body.open{display:block}
.fc-tipo{
  padding:10px 14px;display:flex;align-items:center;gap:10px;
  border-top:1px solid var(--bd);background:rgba(0,0,0,.15);
}
.tipo-sel{
  background:var(--bg5);border:1px solid var(--bd2);color:var(--gy2);
  padding:6px 10px;border-radius:8px;font-size:11px;font-weight:600;
  appearance:none;-webkit-appearance:none;
}
.badges{display:flex;gap:5px;flex-wrap:wrap}
.badge{
  padding:3px 8px;border-radius:20px;font-size:9px;font-weight:700;
  letter-spacing:.3px;text-transform:uppercase;
}
.b-eleg{background:var(--cy-bg);color:var(--cy);border:1px solid rgba(34,211,238,.2)}
.b-f50{background:rgba(245,158,11,.12);color:#FCD34D;border:1px solid rgba(245,158,11,.2)}
.b-f00{background:var(--rd-bg);color:var(--rd2);border:1px solid rgba(239,68,68,.2)}
.dias-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:10px 12px}
.dia-c{display:flex;flex-direction:column;align-items:center;gap:3px}
.dia-h{font-size:9px;color:var(--gy);text-align:center;line-height:1.3;font-weight:600}
.dia-sel{
  width:100%;background:var(--bg5);border:1px solid var(--bd2);color:var(--txt);
  padding:4px 1px;border-radius:6px;font-size:9px;text-align:center;
  cursor:pointer;appearance:none;-webkit-appearance:none;font-weight:600;
}
.dia-sel[data-s="PRESENTE"]{background:rgba(22,163,74,.15);color:var(--gr2);border-color:rgba(22,163,74,.35)}
.dia-sel[data-s="FALTA"]{background:var(--rd-bg);color:var(--rd2);border-color:rgba(239,68,68,.35)}
.dia-sel[data-s="ATESTADO"]{background:rgba(234,179,8,.1);color:#FDE68A;border-color:rgba(234,179,8,.3)}
.dia-sel[data-s="SUSPENSÃO"]{background:rgba(249,115,22,.12);color:#FED7AA;border-color:rgba(249,115,22,.3)}
.dia-sel[data-s="HORISTA"]{background:var(--bl-bg);color:var(--bl2);border-color:rgba(59,130,246,.3)}
.dia-sel[data-s="NÃO TRABALHADO"]{background:var(--bg5);color:var(--gy);border-color:var(--bd2)}
.dia-sel[data-s="JOVEM APRENDIZ"]{background:var(--pu-bg);color:var(--pu2);border-color:rgba(168,85,247,.3)}
.dia-sel[data-s="FOLGA"]{background:rgba(6,182,212,.12);color:#67e8f9;border-color:rgba(6,182,212,.35)}
.dia-sel[data-s="BANCO DE HORAS"]{background:rgba(139,92,246,.12);color:#c4b5fd;border-color:rgba(139,92,246,.35)}
.dia-sel[data-s="FÉRIAS"]{background:rgba(14,165,233,.12);color:#7dd3fc;border-color:rgba(14,165,233,.35)}
.dia-sel[data-s="AFASTAMENTO"]{background:rgba(20,184,166,.12);color:#5eead4;border-color:rgba(20,184,166,.35)}
.dia-sel[data-s="JUSTIFICATIVA"]{background:rgba(236,72,153,.12);color:#fbcfe8;border-color:rgba(236,72,153,.3)}
.dia-val{
  font-size:8px;font-weight:700;font-family:Consolas,monospace;
  color:var(--gd);text-align:center;width:100%;overflow:hidden;white-space:nowrap;
  opacity:.85;
}
.fc-res{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  padding:10px 14px;border-top:1px solid var(--bd);
  background:rgba(0,0,0,.1);
}
.ri{text-align:center}
.rl{font-size:8px;color:var(--gy);font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-bottom:3px}
.rv{font-size:13px;font-weight:700;font-family:Consolas,monospace}
.btn-add-func{
  width:100%;background:rgba(242,100,25,.06);border:1.5px dashed rgba(242,100,25,.25);
  color:var(--or);padding:15px;border-radius:12px;font-size:13px;font-weight:700;
  cursor:pointer;margin-top:6px;letter-spacing:.3px;
}
.btn-add-func:active{background:rgba(242,100,25,.1)}
.btn-del-func{
  width:calc(100% - 28px);margin:0 14px 14px;
  background:var(--rd-bg);border:1px solid rgba(239,68,68,.25);
  color:var(--rd2);padding:10px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;
}
.btn-del-func:active{background:rgba(239,68,68,.2)}
.btn-fechar{
  width:calc(100% - 28px);margin:12px 14px 0;
  background:var(--bg5);border:1px solid var(--bd3);
  color:var(--gy2);padding:8px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;
}

/* ── POOL ───────────────────────────────────────────────────────── */
.pool-card{
  background:var(--bg3);border:1px solid rgba(22,163,74,.2);border-radius:14px;
  padding:16px;margin-bottom:12px;
  box-shadow:0 0 24px rgba(22,163,74,.05);
}
.pool-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.pool-row:last-child{border:none}
.pool-row.hi{
  background:rgba(0,0,0,.2);margin:0 -16px;padding:8px 16px;
  border-bottom:1px solid var(--bd);
}
.pl{font-size:12px;color:var(--gy2);font-weight:500}
.pv{font-size:15px;font-weight:700;font-family:Consolas,monospace;color:var(--gd)}
.pv.gr{color:var(--gr2)}.pv.or{color:var(--or2)}.pv.rd{color:var(--rd2)}
.sn{display:flex;gap:8px}
.sn button{
  padding:8px 20px;border-radius:8px;border:1px solid var(--bd2);
  font-size:12px;font-weight:700;background:var(--bg5);color:var(--gy2);cursor:pointer;
}
.sn button.sim{
  background:var(--gr-bg);border-color:rgba(22,163,74,.35);color:var(--gr2);
  box-shadow:0 0 12px rgba(22,163,74,.1);
}
.sn button.nao{
  background:var(--rd-bg);border-color:rgba(239,68,68,.35);color:var(--rd2);
  box-shadow:0 0 12px rgba(239,68,68,.1);
}
input.pi{
  background:var(--bg5);border:1px solid var(--bd2);color:var(--gd);
  padding:8px 12px;border-radius:8px;width:150px;text-align:right;
  font-family:Consolas,monospace;font-size:13px;font-weight:700;
}
input.pi:focus{border-color:var(--or);box-shadow:0 0 0 3px var(--or-glow)}
.pool-func-item{
  background:var(--bg4);border-radius:10px;padding:12px 14px;margin-bottom:7px;
  border:1px solid var(--bd2);
}
.pool-func-item.eleg{border-color:rgba(22,163,74,.3);background:rgba(22,163,74,.04)}
.chip{
  display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;
  font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
}
.chip.ok{background:var(--gr-bg);color:var(--gr2);border:1px solid rgba(22,163,74,.2)}
.chip.ng{background:var(--rd-bg);color:var(--rd2);border:1px solid rgba(239,68,68,.2)}

/* ── RESUMO MENSAL ──────────────────────────────────────────────── */
.mes-tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;margin-bottom:12px}
.mes-tabs::-webkit-scrollbar{display:none}
.mt{
  padding:6px 14px;border-radius:20px;font-size:11px;font-weight:700;
  border:1px solid var(--bd2);background:var(--bg3);color:var(--gy2);
  cursor:pointer;white-space:nowrap;flex-shrink:0;letter-spacing:.3px;
}
.mt.on{
  background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;
  border-color:var(--or);box-shadow:0 2px 12px var(--or-glow);
}
.rtbl{width:100%;border-collapse:collapse;font-size:11px}
.rtbl th{
  background:var(--bg4);color:var(--or);padding:8px 10px;text-align:right;
  font-size:9px;font-weight:800;border-bottom:1px solid var(--bd2);white-space:nowrap;
  letter-spacing:.5px;text-transform:uppercase;
}
.rtbl th:first-child{text-align:left}
.rtbl td{
  padding:8px 10px;border-bottom:1px solid var(--bd);
  font-family:Consolas,monospace;text-align:right;white-space:nowrap;font-size:11px;
}
.rtbl td:first-child{
  font-family:inherit;font-weight:600;text-align:left;color:var(--txt2);
  max-width:100px;overflow:hidden;text-overflow:ellipsis;
}
.rtbl tr:nth-child(even) td{background:rgba(255,255,255,.015)}
.rtbl tr.tot td{
  background:linear-gradient(135deg,var(--or),var(--or2));color:#fff;
  font-weight:700;
}

/* ── RELATÓRIO ──────────────────────────────────────────────────── */
.kpi-g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{
  background:var(--bg3);border:1px solid var(--bd2);border-radius:12px;padding:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}
.kv{font-size:24px;font-weight:700;font-family:Consolas,monospace;color:var(--or2)}
.kl{font-size:10px;color:var(--gy2);margin-top:4px;font-weight:500}
.alert{
  background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);
  border-left:3px solid var(--rd);padding:10px 14px;border-radius:0 10px 10px 0;
  margin-bottom:8px;
}
.alert .an{font-weight:700;color:var(--rd2);font-size:12px;margin-bottom:3px}
.alert .ad{font-size:11px;color:var(--txt3)}

/* ── WHATSAPP ───────────────────────────────────────────────────── */
.wha-card{
  background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.2);
  border-radius:14px;padding:16px;margin-bottom:12px;
}
.wha-title{font-size:12px;font-weight:700;color:var(--wh2);margin-bottom:12px;letter-spacing:.3px}
.wha-preview{
  background:rgba(0,0,0,.3);border:1px solid var(--bd);border-radius:10px;
  padding:14px;font-family:'SF Mono',Consolas,monospace;font-size:11px;color:var(--txt2);
  white-space:pre-wrap;word-break:break-word;max-height:300px;overflow-y:auto;
  line-height:1.6;margin-bottom:12px;
}
.btn-wha{
  background:linear-gradient(135deg,#059669,var(--wh));color:#fff;border:none;
  padding:13px 16px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;

  try {

function _buildCAL() {
  const anchor = new Date(2026, 0, 5);
  const DN = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const MN = ['','Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const MA = ['','JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
  const today = new Date();
  const end = new Date(today.getFullYear() + 2, 11, 31);
  const p2 = n => String(n).padStart(2,'0');
  const cal = [];
  const cur = new Date(anchor);
  while (cur <= end) {
    const days = [];
    for (let di = 0; di < 7; di++) {
      const dt = new Date(cur); dt.setDate(dt.getDate() + di);
      days.push({d: dt.getDate(), m: dt.getMonth()+1, nome: DN[dt.getDay()]});
    }
    const thu = new Date(cur); thu.setDate(thu.getDate()+3);
    const ys = new Date(thu.getFullYear(),0,1);
    const num = Math.ceil(((thu - ys)/86400000 + 1)/7);
    const mon = days[0], sun = days[6];
    const month = mon.m;
    cal.push({num, year: cur.getFullYear(), month, abrev: MA[month],
      header: `${p2(mon.d)}/${p2(mon.m)} — ${p2(sun.d)}/${p2(sun.m)}`,
      days, mesNome: MN[month]});
    cur.setDate(cur.getDate() + 7);
  }
  return cal;
}

  return Array.from({length:MAX_FUNC},(_,i)=>({id:i,nome:'',tipo:'CLT / MENSALISTA',dias:Array(7).fill('PRESENTE'),afastamento_just:''}));
}
function mkWD() { return {brutos:Array(7).fill(0),funcs:mkFuncs(),dist:'SIM',vDist:0,saldoSaida:0,motivo:''}; }




function getFuncsHerdados(idx) {
  // Busca para trás até achar uma semana com funcionários cadastrados
  for(let i=idx-1; i>=0; i--) {
    const k=String(i);
    const wd=state.allData[k];
    if(wd && wd.funcs) {
      const comNome=wd.funcs.filter(f=>f.nome && f.nome.trim());
      if(comNome.length>0) {
        // Copia todos os campos do func (preserva horario_dias, setor, turno, etc.), zera status para PRESENTE
        const herdados=wd.funcs.map(f=>{
          if(!f.nome || !f.nome.trim()) return {id:f.id,nome:'',tipo:'CLT / MENSALISTA',dias:Array(7).fill('PRESENTE')};
          return {...f, dias:Array(7).fill('PRESENTE')};
        });
        // Completar até MAX_FUNC
        while(herdados.length<MAX_FUNC) herdados.push({id:herdados.length,nome:'',tipo:'CLT / MENSALISTA',dias:Array(7).fill('PRESENTE')});
        return herdados;
      }
    }
  }
  return mkFuncs();
}

function getWD(idx) {
  const k=String(idx);
  if(!state.allData[k]) {
    // Semana nova: herdar funcionários da semana anterior
    const funcs=getFuncsHerdados(idx);
    return {brutos:Array(7).fill(0),funcs,dist:'SIM',vDist:0,saldoSaida:0,motivo:''};
  }
  const wd={...state.allData[k]};
  if(!wd.funcs||wd.funcs.length<MAX_FUNC) {
    const cur=[...(wd.funcs||[])];
    while(cur.length<MAX_FUNC) cur.push({id:cur.length,nome:'',tipo:'CLT / MENSALISTA',dias:Array(7).fill('PRESENTE')});
    wd.funcs=cur;
  }
  return wd;
}
function setWD(idx,data,descricao) {
  data._lastEdit = Date.now();
  state.allData[String(idx)]=data;
  sv('allData',state.allData);
  const entry={ts:new Date().toLocaleString('pt-BR'),usuario:usuarioAtual,semana:'S'+String(CAL[idx]?.num||'?').padStart(2,'0'),desc:descricao||'Atualização'};
  logEntries.unshift(entry);
  if(logEntries.length>100) logEntries=logEntries.slice(0,100);
  sv('log',logEntries);
  syncCloud();
}


function getSaldoAntes(semIdx) {
  let s=0;
  for(let i=0;i<semIdx;i++){
    const wd=getWD(i);
    const c=calcSemana(wd,s);
    const saida=parseFloat(wd.saldoSaida)||0;
    s=c.retido-saida;
  }
  return s;
}

// ── RENDER ────────────────────────────────────────────────────────────────
function render() {
  const sem=CAL[state.semIdx]||CAL[0];
  document.getElementById('hdr-sem').textContent=String(sem.num).padStart(2,'0');
  document.getElementById('hdr-user').textContent=usuarioAtual;
  atualizarSyncUI();
  const tb=document.getElementById('tab-bar');
  tb.innerHTML=TABS.map(t=>`<button class="tab${t.id===state.tab?' on':''}" onclick="setTab('${t.id}')">${t.label}</button>`).join('');
  const ct=document.getElementById('content');
  if(state.tab==='semana') renderSemana(ct,sem);
  else if(state.tab==='funcs') renderFuncs(ct,sem);
  else if(state.tab==='pool') renderPool(ct);
  else if(state.tab==='resumo') renderResumo(ct);
  else if(state.tab==='relatorio') renderRelatorio(ct);
  else if(state.tab==='whatsapp') renderWhatsApp(ct);
  else if(state.tab==='saldo') renderSaldo(ct);
  else if(state.tab==='backup') renderBackup(ct);
  else if(state.tab==='log') renderLog(ct);
}
function setSemIdx(i){ state.semIdx=Math.max(0,Math.min(CAL.length-1,i)); sv('semIdx',state.semIdx); render(); }

function renderLog(ct){

    : `<div style="background:#0D3B1F;border:1px solid var(--gr);color:#6FCF97;padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:11px">✓ Sem erros de sincronização registrados nesta sessão</div>`;
  ct.innerHTML=`<div class="pad">
    <div class="row-sb" style="margin-bottom:10px">
      <div class="sec-title" style="margin:0">◄ Log de Lançamentos</div>
      <button onclick="carregarDaNuvem(false,true)" style="background:var(--bl);color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer">↓ Atualizar</button>
    </div>
    ${erroBox}
    <div class="row-sb" style="margin-bottom:10px">

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

// ── TAB SEMANA ────────────────────────────────────────────────────────────
function renderSemana(ct,sem) {

  const saldo=getSaldoAntes(state.semIdx);

  const brutoTotal=wd.brutos.reduce((s,v)=>s+(parseFloat(v)||0),0);
  const opts=CAL.map((w,i)=>`<option value="${i}"${i===state.semIdx?' selected':''}>S${String(w.num).padStart(2,'0')} · ${w.mesNome} · ${w.header}</option>`).join('');
  const rows=sem.days.map((day,d)=>`
    <div class="caixa-row">
      <div><div class="dl">${day.nome}</div><div class="dd">${String(day.d).padStart(2,'0')}/${String(day.m).padStart(2,'0')}</div></div>
      <div><div class="vl">Bruto</div>
        <input class="bruto" type="text" inputmode="numeric" placeholder="0,00"
          id="bruto-${d}"
          value="${wd.brutos[d]||''}"
          onfocus="this.select()"
          onblur="updBruto(${d},this.value)"></div>
      <div><div class="vl">90% Base</div><div class="vv bl" id="e90-${d}">${fmtBRL(calc.dias[d].e90)}</div></div>
      <div><div class="vl">Cota/Ativo</div><div class="vv gr" id="cota-${d}">${fmtBRL(calc.dias[d].cotaUnit)}</div></div>
    </div>`).join('');
  ct.innerHTML=`<div class="pad">
    <div class="wnav">
      <button onclick="setSemIdx(${state.semIdx-1})">‹</button>
      <select onchange="setSemIdx(+this.value)">${opts}</select>
      <button onclick="setSemIdx(${state.semIdx+1})">›</button>
    </div>
    <div class="sec-title">◄ Caixa da Semana</div>
    ${rows}
    <div class="caixa-row tot">
      <div><div class="dl">TOTAL</div></div>
      <div><div class="vl">Bruto Total</div><div class="vv or" id="tot-bruto">${fmtBRL(brutoTotal)}</div></div>
      <div><div class="vl">90% Base</div><div class="vv bl" id="tot-base">${fmtBRL(calc.baseTotal)}</div></div>
      <div><div class="vl">ADM Semana</div><div class="vv gd">R$ 50,00</div></div>
    </div>
    <hr class="div">
    <div style="background:var(--bg4);border-radius:8px;padding:12px;border:1px solid var(--gr)">
      <div class="row-sb" style="margin-bottom:6px">
        <span style="font-size:12px;color:var(--gy)">Pool de rateio</span>
        <span class="vv or" id="sum-pool">${fmtBRL(calc.poolRateio)}</span>
      </div>
      <div class="row-sb" style="margin-bottom:6px">
        <span style="font-size:12px;color:var(--gy)">Saldo anterior</span>
        <span class="vv gd">${fmtBRL(saldo)}</span>
      </div>
      <div class="row-sb">
        <span style="font-size:12px;color:var(--gy)">Funcionários ativos</span>
        <span style="font-weight:700;color:var(--gd)">${calc.nAtivos}</span>
      </div>
    </div>
  </div>`;
}
function updBruto(d,v) {
  const val = parseBRL(v);
  // Atualizar input com valor limpo
  const inp = document.getElementById(`bruto-${d}`);
  if(inp) inp.value = val > 0 ? String(val) : '';
  const wd={...getWD(state.semIdx)};
  wd.brutos=[...wd.brutos]; wd.brutos[d]=val;
  setWD(state.semIdx,wd);
  // Atualizar só os valores calculados, sem re-renderizar toda a tela
  const saldo=getSaldoAntes(state.semIdx);
  const calc=calcSemana(wd,saldo);
  // Atualizar cada linha
  for(let i=0;i<7;i++) {
    const e=document.getElementById(`e90-${i}`); if(e) e.textContent=fmtBRL(calc.dias[i].e90);
    const c=document.getElementById(`cota-${i}`); if(c) c.textContent=fmtBRL(calc.dias[i].cotaUnit);
  }
  // Atualizar totais
  const brutoTotal=wd.brutos.reduce((s,v)=>s+(parseFloat(v)||0),0);
  const elTot=document.getElementById('tot-bruto'); if(elTot) elTot.textContent=fmtBRL(brutoTotal);
  const elBase=document.getElementById('tot-base'); if(elBase) elBase.textContent=fmtBRL(calc.baseTotal);
  const elPool=document.getElementById('sum-pool'); if(elPool) elPool.textContent=fmtBRL(calc.poolRateio);
}

// ── TAB FUNCIONÁRIOS ──────────────────────────────────────────────────────
function renderFuncs(ct,sem) {
  const wd=getWD(state.semIdx);
  const saldo=getSaldoAntes(state.semIdx);
  const calc=calcSemana(wd,saldo);
  const nAtivos=wd.funcs.filter(f=>f.nome.trim()).length;

  // Slots visíveis: índices com nome preenchido OU marcados como visíveis manualmente
  if(!state.visibleSlots) state.visibleSlots={};
  wd.funcs.forEach((f,i)=>{ if(f.nome.trim()) state.visibleSlots[i]=true; });
  const indicesVisiveis=wd.funcs.map((f,i)=>i).filter(i=>state.visibleSlots[i]);

  let html=`<div class="pad">
    <div class="row-sb" style="margin-bottom:10px">
      <div class="sec-title" style="margin:0">◄ Funcionários — S${String(CAL[state.semIdx].num).padStart(2,'0')}</div>
      <span class="chip">${nAtivos} / ${MAX_FUNC}</span>
    </div>`;
  indicesVisiveis.forEach(i=>{
    const f=wd.funcs[i];
    const atvIdx=wd.funcs.slice(0,i).filter(x=>x.nome.trim()).length;
    const fc=f.nome.trim()?calc.funcCalc[atvIdx]:null;
    const isEleg=fc?.elegivel; const hasFalt=fc&&fc.nFS>0;
    const cls=fc?(isEleg?'eleg':(hasFalt?'falt':'')):'';
    const exp=state.expanded[i]||false;
    const diasHtml=sem.days.map((day,d)=>{
      const st=f.dias[d];
      const opts=STATUS.map(s=>`<option value="${s}"${s===st?' selected':''}>${STATUS_ABREV[s]}</option>`).join('');
      const valorDia=['PRESENTE','HORISTA','JOVEM APRENDIZ','FOLGA','BANCO DE HORAS','FÉRIAS'].includes(st)?calc.dias[d].cotaUnit:0;
      return `<div class="dia-c">
        <div class="dia-h">${day.nome}<br>${String(day.d).padStart(2,'0')}</div>
        <select class="dia-sel" data-s="${st}" onchange="updDia(${i},${d},this)">${opts}</select>
        <div class="dia-val">${fmtBRLDia(valorDia)}</div>
      </div>`;
    }).join('');
    const badges=fc?`
      ${isEleg?'<span class="badge b-eleg">Rateio ✓</span>':''}
      ${fc.nFS===1?'<span class="badge b-f50">Mult 50%</span>':''}
      ${fc.nFS>=2?'<span class="badge b-f00">Mult 0%</span>':''}`:'' ;
    const res=fc?`<div class="fc-res">
      <div class="ri"><div class="rl">Cota Base</div><div class="rv" style="color:var(--gr2)">${fmtBRL(fc.AF)}</div></div>
      <div class="ri"><div class="rl">Rateio</div><div class="rv" style="color:var(--gd)">${fmtBRL(fc.rateio)}</div></div>
      <div class="ri"><div class="rl">ADM (−)</div><div class="rv" style="color:var(--gy)">${fmtBRL(fc.adm)}</div></div>
      <div class="ri"><div class="rl">Líquido</div><div class="rv" style="color:${fc.liquido<0?'var(--rd)':'var(--gd)'}">${fmtBRL(fc.liquido)}</div></div>
    </div>`:'';
    const hasAfastamento=f.dias.some(d=>d==='AFASTAMENTO');
    const justHtml=(hasAfastamento||f.afastamento_just)?`<div style="padding:8px 14px 10px"><div style="font-size:9px;color:var(--gy);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px">📋 Justificativa Afastamento</div><input type="text" value="${(f.afastamento_just||'').replace(/"/g,'&quot;')}" placeholder="INSS, CID, motivo..." onblur="updAfastamentoJust(${i},this.value)" style="width:100%;box-sizing:border-box;background:var(--bg4);border:1px solid var(--bd2);border-radius:6px;color:var(--txt);padding:6px 8px;font-size:11px;font-family:inherit;"></div>`:'';
    html+=`<div class="fc ${cls}" id="fc-${i}">
      <div class="fc-hdr" onclick="toggleFunc(${i})">
        <div class="fc-num">${i+1}</div>
        <input class="fc-nome" placeholder="Funcionário ${i+1}" value="${f.nome.replace(/"/g,'&quot;')}"
          onclick="event.stopPropagation()" onblur="updNome(${i},this.value)">
        ${fc?`<div class="fc-liq">${fmtBRL(fc.liquido)}</div>`:''}
        <div class="fc-arr">${exp?'▲':'▼'}</div>
      </div>
      <div class="fc-body${exp?' open':''}">
        <div class="fc-tipo">
          <select class="tipo-sel" onchange="updTipo(${i},this.value)">
            ${['CLT / MENSALISTA','HORISTA','JOVEM APRENDIZ'].map(t=>`<option${t===f.tipo?' selected':''}>${t}</option>`).join('')}
          </select>
          <div class="badges">${badges}</div>
        </div>
        <div class="dias-g">${diasHtml}</div>
        ${res}
        ${justHtml}
        <button type="button" onclick="removerFuncionario(${i}, this)" style="width:calc(100% - 24px);margin:0 12px 12px;background:var(--rdk);border:1px solid #8B0000;color:var(--rd);padding:9px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer">🗑️ Excluir funcionário</button>
      </div>
    </div>`;
  });
  if(indicesVisiveis.length<MAX_FUNC){
    html+=`<button onclick="adicionarFuncionario()" style="width:100%;background:var(--bg2);border:1.5px dashed var(--bd);color:var(--gd);padding:14px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;margin-top:6px">+ Adicionar funcionário</button>`;
  }
  html+=`</div>`;
  ct.innerHTML=html;
}
function adicionarFuncionario(){
  const wd=getWD(state.semIdx);
  if(!state.visibleSlots) state.visibleSlots={};
  const proximoIdx=wd.funcs.findIndex((f,i)=>!state.visibleSlots[i]);
  if(proximoIdx===-1){ showToast('Limite de funcionários atingido'); return; }
  state.visibleSlots[proximoIdx]=true;
  state.expanded[proximoIdx]=true;
  renderFuncs(document.getElementById('content'),CAL[state.semIdx]);
  setTimeout(()=>{
    const el=document.querySelector(`#fc-${proximoIdx} .fc-nome`);
    if(el) el.focus();
  },50);
}
function removerFuncionario(i, btnEl){
  const wd=getWD(state.semIdx);
  const nomeAtual=(wd.funcs[i]&&wd.funcs[i].nome||'').trim();

  // Se tem nome, exige clique de confirmação (sem usar confirm() nativo, que pode ser bloqueado)
  if(nomeAtual && btnEl && !btnEl.dataset.confirmando){
    btnEl.dataset.confirmando='1';
    const textoOriginal=btnEl.textContent;
    btnEl.textContent='⚠️ Toque de novo p/ confirmar';
    btnEl.style.background='#8B0000';
    setTimeout(()=>{
      if(btnEl.dataset.confirmando){
        delete btnEl.dataset.confirmando;
        btnEl.textContent=textoOriginal;
        btnEl.style.background='var(--rdk)';
      }
    },3000);
    return;
  }

  const wd2={...wd};
  wd2.funcs=[...wd2.funcs];
  wd2.funcs[i]={id:i,nome:'',tipo:'CLT / MENSALISTA',dias:Array(7).fill('PRESENTE'),_removidoEm:Date.now()};
  wd2._lastEdit = Date.now();
  state.allData[String(state.semIdx)]=wd2;
  sv('allData',state.allData);
  const entry={ts:new Date().toLocaleString('pt-BR'),usuario:usuarioAtual,semana:'S'+String(CAL[state.semIdx]?.num||'?').padStart(2,'0'),desc:'Funcionário removido'};
  logEntries.unshift(entry);
  if(logEntries.length>100) logEntries=logEntries.slice(0,100);
  sv('log',logEntries);
  if(state.visibleSlots) delete state.visibleSlots[i];
  if(state.expanded) delete state.expanded[i];
  renderFuncs(document.getElementById('content'),CAL[state.semIdx]);
  showToast('Removendo...');
  // Sync imediato (sem debounce) para evitar que o auto-refresh periódico
  // leia a versão remota antiga antes da remoção ser salva. Aguarda
  // confirmação antes de avisar sucesso.
  clearTimeout(syncTimer);
  syncPendente=true;
  _syncNow().then(()=>showToast(syncStatus==='ok' ? '✓ Removido e salvo' : '⚠️ Removido, mas falhou ao salvar — tente novamente'));
}
function toggleFunc(i){ state.expanded[i]=!state.expanded[i]; renderFuncs(document.getElementById('content'),CAL[state.semIdx]); }
function updNome(i,v){
  const wd={...getWD(state.semIdx)};
  wd.funcs=[...wd.funcs]; wd.funcs[i]={...wd.funcs[i],nome:v};
  setWD(state.semIdx,wd);
}
function updTipo(i,v){
  const wd={...getWD(state.semIdx)};
  wd.funcs=[...wd.funcs]; wd.funcs[i]={...wd.funcs[i],tipo:v};
  setWD(state.semIdx,wd);
  renderFuncs(document.getElementById('content'),CAL[state.semIdx]);
}
function updAfastamentoJust(i,v){
  const wd={...getWD(state.semIdx)};
  wd.funcs=[...wd.funcs]; wd.funcs[i]={...wd.funcs[i],afastamento_just:v};
  setWD(state.semIdx,wd);
}
function updDia(fi,d,sel){
  const v=sel.value; sel.setAttribute('data-s',v);
  const wd={...getWD(state.semIdx)};
  wd.funcs=[...wd.funcs]; const f={...wd.funcs[fi]}; f.dias=[...f.dias]; f.dias[d]=v; wd.funcs[fi]=f;
  setWD(state.semIdx,wd);
  // Re-renderiza tudo: a mudança de status em um dia afeta a cota de TODOS os funcionários daquele dia
  renderFuncs(document.getElementById('content'),CAL[state.semIdx]);
}

// ── TAB POOL ──────────────────────────────────────────────────────────────

        <div><div style="color:var(--gy)">Cota base</div><div class="vv gd">${fmtBRL(f.AF)}</div></div>
        <div><div style="color:var(--gy)">Rateio</div><div class="vv or">${fmtBRL(f.rateio)}</div></div>
        <div><div style="color:var(--gy)">Líquido</div><div class="vv" style="color:${f.liquido<0?'var(--rd)':'var(--gd)'}">${fmtBRL(f.liquido)}</div></div>
      </div></div>`).join('');
  ct.innerHTML=`<div class="pad">
    <div class="sec-title">◄ Pool / Rateio</div>
    <div class="pool-card">${dRows}
      <div class="pool-row" style="flex-direction:column;align-items:flex-start;gap:8px">
        <span class="pl">Distribuir?</span>
        <div class="sn"><button class="${wd.dist==='SIM'?'sim':''}" onclick="updDist('SIM')">SIM</button>
          <button class="${wd.dist==='NÃO'?'nao':''}" onclick="updDist('NÃO')">NÃO</button></div>
      </div>
      <div class="pool-row" style="flex-direction:column;align-items:flex-start;gap:6px">
        <span class="pl">Valor a distribuir (0 = tudo)</span>

          value="${wd.vDist||''}" onfocus="this.select()" onblur="updVDist(this.value)">
      </div>
      ${eRows}</div>
    <div class="sec-title">Distribuição individual</div>

function renderRelatorio(ct){
  const meses={}; CAL.forEach((w,i)=>{ if(!meses[w.month]) meses[w.month]=[]; meses[w.month].push({...w,idx:i}); });
  let totalLiq=0, mesMaxF='—', maxF=0; const alertas=[];
  Object.entries(meses).forEach(([m,sems])=>{
    const fMap={};
    sems.forEach(w=>{
      const wd=getWD(w.idx); const calc=calcSemana(wd,getSaldoAntes(w.idx));
      totalLiq+=calc.funcCalc.reduce((s,f)=>s+f.liquido,0);
      wd.funcs.forEach(f=>{
        if(!f.nome.trim()) return;
        if(!fMap[f.nome]) fMap[f.nome]={nFS:0,nAt:0};
        fMap[f.nome].nFS+=f.dias.filter(s=>['FALTA','SUSPENSÃO'].includes(s)).length;
        fMap[f.nome].nAt+=f.dias.filter(s=>s==='ATESTADO'||s==='JUSTIFICATIVA').length;
      });
    });
    const tf=Object.values(fMap).reduce((s,v)=>s+v.nFS,0);
    if(tf>maxF){ maxF=tf; mesMaxF=MESES_PT[+m]; }
    Object.entries(fMap).forEach(([nome,v])=>{
      if(v.nFS>=2) alertas.push({nome,mes:MESES_PT[+m],tipo:'⛔ FALTA',det:`${v.nFS} faltas/susp + ${v.nAt} atestados`});
      else if(v.nAt>=2) alertas.push({nome,mes:MESES_PT[+m],tipo:'⚠ ATESTADO',det:`${v.nAt} atestados`});
    });
  });
  const alertHtml=alertas.length?alertas.map(a=>`<div class="alert"><div class="an">${a.tipo} — ${a.nome}</div><div class="ad">${a.mes} · ${a.det}</div></div>`).join(''):`<div class="empty"><div class="ei">✅</div>Nenhum alerta</div>`;
  ct.innerHTML=`<div class="pad">
    <div class="sec-title">◄ Relatório Mestre 2026</div>
    <div class="kpi-g">
      <div class="kpi"><div class="kv" style="color:var(--rd)">${alertas.length}</div><div class="kl">Alertas ativos</div></div>
      <div class="kpi"><div class="kv">${mesMaxF.slice(0,3)}</div><div class="kl">Mês com mais faltas</div></div>
    </div>
    <div class="kpi" style="margin-bottom:14px"><div class="kv" style="font-size:18px">${fmtBRL(totalLiq)}</div><div class="kl">Total líquido distribuído no ano</div></div>
    <div class="sec-title">Alertas</div>
    ${alertHtml}</div>`;
}

// ── SAÍDA POOL — HELPERS ──────────────────────────────────────────────────
function getSaidasWD(wd){
  if(wd.saidas&&wd.saidas.length>0) return wd.saidas;
  if(parseFloat(wd.saldoSaida)>0) return [{valor:parseFloat(wd.saldoSaida)||0,motivo:wd.motivo||'',data:''}];
  return [];
}
function confirmarSaida(i){
  const valEl=document.getElementById('sv-'+i);
  const motEl=document.getElementById('sm-'+i);
  const obsEl=document.getElementById('sob-'+i);
  const val=parseBRL(valEl.value);
  if(!val||val<=0){showToast('⚠ Valor inválido');return;}
  const wd=getWD(i);
  const saidas=getSaidasWD(wd).slice();
  const hoje=new Date().toLocaleDateString('pt-BR');

function updDia(fi,d,sel){
  const v=sel.value;
  sel.setAttribute('data-s',v);
  const wd={...getWD(state.semIdx)};
  wd.funcs=[...wd.funcs];
  const f={...wd.funcs[fi]};
  f.dias=[...f.dias]; f.dias[d]=v;
  // Auto-fill period when FÉRIAS or AFASTAMENTO and dates are set
  let autoFilled=false;
  if((v==='FÉRIAS'||v==='AFASTAMENTO')&&f.ferias_ini&&f.ferias_fim){
    const sem=CAL[state.semIdx];
    if(sem){
      const ini=new Date(f.ferias_ini+'T12:00:00');
      const fim=new Date(f.ferias_fim+'T12:00:00');
      const iniY=ini.getFullYear();
      sem.days.forEach((day,di)=>{
        const mm=String(day.m).padStart(2,'0'),dd2=String(day.d).padStart(2,'0');
        let dt=new Date(`${iniY}-${mm}-${dd2}T12:00:00`);
        if(dt<ini) dt=new Date(`${iniY+1}-${mm}-${dd2}T12:00:00`);
        if(dt>=ini&&dt<=fim){ f.dias[di]=v; autoFilled=true; }
      });
    }
  }
  wd.funcs[fi]=f;
  setWD(state.semIdx,wd);
  if(autoFilled){ render(); return; }
  // Recalcular e atualizar só os valores de cota no DOM, sem recriar cards
  const saldo=getSaldoAntes(state.semIdx);
  const calc=calcSemana(wd,saldo);
  wd.funcs.forEach((_,i)=>{
    const fc=document.getElementById('fc-val-liq-'+i);
    if(fc){
      const ai=wd.funcs.slice(0,i).filter(f=>f.nome.trim()).length;
      const fcalc=calc.funcCalc[ai];
      if(fcalc) fc.textContent=fmtBRL(fcalc.liquido);
    }
    for(let dd=0;dd<7;dd++){
      const vEl=document.getElementById(`fc-dia-val-${i}-${dd}`);
      if(vEl){
        const st=wd.funcs[i].dias[dd];
        const ai2=wd.funcs.slice(0,i).filter(f=>f.nome.trim()).length;
        const fc2=calc.funcCalc[ai2];
        const ganha=fc2&&['PRESENTE','HORISTA','JOVEM APRENDIZ','FOLGA','BANCO DE HORAS','FÉRIAS'].includes(st);
        vEl.textContent=ganha?fmtBRLDia(calc.dias[dd].cotaUnit):'';
      }
    }
  });
}

function mergeWD(local,remoto){
  if(!remoto) return local; if(!local) return remoto;
  const tsL=local._lastEdit||0, tsR=remoto._lastEdit||0;
  const rec=tsL>tsR?local:remoto, ant=tsL>tsR?remoto:local;
  const brutos=(rec.brutos&&rec.brutos.some(v=>v!==undefined))?rec.brutos:ant.brutos;
  const maxLen=Math.max((local.funcs||[]).length,(remoto.funcs||[]).length);
  const funcs=[];
  for(let i=0;i<maxLen;i++){
    const fL=local.funcs?.[i],fR=remoto.funcs?.[i];
    const nL=fL?.nome?.trim(),nR=fR?.nome?.trim();
    if(fL&&fL._removidoEm&&!nL&&fL._removidoEm>=tsR){funcs.push(fL);continue;}
    if(fR&&fR._removidoEm&&!nR&&fR._removidoEm>=tsL){funcs.push(fR);continue;}
    if(nL&&!nR) funcs.push(fL);
    else if(!nL&&nR) funcs.push(fR);
    else if(nL&&nR){ const fw=tsL>tsR?fL:fR, fa=tsL>tsR?fR:fL; funcs.push({...fa,...fw}); }
    else funcs.push(fL||fR||{id:i,nome:'',tipo:'CLT / MENSALISTA',dias:Array(7).fill('PRESENTE')});
  }
  return {brutos,funcs,dist:rec.dist!=null?rec.dist:ant.dist,vDist:rec.vDist,saldoSaida:rec.saldoSaida,motivo:rec.motivo||ant.motivo,saidas:rec.saidas||ant.saidas||[],_lastEdit:Math.max(tsL,tsR)};
}
function mergeAllData(local,remoto){
  const merged={...remoto};
  Object.keys(local).forEach(k=>{merged[k]=mergeWD(local[k],remoto[k]);});
  return merged;
}
async function _syncNow(){
  syncStatus='syncing'; atualizarSyncUI();
  try{
    // 1) Ler remoto
    const getRes=await fetch(`${SB_URL}/rest/v1/gn_comissoes?loja=eq.${LOJA}&select=all_data`,{headers:{'apikey':SB_ANON,'Authorization':'Bearer '+SB_ANON}});
    if(!getRes.ok) throw new Error('HTTP '+getRes.status);
    const rows=await getRes.json();
    let remotoAllData={};
    if(rows.length&&rows[0].all_data) remotoAllData=rows[0].all_data;

    // 2) Merge inteligente
    const merged=mergeAllData(state.allData,remotoAllData);
    state.allData=merged;
    sv('allData',state.allData);

    // 3) Proteção anti-perda: conta nomes ativos OU marcados como removidos
    // Remoção com _removidoEm é legítima — não conta como perda
    const contarAtivos=ad=>Object.values(ad||{}).reduce((s,wd)=>
      s+((wd.funcs||[]).filter(f=>f.nome&&f.nome.trim()).length),0);
    const contarRemovidos=ad=>Object.values(ad||{}).reduce((s,wd)=>
      s+((wd.funcs||[]).filter(f=>f._removidoEm&&!f.nome?.trim()).length),0);
    const nAtivosM=contarAtivos(state.allData);
    const nAtivosR=contarAtivos(remotoAllData);
    const nRemovidosM=contarRemovidos(state.allData);
    // Só bloqueia se perdemos ativos SEM ter marcado remoções correspondentes
    if(nAtivosM < nAtivosR && nRemovidosM === 0){
      throw new Error(`Proteção: ativos mesclados (${nAtivosM}) < remotos (${nAtivosR}) sem remoções marcadas`);
    }

    // 4) Salvar
    const res=await fetch(`${SB_URL}/rest/v1/gn_comissoes?loja=eq.${LOJA}`,{
      method:'PATCH',
      headers:{'apikey':SB_ANON,'Authorization':'Bearer '+SB_ANON,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify({all_data:state.allData,updated_at:new Date().toISOString(),updated_by:usuarioAtual})
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    syncStatus='ok'; sv('lastSync',new Date().toISOString()); window._lastSyncErr=null; syncPendente=false;
    render();
  }catch(e){
    syncStatus='err'; window._lastSyncErr=(e.message||String(e));
    console.error('Sync erro:',e.message||e);
  }
  atualizarSyncUI();
}
async function carregarDaNuvem(silent,forcarRemoto){
  // Se há sync pendente, terminar primeiro
  if(syncPendente){ clearTimeout(syncTimer); await _syncNow(); return; }
  if(!silent) { syncStatus='syncing'; atualizarSyncUI(); }
  try{
    const res=await fetch(`${SB_URL}/rest/v1/gn_comissoes?loja=eq.${LOJA}&select=all_data`,{headers:{'apikey':SB_ANON,'Authorization':'Bearer '+SB_ANON}});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const rows=await res.json();
    if(rows.length&&rows[0].all_data&&Object.keys(rows[0].all_data).length){
      const parsed=rows[0].all_data;
      // Sempre merge — nunca sobrescreve local sem comparar timestamps
      state.allData=mergeAllData(state.allData,parsed);
      sv('allData',state.allData);
    }
    syncStatus='ok'; sv('lastSync',new Date().toISOString());
    atualizarSyncUI(); render();
    if(!silent) showToast('✓ Dados atualizados!');
  }catch(e){
    syncStatus='err'; atualizarSyncUI();
    console.error('Erro ao carregar:',e.message||e);
    if(!silent) showToast('Erro: '+(e.message||'sem conexão').slice(0,60));
  }
}
function atualizarSyncUI(){
  const el=document.getElementById('sync-txt'); if(!el) return;
  const last=ld('lastSync','');
  const lastStr=last?'Sync '+new Date(last).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'';
  if(syncStatus==='syncing'){el.className='sync-txt sync-ing';el.textContent='⟳ Sincronizando...';}
  else if(syncStatus==='ok'){el.className='sync-txt sync-ok';el.textContent='✓ '+lastStr;}
  else if(syncStatus==='err'){el.className='sync-txt sync-err';el.textContent='✗ '+(window._lastSyncErr||'Sem conexão').slice(0,35);}
  else{el.className='sync-txt';el.textContent=lastStr;}
}

            +"&senha=eq."+encodeURIComponent(senha)+"&ativo=eq.true";

function renderFuncs(ct,sem){

  const nAtivos=wd.funcs.filter(f=>f.nome.trim()).length;

  wd.funcs.forEach((f,i)=>{if(f.nome.trim()) state.visibleSlots[i]=true;});
  const indicesVisiveis=wd.funcs.map((f,i)=>i).filter(i=>state.visibleSlots[i]);
  const nElegiveis=calc.funcCalc.filter(f=>f.elegivel).length;
  const nComFalta=calc.funcCalc.filter(f=>f.nFS>0).length;
  const totalLiqSem=calc.funcCalc.reduce((s,f)=>s+f.liquido,0);
  let html=`<div class="pad">
    <div class="row-sb" style="margin-bottom:8px">
      <div class="sec-title" style="margin:0">◄ Funcionários — S${String(CAL[state.semIdx].num).padStart(2,'0')}</div>
      <span class="chip">${nAtivos} / ${MAX_FUNC}</span>
    </div>
    ${nAtivos>0?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
      <span style="background:var(--gr-bg);color:var(--gr2);border-radius:20px;padding:3px 10px;font-size:10px;font-weight:700">${nElegiveis} elegíveis</span>
      ${nComFalta>0?`<span style="background:var(--rd-bg);color:var(--rd2);border-radius:20px;padding:3px 10px;font-size:10px;font-weight:700">${nComFalta} com falta</span>`:''}
      <span style="background:rgba(245,217,138,.1);color:var(--gd);border-radius:20px;padding:3px 10px;font-size:10px;font-weight:700">Total líquido: ${fmtBRL(totalLiqSem)}</span>
    </div>`:''}
    <hr class="div" style="margin-bottom:12px">`;
  indicesVisiveis.forEach(i=>{
    const f=wd.funcs[i];
    const atvIdx=wd.funcs.slice(0,i).filter(x=>x.nome.trim()).length;
    const fc=f.nome.trim()?calc.funcCalc[atvIdx]:null;
    const isEleg=fc?.elegivel; const hasFalt=fc&&fc.nFS>0;
    const cls=fc?(isEleg?'eleg':(hasFalt?'falt':'')):''
    const exp=state.expanded[i]||false;
    const diasHtml=sem.days.map((day,d)=>{
      const st=f.dias[d];
      const opts=STATUS.map(s=>`<option value="${s}"${s===st?' selected':''}>${STATUS_ABREV[s]}</option>`).join('');
      const valorDia=['PRESENTE','HORISTA','JOVEM APRENDIZ','FOLGA','BANCO DE HORAS','FÉRIAS'].includes(st)?calc.dias[d].cotaUnit:0;
      return `<div class="dia-c">
        <div class="dia-h">${day.nome}<br>${String(day.d).padStart(2,'0')}</div>
        <select class="dia-sel" data-s="${st}" onchange="updDia(${i},${d},this)">${opts}</select>
        <div class="dia-val" id="fc-dia-val-${i}-${d}">${fmtBRLDia(valorDia)}</div>
      </div>`;
    }).join('');
    const badges=fc?`
      ${isEleg?'<span class="badge b-eleg">Rateio ✓</span>':''}
      ${fc.nFS===1?'<span class="badge b-f50">Mult 50%</span>':''}
      ${fc.nFS>=2?'<span class="badge b-f00">Mult 0%</span>':''}`:'' ;
    const res=fc?`<div class="fc-res">
      <div class="ri"><div class="rl">Cota Base</div><div class="rv" style="color:var(--gr2)">${fmtBRL(fc.AF)}</div></div>
      <div class="ri"><div class="rl">Rateio</div><div class="rv" style="color:var(--gd)">${fmtBRL(fc.rateio)}</div></div>
      <div class="ri"><div class="rl">ADM (−)</div><div class="rv" style="color:var(--gy)">${fmtBRL(fc.adm)}</div></div>
      <div class="ri"><div class="rl">Líquido</div><div class="rv" style="color:${fc.liquido<0?'var(--rd)':'var(--gd)'}">${fmtBRL(fc.liquido)}</div></div>
    </div>`:'' ;
    const hasAfastamento2=f.dias.some(d=>d==='AFASTAMENTO');
    const justHtml2=(hasAfastamento2||f.afastamento_just)?`<div style="padding:8px 14px 10px"><div style="font-size:9px;color:var(--gy);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px">📋 Justificativa Afastamento</div><input type="text" value="${(f.afastamento_just||'').replace(/"/g,'&quot;')}" placeholder="INSS, CID, motivo..." onblur="updAfastamentoJust(${i},this.value)" style="width:100%;box-sizing:border-box;background:var(--bg4);border:1px solid var(--bd2);border-radius:6px;color:var(--txt);padding:6px 8px;font-size:11px;font-family:inherit;"></div>`:'';
    html+=`<div class="fc ${cls}" id="fc-${i}">
      <div class="fc-hdr" onclick="toggleFunc(${i})">
        <div class="fc-num">${i+1}</div>
        <input class="fc-nome" placeholder="Funcionário ${i+1}" value="${f.nome.replace(/"/g,'&quot;')}"
          onclick="event.stopPropagation()" onblur="updNome(${i},this.value)">
        ${fc?`<div class="fc-liq" id="fc-val-liq-${i}">${fmtBRL(fc.liquido)}</div>`:''}
        <div class="fc-arr">${exp?'▲':'▼'}</div>
      </div>
      <div class="fc-body${exp?' open':''}">
        <div class="fc-tipo">
          <select class="tipo-sel" onchange="updTipo(${i},this.value)">
            ${['CLT / MENSALISTA','HORISTA','JOVEM APRENDIZ'].map(t=>`<option${t===f.tipo?' selected':''}>${t}</option>`).join('')}
          </select>
          <div class="badges">${badges}</div>
        </div>
        <div class="dias-g">${diasHtml}</div>
        ${res}
        ${justHtml2}
        <button type="button" class="btn-del-func" onclick="removerFuncionario(${i},this)">🗑️ Excluir funcionário</button>
      </div>
    </div>`;
  });
  if(indicesVisiveis.length<MAX_FUNC){
    html+=`<button class="btn-add-func" onclick="adicionarFuncionario()">+ Adicionar funcionário</button>`;
  }
  html+=`</div>`;
  ct.innerHTML=html;
}

function renderResumo(ct){
  const meses={};CAL.forEach((w,i)=>{if(!meses[w.month])meses[w.month]=[];meses[w.month].push({...w,idx:i});});
  const mesArr=Object.entries(meses).map(([k,v])=>([+k,v]));
  const mi=state.mesIdx<mesArr.length?state.mesIdx:0;
  const [mesNum,semanas]=mesArr[mi];
  const calcs=semanas.map(w=>calcSemana(getWD(w.idx),getSaldoAntes(w.idx)));
  const nomes=[...new Set(semanas.flatMap(w=>getWD(w.idx).funcs.filter(f=>f.nome.trim()).map(f=>f.nome.trim())))];
  const getLiq=(nome,si)=>{
    const wd=getWD(semanas[si].idx);const fi=wd.funcs.findIndex(f=>f.nome.trim()===nome);
    if(fi===-1)return 0;
    const ai=wd.funcs.slice(0,fi).filter(f=>f.nome.trim()).length;
    return calcs[si].funcCalc[ai]?.liquido||0;
  };
  const curCol=semanas.findIndex(w=>w.idx===state.semIdx);
  const thead=`<tr><th>Funcionário</th>${semanas.map((w,ci)=>`<th${ci===curCol?' class="resumo-cur"':''}>S${String(w.num).padStart(2,'0')}</th>`).join('')}<th>Total</th></tr>`;
  const tbody=nomes.map(nome=>{
    const vals=semanas.map((_,i)=>getLiq(nome,i));
    const tot=vals.reduce((s,v)=>s+v,0);
    return `<tr><td>${nome}</td>${vals.map((v,ci)=>`<td${ci===curCol?' class="resumo-cur"':''} style="color:${v<0?'var(--rd)':v>0?'var(--gd)':'var(--gy)'}">${fmtBRL(v)}</td>`).join('')}<td style="color:var(--gd);font-weight:700">${fmtBRL(tot)}</td></tr>`;
  }).join('');
  const totRow=`<tr class="tot"><td>TOTAL</td>${calcs.map((c,ci)=>`<td${ci===curCol?' class="resumo-cur"':''}>${fmtBRL(c.funcCalc.reduce((s,f)=>s+f.liquido,0))}</td>`).join('')}<td>${fmtBRL(calcs.reduce((s,c)=>s+c.funcCalc.reduce((ss,f)=>ss+f.liquido,0),0))}</td></tr>`;
  const mesTabs=mesArr.map(([m],i)=>`<button class="mt${i===mi?' on':''}" onclick="setMesIdx(${i})">${MESES_PT[m].slice(0,3)}</button>`).join('');
  ct.innerHTML=`<div class="pad">
    <div class="mes-tabs">${mesTabs}</div>
    <div class="sec-title">${MESES_PT[mesNum]} 2026</div>
    <div style="overflow-x:auto"><table class="rtbl"><thead>${thead}</thead><tbody>${tbody}${totRow}</tbody></table></div>
    <hr class="div">
    <div class="sec-title">Caixa por semana</div>
    ${semanas.map((w,i)=>`<div class="row-sb" style="background:${w.idx===state.semIdx?'rgba(242,100,25,.08)':'var(--bg2)'};border:1px solid ${w.idx===state.semIdx?'rgba(242,100,25,.3)':'var(--bd)'};border-radius:8px;padding:9px 12px;margin-bottom:5px">
      <span style="font-size:11px;color:${w.idx===state.semIdx?'var(--or)':'var(--gy)'}">S${String(w.num).padStart(2,'0')} · ${w.header}${w.idx===state.semIdx?' ◄':''}${w.idx===state.semIdx?'':''}</span>
      <span class="vv gd">${fmtBRL(getWD(w.idx).brutos.reduce((s,v)=>s+(parseFloat(v)||0),0))}</span>
    </div>`).join('')}
  </div>`;
}
function setMesIdx(i){state.mesIdx=i;renderResumo(document.getElementById('content'));}

function setRankPer(per,mes){state.rankPeriodo=per;if(mes!==undefined)state.rankMes=mes;renderRelatorio(document.getElementById('content'));}
function renderRelatorio(ct){
  const todosMeses=[...new Set(CAL.map(w=>w.month))].sort((a,b)=>a-b);
  const periodoBar=`<div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px">
    <button class="chip${state.rankPeriodo==='ano'?' ok':''}" onclick="setRankPer('ano')">Ano</button>
    ${todosMeses.map(m=>`<button class="chip${state.rankPeriodo==='mes'&&state.rankMes===m?' ok':''}" onclick="setRankPer('mes',${m})">${MESES_PT[String(m)].slice(0,3)}</button>`).join('')}
  </div>`;
  const semsFilter=CAL.map((w,i)=>({...w,idx:i})).filter(w=>state.rankPeriodo==='ano'||w.month===state.rankMes);
  const meses={};semsFilter.forEach(w=>{if(!meses[w.month])meses[w.month]=[];meses[w.month].push(w);});
  let totalLiq=0,mesMaxF='—',maxF=0;const alertas=[];
  const funcAnual={};
  Object.entries(meses).forEach(([m,sems])=>{
    const fMap={};
    sems.forEach(w=>{
      const wd=getWD(w.idx);const calc=calcSemana(wd,getSaldoAntes(w.idx));
      totalLiq+=calc.funcCalc.reduce((s,f)=>s+f.liquido,0);
      wd.funcs.forEach((f,fi)=>{
        if(!f.nome.trim())return;
        if(!fMap[f.nome])fMap[f.nome]={nFS:0,nAt:0};
        fMap[f.nome].nFS+=f.dias.filter(s=>['FALTA','SUSPENSÃO'].includes(s)).length;
        fMap[f.nome].nAt+=f.dias.filter(s=>s==='ATESTADO'||s==='JUSTIFICATIVA').length;
        const ai=wd.funcs.slice(0,fi).filter(fx=>fx.nome.trim()).length;
        const fc=calc.funcCalc[ai];
        if(fc){if(!funcAnual[f.nome])funcAnual[f.nome]=0;funcAnual[f.nome]+=(fc.liquido||0);}
      });
    });
    const tf=Object.values(fMap).reduce((s,v)=>s+v.nFS,0);
    if(tf>maxF){maxF=tf;mesMaxF=MESES_PT[+m];}
    Object.entries(fMap).forEach(([nome,v])=>{
      if(v.nFS>=2)alertas.push({nome,mes:MESES_PT[+m],tipo:'⛔ FALTA',det:`${v.nFS} faltas/susp + ${v.nAt} atestados`});
      else if(v.nAt>=2)alertas.push({nome,mes:MESES_PT[+m],tipo:'⚠ ATESTADO',det:`${v.nAt} atestados`});
    });
  });
  const rankAnual=Object.entries(funcAnual).map(([nome,total])=>({nome,total})).sort((a,b)=>b.total-a.total);
  const medalhas=['🥇','🥈','🥉'];
  const rankHtml=rankAnual.length?rankAnual.map((f,i)=>`
    <div class="row-sb" style="background:var(--bg3);border:1px solid var(--bd2);border-radius:8px;padding:9px 12px;margin-bottom:5px">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:${i<3?'15px':'11px'};font-weight:700;color:var(--gy);min-width:20px">${i<3?medalhas[i]:i+1}</span>
        <span style="font-size:13px;font-weight:600">${f.nome}</span>
      </div>
      <span style="font-size:13px;font-weight:700;font-family:Consolas,monospace;color:var(--gd)">${fmtBRL(f.total)}</span>
    </div>`).join(''):`<div class="empty"><div class="ei">📭</div>Sem dados ainda</div>`;
  const alertHtml=alertas.length?alertas.map(a=>`<div class="alert"><div class="an">${a.tipo} — ${a.nome}</div><div class="ad">${a.mes} · ${a.det}</div></div>`).join(''):`<div class="empty"><div class="ei">✅</div>Nenhum alerta</div>`;
  const tituloRelat=state.rankPeriodo==='mes'?`◄ Relatório — ${MESES_PT[String(state.rankMes)]}`:'◄ Relatório Mestre 2026';
  const rankLabel=state.rankPeriodo==='mes'?`🏅 Ranking — ${MESES_PT[String(state.rankMes)]}`:'🏅 Ranking Anual — Gorjeta Líquida';
  ct.innerHTML=`<div class="pad">
    <div class="sec-title">${tituloRelat}</div>
    ${periodoBar}
    <div class="kpi-g">
      <div class="kpi"><div class="kv" style="color:var(--rd)">${alertas.length}</div><div class="kl">Alertas ativos</div></div>
      <div class="kpi"><div class="kv">${mesMaxF.slice(0,3)}</div><div class="kl">Mês com mais faltas</div></div>
    </div>
    <div class="kpi" style="margin-bottom:14px"><div class="kv" style="font-size:18px">${fmtBRL(totalLiq)}</div><div class="kl">Total líquido distribuído</div></div>
    <div class="sec-title">Alertas</div>
    ${alertHtml}
    <div class="sec-title" style="margin-top:16px">${rankLabel}</div>
    ${rankHtml}</div>`;
}

      <button class="btn-copy" onclick="copiarTexto()">📋 Copiar texto</button>
      <button class="btn-copy" onclick="gerarPDFComissoes()" style="background:rgba(192,57,43,.15);border-color:rgba(192,57,43,.4);color:#e74c3c;">📄 Gerar PDF</button>
    </div>
  </div>`;
}
function setWhaTipo(t){state.whaTipo=t;renderWhatsApp(document.getElementById('content'));}
function getTextoAtual(){
  const t=state.whaTipo;
  if(t==='geral')return gerarTextoGeral();if(t==='semana')return gerarTextoSemana();
  if(t==='individual')return gerarTextoIndividual();if(t==='mes')return gerarTextoMes();
  if(t==='alertas')return gerarTextoAlertas();return '';
}
function enviarWhatsApp(){window.open('https://wa.me/?text='+encodeURIComponent(getTextoAtual()),'_blank');}
function copiarTexto(){
  const txt=getTextoAtual();
  if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>showToast('✓ Copiado!'));
  else{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast('✓ Copiado!');}
}
function gerarPDF(texto,titulo){
  const t=(titulo||'Relatório GN').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const c=(texto||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const html=`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>${t}</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:monospace;font-size:10.5pt;line-height:1.55;color:#000;background:#fff;padding:20px}pre{white-space:pre-wrap;word-break:break-word}h1{font-size:12pt;font-weight:700;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #ccc}@media print{body{padding:0}@page{margin:1.5cm}}</style></head><body><h1>${t}</h1><pre>${c}</pre><script>window.onload=function(){window.print();}<\/script></body></html>`;
  const w=window.open('','_blank');
  if(w){w.document.write(html);w.document.close();}
}
function gerarPDFComissoes(){gerarPDF(getTextoAtual(),'Relatório Gorjetas');}

// renderSaldo, confirmarSaida, removeSaida defined above (first block)

function renderBackup(ct){
  const dataStr=JSON.stringify(state.allData,null,2);
  const dataSize=(new Blob([dataStr]).size/1024).toFixed(1);
  const nSemanas=Object.keys(state.allData).length;
  const nFuncs=[...new Set(Object.values(state.allData).flatMap(wd=>(wd.funcs||[]).filter(f=>f.nome?.trim()).map(f=>f.nome.trim())))].length;
  ct.innerHTML=`<div class="pad">
    <div class="sec-title">◄ Gerenciar Dados</div>
    <div class="bk-card">
      <div class="bk-title">💾 Exportar</div>
      <div class="bk-info">${nSemanas} semanas · ${nFuncs} funcionários · ${dataSize} KB</div>
      <button class="btn-bk btn-save" onclick="exportarDados()">⬇️ Baixar backup (.json)</button>
      <button class="btn-bk btn-save" style="background:#0D3B1F;margin-top:0" onclick="copiarDados()">📋 Copiar dados</button>
    </div>
    <div class="bk-card">
      <div class="bk-title">📂 Importar</div>
      <div class="bk-info">Cole um backup para restaurar todos os dados. ⚠️ Substitui os dados atuais.</div>
      <div id="bk-status" class="bk-status"></div>
      <textarea class="bk-ta" id="bk-import-ta" placeholder="Cole aqui o JSON do backup..."></textarea>
      <button class="btn-bk btn-rest" onclick="importarDados()">⬆️ Restaurar backup</button>
    </div>
    <div class="bk-card">
      <div class="bk-title">🗑️ Limpar</div>
      <div class="bk-info">Remove todos os dados deste dispositivo.</div>
      <button class="btn-bk btn-clear" onclick="limparDados(this)">🗑️ Apagar todos os dados</button>
    </div>
  </div>`;
}
function exportarDados(){
  const dataStr=JSON.stringify({loja:LOJA,exportedAt:new Date().toISOString(),data:state.allData},null,2);
  const blob=new Blob([dataStr],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`GN_${LOJA}_backup_${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url);
  showToast('✓ Arquivo salvo!');
}
function copiarDados(){
  const dataStr=JSON.stringify({loja:LOJA,exportedAt:new Date().toISOString(),data:state.allData},null,2);
  if(navigator.clipboard)navigator.clipboard.writeText(dataStr).then(()=>showToast('✓ Copiado!'));
  else{const ta=document.createElement('textarea');ta.value=dataStr;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);showToast('✓ Copiado!');}
}
function importarDados(){
  const txt=document.getElementById('bk-import-ta').value.trim();
  const st=document.getElementById('bk-status');
  if(!txt){st.className='bk-status err';st.textContent='Cole os dados antes de restaurar.';return;}
  try{
    const parsed=JSON.parse(txt);const data=parsed.data||parsed;
    if(typeof data!=='object')throw new Error('Formato inválido');
    state.allData=data;sv('allData',state.allData);
    st.className='bk-status ok';st.textContent='✓ Dados restaurados!';
    showToast('✓ Restaurado!');setTimeout(()=>render(),1500);
  }catch(e){st.className='bk-status err';st.textContent='❌ JSON inválido.';}
}
function limparDados(btnEl){
  if(btnEl&&!btnEl.dataset.confirmando){
    btnEl.dataset.confirmando='1';const orig=btnEl.innerHTML;
    btnEl.innerHTML='⚠️ Toque de novo p/ confirmar';
    setTimeout(()=>{if(btnEl.dataset.confirmando){delete btnEl.dataset.confirmando;btnEl.innerHTML=orig;}},3000);return;
  }
  state.allData={};sv('allData',{});showToast('✓ Dados apagados');render();
}

function renderLog(ct){
  const rows=logEntries.length
    ?logEntries.slice(0,50).map(e=>`<div class="log-item"><span class="log-user">${e.usuario}</span> · <span class="log-ts">${e.ts}</span> · ${e.semana} · ${e.desc}</div>`).join('')
    :`<div class="empty"><div class="ei">📋</div>Nenhum lançamento</div>`;
  const erroBox=window._lastSyncErr
    ?`<div style="background:var(--rdk);border:1px solid #8B0000;color:var(--rd);padding:10px 12px;border-radius:8px;margin-bottom:12px;font-size:11px;word-break:break-word">⚠️ Último erro: ${window._lastSyncErr}</div>`
    :`<div style="background:#0D3B1F;border:1px solid var(--gr);color:#6FCF97;padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:11px">✓ Sem erros registrados</div>`;
  ct.innerHTML=`<div class="pad">
    <div class="row-sb" style="margin-bottom:10px">
      <div class="sec-title" style="margin:0">◄ Log</div>
      <button onclick="carregarDaNuvem(false,true)" style="background:var(--bl);color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer">↓ Atualizar</button>
    </div>
    ${erroBox}
    <div class="row-sb" style="margin-bottom:10px">
      <span style="font-size:11px;color:var(--gy)">Usuário: ${usuarioAtual}</span>
      <button onclick="trocarUsuario()" style="background:none;border:1px solid var(--bd);color:var(--gy);padding:4px 10px;border-radius:5px;font-size:10px;cursor:pointer">Trocar usuário</button>
    </div>
    ${rows}</div>`;
}

// ── RENDER CENTRAL ────────────────────────────────────────────────
const TABS=[
  {id:'semana',label:'Semana'},{id:'funcs',label:'Funcionários'},
  {id:'pool',label:'Pool'},{id:'resumo',label:'Resumo Mensal'},
  {id:'relatorio',label:'Relatório'},{id:'whatsapp',label:'📲 WhatsApp'},
  {id:'saldo',label:'Saldo Pool'},{id:'backup',label:'💾 Dados'},{id:'log',label:'📋 Log'},
];
function render(){
  const sem=CAL[state.semIdx]||CAL[0];
  document.getElementById('hdr-sem').textContent=String(sem.num).padStart(2,'0');
  document.getElementById('hdr-user').textContent=usuarioAtual;
  atualizarSyncUI();
  const tb=document.getElementById('tab-bar');
  const tabsVisiveis=abasPermitidas?TABS.filter(t=>abasPermitidas.includes(t.id)):TABS;
  tb.innerHTML=tabsVisiveis.map(t=>`<button class="tab${t.id===state.tab?' on':''}" onclick="setTab('${t.id}')">${t.label}</button>`).join('');
  const ct=document.getElementById('content');
  if(state.tab==='semana') renderSemana(ct,sem);
  else if(state.tab==='funcs') renderFuncs(ct,sem);
  else if(state.tab==='pool') renderPool(ct);
  else if(state.tab==='resumo') renderResumo(ct);
  else if(state.tab==='relatorio') renderRelatorio(ct);
  else if(state.tab==='whatsapp') renderWhatsApp(ct);
  else if(state.tab==='saldo') renderSaldo(ct);
  else if(state.tab==='backup') renderBackup(ct);
  else if(state.tab==='log') renderLog(ct);
}
function setTab(t){if(abasPermitidas&&!abasPermitidas.includes(t))return;state.tab=t;sv('tab',t);document.querySelectorAll('.sidebar-link').forEach(l=>l.classList.remove('active'));const sl=document.querySelector(`.sidebar-link[data-sidebar-tab="${t}"]`);if(sl)sl.classList.add('active');render();}
function setSemIdx(i){state.semIdx=Math.max(0,Math.min(CAL.length-1,i));sv('semIdx',state.semIdx);render();}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}
