<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>GN Caixa</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #f0f0f0; min-height: 100vh; }

    /* ── Login ── */
    #tela-login { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .login-box { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; padding: 32px 24px; width: 100%; max-width: 360px; }
    .login-logo { font-size: 40px; text-align: center; margin-bottom: 8px; }
    .login-title { text-align: center; font-size: 20px; font-weight: 800; color: #10B981; margin-bottom: 4px; }
    .login-sub { text-align: center; font-size: 12px; color: #666; margin-bottom: 24px; }
    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .input-group input, .input-group select { width: 100%; background: #111; border: 1px solid #333; border-radius: 10px; padding: 12px 14px; color: #f0f0f0; font-size: 15px; outline: none; }
    .input-group input:focus, .input-group select:focus { border-color: #10B981; }
    .btn-primary { width: 100%; background: #10B981; color: #000; border: none; border-radius: 10px; padding: 14px; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 8px; }
    .btn-primary:hover { background: #059669; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    #loginErro { color: #ef4444; font-size: 12px; text-align: center; margin-top: 10px; min-height: 16px; }

    /* ── Turno ── */
    #tela-turno { display: none; min-height: 100vh; padding: 20px; }
    .turno-header { text-align: center; padding: 24px 0 20px; }
    .turno-header h1 { font-size: 20px; font-weight: 800; color: #10B981; }
    .turno-header p { font-size: 12px; color: #666; margin-top: 4px; }
    .turno-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 16px; padding: 20px; max-width: 400px; margin: 0 auto; }
    .btn-turno { display: block; width: 100%; background: #1f1f1f; border: 2px solid #2a2a2a; border-radius: 12px; padding: 18px 20px; font-size: 18px; font-weight: 700; color: #f0f0f0; cursor: pointer; text-align: center; margin-bottom: 12px; }
    .btn-turno:hover { border-color: #10B981; color: #10B981; }
    .btn-turno span { display: block; font-size: 11px; color: #666; font-weight: 400; margin-top: 4px; }
    .turno-data-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .turno-data-row label { font-size: 12px; color: #888; white-space: nowrap; }
    .turno-data-row input { flex: 1; background: #111; border: 1px solid #333; border-radius: 8px; padding: 8px 10px; color: #f0f0f0; font-size: 14px; outline: none; }
    .turno-data-row input:focus { border-color: #10B981; }
    .btn-logout { background: none; border: none; color: #555; font-size: 12px; cursor: pointer; display: block; margin: 16px auto 0; }
    .btn-logout:hover { color: #888; }

    /* ── App ── */
    #tela-app { display: none; min-height: 100vh; padding-bottom: 70px; }
    .topbar { position: sticky; top: 0; z-index: 100; background: #0f0f0f; border-bottom: 1px solid #1e1e1e; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; }
    .topbar-left h2 { font-size: 15px; font-weight: 800; color: #10B981; }
    .topbar-left p { font-size: 10px; color: #555; margin-top: 1px; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .badge-status { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.3px; }
    .badge-aberto { background: rgba(16,185,129,0.15); color: #10B981; }
    .badge-fechado { background: rgba(234,179,8,0.15); color: #EAB308; }
    .badge-aprovado { background: rgba(99,102,241,0.15); color: #818CF8; }
    .btn-icon { background: none; border: none; color: #555; font-size: 18px; cursor: pointer; padding: 4px; }
    .btn-icon:hover { color: #888; }

    /* Tabs */
    .tabs-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #111; border-top: 1px solid #1e1e1e; display: flex; z-index: 100; }
    .tab-btn { flex: 1; background: none; border: none; color: #555; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; cursor: pointer; padding: 10px 4px 12px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .tab-btn .tab-icon { font-size: 18px; }
    .tab-btn.active { color: #10B981; }
    .tab-content { display: none; padding: 14px 16px; }
    .tab-content.active { display: block; }

    /* Cards */
    .section-card { background: #1a1a1a; border: 1px solid #222; border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
    .section-card-header { padding: 12px 14px; font-size: 12px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #222; display: flex; align-items: center; justify-content: space-between; }
    .section-card-body { padding: 10px 14px; }
    .item-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1e1e1e; }
    .item-row:last-child { border-bottom: none; }
    .item-row-left { display: flex; flex-direction: column; }
    .item-row-label { font-size: 13px; font-weight: 600; color: #f0f0f0; }
    .item-row-sub { font-size: 11px; color: #666; margin-top: 1px; }
    .item-row-right { display: flex; align-items: center; gap: 8px; }
    .item-row-val { font-size: 14px; font-weight: 700; color: #10B981; }
    .item-row-val.neg { color: #ef4444; }
    .btn-del { background: none; border: none; color: #444; font-size: 16px; cursor: pointer; padding: 4px; line-height: 1; }
    .btn-del:hover { color: #ef4444; }
    .empty-state { text-align: center; color: #444; font-size: 13px; padding: 20px; }

    /* Add form */
    .add-form { background: #111; border: 1px solid #222; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
    .add-form-title { font-size: 12px; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
    .form-row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
    .form-field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 100px; }
    .form-field label { font-size: 10px; color: #666; font-weight: 700; text-transform: uppercase; }
    .form-field input, .form-field select { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; padding: 9px 10px; color: #f0f0f0; font-size: 14px; outline: none; width: 100%; }
    .form-field input:focus, .form-field select:focus { border-color: #10B981; }
    .form-field input[type=number] { -moz-appearance: textfield; }
    .form-field input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    .btn-add { background: #10B981; color: #000; border: none; border-radius: 8px; padding: 9px 16px; font-size: 13px; font-weight: 800; cursor: pointer; white-space: nowrap; }
    .btn-add:hover { background: #059669; }

    /* Totals */
    .total-row { display: flex; justify-content: space-between; padding: 8px 0; }
    .total-row.main { border-top: 1px solid #2a2a2a; margin-top: 4px; padding-top: 12px; }
    .total-label { font-size: 13px; color: #888; }
    .total-val { font-size: 14px; font-weight: 800; color: #f0f0f0; }
    .total-val.green { color: #10B981; }
    .total-val.red { color: #ef4444; }
    .total-val.yellow { color: #EAB308; }

    /* Fechar */
    .resumo-section { margin-bottom: 16px; }
    .resumo-title { font-size: 11px; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .dinheiro-input { background: #1a1a1a; border: 1px solid #333; border-radius: 10px; padding: 12px; font-size: 22px; font-weight: 800; color: #f0f0f0; text-align: right; width: 100%; outline: none; }
    .dinheiro-input:focus { border-color: #10B981; }
    .diff-row { display: flex; align-items: center; justify-content: space-between; background: #1a1a1a; border-radius: 10px; padding: 12px 14px; margin-top: 10px; }
    .diff-label { font-size: 12px; color: #888; }
    .diff-val { font-size: 18px; font-weight: 800; }
    .btn-fechar { width: 100%; background: #EAB308; color: #000; border: none; border-radius: 12px; padding: 15px; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 16px; }
    .btn-fechar:hover { background: #ca8a04; }
    .btn-fechar:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-whatsapp { width: 100%; background: #25D366; color: #fff; border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-whatsapp:hover { background: #1ebe5c; }
    .btn-reabrir { width: 100%; background: none; border: 1px solid #333; border-radius: 12px; padding: 12px; font-size: 13px; font-weight: 700; color: #888; cursor: pointer; margin-top: 8px; }
    .btn-reabrir:hover { border-color: #555; color: #aaa; }

    /* Aprovação gerente */
    .aprovacao-box { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 16px; margin-top: 16px; }
    .aprovacao-title { font-size: 13px; font-weight: 800; color: #818CF8; margin-bottom: 12px; }
    .aprovacao-ok { text-align: center; padding: 10px 0; }
    .aprovacao-ok .icon { font-size: 32px; }
    .aprovacao-ok .name { font-size: 14px; font-weight: 800; color: #818CF8; margin-top: 6px; }
    .aprovacao-ok .time { font-size: 11px; color: #555; margin-top: 2px; }
    .aprovacao-ok .obs { font-size: 12px; color: #888; margin-top: 6px; font-style: italic; }
    .btn-aprovar { width: 100%; background: #818CF8; color: #fff; border: none; border-radius: 10px; padding: 13px; font-size: 14px; font-weight: 800; cursor: pointer; margin-top: 8px; }
    .btn-aprovar:hover { background: #6366f1; }

    /* Suprim */
    .suprim-inicial { background: #1a1a1a; border: 1px solid #222; border-radius: 12px; padding: 14px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
    .suprim-inicial-label { font-size: 12px; color: #888; }
    .suprim-inicial-val { font-size: 20px; font-weight: 800; color: #10B981; }

    /* Toast */
    #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #1a1a1a; border: 1px solid #333; border-radius: 20px; padding: 10px 18px; font-size: 13px; font-weight: 600; color: #f0f0f0; z-index: 9999; pointer-events: none; opacity: 0; transition: opacity 0.2s; white-space: nowrap; }
    #toast.show { opacity: 1; }

    /* Loading overlay */
    #loading { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 9999; }
    #loading.show { display: flex; }
    .spinner { width: 36px; height: 36px; border: 3px solid #222; border-top-color: #10B981; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .gorjeta-garcom-total { font-size: 11px; color: #666; }
  </style>
</head>
<body>

<!-- Loading -->
<div id="loading"><div class="spinner"></div></div>

<!-- Toast -->
<div id="toast"></div>

<!-- ═══ TELA LOGIN ═══ -->
<div id="tela-login">
  <div class="login-box">
    <div class="login-logo">💵</div>
    <div class="login-title">GN Caixa</div>
    <div class="login-sub">Fechamento de caixa diário</div>
    <div class="input-group">
      <label>Usuário</label>
      <input id="loginNome" type="text" placeholder="Seu nome" autocomplete="username" />
    </div>
    <div class="input-group">
      <label>Senha</label>
      <input id="loginSenha" type="password" placeholder="••••••" autocomplete="current-password" />
    </div>
    <button class="btn-primary" onclick="fazerLogin()">Entrar</button>
    <div id="loginErro"></div>
  </div>
</div>

<!-- ═══ TELA TURNO ═══ -->
<div id="tela-turno">
  <div class="turno-header">
    <h1>💵 GN Caixa</h1>
    <p id="turno-user-info">Operador</p>
  </div>
  <div class="turno-card">
    <div class="input-group" id="turno-loja-wrap" style="display:none">
      <label>Loja</label>
      <select id="turno-loja"></select>
    </div>
    <div class="turno-data-row">
      <label>Data:</label>
      <input id="turno-data" type="date" />
    </div>
    <button class="btn-turno" onclick="selecionarTurno('DIA')">
      ☀️ Dia
      <span>Turno diurno / almoço</span>
    </button>
    <button class="btn-turno" onclick="selecionarTurno('NOITE')">
      🌙 Noite
      <span>Turno noturno / jantar</span>
    </button>
    <button class="btn-logout" onclick="logout()">← Sair</button>
  </div>
</div>

<!-- ═══ TELA APP ═══ -->
<div id="tela-app">
  <div class="topbar">
    <div class="topbar-left">
      <h2 id="app-title">GN Caixa</h2>
      <p id="app-sub">Loja • Data • Turno</p>
    </div>
    <div class="topbar-right">
      <span id="badge-status" class="badge-status badge-aberto">ABERTO</span>
      <button class="btn-icon" onclick="irParaTurno()" title="Trocar turno">↩</button>
    </div>
  </div>

  <!-- Tab: Recebido -->
  <div id="tab-recebido" class="tab-content active">
    <div class="add-form">
      <div class="add-form-title">+ Adicionar comprovante</div>
      <div class="form-row">
        <div class="form-field">
          <label>Bandeira</label>
          <select id="rec-bandeira">
            <option value="Dinheiro">Dinheiro</option>
            <option value="Pix">Pix</option>
            <option value="Visa Débito">Visa Débito</option>
            <option value="Visa Crédito">Visa Crédito</option>
            <option value="Master Débito">Master Débito</option>
            <option value="Master Crédito">Master Crédito</option>
            <option value="Elo Débito">Elo Débito</option>
            <option value="Elo Crédito">Elo Crédito</option>
            <option value="Amex">Amex</option>
            <option value="Ticket">Ticket</option>
            <option value="Alelo">Alelo</option>
            <option value="Outro">Outro</option>
          </select>
        </div>
        <div class="form-field" style="max-width:130px">
          <label>Valor (R$)</label>
          <input id="rec-valor" type="number" min="0" step="0.01" placeholder="0,00" />
        </div>
        <button class="btn-add" onclick="addComprovante()">+</button>
      </div>
    </div>
    <div id="rec-lista"></div>
    <div class="section-card" id="rec-totais-card" style="display:none">
      <div class="section-card-header">Totais por Bandeira</div>
      <div class="section-card-body" id="rec-totais-body"></div>
    </div>
  </div>

  <!-- Tab: Saídas -->
  <div id="tab-saidas" class="tab-content">
    <div class="add-form">
      <div class="add-form-title">+ Adicionar saída</div>
      <div class="form-row" style="margin-bottom:8px">
        <div class="form-field">
          <label>Categoria</label>
          <select id="saida-cat">
            <option value="Troco">Troco</option>
            <option value="Compra/Insumo">Compra/Insumo</option>
            <option value="Manutenção">Manutenção</option>
            <option value="Outros">Outros</option>
          </select>
        </div>
        <div class="form-field">
          <label>Pago em</label>
          <select id="saida-tipo">
            <option value="dinheiro">Dinheiro</option>
            <option value="cartao">Cartão</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-field">
          <label>Descrição</label>
          <input id="saida-desc" type="text" placeholder="Ex: Troco mesa 5" />
        </div>
        <div class="form-field" style="max-width:110px">
          <label>Valor (R$)</label>
          <input id="saida-valor" type="number" min="0" step="0.01" placeholder="0,00" />
        </div>
        <button class="btn-add" onclick="addDespesa()">+</button>
      </div>
    </div>
    <div id="saidas-lista"></div>
  </div>

  <!-- Tab: Suprim -->
  <div id="tab-suprim" class="tab-content">
    <div class="suprim-inicial">
      <div>
        <div class="suprim-inicial-label">Suprimento Inicial</div>
        <div style="font-size:10px;color:#555;margin-top:2px;">Fundo de caixa</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="suprim-inicial-val" id="suprim-inicial-val">R$ 700,00</div>
        <button id="btn-edit-suprim" onclick="editarSuprimInicial()" style="background:none;border:1px solid #333;border-radius:6px;padding:4px 8px;color:#888;font-size:11px;cursor:pointer;">✏️</button>
      </div>
    </div>
    <div class="add-form">
      <div class="add-form-title">+ Registrar movimentação</div>
      <div class="form-row" style="margin-bottom:8px">
        <div class="form-field">
          <label>Tipo</label>
          <select id="suprim-tipo">
            <option value="Entrada">Entrada (depósito)</option>
            <option value="Sangria">Sangria (retirada)</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-field">
          <label>Descrição</label>
          <input id="suprim-desc" type="text" placeholder="Ex: Troco antecipado" />
        </div>
        <div class="form-field" style="max-width:110px">
          <label>Valor (R$)</label>
          <input id="suprim-valor" type="number" min="0" step="0.01" placeholder="0,00" />
        </div>
        <button class="btn-add" onclick="addSuprimento()">+</button>
      </div>
    </div>
    <div id="suprim-lista"></div>
  </div>

  <!-- Tab: Gorjeta -->
  <div id="tab-gorjeta" class="tab-content">
    <div class="add-form">
      <div class="add-form-title">+ Registrar 10%</div>
      <div class="form-row">
        <div class="form-field" style="max-width:90px">
          <label>Mesa</label>
          <input id="gorj-mesa" type="text" placeholder="Ex: 12" />
        </div>
        <div class="form-field">
          <label>Garçom</label>
          <input id="gorj-garcom" type="text" placeholder="Nome" />
        </div>
        <div class="form-field" style="max-width:110px">
          <label>Valor (R$)</label>
          <input id="gorj-valor" type="number" min="0" step="0.01" placeholder="0,00" />
        </div>
        <button class="btn-add" onclick="addGorjeta()">+</button>
      </div>
    </div>
    <div id="gorjeta-lista"></div>
  </div>

  <!-- Tab: Fechar -->
  <div id="tab-fechar" class="tab-content">
    <div id="fechar-conteudo"></div>
  </div>

  <!-- Bottom nav -->
  <div class="tabs-nav">
    <button class="tab-btn active" id="btn-tab-recebido" onclick="switchTab('recebido')">
      <span class="tab-icon">💳</span>Recebido
    </button>
    <button class="tab-btn" id="btn-tab-saidas" onclick="switchTab('saidas')">
      <span class="tab-icon">📤</span>Saídas
    </button>
    <button class="tab-btn" id="btn-tab-suprim" onclick="switchTab('suprim')">
      <span class="tab-icon">💼</span>Suprim
    </button>
    <button class="tab-btn" id="btn-tab-gorjeta" onclick="switchTab('gorjeta')">
      <span class="tab-icon">🤝</span>10%
    </button>
    <button class="tab-btn" id="btn-tab-fechar" onclick="switchTab('fechar')">
      <span class="tab-icon">🔒</span>Fechar
    </button>
  </div>
</div>

<script>
const SB_URL = 'https://ncxttwvpafajnilpjbol.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jeHR0d3ZwYWZham5pbHBqYm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4NDcyMDEsImV4cCI6MjA5NzQyMzIwMX0.MGDZNGY8GfSzBKAgdR7OhvOeR71i4fj9YseJRhoh5sE';

// ── State ──
let user = null;
let fechamentoId = null;
let fechamento = null;
let comprovantes = [];
let despesas = [];
let suprimentos = [];
let gorjetas = [];
let lojaAtual = '';
let dataAtual = '';
let turnoAtual = '';

const LOJAS = ['CENTRO', 'NORTE', 'SUL', 'LESTE', 'OESTE', 'MATRIZ'];

// ── UUID helper ──
function uuid() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

// ── Supabase ──
async function sbReq(path, opts = {}) {
  const res = await fetch(`${SB_URL}/rest/v1/${path}`, {
    headers: {
      'apikey': SB_KEY,
      'Authorization': `Bearer ${SB_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': opts.prefer || '',
      ...(opts.headers || {}),
    },
    method: opts.method || 'GET',
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (!res.ok) {
    const txt = await res.text();
    throw new Error(txt || res.statusText);
  }
  const ct = res.headers.get('content-type') || '';
  if (ct.includes('application/json') && res.status !== 204) return res.json();
  return null;
}

// ── Helpers ──
function fmt(n) {
  return 'R$ ' + Number(n || 0).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}
function fmtDate(d) {
  if (!d) return '';
  const [y, m, day] = d.split('-');
  return `${day}/${m}/${y}`;
}
function hoje() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function showLoading(v) {
  document.getElementById('loading').classList.toggle('show', v);
}
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}
function $(id) { return document.getElementById(id); }
function show(id) { $(id).style.display = ''; }
function hide(id) { $(id).style.display = 'none'; }

// ── Auth ──
function salvarSessao(u) {
  try { localStorage.setItem('gn_caixa_session', JSON.stringify(u)); } catch(e) {}
}
function carregarSessao() {
  try { return JSON.parse(localStorage.getItem('gn_caixa_session')); } catch(e) { return null; }
}
function limparSessao() {
  try { localStorage.removeItem('gn_caixa_session'); } catch(e) {}
}

async function fazerLogin() {
  const nome = $('loginNome').value.trim();
  const senha = $('loginSenha').value.trim();
  $('loginErro').textContent = '';
  if (!nome || !senha) { $('loginErro').textContent = 'Preencha usuário e senha.'; return; }
  showLoading(true);
  try {
    const rows = await sbReq(`gn_usuarios?nome=ilike.${encodeURIComponent(nome)}&senha=eq.${encodeURIComponent(senha)}&ativo=eq.true&select=nome,cargo,loja,permissoes`);
    if (!rows || rows.length === 0) {
      $('loginErro').textContent = 'Usuário ou senha incorretos.';
      showLoading(false);
      return;
    }
    const u = rows[0];
    const perm = u.permissoes || {};
    if (!perm.caixa && u.cargo !== 'admin' && u.cargo !== 'gerente') {
      $('loginErro').textContent = 'Sem acesso ao GN Caixa. Fale com o administrador.';
      showLoading(false);
      return;
    }
    user = u;
    salvarSessao(u);
    irParaTurno();
  } catch(e) {
    $('loginErro').textContent = 'Erro de conexão: ' + (e.message || e);
  }
  showLoading(false);
}

function logout() {
  limparSessao();
  user = null;
  fechamentoId = null;
  fechamento = null;
  hide('tela-turno');
  hide('tela-app');
  show('tela-login');
  $('tela-login').style.display = 'flex';
  $('loginSenha').value = '';
  $('loginErro').textContent = '';
}

// ── Turno ──
function irParaTurno() {
  hide('tela-app');
  $('tela-login').style.display = 'none';
  $('tela-turno').style.display = 'block';
  $('turno-data').value = hoje();
  $('turno-user-info').textContent = `${user.nome} · ${user.cargo}`;

  const lojaWrap = $('turno-loja-wrap');
  if (user.cargo === 'admin' || user.cargo === 'gerente') {
    lojaWrap.style.display = 'block';
    const sel = $('turno-loja');
    sel.innerHTML = '';
    const lojas = LOJAS;
    if (user.loja && !lojas.includes(user.loja)) lojas.push(user.loja);
    lojas.forEach(l => sel.innerHTML += `<option value="${l}" ${l === user.loja ? 'selected' : ''}>${l}</option>`);
  } else {
    lojaWrap.style.display = 'none';
  }
}

async function selecionarTurno(turno) {
  const data = $('turno-data').value;
  if (!data) { showToast('Selecione a data.'); return; }
  const loja = (user.cargo === 'admin' || user.cargo === 'gerente')
    ? $('turno-loja').value
    : user.loja;
  if (!loja) { showToast('Loja não definida para este usuário.'); return; }

  lojaAtual = loja;
  dataAtual = data;
  turnoAtual = turno;

  showLoading(true);
  try {
    await carregarOuCriarFechamento();
    await carregarItens();
    mostrarApp();
  } catch(e) {
    showToast('Erro ao carregar: ' + (e.message || e));
  }
  showLoading(false);
}

// ── Fechamento ──
async function carregarOuCriarFechamento() {
  const rows = await sbReq(`gn_caixa_fechamento?loja=eq.${encodeURIComponent(lojaAtual)}&data=eq.${dataAtual}&turno=eq.${encodeURIComponent(turnoAtual)}&select=*`);
  if (rows && rows.length > 0) {
    fechamento = rows[0];
    fechamentoId = fechamento.id;
  } else {
    const newFech = await sbReq('gn_caixa_fechamento', {
      method: 'POST',
      prefer: 'return=representation',
      body: {
        id: uuid(),
        loja: lojaAtual,
        data: dataAtual,
        turno: turnoAtual,
        operador: user.nome,
        status: 'ABERTO',
        suprimento_inicial: 700,
        criado_em: new Date().toISOString(),
      },
    });
    fechamento = Array.isArray(newFech) ? newFech[0] : newFech;
    fechamentoId = fechamento.id;
  }
}

async function carregarItens() {
  const [comps, desps, sups, gorjs] = await Promise.all([
    sbReq(`gn_caixa_comprovante?fechamento_id=eq.${fechamentoId}&order=criado_em.asc&select=*`),
    sbReq(`gn_caixa_despesa?fechamento_id=eq.${fechamentoId}&order=criado_em.asc&select=*`),
    sbReq(`gn_caixa_suprimento?fechamento_id=eq.${fechamentoId}&order=criado_em.asc&select=*`),
    sbReq(`gn_caixa_gorjeta?fechamento_id=eq.${fechamentoId}&order=criado_em.asc&select=*`),
  ]);
  comprovantes = comps || [];
  despesas = desps || [];
  suprimentos = sups || [];
  gorjetas = gorjs || [];
}

// ── App ──
function mostrarApp() {
  $('tela-turno').style.display = 'none';
  $('tela-app').style.display = 'block';
  $('app-title').textContent = `${lojaAtual}`;
  $('app-sub').textContent = `${fmtDate(dataAtual)} · ${turnoAtual}`;

function atualizarBadge() {
  const badge = $('badge-status');
  const aprovado = !!fechamento.aprovado_por;
  const s = fechamento.status || 'ABERTO';
  const label = aprovado ? 'APROVADO' : s;
  badge.textContent = label;
  badge.className = 'badge-status badge-' + (aprovado ? 'aprovado' : s.toLowerCase());

function switchTab(tab) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  $(`tab-${tab}`).classList.add('active');
  $(`btn-tab-${tab}`).classList.add('active');
  if (tab === 'recebido') renderRecebido();
  if (tab === 'saidas') renderSaidas();
  if (tab === 'suprim') renderSuprim();
  if (tab === 'gorjeta') renderGorjeta();
  if (tab === 'fechar') renderFechar();
}

// ── Fechar ──
function calcTotais() {
  const totalComp = comprovantes.reduce((a, c) => a + Number(c.valor), 0);
  const totalDinhComp = comprovantes.filter(c => c.bandeira === 'Dinheiro').reduce((a, c) => a + Number(c.valor), 0);
  const totalCartao = comprovantes.filter(c => c.bandeira !== 'Dinheiro').reduce((a, c) => a + Number(c.valor), 0);
  const totalDespDin = despesas.filter(d => d.paga_dinheiro).reduce((a, d) => a + Number(d.valor), 0);
  const totalDespCart = despesas.filter(d => !d.paga_dinheiro).reduce((a, d) => a + Number(d.valor), 0);
  const supInicial = Number(fechamento.suprimento_inicial || 700);
  const totSupEnt = suprimentos.filter(s => s.tipo === 'Entrada').reduce((a, s) => a + Number(s.valor), 0);
  const totSupSan = suprimentos.filter(s => s.tipo === 'Sangria').reduce((a, s) => a + Number(s.valor), 0);
  const totalGorjeta = gorjetas.reduce((a, g) => a + Number(g.valor), 0);

  // Dinheiro esperado = suprimento_inicial + dinheiro recebido - despesas em dinheiro - sangrias + entradas suprimento
  const dinheiroEsperado = supInicial + totalDinhComp - totalDespDin - totSupSan + totSupEnt;

  return { totalComp, totalDinhComp, totalCartao, totalDespDin, totalDespCart, supInicial, totSupEnt, totSupSan, totalGorjeta, dinheiroEsperado };
}

function renderFechar() {
  const t = calcTotais();
  const totalReal = fechamento.total_real !== null && fechamento.total_real !== undefined ? Number(fechamento.total_real) : null;
  const diff = totalReal !== null ? totalReal - t.dinheiroEsperado : null;
  const isFechado = fechamento.status === 'FECHADO';
  const isAprovado = !!(fechamento.aprovado_por);

  $('fechar-conteudo').innerHTML = `
    <div class="resumo-section">
      <div class="resumo-title">Resumo do Turno</div>
      <div class="section-card">
        <div class="section-card-body">
          <div class="total-row"><span class="total-label">Total em Cartão/Pix</span><span class="total-val">${fmt(t.totalCartao - t.totalDespCart)}</span></div>
          <div class="total-row"><span class="total-label">Dinheiro Recebido</span><span class="total-val">${fmt(t.totalDinhComp)}</span></div>
          <div class="total-row"><span class="total-label">Suprimento Inicial</span><span class="total-val">${fmt(t.supInicial)}</span></div>
          ${t.totSupEnt > 0 ? `<div class="total-row"><span class="total-label">Entradas</span><span class="total-val green">+${fmt(t.totSupEnt)}</span></div>` : ''}
          ${t.totSupSan > 0 ? `<div class="total-row"><span class="total-label">Sangrias</span><span class="total-val red">-${fmt(t.totSupSan)}</span></div>` : ''}
          ${t.totalDespDin > 0 ? `<div class="total-row"><span class="total-label">Saídas (Dinheiro)</span><span class="total-val red">-${fmt(t.totalDespDin)}</span></div>` : ''}
          <div class="total-row main"><span class="total-label">Dinheiro Esperado</span><span class="total-val green">${fmt(t.dinheiroEsperado)}</span></div>
          ${t.totalGorjeta > 0 ? `<div class="total-row"><span class="total-label">Total 10% (gorjeta)</span><span class="total-val">${fmt(t.totalGorjeta)}</span></div>` : ''}
        </div>
      </div>
    </div>

    ${!isFechado ? `
    <div class="resumo-section">
      <div class="resumo-title">Dinheiro Físico em Caixa</div>
      <input type="number" class="dinheiro-input" id="inp-total-real"
        placeholder="0,00" step="0.01" min="0"
        value="${totalReal !== null ? totalReal.toFixed(2) : ''}"
        oninput="atualizarDiff()" />
      <div class="diff-row" id="diff-row" style="display:${totalReal !== null ? '' : 'none'}">
        <span class="diff-label">Diferença</span>
        <span class="diff-val" id="diff-val" style="color:${diff === 0 ? '#10B981' : diff > 0 ? '#10B981' : '#ef4444'}">
          ${diff !== null ? (diff >= 0 ? '+' : '') + fmt(diff) : ''}
        </span>
      </div>
      <button class="btn-fechar" onclick="fecharCaixa()">🔒 Fechar Caixa</button>
    </div>` : `
    <div class="resumo-section">
      <div class="resumo-title">Dinheiro Físico Contado</div>
      <div class="section-card">
        <div class="section-card-body">
          <div class="total-row"><span class="total-label">Dinheiro Contado</span><span class="total-val">${fmt(fechamento.total_real)}</span></div>
          <div class="total-row"><span class="total-label">Diferença</span>
            <span class="total-val ${Number(fechamento.total_real) - t.dinheiroEsperado >= 0 ? 'green' : 'red'}">
              ${(Number(fechamento.total_real) - t.dinheiroEsperado >= 0 ? '+' : '')}${fmt(Number(fechamento.total_real) - t.dinheiroEsperado)}
            </span>
          </div>
        </div>
      </div>
    </div>`}

    ${isFechado ? `
    <button class="btn-whatsapp" onclick="compartilharWhatsApp()">
      <span style="font-size:20px">📲</span> Enviar por WhatsApp
    </button>
    ${!isAprovado ? `<button class="btn-reabrir" onclick="reabrirCaixa()">↩ Reabrir Caixa</button>` : ''}
    ` : ''}

    ${(isFechado && !isAprovado && (user.cargo === 'admin' || user.cargo === 'gerente')) ? renderFormAprovacao() : ''}
    ${isAprovado ? renderAprovacaoOk() : ''}
  `;
}

function atualizarDiff() {
  const val = parseFloat($('inp-total-real').value);
  if (isNaN(val)) { $('diff-row').style.display = 'none'; return; }
  const t = calcTotais();
  const diff = val - t.dinheiroEsperado;
  $('diff-row').style.display = '';
  const el = $('diff-val');
  el.textContent = (diff >= 0 ? '+' : '') + fmt(diff);
  el.style.color = diff === 0 ? '#10B981' : diff > 0 ? '#10B981' : '#ef4444';
}

async function fecharCaixa() {
  const val = parseFloat($('inp-total-real').value);
  if (isNaN(val) || val < 0) { showToast('Informe o dinheiro contado.'); return; }
  if (!confirm(`Confirma o fechamento do caixa?\n\nDinheiro contado: ${fmt(val)}`)) return;
  showLoading(true);
  try {
    await sbReq(`gn_caixa_fechamento?id=eq.${fechamentoId}`, {
      method: 'PATCH',
      body: { status: 'FECHADO', total_real: val, gerente: user.nome },
    });
    fechamento.status = 'FECHADO';
    fechamento.total_real = val;
    fechamento.gerente = user.nome;
    atualizarBadge();
    renderFechar();
    showToast('✓ Caixa fechado!');
  } catch(e) { showToast('Erro: ' + (e.message || e)); }
  showLoading(false);
}

async function reabrirCaixa() {
  if (!confirm('Reabrir o caixa para edição?')) return;
  showLoading(true);
  try {
    await sbReq(`gn_caixa_fechamento?id=eq.${fechamentoId}`, {
      method: 'PATCH',
      body: { status: 'ABERTO', aprovado_por: null, aprovado_em: null, obs_gerente: null },
    });
    fechamento.status = 'ABERTO';
    fechamento.aprovado_por = null;
    fechamento.aprovado_em = null;
    fechamento.obs_gerente = null;
    atualizarBadge();
    renderFechar();
    showToast('Caixa reaberto.');
  } catch(e) { showToast('Erro: ' + (e.message || e)); }
  showLoading(false);
}

// ── WhatsApp ──
function compartilharWhatsApp() {
  const t = calcTotais();
  const diff = Number(fechamento.total_real) - t.dinheiroEsperado;
  const diffStr = (diff >= 0 ? '+' : '') + fmt(diff);

  let texto = `💵 *FECHAMENTO DE CAIXA*\n`;
  texto += `📍 ${lojaAtual} · ${turnoAtual}\n`;
  texto += `📅 ${fmtDate(dataAtual)}\n`;
  texto += `👤 Operador: ${fechamento.operador}\n\n`;

  texto += `*RECEBIMENTOS*\n`;
  const bandeiraMap = {};
  comprovantes.forEach(c => { bandeiraMap[c.bandeira] = (bandeiraMap[c.bandeira] || 0) + Number(c.valor); });
  Object.entries(bandeiraMap).forEach(([b, v]) => { texto += `  ${b}: ${fmt(v)}\n`; });
  texto += `  *Total: ${fmt(t.totalComp)}*\n\n`;

  if (despesas.length > 0) {
    texto += `*SAÍDAS*\n`;
    despesas.forEach(d => { texto += `  ${d.descricao || d.categoria}: ${fmt(d.valor)}\n`; });
    texto += '\n';
  }

  if (gorjetas.length > 0) {
    texto += `*GORJETA (10%)*\n`;
    const byGarc = {};
    gorjetas.forEach(g => { byGarc[g.garcom] = (byGarc[g.garcom] || 0) + Number(g.valor); });
    Object.entries(byGarc).forEach(([g, v]) => { texto += `  ${g}: ${fmt(v)}\n`; });
    texto += '\n';
  }

  texto += `*CONFERÊNCIA CAIXA*\n`;
  texto += `  Suprimento inicial: ${fmt(t.supInicial)}\n`;
  texto += `  Dinheiro esperado: ${fmt(t.dinheiroEsperado)}\n`;
  texto += `  Dinheiro contado: ${fmt(fechamento.total_real)}\n`;
  texto += `  Diferença: ${diffStr}\n`;

  if (fechamento.aprovado_por) {
    texto += `\n✓ Conferido por: ${fechamento.aprovado_por}`;
    if (fechamento.obs_gerente) texto += `\nObs: ${fechamento.obs_gerente}`;
  }

  const url = `https://wa.me/?text=${encodeURIComponent(texto)}`;
  window.open(url, '_blank');
}

// ── Aprovação Gerente ──
function renderFormAprovacao() {
  return `<div class="aprovacao-box">
    <div class="aprovacao-title">👔 Conferência do Gerente</div>
    <div class="input-group">
      <label>Sua senha</label>
      <input id="apr-senha" type="password" placeholder="••••••" />
    </div>
    <div class="input-group">
      <label>Observação (opcional)</label>
      <input id="apr-obs" type="text" placeholder="Ex: caixa conferido, tudo ok" />
    </div>
    <button class="btn-aprovar" onclick="aprovarCaixa()">✓ Aprovar Fechamento</button>
  </div>`;
}

function renderAprovacaoOk() {
  const dt = fechamento.aprovado_em ? new Date(fechamento.aprovado_em).toLocaleString('pt-BR') : '';
  return `<div class="aprovacao-box">
    <div class="aprovacao-title">✅ Caixa Aprovado</div>
    <div class="aprovacao-ok">
      <div class="icon">✅</div>
      <div class="name">Aprovado por ${fechamento.aprovado_por}</div>
      <div class="time">${dt}</div>
      ${fechamento.obs_gerente ? `<div class="obs">"${fechamento.obs_gerente}"</div>` : ''}
    </div>
  </div>`;
}

async function aprovarCaixa() {
  const senha = document.getElementById('apr-senha') ? document.getElementById('apr-senha').value.trim() : '';
  if (!senha) { showToast('Informe sua senha.'); return; }
  showLoading(true);
  try {
    const rows = await sbReq(`gn_usuarios?nome=ilike.${encodeURIComponent(user.nome)}&senha=eq.${encodeURIComponent(senha)}&ativo=eq.true&select=nome`);
    if (!rows || rows.length === 0) {
      showToast('Senha incorreta.');
      showLoading(false);
      return;
    }
    const obs = document.getElementById('apr-obs') ? document.getElementById('apr-obs').value.trim() : '';
    await sbReq(`gn_caixa_fechamento?id=eq.${fechamentoId}`, {
      method: 'PATCH',
      body: {
        aprovado_por: user.nome,
        aprovado_em: new Date().toISOString(),
        obs_gerente: obs || null,
      },
    });
    fechamento.aprovado_por = user.nome;
    fechamento.aprovado_em = new Date().toISOString();
    fechamento.obs_gerente = obs || null;
    atualizarBadge();
    renderFechar();
    showToast('✅ Caixa aprovado!');
  } catch(e) { showToast('Erro: ' + (e.message || e)); }
  showLoading(false);
}

// ── Init ──
(function init() {
  const sessao = carregarSessao();
  if (sessao) {
    user = sessao;
    irParaTurno();
  }

  // Enter key on login
  ['loginNome', 'loginSenha'].forEach(id => {
    $(id).addEventListener('keydown', e => { if (e.key === 'Enter') fazerLogin(); });
  });
})();
</script>
</body>
</html>
