<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GN Caixa</title>
<style>
:root {
  --graf: #0D0D1A;
  --graf2: #15152b;
  --graf3: #1e1e3a;
  --laranja: #E8580A;
  --ouro: #F5D98A;
  --ok: #3ecf8e;
  --erro: #ff5a6e;
  --mut: #8f8fb0;
  --linha: #2a2a4a;
  --txt: #e8e8f5;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Courier New', Courier, monospace;
  background: var(--graf);
  color: var(--txt);
  min-height: 100vh;
  font-size: 14px;
  overflow-x: hidden;
}

.hidden { display: none !important; }

#telaLogin {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.logo {
  font-size: 30px;
  font-weight: bold;
  color: var(--laranja);
  letter-spacing: 3px;
  margin-bottom: 4px;
  text-align: center;
}

.logo-sub {
  font-size: 11px;
  color: var(--mut);
  text-transform: uppercase;
  letter-spacing: 4px;
  margin-bottom: 36px;
  text-align: center;
}

.card {
  width: 100%;
  max-width: 360px;
  background: var(--graf2);
  border: 1px solid var(--linha);
  border-radius: 14px;
  padding: 28px 22px;
}

.card label {
  display: block;
  font-size: 10px;
  color: var(--mut);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 6px;
}

.card input {
  width: 100%;
  background: var(--graf3);
  border: 1px solid var(--linha);
  color: var(--txt);
  font-family: inherit;
  font-size: 15px;
  padding: 11px 13px;
  border-radius: 8px;
  margin-bottom: 16px;
  outline: none;
}

.card input:focus { border-color: var(--laranja); }

.btn-pri {
  width: 100%;
  background: var(--laranja);
  color: #fff;
  font-family: inherit;
  font-size: 15px;
  font-weight: bold;
  border: none;
  padding: 13px;
  border-radius: 8px;
  cursor: pointer;
  letter-spacing: 1px;
}

.btn-pri:active { opacity: 0.85; }

.err-txt {
  color: var(--erro);
  font-size: 12px;
  min-height: 18px;
  margin-top: 10px;
  text-align: center;
}

#telaTurno {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.turno-card {
  width: 100%;
  max-width: 380px;
  background: var(--graf2);
  border: 1px solid var(--linha);
  border-radius: 14px;
  padding: 28px 22px;
}

.turno-loja {
  font-size: 22px;
  font-weight: bold;
  color: var(--ouro);
  text-align: center;
  margin-bottom: 4px;
}

.turno-hint {
  font-size: 11px;
  color: var(--mut);
  text-align: center;
  margin-bottom: 20px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.form-group { flex: 1; }

.form-group label {
  display: block;
  font-size: 10px;
  color: var(--mut);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 5px;
}

.form-group input,
.form-group select {
  width: 100%;
  background: var(--graf2);
  border: 1px solid var(--linha);
  color: var(--txt);
  font-family: inherit;
  font-size: 14px;
  padding: 10px 11px;
  border-radius: 8px;
  outline: none;
  appearance: none;
  -webkit-appearance: none;
}

.form-group input:focus,
.form-group select:focus { border-color: var(--laranja); }

.turno-card .form-group input {
  background: var(--graf3);
  margin-bottom: 12px;
}

.turno-ops {
  display: flex;
  gap: 12px;
  margin-bottom: 18px;
}

.turno-op {
  flex: 1;
  padding: 18px 8px;
  background: var(--graf3);
  border: 2px solid var(--linha);
  border-radius: 10px;
  cursor: pointer;
  text-align: center;
  font-family: inherit;
  font-size: 15px;
  font-weight: bold;
  color: var(--mut);
  transition: border-color 0.15s, color 0.15s, background 0.15s;
}

.turno-op.sel {
  border-color: var(--laranja);
  color: var(--laranja);
  background: #2a1008;
}

.turno-op:active { opacity: 0.8; }

.btn-sec {
  width: 100%;
  background: transparent;
  color: var(--mut);
  font-family: inherit;
  font-size: 13px;
  border: 1px solid var(--linha);
  padding: 11px;
  border-radius: 8px;
  cursor: pointer;
  margin-top: 10px;
}

.btn-sec:active { background: var(--graf3); }

#app { min-height: 100vh; display: flex; flex-direction: column; }

.app-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--graf2);
  border-bottom: 1px solid var(--linha);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.hdr-loja { font-size: 15px; font-weight: bold; color: var(--ouro); }
.hdr-data { font-size: 12px; color: var(--mut); margin-left: 4px; }
.hdr-btns { margin-left: auto; display: flex; gap: 8px; flex-shrink: 0; }

.hdr-btn {
  background: var(--graf3);
  border: 1px solid var(--linha);
  color: var(--txt);
  font-family: inherit;
  font-size: 12px;
  padding: 6px 11px;
  border-radius: 6px;
  cursor: pointer;
  white-space: nowrap;
}

.hdr-btn:active { opacity: 0.8; }

.chip {
  display: inline-block;
  font-size: 10px;
  font-weight: bold;
  padding: 3px 8px;
  border-radius: 20px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.chip.dia { background: #1a2a10; color: #7ee87e; }
.chip.noite { background: #0a0a2a; color: #8ab4f8; }

.tabs {
  position: sticky;
  top: 49px;
  z-index: 90;
  background: var(--graf);
  border-bottom: 1px solid var(--linha);
  display: flex;
  overflow-x: auto;
  scrollbar-width: none;
}

.tabs::-webkit-scrollbar { display: none; }

.tab {
  flex: 0 0 auto;
  padding: 9px 14px;
  font-family: inherit;
  font-size: 10px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--mut);
  cursor: pointer;
  white-space: nowrap;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  text-align: center;
}

.tab.on { color: var(--laranja); border-bottom-color: var(--laranja); }

.tab .tc {
  display: block;
  font-size: 12px;
  font-weight: bold;
  color: var(--ouro);
  margin-top: 1px;
}

.tab.on .tc { color: var(--laranja); }

.pane { padding: 14px 14px 80px; }

#bandGrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
  gap: 8px;
  margin-bottom: 20px;
}

.band {
  background: var(--graf2);
  border: 1px solid var(--linha);
  border-radius: 10px;
  padding: 10px 8px;
  cursor: pointer;
  font-family: inherit;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 2px;
  transition: border-color 0.12s;
}

.band:active { border-color: var(--laranja); opacity: 0.85; }
.band.dinheiro { border-color: var(--ouro); }
.band .cod { font-size: 9px; color: var(--mut); text-transform: uppercase; }
.band .nm { font-size: 12px; color: var(--txt); font-weight: bold; }
.band .tot { font-size: 13px; color: var(--ouro); font-weight: bold; margin-top: 4px; }

.section-title {
  font-size: 10px;
  color: var(--mut);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin: 16px 0 10px;
}

.linha-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 0;
  border-bottom: 1px solid var(--linha);
}

.linha-item .desc { flex: 1; font-size: 13px; min-width: 0; }
.linha-item .desc small { display: block; font-size: 10px; color: var(--mut); margin-top: 2px; }
.linha-item .val { font-size: 14px; color: var(--ouro); font-weight: bold; flex-shrink: 0; }

.linha-item .del {
  background: none;
  border: none;
  color: var(--erro);
  cursor: pointer;
  font-size: 15px;
  padding: 2px 4px;
  flex-shrink: 0;
  line-height: 1;
}

.vazio { color: var(--mut); font-size: 13px; padding: 18px 0; text-align: center; }

.form-row {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
  align-items: flex-end;
}

.btn-add {
  background: var(--laranja);
  border: none;
  color: #fff;
  font-family: inherit;
  font-size: 22px;
  width: 44px;
  height: 42px;
  border-radius: 8px;
  cursor: pointer;
  flex-shrink: 0;
  font-weight: bold;
  line-height: 1;
}

.btn-add:active { opacity: 0.85; }

.btn-check {
  background: var(--graf3);
  border: 1px solid var(--linha);
  color: var(--ok);
  font-family: inherit;
  font-size: 16px;
  width: 44px;
  height: 42px;
  border-radius: 8px;
  cursor: pointer;
  flex-shrink: 0;
  font-weight: bold;
}

.btn-check:active { opacity: 0.8; }

.supr-box {
  background: var(--graf2);
  border: 1px solid var(--linha);
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 16px;
}

.supr-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 5px 0;
  font-size: 13px;
}

.supr-row .sv { color: var(--ouro); font-weight: bold; }

.supr-row.tot {
  border-bottom: 1px solid var(--linha);
  margin-bottom: 6px;
  padding-bottom: 10px;
  font-weight: bold;
  font-size: 14px;
}

.dez-box {
  background: var(--graf2);
  border: 1px solid var(--linha);
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.dez-box .dlabel { font-size: 11px; color: var(--mut); margin-bottom: 4px; }
.dez-box .dval { font-size: 22px; font-weight: bold; color: var(--ok); }

.secao { margin-bottom: 20px; }

.secao h3 {
  font-size: 10px;
  color: var(--mut);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 10px;
}

.rl {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 7px 10px;
  border-radius: 6px;
  font-size: 13px;
}

.rl + .rl { margin-top: 2px; }
.rl.forte { background: var(--graf3); font-weight: bold; color: var(--ouro); }
.rl.dim { color: var(--mut); }
.rl .v { font-weight: bold; }

.dif {
  border-radius: 10px;
  padding: 16px;
  text-align: center;
  margin: 14px 0;
}

.dif .dlbl { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
.dif .n { font-size: 26px; font-weight: bold; }

.dif.zero { background: var(--graf3); }
.dif.zero .dlbl { color: var(--mut); }
.dif.zero .n { color: var(--mut); }

.dif.ok { background: #0a2818; }
.dif.ok .dlbl { color: var(--ok); }
.dif.ok .n { color: var(--ok); }

.dif.falta { background: #2a080e; }
.dif.falta .dlbl { color: var(--erro); }
.dif.falta .n { color: var(--erro); }

.btn-whats {
  width: 100%;
  background: #128c7e;
  color: #fff;
  border: none;
  font-family: inherit;
  font-size: 14px;
  font-weight: bold;
  padding: 13px 20px;
  border-radius: 8px;
  cursor: pointer;
  margin-bottom: 10px;
  letter-spacing: 0.5px;
}

.btn-whats:active { opacity: 0.85; }

.btn-fechar {
  width: 100%;
  background: var(--graf3);
  color: var(--txt);
  border: 1px solid var(--linha);
  font-family: inherit;
  font-size: 14px;
  font-weight: bold;
  padding: 13px 20px;
  border-radius: 8px;
  cursor: pointer;
}

.btn-fechar:active { opacity: 0.85; }

.hist-item {
  background: var(--graf2);
  border: 1px solid var(--linha);
  border-radius: 10px;
  padding: 13px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}

.hi-meta { font-size: 11px; color: var(--mut); margin-top: 3px; }
.hi-right { text-align: right; flex-shrink: 0; }
.hi-val { color: var(--ouro); font-weight: bold; font-size: 14px; margin-top: 4px; }
.hist-sts { font-size: 10px; padding: 2px 7px; border-radius: 10px; display: inline-block; }
.hs-ok { background: #12301f; color: var(--ok); }
.hs-warn { background: #320f14; color: var(--erro); }

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.78);
  display: flex;
  align-items: flex-end;
  z-index: 200;
}

.modal-sheet {
  width: 100%;
  background: var(--graf2);
  border-radius: 16px 16px 0 0;
  padding: 24px 20px 32px;
  border-top: 1px solid var(--linha);
}

.modal-nm { font-size: 20px; font-weight: bold; color: var(--ouro); margin-bottom: 4px; }
.modal-cod { font-size: 12px; color: var(--mut); margin-bottom: 20px; }

.modal-input {
  width: 100%;
  background: var(--graf3);
  border: 1px solid var(--linha);
  color: var(--txt);
  font-family: inherit;
  font-size: 24px;
  padding: 13px 15px;
  border-radius: 10px;
  outline: none;
  margin-bottom: 14px;
  text-align: right;
}

.modal-input:focus { border-color: var(--laranja); }

.modal-btns { display: flex; gap: 10px; }

.btn-cancel {
  flex: 1;
  background: var(--graf3);
  border: 1px solid var(--linha);
  color: var(--mut);
  font-family: inherit;
  font-size: 15px;
  padding: 13px;
  border-radius: 8px;
  cursor: pointer;
}

.btn-cancel:active { opacity: 0.8; }

.btn-ok {
  flex: 2;
  background: var(--laranja);
  border: none;
  color: #fff;
  font-family: inherit;
  font-size: 15px;
  font-weight: bold;
  padding: 13px;
  border-radius: 8px;
  cursor: pointer;
}

.btn-ok:active { opacity: 0.85; }

#toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: var(--graf3);
  border: 1px solid var(--linha);
  color: var(--txt);
  font-size: 13px;
  padding: 10px 22px;
  border-radius: 20px;
  opacity: 0;
  transition: opacity 0.2s, transform 0.2s;
  z-index: 300;
  white-space: nowrap;
  pointer-events: none;
}

#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

select option { background: var(--graf2); color: var(--txt); }
</style>
</head>
<body>

<div id="telaLogin">
  <div class="logo">GN CAIXA</div>
  <div class="logo-sub">Gigante Nordestino</div>
  <div class="card">
    <label for="loginNome">Usuário</label>
    <input id="loginNome" type="text" autocomplete="username" placeholder="Seu nome">
    <label for="loginSenha">Senha</label>
    <input id="loginSenha" type="password" autocomplete="current-password" placeholder="••••••">
    <button class="btn-pri" onclick="fazerLogin()">Entrar</button>
    <div class="err-txt" id="loginErro"></div>
  </div>
</div>

<div id="telaTurno" class="hidden">
  <div class="turno-card">
    <div class="turno-loja" id="turnoLoja">—</div>
    <div id="lojaPickRow" class="form-group" style="display:none;margin-top:12px">
      <label>Loja</label>
      <select id="lojaSel" onchange="escolherLojaCaixa(this.value)">
        <option value="">Selecione…</option>
        <option value="BANGU">Bangu</option>
        <option value="CAXIAS">Caxias</option>
        <option value="SÃO GONÇALO">São Gonçalo</option>
        <option value="NORTE SHOPPING">Norte Shopping</option>
        <option value="BOULEVARD">Boulevard</option>
        <option value="RANCHO">Rancho</option>
        <option value="PEDREIRA">Pedreira</option>
        <option value="NOVA AMERICA">Nova América</option>
        <option value="CAMPO GRANDE">Campo Grande</option>
        <option value="ITAQUERA">Itaquera</option>
        <option value="GUARULHOS">Guarulhos</option>
      </select>
    </div>
    <div class="turno-hint">Selecione o turno</div>
    <div class="form-group">
      <label>Data</label>
      <input id="turnoData" type="date">
    </div>
    <div class="turno-ops">
      <button class="turno-op" data-t="DIA" onclick="selTurno('DIA')">DIA</button>
      <button class="turno-op" data-t="NOITE" onclick="selTurno('NOITE')">NOITE</button>
    </div>
    <button class="btn-pri" onclick="abrirCaixa()">Abrir caixa</button>
    <div class="err-txt" id="turnoErro"></div>
    <button class="btn-sec" onclick="logout()">Trocar usuário</button>
  </div>
</div>

<div id="app" class="hidden">

  <div class="app-header">
    <span class="hdr-loja" id="tLoja"></span>
    <span class="hdr-data" id="tData"></span>
    <span id="tChip"></span>
    <div class="hdr-btns">
      <button class="hdr-btn" onclick="voltarTurno()">↩ Turno</button>
      <button class="hdr-btn" onclick="logout()">Sair</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab on" data-p="receb" onclick="irPara('receb')">
      Recebido<span class="tc" id="tabReceb">R$0</span>
    </button>
    <button class="tab" data-p="saidas" onclick="irPara('saidas')">
      Saídas<span class="tc" id="tabSaidas">R$0</span>
    </button>
    <button class="tab" data-p="supr" onclick="irPara('supr')">
      Suprim.<span class="tc" id="tabSupr">R$0</span>
    </button>
    <button class="tab" data-p="dez" onclick="irPara('dez')">
      10%<span class="tc" id="tabDez">R$0</span>
    </button>
    <button class="tab" data-p="fechar" onclick="irPara('fechar')">
      Fechar<span class="tc">—</span>
    </button>
    <button class="tab" data-p="hist" onclick="irPara('hist')">
      Histórico<span class="tc">—</span>
    </button>
  </div>

  <div class="pane" id="pane-receb">
    <div id="bandGrid"></div>
    <div class="section-title">Lançamentos</div>
    <div id="listaReceb"></div>
  </div>

  <div class="pane hidden" id="pane-saidas">
    <div class="form-row">
      <div class="form-group">
        <label>Categoria</label>
        <select id="saidaCat"></select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Descrição</label>
        <input id="saidaNome" type="text" placeholder="Opcional">
      </div>
      <div class="form-group" style="max-width:120px">
        <label>Valor</label>
        <input id="saidaVal" type="text" inputmode="decimal" placeholder="0,00">
      </div>
      <button class="btn-add" onclick="addSaida()">+</button>
    </div>
    <div class="section-title">Saídas registradas</div>
    <div id="listaSaidas"></div>
  </div>

  <div class="pane hidden" id="pane-supr">
    <div class="supr-box">
      <div class="supr-row tot">
        <span>Fundo de caixa</span><span class="sv" id="suprFundoTotal">R$ 0,00</span>
      </div>
      <div class="supr-row">
        <span>Em notas</span><span class="sv" id="suprNotas">R$ 0,00</span>
      </div>
      <div class="supr-row">
        <span>Em dinheiro</span><span class="sv" id="suprDinh">R$ 0,00</span>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Fundo total (R$)</label>
        <input id="fundoInput" type="text" inputmode="decimal" placeholder="700,00">
      </div>
      <button class="btn-check" onclick="salvarFundo()">✓</button>
    </div>
    <div class="section-title">Notas no suprimento</div>
    <div class="form-row">
      <div class="form-group">
        <label>Descrição</label>
        <input id="suprDesc" type="text" placeholder="Ex: nota R$50">
      </div>
      <div class="form-group" style="max-width:120px">
        <label>Valor</label>
        <input id="suprVal" type="text" inputmode="decimal" placeholder="0,00">
      </div>
      <button class="btn-add" onclick="addSuprNota()">+</button>
    </div>
    <div id="listaSupr"></div>
  </div>

  <div class="pane hidden" id="pane-dez">
    <div class="dez-box">
      <div>
        <div class="dlabel">Base consumo</div>
        <div style="font-size:15px;font-weight:bold;color:var(--txt);margin-top:2px" id="dezBase">R$ 0,00</div>
      </div>
      <div style="text-align:right">
        <div class="dlabel">Repique (10%)</div>
        <div class="dval" id="dezRep">R$ 0,00</div>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Mesa</label>

        <input id="dezGarcom" type="text" placeholder="Nome">

  <div class="pane hidden" id="pane-fechar">
    <div class="secao">
      <h3>Resumo geral</h3>
      <div id="resGeral"></div>
    </div>
    <div class="secao">
      <h3>Cartões</h3>
      <div id="resCartoes"></div>
    </div>
    <div class="secao">
      <h3>Conferência</h3>
      <div class="form-group" style="margin-bottom:0">
        <label>Total real contado (R$)</label>
        <input id="totalReal" type="text" inputmode="decimal" placeholder="0,00" oninput="calcDif()">
      </div>
      <div class="dif zero" id="difBox">
        <div class="dlbl">Diferença</div>
        <div class="n">R$ 0,00</div>
      </div>

    <button class="btn-whats" onclick="enviarWhats()">📲 Enviar WhatsApp</button>
    <button class="btn-fechar" id="btnFechar" onclick="fecharCaixa()">Marcar caixa como FECHADO</button>
    <div class="err-txt" id="fecharErro"></div>
  </div>

  <div class="pane hidden" id="pane-hist">
    <div class="section-title">Últimos 30 turnos</div>
    <div id="listaHist"><div class="vazio">—</div></div>
  </div>

</div>

<div class="modal-overlay hidden" id="modalBand" onclick="if(event.target===this)fecharModal()">
  <div class="modal-sheet">
    <div class="modal-nm" id="modalNm"></div>
    <div class="modal-cod" id="modalCod"></div>
    <input class="modal-input" id="modalVal" type="text" inputmode="decimal" placeholder="0,00">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="btn-ok" onclick="confirmarBand()">Lançar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const SB_URL = 'https://ncxttwvpafajnilpjbol.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jeHR0d3ZwYWZham5pbHBqYm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4NDcyMDEsImV4cCI6MjA5NzQyMzIwMX0.MGDZNGY8GfSzBKAgdR7OhvOeR71i4fj9YseJRhoh5sE';
const SESSION_KEY = 'gn_session_v1';
const TTL = 43200000;

const ENTRADAS = [
  {k:'Mastercard Crédito',cod:'6'},{k:'Mastercard Débito',cod:'8'},
  {k:'Elo Débito',cod:'16'},{k:'Elo Crédito',cod:'17'},
  {k:'Visa Crédito',cod:'5'},{k:'Visa Débito',cod:'7'},
  {k:'Ticket Restaurante',cod:'11'},{k:'Amex',cod:'4'},
  {k:'Vale Refeição',cod:'—'},{k:'Alelo',cod:'9'},
  {k:'Pix',cod:'12'},{k:'Sodexo',cod:'10'},
  {k:'Hipercard',cod:'3'},{k:'IFOOD',cod:'—'},
  {k:'OUTROS',cod:'—'},{k:'Dinheiro',cod:'—'}
];
const NAO_CARTAO = ['Dinheiro','IFOOD','Vale Refeição','OUTROS'];

const SAIDAS = [
  ['taxa_cartao','Taxa Cartão'],['gorjeta_garcom','Gorjeta Garçom'],
  ['manutencao','Manutenção'],['material_limpeza','Material Limpeza'],
  ['descartavel','Descartável'],['entrega_motoboy','Entrega Motoboy'],
  ['troco','Troco'],['alimentacao','Alimentação Equipe'],
  ['estacionamento','Estacionamento'],['transporte','Transporte'],
  ['outros','Outros'],['fruta_verdura','Fruta/Verdura'],
  ['condominio','Condomínio'],['insumo','Insumo']
];

const S = { user: null, loja: null, turnoSel: null, fech: null, comprovantes: [], saidas: [], supr: [], notas10: [], bandAtiva: null };

function $(id) { return document.getElementById(id); }

async function sb(path, opts = {}) {
  const url = `${SB_URL}/rest/v1/${path}`;
  const headers = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };
  if (opts.prefer) headers['Prefer'] = opts.prefer;
  const res = await fetch(url, { method: opts.method || 'GET', headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (!res.ok) { const t = await res.text(); throw new Error(t); }
  if (res.status === 204) return [];
  return res.json();
}

function uuid() { return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)); }

function money(v) { return 'R$ ' + Number(v || 0).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function parseMoney(s) { return parseFloat(String(s).replace(/\./g,'').replace(',','.')) || 0; }
function short(v) { const n = Math.abs(Number(v||0)); return n >= 1000 ? 'R$'+Math.round(n/1000)+'k' : 'R$'+Math.round(n); }
function hoje() { return new Date().toISOString().split('T')[0]; }

const totEntradaK = k => S.comprovantes.filter(c => c.bandeira === k).reduce((a, c) => a + Number(c.valor), 0);
const totEntradas = () => S.comprovantes.reduce((a, c) => a + Number(c.valor), 0);
const totSaidas = () => S.saidas.reduce((a, s) => a + Number(s.valor), 0);
const fundo = () => Number(S.fech?.suprimento_inicial) || 700;
const suprNotas = () => S.supr.reduce((a, s) => a + Number(s.valor), 0);
const suprDinheiro = () => Math.max(0, fundo() - suprNotas());
const totalGeral = () => totEntradas() - totSaidas() + suprDinheiro();
const totCartoes = () => S.comprovantes.filter(c => !NAO_CARTAO.includes(c.bandeira)).reduce((a, c) => a + Number(c.valor), 0);
const repique = () => { const base = S.notas10.reduce((a, n) => a + Number(n.valor), 0); return base * 0.10; };
const cssId = s => s.replace(/[^a-zA-Z]/g, '');

function toast(msg) {
  const el = $('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

async function fazerLogin() {
  const nome = $('loginNome').value.trim();
  const senha = $('loginSenha').value.trim();
  $('loginErro').textContent = '';
  if (!nome || !senha) { $('loginErro').textContent = 'Preencha os campos.'; return; }
  try {
    const rows = await sb(`gn_usuarios?nome=ilike.${encodeURIComponent(nome)}&senha=eq.${encodeURIComponent(senha)}&ativo=eq.true&select=nome,cargo,loja,permissoes`);
    if (!rows.length) { $('loginErro').textContent = 'Usuário ou senha incorretos.'; return; }
    const u = rows[0];
    const perm = u.permissoes || {};
    if (!perm.caixa && u.cargo !== 'admin' && u.cargo !== 'gerente' && u.cargo !== 'mestre') {
      $('loginErro').textContent = 'Sem acesso ao GN Caixa.'; return;
    }
    S.user = u;
    const nav2 = JSON.parse(localStorage.getItem('gn_nav_loja') || 'null');
    const last2 = JSON.parse(localStorage.getItem('gn_last_loja') || 'null');
    const lojaEf2 = u.loja !== 'GERAL' ? u.loja :
                    (nav2 && Date.now() - nav2.ts < 60000) ? nav2.loja :
                    (last2 && Date.now() - last2.ts < TTL) ? last2.loja : 'GERAL';
    S.loja = lojaEf2 === 'GERAL' ? '' : lojaEf2;
    localStorage.setItem(SESSION_KEY, JSON.stringify({ ...u, ts: Date.now() }));
    $('turnoLoja').textContent = S.loja || '— Selecione a loja —';
    if (!S.loja) $('lojaPickRow').style.display = 'block';
    $('turnoData').value = hoje();
    $('telaLogin').classList.add('hidden');
    $('telaTurno').classList.remove('hidden');
  } catch(e) { $('loginErro').textContent = 'Erro de conexão.'; }
}

function selTurno(t) {
  S.turnoSel = t;
  document.querySelectorAll('.turno-op').forEach(o => o.classList.toggle('sel', o.dataset.t === t));
}

async function abrirCaixa() {
  $('turnoErro').textContent = '';
  const data = $('turnoData').value;
  if (!data || !S.turnoSel) { $('turnoErro').textContent = 'Escolha data e turno.'; return; }
  try {
    let f = await sb(`gn_caixa_fechamento?loja=eq.${encodeURIComponent(S.loja)}&data=eq.${data}&turno=eq.${S.turnoSel}&select=*`);
    if (f && f.length) {
      S.fech = f[0];
    } else {
      const novo = await sb('gn_caixa_fechamento', { method: 'POST', prefer: 'return=representation',
        body: { id: uuid(), loja: S.loja, data, turno: S.turnoSel, operador: S.user.nome, status: 'ABERTO', criado_em: new Date().toISOString() }
      });
      S.fech = novo[0];
    }
    await carregarFilhos();
    entrarApp();
  } catch(e) { $('turnoErro').textContent = 'Não abriu o caixa. ' + e.message; }
}

async function carregarFilhos() {
  const fid = S.fech.id;
  const [c, s, n, d] = await Promise.all([
    sb(`gn_caixa_comprovante?fechamento_id=eq.${fid}&select=*&order=criado_em`),
    sb(`gn_caixa_despesa?fechamento_id=eq.${fid}&select=*&order=criado_em`),
    sb(`gn_caixa_suprimento?fechamento_id=eq.${fid}&select=*&order=criado_em`),
    sb(`gn_caixa_gorjeta?fechamento_id=eq.${fid}&select=*&order=criado_em`),
  ]);
  S.comprovantes = c || []; S.saidas = s || []; S.supr = n || []; S.notas10 = d || [];
}

function entrarApp() {
  $('telaTurno').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('tLoja').textContent = S.loja;
  $('tData').textContent = S.fech.data.split('-').reverse().join('/');
  $('tChip').innerHTML = `<span class="chip ${S.turnoSel.toLowerCase()}">${S.turnoSel}</span>`;
  $('bandGrid').innerHTML = ENTRADAS.map(b => `
    <button class="band ${b.k === 'Dinheiro' ? 'dinheiro' : ''}" onclick="abrirModal('${b.k.replace(/'/g,"\\'")}')">
      <span class="cod">${b.cod === '—' ? 'manual' : 'cód ' + b.cod}</span>
      <span class="nm">${b.k}</span><span class="tot" id="bt-${cssId(b.k)}">R$ 0,00</span>
    </button>`).join('');
  $('saidaCat').innerHTML = SAIDAS.map(c => `<option value="${c[0]}">${c[1]}</option>`).join('');
  $('fundoInput').value = String(Number(S.fech.suprimento_inicial) || 700).replace('.', ',');
  if (S.fech.total_real != null) $('totalReal').value = String(S.fech.total_real).replace('.', ',');
  renderTudo(); irPara('receb');
}

function irPara(p) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.p === p));
  document.querySelectorAll('.pane').forEach(pn => pn.classList.add('hidden'));
  $('pane-' + p).classList.remove('hidden');
  if (p === 'fechar') renderFechar();
  if (p === 'hist') carregarHistorico();
  window.scrollTo(0, 0);
}

function voltarTurno() {
  S.fech = null; S.turnoSel = null; S.comprovantes = []; S.saidas = []; S.supr = []; S.notas10 = [];
  document.querySelectorAll('.turno-op').forEach(o => o.classList.remove('sel'));
  $('app').classList.add('hidden');
  $('telaTurno').classList.remove('hidden');
}

function renderTudo() {
  $('tabReceb').textContent = short(totEntradas());
  $('tabSaidas').textContent = short(totSaidas());
  $('tabSupr').textContent = short(fundo());
  $('tabDez').textContent = short(repique());

  ENTRADAS.forEach(b => {
    const el = document.getElementById('bt-' + cssId(b.k));
    if (el) el.textContent = money(totEntradaK(b.k));
  });

  const saidaMap = Object.fromEntries(SAIDAS);
  $('listaReceb').innerHTML = S.comprovantes.length ? S.comprovantes.slice().reverse().map(c => {
    const b = ENTRADAS.find(x => x.k === c.bandeira) || { cod: '—' };
    return `<div class="linha-item"><div class="desc">${c.bandeira}<small>${b.cod === '—' ? 'manual' : 'cód ' + b.cod}</small></div>
    <div class="val">${money(c.valor)}</div><button class="del" onclick="excluir('gn_caixa_comprovante','${c.id}','comprovantes')">✕</button></div>`;
  }).join('') : '<div class="vazio">Nenhum recebimento.</div>';

  $('listaSaidas').innerHTML = S.saidas.length ? S.saidas.slice().reverse().map(s =>
    `<div class="linha-item"><div class="desc">${(saidaMap[s.categoria] || s.categoria)}<small>${s.nome || ''}</small></div>
    <div class="val">${money(s.valor)}</div><button class="del" onclick="excluir('gn_caixa_despesa','${s.id}','saidas')">✕</button></div>`).join('')
    : '<div class="vazio">Nenhuma saída.</div>';

  $('listaSupr').innerHTML = S.supr.length ? S.supr.slice().reverse().map(s =>
    `<div class="linha-item"><div class="desc">Nota<small>${s.descricao || ''}</small></div>
    <div class="val">${money(s.valor)}</div><button class="del" onclick="excluir('gn_caixa_suprimento','${s.id}','supr')">✕</button></div>`).join('')
    : '<div class="vazio">Fundo todo em dinheiro.</div>';

  $('listaDez').innerHTML = S.notas10.length ? S.notas10.slice().reverse().map(n =>
    `<div class="linha-item"><div class="desc">Mesa ${n.mesa || '—'}<small>${n.garcom || ''}</small></div>
    <div class="val">${money(n.valor)}</div><button class="del" onclick="excluir('gn_caixa_gorjeta','${n.id}','notas10')">✕</button></div>`).join('')
    : '<div class="vazio">Sem notas.</div>';

  $('suprFundoTotal').textContent = money(fundo());
  $('suprNotas').textContent = money(suprNotas());
  $('suprDinh').textContent = money(suprDinheiro());
  $('dezBase').textContent = money(S.notas10.reduce((a,n) => a + Number(n.valor), 0));
  $('dezRep').textContent = money(repique());
}

function renderFechar() {
  const rl = (l, v, cls) => `<div class="rl ${cls || ''}"><span>${l}</span><span class="v">${money(v)}</span></div>`;
  $('resGeral').innerHTML =
    rl('Entradas (B42)', totEntradas()) +
    rl('Saídas (C42)', totSaidas()) +
    rl('Suprimento em notas (D33)', suprNotas(), 'dim') +
    rl('TOTAL GERAL (D42)', totalGeral(), 'forte');

  const cart = ENTRADAS.filter(b => !NAO_CARTAO.includes(b.k) && totEntradaK(b.k) > 0)
    .map(b => `<div class="rl"><span>${b.k} <small style="color:var(--mut)">cód ${b.cod}</small></span><span class="v">${money(totEntradaK(b.k))}</span></div>`).join('');
  $('resCartoes').innerHTML = (cart || '<div class="rl dim"><span>Sem cartões</span><span></span></div>') +
    `<div class="rl forte"><span>Total cartões</span><span class="v">${money(totCartoes())}</span></div>`;

  const real = parseMoney($('totalReal').value);
  const dif = totalGeral() - real;
  const difEl = $('difBox');
  if ($('totalReal').value === '') {
    difEl.className = 'dif zero'; difEl.querySelector('.n').textContent = 'R$ 0,00';
  } else if (Math.abs(dif) < 0.01) {
    difEl.className = 'dif ok'; difEl.querySelector('.n').textContent = 'R$ 0,00';
  } else {
    difEl.className = 'dif falta';
    difEl.querySelector('.n').textContent = (dif > 0 ? '+' : '') + money(Math.abs(dif));
  }

  const aprov = S.fech.aprovado_por;
  $('btnFechar').textContent = S.fech.status === 'FECHADO' ? 'Reabrir caixa' : 'Marcar caixa como FECHADO';
  $('fecharErro').textContent = aprov ? `✓ Aprovado por ${aprov}` : '';
  if (aprov) $('fecharErro').style.color = 'var(--ok)';
}

function calcDif() {
  const real = parseMoney($('totalReal').value);
  const dif = totalGeral() - real;
  const difEl = $('difBox');
  if ($('totalReal').value === '') {
    difEl.className = 'dif zero'; difEl.querySelector('.n').textContent = 'R$ 0,00';
  } else if (Math.abs(dif) < 0.01) {
    difEl.className = 'dif ok'; difEl.querySelector('.n').textContent = 'R$ 0,00';
  } else {
    difEl.className = 'dif falta';
    difEl.querySelector('.n').textContent = (dif > 0 ? '+' : '') + money(Math.abs(dif));
  }
}

async function fecharCaixa() {
  const real = parseMoney($('totalReal').value);
  const novo = S.fech.status === 'FECHADO' ? 'ABERTO' : 'FECHADO';
  try {
    const u = await sb(`gn_caixa_fechamento?id=eq.${S.fech.id}`, {
      method: 'PATCH', prefer: 'return=representation',
      body: { total_real: real || null, status: novo }
    });
    S.fech = u[0];
    $('btnFechar').textContent = novo === 'FECHADO' ? 'Reabrir caixa' : 'Marcar caixa como FECHADO';
    renderFechar();
    toast(novo === 'FECHADO' ? 'Caixa fechado!' : 'Caixa reaberto');
  } catch(e) { $('fecharErro').textContent = 'Erro ao fechar. ' + e.message; }
}

async function salvarFundo() {
  const v = parseMoney($('fundoInput').value); if (v <= 0) return;
  if (v === Number(S.fech.suprimento_inicial)) return;
  try {
    const u = await sb(`gn_caixa_fechamento?id=eq.${S.fech.id}`, { method: 'PATCH', prefer: 'return=representation', body: { suprimento_inicial: v } });
    S.fech = u[0]; renderTudo(); toast('Fundo atualizado');
  } catch(e) { toast('Erro no fundo'); }
}

async function carregarHistorico() {
  const el = $('listaHist');
  el.innerHTML = '<div class="vazio">Carregando...</div>';
  try {
    const rows = await sb(`gn_caixa_fechamento?loja=eq.${encodeURIComponent(S.loja)}&order=data.desc,turno.desc&limit=30&select=*`);
    if (!rows || !rows.length) { el.innerHTML = '<div class="vazio">Sem histórico ainda.</div>'; return; }
    el.innerHTML = rows.map(f => {
      const data = f.data.split('-').reverse().join('/');
      const chip = f.turno === 'DIA' ? '<span class="chip dia">DIA</span>' : '<span class="chip noite">NOITE</span>';
      const sts = f.status === 'FECHADO' ? '<span class="hist-sts hs-ok">FECHADO</span>' : '<span class="hist-sts hs-warn">ABERTO</span>';
      const aprov = f.aprovado_por ? `<div style="color:var(--ok);font-size:10px;margin-top:2px">✓ ${f.aprovado_por}</div>` : '';
      const real = f.total_real != null ? money(f.total_real) : '—';
      const isCur = S.fech && f.id === S.fech.id ? ' style="border-color:var(--laranja)"' : '';
      return `<div class="hist-item"${isCur}>
        <div>
          <div style="font-size:14px;font-weight:bold">${data} ${chip}</div>
          <div class="hi-meta">${f.operador}${f.gerente ? ' · ' + f.gerente : ''}</div>
        </div>
        <div class="hi-right">${sts}<div class="hi-val">${real}</div>${aprov}</div>
      </div>`;
    }).join('');
  } catch(e) { el.innerHTML = '<div class="vazio">Erro ao carregar histórico.</div>'; }
}

function enviarWhats() {
  const real = parseMoney($('totalReal').value);
  const dif = totalGeral() - real;
  const difTxt = Math.abs(dif) < 0.01 ? 'Conferido ✓' : (dif > 0 ? `Sobra R$ ${money(Math.abs(dif))}` : `Falta R$ ${money(Math.abs(dif))}`);
  const cart = ENTRADAS.filter(b => !NAO_CARTAO.includes(b.k) && totEntradaK(b.k) > 0)
    .map(b => `  ${b.k}: ${money(totEntradaK(b.k))}`).join('\n');
  const t = `*GN CAIXA — ${S.loja}*\n${S.fech.data.split('-').reverse().join('/')} · ${S.turnoSel}\n━━━━━━━━━━━━━\n*RESUMO*\nEntradas: ${money(totEntradas())}\nSaídas: ${money(totSaidas())}\n*TOTAL GERAL: ${money(totalGeral())}*\nTotal real: ${money(real)}\n➡ ${difTxt}\n━━━━━━━━━━━━━\n*CARTÕES*\n${cart || '  —'}\nTotal cartões: ${money(totCartoes())}\n━━━━━━━━━━━━━\nFundo: ${money(fundo())} (notas ${money(suprNotas())} / dinh ${money(suprDinheiro())})\nRepique 10%: ${money(repique())}`;
  window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank');
}

async function excluir(tabela, id, arr) {
  if (!confirm('Excluir este lançamento?')) return;
  try {
    await sb(`${tabela}?id=eq.${id}`, { method: 'DELETE', prefer: 'return=minimal' });
    S[arr] = S[arr].filter(x => x.id !== id);
    renderTudo(); toast('Excluído');
  } catch(e) { toast('Erro ao excluir'); }
}

function abrirModal(k) {
  S.bandAtiva = k; const b = ENTRADAS.find(x => x.k === k);
  $('modalNm').textContent = k;
  $('modalCod').textContent = b.cod === '—' ? 'Lançamento manual' : 'Código maquininha: ' + b.cod;
  $('modalVal').value = '';
  $('modalBand').classList.remove('hidden');
  setTimeout(() => $('modalVal').focus(), 50);
}

function fecharModal() { $('modalBand').classList.add('hidden'); S.bandAtiva = null; }

async function confirmarBand() {
  const v = parseMoney($('modalVal').value); if (v <= 0) { toast('Valor inválido'); return; }
  try {
    const row = await sb('gn_caixa_comprovante', { method: 'POST', prefer: 'return=representation', body: { fechamento_id: S.fech.id, bandeira: S.bandAtiva, valor: v } });
    S.comprovantes.push(row[0]); fecharModal(); renderTudo(); toast('Lançado ' + money(v));
  } catch(e) { toast('Erro ao salvar'); }
}

async function addSaida() {
  const v = parseMoney($('saidaVal').value); if (v <= 0) { toast('Valor inválido'); return; }
  try {
    const row = await sb('gn_caixa_despesa', { method: 'POST', prefer: 'return=representation', body: { fechamento_id: S.fech.id, categoria: $('saidaCat').value, nome: $('saidaNome').value.trim() || null, valor: v } });
    S.saidas.push(row[0]); $('saidaVal').value = ''; $('saidaNome').value = ''; renderTudo(); toast('Saída registrada');
  } catch(e) { toast('Erro ao salvar'); }
}

function logout() { localStorage.removeItem(SESSION_KEY); location.reload(); }

function escolherLojaCaixa(loja) {
  if (!loja) return;
  S.loja = loja;
  $('turnoLoja').textContent = loja;
  $('lojaPickRow').style.display = 'none';
  try{localStorage.setItem('gn_last_loja',JSON.stringify({loja,ts:Date.now()}));}catch(_){}
}

document.getElementById('loginSenha').addEventListener('keydown', e => { if (e.key === 'Enter') fazerLogin(); });
document.getElementById('modalVal').addEventListener('keydown', e => { if (e.key === 'Enter') confirmarBand(); });

  try {
    const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    if (!s || Date.now() - s.ts > TTL) return;
    const perm = s.permissoes || {};
    if (!perm.caixa && s.cargo !== 'admin' && s.cargo !== 'gerente' && s.cargo !== 'mestre') return;
    const nav = JSON.parse(localStorage.getItem('gn_nav_loja') || 'null');
    const last = JSON.parse(localStorage.getItem('gn_last_loja') || 'null');
    const lojaEf = (nav && Date.now() - nav.ts < 60000) ? nav.loja :
                   (last && Date.now() - last.ts < TTL) ? last.loja : s.loja;
    S.user = s; S.loja = lojaEf === 'GERAL' ? '' : lojaEf;
    $('turnoLoja').textContent = lojaEf === 'GERAL' ? '— Selecione a loja —' : lojaEf;
    if (lojaEf === 'GERAL') $('lojaPickRow').style.display = 'block';
