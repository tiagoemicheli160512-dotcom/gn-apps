<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>GN · RH &amp; Financeiro</title>
<style>
/* ── TOKENS ─────────────────────────────────────── */
:root {
  --bg:       #f6f8fa;
  --surf:     #ffffff;
  --surf2:    #f0f4f8;
  --border:   #d0d7de;
  --muted:    #57606a;
  --text:     #1f2328;
  --accent:   #0969da;
  --green:    #1a7f37;
  --green-bg: #dafbe1;
  --red:      #cf222e;
  --red-bg:   rgba(207,34,46,.1);
  --amber:    #9a6700;
  --amber-bg: rgba(154,103,0,.1);
  --teal:     #0969da;
  --teal-bg:  rgba(9,105,218,.08);
  --r: 8px; --rs: 5px;
  --nav-h: 56px;
  --hdr-h: 52px;
}
@media (prefers-color-scheme: dark) { :root {
  --bg:#484848; --surf:#363636; --surf2:#404040; --border:#505050;
  --muted:#8b949e; --text:#e6edf3; --accent:#58a6ff;
  --green:#3fb950; --green-bg:rgba(63,185,80,.12);
  --red:#f85149;   --red-bg:rgba(248,81,73,.12);
  --amber:#d29922; --amber-bg:rgba(210,153,34,.12);
  --teal:#a5d6ff;  --teal-bg:rgba(165,214,255,.1);
}}
:root[data-theme="dark"] {
  --bg:#484848; --surf:#363636; --surf2:#404040; --border:#505050;
  --muted:#8b949e; --text:#e6edf3; --accent:#58a6ff;
  --green:#3fb950; --green-bg:rgba(63,185,80,.12);
  --red:#f85149;   --red-bg:rgba(248,81,73,.12);
  --amber:#d29922; --amber-bg:rgba(210,153,34,.12);
  --teal:#a5d6ff;  --teal-bg:rgba(165,214,255,.1);
}
:root[data-theme="light"] {
  --bg:#f6f8fa; --surf:#ffffff; --surf2:#f0f4f8; --border:#d0d7de;
  --muted:#57606a; --text:#1f2328; --accent:#0969da;
  --green:#1a7f37; --green-bg:#dafbe1;
  --red:#cf222e;   --red-bg:rgba(207,34,46,.1);
  --amber:#9a6700; --amber-bg:rgba(154,103,0,.1);
  --teal:#0969da;  --teal-bg:rgba(9,105,218,.08);
}

/* ── RESET + BASE ───────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',system-ui,sans-serif;font-size:14px;
  background:var(--bg);color:var(--text);min-height:100dvh;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;border:none;background:none;color:inherit;font:inherit}
input,select{font:inherit;color:inherit;background:transparent}
.hidden{display:none!important}

/* ── LOGIN ──────────────────────────────────────── */
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px}
.login-card{background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:32px 28px;width:100%;max-width:340px}
.login-logo{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px}
.login-sub{font-size:12px;color:var(--muted);margin-bottom:24px}
.login-label{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:5px}
.login-input{width:100%;border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px;background:var(--surf2);font-size:14px;outline:none;margin-bottom:14px}
.login-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(9,105,218,.12)}
.login-btn{width:100%;background:var(--accent);color:#fff;border-radius:var(--rs);padding:11px;font-size:14px;font-weight:700;letter-spacing:.2px}
.login-err{font-size:12px;color:var(--red);margin-top:8px;min-height:18px}

/* ── APP SHELL ──────────────────────────────────── */
#app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto}
header{height:var(--hdr-h);border-bottom:1px solid var(--border);background:var(--surf);
  display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;position:sticky;top:0;z-index:10}
.hdr-title{font-size:15px;font-weight:800;letter-spacing:-.3px}
.hdr-right{display:flex;align-items:center;gap:10px}
.hdr-user{font-size:11px;color:var(--muted);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-date{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.hdr-refresh{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted)}

#content{flex:1;overflow-y:auto;padding:14px;padding-bottom:calc(var(--nav-h) + 14px)}

/* ── BOTTOM NAV ─────────────────────────────────── */
.nav-bottom{height:var(--nav-h);border-top:1px solid var(--border);background:var(--surf);
  display:grid;grid-template-columns:repeat(8,1fr);flex-shrink:0;position:sticky;bottom:0;z-index:10}
.nav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:10px;color:var(--muted);padding:6px 0;position:relative;transition:color .15s}
.nav-btn.ativo{color:var(--accent)}
.nav-btn.ativo::before{content:'';position:absolute;top:0;left:25%;right:25%;height:2px;background:var(--accent);border-radius:0 0 2px 2px}
.nav-icon{font-size:18px;line-height:1}
.nav-label{font-size:10px;font-weight:600;letter-spacing:.2px}

/* ── DESKTOP SIDEBAR ────────────────────────────── */
#sidebar-nav{display:none}
@media (min-width:768px){
  body{padding-left:224px}
  .nav-bottom{display:none!important}
  #app{max-width:none;margin:0}
  #content{padding-bottom:14px!important}
  #toast{bottom:14px!important}
  #sidebar-nav{
    display:flex;flex-direction:column;
    position:fixed;top:0;left:0;bottom:0;width:224px;
    background:var(--surf);border-right:1px solid var(--border);
    overflow-y:auto;z-index:50;padding-bottom:16px;
  }
  .sidebar-brand{
    padding:14px 14px 10px;border-bottom:1px solid var(--border);
    margin-bottom:6px;display:flex;align-items:center;
    gap:10px;flex-shrink:0;
  }
  .sidebar-section{
    font-size:9px;font-weight:700;letter-spacing:.8px;
    text-transform:uppercase;color:var(--muted);padding:10px 14px 4px;
  }
  .sidebar-link{
    display:flex;align-items:center;gap:9px;position:relative;
    padding:8px 14px;font-size:13px;font-weight:500;
    color:var(--muted);text-align:left;width:100%;
    border-left:3px solid transparent;
    transition:color .12s,background .12s;background:none;border-top:none;border-right:none;border-bottom:none;
  }
  .sidebar-link:hover{color:var(--text);background:var(--surf2)}
  .sidebar-link.active{color:var(--accent);background:rgba(9,105,218,.12);border-left-color:var(--accent);font-weight:600}
  .sidebar-link .sl-icon{width:20px;font-size:14px;line-height:1;text-align:center;flex-shrink:0}
}

/* ── CARDS ──────────────────────────────────────── */
.card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.card + .card{margin-top:10px}
.card-header{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:13px;font-weight:700}
.card-body{padding:12px 14px}

/* ── STAT TILES ─────────────────────────────────── */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--surf2);border-radius:var(--rs);padding:10px 10px 8px;border:1px solid var(--border)}
.stat-val{font-size:22px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat-lbl{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-top:3px}
.stat.g .stat-val{color:var(--green)}
.stat.r .stat-val{color:var(--red)}
.stat.a .stat-val{color:var(--amber)}
.stat.b .stat-val{color:var(--accent)}

/* ── BADGES ─────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;letter-spacing:.2px}
.badge-ok{background:var(--green-bg);color:var(--green)}
.badge-err{background:var(--red-bg);color:var(--red)}
.badge-warn{background:var(--amber-bg);color:var(--amber)}
.badge-info{background:var(--teal-bg);color:var(--teal)}
.badge-muted{background:var(--surf2);color:var(--muted)}

/* ── STORE CARDS (Tab 1) ─────────────────────────── */
.loja-grid{display:flex;flex-direction:column;gap:10px}
.loja-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r)}
.loja-card-header{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.loja-name{font-size:13px;font-weight:800;letter-spacing:-.1px}
.loja-metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:0}
.loja-metric{padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.loja-metric:not(:last-child){border-right:1px solid var(--border)}
.loja-metric-val{font-size:16px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.loja-metric-lbl{font-size:8px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--muted)}
summary.loja-card-header{cursor:pointer;list-style:none}
summary.loja-card-header::-webkit-details-marker{display:none}
.loja-chev{transition:transform .15s;color:var(--muted);font-size:10px;margin-left:2px}
.loja-card[open] .loja-chev{transform:rotate(180deg)}
.loja-atestados-rank{padding:10px 14px;border-top:1px solid var(--border)}
.loja-atestados-rank-title{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;margin-bottom:6px;letter-spacing:.3px}
.loja-atestados-rank-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
.loja-atestados-rank-row:not(:first-child){border-top:1px solid var(--border)}

/* ── FINANCE ROWS (Tab 2) ───────────────────────── */
.fin-table{width:100%;border-collapse:collapse}
.fin-table th{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);padding:6px 10px;text-align:left;border-bottom:1px solid var(--border)}
.fin-table td{padding:9px 10px;border-bottom:1px solid var(--border);font-size:12px}
.fin-table tr:last-child td{border-bottom:none}
.num{font-variant-numeric:tabular-nums;font-family:ui-monospace,'Cascadia Code',monospace}
.fin-total{font-weight:700;font-size:13px;color:var(--accent)}

/* ── RH TABLE (Tab 3) ───────────────────────────── */
.rh-table-wrap{overflow-x:auto;border-radius:var(--rs)}
.rh-table{width:100%;border-collapse:collapse;white-space:nowrap}
.rh-table th{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  color:var(--muted);padding:7px 10px;text-align:left;background:var(--surf2);position:sticky;top:0}
.rh-table td{padding:8px 10px;border-bottom:1px solid var(--border);font-size:12px}
.rh-table tr:last-child td{border-bottom:none}
.rh-table .nome-col{font-weight:600;min-width:130px}
.day-pill{display:inline-flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:700;padding:2px 5px;border-radius:4px;min-width:22px;letter-spacing:.2px}
.day-P{background:var(--green-bg);color:var(--green)}
.day-F{background:var(--red-bg);color:var(--red)}
.day-AT{background:var(--amber-bg);color:var(--amber)}
.day-S{background:rgba(249,115,22,.12);color:#f97316}
.day-FG{background:var(--teal-bg);color:var(--teal)}
.day-BH{background:rgba(139,92,246,.12);color:#8b5cf6}
.day-NW{background:var(--surf2);color:var(--muted)}

/* ── MISC UI ─────────────────────────────────────── */
.sec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-title{font-size:16px;font-weight:800;letter-spacing:-.3px}
.sec-sub{font-size:11px;color:var(--muted)}
.divider{height:1px;background:var(--border);margin:14px 0}
.spin{width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty-icon{font-size:32px;margin-bottom:8px}
.empty-text{font-size:13px}

/* Filter tabs */
.filter-row{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.ftab{border:1px solid var(--border);border-radius:20px;padding:5px 13px;font-size:12px;font-weight:600;
  white-space:nowrap;background:var(--surf2);color:var(--muted);transition:all .15s}
.ftab.ativo{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Week nav */
.week-nav{display:flex;align-items:center;justify-content:space-between;background:var(--surf);
  border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;margin-bottom:12px}
.week-nav button{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--muted);background:var(--surf2)}
.week-label{text-align:center}
.week-num{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.week-period{font-size:10px;color:var(--muted)}

/* Form */
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.form-input{width:100%;border:1px solid var(--border);border-radius:var(--rs);padding:9px 12px;background:var(--surf2)}
.form-input:focus{outline:none;border-color:var(--accent)}
.btn{border-radius:var(--rs);padding:9px 18px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.btn-pri{background:var(--accent);color:#fff}
.btn-sec{background:var(--surf2);border:1px solid var(--border);color:var(--text)}
.btn-danger{background:var(--red-bg);border:1px solid rgba(248,81,73,.3);color:var(--red)}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:var(--rs);font-weight:700;display:inline-flex;align-items:center;gap:5px}

/* Photo upload */
.foto-zone{border:2px dashed var(--border);border-radius:var(--r);padding:24px;text-align:center;cursor:pointer;transition:border-color .15s}
.foto-zone:hover{border-color:var(--accent)}
.foto-preview{width:100%;border-radius:var(--rs);max-height:260px;object-fit:contain;background:var(--surf2)}

/* Toast */
#toast{position:fixed;bottom:calc(var(--nav-h) + 14px);left:50%;transform:translateX(-50%) translateY(10px);
  background:#3a3a3a;color:#fff;border-radius:20px;padding:8px 18px;font-size:13px;font-weight:600;
  white-space:nowrap;opacity:0;transition:all .25s;z-index:999;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:#1a7f37}
#toast.err{background:var(--red)}

/* Modal */
#modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:none;align-items:flex-end}
#modal-bg.ativo{display:flex}
#modal-box{background:var(--surf);border-radius:14px 14px 0 0;width:100%;max-height:90dvh;overflow-y:auto;padding:20px 18px 30px;max-width:560px;margin:0 auto}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.modal-title{font-size:16px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.modal-close{color:var(--muted);font-size:20px;line-height:1;padding:2px 4px}
.modal-actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}

/* SQL block */
.sql-block{background:var(--surf2);border:1px solid var(--border);border-radius:var(--rs);
  padding:12px;font-family:ui-monospace,'Cascadia Code',monospace;font-size:10px;
  line-height:1.6;overflow-x:auto;white-space:pre;color:var(--text);margin-bottom:12px}

/* ── COMPARATIVO (Tab 4) ─────────────────────── */
.comp-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:8px}
.comp-card-hdr{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.comp-loja{font-size:13px;font-weight:700}
.comp-div-body{padding:0 14px 10px}
.comp-div-table{width:100%;border-collapse:collapse;font-size:11px}
.comp-div-table td{padding:4px 0;border-top:1px solid var(--border)}
.comp-div-table td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums;font-family:ui-monospace,'Cascadia Code',monospace}

/* ── DOSSIÊ (Tab 7) ──────────────────────────── */
.doss-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:8px}
.doss-hdr{padding:11px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:8px;-webkit-tap-highlight-color:transparent}
.doss-hdr:active{background:var(--surf2)}
.doss-nome{font-size:13px;font-weight:800;letter-spacing:-.1px}
.doss-meta{font-size:10px;color:var(--muted);margin-top:2px}
.doss-stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--border)}
.doss-stat{padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:1px}
.doss-stat:not(:last-child){border-right:1px solid var(--border)}
.doss-stat-val{font-size:18px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.doss-stat-lbl{font-size:8px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--muted)}
.doss-exp{padding:12px 14px;border-top:1px solid var(--border);background:var(--surf2)}

</style>
<script src="gn-lojas-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>

    <div style="width:30px;height:30px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;">👥</div>
    <div style="min-width:0;">
      <div style="font-size:13px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">GN · RH &amp; Fin.</div>
      <div style="font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" id="sidebar-user"></div>

  <button class="sidebar-link" data-sidebar-tab="avarias" onclick="setTab('avarias')"><span class="sl-icon">⚠️</span>Avarias<span id="sidebar-avarias-badge" style="display:none;margin-left:5px;background:var(--red);color:#fff;font-size:9px;font-weight:800;padding:1px 5px;border-radius:8px;vertical-align:middle"></span></button>
  <button class="sidebar-link" data-sidebar-tab="dossie" onclick="setTab('dossie')"><span class="sl-icon">📋</span>Dossiê</button>

<!-- ══ LOGIN ══════════════════════════════════════ -->
<div id="login">
  <div class="login-card">
    <div class="login-logo">GN · RH &amp; Financeiro</div>
    <div class="login-sub">Consolidador de Operações — Rede</div>
    <label class="login-label" for="ln-user">Usuário</label>
    <input class="login-input" id="ln-user" type="text" autocomplete="username" placeholder="Nome de usuário">
    <label class="login-label" for="ln-pass">Senha</label>
    <input class="login-input" id="ln-pass" type="password" autocomplete="current-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">Entrar</button>
    <div class="login-err" id="ln-err"></div>

function fmtBR(iso) {
  if (!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function fmtBRShort(iso) {
  if (!iso) return '—';
  const dt = new Date(iso + 'T12:00:00');
  return dt.toLocaleDateString('pt-BR', { weekday:'short', day:'2-digit', month:'short' });
}

function isoDate(d) {
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function getMondayOfWeek(d = new Date()) {
  const dd = new Date(d); dd.setHours(0,0,0,0);
  const dow = dd.getDay(); const diff = (dow===0)?-6:1-dow;
  dd.setDate(dd.getDate()+diff); return dd;
}
function getSundayOfWeek(monday) {
  const s = new Date(monday); s.setDate(monday.getDate()+6); return s;
}
function isoWeekStr(date) { return isoDate(date); }
function datePlusWeeks(date, n) {
  const d = new Date(date); d.setDate(d.getDate()+n*7); return d;
}
function formatSemana(monday) {
  const sun = getSundayOfWeek(monday);
  const fmt = d => d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
  const d2 = new Date(Date.UTC(monday.getFullYear(),monday.getMonth(),monday.getDate()));
  const dow = d2.getUTCDay()||7; d2.setUTCDate(d2.getUTCDate()+4-dow);
  const jan1 = new Date(Date.UTC(d2.getUTCFullYear(),0,1));
  const weekNum = Math.ceil(((d2-jan1)/86400000+1)/7);
  return { num:weekNum, periodo:`${fmt(monday)} – ${fmt(sun)}` };
}

// Índice de semana pelo sistema Mestra (âncora fixa 2026-01-05 = seg.)
function mestraWeekIdx(monday) {
  const anchor = new Date(2026, 0, 5);
  const d = monday instanceof Date ? monday : getMondayOfWeek();
  const td = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  return Math.max(0, Math.floor((td - anchor) / (7 * 86400000)));
}

// Retorna dados da semana selecionada. Se a semana atual não existir ou estiver completamente
// vazia (0 funcs), busca a semana mais populosa como fallback.
function getWDComFallback(allData, semIdx) {
  if (!allData) return null;
  const wdDireto = allData[String(semIdx)];
  const countDireto = wdDireto?.funcs?.filter(f => f.nome?.trim()).length || 0;
  // Prefere a semana atual se tem ao menos 1 funcionário
  if (countDireto > 0) return wdDireto;
  // Fallback: semana mais populosa (caso a semana atual não exista ainda)
  let bestWd = null, bestCount = 0;
  const keys = Object.keys(allData).map(Number).sort((a,b)=>b-a);
  for (const k of keys) {
    const wd = allData[String(k)];
    const cnt = wd?.funcs?.filter(f => f.nome?.trim()).length || 0;
    if (cnt > bestCount) { bestWd = wd; bestCount = cnt; }
  }
  return bestWd;
}

function comissoesDiaIdx(dateISO) {
  if (!dateISO) return null;
  const dow = new Date(dateISO+'T12:00:00').getDay();
  return dow===0 ? 6 : dow-1;
}

function _parseHorasHorario(horario) {
  if (!horario) return null;
  const m = horario.match(/(\d{1,2})[h:](\d{0,2})\s*[–\-]\s*(\d{1,2})[h:](\d{0,2})/i);
  if (!m) return null;
  const h1 = parseInt(m[1]), min1 = parseInt(m[2] || '0') || 0;
  const h2 = parseInt(m[3]), min2 = parseInt(m[4] || '0') || 0;
  let mins = (h2 * 60 + min2) - (h1 * 60 + min1);
  if (mins <= 0) mins += 1440;
  if (mins <= 0 || mins > 1440) return null;
  if (mins >= 360) mins -= 60;
  return Math.round(mins / 60 * 10) / 10;
}

async function carregarOperacoes() {
  if (!S.opData) { S.opData = new Date(); S.opData.setHours(12,0,0,0); }
  const mode = S.opMode || 'dia';
  let ini, fim;
  if (mode === 'dia') {
    ini = fim = isoDate(S.opData);
  } else if (mode === 'sem') {
    const mon = getMondayOfWeek(S.opData);
    ini = isoDate(mon); fim = isoDate(getSundayOfWeek(mon));
  } else {
    const y = S.opData.getFullYear(), m = S.opData.getMonth();
    ini = y+'-'+String(m+1).padStart(2,'0')+'-01';
    fim = isoDate(new Date(y, m+1, 0));
  }

  const [resCaixa, resComissoes] = await Promise.all([
    db.from('gn_caixa_fechamento').select('loja,data,turno,status,total_real,repique,venda_ifood,venda_online')
      .gte('data', ini).lte('data', fim).order('turno', {ascending:false}),
    db.from('gn_comissoes').select('loja,all_data').in('loja', LOJAS.map(l=>l.comKey)),
  ]);

  S.opCaixa = resCaixa.data || [];
  S.comissoesData = {};
  (resComissoes.data || []).forEach(r => { S.comissoesData[r.loja] = r.all_data; });
}

async function carregarFinanceiro() {
  if (!S.finSemana) {
    // Na segunda-feira, fotos de gorjeta são da semana anterior — abre lá por padrão
    const hoje = getMondayOfWeek();
    S.finSemana = new Date().getDay() === 1 ? datePlusWeeks(hoje, -1) : hoje;
  }
  const ini = isoWeekStr(S.finSemana);
  const fim = isoWeekStr(getSundayOfWeek(S.finSemana));

  let q = db.from('gn_caixa_fechamento')
    .select('id,loja,data,turno,status,total_real,total_sistema,foto_sistema,repique,venda_ifood,venda_online,obs_gerente')
    .gte('data', ini).lte('data', fim)
    .order('data').order('loja').order('turno');
  if (S.finLoja) { const _lo=LOJAS.find(l=>l.chkKey===S.finLoja); q=q.eq('loja',_lo?_lo.userKey:S.finLoja); }
  const { data: caixaData } = await q;
  S.caixaSemana = caixaData || [];

  // Comprovantes, despesas, suprimentos e gorjetas
  S.caixaComprovantes = {};
  S.caixaDespesas     = {};
  S.caixaSuprimentos  = {};

  if (S.caixaSemana.length > 0) {
    const ids = S.caixaSemana.map(r => r.id);
    const [resComp, resDes, resSup, resGor] = await Promise.all([
      db.from('gn_caixa_comprovante').select('fechamento_id,bandeira,valor').in('fechamento_id', ids),
      db.from('gn_caixa_despesa').select('id,fechamento_id,categoria,nome,valor').in('fechamento_id', ids),
      db.from('gn_caixa_suprimento').select('fechamento_id,descricao,valor').in('fechamento_id', ids),
      db.from('gn_caixa_gorjeta').select('fechamento_id,mesa,garcom,valor').in('fechamento_id', ids),
    ]);
    (resComp.data || []).forEach(c => {
      if (!S.caixaComprovantes[c.fechamento_id]) S.caixaComprovantes[c.fechamento_id] = {};
      S.caixaComprovantes[c.fechamento_id][c.bandeira] =
        (S.caixaComprovantes[c.fechamento_id][c.bandeira] || 0) + (parseFloat(c.valor) || 0);
    });
    (resDes.data || []).forEach(d => {
      if (!S.caixaDespesas[d.fechamento_id]) S.caixaDespesas[d.fechamento_id] = [];
      S.caixaDespesas[d.fechamento_id].push(d);
    });
    (resSup.data || []).forEach(s => {
      if (!S.caixaSuprimentos[s.fechamento_id]) S.caixaSuprimentos[s.fechamento_id] = [];
      S.caixaSuprimentos[s.fechamento_id].push(s);
    });
    (resGor.data || []).forEach(g => {
      if (!S.caixaGorjetas[g.fechamento_id]) S.caixaGorjetas[g.fechamento_id] = [];
      S.caixaGorjetas[g.fechamento_id].push(g);
    });
  }

  // Gorjetas Mestra (brutos por dia, para comparar com fechamento)
  const { data: comData } = await db.from('gn_comissoes').select('loja,all_data').in('loja', LOJAS.map(l => l.comKey));
  S.comissoesData = {};
  (comData || []).forEach(r => { S.comissoesData[r.loja] = r.all_data; });

  // Fotos de gorjeta (tabela opcional)
  try {
    const ini1f = isoDate(new Date(S.finSemana.getTime() + 86400000)); // terça (fuso UTC)
    let qf = db.from('gn_comissao_foto').select('*').in('semana_ini', [ini, ini1f]);
    if (S.finLoja) qf = qf.eq('loja', S.finLoja);
    const { data: fotos, error: fErr } = await qf;
    if (fErr && fErr.code === '42P01') { S.comissaoFotoSuportado = false; }
    else { S.comissaoFotos = fotos || []; S.comissaoFotoSuportado = true; }
  } catch(_) { S.comissaoFotoSuportado = false; }

  // Fotos do Caixa do Sistema — hoje vêm direto de gn_caixa_fechamento.foto_sistema (por turno).
  // Este objeto guarda só o fallback de fotos antigas (tiradas antes da mudança pro app Caixa),
  // ainda salvas em gn_lojas.all_data.fotos_caixa_sistema — carregado logo abaixo.
  S.fotosCaixaSistema = {};

  // Conferências de caixa (gn_lojas.all_data.caixa_conferencias) — ligadas ao fechamento
  S.caixaConferencias = {};
  if (S.caixaSemana.length > 0) {
    try {
      const comKeys = [...new Set(
        S.caixaSemana.map(r => LOJAS.find(l => l.userKey === r.loja)?.comKey).filter(Boolean)
      )];
      const { data: lojaConfs } = await db.from('gn_lojas').select('loja,all_data').in('loja', comKeys);
      (lojaConfs || []).forEach(lr => {
        const confs = lr.all_data?.caixa_conferencias || {};
        Object.entries(confs).forEach(([fid, conf]) => { S.caixaConferencias[fid] = conf; });
      });
    } catch(_) {}
  }

  // Fotos do caixa do sistema — carrega SEMPRE para todas as lojas (independente de ter fechamento)
  try {
    const fotoKeys = S.finLoja
      ? [LOJAS.find(l => l.chkKey === S.finLoja)?.comKey].filter(Boolean)
      : LOJAS.map(l => l.comKey);
    const { data: lojaFotos } = await db.from('gn_lojas').select('loja,all_data').in('loja', fotoKeys);
    (lojaFotos || []).forEach(lr => {
      const lojaObj = LOJAS.find(l => l.comKey === lr.loja);
      if (!lojaObj) return;
      const fotos = lr.all_data?.fotos_caixa_sistema || {};
      Object.entries(fotos).forEach(([date, foto]) => {
        if (foto) S.fotosCaixaSistema[`${lojaObj.userKey}|${date}`] = foto;
      });
    });
    // Fallback: linhas antigas escritas com userKey em vez de comKey
    const oldKeyLojas = LOJAS.filter(l => l.comKey !== l.userKey);
    if (oldKeyLojas.length > 0) {
      const { data: oldRows } = await db.from('gn_lojas').select('loja,all_data').in('loja', oldKeyLojas.map(l => l.userKey));
      (oldRows || []).forEach(lr => {
        const lojaObj = LOJAS.find(l => l.userKey === lr.loja);
        if (!lojaObj) return;
        const fotos = lr.all_data?.fotos_caixa_sistema || {};
        Object.entries(fotos).forEach(([date, foto]) => {
          const key = `${lojaObj.userKey}|${date}`;
          if (foto && !S.fotosCaixaSistema[key]) S.fotosCaixaSistema[key] = foto;
        });
      });
    }
  } catch(_) {}

  // Bandas do dia (gn_trios_agenda) — cachê/consumação para exibir no fechamento
  S.trioBandas = {};
  try {
    const lojasEscopo = S.finLoja ? LOJAS.filter(l => l.chkKey === S.finLoja) : LOJAS;
    const trioSlugs = [...new Set(lojasEscopo.map(l => trioLojaSlug(l.comKey)).filter(Boolean))];
    if (trioSlugs.length > 0) {
      const { data: trios, error: trioErr } = await db.from('gn_trios_agenda')
        .select('loja,data,horario_inicio,artista,cache,couver_valor,presenca_confirmada,banda_nao_veio,banda_nao_veio_motivo')
        .gte('data', ini).lte('data', fim).in('loja', trioSlugs);
      if (!trioErr) {
        (trios || []).forEach(t => {
          const lojaObj = lojasEscopo.find(l => trioLojaSlug(l.comKey) === t.loja);
          if (!lojaObj) return;
          const key = `${lojaObj.userKey}|${t.data}`;
          if (!S.trioBandas[key]) S.trioBandas[key] = [];
          S.trioBandas[key].push(t);
        });
      }
    }
  } catch(_) { S.trioBandas = {}; }

  // Consumação da banda (checklist_diario.banda) — lançada no fechamento do caixa
  // (app Check-list), já com a franquia de consumação aplicada (mesma constante/lógica
  // de lá). Importante: gn_trios_agenda.couver_valor é receita de ingresso vendido na
  // porta (não tem relação com o que a banda consumiu de graça) — não pode ser usado
  // como "consumação" pro cálculo do cachê líquido.
  S.bandaChecklist = {};
  try {
    const lojasEscopo = S.finLoja ? LOJAS.filter(l => l.chkKey === S.finLoja) : LOJAS;
    const { data: bandaRows } = await db.from('checklist_diario').select('loja,data_operacao,banda')
      .gte('data_operacao', ini).lte('data_operacao', fim)
      .in('loja', lojasEscopo.map(l => l.chkKey));
    (bandaRows || []).forEach(r => {
      if (!r.banda || !r.banda.nome || !r.banda.nome.trim()) return;
      const lojaObj = lojasEscopo.find(l => l.chkKey === r.loja);
      if (lojaObj) S.bandaChecklist[`${lojaObj.userKey}|${r.data_operacao}`] = r.banda;
    });
  } catch(_) { S.bandaChecklist = {}; }
}

// DATA — COMPARATIVO FOTO vs SISTEMA
// ══════════════════════════════════════════════
async function carregarComparativo() {
  if (!S.compSemana) {
    const hj = getMondayOfWeek();
    S.compSemana = new Date().getDay() === 1 ? datePlusWeeks(hj, -1) : hj;
  }
  const ini  = isoWeekStr(S.compSemana);
  const ini1 = isoDate(new Date(S.compSemana.getTime() + 86400000)); // terça (fuso UTC)
  const [resFotos, resCom, resLojas] = await Promise.all([
    db.from('gn_comissao_foto').select('*').in('semana_ini', [ini, ini1]),
    db.from('gn_comissoes').select('loja,all_data').in('loja', LOJAS.map(l => l.comKey)),
    db.from('gn_lojas').select('loja,all_data').in('loja', LOJAS.map(l => l.comKey)),
  ]);
  // Prefere entrada da segunda quando há dois registros para a mesma loja
  const fotoMap = {};
  (resFotos.data || []).forEach(f => {
    if (!fotoMap[f.loja] || f.semana_ini === ini) fotoMap[f.loja] = f;
  });
  S.compFotos = Object.values(fotoMap);
  S.compComissoes = {};
  (resCom.data || []).forEach(r => { S.compComissoes[r.loja] = r.all_data; });
  // Carrega marcações OK persistidas
  S.compOk = {};
  (resLojas.data || []).forEach(r => {
    const lojaObj = LOJAS.find(l => l.comKey === r.loja);
    if (!lojaObj) return;
    const okMap = r.all_data?.compOk || {};
    Object.entries(okMap).forEach(([semIni, ok]) => {
      if (ok) S.compOk[`${lojaObj.chkKey}|${semIni}`] = true;
    });
  });
}

// DATA — RH / BANCO DE HORAS
// ══════════════════════════════════════════════
async function carregarRH() {
  if (!S.rhSemana) S.rhSemana = getMondayOfWeek();
  const loja = S.rhLoja;
  const weekIdx = mestraWeekIdx(S.rhSemana);

  const [resBH, resCom] = await Promise.all([
    db.from('gn_banco_horas').select('mes,registros').eq('loja', loja.chkKey),
    db.from('gn_comissoes').select('all_data').eq('loja', loja.comKey).single(),
  ]);
  const configRow = (resBH.data || []).find(r => r.mes === 'CONFIG');
  S.bhConfig = configRow?.registros || null;
  S.bancoHoras = (resBH.data || []).filter(r => r.mes !== 'CONFIG');

  // Extrai funcs da semana selecionada (com fallback para semana mais recente disponível)
  const allData = resCom.data?.all_data;
  const semWD = getWDComFallback(allData, weekIdx);
  S.presencaSemana = semWD ? { idx: weekIdx, funcs: semWD.funcs || [] } : null;
}

// ══════════════════════════════════════════════
// RENDER — OPERAÇÕES (Tab 1)
// ══════════════════════════════════════════════
function renderOperacoes() {
  if (!S.opData) { S.opData = new Date(); S.opData.setHours(12,0,0,0); }
  const mode  = S.opMode || 'dia';
  const today = new Date(); today.setHours(12,0,0,0);
  const isToday = mode === 'dia' && isoDate(S.opData) === isoDate(today);

  // Nav label
  let navLabel = '';
  if (mode === 'dia') {
    navLabel = S.opData.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
    if (isToday) navLabel += ' · hoje';
  } else if (mode === 'sem') {
    const mon = getMondayOfWeek(S.opData);
    const sem = formatSemana(mon);
    navLabel = `Sem. ${sem.num} · ${sem.periodo}`;
  } else {
    navLabel = S.opData.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
    navLabel = navLabel.charAt(0).toUpperCase() + navLabel.slice(1);
  }

  // Semana idx para busca de gorjetas
  const refMon  = getMondayOfWeek(S.opData);
  const semIdx  = mestraWeekIdx(refMon);

  // Compute faltas helper por loja baseado no modo
  function contarFaltas(allData) {
    let faltas = 0, suspensoes = 0, atestados = 0, justificativas = 0, bancoHoras = 0;
    if (mode === 'dia') {
      const di = comissoesDiaIdx(isoDate(S.opData));
      const wd = allData?.[String(semIdx)];
      (wd?.funcs||[]).filter(f=>f.nome?.trim()).forEach(f=>{
        const st = f.dias?.[di]||'';
        if (st==='FALTA') faltas++;
        else if (st==='SUSPENSÃO') suspensoes++;
        else if (st==='ATESTADO') atestados++;
        else if (st==='JUSTIFICATIVA') justificativas++;
        else if (st==='BANCO DE HORAS') bancoHoras++;
      });
    } else if (mode === 'sem') {
      const wd = allData?.[String(semIdx)];
      (wd?.funcs||[]).filter(f=>f.nome?.trim()).forEach(f=>{
        (f.dias||[]).forEach(st=>{
          if (st==='FALTA') faltas++;
          else if (st==='SUSPENSÃO') suspensoes++;
          else if (st==='ATESTADO') atestados++;
          else if (st==='JUSTIFICATIVA') justificativas++;
          else if (st==='BANCO DE HORAS') bancoHoras++;
        });
      });
    } else {
      // mês: iterar cada dia do mês
      const y = S.opData.getFullYear(), mo = S.opData.getMonth();
      const dias = new Date(y, mo+1, 0).getDate();
      for (let d = 1; d <= dias; d++) {
        const dt = new Date(y, mo, d, 12);
        const si = mestraWeekIdx(getMondayOfWeek(dt));
        const di = comissoesDiaIdx(isoDate(dt));
        const wd = allData?.[String(si)];
        (wd?.funcs||[]).filter(f=>f.nome?.trim()).forEach(f=>{
          const st = f.dias?.[di]||'';
          if (st==='FALTA') faltas++;
          else if (st==='SUSPENSÃO') suspensoes++;
          else if (st==='ATESTADO') atestados++;
          else if (st==='JUSTIFICATIVA') justificativas++;
          else if (st==='BANCO DE HORAS') bancoHoras++;
        });
      }
    }
    return { faltas, suspensoes, atestados, justificativas, bancoHoras };
  }

  // Ranking de atestados por funcionário dentro da loja, do pior (mais atestados) pro
  // melhor — mesma lógica de contarFaltas, mas agrupando por nome em vez de somar tudo.
  function atestadosPorFuncionario(allData) {
    const porNome = {};
    const add = nome => { porNome[nome] = (porNome[nome]||0) + 1; };
    if (mode === 'dia') {
      const di = comissoesDiaIdx(isoDate(S.opData));
      const wd = allData?.[String(semIdx)];
      (wd?.funcs||[]).filter(f=>f.nome?.trim()).forEach(f=>{
        if ((f.dias?.[di]||'') === 'ATESTADO') add(f.nome);
      });
    } else if (mode === 'sem') {
      const wd = allData?.[String(semIdx)];
      (wd?.funcs||[]).filter(f=>f.nome?.trim()).forEach(f=>{
        (f.dias||[]).forEach(st => { if (st==='ATESTADO') add(f.nome); });
      });
    } else {
      const y = S.opData.getFullYear(), mo = S.opData.getMonth();
      const dias = new Date(y, mo+1, 0).getDate();
      for (let d = 1; d <= dias; d++) {
        const dt = new Date(y, mo, d, 12);
        const si = mestraWeekIdx(getMondayOfWeek(dt));
        const di = comissoesDiaIdx(isoDate(dt));
        const wd = allData?.[String(si)];
        (wd?.funcs||[]).filter(f=>f.nome?.trim()).forEach(f=>{
          if ((f.dias?.[di]||'') === 'ATESTADO') add(f.nome);
        });
      }
    }
    return Object.entries(porNome).map(([nome,atestados])=>({nome,atestados})).sort((a,b)=>b.atestados-a.atestados);
  }

  // Totais globais
  let totalFuncs = 0, totalFaltas = 0, totalSuspensoes = 0, totalAtestados = 0, totalJustificativas = 0, totalBancoHoras = 0, totalCaixa = 0;

  const cardsHtml = LOJAS.map(loja => {
    const allData = S.comissoesData[loja.comKey];
    const wdFuncs = getWDComFallback(allData, semIdx);
    const funcsAtivos = (wdFuncs?.funcs||[]).filter(f=>f.nome?.trim()).length;
    totalFuncs += funcsAtivos;

    const { faltas, suspensoes, atestados, justificativas, bancoHoras } = contarFaltas(allData);
    totalFaltas += faltas; totalSuspensoes += suspensoes; totalAtestados += atestados; totalJustificativas += justificativas; totalBancoHoras += bancoHoras;

    // Caixa: soma do período por loja
    const cxRecs = (S.opCaixa||[]).filter(r=>r.loja===loja.userKey);
    const cxTotal = cxRecs.reduce((a,r)=>a+(parseFloat(r.total_real)||0),0);
    totalCaixa += cxTotal;
    // Em modo dia: pega status do primeiro registro
    const cxStatus = mode==='dia' ? (cxRecs[0]?.status||null) : null;
    const cxBadge = mode==='dia'
      ? (cxStatus
          ? `<span class="badge ${STATUS_CLASS[cxStatus]||'badge-muted'}">${STATUS_LABEL[cxStatus]||cxStatus}</span>`
          : `<span class="badge badge-muted">Sem caixa</span>`)
      : '';

    const faltaColor = faltas > 0 ? 'color:var(--red)' : 'color:var(--green)';
    const suspColor  = suspensoes > 0 ? 'color:var(--red)' : '';
    const atesColor  = atestados > 0 ? 'color:var(--amber)' : '';
    const justColor  = justificativas > 0 ? 'color:#ec4899' : '';
    const bhColor    = bancoHoras > 0 ? 'color:var(--teal)' : '';
    const faltaLbl   = mode==='dia' ? 'Faltas Hoje' : 'Faltas';
    const LIMITE_FALTA = { dia: 3, sem: 5, mes: 15 };
    const alertaBadge = faltas >= LIMITE_FALTA[mode] ? `<span class="badge badge-err" style="font-size:9px">⚠️ ${faltas}F</span>` : '';
    const rankingAtestados = atestadosPorFuncionario(allData);

    return `<details class="loja-card">
      <summary class="loja-card-header">
        <span class="loja-name">${loja.display}</span>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          ${alertaBadge}${cxBadge}
          ${cxTotal>0 ? `<span class="num" style="font-size:11px;font-weight:700;color:var(--accent)">${money(cxTotal)}</span>` : ''}
          <span class="loja-chev">▾</span>
        </div>
      </summary>
      <div class="loja-metrics">
        <div class="loja-metric">
          <span class="loja-metric-val" style="color:var(--accent)">${funcsAtivos}</span>
          <span class="loja-metric-lbl">Func. Ativos</span>
        </div>
        <div class="loja-metric">
          <span class="loja-metric-val" style="${faltaColor}">${faltas}</span>
          <span class="loja-metric-lbl">${faltaLbl}</span>
        </div>
        <div class="loja-metric">
          <span class="loja-metric-val" style="${suspColor}">${suspensoes}</span>
          <span class="loja-metric-lbl">Suspensão</span>
        </div>
        <div class="loja-metric">
          <span class="loja-metric-val" style="${atesColor}">${atestados}</span>
          <span class="loja-metric-lbl">Atestados</span>
        </div>
        <div class="loja-metric">
          <span class="loja-metric-val" style="${justColor}">${justificativas}</span>
          <span class="loja-metric-lbl">Justif.</span>
        </div>
        <div class="loja-metric">
          <span class="loja-metric-val" style="${bhColor}">${bancoHoras}</span>
          <span class="loja-metric-lbl">Banco H.</span>
        </div>
      </div>
      <div class="loja-atestados-rank">
        <div class="loja-atestados-rank-title">🏥 Ranking de atestados por funcionário</div>
        ${rankingAtestados.length
          ? rankingAtestados.map((r,i)=>`
            <div class="loja-atestados-rank-row">
              <span style="font-size:12px"><b style="color:var(--muted);margin-right:6px">#${i+1}</b>${esc(r.nome)}</span>
              <span style="font-size:12px;font-weight:800;color:var(--amber)">${r.atestados}</span>
            </div>`).join('')
          : `<div style="font-size:11px;color:var(--muted)">Nenhum atestado no período.</div>`}
      </div>
    </details>`;
  }).join('');

  const caixaLbl = mode==='dia' ? 'Total de Caixa Hoje' : mode==='sem' ? 'Total de Caixa — Semana' : 'Total de Caixa — Mês';

  $('content').innerHTML = `
    <div class="sec-header">
      <div class="sec-title">Operações</div>
    </div>
    <div class="filter-row" style="gap:4px;margin-bottom:8px">
      <button class="ftab${mode==='dia'?' ativo':''}" onclick="setOpMode('dia')">Dia</button>
      <button class="ftab${mode==='sem'?' ativo':''}" onclick="setOpMode('sem')">Semana</button>
      <button class="ftab${mode==='mes'?' ativo':''}" onclick="setOpMode('mes')">Mês</button>
    </div>
    <div class="week-nav" style="margin-bottom:10px">
      <button onclick="navegarOp(-1)">&#8592;</button>
      <div class="week-label" style="font-size:13px;font-weight:600">${navLabel}</div>
      <button ${isoDate(S.opData)>=isoDate(today)?'disabled style="opacity:.35"':''} onclick="navegarOp(1)">&#8594;</button>
    </div>
    <div class="stat-row" style="grid-template-columns:repeat(6,1fr)">
      <div class="stat b"><div class="stat-val">${totalFuncs}</div><div class="stat-lbl">Funcionários</div></div>
      <div class="stat r"><div class="stat-val">${totalFaltas}</div><div class="stat-lbl">Faltas</div></div>
      <div class="stat r"><div class="stat-val">${totalSuspensoes}</div><div class="stat-lbl">Suspensão</div></div>
      <div class="stat a"><div class="stat-val">${totalAtestados}</div><div class="stat-lbl">Atestados</div></div>
      <div class="stat" style="background:rgba(236,72,153,.08)"><div class="stat-val" style="color:#ec4899">${totalJustificativas}</div><div class="stat-lbl">Justif.</div></div>
      <div class="stat" style="background:var(--teal-bg)"><div class="stat-val" style="color:var(--teal)">${totalBancoHoras}</div><div class="stat-lbl">Banco H.</div></div>
    </div>
    <div class="card" style="margin-bottom:14px">
      <div class="card-body" style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px">${caixaLbl}</span>
        <span class="num fin-total">${money(totalCaixa)}</span>
      </div>
    </div>
    <div style="margin-bottom:10px">
      <button onclick="enviarResumoWhatsApp()" style="width:100%;background:#25d366;color:#fff;border-radius:var(--rs);padding:10px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px">
        <span>📲</span> Enviar resumo no WhatsApp
      </button>
      <button onclick="exportarFaltasDetalhadas()" style="width:100%;background:#128c7e;color:#fff;border-radius:var(--rs);padding:10px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px">
        <span>📋</span> Faltas detalhadas (WhatsApp)
      </button>
      <button onclick="gerarPDFRH()" style="width:100%;background:#c0392b;color:#fff;border-radius:var(--rs);padding:10px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px">
        <span>📄</span> Gerar PDF
      </button>
    </div>
    <div class="loja-grid">${cardsHtml}</div>`;
}

function toggleComprovante(id) {
  const el = document.getElementById('comp-row-' + id);
  if (!el) return;
  const isHidden = el.style.display === 'none' || el.style.display === '';
  el.style.display = isHidden ? 'table-row' : 'none';
  const btn = document.getElementById('comp-btn-' + id);
  if (btn) btn.textContent = isHidden ? '▲' : '📋';
}

function renderFinanceiro() {
  if (!S.finSemana) {
    const hoje = getMondayOfWeek();
    S.finSemana = new Date().getDay() === 1 ? datePlusWeeks(hoje, -1) : hoje;
  }
  const sem = formatSemana(S.finSemana);
  const ini = isoWeekStr(S.finSemana);
  const isCurrentWeek = S.finSemana.toDateString() === getMondayOfWeek().toDateString();

  // Filtros de loja
  const lojaFiltros = [
    `<button class="ftab${S.finLoja===''?' ativo':''}" onclick="filtrarFinLoja('')">Todas</button>`,
    ...LOJAS_COM_TESTE.map(l => `<button class="ftab${S.finLoja===l.chkKey?' ativo':''}" onclick="filtrarFinLoja('${l.chkKey}')">${l.display}</button>`)
  ].join('');

  // Agrupamento por loja
  const porLoja = {};
  S.caixaSemana.forEach(r => {
    if (!porLoja[r.loja]) porLoja[r.loja] = [];
    porLoja[r.loja].push(r);
  });

  // Total geral
  const totalSemana = S.caixaSemana.reduce((a,r)=>a+(parseFloat(r.total_real)||0),0);
  const totalIfood  = S.caixaSemana.reduce((a,r)=>a+(parseFloat(r.venda_ifood)||0),0);
  const totalOnline = S.caixaSemana.reduce((a,r)=>a+(parseFloat(r.venda_online)||0),0);
  const totalRepique= S.caixaSemana.reduce((a,r)=>a+(parseFloat(r.repique)||0),0);

  // Cards por loja
  const caixaHtml = Object.keys(porLoja).length === 0
    ? `<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">Nenhum fechamento nesta semana</div></div>`
    : Object.entries(porLoja).sort(([a],[b])=>a.localeCompare(b)).map(([lojaChk, rows]) => {
        const totalLoja = rows.reduce((a,r)=>a+(parseFloat(r.total_real)||0),0);
        const lojaObj = LOJAS.find(l => l.userKey === lojaChk);
        const linhaCaixa = r => {
          const statusBadge = `<span class="badge ${STATUS_CLASS[r.status]||'badge-muted'}" style="font-size:9px">${r.status}</span>`;
          const totalReal  = r.total_real != null ? parseFloat(r.total_real) : null;
          const fotoB64    = r.foto_sistema || S.fotosCaixaSistema?.[`${lojaChk}|${r.data}`];
          const bandasDia  = (S.trioBandas?.[`${lojaChk}|${r.data}`] || [])
            .filter(t => { const tt = trioTurnoFor(t.horario_inicio); return !tt || tt === r.turno; });
          // Cachê líquido = cachê total do dia menos só o que exceder a franquia de
          // consumação (BANDA_CONSUMO_FRANQUIA) — mesma regra e mesmo valor de "consumo"
          // lançados no fechamento (Check-list), não o couver_valor (receita de ingresso,
          // sem relação com o que a banda consumiu). Com 2+ bandas no mesmo dia, o
          // Check-list lança um único valor de consumação combinado — por isso o desconto
          // aparece agrupado, não dividido por artista.
          const bandaNaoVeio = bandasDia.filter(t => t.banda_nao_veio);
          const bandaVeio    = bandasDia.filter(t => !t.banda_nao_veio);
          const naoVeioHtml  = bandaNaoVeio.map(t =>
            `<div style="margin-top:3px;font-size:9px;background:var(--red-bg);border-radius:5px;padding:2px 6px;color:var(--red);font-weight:600">🎵 ${esc(t.artista)} — não veio${t.banda_nao_veio_motivo?': '+esc(t.banda_nao_veio_motivo):''} · sem pagamento</div>`
          ).join('');
          let veioHtml = '';
          if (bandaVeio.length) {
            const nomes      = bandaVeio.map(t => t.artista).filter(Boolean).join(' + ');
            const cacheTotal = bandaVeio.reduce((s,t) => s + (parseFloat(t.cache) || 0), 0);
            const pendente   = bandaVeio.some(t => !t.presenca_confirmada) ? ' <span style="opacity:.75">(pendente)</span>' : '';
            const bandaChk   = S.bandaChecklist?.[`${lojaChk}|${r.data}`];
            if (bandaChk) {
              const consumo   = parseFloat(bandaChk.consumo) || 0;
              const desconto  = Math.max(0, consumo - BANDA_CONSUMO_FRANQUIA);
              const valorPagar= Math.max(0, cacheTotal - desconto);
              const descInfo  = desconto > 0 ? ` · <span style="color:var(--red)">-${money(desconto)} consumação excedida</span>` : '';
              veioHtml = `<div style="margin-top:3px;font-size:9px;background:var(--amber-bg);border-radius:5px;padding:2px 6px;color:var(--amber);font-weight:600">🎵 ${esc(nomes)} · ${money(valorPagar)} a pagar${descInfo}${pendente}</div>`;
            } else {
              veioHtml = `<div style="margin-top:3px;font-size:9px;background:var(--amber-bg);border-radius:5px;padding:2px 6px;color:var(--amber);font-weight:600">🎵 ${esc(nomes)} · ${money(cacheTotal)} cachê${pendente} <span style="opacity:.7">(aguardando fechamento p/ consumação)</span></div>`;
            }
          }
          const bandaHtml = naoVeioHtml + veioHtml;
          const obsHtml = r.obs_gerente
            ? `<div style="margin-top:3px;font-size:9px;background:var(--surf2);border-radius:5px;padding:2px 6px;color:var(--muted);font-weight:600" title="Observação do gerente no fechamento">📝 ${esc(r.obs_gerente)}</div>`
            : '';
          const hasComps   = Object.keys(S.caixaComprovantes[r.id] || {}).length > 0;
          const despRow    = (S.caixaDespesas?.[r.id] || []);
          const totalDesp  = despRow.reduce((a,d) => a + (parseFloat(d.valor)||0), 0);
          const hasDetalhes= hasComps || despRow.length > 0 || (S.caixaSuprimentos?.[r.id]||[]).length > 0 || (S.caixaGorjetas?.[r.id]||[]).length > 0;
          const totalCell  = totalReal != null
            ? money(totalReal) + (totalDesp > 0 ? `<div style="font-size:9px;color:var(--red);font-weight:400;font-variant-numeric:tabular-nums;margin-top:1px">↓ ${money(totalDesp)}</div>` : '')
            : '<span style="color:var(--muted)">—</span>';
          const confSt = S.caixaConferencias?.[r.id];
          const confBadge = confSt
            ? (confSt.tem_divergencia
              ? `<div style="font-size:9px;color:var(--red);font-weight:700;margin-top:1px">⚠️ Dif.</div>`
              : `<div style="font-size:9px;color:var(--green);font-weight:700;margin-top:1px">✅ Ok</div>`)
            : '';
          const conferirCell = fotoB64
            ? `<td style="text-align:center"><img src="${fotoB64}" style="width:30px;height:30px;object-fit:cover;border-radius:4px;cursor:pointer;border:1px solid var(--border)" onclick="verConferencia('${lojaChk}','${r.data}','${r.id}')" title="Conferir fechamento vs. sistema">${confBadge}</td>`
            : `<td style="text-align:center"><button onclick="verConferencia('${lojaChk}','${r.data}','${r.id}')" style="background:none;border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:12px;padding:2px 7px;color:var(--muted);opacity:${hasDetalhes?'1':'0.5'}" title="Conferir fechamento">🔍</button>${confBadge}</td>`;

          return `<tr>
            <td>${fmtBRShort(r.data)}${bandaHtml}${obsHtml}</td>
            <td style="color:var(--muted)">${r.turno}</td>
            <td>${statusBadge}</td>
            <td class="num" style="text-align:right;font-weight:700">${totalCell}</td>
            <td class="num" style="text-align:right;color:var(--muted);font-size:11px">${money(r.repique)}</td>
            <td class="num" style="text-align:right;color:var(--muted);font-size:11px">${money(r.venda_ifood)}</td>
            <td class="num" style="text-align:right;color:var(--muted);font-size:11px">${money(r.venda_online)}</td>
            ${conferirCell}
          </tr>`;
        };
        // Agrupa por data pra somar o repique do dia quando a loja tem 2 caixas
        // (turno DIA + NOITE) — sem isso o RH tinha que somar na mão pra conferir.
        const porData = {};
        rows.forEach(r => { (porData[r.data] = porData[r.data] || []).push(r); });
        const rowsHtml = Object.values(porData).map(rs => {
          const linhas = rs.map(linhaCaixa).join('');
          if (rs.length < 2) return linhas;
          const repDia = rs.reduce((a,r)=>a+(parseFloat(r.repique)||0),0);
          return linhas + `<tr style="background:var(--surf2)">
            <td colspan="4" style="text-align:right;font-size:9px;color:var(--muted);font-weight:700;padding:3px 8px">REPIQUE DO DIA (${rs.length} caixas)</td>
            <td class="num" style="text-align:right;font-weight:800;font-size:11px;padding:3px 8px">${money(repDia)}</td>
            <td colspan="3"></td>
          </tr>`;
        }).join('');
        const totalRow = `<tr style="border-top:2px solid var(--border);background:var(--surf2)">
          <td colspan="3" style="font-weight:800;font-size:11px;color:var(--muted)">TOTAL SEMANA</td>
          <td class="num" style="text-align:right;font-weight:800">${money(totalLoja)}</td>
          <td></td><td></td><td></td>
          <td></td>
        </tr>`;
        return `<div class="card" style="margin-bottom:10px">
          <div class="card-header" style="flex-wrap:wrap;gap:8px;align-items:flex-start">
            <span class="card-title" style="align-self:center">${lojaObj?.display||lojaChk}</span>
            <div style="display:flex;align-items:flex-end;gap:10px;margin-left:auto">
              <div style="text-align:right">
                <div class="num fin-total">${money(totalLoja)}</div>
                <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px">total cofre</div>
              </div>
              <button onclick="gerarPDFFinanceiroLoja('${lojaChk}')" title="Gerar PDF desta loja" style="background:rgba(192,57,43,.12);border:1px solid rgba(192,57,43,.3);border-radius:6px;padding:5px 8px;color:#e74c3c;font-size:11px;font-weight:700;cursor:pointer;align-self:center">📄</button>
            </div>
          </div>
          <div style="overflow-x:auto">
            <table class="fin-table">
              <thead><tr>
                <th>Data</th><th>Turno</th><th>Status</th>
                <th style="text-align:right">Total</th>
                <th style="text-align:right">Repique</th>
                <th style="text-align:right">iFood</th>
                <th style="text-align:right">Online</th>
                <th style="text-align:center" title="Conferir fechamento vs. sistema">🔍</th>
              </tr></thead>
              <tbody>${rowsHtml}${totalRow}</tbody>
            </table>
          </div>
        </div>`;
      }).join('');

  // Gorjeta foto audit
  let fotoHtml = '';
  if (!S.comissaoFotoSuportado) {
    fotoHtml = `<div class="card" style="margin-bottom:14px">
      <div class="card-header"><span class="card-title">📸 Auditoria de Gorjeta</span></div>
      <div class="card-body">
        <div style="font-size:12px;color:var(--muted);margin-bottom:10px">
          Tabela <code>gn_comissao_foto</code> não encontrada. Execute a migração para habilitar o envio de fotos.
        </div>
        <button class="btn btn-sec btn-sm" onclick="modalMigracaoFoto()">Ver SQL de Migração</button>

  } else {

    const fotosRows = lojasFiltradas.map(loja => {

      const status = foto

        : `<span class="badge badge-warn">Pendente</span>`;
      const btn = foto
        ? `<button class="btn-sm btn-sec" style="font-size:10px;padding:3px 9px" onclick="verFoto('${loja.chkKey}','${ini}')">Ver / Analisar</button>`
        : `<button class="btn-sm btn-sec" style="font-size:10px;padding:3px 9px;opacity:0.7" onclick="modalUploadFoto('${loja.chkKey}','${ini}')" title="Aguardando envio pelo App Checklist">📋 Aguardando</button>`;
      return `<tr>

    const pendCount  = lojasFiltradas.length - fotsCount;

  $('content').innerHTML = `
    <div class="sec-header">

    </div>
    ${fotoHtml}
    <div class="sec-header" style="margin-top:4px">
      <div style="font-size:13px;font-weight:700">Fechamentos</div>
      ${S.caixaSemana.length ? `<button onclick="gerarPDFFinanceiroConsolidado()" style="background:rgba(192,57,43,.12);border:1px solid rgba(192,57,43,.3);border-radius:6px;padding:5px 10px;color:#e74c3c;font-size:11px;font-weight:700;cursor:pointer">📄 PDF Consolidado</button>` : ''}
    </div>
