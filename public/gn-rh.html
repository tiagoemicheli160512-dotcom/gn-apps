        const bhMesesKeys = Object.keys(bhMeses).sort();
        const bhRows = bhMesesKeys.length > 0
          ? bhMesesKeys.map(m => {

              const hc = h > 0 ? 'var(--green)' : h < 0 ? 'var(--red)' : 'var(--muted)';

                <span style="font-size:12px;color:var(--muted)">${MES_ABREV_D[parseInt(mo)]} ${y}</span>
                <span class="num" style="font-size:13px;font-weight:700;color:${hc}">${h > 0 ? '+' : ''}${h}h</span>
              </div>`;
            }).join('')

        let avalRows = '';
        if (avs.length === 0) {
          avalRows = `<div style="font-size:12px;color:var(--muted)">Sem avaliações neste dispositivo</div>`;
        } else {
          avalRows = avs.slice(0, 5).map(av => {
            const nota = (av.pontualidade || 0) + (av.uniforme || 0) + (av.criteriosSetor || []).reduce((a, v) => a + (v || 0), 0);
            const mx   = 10 + (av.criteriosSetor?.length > 0 ? av.criteriosSetor.length * 5 : 0);
            const p    = mx > 0 ? Math.round(nota / mx * 100) : 0;
            const acls = p >= 85 ? 'badge-ok' : p >= 60 ? 'badge-info' : p >= 40 ? 'badge-warn' : 'badge-err';
            return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)">
              <div>
                <div style="font-size:12px;font-weight:600">${fmtBR(av.data)}</div>
                <div style="font-size:10px;color:var(--muted)">${av.avaliador || '—'} · ${av.cargo || '—'}</div>
              </div>
              <span class="badge ${acls}">${p}%</span>
            </div>`;
          }).join('');
        }

        expandedHtml = `<div class="doss-exp">
          ${emp.tipo ? `<div style="margin-bottom:10px"><span style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)">Contrato</span><div style="font-size:13px;font-weight:700;margin-top:2px">${emp.tipo}</div></div>` : ''}

          ${avalRows}

      }

      const nomeSafeAttr = nome.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
      return `<div class="doss-card">
        <div class="doss-hdr" onclick="toggleDossExpand('${nomeSafeAttr}')">

            ${bhBadge}${avalBadge}

        </div>
        <div class="doss-stats">
          <div class="doss-stat">
            <span class="doss-stat-val" style="${emp.faltas > 0 ? 'color:var(--red)' : 'color:var(--muted)'}">${emp.faltas}</span>
            <span class="doss-stat-lbl">Faltas</span>
          </div>
          <div class="doss-stat">
            <span class="doss-stat-val" style="${emp.suspensoes > 0 ? 'color:#f97316' : 'color:var(--muted)'}">${emp.suspensoes}</span>
            <span class="doss-stat-lbl">Suspensão</span>
          </div>
          <div class="doss-stat">
            <span class="doss-stat-val" style="${emp.atestados > 0 ? 'color:var(--amber)' : 'color:var(--muted)'}">${emp.atestados}</span>
            <span class="doss-stat-lbl">Atestados</span>
          </div>
          <div class="doss-stat">
            <span class="doss-stat-val" style="color:var(--accent)">${emp.presencas}</span>
            <span class="doss-stat-lbl">Presenças</span>
          </div>
        </div>
        ${expandedHtml}
      </div>`;
    }).join('');
  }

  const PERIODO_LABELS = { dia:'Dia', semana:'Semana', mes:'Mês', meses:'Meses', historico:'Histórico' };
  const periodTabsHtml = Object.entries(PERIODO_LABELS).map(([p, lbl]) =>
    `<button class="ftab${S.dossPeriodo === p ? ' ativo' : ''}" onclick="setDossPeriodo('${p}')">${lbl}</button>`

  $('content').innerHTML = `
    <div class="sec-header">
      <div>
        <div class="sec-title">📋 Dossiê de Funcionários</div>
        <div class="sec-sub">${S.dossLoja.display} · ${totalFuncs} funcionário${totalFuncs !== 1 ? 's' : ''} · ${_dossPeriodoLabel()}</div>

      ${totalFuncs > 0 ? `<div style="display:flex;gap:6px">

    <div style="margin-bottom:10px">

async function filtrarDossLoja(comKey) {
  S.dossLoja = LOJAS.find(l => l.comKey === comKey) || LOJAS[0];
  S.dossExpanded = null;
  S.dossBusca = '';
  $('content').innerHTML = `<div class="empty"><div class="spin"></div></div>`;
  await carregarDossie();
  renderDossie();
}

function toggleDossExpand(nome) {
  S.dossExpanded = S.dossExpanded === nome ? null : nome;
  renderDossie();
}

function setDossPeriodo(p) {
  S.dossPeriodo = p;
  S.dossExpanded = null;
  renderDossie();
}

function gerarDossWpp() {
  const employees = _buildDossEmployees();
  const nomes = Object.keys(employees).sort((a, b) => a.localeCompare(b));
  const hoje = new Date().toLocaleDateString('pt-BR');
  const totalF = nomes.reduce((t, n) => t + employees[n].faltas, 0);
  const totalS = nomes.reduce((t, n) => t + employees[n].suspensoes, 0);
  const totalA = nomes.reduce((t, n) => t + employees[n].atestados, 0);

  const lines = [
    `📋 *Dossiê — ${S.dossLoja.display}*`,
    `📅 ${hoje} · ${_dossPeriodoLabel()}`,
    '',
    `👥 *${nomes.length}* funcionários ativos`,
    `❌ Faltas: *${totalF}* | ⚠️ Suspensões: *${totalS}* | 🏥 Atestados: *${totalA}*`,
    '',
  ];

  const comOcorrencia = nomes.filter(n => {
    const e = employees[n];
    const bh = _dossBHSaldo(n);
    return e.faltas > 0 || e.suspensoes > 0 || e.atestados > 0 || bh < 0;
  });

  if (comOcorrencia.length > 0) {
    lines.push('*⚠️ Funcionários com ocorrências:*', '');
    comOcorrencia.forEach(nome => {
      const e = employees[nome];
      const bh = _dossBHSaldo(nome);
      const partes = [];
      if (e.faltas > 0)     partes.push(`Faltas: ${e.faltas}`);
      if (e.suspensoes > 0) partes.push(`Suspensões: ${e.suspensoes}`);
      if (e.atestados > 0)  partes.push(`Atestados: ${e.atestados}`);
      if (bh !== 0)         partes.push(`BH: ${bh > 0 ? '+' : ''}${bh.toFixed(1)}h`);
      lines.push(`👤 *${nome}*`);
      lines.push(`   ${partes.join(' | ')}`);
    });
  } else {
    lines.push('✅ Nenhuma ocorrência registrada');
  }

  lines.push('', '_GN · RH & Financeiro_');
  window.open(`https://wa.me/?text=${encodeURIComponent(lines.join('\n'))}`, '_blank');
}

async function doLogin() {
  const nome = $('ln-user').value.trim();
  const senha = $('ln-pass').value;
  const errEl = $('ln-err');
  errEl.textContent = '';
  if (!nome || !senha) { errEl.textContent = 'Preencha usuário e senha.'; return; }

  const { data, error } = await db.from('gn_usuarios')
    .select('nome,cargo,loja,permissoes')
    .ilike('nome', nome)
    .eq('senha', senha)
    .eq('ativo', true)
    .single();

  if (error || !data) { errEl.textContent = 'Usuário ou senha inválidos.'; return; }

  // Verificar permissão de acesso ao GN RH
  const _p = data.permissoes || {};
  const _isMaster = ['mestre','supervisor','compras'].includes(data.cargo);
  if (!(_isMaster ? _p.rh !== false : !!_p.rh)) {
    errEl.textContent = 'Sem permissão para acessar GN RH.'; return;
  }

  // Salva sessão
  try { localStorage.setItem(SESSION_KEY, JSON.stringify({...data, ts: Date.now()})); } catch(_) {}
  S.usuario = data;
  iniciarApp();
}

async function iniciarApp() {
  // Tenta restaurar sessão
  if (!S.usuario) {
    try {
      const sess = JSON.parse(localStorage.getItem(SESSION_KEY)||'null');
      if (sess && Date.now() - sess.ts < 86400000 * 7) S.usuario = sess;
    } catch(_) {}
  }

  if (!S.usuario) return; // mostra login

  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');

  const dt = new Date();
  $('hdr-date').textContent = dt.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'});
  $('hdr-user').textContent = S.usuario.nome;
  const su = $('sidebar-user'); if (su) su.textContent = S.usuario.nome;

  // Configurar abas permitidas a partir das permissões salvas
  const abasArr = (S.usuario.permissoes || {}).rh_abas;
  S.abasPermitidas = Array.isArray(abasArr) ? new Set(abasArr) : null;
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.style.display = S.abasPermitidas && !S.abasPermitidas.has(b.dataset.tab) ? 'none' : '';
  });

  S.opData    = new Date(); S.opData.setHours(12,0,0,0);
  S.finSemana = getMondayOfWeek();
  S.rhSemana  = getMondayOfWeek();

  // Ir para a primeira aba permitida
  const primeiraAba = S.abasPermitidas
    ? (['operacoes','financeiro','rh','comparativo','avarias','dossie'].find(t => S.abasPermitidas.has(t)) || 'operacoes')
    : 'operacoes';
  setTab(primeiraAba);
}

// Auto-restore session on load
document.addEventListener('DOMContentLoaded', () => {
  $('ln-pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
  iniciarApp();
});
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'GN_SW_UPDATED') window.location.reload();
  });
  navigator.serviceWorker.register('/sw.js').then(function(reg) { reg.update(); }).catch(function() {});
}
</script>
</body>
</html>
