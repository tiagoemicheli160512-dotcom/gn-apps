function _rhFmtR(valor) {
  return 'R$ ' + Math.abs(valor).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function _rhValorHoraFunc(nome, funcs) {
  const salariosSetor = S.bhConfig?.salariosSetor;
  if (!salariosSetor) return 0;
  const func = (funcs || []).find(f => f.nome === nome);
  if (!func?.setor) return 0;
  const salario = parseFloat(salariosSetor[func.setor]) || 0;
  return salario / 220;
}

function _rhResumoMonetarioHtml(bhFuncs, meses, rhFuncs) {
  if (!S.bhConfig?.salariosSetor || Object.keys(S.bhConfig.salariosSetor).length === 0) return '';
  if (Object.keys(bhFuncs).length === 0) return '';

  const hoje = new Date().toISOString().slice(0, 7);
  const [hy, hm] = hoje.split('-').map(Number);
  const mesAnteriorStr = hm === 1 ? `${hy-1}-12` : `${hy}-${String(hm-1).padStart(2,'0')}`;
  const mesAnterior = meses.includes(mesAnteriorStr) ? mesAnteriorStr : null;

  let posGeral = 0, negGeral = 0, posFecha = 0, negFecha = 0;

  Object.entries(bhFuncs).forEach(([nome, mesSaldo]) => {
    const vh = _rhValorHoraFunc(nome, rhFuncs);
    if (vh <= 0) return;
    const total = meses.reduce((s, m) => s + (parseFloat(mesSaldo[m]) || 0), 0);
    if (total > 0) posGeral += total * vh;
    else if (total < 0) negGeral += Math.abs(total) * vh;
    if (mesAnterior) {
      const h = parseFloat(mesSaldo[mesAnterior]) || 0;
      if (h > 0) posFecha += h * vh;
      else if (h < 0) negFecha += Math.abs(h) * vh;
    }
  });

  const liquidoGeral = posGeral - negGeral;
  const liquidoCor = liquidoGeral > 0 ? 'var(--green)' : liquidoGeral < 0 ? 'var(--red)' : 'var(--muted)';
  const liquidoLabel = liquidoGeral > 0 ? 'a pagar (extras)' : liquidoGeral < 0 ? 'a recuperar (negativos)' : 'equilibrado';

  const MES_ABREV2 = ['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const mesAnteriorLabel = mesAnterior ? (()=>{const [y,m]=mesAnterior.split('-');return MES_ABREV2[parseInt(m)]+'/'+y.slice(2);})() : '';

  const configMeses = S.bhConfig?.periodo_inicio && S.bhConfig?.periodo_fim
    ? (() => {
        const res = []; let [cy,cm] = S.bhConfig.periodo_inicio.slice(0,7).split('-').map(Number);
        const [ey,em] = S.bhConfig.periodo_fim.slice(0,7).split('-').map(Number);
        while(cy < ey || (cy===ey && cm<=em)){ res.push(`${cy}-${String(cm).padStart(2,'0')}`); cm++; if(cm>12){cm=1;cy++;} }
        return res;
      })()
    : meses;
  const mesesDecorridos = configMeses.filter(m => m <= hoje).length;
  const periodoEncerrando = configMeses.length > 0 && mesesDecorridos >= configMeses.length - 1;

  const fechaHtml = mesAnterior ? `
    <div style="margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border)">
      <div style="font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.5px;margin-bottom:6px">FECHAMENTO ${mesAnteriorLabel.toUpperCase()}</div>
      <div style="display:flex;justify-content:space-between;margin-bottom:4px">
        <span style="font-size:12px;color:var(--text2)">✅ Horas extras</span>
        <span style="font-size:12px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums">${posFecha > 0 ? _rhFmtR(posFecha) : '—'}</span>
      </div>
      <div style="display:flex;justify-content:space-between">
        <span style="font-size:12px;color:var(--text2)">❌ Horas negativas</span>
        <span style="font-size:12px;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums">${negFecha > 0 ? _rhFmtR(negFecha) : '—'}</span>
      </div>
    </div>` : '';

  const proximoAlerta = periodoEncerrando ? `
    <div style="margin-top:12px;padding:10px 12px;background:rgba(234,179,8,.08);border:1px solid rgba(234,179,8,.3);border-radius:8px">
      <div style="font-size:11px;font-weight:700;color:#eab308;margin-bottom:5px">⚠️ Alerta para o Próximo Período</div>
      <div style="font-size:11px;color:var(--text2);line-height:1.5">
        Neste período foram pagos <span style="color:var(--red);font-weight:700">${_rhFmtR(negGeral)}</span> em horas negativas
        e gerados <span style="color:var(--green);font-weight:700">${_rhFmtR(posGeral)}</span> em horas extras.
        Ajuste o planejamento de escala para o próximo período.
      </div>
    </div>` : '';

  return `<div class="card" style="margin-bottom:14px">
    <div class="card-header"><span class="card-title">💰 Resumo Monetário — Banco de Horas</span></div>
    <div class="card-body">
      ${fechaHtml}
      <div style="font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.5px;margin-bottom:8px">PERÍODO COMPLETO</div>
      <div style="display:flex;justify-content:space-between;margin-bottom:6px">
        <span style="font-size:12px;color:var(--text2)">✅ Total extras (a pagar)</span>
        <span style="font-size:12px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums">${_rhFmtR(posGeral)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:10px">
        <span style="font-size:12px;color:var(--text2)">❌ Total negativos (já pagos)</span>
        <span style="font-size:12px;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums">${_rhFmtR(negGeral)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding-top:10px;border-top:1px solid var(--border)">
        <span style="font-size:13px;font-weight:700;color:var(--text)">Saldo líquido</span>
        <span style="font-size:13px;font-weight:800;color:${liquidoCor};font-variant-numeric:tabular-nums">${_rhFmtR(Math.abs(liquidoGeral))} <span style="font-size:10px;font-weight:400;color:var(--muted)">${liquidoLabel}</span></span>
      </div>
      ${proximoAlerta}
    </div>
  </div>`;
}

// Linhas expansíveis de setor (produto → contagem → nomes ao clicar). Usada
// tanto pra loja única quanto pra "Todas as lojas" — nesse caso, comKey
// entra na chave de expansão pra não colidir setores com o mesmo nome em
// lojas diferentes (ex.: "Cozinha" em duas lojas, expandidos juntos por acidente).
function _setorGrupoHtml(comKey, setoresOrdenados) {
  return setoresOrdenados.map(([setor,nomes]) => {
    const key = comKey+'|'+setor;
    const aberto = S.rhSetorExpandido.has(key);
    const keyAttr = key.replace(/'/g,"\\'");
    return `<div style="border:1px solid var(--border);border-radius:10px;margin-bottom:6px;overflow:hidden">
      <div onclick="toggleRhSetor('${keyAttr}')" style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;cursor:pointer;background:var(--surf2)">
        <span style="font-size:12px;font-weight:700">${esc(setor)}</span>
        <span style="display:flex;align-items:center;gap:8px">
          <span style="font-size:14px;font-weight:800;color:var(--accent)">${nomes.length}</span>
          <span style="font-size:10px;color:var(--muted);display:inline-block;transform:rotate(${aberto?'180deg':'0deg'});transition:transform .15s">▾</span>
        </span>
      </div>
      ${aberto ? `<div style="padding:6px 12px 8px;border-top:1px solid var(--border)">
        ${nomes.map(n => `<div style="font-size:11px;padding:3px 0;color:var(--text)">${esc(n)}</div>`).join('')}
      </div>` : ''}
    </div>`;
  }).join('');
}

// ══════════════════════════════════════════════
// RENDER — RH / BANCO DE HORAS (Tab 3)
// ══════════════════════════════════════════════
function renderRH() {
  if (!S.rhSemana) S.rhSemana = getMondayOfWeek();
  const sem = formatSemana(S.rhSemana);
  const isCurrentWeek = S.rhSemana.toDateString() === getMondayOfWeek().toDateString();

  // Loja tabs
  const lojaTabsHtml = LOJAS_COM_TESTE.map(l =>
    `<button class="ftab${S.rhLoja.comKey===l.comKey?' ativo':''}" onclick="filtrarRHLoja('${l.comKey}')">${l.display}</button>`
  ).join('');

  // ── BANCO DE HORAS ──
  const MES_ABREV = ['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const mesAtual = new Date().toISOString().slice(0,7); // 'YYYY-MM'

  // Registros banco de horas: agregar por funcionário
  const bhFuncs = {}; // {nome: {mes: horas}}
  S.bancoHoras.forEach(row => {
    (row.registros||[]).forEach(r => {
      if (!r.nome) return;
      if (!bhFuncs[r.nome]) bhFuncs[r.nome] = {};
      bhFuncs[r.nome][row.mes] = r.horas;
    });
  });

  const buscaQ = (S.rhBusca||'').toLowerCase().trim();

  // ── ESCALA & HORAS ──
  const DIAS_SEM = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  let escalaBHHtml = '';
  const escalFuncs = (S.presencaSemana?.funcs || []).map((f,i) => ({...f, _idx: i})).filter(f => f.nome?.trim());
  const escalFuncsFilt = buscaQ ? escalFuncs.filter(f => f.nome.toLowerCase().includes(buscaQ)) : escalFuncs;

  if (escalFuncsFilt.length === 0) {
    escalaBHHtml = `<div class="empty" style="padding:20px"><div class="empty-text">Sem dados de escala para esta semana</div></div>`;
  } else {
    const thDias = DIAS_SEM.map(d => `<th style="text-align:center;min-width:32px">${d}</th>`).join('');
    const rowsHtml = escalFuncsFilt.map(f => {
      const hDia = _parseHorasHorario(f.horario);
      const diasPres = (f.dias || []).filter(s => ESCALA_PRESENTE_SET.has(s || 'PRESENTE')).length;
      const horasSem = hDia != null ? Math.round(hDia * diasPres * 10) / 10 : null;

      // Status especial
      const emFerias = (f.dias || []).some(s => s === 'FÉRIAS');
      const emAfastamento = (f.dias || []).some(s => s === 'AFASTAMENTO');

      // Turno pill
      const tc = ESCALA_TURNO_COLOR[f.turno || ''] || '#475569';
      const turnoPill = f.turno ? `<span style="font-size:9px;background:${tc}22;color:${tc};border-radius:4px;padding:1px 5px;font-weight:700;white-space:nowrap">${f.turno}</span>` : '';
      const horPill = f.horario ? `<span style="font-size:9px;color:var(--muted)">${f.horario}</span>` : '';

      // Badge especial (férias / afastamento)
      let statusBadge = '';
      if (emFerias) statusBadge = `<span class="badge badge-info" style="font-size:8px">🏖 Férias</span>`;
      else if (emAfastamento) statusBadge = `<span class="badge badge-warn" style="font-size:8px">🏥 Afastado</span>${f.afastamento_just ? `<span style="font-size:9px;color:var(--muted)">${f.afastamento_just}</span>` : ''}`;

      // Badges de ocorrências da semana
      const faltasCnt = (f.dias||[]).filter(st => st === 'FALTA').length;
      const suspsCnt  = (f.dias||[]).filter(st => st === 'SUSPENSÃO').length;
      const atestsCnt = (f.dias||[]).filter(st => st === 'ATESTADO').length;
      const justCnt   = (f.dias||[]).filter(st => st === 'JUSTIFICATIVA').length;
      const resumoBadges = [
        faltasCnt>0 ? `<span class="badge badge-err" style="font-size:8px">${faltasCnt}F</span>` : '',
        suspsCnt>0  ? `<span class="badge badge-err" style="font-size:8px">${suspsCnt}S</span>`  : '',
        atestsCnt>0 ? `<span class="badge badge-warn" style="font-size:8px">${atestsCnt}AT</span>` : '',
        justCnt>0   ? `<span class="badge" style="font-size:8px;background:rgba(236,72,153,.15);color:#ec4899;border:1px solid rgba(236,72,153,.3)">${justCnt}JT</span>` : '',
      ].filter(Boolean).join(' ');

      // Dia pills
      const diaCells = DIAS_SEM.map((_, i) => {
        const st = (f.dias || [])[i] || 'PRESENTE';
        const abrev = PRES_ABREV[st] || st.slice(0, 2);
        const cls   = PRES_CLASS[st] || 'day-NW';
        return `<td style="text-align:center"><span class="day-pill ${cls}" title="${st}">${abrev}</span></td>`;
      }).join('');

      // Horas semana cor
      const hColor = horasSem == null ? 'var(--muted)' : horasSem > 44 ? 'var(--red)' : horasSem > 0 ? 'var(--green)' : 'var(--muted)';

      const fDocs = f.docs || {};
      const docThumbsRH = ['ATESTADO','SUSPENSAO','ADVERTENCIA','DEMISSAO'].map(tipo => {
        const foto = fDocs[tipo];
        if (!foto) return '';
        const cor = tipo==='ATESTADO'?'#eab308':tipo==='SUSPENSAO'?'#f97316':tipo==='DEMISSAO'?'#8b5cf6':'#ef4444';
        const lbl = tipo==='ATESTADO'?'Atestado':tipo==='SUSPENSAO'?'Suspensão':tipo==='DEMISSAO'?'Carta Demissão':'Advertência';
        return `<img src="${foto}" onclick="verFotoDoc(${f._idx},'${tipo}')" style="max-width:24px;max-height:24px;border-radius:4px;object-fit:cover;cursor:pointer;border:1px solid ${cor}55;vertical-align:middle" title="${lbl} — toque para abrir">`;
      }).filter(Boolean).join('');
      return `<tr>
        <td class="nome-col" style="min-width:120px;padding:8px 10px">
          <div style="font-weight:700;font-size:12px">${esc(f.nome)}</div>
          <div style="display:flex;gap:3px;flex-wrap:wrap;margin-top:2px;align-items:center">${f.setor ? `<span style="font-size:9px;color:var(--muted)">${f.setor}</span>` : ''}${statusBadge}${resumoBadges ? ' '+resumoBadges : ''}${docThumbsRH ? ' '+docThumbsRH : ''}</div>
          <div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:2px;align-items:center">${turnoPill}${horPill}</div>
        </td>
        ${diaCells}
        <td style="text-align:center;padding:8px 6px;border-left:1px solid var(--border)">
          <div style="font-size:12px;font-weight:800;color:${hColor};font-variant-numeric:tabular-nums">${horasSem != null ? horasSem + 'h' : '—'}</div>
          <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px">${diasPres}d/sem</div>
        </td>
      </tr>`;
    }).join('');

    const faltaFooter = DIAS_SEM.map((_,i) => {
      const cnt = escalFuncsFilt.filter(f => (f.dias||[])[i] === 'FALTA').length;
      return cnt > 0
        ? `<td style="text-align:center"><span class="badge badge-err" style="font-size:8px">${cnt}</span></td>`
        : `<td></td>`;
    }).join('');

    escalaBHHtml = `<div class="rh-table-wrap">
      <table class="rh-table">
        <thead><tr>
          <th>Funcionário</th>
          ${thDias}
          <th style="text-align:center;border-left:1px solid var(--border)">Horas/sem</th>
        </tr></thead>
        <tbody>
          ${rowsHtml}
          <tr style="background:var(--surf2);border-top:2px solid var(--border)">
            <td style="font-size:10px;color:var(--muted);font-weight:700">Faltas</td>
            ${faltaFooter}
            <td></td>
          </tr>
        </tbody>
      </table>
    </div>`;
  }

  const meses = [...new Set(S.bancoHoras.map(r=>r.mes))].sort();

  const bhFuncsFilt = buscaQ
    ? Object.fromEntries(Object.entries(bhFuncs).filter(([n])=>n.toLowerCase().includes(buscaQ)))
    : bhFuncs;

  const rhTemSalarios = S.bhConfig?.salariosSetor && Object.keys(S.bhConfig.salariosSetor).length > 0;
  const rhFuncs = S.presencaSemana?.funcs || [];

  let bhHtml = '';
  if (Object.keys(bhFuncs).length === 0) {
    bhHtml = `<div class="empty" style="padding:24px"><div class="empty-icon">⏱</div><div class="empty-text">Sem dados de banco de horas para ${S.rhLoja.display}</div></div>`;
  } else {
    const mesHeaders = meses.map(m => {
      const [y,mo] = m.split('-');
      return `<th style="text-align:center">${MES_ABREV[parseInt(mo)]} ${y.slice(2)}</th>`;
    }).join('') + `<th style="text-align:center;border-left:2px solid var(--border)">Total</th>` +
      (rhTemSalarios ? `<th style="text-align:center;border-left:1px solid var(--border);color:#fbbf24">Valor R$</th>` : '');

    const rowsHtml = Object.entries(bhFuncsFilt).sort(([a],[b])=>a.localeCompare(b)).map(([nome, mesSaldo]) => {
      const ultimoMes = meses[meses.length-1];
      const ultimoSaldo = ultimoMes != null ? parseFloat(mesSaldo[ultimoMes]) : null;
      const totalFunc = meses.reduce((s,m) => s + (parseFloat(mesSaldo[m])||0), 0);
      const isNeg = totalFunc < 0;
      const negBadge = isNeg ? ' <span class="badge badge-err" style="font-size:8px;vertical-align:middle">⚠️</span>' : '';
      const rowBg = isNeg ? 'background:var(--red-bg)' : '';
      const celulas = meses.map(m => {
        const h = mesSaldo[m];
        if (h == null) return `<td style="text-align:center;color:var(--muted)">—</td>`;
        const hNum = parseFloat(h);
        const color = hNum > 0 ? 'color:var(--green);font-weight:700' : hNum < 0 ? 'color:var(--red);font-weight:700' : 'color:var(--muted)';
        return `<td class="num" style="text-align:center;${color}">${hNum>0?'+':''}${hNum}h</td>`;
      }).join('');
      const totalColor = totalFunc > 0 ? 'color:var(--green);font-weight:800' : totalFunc < 0 ? 'color:var(--red);font-weight:800' : 'color:var(--muted);font-weight:800';
      const totalCell = `<td class="num" style="text-align:center;border-left:2px solid var(--border);${totalColor}">${totalFunc>0?'+':''}${totalFunc.toFixed(1)}h</td>`;
      let valorCell = '';
      if (rhTemSalarios) {
        const vh = _rhValorHoraFunc(nome, rhFuncs);
        const valorColor = vh > 0 ? (totalFunc > 0 ? 'color:var(--green)' : 'color:var(--red)') : 'color:var(--muted)';
        valorCell = `<td class="num" style="text-align:center;border-left:1px solid var(--border);font-weight:700;${valorColor}">${vh > 0 ? _rhFmtR(Math.abs(totalFunc)*vh) : '—'}</td>`;
      }
      return `<tr style="${rowBg}"><td class="nome-col">${esc(nome)}${negBadge}</td>${celulas}${totalCell}${valorCell}</tr>`;
    }).join('');

    const totHtml = meses.map(m => {
      const tot = Object.values(bhFuncsFilt).reduce((a,mb)=>a+(parseFloat(mb[m])||0),0);
      const color = tot > 0 ? 'color:var(--green)' : tot < 0 ? 'color:var(--red)' : 'color:var(--muted)';
      return `<td class="num" style="text-align:center;font-weight:800;${color}">${tot>0?'+':''}${tot.toFixed(1)}h</td>`;
    }).join('');
    const grandTotal = Object.values(bhFuncsFilt).reduce((s,mb) => s + meses.reduce((a,m) => a + (parseFloat(mb[m])||0), 0), 0);
    const grandColor = grandTotal > 0 ? 'color:var(--green)' : grandTotal < 0 ? 'color:var(--red)' : 'color:var(--muted)';
    const grandTotCell = `<td class="num" style="text-align:center;font-weight:800;border-left:2px solid var(--border);${grandColor}">${grandTotal>0?'+':''}${grandTotal.toFixed(1)}h</td>`;
    const grandValorCell = rhTemSalarios ? `<td style="text-align:center;color:var(--muted);font-size:10px;border-left:1px solid var(--border)">—</td>` : '';

    bhHtml = `<div class="rh-table-wrap">
      <table class="rh-table">
        <thead><tr><th>Funcionário</th>${mesHeaders}</tr></thead>
        <tbody>
          ${rowsHtml}
          <tr style="border-top:2px solid var(--border);background:var(--surf2)">
            <td style="font-weight:800;font-size:11px;color:var(--muted)">TOTAL</td>${totHtml}${grandTotCell}${grandValorCell}
          </tr>
        </tbody>
      </table>
    </div>`;
  }

  // Funcionários por setor — conta e lista nomes a partir do mesmo roster da
  // escala da semana (fonte única de "quem trabalha nesta loja"), sem
  // aplicar o filtro de busca, já que é um resumo da loja inteira. Também dá
  // pra ver "Todas as lojas" de uma vez (S.rhSetorTodas), mantendo o mesmo
  // agrupamento por loja → setor, só que pra rede inteira.
  const reportBtnsHtml = `
    <button onclick="gerarWppSetor()" style="background:rgba(37,211,102,.12);border:1px solid rgba(37,211,102,.3);border-radius:6px;padding:5px 10px;color:#22c55e;font-size:11px;font-weight:700;cursor:pointer">📲 WhatsApp</button>
    <button onclick="gerarPDFSetor()" style="background:rgba(192,57,43,.12);border:1px solid rgba(192,57,43,.3);border-radius:6px;padding:5px 10px;color:#e74c3c;font-size:11px;font-weight:700;cursor:pointer">📄 PDF</button>
    <button onclick="enviarPDFSetorWpp()" title="Enviar PDF pelo WhatsApp" style="background:rgba(37,211,102,.12);border:1px solid rgba(37,211,102,.3);border-radius:6px;padding:5px 10px;color:#22c55e;font-size:11px;font-weight:700;cursor:pointer">📄📲 PDF no Whats</button>`;
  // Modo do relatório: com nomes (expansivo, lista quem é de cada setor) ou
  // só a quantidade por setor (resumo, sem nomes) — vale pros 3 botões acima,
  // tanto no modo por loja quanto "Todas as lojas".
  const modoRelHtml = `
    <div style="display:flex;gap:4px;padding:8px 12px 0">
      <button onclick="setRhSetorRelModo('nomes')" style="flex:1;padding:5px 6px;border-radius:6px;border:1px solid ${S.rhSetorRelModo!=='resumo'?'var(--accent)':'var(--border)'};background:${S.rhSetorRelModo!=='resumo'?'var(--accent)':'var(--surf2)'}22;color:${S.rhSetorRelModo!=='resumo'?'var(--accent)':'var(--muted)'};font-size:10px;font-weight:700;cursor:pointer">📋 Com nomes</button>
      <button onclick="setRhSetorRelModo('resumo')" style="flex:1;padding:5px 6px;border-radius:6px;border:1px solid ${S.rhSetorRelModo==='resumo'?'var(--accent)':'var(--border)'};background:${S.rhSetorRelModo==='resumo'?'var(--accent)':'var(--surf2)'}22;color:${S.rhSetorRelModo==='resumo'?'var(--accent)':'var(--muted)'};font-size:10px;font-weight:700;cursor:pointer">🔢 Só quantidade</button>
    </div>`;

  let setorHtml = '';
  if (S.rhSetorTodas) {
    const porLoja = S._setorTodasPorLoja || [];
    const totalGeral = porLoja.reduce((s,l)=>s+l.total,0);
    S._setorCache = { modo:'todas', lojas: porLoja, totalGeral };
    setorHtml = `
      <div class="card" style="margin-bottom:14px">
        <div class="card-header">
          <span class="card-title">👥 Funcionários por Setor — Todas as lojas</span>
          <span style="font-size:11px;color:var(--muted)">${totalGeral} total</span>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px 0">
          <button onclick="toggleRhSetorTodas()" style="background:var(--surf2);border:1px solid var(--border);border-radius:6px;padding:5px 10px;color:var(--text);font-size:11px;font-weight:700;cursor:pointer">📍 Ver só ${esc(S.rhLoja.display)}</button>
          ${reportBtnsHtml}
        </div>
        ${modoRelHtml}
        <div class="card-body" style="padding:8px 12px 12px">
          ${porLoja.length ? porLoja.map(l => `
            <div style="margin-bottom:10px">
              <div style="font-size:11px;font-weight:800;color:rgba(255,255,255,.55);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px">${esc(l.lojaDisplay)} <span style="color:var(--muted);font-weight:600;text-transform:none;letter-spacing:0">· ${l.total}</span></div>
              ${_setorGrupoHtml(l.comKey, l.setores)}
            </div>`).join('') : `<div class="empty" style="padding:16px"><div class="empty-text">Sem dados de escala pra esta semana</div></div>`}
        </div>
      </div>`;
  } else {
    const setorNomes = {};
    escalFuncs.forEach(f => {
      const s = (f.setor||'').trim() || 'Sem setor';
      (setorNomes[s] = setorNomes[s] || []).push(f.nome);
    });
    Object.values(setorNomes).forEach(arr => arr.sort((a,b) => a.localeCompare(b)));
    const setoresOrdenados = Object.entries(setorNomes).sort((a,b) => b[1].length-a[1].length);
    // Cache pros geradores de relatório (WhatsApp/PDF) lerem sem refazer a
    // contagem — reflete exatamente o que está no card (loja selecionada).
    S._setorCache = { modo:'loja', lojaLabel: S.rhLoja.display, total: escalFuncs.length, setores: setoresOrdenados };
    setorHtml = escalFuncs.length ? `
      <div class="card" style="margin-bottom:14px">
        <div class="card-header">
          <span class="card-title">👥 Funcionários por Setor — ${S.rhLoja.display}</span>
          <span style="font-size:11px;color:var(--muted)">${escalFuncs.length} total</span>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px 0">
          <button onclick="toggleRhSetorTodas()" style="background:var(--surf2);border:1px solid var(--border);border-radius:6px;padding:5px 10px;color:var(--text);font-size:11px;font-weight:700;cursor:pointer">🏢 Todas as lojas</button>
          ${reportBtnsHtml}
        </div>
        ${modoRelHtml}
        <div class="card-body" style="padding:8px 12px 12px">
          ${_setorGrupoHtml(S.rhLoja.comKey, setoresOrdenados)}
        </div>
      </div>` : '';
  }

  $('content').innerHTML = `
    <div class="sec-header"><div class="sec-title">RH / Banco de Horas</div></div>
    <div class="filter-row">${lojaTabsHtml}</div>
    <div style="margin-bottom:10px">
      <input type="search" id="rh-busca" value="${(S.rhBusca||'').replace(/"/g,'&quot;')}"
        placeholder="🔍 Pesquisar funcionário…"
        oninput="S.rhBusca=this.value;renderRH();setTimeout(()=>{const el=$('rh-busca');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}},0)"
        style="width:100%;background:var(--surf2);border:1px solid var(--border);color:var(--text);border-radius:var(--rs);padding:8px 12px;font-size:12px;font-family:inherit;outline:none;box-sizing:border-box">
    </div>

    ${setorHtml}

    <div class="card" style="margin-bottom:14px">
      <div class="card-header">
        <span class="card-title">⏱ Saldo Banco de Horas</span>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:11px;color:var(--muted)">${S.rhLoja.display}</span>
          ${Object.keys(bhFuncs).length > 0 ? `
            <button onclick="gerarWppBH()" title="Enviar por WhatsApp" class="btn-sm btn-sec" style="font-size:11px;padding:3px 8px;color:#22c55e">📲</button>
            <button onclick="gerarPDFBH()" title="Gerar PDF" class="btn-sm btn-sec" style="font-size:11px;padding:3px 8px;color:#e74c3c">📄</button>
            <button onclick="enviarPDFBHWpp()" title="Enviar PDF pelo WhatsApp" class="btn-sm btn-sec" style="font-size:11px;padding:3px 8px;color:#22c55e">📄📲</button>
            <button onclick="exportarBHCSV()" class="btn-sm btn-sec" style="font-size:11px;padding:3px 8px">⬇️ CSV</button>
          ` : ''}
        </div>
      </div>
      <div class="card-body" style="padding:0">${bhHtml}</div>
    </div>

    ${_rhResumoMonetarioHtml(bhFuncs, meses, rhFuncs)}

    <div class="card">
      <div class="card-header" style="flex-wrap:wrap;gap:6px;align-items:center">
        <span class="card-title">📊 Escala & Frequência — ${S.rhLoja.display}</span>
        <div style="display:flex;align-items:center;gap:6px;margin-left:auto">
          <button onclick="navegarRHSemana(-1)" style="width:26px;height:26px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);background:var(--surf2)">&#8592;</button>
          <span style="font-size:11px;font-weight:700">Sem.${sem.num} · ${sem.periodo}</span>
          <button ${isCurrentWeek?'disabled style="opacity:.3"':''} onclick="navegarRHSemana(1)" style="width:26px;height:26px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);background:var(--surf2)">&#8594;</button>
          ${escalFuncs.length > 0 ? `
            <button onclick="gerarWppEscala()" title="Enviar por WhatsApp" class="btn-sm btn-sec" style="font-size:11px;padding:3px 8px;color:#22c55e">📲</button>
            <button onclick="gerarPDFEscala()" title="Gerar PDF" class="btn-sm btn-sec" style="font-size:11px;padding:3px 8px;color:#e74c3c">📄</button>
            <button onclick="enviarPDFEscalaWpp()" title="Enviar PDF pelo WhatsApp" class="btn-sm btn-sec" style="font-size:11px;padding:3px 8px;color:#22c55e">📄📲</button>
            <button onclick="exportarEscalaCSV()" class="btn-sm btn-sec" style="font-size:11px;padding:3px 8px">⬇️ CSV</button>
          ` : ''}
        </div>
      </div>
      <div class="card-body" style="padding:0">${escalaBHHtml}</div>
    </div>`;
}

// ══════════════════════════════════════════════
// RENDER — COMPARATIVO FOTO vs SISTEMA (Tab 4)
// ══════════════════════════════════════════════
function renderComparativo() {
  if (!S.compSemana) {
    const hj = getMondayOfWeek();
    S.compSemana = new Date().getDay() === 1 ? datePlusWeeks(hj, -1) : hj;
  }
  const sem = formatSemana(S.compSemana);
  const ini = isoWeekStr(S.compSemana);
  const semIdx = mestraWeekIdx(S.compSemana);
  const diasNome = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];

  let nOk = 0, nDiv = 0, nSemFoto = 0, totalOcrDiff = 0, nComOcr = 0;

  const rows = LOJAS.map(loja => {
    const foto = S.compFotos.find(f => f.loja === loja.chkKey);
    const brutos = S.compComissoes[loja.comKey]?.[String(semIdx)]?.brutos || Array(7).fill(0);
    const jaOk = !!(S.compOk?.[`${loja.chkKey}|${ini}`]);

    if (!foto) {
      nSemFoto++;
      return `<div class="comp-card"><div class="comp-card-hdr">
        <span class="comp-loja">${loja.display}</span>
        <span class="badge badge-warn">Sem foto</span>
      </div></div>`;
    }

    if (!Array.isArray(foto.ocr_brutos) || foto.ocr_brutos.length !== 7) {
      return `<div class="comp-card"><div class="comp-card-hdr">
        <span class="comp-loja">${loja.display}</span>
        <div style="display:flex;align-items:center;gap:6px">
          <span class="badge badge-muted">Sem análise</span>
          <button class="btn btn-sec btn-sm" onclick="setTab('financeiro')">Ir p/ Financeiro</button>
        </div>
      </div></div>`;
    }

    const divergencias = [];
    for (let d = 0; d < 7; d++) {
      const sistema = parseFloat(brutos[d]) || 0;
      const fotoval = (foto.ocr_brutos[d] || 0) / 100;
      const dif = sistema - fotoval;
      if (Math.abs(dif) >= 1.0) divergencias.push({ dia: diasNome[d], sistema, fotoval, dif });
    }
    nComOcr++;
    totalOcrDiff += divergencias.reduce((s, d) => s + Math.abs(d.dif), 0);

    if (divergencias.length === 0) {
      nOk++;
      const okBtn = jaOk
        ? `<span class="badge badge-ok" style="font-size:11px">✓ Confirmado</span>`
        : `<button class="btn btn-sec btn-sm" style="color:var(--green);border-color:var(--green)" onclick="marcarOkComp('${loja.chkKey}','${ini}')">✓ Dar OK</button>`;
      return `<div class="comp-card"><div class="comp-card-hdr">
        <span class="comp-loja">${loja.display}</span>
        <div style="display:flex;align-items:center;gap:6px">${okBtn}</div>
      </div></div>`;
    }

    nDiv++;
    const linhas = divergencias.map(({dia, sistema, fotoval, dif}) => {
      const difStr = `<span style="color:${dif > 0 ? 'var(--green)' : 'var(--red)'}">${dif > 0 ? '+' : ''}${money(dif)}</span>`;
      return `<tr><td style="color:var(--muted)">${dia}</td><td>${money(sistema)}</td><td>${money(fotoval)}</td><td>${difStr}</td></tr>`;
    }).join('');

    return `<div class="comp-card">
      <div class="comp-card-hdr">
        <span class="comp-loja">${loja.display}</span>
        <span class="badge badge-err">⚠ Divergência</span>
      </div>
      <div class="comp-div-body">
        <table class="comp-div-table">
          <thead><tr style="color:var(--muted)"><td>Dia</td><td>Sistema</td><td>Foto</td><td>Diferença</td></tr></thead>
          <tbody>${linhas}</tbody>
        </table>
      </div>
    </div>`;
  }).join('');

  const ocrBanner = nComOcr > 0
    ? totalOcrDiff >= 50
      ? `<div style="background:rgba(239,68,68,.12);border:1px solid #ef4444;border-radius:8px;padding:9px 13px;margin-bottom:12px;font-size:12px;color:#ef4444;font-weight:700">⚠️ Diferença OCR vs Sistema: R$ ${money(totalOcrDiff)} — Verifique os lançamentos</div>`
      : totalOcrDiff > 0
        ? `<div style="background:rgba(245,158,11,.1);border:1px solid #f59e0b;border-radius:8px;padding:9px 13px;margin-bottom:12px;font-size:12px;color:#f59e0b;font-weight:700">⚠️ Diferença OCR vs Sistema: R$ ${money(totalOcrDiff)}</div>`
        : `<div style="background:rgba(34,197,94,.1);border:1px solid #22c55e;border-radius:8px;padding:9px 13px;margin-bottom:12px;font-size:12px;color:#22c55e;font-weight:700">✓ OCR e sistema conferem</div>`
    : '';

  $('content').innerHTML = `
    <div class="week-nav" style="margin-bottom:12px">
      <button onclick="navegarComp(-1)">‹</button>
      <div class="week-label">
        <div class="week-num">S${String(sem.num).padStart(2,'0')}</div>
        <div class="week-period">${sem.periodo}</div>
      </div>
      <button onclick="navegarComp(1)">›</button>
    </div>
    ${ocrBanner}
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <div class="stat" style="flex:1;text-align:center"><div class="stat-val" style="color:var(--green)">${nOk}</div><div class="stat-lbl">OK</div></div>
      <div class="stat" style="flex:1;text-align:center"><div class="stat-val" style="color:var(--red)">${nDiv}</div><div class="stat-lbl">Divergências</div></div>
      <div class="stat" style="flex:1;text-align:center"><div class="stat-val" style="color:var(--amber)">${nSemFoto}</div><div class="stat-lbl">Sem Foto</div></div>
    </div>
    ${rows}
  `;
}

function navegarComp(delta) {
  if (!S.compSemana) {
    const hj = getMondayOfWeek();
    S.compSemana = new Date().getDay() === 1 ? datePlusWeeks(hj, -1) : hj;
  }
  S.compSemana = datePlusWeeks(S.compSemana, delta);
  renderContent();
}

async function marcarOkComp(lojaChkKey, ini) {
  if (!S.compOk) S.compOk = {};
  const key = `${lojaChkKey}|${ini}`;
  S.compOk[key] = true;
  renderComparativo();
  const lojaObj = LOJAS.find(l => l.chkKey === lojaChkKey);
  if (!lojaObj) return;
  try {
    const { data: rows, error: errSel } = await db.from('gn_lojas').select('loja,all_data').eq('loja', lojaObj.comKey);
    if (errSel) throw errSel;
    const row = (rows || [])[0];
    const allData = JSON.parse(JSON.stringify(row?.all_data || {}));
    if (!allData.compOk) allData.compOk = {};
    allData.compOk[ini] = true;
    const { error: errUpd } = await db.from('gn_lojas').upsert({ loja: lojaObj.comKey, all_data: allData }, { onConflict: 'loja' });
    if (errUpd) throw errUpd;
    _logAuditoriaRH('MARCAR_OK_COMPARATIVO', lojaObj.comKey, { ini });
    toast('✅ Marcado como OK!', 'ok');
  } catch(e) {
    delete S.compOk[key];
    renderComparativo();
    toast('Erro ao salvar: ' + (e.message || e), 'err');
  }
}

// ══════════════════════════════════════════════
// AUDITORIA
// ══════════════════════════════════════════════
const AUD_ACOES_RH = {
  CONFIRMAR_AVARIA:        { icon: '✅', label: 'Confirmou pagamento de avaria (RH)', cor: 'var(--green)' },
  EXCLUIR_FOTO_GORJETA:    { icon: '🗑️', label: 'Excluiu foto de gorjeta',            cor: 'var(--red)' },
  SALVAR_CONFERENCIA:      { icon: '💰', label: 'Finalizou conferência de caixa',      cor: 'var(--amber)' },
  MARCAR_OK_COMPARATIVO:   { icon: '✅', label: 'Marcou comparativo como OK',          cor: 'var(--green)' },
  EDITAR_CONTRATO_DOSSIE:  { icon: '✏️', label: 'Editou data de contrato (Dossiê)',    cor: 'var(--amber)' },
};

function _lojaDisplayRH(key) {
  const l = LOJAS.find(x => x.comKey === key || x.chkKey === key || x.userKey === key);
  return l ? l.display : (key || '—');
}

async function _logAuditoriaRH(acao, loja, detalhes) {
  try {
    await db.from('gn_rh_auditoria').insert({
      loja: _lojaDisplayRH(loja),
      usuario: S.usuario?.nome || 'RH',
      acao, detalhes: detalhes || null,
    });
  } catch(e) { console.error('Erro ao registrar auditoria:', e.message || e); }
}

function _fmtDetalhesAuditoriaRH(acao, d) {
  if (!d) return '';
  try {
    if (acao === 'CONFIRMAR_AVARIA')       return `${d.insumo || ''} — ${fmtR(d.valor || 0)}`;
    if (acao === 'EXCLUIR_FOTO_GORJETA')   return `Semana de ${d.semanaIni || ''}`;
    if (acao === 'SALVAR_CONFERENCIA')     return d.temDivergencia ? '⚠️ Com divergência' : '✅ Sem divergência';
    if (acao === 'MARCAR_OK_COMPARATIVO')  return `Semana de ${d.ini || ''}`;
    if (acao === 'EDITAR_CONTRATO_DOSSIE') return `${d.nome || ''} — ${d.campo === 'inicio_contrato' ? 'Início' : 'Fim'}: ${d.valorAntigo || '—'} → ${d.valor || '—'}`;
  } catch(e) {}
  return '';
}

async function carregarAuditoria() {
  try {
    let q = db.from('gn_rh_auditoria').select('*').order('criado_em', { ascending: false }).limit(150);
    if (S.audLoja) q = q.eq('loja', S.audLoja);
    const { data, error } = await q;
    if (error) throw error;
    S.auditoriaData = data || [];
  } catch(e) { S.auditoriaData = []; }
}

function filtrarAudLoja(display) {
  S.audLoja = display;
  $('content').innerHTML = `<div class="empty"><div class="spin"></div></div>`;
  carregarAuditoria().then(renderAuditoria);
}

function renderAuditoria() {
  const lojaFiltros = [
    `<button class="ftab${S.audLoja===''?' ativo':''}" onclick="filtrarAudLoja('')">Todas</button>`,
    ...LOJAS.map(l => `<button class="ftab${S.audLoja===l.display?' ativo':''}" onclick="filtrarAudLoja('${l.display}')">${l.display}</button>`)
  ].join('');

  const rows = S.auditoriaData;
  const itensHtml = rows.length === 0
    ? `<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">Nenhum registro ainda.</div></div>`
    : rows.map(r => {
        const meta = AUD_ACOES_RH[r.acao] || { icon: '•', label: r.acao, cor: 'var(--muted)' };
        const dt = new Date(r.criado_em).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
        const detalheStr = _fmtDetalhesAuditoriaRH(r.acao, r.detalhes);
        return `<div class="card" style="margin-bottom:8px;padding:10px 12px">
          <div style="font-size:12px;font-weight:700;color:${meta.cor}">${meta.icon} ${meta.label}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px">${esc(r.loja || '—')}</div>
          ${detalheStr ? `<div style="font-size:11px;color:var(--text);margin-top:2px">${esc(detalheStr)}</div>` : ''}
          <div style="font-size:10px;color:var(--muted);margin-top:3px">👤 ${esc(r.usuario || '—')} · ${dt}</div>
        </div>`;
      }).join('');

  $('content').innerHTML = `
    <div class="sec-header">
      <div class="sec-title">Auditoria — Quem fez o quê</div>
    </div>
    <div class="filter-row">${lojaFiltros}</div>
    <div style="font-size:11px;color:var(--muted);margin:8px 0 12px">${rows.length} registro${rows.length !== 1 ? 's' : ''}</div>
    ${itensHtml}
  `;
}

// NAV + RENDER
// ══════════════════════════════════════════════
// ══════════════════════════════════════════════
// REALTIME — aviso não-intrusivo de atualização (aba Avarias)
// ══════════════════════════════════════════════
// Só avisa que há dado novo (banner clicável); nunca re-renderiza sozinho,
// para não atrapalhar quem está no meio de uma ação. Se falhar por
// qualquer motivo, a aba continua funcionando normalmente no modo manual
// de sempre (recarregar ao trocar de aba/filtro).
let _rtChannel = null;
function _rtUnsubscribe() {
  if (_rtChannel) {
    try { db.removeChannel(_rtChannel); } catch(e) {}
    _rtChannel = null;
  }
  const banner = $('rt-banner');
  if (banner) banner.remove();
}
function _rtSubscribeAvarias() {
  try {
    _rtChannel = db.channel('gn-rh-avarias-rt')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'gn_lojas' }, () => {
        if (S.tab === 'avarias') _rtShowBanner();
      })
      .subscribe();
  } catch(e) { console.error('realtime avarias:', e); }
}
function _rtShowBanner() {
  if ($('rt-banner') || S.tab !== 'avarias') return;
  const content = $('content');
  if (!content) return;
  const el = document.createElement('div');
  el.id = 'rt-banner';
  el.style.cssText = 'position:sticky;top:0;z-index:50;background:var(--accent,#0969da);color:#fff;padding:9px 14px;border-radius:8px;margin-bottom:10px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer';
  el.innerHTML = '<span>🔄 Há atualizações nas avarias</span><span style="text-decoration:underline">Atualizar</span>';
  el.onclick = () => { el.remove(); recarregar(); };
  content.prepend(el);
}

function setTab(tab) {
  if (S.abasPermitidas && !S.abasPermitidas.has(tab)) return;
  _rtUnsubscribe();
  S.tab = tab;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('ativo', b.dataset.tab===tab));
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  const sl = document.querySelector(`.sidebar-link[data-sidebar-tab="${tab}"]`);
  if (sl) sl.classList.add('active');
  renderContent();
  if (tab === 'avarias') _rtSubscribeAvarias();
}

// ══════════════════════════════════════════════
// DATA — AVARIAS
// ══════════════════════════════════════════════
async function carregarAvarias() {
  // gn-lojas.html (onde a avaria/saída pra terceiro é criada e confirmada) grava
  // avariasAll usando seu próprio "loja" no formato userKey (ex. "SÃO GONÇALO",
  // "NORTE SHOPPING", "NOVA AMERICA", "CAMPO GRANDE") — que difere do comKey usado no
  // resto do gn-rh pra essas 4 lojas (mesmo caso já documentado em carregarVencimentos).
  // Buscar só por comKey deixava as avarias dessas lojas invisíveis aqui mesmo já
  // confirmadas/com valor lançado no app Estoque (aba Terceiros).
  const keys = [...new Set(LOJAS.flatMap(l => [l.comKey, l.userKey]))];
  const { data, error } = await db.from('gn_lojas')
    .select('loja,all_data')
    .in('loja', keys);
  if (error) throw error;

  S.avariasData = (data || []).map(row => ({
    lojaKey: row.loja,
    avarias: (row.all_data?.avariasAll || {})[row.loja] || [],
  })).filter(d => d.avarias.length > 0);

  // Atualiza badge com contagem de pendentes (inclui 'pendente' e 'loja_confirmou')
  const pendCount = S.avariasData.reduce((t, d) =>
    t + d.avarias.filter(a => a.status === 'pendente' || a.status === 'loja_confirmou').length, 0);
  const badge = $('avarias-badge');
  if (badge) {
    badge.textContent = pendCount;
    badge.style.display = pendCount > 0 ? 'inline-block' : 'none';
  }
  const sBadge = $('sidebar-avarias-badge');
  if (sBadge) {
    sBadge.textContent = pendCount;
    sBadge.style.display = pendCount > 0 ? 'inline-block' : 'none';
  }
}

// ══════════════════════════════════════════════
// DATA — VENCIMENTOS (Boletos)
// ══════════════════════════════════════════════
// Mesma fonte usada pela aba "Entradas" do gn-lojas.html (gn_lojas.all_data.entradasAll,
// preenchido ao lançar nota fiscal). Aqui só lemos e consolidamos por loja — nunca gravamos.
// gn-lojas.html grava usando seu próprio "loja" (formato userKey, ex. "SÃO GONÇALO"), que
// difere do comKey usado no resto do gn-rh — por isso buscamos as duas chaves por loja.
async function carregarVencimentos() {
  const keys = [...new Set(LOJAS.flatMap(l => [l.comKey, l.userKey]))];
  const { data, error } = await db.from('gn_lojas')
    .select('loja,all_data')
    .in('loja', keys);
  if (error) throw error;

  const hojeD = new Date(); hojeD.setHours(0, 0, 0, 0);
  const itens = [];
  LOJAS.forEach(lojaObj => {
    const rowsLoja = (data || []).filter(row => row.loja === lojaObj.comKey || row.loja === lojaObj.userKey);
    if (!rowsLoja.length) return;
    // Dedup por fornecedor+NF+vencimento (soma o valor caso a mesma NF apareça nas duas chaves)
    const nfMap = {};
    rowsLoja.forEach(row => {
      const entradasAll = row.all_data?.entradasAll || {};
      const prefix = row.loja + '|';
      Object.entries(entradasAll).forEach(([k, entries]) => {
        if (!k.startsWith(prefix) || !Array.isArray(entries)) return;
        entries.forEach(e => {
          const vencs = (e.vencimentos && e.vencimentos.length) ? e.vencimentos : (e.vencimento ? [e.vencimento] : []);
          vencs.forEach(venc => {
            if (!venc) return;
            const key = (e.fornecedor || '—') + '|' + (e.nf || 'S/N') + '|' + venc;
            if (!nfMap[key]) {
              nfMap[key] = {
                lojaChk: lojaObj.chkKey, lojaDisplay: lojaObj.display,
                fornecedor: (e.fornecedor || '—').trim().toUpperCase(),
                nf: e.nf || 'S/N', dataNF: e.dataNF || '', vencimento: venc, total: 0,
              };
            }
            nfMap[key].total += (e.qtd || 0) * (e.custoUnit || 0);
          });
        });
      });
    });
    Object.values(nfMap).forEach(it => {
      const d = new Date(it.vencimento + 'T00:00:00');
      it.diff = Math.ceil((d - hojeD) / 86400000);
      itens.push(it);
    });
  });
  itens.sort((a, b) => a.vencimento.localeCompare(b.vencimento));
  S.vencimentosData = itens;
}

// ══════════════════════════════════════════════
// DATA — FÉRIAS (todos os funcionários, todas as lojas)
// ══════════════════════════════════════════════
// Fonte: gn_comissoes.all_data.ferias_geral, a mesma lista mantida pela aba
// Férias do app Check-list — aqui só lemos e consolidamos por loja.
async function carregarFerias() {
  const { data, error } = await db.from('gn_comissoes')
    .select('loja,all_data')
    .in('loja', LOJAS.map(l => l.comKey));
  if (error) throw error;

  const itens = [];
  (data || []).forEach(row => {
    const lojaObj = LOJAS.find(l => l.comKey === row.loja);
    if (!lojaObj) return;
    const lista = Array.isArray(row.all_data?.ferias_geral) ? row.all_data.ferias_geral : [];
    lista.forEach(p => itens.push({ ...p, lojaChk: lojaObj.chkKey, lojaDisplay: lojaObj.display }));
  });
  itens.sort((a, b) => (a.inicio || '').localeCompare(b.inicio || ''));
  S.feriasData = itens;
}

// ══════════════════════════════════════════════
// RENDER — AVARIAS (Tab 5)
// ══════════════════════════════════════════════
function renderAvarias() {
  const aguardLoja = [];
  const pendentes = [];
  const finalizados = [];

  S.avariasData.forEach(({ lojaKey, avarias }) => {
    const display = LOJAS.find(l => l.comKey === lojaKey || l.userKey === lojaKey)?.display || lojaKey;
    avarias.forEach(av => {
      if (av.status === 'pendente')       aguardLoja.push({ ...av, lojaKey, display });
      else if (av.status === 'loja_confirmou') pendentes.push({ ...av, lojaKey, display });
      else if (av.status === 'finalizado') finalizados.push({ ...av, lojaKey, display });
    });
  });

  aguardLoja.sort((a, b) => (b.ts || '').localeCompare(a.ts || ''));
  pendentes.sort((a, b) => (b.ts || '').localeCompare(a.ts || ''));
  finalizados.sort((a, b) => (b.rh_conf_ts || b.ts || '').localeCompare(a.rh_conf_ts || a.ts || ''));

  const fmtTs = iso => iso
    ? new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
    : '—';
  const fmtR = v => 'R$ ' + (parseFloat(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  let html = `
    <div class="sec-header">
      <div>
        <div class="sec-title">⚠️ Avarias / Desperdício</div>
        <div class="sec-sub">Validação de pagamentos — RH / Financeiro</div>
      </div>
    </div>`;

  if (aguardLoja.length === 0 && pendentes.length === 0 && finalizados.length === 0) {
    html += `<div class="empty"><div class="empty-icon">✅</div><div class="empty-text">Nenhuma avaria registrada</div></div>`;
    $('content').innerHTML = html;
    return;
  }

  if (aguardLoja.length > 0) {
    html += `<div style="font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#94a3b8;margin-bottom:8px">
      Registradas — aguardando confirmação da loja (${aguardLoja.length})
    </div>`;
    html += aguardLoja.map(av => `
      <div class="card" style="margin-bottom:8px;border-left:3px solid #475569;opacity:.85">
        <div class="card-body">
          <div style="display:flex;justify-content:space-between;align-items:start;gap:8px;margin-bottom:8px">
            <div>
              <div style="font-size:12px;font-weight:800">${av.display}</div>
              <div style="font-size:10px;color:var(--muted)">${(av.ts ? new Date(av.ts).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—')}</div>
            </div>
            <span class="badge" style="background:rgba(148,163,184,.15);color:#94a3b8;border:1px solid rgba(148,163,184,.3)">Aguard. loja</span>
          </div>
          <div style="font-size:14px;font-weight:700;margin-bottom:6px">${av.insumo}</div>
          <div style="display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap">

// ACTION — CONFIRMAR AVARIA (RH)
// ══════════════════════════════════════════════
async function confirmarAvariaRH(lojaKey, avId) {
  if (!confirm('Confirmar o pagamento desta avaria pelo RH/Financeiro?')) return;
  try {
    // Lê o registro atual da loja
    const { data: rows, error } = await db.from('gn_lojas')
      .select('loja,all_data').eq('loja', lojaKey);
    if (error) throw error;
    const row = (rows || [])[0];
    if (!row) throw new Error('Loja não encontrada');

    const allData = JSON.parse(JSON.stringify(row.all_data || {}));
    const avarias = (allData.avariasAll || {})[lojaKey] || [];
    const idx = avarias.findIndex(a => a.id === avId);
    if (idx < 0) throw new Error('Avaria não encontrada');
    if (avarias[idx].status !== 'loja_confirmou') { toast('Loja precisa confirmar antes', 'err'); return; }

    const av = avarias[idx];
    av.status = 'finalizado';
    av.rh_conf_por = S.usuario?.nome || 'RH';
    av.rh_conf_ts = new Date().toISOString();
    if (!allData.avariasAll) allData.avariasAll = {};
    allData.avariasAll[lojaKey] = avarias;

    // Pagamento em dinheiro de transferência entre lojas (app Lojas, aba Transferência) —
    // substitui a devolução física de um empréstimo. Além de finalizar esta avaria, precisa
    // fechar o empréstimo original (transferAll) nas DUAS lojas — sem mexer no estoque, já
    // que a saída/entrada de mercadoria já ficou valendo desde o empréstimo em si.
    if (av.tipo === 'transferencia_dinheiro' && av.transferId) {
      const fecharTransfer = allDataAlvo => {
        Object.values(allDataAlvo.transferAll || {}).forEach(lista => {
          (lista || []).forEach(t => {
            if (t.id === av.transferId) {
              t.quitado = true;
              t.formaQuitacao = 'dinheiro';
              t.dataQuitacao = new Date().toISOString();
            }
          });
        });
      };
      fecharTransfer(allData); // cópia da própria loja (destino), gravada junto abaixo

      if (av.transferOrigemLoja && av.transferOrigemLoja !== lojaKey) {
        const { data: rowsOrig, error: errOrig } = await db.from('gn_lojas')
          .select('loja,all_data').eq('loja', av.transferOrigemLoja);
        if (errOrig) throw errOrig;
        const rowOrig = (rowsOrig || [])[0];
        if (rowOrig) {
          const allDataOrig = JSON.parse(JSON.stringify(rowOrig.all_data || {}));
          fecharTransfer(allDataOrig);
          const { error: e3 } = await db.from('gn_lojas')
            .update({ all_data: allDataOrig, updated_at: new Date().toISOString(), updated_by: S.usuario?.nome || 'RH' })
            .eq('loja', av.transferOrigemLoja);
          if (e3) throw e3;
        }
      }
    }

    const { error: e2 } = await db.from('gn_lojas')
      .update({ all_data: allData, updated_at: new Date().toISOString(), updated_by: S.usuario?.nome || 'RH' })
      .eq('loja', lojaKey);
    if (e2) throw e2;

    _logAuditoriaRH('CONFIRMAR_AVARIA', lojaKey, { insumo: av.insumo, valor: av.valorTotal });
    toast('✅ Pagamento confirmado pelo RH!', 'ok');
    await carregarAvarias();
    renderAvarias();
  } catch(e) {
    toast('Erro: ' + e.message, 'err');
  }
}

function renderContent() {
  $('content').innerHTML = `<div class="empty"><div class="spin"></div></div>`;
  Promise.resolve().then(async () => {
    try {
      if (S.tab === 'operacoes')    { await carregarOperacoes();    renderOperacoes();    }
      if (S.tab === 'financeiro')  { await carregarFinanceiro();  renderFinanceiro();   }

function setOpMode(mode) {
  S.opMode = mode;
  if (!S.opData) { S.opData = new Date(); S.opData.setHours(12,0,0,0); }
  renderContent();
}

function navegarOp(delta) {
  if (!S.opData) { S.opData = new Date(); S.opData.setHours(12,0,0,0); }
  const mode = S.opMode || 'dia';
  if (mode === 'dia') {
    S.opData = new Date(S.opData); S.opData.setDate(S.opData.getDate()+delta);
  } else if (mode === 'sem') {
    S.opData = datePlusWeeks(S.opData, delta);
  } else {
    S.opData = new Date(S.opData.getFullYear(), S.opData.getMonth()+delta, 1, 12);
  }
  const today = new Date(); today.setHours(12,0,0,0);
  if (S.opData > today) S.opData = today;
  renderContent();
}

function _buildTextoRH() {
  if (!S.opData) return '';
  const mode = S.opMode || 'dia';
  let periodo;
  if (mode === 'dia') {
    periodo = S.opData.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'short'});
  } else if (mode === 'sem') {
    const mon = getMondayOfWeek(S.opData);
    const sem = formatSemana(mon);
    periodo = `Semana ${sem.num} (${sem.periodo})`;
  } else {
    const p = S.opData.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
    periodo = p.charAt(0).toUpperCase()+p.slice(1);
  }
  const refMon = getMondayOfWeek(S.opData);
  const semIdx = mestraWeekIdx(refMon);
  let totalFaltas = 0, totalCaixa = 0;
  const linhas = LOJAS.map(loja => {
    const allData = S.comissoesData[loja.comKey];
    let faltas = 0, suspensoes = 0;
    if (mode === 'dia') {
      const di = comissoesDiaIdx(isoDate(S.opData));
      const wd = allData?.[String(semIdx)];
      (wd?.funcs||[]).filter(f=>f.nome?.trim()).forEach(f=>{
        const st=f.dias?.[di]||'';
        if(st==='FALTA')faltas++;
        else if(st==='SUSPENSÃO')suspensoes++;
      });
    } else if (mode === 'sem') {
      const wd = allData?.[String(semIdx)];
      (wd?.funcs||[]).filter(f=>f.nome?.trim()).forEach(f=>{
        (f.dias||[]).forEach(st=>{ if(st==='FALTA')faltas++; else if(st==='SUSPENSÃO')suspensoes++; });
      });
    } else {
      const y=S.opData.getFullYear(), mo=S.opData.getMonth();
      const qtd=new Date(y,mo+1,0).getDate();
      for(let d=1;d<=qtd;d++){
        const dt=new Date(y,mo,d,12);
        const si=mestraWeekIdx(getMondayOfWeek(dt));
        const di=comissoesDiaIdx(isoDate(dt));
        const wd=allData?.[String(si)];
        (wd?.funcs||[]).filter(f=>f.nome?.trim()).forEach(f=>{
          const st=f.dias?.[di]||'';
          if(st==='FALTA')faltas++; else if(st==='SUSPENSÃO')suspensoes++;
        });
      }
    }
    totalFaltas += faltas;
    const cxTotal=(S.opCaixa||[]).filter(r=>r.loja===loja.userKey).reduce((a,r)=>a+(parseFloat(r.total_real)||0),0);
    totalCaixa += cxTotal;
    const partes=[];
    if(faltas>0) partes.push(`${faltas} falta${faltas>1?'s':''}`);
    if(suspensoes>0) partes.push(`${suspensoes} susp.`);
    if(cxTotal>0) partes.push(`R$ ${cxTotal.toLocaleString('pt-BR',{minimumFractionDigits:2})}`);
    return `• ${loja.display}${partes.length?': '+partes.join(', '):' OK'}`;
  }).join('\n');
  return `GN Operações — ${periodo}\n\n${linhas}\n\nTotal faltas: ${totalFaltas}\nCaixa total: R$ ${totalCaixa.toLocaleString('pt-BR',{minimumFractionDigits:2})}`;
}

function exportarFaltasDetalhadas() {
  if (!S.opData) return;
  const mode = S.opMode || 'dia';
  let periodo;
  if (mode === 'dia') {
    periodo = S.opData.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'short'});
  } else if (mode === 'sem') {
    const mon = getMondayOfWeek(S.opData);
    const sem = formatSemana(mon);
    periodo = `Semana ${sem.num} (${sem.periodo})`;
  } else {
    const p = S.opData.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
    periodo = p.charAt(0).toUpperCase()+p.slice(1);
  }
  const refMon = getMondayOfWeek(S.opData);
  const semIdx = mestraWeekIdx(refMon);
  const linhas = LOJAS.map(loja => {
    const allData = S.comissoesData[loja.comKey];
    const funcionariosComFalta = {};
    const addFalta = (nome, tipo) => {
      if (!funcionariosComFalta[nome]) funcionariosComFalta[nome] = {F:0,S:0,AT:0};
      if (tipo==='FALTA') funcionariosComFalta[nome].F++;
      else if (tipo==='SUSPENSÃO') funcionariosComFalta[nome].S++;
      else if (tipo==='ATESTADO') funcionariosComFalta[nome].AT++;
    };
    if (mode === 'dia') {
      const di = comissoesDiaIdx(isoDate(S.opData));
      const wd = allData?.[String(semIdx)];
      (wd?.funcs||[]).filter(f=>f.nome?.trim()).forEach(f=>{
        const st=f.dias?.[di]||'';
        if(['FALTA','SUSPENSÃO','ATESTADO'].includes(st)) addFalta(f.nome,st);
      });
    } else if (mode === 'sem') {
      const wd = allData?.[String(semIdx)];
      (wd?.funcs||[]).filter(f=>f.nome?.trim()).forEach(f=>{
        (f.dias||[]).forEach(st=>{ if(['FALTA','SUSPENSÃO','ATESTADO'].includes(st)) addFalta(f.nome,st); });
      });
    } else {
      const y=S.opData.getFullYear(), mo=S.opData.getMonth();
      const qtd=new Date(y,mo+1,0).getDate();
      for(let d=1;d<=qtd;d++){
        const dt=new Date(y,mo,d,12);
        const si=mestraWeekIdx(getMondayOfWeek(dt));
        const di=comissoesDiaIdx(isoDate(dt));
        const wd=allData?.[String(si)];
        (wd?.funcs||[]).filter(f=>f.nome?.trim()).forEach(f=>{
          const st=f.dias?.[di]||'';
          if(['FALTA','SUSPENSÃO','ATESTADO'].includes(st)) addFalta(f.nome,st);
        });
      }
    }
    const nomes = Object.entries(funcionariosComFalta);
    if (!nomes.length) return `• ${loja.display}: OK`;
    const lista = nomes.map(([nome,c])=>{
      const partes=[];
      if(c.F) partes.push(`${c.F}F`);
      if(c.S) partes.push(`${c.S}S`);
      if(c.AT) partes.push(`${c.AT}AT`);
      return `  - ${nome} (${partes.join('/')})`;
    }).join('\n');

// Converte um texto simples num PDF de verdade (multi-página, fonte monoespaçada),
// usando jsPDF — necessário pra ter um arquivo real pra anexar no WhatsApp (o botão
// de PDF "normal" só abre a janela de impressão do navegador, sem gerar um Blob).
// Mesmo padrão usado em gn-pedidos.html/gn-checklist.html.
function _textoParaPdfBlob(texto, titulo){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const marginX=40, topo=56, lineHeight=13;
  const pageHeight=doc.internal.pageSize.getHeight();
  const maxWidth=doc.internal.pageSize.getWidth()-marginX*2;
  doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text(titulo, marginX, 36);
  doc.setFont('courier','normal'); doc.setFontSize(9);
  let y=topo;
  texto.split('\n').forEach(linha=>{
    const partes=doc.splitTextToSize(linha||' ', maxWidth);
    partes.forEach(p=>{
      if(y>pageHeight-40){ doc.addPage(); y=40; }
      doc.text(p, marginX, y);
      y+=lineHeight;
    });
  });
  return doc.output('blob');
}

// Gera o PDF (a partir de msg/titulo) e abre o compartilhamento nativo do dispositivo
// pra enviar direto pelo WhatsApp. Sem suporte a compartilhar arquivo (ex.: desktop),
// baixa o PDF e abre o WhatsApp com um texto pra anexar manualmente.
async function _compartilharPdfWpp(msg, titulo){
  try{
    const blob=_textoParaPdfBlob(msg, titulo);
    const file=new File([blob], titulo.replace(/\s+/g,'_')+'.pdf', { type:'application/pdf' });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:titulo, text:titulo });
      return;
    }
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=file.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 10000);
    toast('📄 PDF baixado — anexe no WhatsApp manualmente.');
    window.open('https://wa.me/?text='+encodeURIComponent(titulo));
  }catch(e){
    if(e && e.name==='AbortError') return; // usuário cancelou o share sheet
    toast('⚠️ Erro ao gerar PDF: '+(e.message||e), 'err');
  }
}

// independente do que está expandido/fechado na tela. No modo "todas",
// mantém o agrupamento por loja pedido (loja → setor → nomes).
function _setorRelatorioTexto(){
  const c=S._setorCache;
  if(!c) return null;
  const resumo=S.rhSetorRelModo==='resumo';
  if(c.modo==='todas'){
    if(!c.lojas.length) return null;
    let msg=`FUNCIONÁRIOS POR SETOR — TODAS AS LOJAS\n`;
    c.lojas.forEach(l=>{
      msg+=`\n${l.lojaDisplay} (${l.total})\n`;
      l.setores.forEach(([setor,nomes])=>{
        if(resumo){ msg+=`  ${setor}: ${nomes.length}\n`; return; }
        msg+=`  ${setor} (${nomes.length}):\n`;
        nomes.forEach(n=>{ msg+=`    - ${n}\n`; });
      });
    });
    msg+=`\nTotal geral: ${c.totalGeral}`;
    return { msg, titulo:`Funcionários por Setor — Todas as lojas` };
  }
  if(!c.setores.length) return null;
  let msg=`FUNCIONÁRIOS POR SETOR — ${c.lojaLabel}\n`;
  c.setores.forEach(([setor,nomes])=>{
    if(resumo){ msg+=`${setor}: ${nomes.length}\n`; return; }
    msg+=`\n${setor} (${nomes.length})\n`;
    nomes.forEach(n=>{ msg+=`  - ${n}\n`; });
  });
  msg+=`\nTotal: ${c.total}`;
  return { msg, titulo:`Funcionários por Setor — ${c.lojaLabel}` };
}

// Ordem canônica das bandeiras de entrada (mesma lista/rótulos do app Caixa —
// ver ENTRADAS em gn-caixa.html), sem IFOOD/Online porque esses dois já saem
// como colunas próprias (r.venda_ifood/r.venda_online).
const FIN_BANDEIRAS_ORDEM = ['Dinheiro','Pix','Mastercard Crédito','Mastercard Débito','Visa Crédito','Visa Débito','Elo Crédito','Elo Débito','Hipercard','Amex','Ticket Restaurante','Vale Refeição','Sodexo','Alelo','OUTROS'];

// Monta o bloco de texto (data/turno/status/valores completos — formas de
// pagamento e despesas incluídas — com REPIQUE DO DIA quando a loja tem 2+
// caixas na mesma data) de uma loja pra semana carregada em S.caixaSemana —
// reaproveitado tanto no PDF por loja quanto no PDF consolidado.
function _finBlocoLoja(lojaChk) {
  const rows = S.caixaSemana.filter(r => r.loja === lojaChk);
  if (!rows.length) return null;
  const lojaDisplay = LOJAS.find(l => l.userKey === lojaChk)?.display || lojaChk;
  const porData = {};
  rows.forEach(r => { (porData[r.data] = porData[r.data] || []).push(r); });
  let totalLoja = 0;
  const linhas = Object.keys(porData).sort().map(data => {
    const rs = porData[data];
    const bloco = rs.map(r => {
      totalLoja += parseFloat(r.total_real) || 0;
      const totalStr = r.total_real != null ? money(r.total_real) : '—';
      const comps = S.caixaComprovantes?.[r.id] || {};
      const bandeiras = FIN_BANDEIRAS_ORDEM.filter(b => comps[b] != null);
      Object.keys(comps).forEach(b => { if (b !== 'IFOOD' && b !== 'Online' && !bandeiras.includes(b)) bandeiras.push(b); });
      const bandeirasStr = bandeiras.length
        ? `\n  Formas de pagamento: ${bandeiras.map(b => `${b} ${money(comps[b])}`).join(' | ')}`
        : '';
      const despRow = S.caixaDespesas?.[r.id] || [];
      const despStr = despRow.length
        ? `\n  Despesas: ${despRow.map(d => `${d.nome||d.categoria} ${money(d.valor)}`).join(', ')} (total ${money(despRow.reduce((a,d)=>a+(parseFloat(d.valor)||0),0))})`
        : '';
      return `${fmtBRShort(r.data)} — ${r.turno} — ${r.status}\n  Total: ${totalStr}   Repique: ${money(r.repique)}   iFood: ${money(r.venda_ifood)}   Online: ${money(r.venda_online)}${bandeirasStr}${despStr}`;
    }).join('\n\n');
    if (rs.length < 2) return bloco;
    const repDia = rs.reduce((a,r)=>a+(parseFloat(r.repique)||0),0);
    return bloco + `\n\n  REPIQUE DO DIA (${rs.length} caixas): ${money(repDia)}`;
  }).join('\n\n');
  return { lojaDisplay, linhas, totalLoja };
}

function gerarPDFFinanceiroLoja(lojaChk) {
  const b = _finBlocoLoja(lojaChk);
  if (!b) { toast('Sem fechamentos nesta semana.', 'err'); return; }
  const sem = formatSemana(S.finSemana);

function gerarPDFFinanceiroConsolidado() {
  if (!S.caixaSemana.length) { toast('Sem fechamentos nesta semana.', 'err'); return; }
  const sem = formatSemana(S.finSemana);
  const lojasChk = [...new Set(S.caixaSemana.map(r => r.loja))];
  let totalGeral = 0;
  const blocos = lojasChk.map(chk => _finBlocoLoja(chk)).filter(Boolean)
    .sort((a,b) => a.lojaDisplay.localeCompare(b.lojaDisplay))
    .map(b => { totalGeral += b.totalLoja; return `${b.lojaDisplay}\n${b.linhas}\nSubtotal: ${money(b.totalLoja)}`; })
    .join('\n\n' + '─'.repeat(32) + '\n\n');
  const texto = `GN RH — Financeiro Consolidado\nSemana ${sem.num} (${sem.periodo})\n\n${blocos}\n\nTOTAL GERAL: ${money(totalGeral)}`;
  gerarPDF(texto, `Financeiro Consolidado — Sem. ${sem.num}`);
}

  const foto = S.comissaoFotos.find(f=>f.loja===loja && f.semana_ini===semanaIni);
  if (!foto?.foto_base64) { toast('Foto não encontrada', 'err'); return; }
  const lojaDisplay = LOJAS.find(l=>l.chkKey===loja)?.display || loja;

  const dias = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  let ocrHtml = '';

  if (Array.isArray(foto.ocr_brutos) && foto.ocr_brutos.length === 7) {
    const mestre = foto.ocr_mestre_brutos;
    const analisadoEm = foto.ocr_analisado_em
      ? new Date(foto.ocr_analisado_em).toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})
      : '';

    const cabTh = mestre
      ? `<th style="text-align:right">Foto (OCR)</th><th style="text-align:right">Sistema</th><th style="text-align:right">Dif.</th>`
      : `<th style="text-align:right">Foto (OCR)</th>`;

    const linhas = dias.map((d, i) => {

      const fmtOcr = 'R$ ' + num(ocr / 100);
      if (!mestre) return `<tr><td>${d}</td><td style="text-align:right">${fmtOcr}</td></tr>`;
      const mes = mestre[i] || 0;
      const dif = ocr - mes;
      const difStr = dif === 0 ? '—'
        : `<span style="color:${dif>0?'var(--green)':'var(--red)'}">${dif>0?'+':''}R$ ${num(dif/100)}</span>`;
      return `<tr>
        <td>${d}</td>
        <td style="text-align:right">${fmtOcr}</td>
        <td style="text-align:right">R$ ${num(mes/100)}</td>
        <td style="text-align:right">${difStr}</td>

    }).join('');

    ocrHtml = `
      <div style="margin-top:14px;border-top:1px solid var(--border);padding-top:12px">

            </tr></thead>
            <tbody>${linhas}</tbody>
          </table>
        </div>
      </div>`;
  } else {
    ocrHtml = '';
  }

  abrirModal(`
    <div class="modal-handle"></div>
    <div class="modal-title">
      📸 ${lojaDisplay} — ${fmtBR(semanaIni)}
      <button class="modal-close" onclick="fecharModal()">×</button>

    <p style="font-size:11px;color:var(--muted);margin-top:8px">Enviado por: ${foto.enviado_por||'—'}</p>

      <button class="btn btn-danger" onclick="excluirFoto('${loja}','${semanaIni}')">Excluir</button>

async function verConferencia(lojaUserKey, data, id) {
  var row = S.caixaSemana.find(function(r) { return r.id === id; });
  if (!row) { toast('Dados não encontrados', 'err'); return; }
  var lojaObj = LOJAS.find(function(l) { return l.userKey === lojaUserKey; });
  var b64 = row.foto_sistema || (S.fotosCaixaSistema ? S.fotosCaixaSistema[lojaUserKey + '|' + data] : null);
  var comps      = S.caixaComprovantes[id] || {};
  var despesas    = S.caixaDespesas    ? (S.caixaDespesas[id]    || []) : [];
  var suprimentos = S.caixaSuprimentos ? (S.caixaSuprimentos[id] || []) : [];
  var gorjetas    = S.caixaGorjetas    ? (S.caixaGorjetas[id]    || []) : [];

  // Fotos das despesas: carregadas on-demand do checklist_diario.despesas (onde o app Caixa as persiste)
  var despesaFotos = {};
  if (despesas.length > 0 && lojaObj) {
    try {
      var chkRes = await db.from('checklist_diario').select('despesas')
        .eq('loja', lojaObj.chkKey).eq('data_operacao', data).limit(1);
      if (chkRes.data && chkRes.data[0] && Array.isArray(chkRes.data[0].despesas)) {
        chkRes.data[0].despesas.forEach(function(d) {
          if (d.id && d.foto) despesaFotos[String(d.id)] = d.foto;
        });
      }
    } catch(_) {}
  }

  var totalReal  = row.total_real != null ? parseFloat(row.total_real) : null;
  var totalDesp  = despesas.reduce(function(a,d) { return a + (parseFloat(d.valor)||0); }, 0);
  var totalSup   = suprimentos.reduce(function(a,s) { return a + (parseFloat(s.valor)||0); }, 0);
  var totalGor   = gorjetas.reduce(function(a,g) { return a + (parseFloat(g.valor)||0); }, 0);
  var label      = lojaObj ? lojaObj.display : lojaUserKey;
  var statusCls  = STATUS_CLASS[row.status] || 'badge-muted';

  // Existing conference data
  var existConf = S.caixaConferencias ? S.caixaConferencias[id] : null;

  // Bandeiras with non-zero values (ordered)
  var allBand = FIN_ENTRADAS_ORDER.slice();
  Object.keys(comps).forEach(function(k) { if (!allBand.includes(k)) allBand.push(k); });
  var validBand = allBand.filter(function(b) { return comps[b] != null && comps[b] !== 0; });

  // Compact foto section
  var fotoSection = b64
    ? '<div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">📷 Foto do Sistema</div>'

    : '';

  if (existConf) {
    var confDate = existConf.conferido_em ? new Date(existConf.conferido_em).toLocaleString('pt-BR') : '';
    var divRes = existConf.tem_divergencia ? existConf.divergencia_resolvida : null;
    var bStyle = existConf.tem_divergencia
      ? (divRes ? 'background:#2d1e0a;color:#f59e0b;border:1px solid #f59e0b' : 'background:#2d0a0a;color:#ff6b6b;border:1px solid #ff6b6b')
      : 'background:#0a2d0a;color:#51cf66;border:1px solid #51cf66';
    confStatusBanner = '<div style="border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:12px;font-weight:700;' + bStyle + '">'
      + (existConf.tem_divergencia ? (divRes ? '📝 Divergência identificada — caixa será orientado' : '⚠️ Conferido com divergência') : '✅ Conferido — sem divergência')
      + (confDate ? '<div style="font-weight:400;opacity:.8;font-size:10px;margin-top:2px">Por ' + (existConf.conferido_por||'') + ' em ' + confDate + '</div>' : '')
      + (divRes ? '<div style="font-weight:400;opacity:.8;font-size:10px;margin-top:2px">Identificado por ' + esc(divRes.resolvido_por||'') + (divRes.resolvido_em ? ' em ' + new Date(divRes.resolvido_em).toLocaleString('pt-BR') : '') + (divRes.obs ? ' — ' + esc(divRes.obs) : '') + '</div>' : '')
      + '</div>';
  }

  // Começa em branco (não pré-preenchido com o valor do Sistema) pra obrigar quem
  // for conferir a digitar o valor que realmente contou, em vez de só confirmar o
  // que já estava lá. Só vem preenchido se já existir uma conferência salva antes.
  function getConfVal(key, sistValue) {
    if (!existConf || !existConf.itens) return '';
    var entry;
    if (key.startsWith('band_')) {
      entry = existConf.itens.bandeiras ? existConf.itens.bandeiras[key.slice(5)] : undefined;
    } else {
      entry = existConf.itens[key];
    }
    if (entry && entry.conferido != null) return parseFloat(entry.conferido).toFixed(2);
    return '';
  }

  var inputStyle = 'width:82px;background:var(--surf2);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px;padding:3px 5px;text-align:right;font-family:inherit;font-variant-numeric:tabular-nums';
  var tdSist = 'text-align:right;padding:4px 6px;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap';
  var tdDif  = 'text-align:right;padding:4px 6px;font-size:11px;white-space:nowrap;font-weight:600;min-width:56px';

  function safeKey(k) { return k.replace(/[^a-zA-Z0-9_]/g, '-'); }

  function makeRow(key, rowLabel, sistValue) {
    var sist = sistValue != null ? parseFloat(sistValue) : null;
    var sk = safeKey(key);
    var confVal = getConfVal(key, sist);
    var sistStr = sist != null ? money(sist) : '—';
    var sistAttr = sist != null ? String(sist) : '';

      + '<td style="padding:4px 8px;font-size:12px;color:var(--muted)">' + rowLabel + '</td>'
      + '<td style="' + tdSist + '">' + sistStr + '</td>'
      + '<td style="padding:3px 4px"><input type="number" class="conf-input" id="cfinp-' + sk + '" data-key="' + key + '" data-sist="' + sistAttr + '" step="0.01" min="0" value="' + confVal + '" oninput="calcConfDif()" style="' + inputStyle + '"></td>'
      + '<td id="cfdif-' + sk + '" style="' + tdDif + ';color:var(--muted)">—</td>'
      + '</tr>';
  }

  function makeDespRow(key, rowLabel, sistValue, fotoB64) {
    var sist = sistValue != null ? parseFloat(sistValue) : null;
    var sk = safeKey(key);
    var confVal = getConfVal(key, sist);
    var sistStr = sist != null ? money(sist) : '—';
    var sistAttr = sist != null ? String(sist) : '';
    var thumb = fotoB64

      : '';
