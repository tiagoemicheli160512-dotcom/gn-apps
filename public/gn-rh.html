      + '<td style="padding:4px 8px;vertical-align:top"><div style="font-size:12px;color:var(--muted)">' + rowLabel + '</div>' + thumb + '</td>'
      + '<td style="' + tdSist + ';vertical-align:top">' + sistStr + '</td>'
      + '<td style="padding:3px 4px;vertical-align:top"><input type="number" class="conf-input" id="cfinp-' + sk + '" data-key="' + key + '" data-sist="' + sistAttr + '" data-foto="' + (fotoB64 ? sk : '') + '" step="0.01" min="0" value="' + confVal + '" oninput="calcConfDif()" style="' + inputStyle + '"></td>'
      + '<td id="cfdif-' + sk + '" style="' + tdDif + ';color:var(--muted);vertical-align:top">—</td>'
      + '</tr>';
  }

  function makeReadRow(rowLabel, value) {
    var str = value != null ? money(parseFloat(value)) : '—';
    return '<tr style="border-top:2px solid var(--border);background:var(--surf2)">'
      + '<td style="padding:5px 8px;font-size:12px;font-weight:700" colspan="2">' + rowLabel + '</td>'
      + '<td colspan="2" style="text-align:right;padding:5px 8px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums">' + str + '</td>'
      + '</tr>';
  }

  function makeSectionRow(sec) {
    return '<tr><td colspan="4" style="padding:5px 8px 2px;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;background:var(--surf2)">' + sec + '</td></tr>';
  }

  // Foto inline full-view stash (keyed by safeKey) — fotos vêm de checklist_diario.despesas
  var _confFotos = {};
  despesas.forEach(function(d) {
    var f = despesaFotos[String(d.id)];
    if (f) _confFotos[safeKey('desp_' + d.id)] = f;
  });
  window._confFotosMap = _confFotos;

  var confRows = '';
  confRows += makeRow('total_real', 'Total Real (Cofre)', totalReal);
  confRows += makeRow('repique', 'Repique', row.repique || 0);
  confRows += makeRow('venda_ifood', 'iFood', row.venda_ifood || 0);
  confRows += makeRow('venda_online', 'Online', row.venda_online || 0);
  if (validBand.length > 0) {
    confRows += makeSectionRow('▸ Entradas por bandeira');
    validBand.forEach(function(b) { confRows += makeRow('band_' + b, b, comps[b]); });
  }
  if (despesas.length > 0) {
    confRows += makeSectionRow('▸ Saídas');
    despesas.forEach(function(d) {
      var baseLabel = SAIDA_LABEL[d.categoria] || d.categoria;
      var fullLabel = d.nome && d.nome !== baseLabel ? baseLabel + ' · ' + d.nome : baseLabel;
      confRows += makeDespRow('desp_' + d.id, fullLabel, d.valor, despesaFotos[String(d.id)] || null);
    });
    confRows += makeReadRow('Total Saídas', totalDesp);
  }
  if (suprimentos.length > 0) {
    confRows += makeSectionRow('▸ Suprimento');
    suprimentos.forEach(function(s, i) {
      confRows += makeRow('supr_' + i, s.descricao || 'Suprimento', s.valor);
    });
    confRows += makeReadRow('Total Suprimento', totalSup);
  }
  if (gorjetas.length > 0) {
    confRows += makeSectionRow('▸ Gorjetas');
    gorjetas.forEach(function(g, i) {
      var glabel = (g.garcom ? g.garcom : '') + (g.mesa ? ' / Mesa ' + g.mesa : '');
      confRows += makeRow('gor_' + i, glabel.trim() || 'Gorjeta', g.valor);
    });
    confRows += makeReadRow('Total Gorjetas', totalGor);
  }

  var safeId = id.replace(/[^a-zA-Z0-9_]/g, '-');

  // Resumo do Dia — mesmo cálculo do app Caixa
  var totEntradas = Object.values(comps).reduce(function(a, v) { return a + (parseFloat(v) || 0); }, 0);
  var rIfood      = parseFloat(comps['IFOOD']  || row.venda_ifood  || 0);
  var rOnline     = parseFloat(comps['Online'] || row.venda_online || 0);
  var rRepique    = parseFloat(row.repique || 0);
  var rSalao      = Math.max(0, totEntradas - rIfood - rOnline - rRepique);
  var rDinheiro   = parseFloat(comps['Dinheiro'] || 0);
  var rCashFisico = rDinheiro - totalDesp;
  var rSaldoReal  = rDinheiro;
  var hasEntradas = totEntradas > 0;

  var rl = function(lbl, val, bold, color) {
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border)">'
      + '<span style="font-size:' + (bold ? '12' : '11') + 'px;' + (bold ? 'font-weight:700;' : 'color:var(--muted);') + '">' + lbl + '</span>'
      + '<span style="font-size:' + (bold ? '13' : '12') + 'px;font-weight:' + (bold ? '800' : '600') + ';font-variant-numeric:tabular-nums;color:' + (color || (bold ? 'var(--text)' : 'var(--muted)')) + '">'
      + money(val) + '</span></div>';
  };

  var resumoHtml = hasEntradas
    ? '<div style="background:var(--surf2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:14px">'
      + '<div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">📊 Resumo do Dia</div>'
      + '<div style="background:var(--surf);border-radius:7px;padding:8px 10px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center">'
      + '<span style="font-size:12px;font-weight:700">Venda do Dia (Total Entradas)</span>'
      + '<span style="font-size:14px;font-weight:800;font-variant-numeric:tabular-nums">' + money(totEntradas) + '</span>'
      + '</div>'
      + rl('iFood', rIfood, false)
      + rl('Online', rOnline, false)
      + rl('Repique', rRepique, false)
      + rl('Venda Salão', rSalao, false)
      + (totalDesp > 0 ? rl('Saídas c/ Comprovantes', totalDesp, false, 'var(--red)') : '')
      + rl('→ Dinheiro físico em caixa', rCashFisico, false)
      + '<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0 2px;margin-top:2px">'
      + '<span style="font-size:12px;font-weight:700">Saldo Real (Dinheiro + Comprovantes)</span>'
      + '<span style="font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--green)">' + money(rSaldoReal) + '</span>'
      + '</div>'
      + (totalReal != null ? '<div style="font-size:10px;color:var(--muted);padding-top:6px;border-top:1px solid var(--border);margin-top:4px">Valor encontrado no cofre: <b style="color:var(--text)">' + money(totalReal) + '</b></div>' : '')
      + '</div>'
    : '';

  abrirModal(
    '<div class="modal-handle"></div>'
    + '<div class="modal-title">🔍 Conferência — ' + label
    + '<button class="modal-close" onclick="fecharModal()">×</button></div>'
    + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">'
    + '<span style="font-size:13px;font-weight:600">' + fmtBRShort(data) + ' · ' + row.turno + '</span>'
    + '<span class="badge ' + statusCls + '">' + (row.status || '') + '</span>'
    + '</div>'
    + confStatusBanner
    + resumoHtml
    + fotoSection
    + '<div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">📋 Conferência Manual</div>'
    + '<table style="width:100%;border-collapse:collapse;margin-bottom:10px">'
    + '<thead><tr style="background:var(--surf2)">'
    + '<th style="padding:4px 8px;font-size:10px;text-align:left;color:var(--muted);font-weight:600">Item</th>'
    + '<th style="padding:4px 6px;font-size:10px;text-align:right;color:var(--muted);font-weight:600">Sistema</th>'
    + '<th style="padding:4px 4px;font-size:10px;text-align:right;color:var(--muted);font-weight:600">Conferido</th>'
    + '<th style="padding:4px 6px;font-size:10px;text-align:right;color:var(--muted);font-weight:600">Dif.</th>'
    + '</tr></thead><tbody>' + confRows + '</tbody></table>'
    + '<div id="conf-result-' + safeId + '" style="margin-bottom:12px"></div>'
    + '<div class="modal-actions">'
    + '<button class="btn btn-sec" onclick="fecharModal()">Fechar</button>'
    + '<button class="btn btn-pri" id="conf-btn-' + safeId + '" onclick="salvarConferencia(\'' + id + '\',\'' + lojaUserKey.replace(/'/g, "\\'") + '\')">✅ Finalizar Conferência</button>'
    + '</div>'
  );

  setTimeout(calcConfDif, 0);
}

function calcConfDif() {
  document.querySelectorAll('.conf-input').forEach(function(input) {
    var key = input.dataset.key;
    var sk = key.replace(/[^a-zA-Z0-9_]/g, '-');
    var difEl = document.getElementById('cfdif-' + sk);
    if (!difEl) return;
    var sistRaw = input.dataset.sist;
    if (sistRaw === '' || sistRaw == null) { difEl.textContent = '—'; difEl.style.color = 'var(--muted)'; return; }
    if (input.value === '') { difEl.textContent = 'preencher'; difEl.style.color = 'var(--amber)'; return; }
    var sist = parseFloat(sistRaw);
    var conf = parseFloat(input.value) || 0;
    var dif = conf - sist;
    if (Math.abs(dif) < 0.005) {
      difEl.innerHTML = '<span style="color:var(--green)">✅</span>';
      difEl.style.color = '';
    } else {
      var sign = dif > 0 ? '+' : '−';
      difEl.textContent = sign + ' R$ ' + Math.abs(dif).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
      difEl.style.color = dif > 0 ? 'var(--green)' : 'var(--red)';
    }
  });
}

// Ao confirmar a conferência, a foto do sistema e as fotos das despesas desse fechamento
// já cumpriram seu papel de auditoria — apaga pra otimizar espaço. gn_caixa_despesa não
// tem coluna própria de foto — a foto da despesa vive só em checklist_diario.despesas[]
// (é de lá que verConferencia() lê pra exibir), então basta limpar ali. Best-effort: erro
// aqui não deve travar a confirmação da conferência em si (já foi salva antes desta chamada).
async function _limparFotosCaixaConferido(fechId, lojaObj, data) {
  try {
    await db.from('gn_caixa_fechamento').update({ foto_sistema: null }).eq('id', fechId);
    if (lojaObj && data) {
      var chkRes = await db.from('checklist_diario').select('despesas')
        .eq('loja', lojaObj.chkKey).eq('data_operacao', data).limit(1);
      var arr = chkRes.data && chkRes.data[0] && Array.isArray(chkRes.data[0].despesas) ? chkRes.data[0].despesas : null;
      if (arr && arr.some(function(d) { return d.foto; })) {
        var novo = arr.map(function(d) { return d.foto ? Object.assign({}, d, { foto: '' }) : d; });
        await db.from('checklist_diario').update({ despesas: novo })
          .eq('loja', lojaObj.chkKey).eq('data_operacao', data);
      }
    }
  } catch(_) {}
}

async function salvarConferencia(fechId, lojaUserKey) {
  var lojaObj = LOJAS.find(function(l) { return l.userKey === lojaUserKey; });
  var comKey = lojaObj ? lojaObj.comKey : lojaUserKey;
  var safeId = fechId.replace(/[^a-zA-Z0-9_]/g, '-');

  var camposVazios = false;
  document.querySelectorAll('.conf-input').forEach(function(input) {
    if (input.value === '') camposVazios = true;
  });
  if (camposVazios) {
    toast('Preencha todos os valores conferidos antes de finalizar', 'err');
    return;
  }

  var itens = {};
  var bandeiras = {};
  var temDivergencia = false;

  document.querySelectorAll('.conf-input').forEach(function(input) {
    var key = input.dataset.key;
    var sistRaw = input.dataset.sist;
    var sist = sistRaw !== '' && sistRaw != null ? parseFloat(sistRaw) : null;
    var conf = parseFloat(input.value) || 0;
    var dif = sist != null ? Math.round((conf - sist) * 100) / 100 : 0;
    if (Math.abs(dif) >= 0.01) temDivergencia = true;
    var entry = { sistema: sist, conferido: conf, dif: dif };
    if (key.startsWith('band_')) {
      bandeiras[key.slice(5)] = entry;
    } else {
      itens[key] = entry;
    }
  });
  if (Object.keys(bandeiras).length > 0) itens.bandeiras = bandeiras;

  var conferencia = {
    conferido_em: new Date().toISOString(),
    conferido_por: S.usuario ? S.usuario.nome : 'Usuário',
    tem_divergencia: temDivergencia,
    itens: itens,
  };

  var btn = document.getElementById('conf-btn-' + safeId);
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Salvando...'; }

  try {
    var resLoja = await db.from('gn_lojas').select('all_data').eq('loja', comKey);
    if (resLoja.error) throw resLoja.error;
    var allData = (resLoja.data && resLoja.data[0] ? resLoja.data[0].all_data : null) || {};
    var conferencias = allData.caixa_conferencias || {};
    conferencias[fechId] = conferencia;
    var resUpd = await db.from('gn_lojas').upsert(
      { loja: comKey, all_data: Object.assign({}, allData, { caixa_conferencias: conferencias }) },
      { onConflict: 'loja' }
    );
    if (resUpd.error) throw resUpd.error;

    if (!S.caixaConferencias) S.caixaConferencias = {};
    S.caixaConferencias[fechId] = conferencia;
    _logAuditoriaRH('SALVAR_CONFERENCIA', comKey, { temDivergencia: temDivergencia });

    var rowFech = S.caixaSemana.find(function(r) { return r.id === fechId; });
    if (rowFech) rowFech.foto_sistema = null;
    _limparFotosCaixaConferido(fechId, lojaObj, rowFech ? rowFech.data : null).catch(function(){});

    var resultEl = document.getElementById('conf-result-' + safeId);
    if (resultEl) {
      var bStyle2 = temDivergencia
        ? 'background:#2d0a0a;color:#ff6b6b;border:1px solid #ff6b6b'
        : 'background:#0a2d0a;color:#51cf66;border:1px solid #51cf66';
      resultEl.innerHTML = '<div style="border-radius:8px;padding:10px 14px;font-size:13px;font-weight:700;' + bStyle2 + '">'
        + (temDivergencia ? '⚠️ Conferido com divergência' : '✅ Conferido — sem divergência')
        + '</div>';
    }

    renderFinanceiro();
    toast(temDivergencia ? 'Conferência salva — há divergência!' : 'Conferência salva!', temDivergencia ? 'err' : 'ok');
  } catch(e) {
    toast('Erro ao salvar: ' + (e.message || e), 'err');
    if (btn) { btn.disabled = false; btn.textContent = '✅ Finalizar Conferência'; }
  }
}

// bold=false (padrão, usado no PDF) mantém texto plano.
function _bhRelatorioTexto(bold){
  const b = s => bold ? `*${s}*` : s;
  const bhFuncs = {};
  S.bancoHoras.forEach(row => {
    (row.registros||[]).forEach(r => {
      if (!r.nome) return;
      if (!bhFuncs[r.nome]) bhFuncs[r.nome] = {};
      bhFuncs[r.nome][row.mes] = r.horas;
    });
  });
  const nomes = Object.keys(bhFuncs).sort((a,b)=>a.localeCompare(b));
  if (!nomes.length) return null;
  const MES_ABREV = ['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const meses = [...new Set(S.bancoHoras.map(r=>r.mes))].sort();
  const rhFuncs = S.presencaSemana?.funcs || [];
  const temSal = S.bhConfig?.salariosSetor && Object.keys(S.bhConfig.salariosSetor).length > 0;
  let posGeral = 0, negGeral = 0;
  const titulo = `Banco de Horas — ${S.rhLoja.display}`;
  let msg = `${bold?'⏱ ':''}${b(titulo.toUpperCase())}\n`;
  nomes.forEach(nome => {
    const mesSaldo = bhFuncs[nome];
    const total = meses.reduce((s,m) => s + (parseFloat(mesSaldo[m])||0), 0);
    const partesMes = meses.filter(m => mesSaldo[m] != null).map(m => {
      const [y,mo] = m.split('-');
      const v = parseFloat(mesSaldo[m]);
      return `${MES_ABREV[parseInt(mo)]}/${y.slice(2)}: ${v>0?'+':''}${v.toFixed(1)}h`;
    }).join(', ');
    msg += `\n${b(nome)}\n  ${partesMes || '—'}\n  Total: ${total>0?'+':''}${total.toFixed(1)}h`;
    if (temSal) {
      const vh = _rhValorHoraFunc(nome, rhFuncs);
      if (vh > 0) {
        const valor = Math.abs(total) * vh;
        msg += ` (${fmtBRL(valor)})`;
        if (total > 0) posGeral += valor; else if (total < 0) negGeral += valor;
      }
    }
    msg += '\n';
  });
  if (temSal) {
    msg += `\n${b('RESUMO MONETÁRIO')}\n  Extras (a pagar): ${fmtBRL(posGeral)}\n  Negativos (já pagos): ${fmtBRL(negGeral)}\n  Saldo líquido: ${b(fmtBRL(posGeral-negGeral))}`;
  }
  return { msg, titulo };
}

function exportarBHCSV() {
  if (!S.bancoHoras.length) { toast('Sem dados para exportar', 'err'); return; }
  const MES_ABREV = ['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const rhFuncs = S.presencaSemana?.funcs || [];
  const temSal = S.bhConfig?.salariosSetor && Object.keys(S.bhConfig.salariosSetor).length > 0;
  const bhFuncs = {};
  S.bancoHoras.forEach(row => {
    (row.registros||[]).forEach(r => {
      if (!r.nome) return;
      if (!bhFuncs[r.nome]) bhFuncs[r.nome] = {};
      bhFuncs[r.nome][row.mes] = r.horas;
    });
  });
  const meses = [...new Set(S.bancoHoras.map(r=>r.mes))].sort();
  const extraHeaders = temSal ? ['Setor', 'Valor/hora', 'Valor Total R$'] : [];
  const header = ['Funcionário', ...meses.map(m => {
    const [y,mo] = m.split('-');
    return MES_ABREV[parseInt(mo)]+'/'+y.slice(2);
  }), 'Total', ...extraHeaders];
  const rows = Object.entries(bhFuncs).sort(([a],[b])=>a.localeCompare(b)).map(([nome, mesSaldo]) => {
    const total = meses.reduce((s,m) => s + (parseFloat(mesSaldo[m])||0), 0);
    const base = [nome, ...meses.map(m => mesSaldo[m] != null ? parseFloat(mesSaldo[m]).toFixed(1) : ''), total.toFixed(1)];
    if (temSal) {
      const func = rhFuncs.find(f => f.nome === nome);
      const setor = func?.setor || '';
      const vh = _rhValorHoraFunc(nome, rhFuncs);
      const valorTotal = vh > 0 ? (Math.abs(total) * vh).toFixed(2).replace('.',',') : '';
      base.push(setor, vh > 0 ? vh.toFixed(2).replace('.',',') : '', valorTotal);
    }
    return base;
  });
  // Linha de resumo monetário
  if (temSal) {
    let posGeral = 0, negGeral = 0;
    Object.keys(bhFuncs).forEach(nome => {
      const vh = _rhValorHoraFunc(nome, rhFuncs);
      if (vh <= 0) return;
      const total = meses.reduce((s,m) => s + (parseFloat(bhFuncs[nome][m])||0), 0);
      if (total > 0) posGeral += total * vh;
      else if (total < 0) negGeral += Math.abs(total) * vh;
    });
    rows.push([]);
    rows.push(['RESUMO MONETÁRIO', ...meses.map(()=>''), '', '', '', '']);
    rows.push(['✅ Extras (a pagar)', ...meses.map(()=>''), '', '', '', posGeral.toFixed(2).replace('.',',')]);
    rows.push(['❌ Negativos (já pagos)', ...meses.map(()=>''), '', '', '', negGeral.toFixed(2).replace('.',',')]);
    rows.push(['📊 Saldo líquido', ...meses.map(()=>''), '', '', '', (posGeral-negGeral).toFixed(2).replace('.',',')]);
  }
  const csv = [header, ...rows].map(r => r.join(';')).join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dataLabel = new Date().toISOString().slice(0,7);
  a.href = url; a.download = `banco-horas-${S.rhLoja.display.replace(/\s+/g,'-').toLowerCase()}-${dataLabel}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('CSV exportado!', 'ok');
}

function _escalaRelatorioTexto(bold){
  const b = s => bold ? `*${s}*` : s;

  if (!funcs.length) return null;
  const DIAS_SEM = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  const PRESENTE_SET = new Set(['PRESENTE','HORISTA','JOVEM APRENDIZ','FOLGA','BANCO DE HORAS','FÉRIAS']);
  function _parseHoras(h) {
    if (!h) return null;
    const m = h.match(/(\d{1,2}):(\d{2})\s*[–\-]\s*(\d{1,2}):(\d{2})/);
    if (!m) return null;
    const ini = parseInt(m[1])*60+parseInt(m[2]);
    let fim = parseInt(m[3])*60+parseInt(m[4]);
    if (fim < ini) fim += 24*60;
    return (fim - ini) / 60;
  }
  const sem = formatSemana(S.rhSemana || getMondayOfWeek());
  const titulo = `Escala & Frequência — ${S.rhLoja.display} — Sem.${sem.num}`;
  let msg = `${bold?'📅 ':''}${b(titulo.toUpperCase())}\n${sem.periodo}\n`;
  funcs.forEach(f => {
    const hDia = _parseHoras(f.horario);
    const diasPres = (f.dias || []).filter(s => PRESENTE_SET.has(s || 'PRESENTE')).length;
    const faltas = (f.dias || []).filter(s => s === 'FALTA' || s === 'SUSPENSÃO').length;
    const atestados = (f.dias || []).filter(s => s === 'ATESTADO').length;
    const horasSem = hDia != null ? (hDia * diasPres).toFixed(1) : null;
    const diasTxt = DIAS_SEM.map((d,i) => `${d} ${PRES_ABREV[(f.dias||[])[i]||'PRESENTE']}`).join(', ');
    const cargo = [f.setor, f.turno, f.horario].filter(Boolean).join(' · ');
    msg += `\n${b(f.nome)}${cargo?` (${cargo})`:''}\n  ${diasTxt}\n  Horas/sem: ${horasSem!=null?horasSem+'h':'—'} | Dias pres.: ${diasPres} | Faltas: ${faltas} | Atestados: ${atestados}\n`;
  });
  return { msg, titulo };
}

function _dossPeriodoWeekIdxToMonday(idx) {
  const d = new Date(2026, 0, 5);
  d.setDate(d.getDate() + idx * 7);
  return d;
}

function _dossPeriodoFilter() {
  const curIdx = () => mestraWeekIdx(getMondayOfWeek());
  switch (S.dossPeriodo) {
    case 'dia': {
      const parts = (S.dossPeriodoData || '').split('-');
      if (parts.length < 3) return { weekFilter: () => false, dayFilter: () => false };
      const sel = new Date(+parts[0], +parts[1] - 1, +parts[2]);
      const selIdx = mestraWeekIdx(getMondayOfWeek(sel));
      const dow = (sel.getDay() + 6) % 7; // 0=Mon 6=Sun
      return { weekFilter: k => k === selIdx, dayFilter: (k, d) => d === dow };
    }
    case 'semana': {
      const idx = S.dossPeriodoSemIdx !== null ? S.dossPeriodoSemIdx : curIdx();
      return { weekFilter: k => k === idx, dayFilter: () => true };
    }
    case 'mes': {
      const [yr, mo] = (S.dossPeriodoMes || '').split('-').map(Number);
      if (!yr || !mo) return { weekFilter: () => true, dayFilter: () => true };
      const first = new Date(yr, mo - 1, 1);
      const last  = new Date(yr, mo, 0);
      return {
        weekFilter: k => {
          const mon = _dossPeriodoWeekIdxToMonday(k);
          const sun = new Date(mon); sun.setDate(sun.getDate() + 6);
          return mon <= last && sun >= first;
        },
        dayFilter: (k, d) => {
          const day = new Date(_dossPeriodoWeekIdxToMonday(k));
          day.setDate(day.getDate() + d);
          return day.getFullYear() === yr && day.getMonth() === mo - 1;
        },
      };
    }
    case 'meses': {
      const [yrI, moI] = (S.dossPeriodoMesIni || '').split('-').map(Number);
      const [yrF, moF] = (S.dossPeriodoMesFim || '').split('-').map(Number);
      if (!yrI || !moI || !yrF || !moF) return { weekFilter: () => true, dayFilter: () => true };
      const first = new Date(yrI, moI - 1, 1);
      const last  = new Date(yrF, moF, 0);
      return {
        weekFilter: k => {
          const mon = _dossPeriodoWeekIdxToMonday(k);
          const sun = new Date(mon); sun.setDate(sun.getDate() + 6);
          return mon <= last && sun >= first;
        },
        dayFilter: (k, d) => {
          const day = new Date(_dossPeriodoWeekIdxToMonday(k));
          day.setDate(day.getDate() + d);
          return day >= first && day <= last;
        },
      };
    }
    default: // historico
      return { weekFilter: () => true, dayFilter: () => true };
  }
}

function _dossPeriodoLabel() {
  const MES = ['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  switch (S.dossPeriodo) {
    case 'dia': return `Dia: ${fmtBR(S.dossPeriodoData)}`;
    case 'semana': {
      const idx = S.dossPeriodoSemIdx !== null ? S.dossPeriodoSemIdx : mestraWeekIdx(getMondayOfWeek());
      const mon = _dossPeriodoWeekIdxToMonday(idx);
      const sun = new Date(mon); sun.setDate(sun.getDate() + 6);
      const fmt = d => d.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit' });
      return `Semana: ${fmt(mon)} – ${fmt(sun)}`;
    }
    case 'mes': {
      const [yr, mo] = (S.dossPeriodoMes || '').split('-').map(Number);
      return `Mês: ${MES[mo] || mo}/${yr}`;
    }
    case 'meses': {
      const [yrI, moI] = (S.dossPeriodoMesIni || '').split('-').map(Number);
      const [yrF, moF] = (S.dossPeriodoMesFim || '').split('-').map(Number);
      return `${MES[moI] || moI}/${yrI} – ${MES[moF] || moF}/${yrF}`;

  }
}

function _buildDossEmployees() {
  const allData = S.dossComData;
  if (!allData) return {};

  // Usa a semana mais recente com dados como lista canônica de ativos.
  // Isso evita incluir ex-funcionários que aparecem só em semanas antigas.
  const currentIdx = mestraWeekIdx(getMondayOfWeek());
  const recentWD   = getWDComFallback(allData, currentIdx);
  const activeFuncs = (recentWD?.funcs || []).filter(f => f.nome?.trim());
  if (activeFuncs.length === 0) return {};

  // Inicializa employees com dados da semana mais recente
  const employees = {};
  activeFuncs.forEach(f => {
    const nomeKey = f.nome.trim();
    if (!employees[nomeKey]) {
      employees[nomeKey] = {
        setor: f.setor || '', turno: f.turno || '',
        horario: f.horario || '', tipo: f.tipo || '',
        faltas: 0, suspensoes: 0, atestados: 0, justificativas: 0, bhUsado: 0,
        ferias: 0, afastamento: 0, presencas: 0, weekCount: 0,
        inicio_contrato: f.inicio_contrato || '',
        fim_contrato: f.fim_contrato || '',
        aval_exp_45: f.aval_exp_45 || null,
        aval_exp_90: f.aval_exp_90 || null,
        encerramento_solicitado: f.encerramento_solicitado || false,
        encerramento_data: f.encerramento_data || '',
      };
    }
  });

  // Acumula estatísticas, mas só para quem está na lista ativa e no período selecionado
  const { weekFilter, dayFilter } = _dossPeriodoFilter();
  const keys = Object.keys(allData).map(Number).sort((a, b) => b - a);
  for (const k of keys) {
    if (!weekFilter(k)) continue;
    const wd = allData[String(k)];
    (wd?.funcs || []).filter(f => f.nome?.trim()).forEach(f => {
      const nomeKey = f.nome.trim();
      const emp = employees[nomeKey];
      if (!emp) return;
      (f.dias || []).forEach((st, dayIdx) => {
        if (!dayFilter(k, dayIdx)) return;
        const s = st || 'PRESENTE';
        if (s === 'FALTA')               emp.faltas++;
        else if (s === 'SUSPENSÃO')      emp.suspensoes++;
        else if (s === 'ATESTADO') emp.atestados++;
        else if (s === 'JUSTIFICATIVA') emp.justificativas++;
        else if (s === 'BANCO DE HORAS') emp.bhUsado++;
        else if (s === 'FÉRIAS')         emp.ferias++;
        else if (s === 'AFASTAMENTO')    emp.afastamento++;
        else if (ESCALA_PRESENTE_SET.has(s)) emp.presencas++;
      });
      emp.weekCount++;
    });
  }
  return employees;
}

function _dossBHSaldo(nome) {
  let total = 0;
  S.dossBH.forEach(row => {
    (row.registros || []).forEach(r => {
      if (r.nome === nome) total += parseFloat(r.horas) || 0;
    });
  });
  return total;
}

function _dossAvaliacoes(nome) {
  const avs = S.dossAvaliacoesColab || [];
  const nomeAlvo = (nome || '').trim().toLowerCase();
  return avs.filter(a => a.finalizada && (a.colaborador || '').trim().toLowerCase() === nomeAlvo)
            .sort((a, b) => (b.data || '').localeCompare(a.data || ''));
}

// ══════════════════════════════════════════════
// ACTIONS — DOSSIÊ edit
// ══════════════════════════════════════════════
async function updDossContrato(nome, campo, valor) {
  const allData = S.dossComData;
  if (!allData) { toast('Dados não carregados', 'err'); return; }
  // Encontra a semana mais recente que contém este funcionário
  const currentIdx = mestraWeekIdx(getMondayOfWeek());
  let targetKey = null;
  const wdDireto = allData[String(currentIdx)];
  if (wdDireto?.funcs?.some(f => f.nome?.trim() === nome)) {
    targetKey = String(currentIdx);
  } else {
    const keys = Object.keys(allData).map(Number).sort((a, b) => b - a);
    for (const k of keys) {
      if (allData[String(k)]?.funcs?.some(f => f.nome?.trim() === nome)) {
        targetKey = String(k);
        break;
      }
    }
  }
  if (!targetKey) { toast('Funcionário não encontrado', 'err'); return; }
  const newAllData = JSON.parse(JSON.stringify(allData));
  const idx = newAllData[targetKey].funcs.findIndex(f => f.nome?.trim() === nome);
  if (idx < 0) { toast('Funcionário não encontrado', 'err'); return; }
  const valorAntigo = newAllData[targetKey].funcs[idx][campo];
  newAllData[targetKey].funcs[idx][campo] = valor;
  const { error } = await db.from('gn_comissoes').update({ all_data: newAllData }).eq('loja', S.dossLoja.comKey);
  if (error) { toast('Erro ao salvar: ' + error.message, 'err'); return; }
  S.dossComData = newAllData;
  _logAuditoriaRH('EDITAR_CONTRATO_DOSSIE', S.dossLoja.comKey, { nome, campo, valor, valorAntigo });
  renderDossie();
  toast('Salvo ✓', 'ok');
}

  $('content').innerHTML = `

    <div style="margin-bottom:10px">
      <input type="search" id="doss-busca" value="${(S.dossBusca || '').replace(/"/g,'&quot;')}"
        placeholder="🔍 Pesquisar funcionário…"
        oninput="S.dossBusca=this.value;renderDossie();setTimeout(()=>{const el=$('doss-busca');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}},0)"
        style="width:100%;background:var(--surf2);border:1px solid var(--border);color:var(--text);border-radius:var(--rs);padding:8px 12px;font-size:12px;font-family:inherit;outline:none;box-sizing:border-box">
    </div>
    ${totalFuncs > 0 ? `<div class="stat-row" style="margin-bottom:10px">
      <div class="stat b"><div class="stat-val">${totalFuncs}</div><div class="stat-lbl">Funcionários</div></div>
      <div class="stat ${totalFaltas > 0 ? 'r' : ''}"><div class="stat-val">${totalFaltas}</div><div class="stat-lbl">Faltas</div></div>
      <div class="stat ${totalSusp > 0 ? 'a' : ''}"><div class="stat-val">${totalSusp}</div><div class="stat-lbl">Suspensões</div></div>
    </div>` : ''}
    <div>${cardsHtml}</div>
    ${arquivoHtml}
    <div style="height:20px"></div>`;
}

// ACTIONS — DOSSIÊ

async function filtrarDossLoja(comKey) {
  S.dossLoja = LOJAS_COM_TESTE.find(l => l.comKey === comKey) || LOJAS[0];
  S.dossExpanded = null;
  S.dossBusca = '';
  $('content').innerHTML = `<div class="empty"><div class="spin"></div></div>`;
  await carregarDossie();
  renderDossie();
}

function toggleDossExpand(nome) {
  S.dossExpanded = S.dossExpanded === nome ? null : nome;
  renderDossie();
}

function setDossPeriodo(p) {
  S.dossPeriodo = p;
  S.dossExpanded = null;
  renderDossie();
}

function gerarDossWpp() {
  const employees = _buildDossEmployees();
  const nomes = Object.keys(employees).sort((a, b) => a.localeCompare(b));
  const hoje = new Date().toLocaleDateString('pt-BR');
  const totalF = nomes.reduce((t, n) => t + employees[n].faltas, 0);
  const totalS = nomes.reduce((t, n) => t + employees[n].suspensoes, 0);
  const totalA = nomes.reduce((t, n) => t + employees[n].atestados, 0);
  const totalJ = nomes.reduce((t, n) => t + employees[n].justificativas, 0);

  const lines = [
    `📋 *Dossiê — ${S.dossLoja.display}*`,
    `📅 ${hoje} · ${_dossPeriodoLabel()}`,
    '',
    `👥 *${nomes.length}* funcionários ativos`,
    `❌ Faltas: *${totalF}* | ⚠️ Suspensões: *${totalS}* | 🏥 Atestados: *${totalA}* | 📝 Justificativas: *${totalJ}*`,
    '',
  ];

  const comOcorrencia = nomes.filter(n => {
    const e = employees[n];
    const bh = _dossBHSaldo(n);
    return e.faltas > 0 || e.suspensoes > 0 || e.atestados > 0 || e.justificativas > 0 || bh < 0;
  });

  if (comOcorrencia.length > 0) {
    lines.push('*⚠️ Funcionários com ocorrências:*', '');
    comOcorrencia.forEach(nome => {
      const e = employees[nome];
      const bh = _dossBHSaldo(nome);
      const partes = [];
      if (e.faltas > 0)          partes.push(`Faltas: ${e.faltas}`);
      if (e.suspensoes > 0)      partes.push(`Suspensões: ${e.suspensoes}`);
      if (e.atestados > 0)       partes.push(`Atestados: ${e.atestados}`);
      if (e.justificativas > 0)  partes.push(`Justificativas: ${e.justificativas}`);
      if (bh !== 0)              partes.push(`BH: ${bh > 0 ? '+' : ''}${bh.toFixed(1)}h`);
      lines.push(`👤 *${nome}*`);
      lines.push(`   ${partes.join(' | ')}`);
    });
  } else {
    lines.push('✅ Nenhuma ocorrência registrada');
  }

  lines.push('', '_GN · RH & Financeiro_');
  window.open(`https://wa.me/?text=${encodeURIComponent(lines.join('\n'))}`, '_blank');
}

function filtrarVencLoja(chkKey) {
  S.vencLoja = chkKey;
  renderVencimentos();
}

function renderVencimentos() {
  const lojaFiltros = [
    `<button class="ftab${S.vencLoja===''?' ativo':''}" onclick="filtrarVencLoja('')">Todas</button>`,
    ...LOJAS_COM_TESTE.map(l => `<button class="ftab${S.vencLoja===l.chkKey?' ativo':''}" onclick="filtrarVencLoja('${l.chkKey}')">${l.display}</button>`)
  ].join('');

  const itens = S.vencLoja ? S.vencimentosData.filter(it => it.lojaChk === S.vencLoja) : S.vencimentosData;

  const grupos = { vencido: [], hoje: [], semana: [], mes: [], futuro: [] };
  itens.forEach(it => {
    if (it.diff < 0) grupos.vencido.push(it);
    else if (it.diff === 0) grupos.hoje.push(it);
    else if (it.diff <= 7) grupos.semana.push(it);
    else if (it.diff <= 30) grupos.mes.push(it);
    else grupos.futuro.push(it);
  });
  const totalVenc = grupos.vencido.reduce((s,it)=>s+it.total,0) + grupos.hoje.reduce((s,it)=>s+it.total,0);

  // Visão por período — calendário (hoje / semana atual seg-dom / mês atual), independente
  // dos grupos "próximos 7/30 dias" da lista abaixo (que são janela rolante, não calendário).
  const hojeD = new Date(); hojeD.setHours(0, 0, 0, 0);
  const hojeISO = isoDate(hojeD);
  const segISO  = isoDate(getMondayOfWeek(hojeD));
  const domISO  = isoDate(getSundayOfWeek(getMondayOfWeek(hojeD)));
  const mesIniISO = isoDate(new Date(hojeD.getFullYear(), hojeD.getMonth(), 1));
  const mesFimISO = isoDate(new Date(hojeD.getFullYear(), hojeD.getMonth() + 1, 0));
  const totalHojeCal   = itens.filter(it => it.vencimento === hojeISO).reduce((s,it)=>s+it.total,0);
  const totalSemanaCal = itens.filter(it => it.vencimento >= segISO && it.vencimento <= domISO).reduce((s,it)=>s+it.total,0);
  const totalMesCal    = itens.filter(it => it.vencimento >= mesIniISO && it.vencimento <= mesFimISO).reduce((s,it)=>s+it.total,0);

  const row = (it, cor) => `<div style="display:flex;justify-content:space-between;align-items:flex-start;padding:8px 12px;border-bottom:1px solid var(--border)">
    <div style="flex:1;min-width:0">
      <div style="font-size:12px;font-weight:700">${esc(it.fornecedor)}</div>
      <div style="font-size:10px;color:var(--muted)">${esc(it.lojaDisplay)} · NF ${esc(it.nf)}${it.dataNF?' · '+fmtBRShort(it.dataNF):''}</div>
    </div>
    <div style="text-align:right;flex-shrink:0;margin-left:10px">
      <div style="font-size:12px;font-weight:800;color:${cor}">${fmtBRShort(it.vencimento)}</div>
      <div style="font-size:10px;color:${cor}">${it.diff<0?'Prazo alcançado':it.diff===0?'Hoje!':'em '+it.diff+'d'}</div>
      ${it.total>0?`<div style="font-size:10px;color:var(--green)">${money(it.total)}</div>`:''}
    </div>
  </div>`;
  const bloco = (label, cor, lista) => lista.length ? `<div class="card" style="margin-bottom:10px;padding:0;overflow:hidden">
    <div style="font-size:10px;font-weight:800;color:${cor};text-transform:uppercase;letter-spacing:.5px;padding:8px 12px;background:${cor}18">${label} · ${lista.length}</div>
    ${lista.map(it=>row(it,cor)).join('')}
  </div>` : '';

  const content = itens.length === 0
    ? `<div class="empty"><div class="empty-icon">📅</div><div class="empty-text">Nenhum vencimento registrado${S.vencLoja?' para esta loja':''}.<br>Lançado ao dar entrada de nota fiscal no app Lojas.</div></div>`
    : `${bloco('🟠 Prazo alcançado', 'var(--amber)', grupos.vencido)}
       ${bloco('🟠 Vence hoje', 'var(--amber)', grupos.hoje)}
       ${bloco('🟡 Próximos 7 dias', 'var(--amber)', grupos.semana)}
       ${bloco('🔵 Próximos 30 dias', 'var(--accent)', grupos.mes)}
       ${bloco('✅ Futuros', 'var(--green)', grupos.futuro)}`;

  $('content').innerHTML = `
    <div class="sec-header">
      <div class="sec-title">Boletos / Vencimentos</div>
    </div>
    <div class="filter-row">${lojaFiltros}</div>
    <div class="stat-row" style="grid-template-columns:repeat(2,1fr)">
      <div class="stat ${totalVenc>0?'r':''}"><div class="stat-val num" style="font-size:16px">${money(totalVenc)}</div><div class="stat-lbl">A pagar agora</div></div>
      <div class="stat"><div class="stat-val">${itens.length}</div><div class="stat-lbl">Boleto(s)</div></div>
    </div>
    <div class="stat-row">
      <div class="stat ${totalHojeCal>0?'r':''}"><div class="stat-val num" style="font-size:16px">${money(totalHojeCal)}</div><div class="stat-lbl">Vence hoje</div></div>
      <div class="stat ${totalSemanaCal>0?'a':''}"><div class="stat-val num" style="font-size:16px">${money(totalSemanaCal)}</div><div class="stat-lbl">Esta semana</div></div>
      <div class="stat ${totalMesCal>0?'b':''}"><div class="stat-val num" style="font-size:16px">${money(totalMesCal)}</div><div class="stat-lbl">Este mês</div></div>
    </div>
    ${content}`;
}

  const content = itens.length === 0

// ── CONTROLE DE HORÁRIO DE ACESSO (cargo rh) ─────────────────────
const _CARGOS_LIVRE_RH = window.CARGOS_RH_LIVRE; // fonte única em gn-lojas-config.js

function _podeHorarioRH(cargo) {
  if (_CARGOS_LIVRE_RH.includes(cargo)) return true;
  const agora = new Date();
  const dia = agora.getDay(); // 0=dom,1=seg..5=sex,6=sab
  const min = agora.getHours() * 60 + agora.getMinutes();
  if (dia === 0 || dia === 6) return false;
  return min >= 480 && min < 1020; // 08:00–17:00
}

var _vigiaRH = null;

function _iniciarVigiaRH() {
  if (_vigiaRH) clearInterval(_vigiaRH);
  _vigiaRH = setInterval(function() {
    if (!S.usuario) { clearInterval(_vigiaRH); _vigiaRH = null; return; }
    if (_CARGOS_LIVRE_RH.includes(S.usuario.cargo)) return;
    if (!_podeHorarioRH(S.usuario.cargo)) {
      clearInterval(_vigiaRH); _vigiaRH = null;
      toast('⏰ Horário de acesso encerrado. Até logo!', 'ok');
      setTimeout(_forcarSaidaRH, 2500);
    }
  }, 60000);
}

function _forcarSaidaRH() {
  try { localStorage.removeItem(SESSION_KEY); } catch(_) {}
  S.usuario = null;
  if (_vigiaRH) { clearInterval(_vigiaRH); _vigiaRH = null; }
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
  $('ln-user').value = '';
  $('ln-pass').value = '';
  $('ln-err').textContent = '';
  setTimeout(() => $('ln-user').focus(), 100);
}
// ─────────────────────────────────────────────────────────────────

async function doLogin() {
  const nome = $('ln-user').value.trim();
  const senha = $('ln-pass').value;
  const errEl = $('ln-err');
  errEl.textContent = '';
  if (!nome || !senha) { errEl.textContent = 'Preencha usuário e senha.'; return; }

  const { data, error } = await db.from('gn_usuarios')
    .select('nome,cargo,loja,permissoes')
    .ilike('nome', nome)
    .eq('senha', senha)
    .eq('ativo', true)
    .single();

  if (error || !data) { errEl.textContent = 'Usuário ou senha inválidos.'; return; }

  // Verificar permissão de acesso ao GN RH
  const _p = data.permissoes || {};
  const _isMaster = window.CARGOS_MASTER_EQUIV.includes(data.cargo);
  if (!(_isMaster ? _p.rh !== false : !!_p.rh)) {
    errEl.textContent = 'Sem permissão para acessar GN RH.'; return;
  }

  // Restrição de horário para cargo rh
  if (!_podeHorarioRH(data.cargo)) {
    const dia = new Date().getDay();
    errEl.textContent = (dia === 0 || dia === 6)
      ? '🚫 Acesso disponível seg–sex das 08h às 17h.'
      : '🚫 Acesso disponível das 08h às 17h.';
    return;
  }

  // Salva sessão
  try { localStorage.setItem(SESSION_KEY, JSON.stringify({...data, ts: Date.now()})); } catch(_) {}
  S.usuario = data;
  iniciarApp();
}

async function iniciarApp() {
  // Tenta restaurar sessão
  if (!S.usuario) {
    try {
      const sess = JSON.parse(localStorage.getItem(SESSION_KEY)||'null');
      if (sess && Date.now() - sess.ts < 86400000 * 7) S.usuario = sess;
    } catch(_) {}
  }

  if (!S.usuario) return; // mostra login

  // Verificar janela de horário ao restaurar sessão salva
  if (!_podeHorarioRH(S.usuario.cargo)) {
    try { localStorage.removeItem(SESSION_KEY); } catch(_) {}
    S.usuario = null;
    const errEl = $('ln-err');
    if (errEl) {
      const dia = new Date().getDay();
      errEl.textContent = (dia === 0 || dia === 6)
        ? '🚫 Acesso disponível seg–sex das 08h às 17h.'
        : '🚫 Acesso disponível das 08h às 17h.';
    }
    return;
  }

  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');

  const dt = new Date();
  $('hdr-date').textContent = dt.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'});
  $('hdr-user').textContent = S.usuario.nome;
  const su = $('sidebar-user'); if (su) su.textContent = S.usuario.nome;

  // Configurar abas permitidas a partir das permissões salvas
  const abasArr = (S.usuario.permissoes || {}).rh_abas;
  S.abasPermitidas = Array.isArray(abasArr) ? new Set(abasArr) : null;
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.style.display = S.abasPermitidas && !S.abasPermitidas.has(b.dataset.tab) ? 'none' : '';
  });
  document.querySelectorAll('.sidebar-link[data-sidebar-tab]').forEach(b => {
    b.style.display = S.abasPermitidas && !S.abasPermitidas.has(b.dataset.sidebarTab) ? 'none' : '';
  });

  S.opData    = new Date(); S.opData.setHours(12,0,0,0);
  S.finSemana = getMondayOfWeek();
  S.rhSemana  = getMondayOfWeek();

  // Iniciar vigia de horário para cargo rh
  _iniciarVigiaRH();

  // Ir para a primeira aba permitida
  const primeiraAba = S.abasPermitidas
    ? (['operacoes','financeiro','rh','comparativo','avarias','dossie','vencimentos','ferias','auditoria'].find(t => S.abasPermitidas.has(t)) || 'operacoes')
    : 'operacoes';
  setTab(primeiraAba);

  // Carrega badge de avarias em background para qualquer aba ativa
  if (!S.abasPermitidas || S.abasPermitidas.has('avarias')) {
    carregarAvarias().catch(() => {});
  }
}

// DOCS — visualizar / compartilhar foto de documento
// ══════════════════════════════════════════════
let _rhDocModal = null;

function verFotoDoc(funcIdx, tipo) {
  const funcs = S.presencaSemana?.funcs || [];
  const func = funcs[funcIdx];
  const foto = func?.docs?.[tipo];
  if (!foto) return;
  const nome = func.nome;
  const tipoLabel = tipo==='ATESTADO'?'Atestado':tipo==='SUSPENSAO'?'Suspensão':tipo==='DEMISSAO'?'Carta Demissão':'Advertência';
  const cor = tipo==='ATESTADO'?'#eab308':tipo==='SUSPENSAO'?'#f97316':tipo==='DEMISSAO'?'#8b5cf6':'#ef4444';
  _rhDocModal = { nome, tipo, foto, tipoLabel };
  abrirModal(`
    <div class="modal-handle"></div>
    <div class="modal-title" style="font-size:14px;gap:8px">
      <div><span style="color:${cor};font-weight:800">${tipoLabel}</span><span style="color:var(--muted);font-size:12px;font-weight:600;margin-left:6px">${esc(nome)}</span></div>
      <button class="modal-close" onclick="fecharModal()">✕</button>
    </div>
    <img src="${foto}" style="width:100%;border-radius:8px;max-height:55dvh;object-fit:contain;background:var(--surf2);display:block">
    <div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">
      <button class="btn btn-sec btn-sm" onclick="_wppDocRH()">📲 WhatsApp</button>
      <button class="btn btn-sec btn-sm" onclick="_pdfDocRH()">📄 PDF</button>
    </div>
  `);
}

function _wppDocRH() {
  if (!_rhDocModal) return;
  const { nome, foto, tipoLabel } = _rhDocModal;
  const loja = S.rhLoja?.display || '';
  const texto = `📎 ${tipoLabel} — ${nome}\n📍 ${loja}\n📅 ${new Date().toLocaleDateString('pt-BR')}`;
  if (foto && navigator.share) {
    try {
      const byteStr = atob(foto.split(',')[1]);
      const arr = new Uint8Array(byteStr.length);
      for (let i = 0; i < byteStr.length; i++) arr[i] = byteStr.charCodeAt(i);
      const blob = new Blob([arr], { type: 'image/jpeg' });
      const file = new File([blob], 'documento.jpg', { type: 'image/jpeg' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], text: texto }).catch(() => {
          window.open('https://wa.me/?text=' + encodeURIComponent(texto), '_blank');
        });
        return;
      }
    } catch(e) {}
  }
  window.open('https://wa.me/?text=' + encodeURIComponent(texto), '_blank');
}

function _pdfDocRH() {
  if (!_rhDocModal) return;
  const { nome, foto, tipoLabel } = _rhDocModal;
  const loja = S.rhLoja?.display || '';
  const win = window.open('', '_blank');
  if (!win) return;
  win.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(tipoLabel)} - ${esc(nome)}</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,sans-serif;padding:24px;max-width:640px;margin:0 auto}
h2{font-size:20px;font-weight:800;margin-bottom:6px}.meta{font-size:13px;color:#555;margin-bottom:16px;line-height:1.8}
img{max-width:100%;border-radius:8px;display:block}.btn{margin-top:16px;background:#0969da;color:#fff;border:none;border-radius:6px;padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer}
@media print{.btn{display:none}}</style></head>
<body>
<h2>${esc(tipoLabel)}</h2>
<div class="meta">Funcionário: <strong>${esc(nome)}</strong><br>Loja: <strong>${esc(loja)}</strong><br>Data: <strong>${new Date().toLocaleDateString('pt-BR')}</strong></div>
${foto ? `<img src="${foto}">` : '<p style="color:#999">Sem imagem</p>'}
<button class="btn" onclick="window.print()">📄 Imprimir / Salvar PDF</button>
</body></html>`);
  win.document.close();
}
