<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>GN · RH &amp; Financeiro</title>
<style>
/* ── TOKENS ─────────────────────────────────────── */
:root {
  --bg:       #f6f8fa;
  --surf:     #ffffff;
  --surf2:    #f0f4f8;
  --border:   #d0d7de;
  --muted:    #57606a;
  --text:     #1f2328;
  --accent:   #0969da;
  --green:    #1a7f37;
  --green-bg: #dafbe1;
  --red:      #cf222e;
  --red-bg:   rgba(207,34,46,.1);
  --amber:    #9a6700;
  --amber-bg: rgba(154,103,0,.1);
  --teal:     #0969da;
  --teal-bg:  rgba(9,105,218,.08);
  --r: 8px; --rs: 5px;
  --nav-h: 56px;
  --hdr-h: 52px;
}
@media (prefers-color-scheme: dark) { :root {
  --bg:#0d1117; --surf:#161b22; --surf2:#21262d; --border:#30363d;
  --muted:#8b949e; --text:#e6edf3; --accent:#58a6ff;
  --green:#3fb950; --green-bg:rgba(63,185,80,.12);
  --red:#f85149;   --red-bg:rgba(248,81,73,.12);
  --amber:#d29922; --amber-bg:rgba(210,153,34,.12);
  --teal:#a5d6ff;  --teal-bg:rgba(165,214,255,.1);
}}
:root[data-theme="dark"] {
  --bg:#0d1117; --surf:#161b22; --surf2:#21262d; --border:#30363d;
  --muted:#8b949e; --text:#e6edf3; --accent:#58a6ff;
  --green:#3fb950; --green-bg:rgba(63,185,80,.12);
  --red:#f85149;   --red-bg:rgba(248,81,73,.12);
  --amber:#d29922; --amber-bg:rgba(210,153,34,.12);
  --teal:#a5d6ff;  --teal-bg:rgba(165,214,255,.1);
}
:root[data-theme="light"] {
  --bg:#f6f8fa; --surf:#ffffff; --surf2:#f0f4f8; --border:#d0d7de;
  --muted:#57606a; --text:#1f2328; --accent:#0969da;
  --green:#1a7f37; --green-bg:#dafbe1;
  --red:#cf222e;   --red-bg:rgba(207,34,46,.1);
  --amber:#9a6700; --amber-bg:rgba(154,103,0,.1);
  --teal:#0969da;  --teal-bg:rgba(9,105,218,.08);
}

/* ── RESET + BASE ───────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',system-ui,sans-serif;font-size:14px;
  background:var(--bg);color:var(--text);min-height:100dvh;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;border:none;background:none;color:inherit;font:inherit}
input,select{font:inherit;color:inherit;background:transparent}
.hidden{display:none!important}

/* ── LOGIN ──────────────────────────────────────── */
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px}
.login-card{background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:32px 28px;width:100%;max-width:340px}
.login-logo{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px}
.login-sub{font-size:12px;color:var(--muted);margin-bottom:24px}
.login-label{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:5px}
.login-input{width:100%;border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px;background:var(--surf2);font-size:14px;outline:none;margin-bottom:14px}
.login-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(9,105,218,.12)}
.login-btn{width:100%;background:var(--accent);color:#fff;border-radius:var(--rs);padding:11px;font-size:14px;font-weight:700;letter-spacing:.2px}
.login-err{font-size:12px;color:var(--red);margin-top:8px;min-height:18px}

/* ── APP SHELL ──────────────────────────────────── */
#app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto}
header{height:var(--hdr-h);border-bottom:1px solid var(--border);background:var(--surf);
  display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;position:sticky;top:0;z-index:10}
.hdr-title{font-size:15px;font-weight:800;letter-spacing:-.3px}
.hdr-right{display:flex;align-items:center;gap:10px}
.hdr-user{font-size:11px;color:var(--muted);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-date{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.hdr-refresh{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted)}

#content{flex:1;overflow-y:auto;padding:14px;padding-bottom:calc(var(--nav-h) + 14px)}

/* ── BOTTOM NAV ─────────────────────────────────── */
nav{height:var(--nav-h);border-top:1px solid var(--border);background:var(--surf);
  display:grid;grid-template-columns:repeat(5,1fr);flex-shrink:0;position:sticky;bottom:0;z-index:10}
.nav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:10px;color:var(--muted);padding:6px 0;position:relative;transition:color .15s}
.nav-btn.ativo{color:var(--accent)}
.nav-btn.ativo::before{content:'';position:absolute;top:0;left:25%;right:25%;height:2px;background:var(--accent);border-radius:0 0 2px 2px}
.nav-icon{font-size:18px;line-height:1}
.nav-label{font-size:10px;font-weight:600;letter-spacing:.2px}

/* ── CARDS ──────────────────────────────────────── */
.card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.card + .card{margin-top:10px}
.card-header{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:13px;font-weight:700}
.card-body{padding:12px 14px}

/* ── STAT TILES ─────────────────────────────────── */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--surf2);border-radius:var(--rs);padding:10px 10px 8px;border:1px solid var(--border)}
.stat-val{font-size:22px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat-lbl{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-top:3px}
.stat.g .stat-val{color:var(--green)}
.stat.r .stat-val{color:var(--red)}
.stat.a .stat-val{color:var(--amber)}
.stat.b .stat-val{color:var(--accent)}

/* ── BADGES ─────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;letter-spacing:.2px}
.badge-ok{background:var(--green-bg);color:var(--green)}
.badge-err{background:var(--red-bg);color:var(--red)}
.badge-warn{background:var(--amber-bg);color:var(--amber)}
.badge-info{background:var(--teal-bg);color:var(--teal)}
.badge-muted{background:var(--surf2);color:var(--muted)}

/* ── STORE CARDS (Tab 1) ─────────────────────────── */
.loja-grid{display:flex;flex-direction:column;gap:10px}
.loja-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r)}
.loja-card-header{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.loja-name{font-size:13px;font-weight:800;letter-spacing:-.1px}
.loja-metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:0}
.loja-metric{padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.loja-metric:not(:last-child){border-right:1px solid var(--border)}
.loja-metric-val{font-size:16px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.loja-metric-lbl{font-size:8px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--muted)}

/* ── FINANCE ROWS (Tab 2) ───────────────────────── */
.fin-table{width:100%;border-collapse:collapse}
.fin-table th{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);padding:6px 10px;text-align:left;border-bottom:1px solid var(--border)}
.fin-table td{padding:9px 10px;border-bottom:1px solid var(--border);font-size:12px}
.fin-table tr:last-child td{border-bottom:none}
.num{font-variant-numeric:tabular-nums;font-family:ui-monospace,'Cascadia Code',monospace}
.fin-total{font-weight:700;font-size:13px;color:var(--accent)}

/* ── RH TABLE (Tab 3) ───────────────────────────── */
.rh-table-wrap{overflow-x:auto;border-radius:var(--rs)}
.rh-table{width:100%;border-collapse:collapse;white-space:nowrap}
.rh-table th{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  color:var(--muted);padding:7px 10px;text-align:left;background:var(--surf2);position:sticky;top:0}
.rh-table td{padding:8px 10px;border-bottom:1px solid var(--border);font-size:12px}
.rh-table tr:last-child td{border-bottom:none}
.rh-table .nome-col{font-weight:600;min-width:130px}
.day-pill{display:inline-flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:700;padding:2px 5px;border-radius:4px;min-width:22px;letter-spacing:.2px}
.day-P{background:var(--green-bg);color:var(--green)}
.day-F{background:var(--red-bg);color:var(--red)}
.day-AT{background:var(--amber-bg);color:var(--amber)}
.day-S{background:rgba(249,115,22,.12);color:#f97316}
.day-FG{background:var(--teal-bg);color:var(--teal)}
.day-BH{background:rgba(139,92,246,.12);color:#8b5cf6}
.day-NW{background:var(--surf2);color:var(--muted)}

/* ── MISC UI ─────────────────────────────────────── */
.sec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-title{font-size:16px;font-weight:800;letter-spacing:-.3px}
.sec-sub{font-size:11px;color:var(--muted)}
.divider{height:1px;background:var(--border);margin:14px 0}
.spin{width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty-icon{font-size:32px;margin-bottom:8px}
.empty-text{font-size:13px}

/* Filter tabs */
.filter-row{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.ftab{border:1px solid var(--border);border-radius:20px;padding:5px 13px;font-size:12px;font-weight:600;
  white-space:nowrap;background:var(--surf2);color:var(--muted);transition:all .15s}
.ftab.ativo{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Week nav */
.week-nav{display:flex;align-items:center;justify-content:space-between;background:var(--surf);
  border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;margin-bottom:12px}
.week-nav button{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--muted);background:var(--surf2)}
.week-label{text-align:center}
.week-num{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.week-period{font-size:10px;color:var(--muted)}

/* Form */
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.form-input{width:100%;border:1px solid var(--border);border-radius:var(--rs);padding:9px 12px;background:var(--surf2)}
.form-input:focus{outline:none;border-color:var(--accent)}
.btn{border-radius:var(--rs);padding:9px 18px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.btn-pri{background:var(--accent);color:#fff}
.btn-sec{background:var(--surf2);border:1px solid var(--border);color:var(--text)}
.btn-danger{background:var(--red-bg);border:1px solid rgba(248,81,73,.3);color:var(--red)}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:var(--rs);font-weight:700;display:inline-flex;align-items:center;gap:5px}

/* Photo upload */
.foto-zone{border:2px dashed var(--border);border-radius:var(--r);padding:24px;text-align:center;cursor:pointer;transition:border-color .15s}
.foto-zone:hover{border-color:var(--accent)}
.foto-preview{width:100%;border-radius:var(--rs);max-height:260px;object-fit:contain;background:var(--surf2)}

/* Toast */
#toast{position:fixed;bottom:calc(var(--nav-h) + 14px);left:50%;transform:translateX(-50%) translateY(10px);
  background:#323940;color:#fff;border-radius:20px;padding:8px 18px;font-size:13px;font-weight:600;
  white-space:nowrap;opacity:0;transition:all .25s;z-index:999;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:#1a7f37}
#toast.err{background:var(--red)}

/* Modal */
#modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:none;align-items:flex-end}
#modal-bg.ativo{display:flex}
#modal-box{background:var(--surf);border-radius:14px 14px 0 0;width:100%;max-height:90dvh;overflow-y:auto;padding:20px 18px 30px;max-width:560px;margin:0 auto}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.modal-title{font-size:16px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.modal-close{color:var(--muted);font-size:20px;line-height:1;padding:2px 4px}
.modal-actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}

/* SQL block */
.sql-block{background:var(--surf2);border:1px solid var(--border);border-radius:var(--rs);
  padding:12px;font-family:ui-monospace,'Cascadia Code',monospace;font-size:10px;
  line-height:1.6;overflow-x:auto;white-space:pre;color:var(--text);margin-bottom:12px}

/* ── COMPARATIVO (Tab 4) ─────────────────────── */
.comp-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:8px}
.comp-card-hdr{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.comp-loja{font-size:13px;font-weight:700}
.comp-div-body{padding:0 14px 10px}
.comp-div-table{width:100%;border-collapse:collapse;font-size:11px}
.comp-div-table td{padding:4px 0;border-top:1px solid var(--border)}
.comp-div-table td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums;font-family:ui-monospace,'Cascadia Code',monospace}

/* ── DESKTOP (≥768px) ─────────────────────────── */
@media (min-width: 768px) {
  #app { max-width: 700px; margin: 0 auto; }
}
</style>
</head>
<body>

<!-- ══ LOGIN ══════════════════════════════════════ -->
<div id="login">
  <div class="login-card">
    <div class="login-logo">GN · RH &amp; Financeiro</div>
    <div class="login-sub">Consolidador de Operações — Rede</div>
    <label class="login-label" for="ln-user">Usuário</label>
    <input class="login-input" id="ln-user" type="text" autocomplete="username" placeholder="Nome de usuário">
    <label class="login-label" for="ln-pass">Senha</label>
    <input class="login-input" id="ln-pass" type="password" autocomplete="current-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">Entrar</button>
    <div class="login-err" id="ln-err"></div>
  </div>
</div>


<!-- ══ APP ════════════════════════════════════════ -->
<div id="app" class="hidden">

      </button>
    </div>
  </header>

  <div id="content"></div>

  <nav>

      <span class="nav-icon">📊</span>
      <span class="nav-label">Operações</span>
    </button>
    <button class="nav-btn" data-tab="financeiro" onclick="setTab('financeiro')">
      <span class="nav-icon">💰</span>
      <span class="nav-label">Financeiro</span>
    </button>
    <button class="nav-btn" data-tab="rh" onclick="setTab('rh')">
      <span class="nav-icon">👥</span>

    <button class="nav-btn" data-tab="comparativo" onclick="setTab('comparativo')">
      <span class="nav-icon">🔍</span>

      <span class="nav-icon">👑</span>

  </nav>
</div>

<div id="toast"></div>
<div id="modal-bg" onclick="if(event.target===this)fecharModal()">

</div>

const $ = id => document.getElementById(id);
const hoje = () => isoDate(new Date());
const money = n => 'R$ ' + (parseFloat(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const num = n => (parseFloat(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});

function fmtBR(iso) {
  if (!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function fmtBRShort(iso) {
  if (!iso) return '—';
  const dt = new Date(iso + 'T12:00:00');
  return dt.toLocaleDateString('pt-BR', { weekday:'short', day:'2-digit', month:'short' });
}

function isoDate(d) {
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function getMondayOfWeek(d = new Date()) {
  const dd = new Date(d); dd.setHours(0,0,0,0);
  const dow = dd.getDay(); const diff = (dow===0)?-6:1-dow;
  dd.setDate(dd.getDate()+diff); return dd;
}
function getSundayOfWeek(monday) {
  const s = new Date(monday); s.setDate(monday.getDate()+6); return s;
}
function isoWeekStr(date) { return isoDate(date); }
function datePlusWeeks(date, n) {
  const d = new Date(date); d.setDate(d.getDate()+n*7); return d;
}
function formatSemana(monday) {
  const sun = getSundayOfWeek(monday);
  const fmt = d => d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
  const d2 = new Date(Date.UTC(monday.getFullYear(),monday.getMonth(),monday.getDate()));
  const dow = d2.getUTCDay()||7; d2.setUTCDate(d2.getUTCDate()+4-dow);
  const jan1 = new Date(Date.UTC(d2.getUTCFullYear(),0,1));
  const weekNum = Math.ceil(((d2-jan1)/86400000+1)/7);
  return { num:weekNum, periodo:`${fmt(monday)} – ${fmt(sun)}` };
}

// Índice de semana pelo sistema Mestra (âncora fixa 2026-01-05 = seg.)
function mestraWeekIdx(monday) {
  const anchor = new Date(2026, 0, 5);
  const d = monday instanceof Date ? monday : getMondayOfWeek();
  const td = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  return Math.max(0, Math.floor((td - anchor) / (7 * 86400000)));
}

// Retorna a semana com mais funcionários cadastrados; se a semana atual foi iniciada mas
// incompleta (ex: só 3 de 33 copiados), usa a semana anterior mais completa
function getWDComFallback(allData, semIdx) {
  if (!allData) return null;
  const wdDireto = allData[String(semIdx)];
  const countDireto = wdDireto?.funcs?.filter(f => f.nome?.trim()).length || 0;
  let bestWd = wdDireto || null, bestCount = countDireto;
  const keys = Object.keys(allData).map(Number).sort((a,b)=>b-a);
  for (const k of keys) {
    const wd = allData[String(k)];
    const cnt = wd?.funcs?.filter(f => f.nome?.trim()).length || 0;
    if (cnt > bestCount) { bestWd = wd; bestCount = cnt; }
  }
  return bestWd;
}

// Índice do dia dentro da semana comissões (0=Seg..6=Dom)
function comissoesDiaIdx(dateISO) {
  if (!dateISO) return null;
  const dow = new Date(dateISO+'T12:00:00').getDay();
  return dow===0 ? 6 : dow-1;
}

function _parseHorasHorario(horario) {
  if (!horario) return null;
  const m = horario.match(/(\d{1,2})[h:](\d{0,2})\s*[–\-]\s*(\d{1,2})[h:](\d{0,2})/i);
  if (!m) return null;
  const h1 = parseInt(m[1]), min1 = parseInt(m[2] || '0') || 0;
  const h2 = parseInt(m[3]), min2 = parseInt(m[4] || '0') || 0;
  let mins = (h2 * 60 + min2) - (h1 * 60 + min1);
  if (mins <= 0) mins += 1440;
  if (mins <= 0 || mins > 1440) return null;
  if (mins >= 360) mins -= 60;
  return Math.round(mins / 60 * 10) / 10;
}

// DATA — OPERAÇÕES
// ══════════════════════════════════════════════
async function carregarOperacoes() {
  if (!S.opData) { S.opData = new Date(); S.opData.setHours(12,0,0,0); }
  const mode = S.opMode || 'dia';
  let ini, fim;
  if (mode === 'dia') {
    ini = fim = isoDate(S.opData);
  } else if (mode === 'sem') {
    const mon = getMondayOfWeek(S.opData);
    ini = isoDate(mon); fim = isoDate(getSundayOfWeek(mon));
  } else {
    const y = S.opData.getFullYear(), m = S.opData.getMonth();
    ini = y+'-'+String(m+1).padStart(2,'0')+'-01';
    fim = isoDate(new Date(y, m+1, 0));
  }

  const [resCaixa, resComissoes] = await Promise.all([
    db.from('gn_caixa_fechamento').select('loja,data,turno,status,total_real,repique,venda_ifood,venda_online')
      .gte('data', ini).lte('data', fim).order('turno', {ascending:false}),
    db.from('gn_comissoes').select('loja,all_data').in('loja', LOJAS.map(l=>l.comKey)),
  ]);

  S.opCaixa = resCaixa.data || [];
  S.comissoesData = {};
  (resComissoes.data || []).forEach(r => { S.comissoesData[r.loja] = r.all_data; });
}

// ══════════════════════════════════════════════
// DATA — FINANCEIRO
// ══════════════════════════════════════════════
async function carregarFinanceiro() {
  if (!S.finSemana) {
    // Na segunda-feira, fotos de comissão são da semana anterior — abre lá por padrão
    const hoje = getMondayOfWeek();
    S.finSemana = new Date().getDay() === 1 ? datePlusWeeks(hoje, -1) : hoje;
  }
  const ini = isoWeekStr(S.finSemana);
  const fim = isoWeekStr(getSundayOfWeek(S.finSemana));

  let q = db.from('gn_caixa_fechamento')
    .select('id,loja,data,turno,status,total_real,repique,venda_ifood,venda_online')
    .gte('data', ini).lte('data', fim)
    .order('data').order('loja').order('turno');
  if (S.finLoja) { const _lo=LOJAS.find(l=>l.chkKey===S.finLoja); q=q.eq('loja',_lo?_lo.userKey:S.finLoja); }
  const { data: caixaData } = await q;
  S.caixaSemana = caixaData || [];

  // Comprovantes (breakdown por bandeira)
  S.caixaComprovantes = {};
  if (S.caixaSemana.length > 0) {
    const ids = S.caixaSemana.map(r => r.id);
    const { data: compData } = await db.from('gn_caixa_comprovante')
      .select('fechamento_id,bandeira,valor').in('fechamento_id', ids);
    (compData || []).forEach(c => {
      if (!S.caixaComprovantes[c.fechamento_id]) S.caixaComprovantes[c.fechamento_id] = {};
      S.caixaComprovantes[c.fechamento_id][c.bandeira] =
        (S.caixaComprovantes[c.fechamento_id][c.bandeira] || 0) + (parseFloat(c.valor) || 0);
    });
  }

  // Comissões Mestra (brutos por dia, para comparar com fechamento)
  const { data: comData } = await db.from('gn_comissoes').select('loja,all_data').in('loja', LOJAS.map(l => l.comKey));
  S.comissoesData = {};
  (comData || []).forEach(r => { S.comissoesData[r.loja] = r.all_data; });

  // Fotos de comissão (tabela opcional)
  try {
    const ini1f = isoDate(new Date(S.finSemana.getTime() + 86400000)); // terça (fuso UTC)
    let qf = db.from('gn_comissao_foto').select('*').in('semana_ini', [ini, ini1f]);
    if (S.finLoja) qf = qf.eq('loja', S.finLoja);
    const { data: fotos, error: fErr } = await qf;
    if (fErr && fErr.code === '42P01') { S.comissaoFotoSuportado = false; }
    else { S.comissaoFotos = fotos || []; S.comissaoFotoSuportado = true; }
  } catch(_) { S.comissaoFotoSuportado = false; }

  // Fotos do Caixa do Sistema (checklist_diario → vinculadas ao fechamento de caixa)
  try {
    let qfc = db.from('checklist_diario')
      .select('loja,data_operacao,foto_caixa_sistema')
      .gte('data_operacao', ini).lte('data_operacao', fim)
      .not('foto_caixa_sistema', 'is', null);
    if (S.finLoja) qfc = qfc.eq('loja', S.finLoja);
    const { data: fotosCaixa } = await qfc;
    S.fotosCaixaSistema = {};
    (fotosCaixa || []).forEach(row => {
      // checklist_diario.loja = chkKey; map to userKey for lookup against gn_caixa_fechamento
      const lojaObj = LOJAS.find(l => l.chkKey === row.loja);
      const key = `${lojaObj ? lojaObj.userKey : row.loja}|${row.data_operacao}`;
      if (row.foto_caixa_sistema) S.fotosCaixaSistema[key] = row.foto_caixa_sistema;
    });
  } catch(_) { S.fotosCaixaSistema = {}; }
}

// ══════════════════════════════════════════════
// DATA — COMPARATIVO FOTO vs SISTEMA
// ══════════════════════════════════════════════
async function carregarComparativo() {
  if (!S.compSemana) {
    const hj = getMondayOfWeek();
    S.compSemana = new Date().getDay() === 1 ? datePlusWeeks(hj, -1) : hj;
  }
  const ini  = isoWeekStr(S.compSemana);
  const ini1 = isoDate(new Date(S.compSemana.getTime() + 86400000)); // terça (fuso UTC)
  const [resFotos, resCom] = await Promise.all([
    db.from('gn_comissao_foto').select('*').in('semana_ini', [ini, ini1]),
    db.from('gn_comissoes').select('loja,all_data').in('loja', LOJAS.map(l => l.comKey)),
  ]);
  // Prefere entrada da segunda quando há dois registros para a mesma loja
  const fotoMap = {};
  (resFotos.data || []).forEach(f => {
    if (!fotoMap[f.loja] || f.semana_ini === ini) fotoMap[f.loja] = f;
  });
  S.compFotos = Object.values(fotoMap);
  S.compComissoes = {};
  (resCom.data || []).forEach(r => { S.compComissoes[r.loja] = r.all_data; });
}

// DATA — RH / BANCO DE HORAS
// ══════════════════════════════════════════════
async function carregarRH() {
  if (!S.rhSemana) S.rhSemana = getMondayOfWeek();
  const loja = S.rhLoja;
  const weekIdx = mestraWeekIdx(S.rhSemana);

  const [resBH, resCom] = await Promise.all([
    db.from('gn_banco_horas').select('mes,registros').eq('loja', loja.chkKey),
    db.from('gn_comissoes').select('all_data').eq('loja', loja.comKey).single(),
  ]);
  S.bancoHoras = (resBH.data || []).filter(r => r.mes !== 'CONFIG');

  // Extrai funcs da semana selecionada (com fallback para semana mais recente disponível)
  const allData = resCom.data?.all_data;
  const semWD = getWDComFallback(allData, weekIdx);
  S.presencaSemana = semWD ? { idx: weekIdx, funcs: semWD.funcs || [] } : null;
}

// RENDER — OPERAÇÕES (Tab 1)

function renderOperacoes() {
  if (!S.opData) { S.opData = new Date(); S.opData.setHours(12,0,0,0); }
  const mode  = S.opMode || 'dia';
  const today = new Date(); today.setHours(12,0,0,0);
  const isToday = mode === 'dia' && isoDate(S.opData) === isoDate(today);

  // Nav label
  let navLabel = '';
  if (mode === 'dia') {
    navLabel = S.opData.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
    if (isToday) navLabel += ' · hoje';
  } else if (mode === 'sem') {
    const mon = getMondayOfWeek(S.opData);
    const sem = formatSemana(mon);
    navLabel = `Sem. ${sem.num} · ${sem.periodo}`;
  } else {
    navLabel = S.opData.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
    navLabel = navLabel.charAt(0).toUpperCase() + navLabel.slice(1);
  }

  // Semana idx para busca de comissões
  const refMon  = getMondayOfWeek(S.opData);
  const semIdx  = mestraWeekIdx(refMon);

  // Compute faltas helper por loja baseado no modo
  function contarFaltas(allData) {
    let faltas = 0, suspensoes = 0, atestados = 0, bancoHoras = 0;
    if (mode === 'dia') {
      const di = comissoesDiaIdx(isoDate(S.opData));
      const wd = allData?.[String(semIdx)];
      (wd?.funcs||[]).filter(f=>f.nome?.trim()).forEach(f=>{
        const st = f.dias?.[di]||'';
        if (st==='FALTA') faltas++;
        else if (st==='SUSPENSÃO') suspensoes++;
        else if (st==='ATESTADO') atestados++;
        else if (st==='BANCO DE HORAS') bancoHoras++;
      });
    } else if (mode === 'sem') {
      const wd = allData?.[String(semIdx)];
      (wd?.funcs||[]).filter(f=>f.nome?.trim()).forEach(f=>{
        (f.dias||[]).forEach(st=>{
          if (st==='FALTA') faltas++;
          else if (st==='SUSPENSÃO') suspensoes++;
          else if (st==='ATESTADO') atestados++;
          else if (st==='BANCO DE HORAS') bancoHoras++;
        });
      });
    } else {
      // mês: iterar cada dia do mês
      const y = S.opData.getFullYear(), mo = S.opData.getMonth();
      const dias = new Date(y, mo+1, 0).getDate();
      for (let d = 1; d <= dias; d++) {
        const dt = new Date(y, mo, d, 12);
        const si = mestraWeekIdx(getMondayOfWeek(dt));
        const di = comissoesDiaIdx(isoDate(dt));
        const wd = allData?.[String(si)];
        (wd?.funcs||[]).filter(f=>f.nome?.trim()).forEach(f=>{
          const st = f.dias?.[di]||'';
          if (st==='FALTA') faltas++;
          else if (st==='SUSPENSÃO') suspensoes++;
          else if (st==='ATESTADO') atestados++;
          else if (st==='BANCO DE HORAS') bancoHoras++;
        });
      }
    }
    return { faltas, suspensoes, atestados, bancoHoras };
  }

  // Totais globais
  let totalFuncs = 0, totalFaltas = 0, totalSuspensoes = 0, totalAtestados = 0, totalBancoHoras = 0, totalCaixa = 0;

  const cardsHtml = LOJAS.map(loja => {
    const allData = S.comissoesData[loja.comKey];
    const wdFuncs = getWDComFallback(allData, semIdx);
    const funcsAtivos = (wdFuncs?.funcs||[]).filter(f=>f.nome?.trim()).length;
    totalFuncs += funcsAtivos;

    const { faltas, suspensoes, atestados, bancoHoras } = contarFaltas(allData);
    totalFaltas += faltas; totalSuspensoes += suspensoes; totalAtestados += atestados; totalBancoHoras += bancoHoras;

    // Caixa: soma do período por loja
    const cxRecs = (S.opCaixa||[]).filter(r=>r.loja===loja.userKey);
    const cxTotal = cxRecs.reduce((a,r)=>a+(parseFloat(r.total_real)||0),0);
    totalCaixa += cxTotal;
    // Em modo dia: pega status do primeiro registro
    const cxStatus = mode==='dia' ? (cxRecs[0]?.status||null) : null;
    const cxBadge = mode==='dia'
      ? (cxStatus

        </div>

      <div class="loja-metrics">
        <div class="loja-metric">
          <span class="loja-metric-val" style="color:var(--accent)">${funcsAtivos}</span>
          <span class="loja-metric-lbl">Func. Ativos</span>
        </div>
        <div class="loja-metric">
          <span class="loja-metric-val" style="${faltaColor}">${faltas}</span>
          <span class="loja-metric-lbl">${faltaLbl}</span>
        </div>
        <div class="loja-metric">
          <span class="loja-metric-val" style="${suspColor}">${suspensoes}</span>
          <span class="loja-metric-lbl">Suspensão</span>
        </div>
        <div class="loja-metric">
          <span class="loja-metric-val" style="${atesColor}">${atestados}</span>
          <span class="loja-metric-lbl">Atestados</span>
        </div>
        <div class="loja-metric">
          <span class="loja-metric-val" style="${bhColor}">${bancoHoras}</span>
          <span class="loja-metric-lbl">Banco H.</span>
        </div>
      </div>
    </div>`;
  }).join('');

  const caixaLbl = mode==='dia' ? 'Total de Caixa Hoje' : mode==='sem' ? 'Total de Caixa — Semana' : 'Total de Caixa — Mês';

  $('content').innerHTML = `
    <div class="sec-header">
      <div class="sec-title">Operações</div>
    </div>
    <div class="filter-row" style="gap:4px;margin-bottom:8px">
      <button class="ftab${mode==='dia'?' ativo':''}" onclick="setOpMode('dia')">Dia</button>

    </div>
    <div class="stat-row" style="grid-template-columns:repeat(5,1fr)">
      <div class="stat b"><div class="stat-val">${totalFuncs}</div><div class="stat-lbl">Funcionários</div></div>
      <div class="stat r"><div class="stat-val">${totalFaltas}</div><div class="stat-lbl">Faltas</div></div>
      <div class="stat r"><div class="stat-val">${totalSuspensoes}</div><div class="stat-lbl">Suspensão</div></div>
      <div class="stat a"><div class="stat-val">${totalAtestados}</div><div class="stat-lbl">Atestados</div></div>

        <span style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px">${caixaLbl}</span>
        <span class="num fin-total">${money(totalCaixa)}</span>
      </div>

const FIN_ENTRADAS_ORDER = [

];

function toggleComprovante(id) {
  const el = document.getElementById('comp-row-' + id);
  if (!el) return;
  const isHidden = el.style.display === 'none' || el.style.display === '';
  el.style.display = isHidden ? 'table-row' : 'none';
  const btn = document.getElementById('comp-btn-' + id);
  if (btn) btn.textContent = isHidden ? '▲' : '📋';
}

function renderFinanceiro() {
  if (!S.finSemana) {
    const hoje = getMondayOfWeek();
    S.finSemana = new Date().getDay() === 1 ? datePlusWeeks(hoje, -1) : hoje;
  }
  const sem = formatSemana(S.finSemana);
  const ini = isoWeekStr(S.finSemana);

  // Filtros de loja
  const lojaFiltros = [
    `<button class="ftab${S.finLoja===''?' ativo':''}" onclick="filtrarFinLoja('')">Todas</button>`,

  // Agrupamento por loja
  const porLoja = {};

  // Total geral
  const totalSemana = S.caixaSemana.reduce((a,r)=>a+(parseFloat(r.total_real)||0),0);

  const totalOnline = S.caixaSemana.reduce((a,r)=>a+(parseFloat(r.venda_online)||0),0);

          const totalCell = totalReal != null ? money(totalReal) : '<span style="color:var(--muted)">—</span>';
          const fotoB64 = S.fotosCaixaSistema?.[`${lojaChk}|${r.data}`];

            : `<td style="text-align:center;color:var(--muted);font-size:11px">—</td>`;

          // Comprovantes expandable
          const comps = S.caixaComprovantes[r.id] || {};

        const difSem = totalLoja - totalSis;
        const difSemStyle = Math.abs(difSem) < 1 ? 'color:var(--muted)' : difSem > 0 ? 'color:var(--green)' : 'color:var(--red)';
        const totalRow = `<tr style="border-top:2px solid var(--border);background:var(--surf2)">
          <td colspan="3" style="font-weight:800;font-size:11px;color:var(--muted)">TOTAL SEMANA</td>
          <td class="num" style="text-align:right;font-weight:800">${money(totalLoja)}</td>
          <td></td><td></td><td></td>
          <td class="num" style="text-align:right;font-weight:800;color:var(--accent)">${money(totalSis)}</td>
          <td class="num" style="text-align:right;font-weight:800;${difSemStyle}">${difSem>=0?'+':''}${money(difSem)}</td>
          <td></td><td></td>
        </tr>`;

        return `<div class="card" style="margin-bottom:10px">
          <div class="card-header" style="flex-wrap:wrap;gap:8px;align-items:flex-start">
            <span class="card-title" style="align-self:center">${lojaObj?.display||lojaChk}</span>
            <div style="display:flex;align-items:flex-end;gap:16px;margin-left:auto">
              <div style="text-align:right">
                <div class="num fin-total">${money(totalLoja)}</div>
                <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px">caixa cofre</div>
              </div>
              <div style="text-align:right">
                <div class="num" style="font-size:15px;font-weight:700;color:var(--accent)">${money(totalSis)}</div>
                <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px">sistema</div>
              </div>
              <div style="text-align:right">
                <div class="num" style="font-size:15px;font-weight:700;${difSemColor}">${difSem>=0?'+':''}${money(difSem)}</div>
                <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px">diferença</div>
              </div>
            </div>
          </div>
          <div style="overflow-x:auto">
            <table class="fin-table">
              <thead><tr>
                <th>Data</th><th>Turno</th><th>Status</th>
                <th style="text-align:right">Total</th>
                <th style="text-align:right">Repique</th>
                <th style="text-align:right">iFood</th>
                <th style="text-align:right">Online</th>
                <th style="text-align:right">Sistema</th>
                <th style="text-align:right">Dif.</th>
                <th style="text-align:center">📷</th>
                <th style="text-align:center" title="Comprovantes">📋</th>
              </tr></thead>
              <tbody>${rowsHtml}${totalRow}</tbody>
            </table>
          </div>
        </div>`;
      }).join('');

  // Comissão foto audit
  let fotoHtml = '';
  if (!S.comissaoFotoSuportado) {
    fotoHtml = `<div class="card" style="margin-bottom:14px">
      <div class="card-header"><span class="card-title">📸 Auditoria de Comissão</span></div>
      <div class="card-body">
        <div style="font-size:12px;color:var(--muted);margin-bottom:10px">
          Tabela <code>gn_comissao_foto</code> não encontrada. Execute a migração para habilitar o envio de fotos.
        </div>
        <button class="btn btn-sec btn-sm" onclick="modalMigracaoFoto()">Ver SQL de Migração</button>
      </div>
    </div>`;
  } else {
    const lojasFiltradas = S.finLoja ? LOJAS.filter(l=>l.chkKey===S.finLoja) : LOJAS;

      const foto = S.comissaoFotos.find(f=>f.loja===loja.chkKey);
      const status = foto

        : `<span class="badge badge-warn">Pendente</span>`;

        : `<button class="btn-sm btn-sec" style="font-size:10px;padding:3px 9px;opacity:0.7" onclick="modalUploadFoto('${loja.chkKey}','${ini}')" title="Aguardando envio pelo App Checklist">📋 Aguardando</button>`;

  $('content').innerHTML = `

// RENDER — RH / BANCO DE HORAS (Tab 3)
// ══════════════════════════════════════════════
function renderRH() {
  if (!S.rhSemana) S.rhSemana = getMondayOfWeek();
  const sem = formatSemana(S.rhSemana);
  const isCurrentWeek = S.rhSemana.toDateString() === getMondayOfWeek().toDateString();

  // Loja tabs
  const lojaTabsHtml = LOJAS.map(l =>
    `<button class="ftab${S.rhLoja.comKey===l.comKey?' ativo':''}" onclick="filtrarRHLoja('${l.comKey}')">${l.display}</button>`
  ).join('');

  // ── BANCO DE HORAS ──
  const MES_ABREV = ['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const mesAtual = new Date().toISOString().slice(0,7); // 'YYYY-MM'

  // Registros banco de horas: agregar por funcionário
  const bhFuncs = {}; // {nome: {mes: horas}}
  S.bancoHoras.forEach(row => {
    (row.registros||[]).forEach(r => {
      if (!r.nome) return;
      if (!bhFuncs[r.nome]) bhFuncs[r.nome] = {};
      bhFuncs[r.nome][row.mes] = r.horas;
    });
  });

  const buscaQ = (S.rhBusca||'').toLowerCase().trim();

  // ── ESCALA & HORAS ──
  const DIAS_SEM = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  let escalaBHHtml = '';
  const escalFuncs = (S.presencaSemana?.funcs || []).filter(f => f.nome?.trim());
  const escalFuncsFilt = buscaQ ? escalFuncs.filter(f => f.nome.toLowerCase().includes(buscaQ)) : escalFuncs;

  if (escalFuncsFilt.length === 0) {
    escalaBHHtml = `<div class="empty" style="padding:20px"><div class="empty-text">Sem dados de escala para esta semana</div></div>`;
  } else {
    // BH saldo por nome: usar mês mais recente disponível
    const mesesBH = [...new Set(S.bancoHoras.map(r => r.mes))].sort();
    const ultimoMesBH = mesesBH[mesesBH.length - 1] || null;
    const bhSaldoNome = {}; // nome → saldo no mês mais recente
    if (ultimoMesBH) {
      S.bancoHoras.forEach(row => {
        if (row.mes !== ultimoMesBH) return;
        (row.registros || []).forEach(r => {
          if (r.nome) bhSaldoNome[r.nome] = parseFloat(r.horas) || 0;
        });
      });
    }

    const thDias = DIAS_SEM.map(d => `<th style="text-align:center;min-width:32px">${d}</th>`).join('');
    const rowsHtml = escalFuncsFilt.map(f => {
      const hDia = _parseHorasHorario(f.horario);
      const diasPres = (f.dias || []).filter(s => ESCALA_PRESENTE_SET.has(s || 'PRESENTE')).length;
      const horasSem = hDia != null ? Math.round(hDia * diasPres * 10) / 10 : null;
      const bhSaldo = bhSaldoNome[f.nome] ?? null;

      // Status especial
      const emFerias = (f.dias || []).some(s => s === 'FÉRIAS');
      const emAfastamento = (f.dias || []).some(s => s === 'AFASTAMENTO');

      // Turno pill
      const tc = ESCALA_TURNO_COLOR[f.turno || ''] || '#475569';
      const turnoPill = f.turno ? `<span style="font-size:9px;background:${tc}22;color:${tc};border-radius:4px;padding:1px 5px;font-weight:700;white-space:nowrap">${f.turno}</span>` : '';
      const horPill = f.horario ? `<span style="font-size:9px;color:var(--muted)">${f.horario}</span>` : '';

      // Badge especial (férias / afastamento)
      let statusBadge = '';
      if (emFerias) statusBadge = `<span class="badge badge-info" style="font-size:8px">🏖 Férias</span>`;
      else if (emAfastamento) statusBadge = `<span class="badge badge-warn" style="font-size:8px">🏥 Afastado</span>${f.afastamento_just ? `<span style="font-size:9px;color:var(--muted)">${f.afastamento_just}</span>` : ''}`;

      // Dia pills
      const diaCells = DIAS_SEM.map((_, i) => {
        const st = (f.dias || [])[i] || 'PRESENTE';
        const abrev = PRES_ABREV[st] || st.slice(0, 2);
        const cls   = PRES_CLASS[st] || 'day-NW';
        return `<td style="text-align:center"><span class="day-pill ${cls}" title="${st}">${abrev}</span></td>`;
      }).join('');

      // BH saldo cor
      const bhColor = bhSaldo == null ? 'var(--muted)' : bhSaldo > 0 ? 'var(--green)' : bhSaldo < 0 ? 'var(--red)' : 'var(--muted)';
      const bhTxt   = bhSaldo == null ? '—' : `${bhSaldo > 0 ? '+' : ''}${bhSaldo}h`;

      // Horas semana cor
      const hColor = horasSem == null ? 'var(--muted)' : horasSem > 44 ? 'var(--red)' : horasSem > 0 ? 'var(--green)' : 'var(--muted)';

      return `<tr>
        <td class="nome-col" style="min-width:120px;padding:8px 10px">
          <div style="font-weight:700;font-size:12px">${f.nome}</div>
          <div style="display:flex;gap:3px;flex-wrap:wrap;margin-top:2px;align-items:center">${f.setor ? `<span style="font-size:9px;color:var(--muted)">${f.setor}</span>` : ''}${statusBadge}</div>
          <div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:2px;align-items:center">${turnoPill}${horPill}</div>
        </td>
        ${diaCells}
        <td style="text-align:center;padding:8px 6px;border-left:1px solid var(--border)">
          <div style="font-size:12px;font-weight:800;color:${hColor};font-variant-numeric:tabular-nums">${horasSem != null ? horasSem + 'h' : '—'}</div>
          <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px">${diasPres}d/sem</div>
        </td>
        <td style="text-align:center;padding:8px 6px;border-left:1px solid var(--border)">
          <div style="font-size:12px;font-weight:800;color:${bhColor};font-variant-numeric:tabular-nums">${bhTxt}</div>
          <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px">BH ${ultimoMesBH ? MES_ABREV[parseInt((ultimoMesBH||'').split('-')[1]||'0')] : '—'}</div>
        </td>
      </tr>`;
    }).join('');

    escalaBHHtml = `<div class="rh-table-wrap">
      <table class="rh-table">
        <thead><tr>
          <th>Funcionário</th>
          ${thDias}
          <th style="text-align:center;border-left:1px solid var(--border)">Horas/sem</th>
          <th style="text-align:center;border-left:1px solid var(--border)">BH saldo</th>
        </tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>`;
  }

  const meses = [...new Set(S.bancoHoras.map(r=>r.mes))].sort();

  const bhFuncsFilt = buscaQ
    ? Object.fromEntries(Object.entries(bhFuncs).filter(([n])=>n.toLowerCase().includes(buscaQ)))
    : bhFuncs;

  let bhHtml = '';
  if (Object.keys(bhFuncs).length === 0) {
    bhHtml = `<div class="empty" style="padding:24px"><div class="empty-icon">⏱</div><div class="empty-text">Sem dados de banco de horas para ${S.rhLoja.display}</div></div>`;
  } else {
    const mesHeaders = meses.map(m => {
      const [y,mo] = m.split('-');
      return `<th style="text-align:center">${MES_ABREV[parseInt(mo)]} ${y.slice(2)}</th>`;
    }).join('') + `<th style="text-align:center;border-left:2px solid var(--border)">Total</th>`;

    const rowsHtml = Object.entries(bhFuncsFilt).sort(([a],[b])=>a.localeCompare(b)).map(([nome, mesSaldo]) => {
      const ultimoMes = meses[meses.length-1];
      const ultimoSaldo = ultimoMes != null ? parseFloat(mesSaldo[ultimoMes]) : null;
      const totalFunc = meses.reduce((s,m) => s + (parseFloat(mesSaldo[m])||0), 0);
      const isNeg = totalFunc < 0;
      const negBadge = isNeg ? ' <span class="badge badge-err" style="font-size:8px;vertical-align:middle">⚠️</span>' : '';
      const rowBg = isNeg ? 'background:var(--red-bg)' : '';
      const celulas = meses.map(m => {
        const h = mesSaldo[m];
        if (h == null) return `<td style="text-align:center;color:var(--muted)">—</td>`;
        const hNum = parseFloat(h);
        const color = hNum > 0 ? 'color:var(--green);font-weight:700' : hNum < 0 ? 'color:var(--red);font-weight:700' : 'color:var(--muted)';
        return `<td class="num" style="text-align:center;${color}">${hNum>0?'+':''}${hNum}h</td>`;
      }).join('');
      const totalColor = totalFunc > 0 ? 'color:var(--green);font-weight:800' : totalFunc < 0 ? 'color:var(--red);font-weight:800' : 'color:var(--muted);font-weight:800';
      const totalCell = `<td class="num" style="text-align:center;border-left:2px solid var(--border);${totalColor}">${totalFunc>0?'+':''}${totalFunc.toFixed(1)}h</td>`;
      return `<tr style="${rowBg}"><td class="nome-col">${nome}${negBadge}</td>${celulas}${totalCell}</tr>`;
    }).join('');

    const totHtml = meses.map(m => {
      const tot = Object.values(bhFuncsFilt).reduce((a,mb)=>a+(parseFloat(mb[m])||0),0);
      const color = tot > 0 ? 'color:var(--green)' : tot < 0 ? 'color:var(--red)' : 'color:var(--muted)';
      return `<td class="num" style="text-align:center;font-weight:800;${color}">${tot>0?'+':''}${tot.toFixed(1)}h</td>`;
    }).join('');
    const grandTotal = Object.values(bhFuncsFilt).reduce((s,mb) => s + meses.reduce((a,m) => a + (parseFloat(mb[m])||0), 0), 0);
    const grandColor = grandTotal > 0 ? 'color:var(--green)' : grandTotal < 0 ? 'color:var(--red)' : 'color:var(--muted)';
    const grandTotCell = `<td class="num" style="text-align:center;font-weight:800;border-left:2px solid var(--border);${grandColor}">${grandTotal>0?'+':''}${grandTotal.toFixed(1)}h</td>`;

    bhHtml = `<div class="rh-table-wrap">
      <table class="rh-table">
        <thead><tr><th>Funcionário</th>${mesHeaders}</tr></thead>
        <tbody>
          ${rowsHtml}
          <tr style="border-top:2px solid var(--border);background:var(--surf2)">
            <td style="font-weight:800;font-size:11px;color:var(--muted)">TOTAL</td>${totHtml}${grandTotCell}
          </tr>
        </tbody>
      </table>
    </div>`;
  }

  // ── ESPELHO DE FREQUÊNCIA (semana atual da comissões) ──
  const DIAS_NAMES = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  let presFuncs = S.presencaSemana?.funcs?.filter(f=>f.nome?.trim()) || [];
  if (buscaQ) presFuncs = presFuncs.filter(f => f.nome.toLowerCase().includes(buscaQ));

  let presHtml = '';
  if (presFuncs.length === 0) {
    presHtml = `<div class="empty" style="padding:20px"><div class="empty-text">Sem dados de presença para esta semana</div></div>`;
  } else {
    const diasHeaders = DIAS_NAMES.map(d=>`<th style="text-align:center;min-width:34px">${d}</th>`).join('');
    const rowsHtml = presFuncs.map(f => {
      const dias = DIAS_NAMES.map((_,i) => {
        const st = f.dias?.[i] || 'PRESENTE';
        const abrev = PRES_ABREV[st] || st.slice(0,2);
        const cls   = PRES_CLASS[st] || 'day-NW';
        return `<td style="text-align:center"><span class="day-pill ${cls}" title="${st}">${abrev}</span></td>`;
      }).join('');
      const faltas  = (f.dias||[]).filter(d=>d==='FALTA').length;
      const susps   = (f.dias||[]).filter(d=>d==='SUSPENSÃO').length;
      const atests  = (f.dias||[]).filter(d=>d==='ATESTADO').length;
      const resumo  = [
        faltas>0   ? `<span class="badge badge-err" style="font-size:8px">${faltas}F</span>` : '',
        susps>0    ? `<span class="badge badge-err" style="font-size:8px">${susps}S</span>` : '',
        atests>0   ? `<span class="badge badge-warn" style="font-size:8px">${atests}AT</span>` : ''
      ].filter(Boolean).join(' ');
      return `<tr>
        <td class="nome-col">${f.nome}${resumo?' <span style="margin-left:4px">'+resumo+'</span>':''}</td>
        ${dias}
      </tr>`;
    }).join('');

    const totDias = DIAS_NAMES.map((_,i) => {
      const cnt = presFuncs.filter(f=>(f.dias?.[i]||'PRESENTE')==='FALTA').length;
      return cnt > 0
        ? `<td style="text-align:center"><span class="badge badge-err" style="font-size:8px">${cnt}</span></td>`
        : `<td></td>`;
    }).join('');

    presHtml = `<div class="rh-table-wrap">
      <table class="rh-table">
        <thead><tr><th>Funcionário</th>${diasHeaders}</tr></thead>
        <tbody>
          ${rowsHtml}
          <tr style="background:var(--surf2);border-top:2px solid var(--border)">
            <td style="font-size:10px;color:var(--muted);font-weight:700">Faltas</td>${totDias}
          </tr>
        </tbody>
      </table>
    </div>`;
  }

  $('content').innerHTML = `
    <div class="sec-header"><div class="sec-title">RH / Banco de Horas</div></div>
    <div class="filter-row">${lojaTabsHtml}</div>
    <div style="margin-bottom:10px">
      <input type="search" id="rh-busca" value="${(S.rhBusca||'').replace(/"/g,'&quot;')}"
        placeholder="🔍 Pesquisar funcionário…"
        oninput="S.rhBusca=this.value;renderRH();setTimeout(()=>{const el=$('rh-busca');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}},0)"
        style="width:100%;background:var(--surf2);border:1px solid var(--border);color:var(--text);border-radius:var(--rs);padding:8px 12px;font-size:12px;font-family:inherit;outline:none;box-sizing:border-box">
    </div>

    <div class="card" style="margin-bottom:14px">
      <div class="card-header">
        <span class="card-title">⏱ Saldo Banco de Horas</span>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:11px;color:var(--muted)">${S.rhLoja.display}</span>
          ${Object.keys(bhFuncs).length > 0 ? `<button onclick="exportarBHCSV()" class="btn-sm btn-sec" style="font-size:11px;padding:3px 8px">⬇️ CSV</button>` : ''}
        </div>
      </div>
      <div class="card-body" style="padding:0">${bhHtml}</div>
    </div>

    <div class="card" style="margin-bottom:14px">
      <div class="card-header">
        <span class="card-title">📊 Escala & Horas — ${S.rhLoja.display}</span>
        <span style="font-size:11px;color:var(--muted)">Sem. ${sem.num} · ${sem.periodo}</span>
      </div>
      <div class="card-body" style="padding:0">${escalaBHHtml}</div>
    </div>

    <div class="card">
      <div class="card-header" style="flex-wrap:wrap;gap:8px">
        <span class="card-title">📅 Espelho de Frequência</span>
        <div style="display:flex;align-items:center;gap:8px">
          <button onclick="navegarRHSemana(-1)" style="width:26px;height:26px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);background:var(--surf2)">&#8592;</button>
          <span style="font-size:11px;font-weight:700">Sem.${sem.num} · ${sem.periodo}</span>
          <button ${isCurrentWeek?'disabled style="opacity:.3"':''} onclick="navegarRHSemana(1)" style="width:26px;height:26px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);background:var(--surf2)">&#8594;</button>
        </div>

      <div class="card-body" style="padding:0">${presHtml}</div>

}

// ══════════════════════════════════════════════
// RENDER — COMPARATIVO FOTO vs SISTEMA (Tab 4)
// ══════════════════════════════════════════════
function renderComparativo() {
  if (!S.compSemana) {
    const hj = getMondayOfWeek();
    S.compSemana = new Date().getDay() === 1 ? datePlusWeeks(hj, -1) : hj;
  }
  const sem = formatSemana(S.compSemana);
  const ini = isoWeekStr(S.compSemana);
  const semIdx = mestraWeekIdx(S.compSemana);
  const diasNome = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];

  let nOk = 0, nDiv = 0, nSemFoto = 0, totalOcrDiff = 0, nComOcr = 0;

  const rows = LOJAS.map(loja => {
    const foto = S.compFotos.find(f => f.loja === loja.chkKey);
    const brutos = S.compComissoes[loja.comKey]?.[String(semIdx)]?.brutos || Array(7).fill(0);
    let jaOk = false;
    try { jaOk = !!localStorage.getItem('gn_comp_ok_' + loja.chkKey + '_' + ini); } catch(_) {}

    if (!foto) {
      nSemFoto++;
      return `<div class="comp-card"><div class="comp-card-hdr">
        <span class="comp-loja">${loja.display}</span>
        <span class="badge badge-warn">Sem foto</span>
      </div></div>`;
    }

    if (!Array.isArray(foto.ocr_brutos) || foto.ocr_brutos.length !== 7) {
      return `<div class="comp-card"><div class="comp-card-hdr">
        <span class="comp-loja">${loja.display}</span>
        <div style="display:flex;align-items:center;gap:6px">
          <span class="badge badge-muted">Sem análise</span>
          <button class="btn btn-sec btn-sm" onclick="setTab('financeiro')">Ir p/ Financeiro</button>
        </div>
      </div></div>`;
    }

    const divergencias = [];
    for (let d = 0; d < 7; d++) {
      const sistema = parseFloat(brutos[d]) || 0;
      const fotoval = (foto.ocr_brutos[d] || 0) / 100;
      const dif = sistema - fotoval;
      if (Math.abs(dif) >= 1.0) divergencias.push({ dia: diasNome[d], sistema, fotoval, dif });
    }
    nComOcr++;
    totalOcrDiff += divergencias.reduce((s, d) => s + Math.abs(d.dif), 0);

    if (divergencias.length === 0) {
      nOk++;
      const okBtn = jaOk
        ? `<span class="badge badge-ok" style="font-size:11px">✓ Confirmado</span>`
        : `<button class="btn btn-sec btn-sm" style="color:var(--green);border-color:var(--green)" onclick="marcarOkComp('${loja.chkKey}','${ini}')">✓ Dar OK</button>`;
      return `<div class="comp-card"><div class="comp-card-hdr">
        <span class="comp-loja">${loja.display}</span>
        <div style="display:flex;align-items:center;gap:6px">${okBtn}</div>
      </div></div>`;
    }

    nDiv++;
    const linhas = divergencias.map(({dia, sistema, fotoval, dif}) => {
      const difStr = `<span style="color:${dif > 0 ? 'var(--green)' : 'var(--red)'}">${dif > 0 ? '+' : ''}${money(dif)}</span>`;
      return `<tr><td style="color:var(--muted)">${dia}</td><td>${money(sistema)}</td><td>${money(fotoval)}</td><td>${difStr}</td></tr>`;
    }).join('');

    return `<div class="comp-card">
      <div class="comp-card-hdr">
        <span class="comp-loja">${loja.display}</span>
        <span class="badge badge-err">⚠ Divergência</span>
      </div>
      <div class="comp-div-body">
        <table class="comp-div-table">
          <thead><tr style="color:var(--muted)"><td>Dia</td><td>Sistema</td><td>Foto</td><td>Diferença</td></tr></thead>
          <tbody>${linhas}</tbody>
        </table>
      </div>
    </div>`;
  }).join('');

  const ocrBanner = nComOcr > 0
    ? totalOcrDiff >= 50
      ? `<div style="background:rgba(239,68,68,.12);border:1px solid #ef4444;border-radius:8px;padding:9px 13px;margin-bottom:12px;font-size:12px;color:#ef4444;font-weight:700">⚠️ Diferença OCR vs Sistema: R$ ${money(totalOcrDiff)} — Verifique os lançamentos</div>`
      : totalOcrDiff > 0
        ? `<div style="background:rgba(245,158,11,.1);border:1px solid #f59e0b;border-radius:8px;padding:9px 13px;margin-bottom:12px;font-size:12px;color:#f59e0b;font-weight:700">⚠️ Diferença OCR vs Sistema: R$ ${money(totalOcrDiff)}</div>`
        : `<div style="background:rgba(34,197,94,.1);border:1px solid #22c55e;border-radius:8px;padding:9px 13px;margin-bottom:12px;font-size:12px;color:#22c55e;font-weight:700">✓ OCR e sistema conferem</div>`
    : '';

  $('content').innerHTML = `
    <div class="week-nav" style="margin-bottom:12px">
      <button onclick="navegarComp(-1)">‹</button>
      <div class="week-label">
        <div class="week-num">S${String(sem.num).padStart(2,'0')}</div>
        <div class="week-period">${sem.periodo}</div>
      </div>
      <button onclick="navegarComp(1)">›</button>
    </div>
    ${ocrBanner}
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <div class="stat" style="flex:1;text-align:center"><div class="stat-val" style="color:var(--green)">${nOk}</div><div class="stat-lbl">OK</div></div>
      <div class="stat" style="flex:1;text-align:center"><div class="stat-val" style="color:var(--red)">${nDiv}</div><div class="stat-lbl">Divergências</div></div>
      <div class="stat" style="flex:1;text-align:center"><div class="stat-val" style="color:var(--amber)">${nSemFoto}</div><div class="stat-lbl">Sem Foto</div></div>
    </div>
    ${rows}
  `;
}

function navegarComp(delta) {
  if (!S.compSemana) {
    const hj = getMondayOfWeek();
    S.compSemana = new Date().getDay() === 1 ? datePlusWeeks(hj, -1) : hj;
  }
  S.compSemana = datePlusWeeks(S.compSemana, delta);
  renderContent();
}

function marcarOkComp(lojaChkKey, ini) {
  try { localStorage.setItem('gn_comp_ok_' + lojaChkKey + '_' + ini, '1'); } catch(_) {}
  renderComparativo();
}

// ══════════════════════════════════════════════
// NAV + RENDER
// ══════════════════════════════════════════════
function setTab(tab) {
  if (S.abasPermitidas && !S.abasPermitidas.has(tab)) return;
  S.tab = tab;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('ativo', b.dataset.tab===tab));
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  const sl = document.querySelector(`.sidebar-link[data-sidebar-tab="${tab}"]`);
  if (sl) sl.classList.add('active');
  renderContent();
}

function renderContent() {
  $('content').innerHTML = `<div class="empty"><div class="spin"></div></div>`;
  Promise.resolve().then(async () => {
    try {
      if (S.tab === 'operacoes')    { await carregarOperacoes();    renderOperacoes();    }
      if (S.tab === 'financeiro')  { await carregarFinanceiro();  renderFinanceiro();   }
      if (S.tab === 'rh')          { await carregarRH();          renderRH();           }
      if (S.tab === 'comparativo') { await carregarComparativo(); renderComparativo();  }
    } catch(e) {
      $('content').innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">Erro ao carregar: ${e.message}</div></div>`;
    }
  });
}

function recarregar() { renderContent(); }

// ACTIONS — OPERAÇÕES
// ══════════════════════════════════════════════
function setOpMode(mode) {
  S.opMode = mode;
  if (!S.opData) { S.opData = new Date(); S.opData.setHours(12,0,0,0); }
  renderContent();
}

function navegarOp(delta) {
  if (!S.opData) { S.opData = new Date(); S.opData.setHours(12,0,0,0); }
  const mode = S.opMode || 'dia';
  if (mode === 'dia') {
    S.opData = new Date(S.opData); S.opData.setDate(S.opData.getDate()+delta);
  } else if (mode === 'sem') {
    S.opData = datePlusWeeks(S.opData, delta);
  } else {
    S.opData = new Date(S.opData.getFullYear(), S.opData.getMonth()+delta, 1, 12);
  }
  const today = new Date(); today.setHours(12,0,0,0);
  if (S.opData > today) S.opData = today;
  renderContent();
}

function _buildTextoRH() {
  if (!S.opData) return '';
  const mode = S.opMode || 'dia';
  let periodo;
  if (mode === 'dia') {
    periodo = S.opData.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'short'});
  } else if (mode === 'sem') {
    const mon = getMondayOfWeek(S.opData);
    const sem = formatSemana(mon);
    periodo = `Semana ${sem.num} (${sem.periodo})`;
  } else {
    const p = S.opData.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
    periodo = p.charAt(0).toUpperCase()+p.slice(1);
  }
  const refMon = getMondayOfWeek(S.opData);
  const semIdx = mestraWeekIdx(refMon);
  let totalFaltas = 0, totalCaixa = 0;
  const linhas = LOJAS.map(loja => {
    const allData = S.comissoesData[loja.comKey];
    let faltas = 0, suspensoes = 0;
    if (mode === 'dia') {
      const di = comissoesDiaIdx(isoDate(S.opData));
      const wd = allData?.[String(semIdx)];
      (wd?.funcs||[]).filter(f=>f.nome?.trim()).forEach(f=>{
        const st=f.dias?.[di]||'';
        if(st==='FALTA')faltas++;
        else if(st==='SUSPENSÃO')suspensoes++;
      });
    } else if (mode === 'sem') {
      const wd = allData?.[String(semIdx)];
      (wd?.funcs||[]).filter(f=>f.nome?.trim()).forEach(f=>{
        (f.dias||[]).forEach(st=>{ if(st==='FALTA')faltas++; else if(st==='SUSPENSÃO')suspensoes++; });
      });
    } else {
      const y=S.opData.getFullYear(), mo=S.opData.getMonth();
      const qtd=new Date(y,mo+1,0).getDate();
      for(let d=1;d<=qtd;d++){
        const dt=new Date(y,mo,d,12);
        const si=mestraWeekIdx(getMondayOfWeek(dt));
        const di=comissoesDiaIdx(isoDate(dt));
        const wd=allData?.[String(si)];
        (wd?.funcs||[]).filter(f=>f.nome?.trim()).forEach(f=>{
          const st=f.dias?.[di]||'';
          if(st==='FALTA')faltas++; else if(st==='SUSPENSÃO')suspensoes++;
        });
      }
    }
    totalFaltas += faltas;
    const cxTotal=(S.opCaixa||[]).filter(r=>r.loja===loja.userKey).reduce((a,r)=>a+(parseFloat(r.total_real)||0),0);
    totalCaixa += cxTotal;
    const partes=[];
    if(faltas>0) partes.push(`${faltas} falta${faltas>1?'s':''}`);
    if(suspensoes>0) partes.push(`${suspensoes} susp.`);
    if(cxTotal>0) partes.push(`R$ ${cxTotal.toLocaleString('pt-BR',{minimumFractionDigits:2})}`);
    return `• ${loja.display}${partes.length?': '+partes.join(', '):' OK'}`;
  }).join('\n');
  return `GN Operações — ${periodo}\n\n${linhas}\n\nTotal faltas: ${totalFaltas}\nCaixa total: R$ ${totalCaixa.toLocaleString('pt-BR',{minimumFractionDigits:2})}`;
}

  const text=`📊 *GN Operações — ${periodo}*\n\n${linhas}\n\n📉 Total faltas: *${totalFaltas}*\n💰 Caixa total: *R$ ${totalCaixa.toLocaleString('pt-BR',{minimumFractionDigits:2})}*`;
  window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');
}

function previewFoto(input, previewId, zoneId) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = $(previewId);
    img.src = e.target.result;
    img.classList.remove('hidden');
    $(zoneId).style.display = 'none';
  };
  reader.readAsDataURL(file);
}

async function salvarFotoComissao(loja, semanaIni) {
  const enviado = ($('foto-enviado-por')?.value||'').trim();
  if (!enviado) { toast('Informe o responsável', 'err'); return; }
  const img = $('foto-preview');
  if (!img || img.classList.contains('hidden')) { toast('Selecione uma foto', 'err'); return; }
  const b64 = img.src;
  try {
    const { error } = await db.from('gn_comissao_foto').upsert(
      { loja, semana_ini: semanaIni, foto_base64: b64, enviado_por: enviado },
      { onConflict: 'loja,semana_ini' }
    );
    if (error) throw error;
    toast('Foto salva! Analisando com IA...', 'ok');
    fecharModal();
    await carregarFinanceiro(); renderFinanceiro();
    // Dispara análise OCR em background
    analisarFotoComissao(loja, semanaIni)
      .then(() => carregarFinanceiro().then(renderFinanceiro))
      .catch(e => toast('OCR: ' + e.message, 'err'));
  } catch(e) { toast('Erro: ' + e.message, 'err'); }
}

async function analisarFotoComissao(loja, semanaIni) {
  const res = await fetch(`${SUPA_URL}/functions/v1/analisar-foto-comissao`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${SUPA_KEY}`,
      'apikey': SUPA_KEY,
    },
    body: JSON.stringify({ loja, semana_ini: semanaIni }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Erro na análise');
  return data;
}

function verFoto(loja, semanaIni) {
  const foto = S.comissaoFotos.find(f=>f.loja===loja && f.semana_ini===semanaIni);
  if (!foto?.foto_base64) { toast('Foto não encontrada', 'err'); return; }
  const lojaDisplay = LOJAS.find(l=>l.chkKey===loja)?.display || loja;

  const dias = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  let ocrHtml = '';

  if (Array.isArray(foto.ocr_brutos) && foto.ocr_brutos.length === 7) {
    const mestre = foto.ocr_mestre_brutos;
    const analisadoEm = foto.ocr_analisado_em
      ? new Date(foto.ocr_analisado_em).toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})
      : '';

    const cabTh = mestre
      ? `<th style="text-align:right">Foto (OCR)</th><th style="text-align:right">Sistema</th><th style="text-align:right">Dif.</th>`
      : `<th style="text-align:right">Foto (OCR)</th>`;

    const linhas = dias.map((d, i) => {
      const ocr = foto.ocr_brutos[i] || 0;
      const fmtOcr = 'R$ ' + num(ocr / 100);
      if (!mestre) return `<tr><td>${d}</td><td style="text-align:right">${fmtOcr}</td></tr>`;
      const mes = mestre[i] || 0;
      const dif = ocr - mes;
      const difStr = dif === 0 ? '—'
        : `<span style="color:${dif>0?'var(--green)':'var(--red)'}">${dif>0?'+':''}R$ ${num(dif/100)}</span>`;
      return `<tr>
        <td>${d}</td>
        <td style="text-align:right">${fmtOcr}</td>
        <td style="text-align:right">R$ ${num(mes/100)}</td>
        <td style="text-align:right">${difStr}</td>
      </tr>`;
    }).join('');

    ocrHtml = `
      <div style="margin-top:14px;border-top:1px solid var(--border);padding-top:12px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <span style="font-size:12px;font-weight:700;color:var(--muted)">🤖 Leitura da Foto</span>
          ${analisadoEm ? `<span style="font-size:10px;color:var(--muted)">${analisadoEm}</span>` : ''}
        </div>
        <div style="overflow-x:auto">
          <table style="width:100%;font-size:12px;border-collapse:collapse">
            <thead><tr style="font-size:10px;color:var(--muted);border-bottom:1px solid var(--border)">
              <th style="text-align:left;padding-bottom:4px">Dia</th>${cabTh}
            </tr></thead>
            <tbody>${linhas}</tbody>
          </table>
        </div>
        <button class="btn btn-sec" style="margin-top:10px;width:100%;font-size:12px"
          onclick="triggerAnalisarFoto('${loja}','${semanaIni}')">🔄 Re-analisar</button>
      </div>`;
  } else {
    ocrHtml = `
      <div style="margin-top:14px;border-top:1px solid var(--border);padding-top:12px">
        <button id="btn-analisar" class="btn btn-pri" style="width:100%;font-size:13px"
          onclick="triggerAnalisarFoto('${loja}','${semanaIni}')">🤖 Analisar com IA</button>
        <p style="font-size:10px;color:var(--muted);text-align:center;margin-top:6px">
          Extrai valores diários e compara com o sistema
        </p>
      </div>`;
  }

  abrirModal(`
    <div class="modal-handle"></div>
    <div class="modal-title">
      📸 ${lojaDisplay} — ${fmtBR(semanaIni)}
      <button class="modal-close" onclick="fecharModal()">×</button>
    </div>
    <img src="${foto.foto_base64}" style="width:100%;border-radius:var(--rs);max-height:50dvh;object-fit:contain;background:var(--surf2)">
    <p style="font-size:11px;color:var(--muted);margin-top:8px">Enviado por: ${foto.enviado_por||'—'}</p>
    ${ocrHtml}
    <div class="modal-actions">
      <button class="btn btn-sec" onclick="fecharModal()">Fechar</button>
      <button class="btn btn-danger" onclick="excluirFoto('${loja}','${semanaIni}')">Excluir</button>
    </div>
  `);
}

async function triggerAnalisarFoto(loja, semanaIni) {
  const btn = document.getElementById('btn-analisar') || document.querySelector('[onclick*="triggerAnalisarFoto"]');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Analisando...'; }
  try {
    await analisarFotoComissao(loja, semanaIni);
    await carregarFinanceiro();
    toast('Análise concluída!', 'ok');
    fecharModal();
    verFoto(loja, semanaIni);
  } catch(e) {
    toast('Erro na análise: ' + e.message, 'err');
    if (btn) { btn.disabled = false; btn.textContent = '🤖 Analisar com IA'; }
  }
}

function exportarBHCSV() {
  if (!S.bancoHoras.length) { toast('Sem dados para exportar', 'err'); return; }
  const MES_ABREV = ['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const bhFuncs = {};
  S.bancoHoras.forEach(row => {
    (row.registros||[]).forEach(r => {
      if (!r.nome) return;
      if (!bhFuncs[r.nome]) bhFuncs[r.nome] = {};
      bhFuncs[r.nome][row.mes] = r.horas;
    });
  });
  const meses = [...new Set(S.bancoHoras.map(r=>r.mes))].sort();
  const header = ['Funcionário', ...meses.map(m => {
    const [y,mo] = m.split('-');
    return MES_ABREV[parseInt(mo)]+'/'+y.slice(2);
  }), 'Total'];
  const rows = Object.entries(bhFuncs).sort(([a],[b])=>a.localeCompare(b)).map(([nome, mesSaldo]) => {
    const total = meses.reduce((s,m) => s + (parseFloat(mesSaldo[m])||0), 0);
    return [nome, ...meses.map(m => mesSaldo[m] != null ? parseFloat(mesSaldo[m]).toFixed(1) : ''), total.toFixed(1)];
  });
  const csv = [header, ...rows].map(r => r.join(';')).join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dataLabel = new Date().toISOString().slice(0,7);
  a.href = url; a.download = `banco-horas-${S.rhLoja.display.replace(/\s+/g,'-').toLowerCase()}-${dataLabel}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('CSV exportado!', 'ok');
}

async function doLogin() {
  const nome = $('ln-user').value.trim();
  const senha = $('ln-pass').value;
  const errEl = $('ln-err');
  errEl.textContent = '';
  if (!nome || !senha) { errEl.textContent = 'Preencha usuário e senha.'; return; }

  const { data, error } = await db.from('gn_usuarios')
    .select('nome,cargo,loja,permissoes')
    .ilike('nome', nome)
    .eq('senha', senha)
    .eq('ativo', true)
    .single();

  if (error || !data) { errEl.textContent = 'Usuário ou senha inválidos.'; return; }

  // Verificar permissão de acesso ao GN RH
  const _p = data.permissoes || {};
  const _isMaster = ['mestre','supervisor','compras'].includes(data.cargo);
  if (!(_isMaster ? _p.rh !== false : !!_p.rh)) {
    errEl.textContent = 'Sem permissão para acessar GN RH.'; return;
  }

  // Salva sessão
  try { localStorage.setItem(SESSION_KEY, JSON.stringify({...data, ts: Date.now()})); } catch(_) {}
  S.usuario = data;
  iniciarApp();
}

async function iniciarApp() {
  // Tenta restaurar sessão
  if (!S.usuario) {
    try {
      const sess = JSON.parse(localStorage.getItem(SESSION_KEY)||'null');
      if (sess && Date.now() - sess.ts < 86400000 * 7) S.usuario = sess;
    } catch(_) {}
  }

  if (!S.usuario) return; // mostra login

  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');

  const dt = new Date();
  $('hdr-date').textContent = dt.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'});
  $('hdr-user').textContent = S.usuario.nome;
  const su = $('sidebar-user'); if (su) su.textContent = S.usuario.nome;

  // Configurar abas permitidas a partir das permissões salvas
  const abasArr = (S.usuario.permissoes || {}).rh_abas;
  S.abasPermitidas = Array.isArray(abasArr) ? new Set(abasArr) : null;
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.style.display = S.abasPermitidas && !S.abasPermitidas.has(b.dataset.tab) ? 'none' : '';
  });

  S.opData    = new Date(); S.opData.setHours(12,0,0,0);
  S.finSemana = getMondayOfWeek();
  S.rhSemana  = getMondayOfWeek();

  // Ir para a primeira aba permitida
  const primeiraAba = S.abasPermitidas
    ? (['operacoes','financeiro','rh','comparativo'].find(t => S.abasPermitidas.has(t)) || 'operacoes')
    : 'operacoes';
  setTab(primeiraAba);
}

// Auto-restore session on load
document.addEventListener('DOMContentLoaded', () => {
  $('ln-pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
  iniciarApp();
});
