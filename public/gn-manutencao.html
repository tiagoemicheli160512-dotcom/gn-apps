<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>GN Manutenção</title>
<style>
:root {
  --bg:      #0D0D1A;
  --card:    #15152b;
  --card2:   #1e1e3a;
  --laranja: #E8580A;
  --ouro:    #F5D98A;
  --ok:      #3ecf8e;
  --erro:    #ff5a6e;
  --mut:     #8f8fb0;
  --warn:    #f0c050;
  --azul:    #4dabf7;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:#e8e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}

/* LOGIN */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{background:var(--card);border-radius:16px;padding:32px 24px;width:100%;max-width:360px}
.login-logo{text-align:center;font-size:40px;margin-bottom:4px}
.login-title{text-align:center;font-size:20px;font-weight:800;color:var(--ouro);margin-bottom:2px}
.login-sub{text-align:center;font-size:11px;color:var(--mut);margin-bottom:24px;letter-spacing:.3px}
.login-input{width:100%;background:var(--card2);border:1px solid #2a2a4a;color:#e8e8f0;border-radius:8px;padding:11px 13px;font-size:14px;font-family:inherit;margin-bottom:10px}
.login-input:focus{outline:none;border-color:var(--laranja)}
.login-btn{width:100%;background:var(--laranja);color:#fff;border:none;border-radius:8px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.login-btn:active{opacity:.85}
.login-err{color:var(--erro);font-size:12px;text-align:center;margin-top:8px;min-height:18px}

/* LAYOUT */
.hidden{display:none!important}
.hdr{background:var(--card);padding:11px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--card2)}
.hdr-title{font-size:15px;font-weight:800;color:var(--ouro)}
.hdr-sub{font-size:10px;color:var(--mut);margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:8px}
.hdr-user{font-size:10px;color:var(--mut);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-ref{background:var(--card2);border:1px solid #2a2a4a;color:var(--mut);border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit}
.btn-logout{background:none;border:none;color:var(--mut);font-size:11px;cursor:pointer;padding:4px 6px;border-radius:6px;font-family:inherit;opacity:.7}
.btn-logout:hover{opacity:1;color:var(--erro)}

/* ALERT BANNER */
.alert-banner{background:#2a0808;border:1px solid var(--erro);border-radius:8px;padding:10px 14px;margin:10px 14px 0;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--erro);font-weight:700}
.alert-banner button{margin-left:auto;background:none;border:none;color:var(--mut);cursor:pointer;font-size:16px;line-height:1;padding:0 2px}

/* FILTROS */
.filtros-wrap{background:var(--bg);border-bottom:1px solid var(--card2);padding:8px 0 0}
.filtro-label{font-size:9px;font-weight:700;color:var(--mut);letter-spacing:1px;text-transform:uppercase;padding:0 14px 5px;display:block}
.filtro-row{display:flex;overflow-x:auto;gap:6px;padding:0 14px 8px;scrollbar-width:none;-ms-overflow-style:none}
.filtro-row::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;background:var(--card2);border:1px solid #2a2a4a;color:var(--mut);border-radius:99px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .15s}
.chip:active{opacity:.7}
.chip.sel{background:var(--laranja);border-color:var(--laranja);color:#fff}
.chip.loja-chip.sel{background:#1a1a3a;border-color:var(--ouro);color:var(--ouro)}

/* BOTTOM NAV */
.bot-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--card2);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom,0)}
.bot-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7px 2px 8px;cursor:pointer;font-size:9px;font-weight:700;color:var(--mut);letter-spacing:.3px;text-transform:uppercase;gap:2px;transition:color .15s;position:relative;border:none;background:none;font-family:inherit}
.bot-tab.sel{color:var(--ouro);border-top:2px solid var(--ouro)}
.bot-tab .ti{font-size:18px;line-height:1}
.bot-tab .bdg{position:absolute;top:4px;right:calc(50% - 14px);background:var(--erro);color:#fff;border-radius:99px;font-size:8px;padding:0 4px;font-weight:800;min-width:14px;text-align:center;line-height:14px}
.bot-sep{width:1px;background:var(--card2);align-self:stretch;margin:10px 0}

/* ITEMS */
.items{display:flex;flex-direction:column;gap:10px;padding:10px 14px 90px}
.icard{background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--card2);border-left-width:3px;border-left-color:var(--card2)}
.icard.pendente{border-left-color:var(--erro)}
.icard.andamento{border-left-color:var(--warn)}
.icard.resolvido{border-left-color:var(--ok);opacity:.72}
.icard.resolvido:hover{opacity:1}
.ihead{padding:10px 12px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ibadges{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.btipo{font-size:10px;font-weight:700;padding:2px 9px;border-radius:99px;background:#1a1a3a}
.bstatus{font-size:10px;font-weight:700;padding:2px 9px;border-radius:99px}
.bstatus.pendente{background:#2a080e;color:var(--erro)}
.bstatus.andamento{background:#1e1e0a;color:var(--warn)}
.bstatus.resolvido{background:#0a2818;color:var(--ok)}
.imeta{font-size:10px;color:var(--mut);white-space:nowrap}
.ibody{padding:7px 12px 10px;display:flex;flex-direction:column;gap:4px}
.iloja{font-size:13px;font-weight:700}
.isetor{font-size:10px;color:var(--mut)}
.idesc{font-size:12px;color:#c0c0d8;line-height:1.45}
.icontato{font-size:11px;color:var(--azul)}
.foto-thumb{width:64px;height:64px;object-fit:cover;border-radius:7px;cursor:pointer;margin-top:4px}
.iactions{padding:8px 12px 10px;display:flex;gap:7px;border-top:1px solid var(--card2);align-items:center}
.status-sel{flex:1;background:var(--card2);border:1px solid #2a2a4a;color:#e8e8f0;border-radius:6px;padding:6px 8px;font-size:12px;font-family:inherit}
.btn-save{background:var(--laranja);color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-save:active{opacity:.8}

.empty-state{text-align:center;padding:60px 20px;color:var(--mut)}
.empty-icon{font-size:40px;margin-bottom:8px}

/* Resumo de alerta persistente no topo */
.pend-badge{background:#2a0808;border:1px solid #5a1010;border-radius:8px;margin:10px 14px 0;padding:8px 14px;display:flex;align-items:center;gap:8px;font-size:12px}
.pend-badge .pn{color:var(--erro);font-size:20px;font-weight:900}
.pend-badge .pt{flex:1;color:#e8a0a0;font-size:11px;line-height:1.35}

#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 18px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:999;white-space:nowrap}
#toast.show{opacity:1}

/* ── UTENSÍLIOS ─────────────────────────────────── */
.utens-loja-picker{display:flex;flex-direction:column;align-items:center;padding:24px 16px;gap:8px;background:var(--card);border-radius:12px;margin-top:8px}
.utens-subtabs{display:flex;gap:6px;margin-bottom:12px}
.utens-subtab{flex:1;padding:9px;border-radius:8px;font-size:12px;font-weight:700;border:1px solid #2a2a4a;background:var(--card2);color:var(--mut);cursor:pointer;font-family:inherit;transition:all .15s}
.utens-subtab.sel{background:var(--laranja);border-color:var(--laranja);color:#fff}
.ucard{background:var(--card);border-radius:12px;margin-bottom:8px;border:1px solid var(--card2);overflow:hidden}
.ucard.ucard-alert{border-color:var(--erro)}
.ucard-head{padding:10px 12px;display:flex;align-items:center;gap:10px}
.ucard-foto{width:52px;height:52px;border-radius:9px;object-fit:cover;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.ucard-info{flex:1;min-width:0}
.ucard-nome{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ucard-cat{font-size:10px;color:var(--mut);margin-top:2px}
.ucard-fields{padding:0 12px 12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ufield{display:flex;flex-direction:column;gap:3px}
.ufield-label{font-size:9px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.ufield-input{background:var(--card2);border:1px solid #2a2a4a;color:#e8e8f0;border-radius:7px;padding:7px 6px;font-size:15px;font-weight:700;text-align:center;width:100%;font-family:inherit}
.ufield-input:focus{outline:none;border-color:var(--laranja)}
.ufield-input[readonly]{opacity:.55;cursor:default}
.ufield-obs{grid-column:1/-1}
.ufield-obs .ufield-input{text-align:left;font-size:12px;font-weight:400;padding:7px 9px}
.ufield-save{grid-column:1/-1;background:var(--laranja);color:#fff;border:none;border-radius:8px;padding:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.ufield-save:active{opacity:.8}
/* Mes table */
.umes-table{width:100%;border-collapse:collapse;font-size:11px;min-width:360px}
.umes-table th{padding:6px 8px;color:var(--mut);font-weight:700;white-space:nowrap;text-align:center}
.umes-table th:first-child{text-align:left;position:sticky;left:0;background:var(--bg);min-width:110px}
.umes-table td{padding:7px 8px;border-top:1px solid var(--card2);text-align:center;vertical-align:middle}
.umes-table td:first-child{text-align:left;font-weight:700;position:sticky;left:0;background:var(--bg);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Catalog */
.cat-form{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid var(--card2)}
.cat-form-title{font-size:13px;font-weight:800;color:var(--ouro);margin-bottom:12px}
.cat-field{margin-bottom:8px}
.cat-label{font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px}
.cat-input{width:100%;background:var(--card2);border:1px solid #2a2a4a;color:#e8e8f0;border-radius:8px;padding:9px 11px;font-size:13px;font-family:inherit}
.cat-input:focus{outline:none;border-color:var(--laranja)}
.cat-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat-btn-row{display:flex;gap:8px;margin-top:10px}
.cat-btn{flex:1;padding:10px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border:none}
.cat-btn.pri{background:var(--laranja);color:#fff}
.cat-btn.sec{background:var(--card2);color:var(--mut)}
.cat-item{background:var(--card);border-radius:10px;margin-bottom:6px;border:1px solid var(--card2);display:flex;align-items:center;gap:10px;padding:10px 12px}
.cat-item-foto{width:42px;height:42px;border-radius:7px;object-fit:cover;background:var(--card2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px}
.cat-item-info{flex:1;min-width:0}
.cat-item-nome{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-item-meta{font-size:10px;color:var(--mut);margin-top:2px}
.cat-item-actions{display:flex;gap:6px;flex-shrink:0}
.cat-item-btn{background:var(--card2);border:1px solid #2a2a4a;color:var(--mut);border-radius:6px;padding:5px 9px;font-size:13px;cursor:pointer;font-family:inherit}
.cat-item-btn.del{border-color:var(--erro);color:var(--erro)}

/* ── RELATÓRIOS ──────────────────────────────────── */
.relat-wrap{padding:10px 14px 90px}
.relat-card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid var(--card2)}
.relat-card-title{font-size:13px;font-weight:800;color:var(--ouro);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.relat-tipo-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--card2)}
.relat-tipo-row:last-child{border-bottom:none}
.relat-tipo-icon{width:22px;font-size:14px;text-align:center;flex-shrink:0}
.relat-tipo-label{flex:1;font-size:12px;font-weight:600;color:#d0d0e8}
.relat-tipo-badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.rbadge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.rbadge.pend{background:#2a080e;color:var(--erro)}
.rbadge.and{background:#1e1e0a;color:var(--warn)}
.rbadge.res{background:#0a2818;color:var(--ok)}
.relat-loja-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--card2);font-size:12px}
.relat-loja-row:last-child{border-bottom:none}
.relat-loja-name{font-weight:600;color:#d0d0e8}
.relat-summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.relat-summary-cell{background:var(--card2);border-radius:10px;padding:10px 8px;text-align:center;border:1px solid #2a2a4a}
.relat-summary-val{font-size:22px;font-weight:800}
.relat-summary-lab{font-size:9px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.wpp-btn{width:100%;background:#25D366;color:#fff;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:2px;display:flex;align-items:center;justify-content:center;gap:8px}
.wpp-btn:active{opacity:.8}

/* ── DESKTOP SIDEBAR ───────────────────────────── */
#sidebar-nav { display: none; }
@media (min-width: 768px) {
  body { padding-left: 224px; }
  .bot-nav { display: none !important; }
  #sidebar-nav {
    display: flex; flex-direction: column;
    position: fixed; top: 0; left: 0; bottom: 0; width: 224px;
    background: var(--card); border-right: 1px solid var(--card2);
    overflow-y: auto; z-index: 50; padding-bottom: 16px;
  }
  .sidebar-brand {
    padding: 14px 14px 10px; border-bottom: 1px solid var(--card2);
    margin-bottom: 6px; display: flex; align-items: center;
    gap: 10px; flex-shrink: 0;
  }
  .sidebar-section {
    font-size: 9px; font-weight: 700; letter-spacing: .8px;
    text-transform: uppercase; color: var(--mut); padding: 10px 14px 4px;
  }
  .sidebar-link {
    display: flex; align-items: center; gap: 9px;
    padding: 8px 14px; font-size: 13px; font-weight: 500;
    color: var(--mut); text-align: left; width: 100%;
    border-left: 3px solid transparent;
    transition: color .12s, background .12s; background: none; border-top: none; border-right: none; border-bottom: none;
  }
  .sidebar-link:hover { color: var(--txt); background: var(--card2); }
  .sidebar-link.active { color: var(--ouro); background: rgba(245,217,138,.10); border-left-color: var(--ouro); font-weight: 600; }
  .sidebar-link .sl-icon { width: 20px; font-size: 14px; line-height: 1; text-align: center; flex-shrink: 0; }
}
</style>
</head>

</nav>

</div>

</div>

  { key:'semana_ant', label:'Sem. passada' },
  { key:'mes',        label:'Este mês' },
  { key:'30d',        label:'30 dias' },
];

const S = {
  usuario:     null,
  itens:       [],
  filtro:      'Estrutura',
  lojaFiltro:  'Todas',
  periodo:     '30d',
  // utensílios
  utensTab:       'contagem',
  utensCatalogo:  [],
  utensContagens: {},
  utensEditItem:  null,
  _catFotoB64:    null,
  utensLoaded:    false,
};

function $(id){ return document.getElementById(id); }
function isMaster(){ return ['mestre','supervisor','compras'].includes(S.usuario?.cargo||''); }

async function sb(path, opts={}) {
  const h = { apikey:SB_KEY, Authorization:'Bearer '+SB_KEY, 'Content-Type':'application/json' };
  if (opts.prefer) h['Prefer'] = opts.prefer;
  const r = await fetch(`${SB_URL}/rest/v1/${path}`, { method:opts.method||'GET', headers:h, body:opts.body?JSON.stringify(opts.body):undefined });
  if (!r.ok) { const t=await r.text(); throw new Error(t); }
  const txt=await r.text();
  if(!txt||!txt.trim()) return [];
  return JSON.parse(txt);
}

function toast(msg){ const e=$('toast'); e.textContent=msg; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),2200); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtData(iso){ if(!iso)return'—'; const[y,m,d]=iso.split('-'); return`${d}/${m}/${y}`; }
function tipoInfo(k){ return TIPOS.find(t=>t.key===k)||TIPOS[TIPOS.length-1]; }
function scCls(s){ if(s==='Resolvido')return'resolvido'; if(s==='Em andamento')return'andamento'; return'pendente'; }

// ─── PERÍODO ─────────────────────────────────────────────
function getPeriodoDates() {
  const hoje = new Date();
  const toISO = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const getMon = d => { const c=new Date(d); const dw=c.getDay(); c.setDate(c.getDate()-(dw===0?6:dw-1)); return c; };

  if (S.periodo === 'semana') {
    return { from: toISO(getMon(hoje)), to: toISO(hoje) };
  }
  if (S.periodo === 'semana_ant') {
    const lm = getMon(hoje); lm.setDate(lm.getDate()-7);
    const ls = new Date(lm); ls.setDate(lm.getDate()+6);
    return { from: toISO(lm), to: toISO(ls) };
  }
  if (S.periodo === 'mes') {
    return { from: toISO(new Date(hoje.getFullYear(), hoje.getMonth(), 1)), to: toISO(hoje) };
  }
  // 30d
  const d30 = new Date(hoje); d30.setDate(hoje.getDate()-30);
  return { from: toISO(d30), to: toISO(hoje) };
}

// ─── LOGIN ───────────────────────────────────────────────
async function doLogin(){
  const nome=$('ln-user').value.trim(), senha=$('ln-pass').value;
  const err=$('ln-err'); err.textContent='';
  if(!nome||!senha){ err.textContent='Preencha usuário e senha.'; return; }
  try{
    const rows = await sb(`gn_usuarios?nome=ilike.${encodeURIComponent(nome)}&senha=eq.${encodeURIComponent(senha)}&ativo=eq.true&select=id,nome,cargo,loja,permissoes`);
    if(!rows.length){ err.textContent='Usuário ou senha inválidos.'; return; }
    const u=rows[0];
    const p=u.permissoes||{};
    const ok=['mestre','supervisor','compras'].includes(u.cargo)?p.manutencao!==false:!!p.manutencao;
    if(!ok){ err.textContent='Sem permissão para acessar GN Manutenção.'; return; }
    S.usuario=u;
    try{ localStorage.setItem(SESSION_KEY,JSON.stringify({...u,ts:Date.now()})); }catch(_){}
    iniciarApp();
  }catch(e){ err.textContent='Erro de conexão.'; }
}

async function iniciarApp(){
  if(!S.usuario){
    try{
      const s=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');
      if(s&&s.nome) S.usuario=s; // sem expiração — sessão permanente até clicar "Sair"
    }catch(_){}
  }
  if(!S.usuario) return;
  // Re-valida no servidor em background para atualizar loja/permissões se mudaram
  try{
    const rows=await sb(`gn_usuarios?id=eq.${S.usuario.id}&ativo=eq.true&select=nome,cargo,loja,permissoes`);
    if(!rows.length){ doLogout(); return; } // usuário desativado → força re-login
    const fresh=rows[0];
    const p=fresh.permissoes||{};
    const ok=['mestre','supervisor','compras'].includes(fresh.cargo)?p.manutencao!==false:!!p.manutencao;
    if(!ok){ doLogout(); return; }
    S.usuario={...S.usuario,...fresh};
    try{ localStorage.setItem(SESSION_KEY,JSON.stringify({...S.usuario,ts:Date.now()})); }catch(_){}
  }catch(_){ /* offline — continua com sessão salva */ }
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  // Cabeçalho: mostra nome + loja para não-master
  if(isMaster()){
    $('hdr-user').textContent=S.usuario.nome;
  } else {
    $('hdr-user').textContent=S.usuario.nome+(S.usuario.loja?' · '+S.usuario.loja:'');
  }
  // Para não-master, fixa loja e oculta seletor
  if(!isMaster()) S.lojaFiltro = S.usuario.loja || 'Todas';
  pedirPermissaoNotif();
  await carregarDados();
  setInterval(carregarDados, 120000);
}

// ─── DADOS ───────────────────────────────────────────────
let _lastIds = new Set();

async function carregarDados(){
  $('btnRef').textContent='⏳';
  // Sempre busca 30 dias completos para alertas globais funcionarem
  const d=new Date(); d.setDate(d.getDate()-30);
  const from=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  try{
    // Não-master só busca dados da sua própria loja no servidor
    let url=`checklist_diario?select=data_operacao,loja,manutencao&data_operacao=gte.${from}&order=data_operacao.desc`;
    if(!isMaster() && S.usuario?.loja) url+=`&loja=eq.${encodeURIComponent(S.usuario.loja)}`;
    const rows = await sb(url);
    const itens=[];
    for(const row of rows){
      if(!Array.isArray(row.manutencao)||!row.manutencao.length) continue;
      for(const m of row.manutencao){
        itens.push({...m, _loja:row.loja, _data:row.data_operacao});
      }
    }
    verificarNovos(itens);
    S.itens=itens;
    const tot=itens.length, pend=itens.filter(m=>m.status!=='Resolvido').length;
    const hr=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    $('hdr-sub').textContent=`${tot} registro${tot!==1?'s':''} · ${pend} pendente${pend!==1?'s':''} · ${hr}`;
    atualizarTituloTab(pend);
    renderFiltros();
    renderBotNav();
    renderPendBadge();
    renderLista();
  }catch(e){ toast('Erro ao carregar'); }
  $('btnRef').textContent='🔄';
}

// ─── ALERTAS ─────────────────────────────────────────────
function verificarNovos(itens){
  const pendIds = new Set(itens.filter(m=>m.status!=='Resolvido').map(m=>`${m._loja}:${m._data}:${m.id}`));
  const novosPend=[...pendIds].filter(id=>!_lastIds.has(id));
  const primeiroLoad = _lastIds.size===0;
  _lastIds=pendIds;
  if(primeiroLoad||!novosPend.length) return;
  const n=novosPend.length;
  const msg=`🚨 ${n} nova${n>1?'s':''} manutenção${n>1?'ões':''} pendente${n>1?'s':''}`;
  mostrarAlerta(msg);
  enviarNotif(msg);
  tocarAlerta();
}

function mostrarAlerta(msg){
  const b=$('alertBanner');
  b.classList.remove('hidden');
  b.innerHTML=`<span>🚨</span><span style="flex:1">${esc(msg)}</span><button onclick="fecharAlerta()">✕</button>`;
  setTimeout(fecharAlerta, 15000);
}
function fecharAlerta(){ $('alertBanner').classList.add('hidden'); }

function atualizarTituloTab(pend){
  document.title = pend > 0 ? `(${pend}) GN Manutenção` : 'GN Manutenção';
}

function renderPendBadge(){
  const pend = S.itens.filter(m=>m.status!=='Resolvido').length;
  const badge = $('pendBadge');
  if(pend === 0){ badge.classList.add('hidden'); return; }
  badge.classList.remove('hidden');
  $('pendNum').textContent = pend;
  // Agrupa por loja
  const porLoja = {};
  S.itens.filter(m=>m.status!=='Resolvido').forEach(m=>{
    porLoja[m._loja] = (porLoja[m._loja]||0)+1;
  });
  const resumo = Object.entries(porLoja)
    .sort((a,b)=>b[1]-a[1])
    .map(([l,n])=>`${l}: ${n}`)
    .join(' · ');
  $('pendTxt').textContent = `pendente${pend>1?'s':''} · ${resumo}`;
}

function pedirPermissaoNotif(){
  if('Notification'in window&&Notification.permission==='default') Notification.requestPermission();
}
function enviarNotif(msg){
  if('Notification'in window&&Notification.permission==='granted')
    new Notification('🔧 GN Manutenção',{body:msg,icon:'/favicon.ico'});
}
function tocarAlerta(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [0,0.2,0.4].forEach(t=>{
      const osc=ctx.createOscillator(), g=ctx.createGain();
      osc.connect(g); g.connect(ctx.destination);
      osc.type='sine'; osc.frequency.value=880;
      g.gain.setValueAtTime(0.3,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+t+0.18);
      osc.start(ctx.currentTime+t); osc.stop(ctx.currentTime+t+0.18);
    });
    setTimeout(()=>ctx.close(),1000);
  }catch(_){}
  if(navigator.vibrate) navigator.vibrate([200,80,200,80,300]);
}

// ─── FILTROS ─────────────────────────────────────────────
function renderFiltros(){
  $('filtros-wrap').classList.remove('hidden');

  // Loja chips: só para master
  const lojaRowWrap = $('loja-row-wrap');
  if(isMaster()){
    lojaRowWrap.classList.remove('hidden');
    const lojas = ['Todas', ...LOJAS_LISTA];
    $('loja-row').innerHTML = lojas.map(l =>
      `<button class="chip loja-chip${S.lojaFiltro===l?' sel':''}" onclick="setLojaFiltro(${esc(JSON.stringify(l))})">${esc(l)}</button>`
    ).join('');
  } else {
    lojaRowWrap.classList.add('hidden');
  }

  // Período chips
  $('periodo-row').innerHTML = PERIODOS.map(p =>
    `<button class="chip${S.periodo===p.key?' sel':''}" onclick="setPeriodo('${p.key}')">${p.label}</button>`
  ).join('');
}

async function setLojaFiltro(l){
  S.lojaFiltro=l; renderFiltros(); renderBotNav(); renderPendBadge();
  if(S.filtro==='Utensílios'){ await loadUtensContagens(); }
  renderLista();
}
async function setPeriodo(p){
  S.periodo=p; renderFiltros(); renderBotNav();
  if(S.filtro==='Utensílios'){ await loadUtensContagens(); }
  renderLista();
}

// ─── RODAPÉ ──────────────────────────────────────────────
function getItensFiltradosPorLojaEPeriodo(){
  const {from,to}=getPeriodoDates();
  let items=S.itens.filter(m=>m._data>=from&&m._data<=to);
  if(!isMaster()) items=items.filter(m=>m._loja===S.usuario.loja);
  else if(S.lojaFiltro!=='Todas') items=items.filter(m=>m._loja===S.lojaFiltro);
  return items;
}

function renderBotNav(){
  const base=getItensFiltradosPorLojaEPeriodo();
  const abas=TIPOS.map(t=>({
    key:t.key, icon:t.icon, label:t.key.split('/')[0],
    pend:base.filter(m=>(m.tipo||'Estrutura')===t.key&&m.status!=='Resolvido').length,
  }));
  abas.push({ key:'Utensílios', icon:'🍽️', label:'Utensílios', pend:0 });
  abas.push({ key:'Relatórios', icon:'📊', label:'Relatórios', pend:0 });
  if(S.filtro==='Todos') S.filtro=TIPOS[0].key;
  const nav=$('botNav');
  nav.style.overflowX='auto'; nav.style.overflowY='hidden'; nav.style.scrollbarWidth='none';
  nav.innerHTML=abas.map((a,i)=>{
    const sel=S.filtro===a.key;
    return `${i>0?'<div class="bot-sep"></div>':''}
    <button class="bot-tab${sel?' sel':''}" style="min-width:46px" onclick="setFiltro('${a.key}')">
      <span class="ti">${a.icon}</span>
      <span>${a.label}</span>
      ${a.pend>0?`<span class="bdg">${a.pend}</span>`:''}
    </button>`;
  }).join('');
}

async function setFiltro(f){
  S.filtro=f;
  document.querySelectorAll('.sidebar-link').forEach(l=>l.classList.remove('active'));
  const sl=document.querySelector(`.sidebar-link[data-sidebar-tab="${f}"]`);
  if(sl) sl.classList.add('active');
  renderBotNav();
  if(f==='Utensílios' && !S.utensLoaded){
    $('lista').innerHTML='<div class="empty-state"><div class="empty-icon">⏳</div><div>Carregando utensílios…</div></div>';
    await Promise.all([loadUtensCatalogo(), loadUtensContagens()]);
    S.utensLoaded=true;
  }
  renderLista();
}

function renderLista(){
  if(S.filtro==='Relatórios'){ renderRelatoriosPanel(); return; }
  if(S.filtro==='Utensílios'){ renderUtensPanel(); return; }
  let items=getItensFiltradosPorLojaEPeriodo();
  items=items.filter(m=>(m.tipo||'Estrutura')===S.filtro);
  const ord={pendente_urgente:0,pendente:1,andamento:2,resolvido:3};
  const getPrioKey=m=>{ const sc=scCls(m.status); return (sc==='pendente'&&m.prioridade==='Urgente')?'pendente_urgente':sc; };
  items=[...items].sort((a,b)=>{
    const da=ord[getPrioKey(a)],db=ord[getPrioKey(b)];
    if(da!==db) return da-db;
    return (b._data||'').localeCompare(a._data||'');
  });
  const ti=tipoInfo(S.filtro);
  const pend=items.filter(m=>m.status!=='Resolvido').length;
  const sectionHdr=`<div style="display:flex;align-items:center;gap:10px;padding:2px 0 10px;border-bottom:1px solid var(--card2);margin-bottom:4px">
    <span style="font-size:26px;line-height:1">${ti.icon}</span>
    <div>
      <div style="font-size:15px;font-weight:800;color:var(--ouro)">${esc(S.filtro)}</div>
      <div style="font-size:10px;color:var(--mut)">${items.length} item${items.length!==1?'s':''} · ${pend} pendente${pend!==1?'s':''}</div>
    </div>
  </div>`;
  if(!items.length){
    const periodoLabel=PERIODOS.find(p=>p.key===S.periodo)?.label||'período';
    $('lista').innerHTML=sectionHdr+`<div class="empty-state"><div class="empty-icon">✅</div><div>Nenhuma manutenção neste tipo em ${periodoLabel}${S.lojaFiltro!=='Todas'?' · '+esc(S.lojaFiltro):''}</div></div>`;
    return;
  }
  $('lista').innerHTML=sectionHdr+items.map(m=>{
    const tipo=m.tipo||'Estrutura';
    const ti=tipoInfo(tipo);
    const sc=scCls(m.status);
    const statusLabel=m.status==='Em andamento'?'🔄 Em andamento':m.status==='Resolvido'?'✅ Resolvido':'⏳ Pendente';
    const confirBadge=m.confirmado_loja
      ?`<span class="bstatus resolvido" style="background:#0a2818;color:#5cb85c;">✅ Conf. pela loja</span>`
      :m.status==='Resolvido'
        ?`<span class="bstatus andamento" style="background:#1a1a08;color:#f0c050;">⏳ Aguard. conf. loja</span>`
        :'';
    return `<div class="icard ${sc}">
      <div class="ihead">
        <div class="ibadges">
          <span class="btipo" style="color:${ti.cor}">${ti.icon} ${esc(tipo)}</span>
          <span class="bstatus ${sc}">${statusLabel}</span>
          ${m.prioridade==='Urgente'?`<span class="bstatus" style="background:#3a0a0a;color:#f87171;">🔴 Urgente</span>`:''}
          ${confirBadge}
          ${m.resolved_at&&m.status==='Resolvido'?`<span style="font-size:9px;color:#3a5a3a;padding:2px 7px;border-radius:99px;background:#0a2010;">✓ ${new Date(m.resolved_at).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'})}</span>`:''}
        </div>
        <span class="imeta">${fmtData(m._data)}</span>
      </div>
      <div class="ibody">
        <div class="iloja">${esc(m._loja||'—')}</div>
        <div class="isetor">Setor: ${esc(m.setor||'—')}</div>
        ${m.descricao?`<div class="idesc">${esc(m.descricao)}</div>`:''}
        ${m.contato?`<div class="icontato">📞 ${esc(m.contato)}</div>`:''}
        ${m.fotoBase64?`<img class="foto-thumb" src="${m.fotoBase64}" onclick="this.requestFullscreen&&this.requestFullscreen()" title="Ver foto">`:''}
      </div>
      <div class="iactions">
        <select class="status-sel" id="sel-${m.id}">
          <option value="Pendente" ${m.status==='Pendente'?'selected':''}>⏳ Pendente</option>
          <option value="Em andamento" ${m.status==='Em andamento'?'selected':''}>🔄 Em andamento</option>
          <option value="Resolvido" ${m.status==='Resolvido'?'selected':''}>✅ Resolvido</option>
        </select>
        <button class="btn-save" onclick="salvarStatus(${esc(JSON.stringify(m._loja))},${esc(JSON.stringify(m._data))},${esc(JSON.stringify(String(m.id)))})">Salvar</button>
      </div>
    </div>`;
  }).join('');
}

// ─── STATUS UPDATE ────────────────────────────────────────
async function salvarStatus(loja, data, itemId){
  const sel=$(`sel-${itemId}`); if(!sel) return;
  const novoStatus=sel.value;
  try{
    const rows=await sb(`checklist_diario?data_operacao=eq.${data}&loja=eq.${encodeURIComponent(loja)}&select=manutencao`);
    if(!rows.length){ toast('Registro não encontrado'); return; }
    const arr=Array.isArray(rows[0].manutencao)?rows[0].manutencao:[];
    const idx=arr.findIndex(m=>String(m.id)===String(itemId));
    if(idx<0){ toast('Item não encontrado'); return; }
    if(novoStatus==='Resolvido'&&arr[idx].status!=='Resolvido') arr[idx].resolved_at=new Date().toISOString();
    arr[idx].status=novoStatus;
    await sb(`checklist_diario?data_operacao=eq.${data}&loja=eq.${encodeURIComponent(loja)}`,{
      method:'PATCH', prefer:'return=minimal', body:{manutencao:arr}
    });
    const local=S.itens.find(m=>String(m.id)===String(itemId)&&m._loja===loja&&m._data===data);
    if(local) local.status=novoStatus;
    _lastIds=new Set(S.itens.filter(m=>m.status!=='Resolvido').map(m=>`${m._loja}:${m._data}:${m.id}`));
    atualizarTituloTab(S.itens.filter(m=>m.status!=='Resolvido').length);
    renderBotNav(); renderPendBadge(); renderLista();
    toast('Status atualizado!');
  }catch(e){ toast('Erro ao salvar'); }
}

// ─── UTENSÍLIOS — HELPERS ────────────────────────────────
function dateToISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function getMondayLocal(d){ const c=new Date(d); const dw=c.getDay(); c.setDate(c.getDate()-(dw===0?6:dw-1)); c.setHours(0,0,0,0); return c; }

function getSemanaInicioParaPeriodo(){
  const hoje=new Date();
  if(S.periodo==='semana_ant'){ const lm=getMondayLocal(hoje); lm.setDate(lm.getDate()-7); return dateToISO(lm); }
  return dateToISO(getMondayLocal(hoje));
}

function getSemanasDoMes(){
  const hoje=new Date();
  const primeiroDia=new Date(hoje.getFullYear(),hoje.getMonth(),1);
  const semAtual=dateToISO(getMondayLocal(hoje));
  const semanas=[];
  let mon=getMondayLocal(primeiroDia);
  while(dateToISO(mon)<=semAtual){
    semanas.push(dateToISO(mon));
    const next=new Date(mon); next.setDate(next.getDate()+7); mon=next;
  }
  return semanas.reverse();
}

function fmtSemanaShort(isoMon){
  const d=new Date(isoMon+'T12:00:00');
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
}

function catIcon(cat){
  if(cat==='Cozinha') return '🍳';
  if(cat==='Mesa') return '🍽️';
  if(cat==='Limpeza') return '🧹';
  if(cat==='Frigorifico') return '❄️';
  return '📦';
}

// ─── UTENSÍLIOS — CARREGAR ───────────────────────────────
async function loadUtensCatalogo(){
  try{ S.utensCatalogo=await sb('gn_utensilios_catalogo?ativo=eq.true&order=nome.asc'); }
  catch(e){ S.utensCatalogo=[]; }
}

async function loadUtensContagens(){
  const hoje=new Date();
  const d28=new Date(hoje); d28.setDate(d28.getDate()-28);
  const from=dateToISO(d28);
  const semAtual=dateToISO(getMondayLocal(hoje));
  let url=`gn_utensilios_contagem?semana_inicio=gte.${from}&semana_inicio=lte.${semAtual}&order=semana_inicio.desc`;
  if(!isMaster()) url+=`&loja=eq.${encodeURIComponent(S.usuario.loja)}`;
  else if(S.lojaFiltro!=='Todas') url+=`&loja=eq.${encodeURIComponent(S.lojaFiltro)}`;
  try{
    const rows=await sb(url);
    S.utensContagens={};
    for(const r of rows) S.utensContagens[`${r.catalogo_id}|${r.loja}|${r.semana_inicio}`]=r;
  }catch(e){ S.utensContagens={}; }
}

// ─── UTENSÍLIOS — RENDER ─────────────────────────────────
function setUtensTab(tab){ S.utensTab=tab; S.utensEditItem=null; renderLista(); }

function renderUtensPanel(){
  const canCat=isMaster();
  $('lista').innerHTML=`
    <div>
      ${canCat?`<div class="utens-subtabs">
        <button class="utens-subtab${S.utensTab==='contagem'?' sel':''}" onclick="setUtensTab('contagem')">📋 Contagem</button>
        <button class="utens-subtab${S.utensTab==='catalogo'?' sel':''}" onclick="setUtensTab('catalogo')">📦 Catálogo</button>
      </div>`:''}
      <div id="utens-content">${S.utensTab==='catalogo'&&canCat?renderCatalogHTML():renderContagemHTML()}</div>
    </div>`;
  if(S.utensTab==='catalogo') attachCatalogListeners();
}

function renderContagemHTML(){
  const loja=!isMaster()?S.usuario.loja:(S.lojaFiltro==='Todas'?null:S.lojaFiltro);

  if(!loja) return `<div class="utens-loja-picker">
    <div class="empty-icon">🏪</div>
    <div style="font-size:14px;font-weight:600;margin-bottom:10px">Selecione uma loja para ver a contagem:</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center">${LOJAS_LISTA.map(l=>
      `<button class="chip loja-chip" onclick="setLojaFiltro(${JSON.stringify(l)})" style="font-size:12px">${esc(l)}</button>`
    ).join('')}</div>
  </div>`;
  if(!S.utensCatalogo.length) return `<div class="empty-state"><div class="empty-icon">📦</div><div>Catálogo vazio — adicione itens no Catálogo</div></div>`;
  if(S.periodo==='mes') return renderContagemMes(loja);

  const semIso=getSemanaInicioParaPeriodo();
  const editable=S.periodo!=='semana_ant';
  const semLabel=S.periodo==='semana_ant'?'Sem. passada':'Esta semana';

  const cards=S.utensCatalogo.map(item=>{
    const key=`${item.id}|${loja}|${semIso}`;
    const cnt=S.utensContagens[key]||{};
    const qtd=cnt.quantidade_atual!=null?cnt.quantidade_atual:'';
    const av=cnt.avarias!=null?cnt.avarias:'';
    const aud=cnt.auditoria!=null?cnt.auditoria:'';
    const obs=cnt.observacao||'';
    const min=Number(item.estoque_minimo)||0;
    const alertMin=qtd!==''&&min>0&&Number(qtd)<min;
    const avWarn=av!==''&&Number(av)>0;
    return `<div class="ucard${alertMin?' ucard-alert':''}">
      <div class="ucard-head">
        ${item.foto_base64
          ?`<img class="ucard-foto" src="${item.foto_base64}" onclick="this.requestFullscreen&&this.requestFullscreen()" style="cursor:pointer">`
          :`<div class="ucard-foto">${catIcon(item.categoria)}</div>`}
        <div class="ucard-info">
          <div class="ucard-nome">${esc(item.nome)}</div>
          <div class="ucard-cat">${esc(item.categoria)} · ${esc(item.unidade)}${min>0?' · Mín '+min:''}</div>
        </div>
        ${alertMin?`<span style="color:var(--erro);font-size:18px" title="Abaixo do mínimo">⚠️</span>`:''}
      </div>
      <div class="ucard-fields">
        <div class="ufield">
          <span class="ufield-label">Quantidade</span>
          <input class="ufield-input" type="number" min="0" step="1" id="uqtd-${item.id}" value="${esc(String(qtd))}" placeholder="—"${!editable?' readonly':''}>
        </div>
        <div class="ufield">
          <span class="ufield-label" style="color:${avWarn?'var(--erro)':''}">Avarias</span>
          <input class="ufield-input" type="number" min="0" step="1" id="uav-${item.id}" value="${esc(String(av))}" placeholder="—"${!editable?' readonly':''} style="${avWarn?'border-color:var(--erro);color:var(--erro)':''}">
        </div>
        <div class="ufield">
          <span class="ufield-label">Auditoria</span>
          <input class="ufield-input" type="number" min="0" step="1" id="uaud-${item.id}" value="${esc(String(aud))}" placeholder="—"${!editable?' readonly':''}>
        </div>
        ${editable?`<div class="ufield ufield-obs">
          <span class="ufield-label">Observação</span>
          <input class="ufield-input" type="text" id="uobs-${item.id}" value="${esc(obs)}" placeholder="Opcional">
        </div>
        <button class="ufield-save" onclick="saveContagem('${item.id}','${esc(loja)}','${semIso}')">Salvar</button>`:''}
      </div>
    </div>`;
  }).join('');

  return `<div style="font-size:10px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">${semLabel} · ${esc(loja)}</div>${cards}`;
}

function renderContagemMes(loja){
  const semanas=getSemanasDoMes();
  if(!semanas.length) return `<div class="empty-state"><div class="empty-icon">📅</div><div>Sem dados este mês</div></div>`;
  return `<div style="overflow-x:auto">
    <table class="umes-table">
      <thead><tr>
        <th>Utensílio</th>
        ${semanas.map(s=>`<th>${fmtSemanaShort(s)}</th>`).join('')}
      </tr></thead>
      <tbody>
        ${S.utensCatalogo.map(item=>`
          <tr>
            <td title="${esc(item.nome)}">${esc(item.nome)}</td>
            ${semanas.map(s=>{
              const cnt=S.utensContagens[`${item.id}|${loja}|${s}`];
              if(!cnt) return `<td style="color:var(--mut)">—</td>`;
              const av=Number(cnt.avarias)||0;
              return `<td><div style="font-weight:700">${Number(cnt.quantidade_atual)||0}</div>${av>0?`<div style="font-size:9px;color:var(--erro)">⚠️${av}</div>`:''}</td>`;
            }).join('')}
          </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

// ─── UTENSÍLIOS — SALVAR CONTAGEM ────────────────────────
async function saveContagem(catalogoId, loja, semIso){
  const qtdEl=$(`uqtd-${catalogoId}`), avEl=$(`uav-${catalogoId}`);
  const audEl=$(`uaud-${catalogoId}`), obsEl=$(`uobs-${catalogoId}`);
  const qtd=qtdEl?.value; const av=avEl?.value; const aud=audEl?.value; const obs=obsEl?.value||'';
  const body={
    catalogo_id:catalogoId, loja, semana_inicio:semIso,
    quantidade_atual:qtd===''?0:Number(qtd),
    avarias:av===''?0:Number(av),
    auditoria:aud===''?0:Number(aud),
    observacao:obs||null,
    criado_por:S.usuario.nome,
    updated_at:new Date().toISOString(),
  };
  try{
    await sb('gn_utensilios_contagem',{method:'POST',prefer:'resolution=merge-duplicates,return=minimal',body});
    S.utensContagens[`${catalogoId}|${loja}|${semIso}`]=body;
    toast('✅ Salvo!');
  }catch(e){ toast('Erro ao salvar'); }
}

// ─── UTENSÍLIOS — CATÁLOGO CRUD ──────────────────────────
function renderCatalogHTML(){
  const editing=S.utensEditItem;
  const catOpts=['Geral','Cozinha','Mesa','Limpeza','Frigorifico','Outros'];
  const form=`<div class="cat-form">
    <div class="cat-form-title">${editing?'✏️ Editar':'➕ Novo'} Utensílio</div>
    <div class="cat-field">
      <label class="cat-label">Nome *</label>
      <input class="cat-input" id="cat-nome" value="${esc(editing?.nome||'')}" placeholder="Ex: Faca de chef">
    </div>
    <div class="cat-row">
      <div class="cat-field">
        <label class="cat-label">Categoria</label>
        <select class="cat-input" id="cat-cat">${catOpts.map(c=>`<option${editing?.categoria===c?' selected':''}>${c}</option>`).join('')}</select>
      </div>
      <div class="cat-field">
        <label class="cat-label">Unidade</label>
        <input class="cat-input" id="cat-und" value="${esc(editing?.unidade||'un')}" placeholder="un, cx, pc…">
      </div>
    </div>
    <div class="cat-field">
      <label class="cat-label">Qtd. mínima</label>
      <input class="cat-input" type="number" id="cat-min" value="${editing?.estoque_minimo||0}" min="0">
    </div>
    <div class="cat-field">
      <label class="cat-label">Descrição</label>
      <textarea class="cat-input" id="cat-desc" rows="2" placeholder="Detalhes opcionais (opcional)">${esc(editing?.descricao||'')}</textarea>
    </div>
    <div class="cat-field">
      <label class="cat-label">Foto</label>
      ${editing?.foto_base64?`<img src="${editing.foto_base64}" style="width:64px;height:64px;object-fit:cover;border-radius:9px;margin-bottom:8px;display:block">`:'' }
      <input type="file" class="cat-input" id="cat-foto" accept="image/*" capture="environment" style="padding:6px;font-size:12px">
    </div>
    <div class="cat-btn-row">
      <button class="cat-btn sec" onclick="cancelCatEdit()">Cancelar</button>
      <button class="cat-btn pri" onclick="saveCatItem()">Salvar</button>
    </div>
  </div>`;

  const list=S.utensCatalogo.length
    ?S.utensCatalogo.map((item,idx)=>`
      <div class="cat-item">
        ${item.foto_base64
          ?`<img class="cat-item-foto" src="${item.foto_base64}">`
          :`<div class="cat-item-foto">${catIcon(item.categoria)}</div>`}
        <div class="cat-item-info">
          <div class="cat-item-nome">${esc(item.nome)}</div>
          <div class="cat-item-meta">${esc(item.categoria)} · ${esc(item.unidade)} · Mín: ${item.estoque_minimo||0}</div>
        </div>
        <div class="cat-item-actions">
          <button class="cat-item-btn" onclick="editCatItem(${idx})">✏️</button>
          <button class="cat-item-btn del" onclick="deleteCatItem(${idx})">🗑️</button>
        </div>
      </div>`).join('')
    :`<div class="empty-state"><div class="empty-icon">📦</div><div>Nenhum item no catálogo</div></div>`;

  return form+`<div style="font-size:10px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 8px">Itens cadastrados (${S.utensCatalogo.length})</div>`+list;
}

function attachCatalogListeners(){
  const el=document.getElementById('cat-foto');
  if(el) el.addEventListener('change',e=>{
    const file=e.target.files[0]; if(!file) return;
    compressImage(file,b64=>{ S._catFotoB64=b64; });
  });
}

function compressImage(file,callback){
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=320; let w=img.width,h=img.height;
      if(w>h){ if(w>MAX){h=Math.round(h*MAX/w);w=MAX;} }
      else{ if(h>MAX){w=Math.round(w*MAX/h);h=MAX;} }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      callback(cv.toDataURL('image/jpeg',0.75));
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function editCatItem(idx){ S.utensEditItem=S.utensCatalogo[idx]||null; S._catFotoB64=null; renderLista(); }
function cancelCatEdit(){ S.utensEditItem=null; S._catFotoB64=null; renderLista(); }
async function deleteCatItem(idx){
  const item=S.utensCatalogo[idx]; if(!item) return;
  if(!confirm('Excluir "'+item.nome+'"?')) return;
  try{
    await sb('gn_utensilios_catalogo?id=eq.'+item.id,{method:'DELETE'});
    await loadUtensCatalogo(); renderLista(); toast('Excluído!');
  }catch(e){ toast('Erro ao excluir'); }
}

let _savingCat=false;
async function saveCatItem(){
  if(_savingCat) return;
  const nome=(document.getElementById('cat-nome')?.value||'').trim();
  if(!nome){ toast('Nome obrigatório'); return; }
  _savingCat=true;
  const btn=document.querySelector('.cat-btn.pri');
  if(btn){ btn.disabled=true; btn.textContent='Salvando…'; }
  const body={
    nome,
    categoria:document.getElementById('cat-cat')?.value||'Geral',
    unidade:(document.getElementById('cat-und')?.value||'un').trim(),
    estoque_minimo:Number(document.getElementById('cat-min')?.value||0),
    descricao:(document.getElementById('cat-desc')?.value||'').trim()||null,
    foto_base64:S._catFotoB64||(S.utensEditItem?.foto_base64||null),
    atualizado_em:new Date().toISOString(),
  };
  const isEdit=!!S.utensEditItem; const editId=S.utensEditItem?.id;
  try{
    if(isEdit){ await sb(`gn_utensilios_catalogo?id=eq.${editId}`,{method:'PATCH',prefer:'return=minimal',body}); }
    else{ await sb('gn_utensilios_catalogo',{method:'POST',prefer:'return=minimal',body}); }
    S._catFotoB64=null; S.utensEditItem=null;
    await loadUtensCatalogo(); renderLista();
    toast(isEdit?'✅ Atualizado!':'✅ Item criado!');
  }catch(e){ toast('Erro ao salvar: '+e.message); }
  finally{ _savingCat=false; }
}

// ─── RELATÓRIOS ──────────────────────────────────────────
function renderRelatoriosPanel(){
  const base=getItensFiltradosPorLojaEPeriodo();
  const periodoLabel=PERIODOS.find(p=>p.key===S.periodo)?.label||'Período';
  const lojaLabel=isMaster()&&S.lojaFiltro!=='Todas'?S.lojaFiltro:isMaster()?'Todas as lojas':(S.usuario?.loja||'');

  // Totals
  const totalPend=base.filter(m=>scCls(m.status)==='pendente').length;
  const totalAnd=base.filter(m=>scCls(m.status)==='andamento').length;
  const totalRes=base.filter(m=>scCls(m.status)==='resolvido').length;

  // By tipo
  const tipoRows=TIPOS.map(t=>{
    const items=base.filter(m=>(m.tipo||'Estrutura')===t.key);
    if(!items.length) return '';
    const pend=items.filter(m=>scCls(m.status)==='pendente').length;
    const and=items.filter(m=>scCls(m.status)==='andamento').length;
    const res=items.filter(m=>scCls(m.status)==='resolvido').length;
    return `<div class="relat-tipo-row">
      <span class="relat-tipo-icon">${t.icon}</span>
      <span class="relat-tipo-label">${esc(t.key)}</span>
      <div class="relat-tipo-badges">
        ${pend>0?`<span class="rbadge pend">⏳ ${pend}</span>`:''}
        ${and>0?`<span class="rbadge and">🔄 ${and}</span>`:''}
        ${res>0?`<span class="rbadge res">✅ ${res}</span>`:''}
        ${!pend&&!and&&!res?`<span class="rbadge res">✅ 0</span>`:''}
      </div>
    </div>`;
  }).filter(Boolean).join('');

  // By loja (master, all lojas)
  let lojaSection='';
  if(isMaster()&&S.lojaFiltro==='Todas'&&base.length){
    const porLoja={};
    base.forEach(m=>{
      if(!porLoja[m._loja]) porLoja[m._loja]={pend:0,and:0,res:0};
      const sc=scCls(m.status);
      if(sc==='pendente') porLoja[m._loja].pend++;
      else if(sc==='andamento') porLoja[m._loja].and++;
      else porLoja[m._loja].res++;
    });
    const lojaRows=Object.entries(porLoja)
      .sort((a,b)=>b[1].pend-a[1].pend)
      .map(([l,d])=>`<div class="relat-loja-row">
        <span class="relat-loja-name">${esc(l)}</span>
        <div style="display:flex;gap:4px">
          ${d.pend>0?`<span class="rbadge pend">⏳ ${d.pend}</span>`:''}
          ${d.and>0?`<span class="rbadge and">🔄 ${d.and}</span>`:''}
          ${d.res>0?`<span class="rbadge res">✅ ${d.res}</span>`:''}
        </div>
      </div>`).join('');
    lojaSection=`<div class="relat-card">
      <div class="relat-card-title">🏪 Por Loja</div>
      ${lojaRows}
    </div>`;
  }

  $('lista').innerHTML=`<div class="relat-wrap">
    <div style="font-size:11px;color:var(--mut);font-weight:700;text-align:center;padding:4px 0 12px;letter-spacing:.3px">${esc(periodoLabel)} · ${esc(lojaLabel)}</div>
    <div class="relat-summary-grid">
      <div class="relat-summary-cell">
        <div class="relat-summary-val" style="color:var(--erro)">${totalPend}</div>
        <div class="relat-summary-lab">Pendentes</div>
      </div>
      <div class="relat-summary-cell">
        <div class="relat-summary-val" style="color:var(--warn)">${totalAnd}</div>
        <div class="relat-summary-lab">Andamento</div>
      </div>
      <div class="relat-summary-cell">
        <div class="relat-summary-val" style="color:var(--ok)">${totalRes}</div>
        <div class="relat-summary-lab">Resolvidos</div>
      </div>
    </div>
    <div class="relat-card">
      <div class="relat-card-title">🔧 Por Categoria</div>
      ${tipoRows||`<div style="color:var(--mut);font-size:12px;text-align:center;padding:12px 0">Nenhum registro neste período</div>`}
    </div>
    ${lojaSection}
    <button class="wpp-btn" onclick="gerarRelatorioWpp()">
      <span style="font-size:18px">📤</span> Compartilhar via WhatsApp
    </button>
  </div>`;
}

function gerarRelatorioWpp(){
  const base=getItensFiltradosPorLojaEPeriodo();
  const periodoLabel=PERIODOS.find(p=>p.key===S.periodo)?.label||'Período';
  const lojaLabel=isMaster()&&S.lojaFiltro!=='Todas'?S.lojaFiltro:isMaster()?'Todas as lojas':(S.usuario?.loja||'');
  const hoje=new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
  const totalPend=base.filter(m=>scCls(m.status)==='pendente').length;
  const totalAnd=base.filter(m=>scCls(m.status)==='andamento').length;
  const totalRes=base.filter(m=>scCls(m.status)==='resolvido').length;

  let txt=`🔧 *GN Manutenção — Relatório*\n`;
  txt+=`📅 ${periodoLabel} · ${lojaLabel}\n`;
  txt+=`📆 Gerado em ${hoje}\n\n`;
  txt+=`📊 *Resumo*\n`;
  txt+=`⏳ Pendentes: *${totalPend}*\n`;
  txt+=`🔄 Em andamento: *${totalAnd}*\n`;
  txt+=`✅ Resolvidos: *${totalRes}*\n`;
  txt+=`📁 Total: *${base.length}*\n\n`;

  txt+=`🔧 *Por Categoria*\n`;
  TIPOS.forEach(t=>{
    const items=base.filter(m=>(m.tipo||'Estrutura')===t.key);
    if(!items.length) return;
    const pend=items.filter(m=>scCls(m.status)==='pendente').length;
    const and=items.filter(m=>scCls(m.status)==='andamento').length;
    const res=items.filter(m=>scCls(m.status)==='resolvido').length;
    txt+=`${t.icon} ${t.key}: `;
    const parts=[];
    if(pend) parts.push(`${pend} pend.`);
    if(and) parts.push(`${and} and.`);
    if(res) parts.push(`${res} res.`);
    txt+=parts.join(', ')+'\n';
  });

  if(isMaster()&&S.lojaFiltro==='Todas'&&base.length){
    const porLoja={};
    base.filter(m=>scCls(m.status)==='pendente').forEach(m=>{
      porLoja[m._loja]=(porLoja[m._loja]||0)+1;
    });
    const pendLojas=Object.entries(porLoja).sort((a,b)=>b[1]-a[1]).filter(([,n])=>n>0);
    if(pendLojas.length){
      txt+=`\n⚠️ *Pendentes por loja*\n`;
      pendLojas.forEach(([l,n])=>{ txt+=`• ${l}: ${n} pendente${n>1?'s':''}\n`; });
    }
  }

  txt+=`\n_Gerado via GN Manutenção_`;

  if(navigator.share&&navigator.canShare({text:txt})){
    navigator.share({text:txt}).catch(()=>window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank'));
  } else {
    window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
  }
}

function doLogout(){
  try{ localStorage.removeItem(SESSION_KEY); }catch(_){}
  S.usuario=null; S.itens=[]; S.utensLoaded=false;
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
  $('ln-user').value=''; $('ln-pass').value=''; $('ln-err').textContent='';
  setTimeout(()=>$('ln-user').focus(),100);
}

// ─── INIT ─────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded',()=>{
  $('ln-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  iniciarApp();
});
