<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>GN Manutenção</title>
<style>
:root {
  --bg:      #0D0D1A;
  --card:    #15152b;
  --card2:   #1e1e3a;
  --laranja: #E8580A;
  --ouro:    #F5D98A;
  --ok:      #3ecf8e;
  --erro:    #ff5a6e;
  --mut:     #8f8fb0;
  --warn:    #f0c050;
  --azul:    #4dabf7;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:#e8e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}

/* LOGIN */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{background:var(--card);border-radius:16px;padding:32px 24px;width:100%;max-width:360px}
.login-logo{text-align:center;font-size:40px;margin-bottom:4px}
.login-title{text-align:center;font-size:20px;font-weight:800;color:var(--ouro);margin-bottom:2px}
.login-sub{text-align:center;font-size:11px;color:var(--mut);margin-bottom:24px;letter-spacing:.3px}
.login-input{width:100%;background:var(--card2);border:1px solid #2a2a4a;color:#e8e8f0;border-radius:8px;padding:11px 13px;font-size:14px;font-family:inherit;margin-bottom:10px}
.login-input:focus{outline:none;border-color:var(--laranja)}
.login-btn{width:100%;background:var(--laranja);color:#fff;border:none;border-radius:8px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.login-btn:active{opacity:.85}
.login-err{color:var(--erro);font-size:12px;text-align:center;margin-top:8px;min-height:18px}

/* LAYOUT */
.hidden{display:none!important}
.hdr{background:var(--card);padding:11px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--card2)}
.hdr-title{font-size:15px;font-weight:800;color:var(--ouro)}
.hdr-sub{font-size:10px;color:var(--mut);margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:8px}
.hdr-user{font-size:10px;color:var(--mut);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-ref{background:var(--card2);border:1px solid #2a2a4a;color:var(--mut);border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit}

/* ALERT BANNER */
.alert-banner{background:#2a0808;border:1px solid var(--erro);border-radius:8px;padding:10px 14px;margin:10px 14px 0;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--erro);font-weight:700}
.alert-banner button{margin-left:auto;background:none;border:none;color:var(--mut);cursor:pointer;font-size:16px;line-height:1;padding:0 2px}

/* FILTROS */
.filtros-wrap{background:var(--bg);border-bottom:1px solid var(--card2);padding:8px 0 0}
.filtro-label{font-size:9px;font-weight:700;color:var(--mut);letter-spacing:1px;text-transform:uppercase;padding:0 14px 5px;display:block}
.filtro-row{display:flex;overflow-x:auto;gap:6px;padding:0 14px 8px;scrollbar-width:none;-ms-overflow-style:none}
.filtro-row::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;background:var(--card2);border:1px solid #2a2a4a;color:var(--mut);border-radius:99px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .15s}
.chip:active{opacity:.7}
.chip.sel{background:var(--laranja);border-color:var(--laranja);color:#fff}
.chip.loja-chip.sel{background:#1a1a3a;border-color:var(--ouro);color:var(--ouro)}

/* BOTTOM NAV */
.bot-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--card2);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom,0)}
.bot-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7px 2px 8px;cursor:pointer;font-size:9px;font-weight:700;color:var(--mut);letter-spacing:.3px;text-transform:uppercase;gap:2px;transition:color .15s;position:relative;border:none;background:none;font-family:inherit}
.bot-tab.sel{color:var(--ouro)}
.bot-tab .ti{font-size:18px;line-height:1}
.bot-tab .bdg{position:absolute;top:4px;right:calc(50% - 14px);background:var(--erro);color:#fff;border-radius:99px;font-size:8px;padding:0 4px;font-weight:800;min-width:14px;text-align:center;line-height:14px}
.bot-sep{width:1px;background:var(--card2);align-self:stretch;margin:10px 0}

/* ITEMS */
.items{display:flex;flex-direction:column;gap:10px;padding:10px 14px 90px}
.icard{background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--card2);border-left-width:3px;border-left-color:var(--card2)}
.icard.pendente{border-left-color:var(--erro)}
.icard.andamento{border-left-color:var(--warn)}
.icard.resolvido{border-left-color:var(--ok);opacity:.72}
.icard.resolvido:hover{opacity:1}
.ihead{padding:10px 12px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ibadges{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.btipo{font-size:10px;font-weight:700;padding:2px 9px;border-radius:99px;background:#1a1a3a}
.bstatus{font-size:10px;font-weight:700;padding:2px 9px;border-radius:99px}
.bstatus.pendente{background:#2a080e;color:var(--erro)}
.bstatus.andamento{background:#1e1e0a;color:var(--warn)}
.bstatus.resolvido{background:#0a2818;color:var(--ok)}
.imeta{font-size:10px;color:var(--mut);white-space:nowrap}
.ibody{padding:7px 12px 10px;display:flex;flex-direction:column;gap:4px}
.iloja{font-size:13px;font-weight:700}
.isetor{font-size:10px;color:var(--mut)}
.idesc{font-size:12px;color:#c0c0d8;line-height:1.45}
.icontato{font-size:11px;color:var(--azul)}
.foto-thumb{width:64px;height:64px;object-fit:cover;border-radius:7px;cursor:pointer;margin-top:4px}
.iactions{padding:8px 12px 10px;display:flex;gap:7px;border-top:1px solid var(--card2);align-items:center}
.status-sel{flex:1;background:var(--card2);border:1px solid #2a2a4a;color:#e8e8f0;border-radius:6px;padding:6px 8px;font-size:12px;font-family:inherit}
.btn-save{background:var(--laranja);color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-save:active{opacity:.8}

.empty-state{text-align:center;padding:60px 20px;color:var(--mut)}
.empty-icon{font-size:40px;margin-bottom:8px}

/* Resumo de alerta persistente no topo */
.pend-badge{background:#2a0808;border:1px solid #5a1010;border-radius:8px;margin:10px 14px 0;padding:8px 14px;display:flex;align-items:center;gap:8px;font-size:12px}
.pend-badge .pn{color:var(--erro);font-size:20px;font-weight:900}
.pend-badge .pt{flex:1;color:#e8a0a0;font-size:11px;line-height:1.35}

#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 18px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:999;white-space:nowrap}
#toast.show{opacity:1}

/* ── DESKTOP SIDEBAR ───────────────────────────── */
#sidebar-nav { display: none; }
@media (min-width: 768px) {
  body { padding-left: 224px; }
  .bot-nav { display: none !important; }
  #sidebar-nav {
    display: flex; flex-direction: column;
    position: fixed; top: 0; left: 0; bottom: 0; width: 224px;
    background: var(--card); border-right: 1px solid var(--card2);
    overflow-y: auto; z-index: 50; padding-bottom: 16px;
  }
  .sidebar-brand {
    padding: 14px 14px 10px; border-bottom: 1px solid var(--card2);
    margin-bottom: 6px; display: flex; align-items: center;
    gap: 10px; flex-shrink: 0;
  }
  .sidebar-section {
    font-size: 9px; font-weight: 700; letter-spacing: .8px;
    text-transform: uppercase; color: var(--mut); padding: 10px 14px 4px;
  }
  .sidebar-link {
    display: flex; align-items: center; gap: 9px;
    padding: 8px 14px; font-size: 13px; font-weight: 500;
    color: var(--mut); text-align: left; width: 100%;
    border-left: 3px solid transparent;
    transition: color .12s, background .12s; background: none; border-top: none; border-right: none; border-bottom: none;
  }
  .sidebar-link:hover { color: var(--txt); background: var(--card2); }
  .sidebar-link.active { color: var(--ouro); background: rgba(245,217,138,.10); border-left-color: var(--ouro); font-weight: 600; }
  .sidebar-link .sl-icon { width: 20px; font-size: 14px; line-height: 1; text-align: center; flex-shrink: 0; }
}
</style>
</head>
<body>

<nav id="sidebar-nav" aria-label="Navegação">
  <div class="sidebar-brand">
    <div style="width:30px;height:30px;background:var(--laranja);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;">🔧</div>
    <div>
      <div style="font-size:13px;font-weight:800;color:var(--txt);">GN Manutenção</div>
      <div style="font-size:10px;color:var(--mut);" id="sidebar-loja"></div>
    </div>
  </div>
  <div class="sidebar-section">Categorias</div>
  <button class="sidebar-link active" data-sidebar-tab="Estrutura" onclick="setFiltro('Estrutura')"><span class="sl-icon">🏗️</span>Estrutura</button>
  <button class="sidebar-link" data-sidebar-tab="Ar Condicionado" onclick="setFiltro('Ar Condicionado')"><span class="sl-icon">❄️</span>Ar Condicionado</button>
  <button class="sidebar-link" data-sidebar-tab="Fogão/Fritadeira" onclick="setFiltro('Fogão/Fritadeira')"><span class="sl-icon">🔥</span>Fogão/Fritadeira</button>
  <button class="sidebar-link" data-sidebar-tab="Elevador" onclick="setFiltro('Elevador')"><span class="sl-icon">🛗</span>Elevador</button>
  <button class="sidebar-link" data-sidebar-tab="Exaustor" onclick="setFiltro('Exaustor')"><span class="sl-icon">💨</span>Exaustor</button>
  <button class="sidebar-link" data-sidebar-tab="Informática" onclick="setFiltro('Informática')"><span class="sl-icon">💻</span>Informática</button>
  <button class="sidebar-link" data-sidebar-tab="Outro" onclick="setFiltro('Outro')"><span class="sl-icon">🔧</span>Outro</button>
</nav>

<!-- LOGIN -->
<div id="login" class="login-wrap">
  <div class="login-card">
    <div class="login-logo">🔧</div>
    <div class="login-title">GN Manutenção</div>
    <div class="login-sub">Gestão de manutenções das lojas</div>
    <input class="login-input" id="ln-user" type="text" autocomplete="username" placeholder="Usuário"
      onkeydown="if(event.key==='Enter')$('ln-pass').focus()">
    <input class="login-input" id="ln-pass" type="password" autocomplete="current-password" placeholder="Senha"
      onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">Entrar</button>
    <div class="login-err" id="ln-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div class="hdr">
    <div>
      <div class="hdr-title">🔧 GN Manutenção</div>
      <div class="hdr-sub" id="hdr-sub">—</div>
    </div>
    <div class="hdr-right">
      <span class="hdr-user" id="hdr-user"></span>
      <button class="btn-ref" id="btnRef" onclick="carregarDados()">🔄</button>
    </div>
  </div>

  <!-- FILTROS (loja + período) -->
  <div id="filtros-wrap" class="filtros-wrap hidden">
    <div id="loja-row-wrap" class="hidden">
      <span class="filtro-label">Loja</span>
      <div class="filtro-row" id="loja-row"></div>
    </div>
    <span class="filtro-label">Período</span>
    <div class="filtro-row" id="periodo-row"></div>
  </div>

  <!-- ALERTA DE NOVIDADES -->
  <div id="alertBanner" class="hidden alert-banner"></div>

  <!-- BADGE PENDENTES FIXO -->
  <div id="pendBadge" class="hidden pend-badge">
    <div class="pn" id="pendNum">0</div>
    <div class="pt" id="pendTxt"></div>
  </div>

  <div class="items" id="lista"></div>

  <!-- BOTTOM NAV -->
  <nav class="bot-nav" id="botNav"></nav>
</div>

<div id="toast"></div>

<script>
const SB_URL = 'https://ncxttwvpafajnilpjbol.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jeHR0d3ZwYWZham5pbHBqYm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4NDcyMDEsImV4cCI6MjA5NzQyMzIwMX0.MGDZNGY8GfSzBKAgdR7OhvOeR71i4fj9YseJRhoh5sE';
const SESSION_KEY = 'gn_manut_v1';

const TIPOS = [
  { key:'Estrutura',        icon:'🏗️', cor:'#5c8cf5' },
  { key:'Ar Condicionado',  icon:'❄️', cor:'#4dabf7' },
  { key:'Fogão/Fritadeira', icon:'🔥', cor:'#ff8c69' },
  { key:'Elevador',         icon:'🛗', cor:'#a78bfa' },
  { key:'Exaustor',         icon:'💨', cor:'#38d9a9' },
  { key:'Informática',      icon:'💻', cor:'#34c7f5' },
  { key:'Outro',            icon:'🔧', cor:'#8f8fb0' },
];

const LOJAS_LISTA = [
  'Bangu','Caxias','São Gonçalo','Norte Shopping','Boulevard',
  'Rancho','Pedreira','Nova América','Campo Grande','Itaquera','Guarulhos'
];

const PERIODOS = [
  { key:'semana',     label:'Esta semana' },
  { key:'semana_ant', label:'Sem. passada' },
  { key:'mes',        label:'Este mês' },
  { key:'30d',        label:'30 dias' },
];

const S = {
  usuario:     null,
  itens:       [],
  filtro:      'Estrutura', // filtro por tipo (bottom nav)
  lojaFiltro:  'Todas',    // filtro por loja (chips)
  periodo:     '30d',      // filtro de período
};

function $(id){ return document.getElementById(id); }
function isMaster(){ return ['mestre','supervisor','compras'].includes(S.usuario?.cargo||''); }

async function sb(path, opts={}) {
  const h = { apikey:SB_KEY, Authorization:'Bearer '+SB_KEY, 'Content-Type':'application/json' };
  if (opts.prefer) h['Prefer'] = opts.prefer;
  const r = await fetch(`${SB_URL}/rest/v1/${path}`, { method:opts.method||'GET', headers:h, body:opts.body?JSON.stringify(opts.body):undefined });
  if (!r.ok) { const t=await r.text(); throw new Error(t); }
  if (r.status===204) return [];
  return r.json();
}

function toast(msg){ const e=$('toast'); e.textContent=msg; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),2200); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtData(iso){ if(!iso)return'—'; const[y,m,d]=iso.split('-'); return`${d}/${m}/${y}`; }
function tipoInfo(k){ return TIPOS.find(t=>t.key===k)||TIPOS[TIPOS.length-1]; }
function scCls(s){ if(s==='Resolvido')return'resolvido'; if(s==='Em andamento')return'andamento'; return'pendente'; }

// ─── PERÍODO ─────────────────────────────────────────────
function getPeriodoDates() {
  const hoje = new Date();
  const toISO = d => d.toISOString().split('T')[0];
  const getMon = d => { const c=new Date(d); const dw=c.getDay(); c.setDate(c.getDate()-(dw===0?6:dw-1)); return c; };

  if (S.periodo === 'semana') {
    return { from: toISO(getMon(hoje)), to: toISO(hoje) };
  }
  if (S.periodo === 'semana_ant') {
    const lm = getMon(hoje); lm.setDate(lm.getDate()-7);
    const ls = new Date(lm); ls.setDate(lm.getDate()+6);
    return { from: toISO(lm), to: toISO(ls) };
  }
  if (S.periodo === 'mes') {
    return { from: toISO(new Date(hoje.getFullYear(), hoje.getMonth(), 1)), to: toISO(hoje) };
  }
  // 30d
  const d30 = new Date(hoje); d30.setDate(hoje.getDate()-30);
  return { from: toISO(d30), to: toISO(hoje) };
}

// ─── LOGIN ───────────────────────────────────────────────
async function doLogin(){
  const nome=$('ln-user').value.trim(), senha=$('ln-pass').value;
  const err=$('ln-err'); err.textContent='';
  if(!nome||!senha){ err.textContent='Preencha usuário e senha.'; return; }
  try{
    const rows = await sb(`gn_usuarios?nome=ilike.${encodeURIComponent(nome)}&senha=eq.${encodeURIComponent(senha)}&ativo=eq.true&select=nome,cargo,loja,permissoes`);
    if(!rows.length){ err.textContent='Usuário ou senha inválidos.'; return; }
    const u=rows[0];
    const p=u.permissoes||{};
    const ok=['mestre','supervisor','compras'].includes(u.cargo)?p.manutencao!==false:!!p.manutencao;
    if(!ok){ err.textContent='Sem permissão para acessar GN Manutenção.'; return; }
    S.usuario=u;
    try{ localStorage.setItem(SESSION_KEY,JSON.stringify({...u,ts:Date.now()})); }catch(_){}
    iniciarApp();
  }catch(e){ err.textContent='Erro de conexão.'; }
}

async function iniciarApp(){
  if(!S.usuario){
    try{
      const s=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');
      if(s&&Date.now()-s.ts<86400000*7) S.usuario=s;
    }catch(_){}
  }
  if(!S.usuario) return;
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('hdr-user').textContent=S.usuario.nome;
  // Para não-master, pre-selecionamos a loja do usuário e não mostramos seletor
  if(!isMaster()) S.lojaFiltro = S.usuario.loja || 'Todas';
  pedirPermissaoNotif();
  await carregarDados();
  setInterval(carregarDados, 120000);
}

// ─── DADOS ───────────────────────────────────────────────
let _lastIds = new Set();

async function carregarDados(){
  $('btnRef').textContent='⏳';
  // Sempre busca 30 dias completos para alertas globais funcionarem
  const d=new Date(); d.setDate(d.getDate()-30);
  const from=d.toISOString().split('T')[0];
  try{
    const rows = await sb(`checklist_diario?select=data_operacao,loja,manutencao&data_operacao=gte.${from}&order=data_operacao.desc`);
    const itens=[];
    for(const row of rows){
      if(!Array.isArray(row.manutencao)||!row.manutencao.length) continue;
      for(const m of row.manutencao){
        itens.push({...m, _loja:row.loja, _data:row.data_operacao});
      }
    }
    verificarNovos(itens);
    S.itens=itens;
    const tot=itens.length, pend=itens.filter(m=>m.status!=='Resolvido').length;
    const hr=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    $('hdr-sub').textContent=`${tot} registro${tot!==1?'s':''} · ${pend} pendente${pend!==1?'s':''} · ${hr}`;
    atualizarTituloTab(pend);
    renderFiltros();
    renderBotNav();
    renderPendBadge();
    renderLista();
  }catch(e){ toast('Erro ao carregar'); }
  $('btnRef').textContent='🔄';
}

// ─── ALERTAS ─────────────────────────────────────────────
function verificarNovos(itens){
  const pendIds = new Set(itens.filter(m=>m.status!=='Resolvido').map(m=>`${m._loja}:${m._data}:${m.id}`));
  const novosPend=[...pendIds].filter(id=>!_lastIds.has(id));
  const primeiroLoad = _lastIds.size===0;
  _lastIds=pendIds;
  if(primeiroLoad||!novosPend.length) return;
  const n=novosPend.length;
  const msg=`🚨 ${n} nova${n>1?'s':''} manutenção${n>1?'ões':''} pendente${n>1?'s':''}`;
  mostrarAlerta(msg);
  enviarNotif(msg);
  tocarAlerta();
}

function mostrarAlerta(msg){
  const b=$('alertBanner');
  b.classList.remove('hidden');
  b.innerHTML=`<span>🚨</span><span style="flex:1">${esc(msg)}</span><button onclick="fecharAlerta()">✕</button>`;
  setTimeout(fecharAlerta, 15000);
}
function fecharAlerta(){ $('alertBanner').classList.add('hidden'); }

function atualizarTituloTab(pend){
  document.title = pend > 0 ? `(${pend}) GN Manutenção` : 'GN Manutenção';
}

function renderPendBadge(){
  const pend = S.itens.filter(m=>m.status!=='Resolvido').length;
  const badge = $('pendBadge');
  if(pend === 0){ badge.classList.add('hidden'); return; }
  badge.classList.remove('hidden');
  $('pendNum').textContent = pend;
  // Agrupa por loja
  const porLoja = {};
  S.itens.filter(m=>m.status!=='Resolvido').forEach(m=>{
    porLoja[m._loja] = (porLoja[m._loja]||0)+1;
  });
  const resumo = Object.entries(porLoja)
    .sort((a,b)=>b[1]-a[1])
    .map(([l,n])=>`${l}: ${n}`)
    .join(' · ');
  $('pendTxt').textContent = `pendente${pend>1?'s':''} · ${resumo}`;
}

function pedirPermissaoNotif(){
  if('Notification'in window&&Notification.permission==='default') Notification.requestPermission();
}
function enviarNotif(msg){
  if('Notification'in window&&Notification.permission==='granted')
    new Notification('🔧 GN Manutenção',{body:msg,icon:'/favicon.ico'});
}
function tocarAlerta(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [0,0.2,0.4].forEach(t=>{
      const osc=ctx.createOscillator(), g=ctx.createGain();
      osc.connect(g); g.connect(ctx.destination);
      osc.type='sine'; osc.frequency.value=880;
      g.gain.setValueAtTime(0.3,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+t+0.18);
      osc.start(ctx.currentTime+t); osc.stop(ctx.currentTime+t+0.18);
    });
    setTimeout(()=>ctx.close(),1000);
  }catch(_){}
  if(navigator.vibrate) navigator.vibrate([200,80,200,80,300]);
}

// ─── FILTROS ─────────────────────────────────────────────
function renderFiltros(){
  $('filtros-wrap').classList.remove('hidden');

  // Loja chips: só para master
  const lojaRowWrap = $('loja-row-wrap');
  if(isMaster()){
    lojaRowWrap.classList.remove('hidden');
    const lojas = ['Todas', ...LOJAS_LISTA];
    $('loja-row').innerHTML = lojas.map(l =>
      `<button class="chip loja-chip${S.lojaFiltro===l?' sel':''}" onclick="setLojaFiltro(${esc(JSON.stringify(l))})">${esc(l)}</button>`
    ).join('');
  } else {
    lojaRowWrap.classList.add('hidden');
  }

  // Período chips
  $('periodo-row').innerHTML = PERIODOS.map(p =>
    `<button class="chip${S.periodo===p.key?' sel':''}" onclick="setPeriodo('${p.key}')">${p.label}</button>`
  ).join('');
}

function setLojaFiltro(l){ S.lojaFiltro=l; renderFiltros(); renderBotNav(); renderPendBadge(); renderLista(); }
function setPeriodo(p){ S.periodo=p; renderFiltros(); renderBotNav(); renderLista(); }

// ─── RODAPÉ ──────────────────────────────────────────────
function getItensFiltradosPorLojaEPeriodo(){
  const {from,to}=getPeriodoDates();
  let items=S.itens.filter(m=>m._data>=from&&m._data<=to);
  if(!isMaster()) items=items.filter(m=>m._loja===S.usuario.loja);
  else if(S.lojaFiltro!=='Todas') items=items.filter(m=>m._loja===S.lojaFiltro);
  return items;
}

function renderBotNav(){
  const base=getItensFiltradosPorLojaEPeriodo();
  const abas=TIPOS.map(t=>({
    key:t.key, icon:t.icon, label:t.key.split('/')[0],
    pend:base.filter(m=>(m.tipo||'Estrutura')===t.key&&m.status!=='Resolvido').length,
  }));
  // Se o filtro atual for 'Todos' (valor padrão antigo), muda para o primeiro tipo
  if(S.filtro==='Todos') S.filtro=TIPOS[0].key;
  $('botNav').innerHTML=abas.map((a,i)=>{
    const sel=S.filtro===a.key;
    return `${i>0?'<div class="bot-sep"></div>':''}
    <button class="bot-tab${sel?' sel':''}" onclick="setFiltro('${a.key}')">
      <span class="ti">${a.icon}</span>
      <span>${a.label}</span>
      ${a.pend>0?`<span class="bdg">${a.pend}</span>`:''}
    </button>`;
  }).join('');
}

function setFiltro(f){
  S.filtro=f;
  document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
  const sl = document.querySelector(`.sidebar-link[data-sidebar-tab="${f}"]`);
  if (sl) sl.classList.add('active');
  renderBotNav(); renderLista();
}

function renderLista(){
  let items=getItensFiltradosPorLojaEPeriodo();
  items=items.filter(m=>(m.tipo||'Estrutura')===S.filtro);
  const ord={pendente:0,andamento:1,resolvido:2};
  items=[...items].sort((a,b)=>{
    const da=ord[scCls(a.status)],db=ord[scCls(b.status)];
    if(da!==db) return da-db;
    return (b._data||'').localeCompare(a._data||'');
  });
  if(!items.length){
    const {from,to}=getPeriodoDates();
    const periodoLabel=PERIODOS.find(p=>p.key===S.periodo)?.label||'período';
    $('lista').innerHTML=`<div class="empty-state"><div class="empty-icon">✅</div><div>Nenhuma manutenção neste tipo em ${periodoLabel}${S.lojaFiltro!=='Todas'?' · '+esc(S.lojaFiltro):''}</div></div>`;
    return;
  }
  $('lista').innerHTML=items.map(m=>{
    const tipo=m.tipo||'Estrutura';
    const ti=tipoInfo(tipo);
    const sc=scCls(m.status);
    const statusLabel=m.status==='Em andamento'?'🔄 Em andamento':m.status==='Resolvido'?'✅ Resolvido':'⏳ Pendente';
    const confirBadge=m.confirmado_loja
      ?`<span class="bstatus resolvido" style="background:#0a2818;color:#5cb85c;">✅ Conf. pela loja</span>`
      :m.status==='Resolvido'
        ?`<span class="bstatus andamento" style="background:#1a1a08;color:#f0c050;">⏳ Aguard. conf. loja</span>`
        :'';
    return `<div class="icard ${sc}">
      <div class="ihead">
        <div class="ibadges">
          <span class="btipo" style="color:${ti.cor}">${ti.icon} ${esc(tipo)}</span>
          <span class="bstatus ${sc}">${statusLabel}</span>
          ${confirBadge}
        </div>
        <span class="imeta">${fmtData(m._data)}</span>
      </div>
      <div class="ibody">
        <div class="iloja">${esc(m._loja||'—')}</div>
        <div class="isetor">Setor: ${esc(m.setor||'—')}</div>
        ${m.descricao?`<div class="idesc">${esc(m.descricao)}</div>`:''}
        ${m.contato?`<div class="icontato">📞 ${esc(m.contato)}</div>`:''}
        ${m.fotoBase64?`<img class="foto-thumb" src="${m.fotoBase64}" onclick="this.requestFullscreen&&this.requestFullscreen()" title="Ver foto">`:''}
      </div>
      <div class="iactions">
        <select class="status-sel" id="sel-${m.id}">
          <option value="Pendente" ${m.status==='Pendente'?'selected':''}>⏳ Pendente</option>
          <option value="Em andamento" ${m.status==='Em andamento'?'selected':''}>🔄 Em andamento</option>
          <option value="Resolvido" ${m.status==='Resolvido'?'selected':''}>✅ Resolvido</option>
        </select>
        <button class="btn-save" onclick="salvarStatus(${esc(JSON.stringify(m._loja))},${esc(JSON.stringify(m._data))},${esc(JSON.stringify(String(m.id)))})">Salvar</button>
      </div>
    </div>`;
  }).join('');
}

// ─── STATUS UPDATE ────────────────────────────────────────
async function salvarStatus(loja, data, itemId){
  const sel=$(`sel-${itemId}`); if(!sel) return;
  const novoStatus=sel.value;
  try{
    const rows=await sb(`checklist_diario?data_operacao=eq.${data}&loja=eq.${encodeURIComponent(loja)}&select=manutencao`);
    if(!rows.length){ toast('Registro não encontrado'); return; }
    const arr=Array.isArray(rows[0].manutencao)?rows[0].manutencao:[];
    const idx=arr.findIndex(m=>String(m.id)===String(itemId));
    if(idx<0){ toast('Item não encontrado'); return; }
    arr[idx].status=novoStatus;
    await sb(`checklist_diario?data_operacao=eq.${data}&loja=eq.${encodeURIComponent(loja)}`,{
      method:'PATCH', prefer:'return=minimal', body:{manutencao:arr}
    });
    const local=S.itens.find(m=>String(m.id)===String(itemId)&&m._loja===loja&&m._data===data);
    if(local) local.status=novoStatus;
    _lastIds=new Set(S.itens.filter(m=>m.status!=='Resolvido').map(m=>`${m._loja}:${m._data}:${m.id}`));
    atualizarTituloTab(S.itens.filter(m=>m.status!=='Resolvido').length);
    renderBotNav(); renderPendBadge(); renderLista();
    toast('Status atualizado!');
  }catch(e){ toast('Erro ao salvar'); }
}

document.addEventListener('DOMContentLoaded',()=>{
  $('ln-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  iniciarApp();
});
