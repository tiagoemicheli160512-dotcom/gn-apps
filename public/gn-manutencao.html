<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>GN Manutenção</title>
<style>
:root {
  --bg:    #0D0D1A;
  --card:  #15152b;
  --card2: #1e1e3a;
  --laranja: #E8580A;
  --ouro:  #F5D98A;
  --ok:    #3ecf8e;
  --erro:  #ff5a6e;
  --mut:   #8f8fb0;
  --warn:  #f0c050;
  --azul:  #4dabf7;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:#e8e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}

/* LOGIN */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{background:var(--card);border-radius:16px;padding:32px 24px;width:100%;max-width:360px}
.login-logo{text-align:center;font-size:40px;margin-bottom:4px}
.login-title{text-align:center;font-size:20px;font-weight:800;color:var(--ouro);margin-bottom:2px}
.login-sub{text-align:center;font-size:11px;color:var(--mut);margin-bottom:24px;letter-spacing:.3px}
.login-input{width:100%;background:var(--card2);border:1px solid #2a2a4a;color:#e8e8f0;border-radius:8px;padding:11px 13px;font-size:14px;font-family:inherit;margin-bottom:10px}
.login-input:focus{outline:none;border-color:var(--laranja)}
.login-btn{width:100%;background:var(--laranja);color:#fff;border:none;border-radius:8px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.login-btn:active{opacity:.85}
.login-err{color:var(--erro);font-size:12px;text-align:center;margin-top:8px;min-height:18px}

/* LAYOUT */
.hidden{display:none!important}
.hdr{background:var(--card);padding:11px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--card2)}
.hdr-title{font-size:15px;font-weight:800;color:var(--ouro)}
.hdr-sub{font-size:10px;color:var(--mut);margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:8px}
.hdr-user{font-size:10px;color:var(--mut)}
.btn-ref{background:var(--card2);border:1px solid #2a2a4a;color:var(--mut);border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit}

/* ALERT BANNER */
.alert-banner{background:#2a0808;border:1px solid var(--erro);border-radius:8px;padding:10px 14px;margin:10px 14px 0;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--erro);font-weight:700}
.alert-banner button{margin-left:auto;background:none;border:none;color:var(--mut);cursor:pointer;font-size:16px;line-height:1}

/* BOTTOM NAV (rodapé) */
.bot-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--card2);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom,0)}
.bot-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7px 2px 8px;cursor:pointer;font-size:9px;font-weight:700;color:var(--mut);letter-spacing:.3px;text-transform:uppercase;gap:2px;transition:color .15s;position:relative;border:none;background:none;font-family:inherit}
.bot-tab.sel{color:var(--ouro)}
.bot-tab .ti{font-size:18px;line-height:1}
.bot-tab .bdg{position:absolute;top:4px;right:calc(50% - 14px);background:var(--erro);color:#fff;border-radius:99px;font-size:8px;padding:0 4px;font-weight:800;min-width:14px;text-align:center;line-height:14px}
.bot-sep{width:1px;background:var(--card2);align-self:stretch;margin:10px 0}

/* ITEMS */
.items{display:flex;flex-direction:column;gap:10px;padding:4px 14px 86px}
.icard{background:var(--card);border-radius:12px;overflow:hidden;border-left:3px solid var(--card2);border:1px solid var(--card2);border-left-width:3px}
.icard.pendente{border-left-color:var(--erro)}
.icard.andamento{border-left-color:var(--warn)}
.icard.resolvido{border-left-color:var(--ok);opacity:.72}
.icard.resolvido:hover{opacity:1}
.ihead{padding:10px 12px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ibadges{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.btipo{font-size:10px;font-weight:700;padding:2px 9px;border-radius:99px;background:#1a1a3a}
.bstatus{font-size:10px;font-weight:700;padding:2px 9px;border-radius:99px}
.bstatus.pendente{background:#2a080e;color:var(--erro)}
.bstatus.andamento{background:#1e1e0a;color:var(--warn)}
.bstatus.resolvido{background:#0a2818;color:var(--ok)}
.imeta{font-size:10px;color:var(--mut);white-space:nowrap}
.ibody{padding:7px 12px 10px;display:flex;flex-direction:column;gap:4px}
.iloja{font-size:13px;font-weight:700}
.isetor{font-size:10px;color:var(--mut)}
.idesc{font-size:12px;color:#c0c0d8;line-height:1.45}
.icontato{font-size:11px;color:var(--azul)}
.foto-thumb{width:64px;height:64px;object-fit:cover;border-radius:7px;cursor:pointer;margin-top:4px}
.iactions{padding:8px 12px 10px;display:flex;gap:7px;border-top:1px solid var(--card2);align-items:center}
.status-sel{flex:1;background:var(--card2);border:1px solid #2a2a4a;color:#e8e8f0;border-radius:6px;padding:6px 8px;font-size:12px;font-family:inherit}
.btn-save{background:var(--laranja);color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-save:active{opacity:.8}

.empty-state{text-align:center;padding:60px 20px;color:var(--mut)}
.empty-icon{font-size:40px;margin-bottom:8px}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 18px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:999}
#toast.show{opacity:1}

.sep{height:10px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="login-wrap">
  <div class="login-card">
    <div class="login-logo">🔧</div>
    <div class="login-title">GN Manutenção</div>
    <div class="login-sub">Gestão de manutenções das lojas</div>
    <input class="login-input" id="ln-user" type="text" autocomplete="username" placeholder="Usuário"
      onkeydown="if(event.key==='Enter')$('ln-pass').focus()">
    <input class="login-input" id="ln-pass" type="password" autocomplete="current-password" placeholder="Senha"
      onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">Entrar</button>
    <div class="login-err" id="ln-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div class="hdr">
    <div>
      <div class="hdr-title">🔧 GN Manutenção</div>
      <div class="hdr-sub" id="hdr-sub">—</div>
    </div>
    <div class="hdr-right">
      <span class="hdr-user" id="hdr-user"></span>
      <button class="btn-ref" id="btnRef" onclick="carregarDados()">🔄</button>
    </div>
  </div>

  <div id="alertBanner" class="hidden alert-banner"></div>
  <div class="items" id="lista"></div>

  <!-- RODAPÉ / BOTTOM NAV -->
  <nav class="bot-nav" id="botNav"></nav>
</div>

<div id="toast"></div>

<script>
const SB_URL = 'https://ncxttwvpafajnilpjbol.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jeHR0d3ZwYWZham5pbHBqYm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4NDcyMDEsImV4cCI6MjA5NzQyMzIwMX0.MGDZNGY8GfSzBKAgdR7OhvOeR71i4fj9YseJRhoh5sE';
const SESSION_KEY = 'gn_manut_v1';

const TIPOS = [
  { key:'Estrutura',        icon:'🏗️', cor:'#5c8cf5' },
  { key:'Ar Condicionado',  icon:'❄️', cor:'#4dabf7' },
  { key:'Fogão/Fritadeira', icon:'🔥', cor:'#ff8c69' },
  { key:'Elevador',         icon:'🛗', cor:'#a78bfa' },
  { key:'Exaustor',         icon:'💨', cor:'#38d9a9' },
  { key:'Outro',            icon:'🔧', cor:'#8f8fb0' },
];

const S = { usuario: null, itens: [], filtro: 'Todos' };

function $(id){ return document.getElementById(id); }

async function sb(path, opts={}) {
  const h = { apikey:SB_KEY, Authorization:'Bearer '+SB_KEY, 'Content-Type':'application/json' };
  if (opts.prefer) h['Prefer'] = opts.prefer;
  const r = await fetch(`${SB_URL}/rest/v1/${path}`, { method:opts.method||'GET', headers:h, body:opts.body?JSON.stringify(opts.body):undefined });
  if (!r.ok) { const t=await r.text(); throw new Error(t); }
  if (r.status===204) return [];
  return r.json();
}

function toast(msg){ const e=$('toast'); e.textContent=msg; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),2200); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtData(iso){ if(!iso)return'—'; const[y,m,d]=iso.split('-'); return`${d}/${m}/${y}`; }

function tipoInfo(k){ return TIPOS.find(t=>t.key===k)||TIPOS[TIPOS.length-1]; }
function scCls(status){ if(status==='Resolvido')return'resolvido'; if(status==='Em andamento')return'andamento'; return'pendente'; }

// ─── LOGIN ───────────────────────────────────────────────
async function doLogin(){
  const nome=$('ln-user').value.trim(), senha=$('ln-pass').value;
  const err=$('ln-err'); err.textContent='';
  if(!nome||!senha){ err.textContent='Preencha usuário e senha.'; return; }
  try{
    const rows = await sb(`gn_usuarios?nome=ilike.${encodeURIComponent(nome)}&senha=eq.${encodeURIComponent(senha)}&ativo=eq.true&select=nome,cargo,loja,permissoes`);
    if(!rows.length){ err.textContent='Usuário ou senha inválidos.'; return; }
    const u=rows[0];
    S.usuario=u;
    try{ localStorage.setItem(SESSION_KEY,JSON.stringify({...u,ts:Date.now()})); }catch(_){}
    iniciarApp();
  }catch(e){ err.textContent='Erro de conexão.'; }
}

async function iniciarApp(){
  if(!S.usuario){
    try{
      const s=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');
      if(s&&Date.now()-s.ts<86400000*7) S.usuario=s;
    }catch(_){}
  }
  if(!S.usuario) return;
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('hdr-user').textContent=S.usuario.nome;
  pedirPermissaoNotif();
  await carregarDados();
  setInterval(carregarDados, 120000);
}

// ─── DADOS ───────────────────────────────────────────────
let _lastIds = new Set();

async function carregarDados(){
  $('btnRef').textContent='⏳';
  const d=new Date(); d.setDate(d.getDate()-30);
  const from=d.toISOString().split('T')[0];
  try{
    const rows = await sb(`checklist_diario?select=data_operacao,loja,manutencao&data_operacao=gte.${from}&order=data_operacao.desc`);
    const itens=[];
    for(const row of rows){
      if(!Array.isArray(row.manutencao)||!row.manutencao.length) continue;
      for(const m of row.manutencao){
        itens.push({...m, _loja:row.loja, _data:row.data_operacao});
      }
    }
    verificarNovos(itens);
    S.itens=itens;
    const tot=itens.length, pend=itens.filter(m=>m.status!=='Resolvido').length;
    const hr=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    $('hdr-sub').textContent=`${tot} registro${tot!==1?'s':''} · ${pend} pendente${pend!==1?'s':''} · ${hr}`;
    renderBotNav(); renderLista();
  }catch(e){ toast('Erro ao carregar'); }
  $('btnRef').textContent='🔄';
}

function verificarNovos(itens){
  const pendIds = new Set(itens.filter(m=>m.status!=='Resolvido').map(m=>`${m._loja}:${m._data}:${m.id}`));
  const novosPend=[...pendIds].filter(id=>!_lastIds.has(id));
  const primeiroLoad = _lastIds.size===0;
  _lastIds=pendIds;
  if(primeiroLoad||!novosPend.length) return;
  const n=novosPend.length;
  const msg=`🚨 ${n} nova${n>1?'s':''} manutenção${n>1?'ões':''} pendente${n>1?'s':''}`;
  mostrarAlerta(msg); enviarNotif(msg);
}

function mostrarAlerta(msg){
  const b=$('alertBanner');
  b.classList.remove('hidden');
  b.innerHTML=`<span>🚨</span><span style="flex:1">${esc(msg)}</span><button onclick="fecharAlerta()">✕</button>`;
}
function fecharAlerta(){ $('alertBanner').classList.add('hidden'); }

function pedirPermissaoNotif(){
  if('Notification'in window&&Notification.permission==='default') Notification.requestPermission();
}
function enviarNotif(msg){
  if('Notification'in window&&Notification.permission==='granted')
    new Notification('GN Manutenção',{body:msg});
}

// ─── RODAPÉ ──────────────────────────────────────────────
function renderBotNav(){
  const pTotal=S.itens.filter(m=>m.status!=='Resolvido').length;
  // "Todos" + cada tipo com itens
  const abas=[{key:'Todos',icon:'📋',label:'Todos',pend:pTotal}];
  for(const t of TIPOS){
    const pend=S.itens.filter(m=>(m.tipo||'Estrutura')===t.key&&m.status!=='Resolvido').length;
    const total=S.itens.filter(m=>(m.tipo||'Estrutura')===t.key).length;
    abas.push({key:t.key,icon:t.icon,label:t.key.split('/')[0],pend,total});
  }
  $('botNav').innerHTML=abas.map((a,i)=>{
    const sel=S.filtro===a.key;
    return `${i>0?'<div class="bot-sep"></div>':''}
    <button class="bot-tab${sel?' sel':''}" onclick="setFiltro('${a.key}')">
      <span class="ti">${a.icon}</span>
      <span>${a.label}</span>
      ${a.pend>0?`<span class="bdg">${a.pend}</span>`:''}
    </button>`;
  }).join('');
}

function setFiltro(f){ S.filtro=f; renderBotNav(); renderLista(); }

function renderLista(){
  let items=S.itens;
  if(S.filtro!=='Todos') items=items.filter(m=>(m.tipo||'Estrutura')===S.filtro);
  const ord={pendente:0,andamento:1,resolvido:2};
  items=[...items].sort((a,b)=>{
    const da=ord[scCls(a.status)], db=ord[scCls(b.status)];
    if(da!==db) return da-db;
    return (b._data||'').localeCompare(a._data||'');
  });
  if(!items.length){
    $('lista').innerHTML=`<div class="empty-state"><div class="empty-icon">✅</div><div>Nenhuma manutenção${S.filtro!=='Todos'?' nesta categoria':''}</div></div>`;
    return;
  }
  $('lista').innerHTML=items.map(m=>{
    const tipo=m.tipo||'Estrutura';
    const ti=tipoInfo(tipo);
    const sc=scCls(m.status);
    const statusLabel = m.status==='Em andamento'?'🔄 Em andamento':m.status==='Resolvido'?'✅ Resolvido':'⏳ Pendente';
    return `<div class="icard ${sc}">
      <div class="ihead">
        <div class="ibadges">
          <span class="btipo" style="color:${ti.cor}">${ti.icon} ${tipo}</span>
          <span class="bstatus ${sc}">${statusLabel}</span>
        </div>
        <span class="imeta">${fmtData(m._data)}</span>
      </div>
      <div class="ibody">
        <div class="iloja">${esc(m._loja||'—')}</div>
        <div class="isetor">Setor: ${esc(m.setor||'—')}</div>
        ${m.descricao?`<div class="idesc">${esc(m.descricao)}</div>`:''}
        ${m.contato?`<div class="icontato">📞 ${esc(m.contato)}</div>`:''}
        ${m.fotoBase64?`<img class="foto-thumb" src="${m.fotoBase64}" onclick="this.requestFullscreen&&this.requestFullscreen()" title="Ver foto">`:'' }
      </div>
      <div class="iactions">
        <select class="status-sel" id="sel-${m.id}">
          <option value="Pendente" ${m.status==='Pendente'?'selected':''}>⏳ Pendente</option>
          <option value="Em andamento" ${m.status==='Em andamento'?'selected':''}>🔄 Em andamento</option>
          <option value="Resolvido" ${m.status==='Resolvido'?'selected':''}>✅ Resolvido</option>
        </select>
        <button class="btn-save" onclick="salvarStatus(${JSON.stringify(esc(m._loja))},${JSON.stringify(m._data)},${JSON.stringify(String(m.id))})">Salvar</button>
      </div>
    </div>`;
  }).join('');
}

// ─── STATUS UPDATE ────────────────────────────────────────
async function salvarStatus(loja, data, itemId){
  const sel=$(`sel-${itemId}`); if(!sel) return;
  const novoStatus=sel.value;
  try{
    const rows=await sb(`checklist_diario?data_operacao=eq.${data}&loja=eq.${encodeURIComponent(loja)}&select=manutencao`);
    if(!rows.length){ toast('Registro não encontrado'); return; }
    const arr=Array.isArray(rows[0].manutencao)?rows[0].manutencao:[];
    const idx=arr.findIndex(m=>String(m.id)===String(itemId));
    if(idx<0){ toast('Item não encontrado'); return; }
    arr[idx].status=novoStatus;
    await sb(`checklist_diario?data_operacao=eq.${data}&loja=eq.${encodeURIComponent(loja)}`,{
      method:'PATCH', prefer:'return=minimal', body:{manutencao:arr}
    });
    const local=S.itens.find(m=>String(m.id)===String(itemId)&&m._loja===loja&&m._data===data);
    if(local) local.status=novoStatus;
    _lastIds=new Set(S.itens.filter(m=>m.status!=='Resolvido').map(m=>`${m._loja}:${m._data}:${m.id}`));
    renderBotNav(); renderLista(); toast('Status atualizado!');
  }catch(e){ toast('Erro ao salvar'); }
}

// ─── INIT ─────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded',()=>{
  $('ln-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  iniciarApp();
});
</script>
</body>
</html>
