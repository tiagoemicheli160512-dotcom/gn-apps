<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#E8580A"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="GN Comandas"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icons/icon-192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<title>GN Comandas</title>
<script src="gn-lojas-config.js"></script>
<script src="gn-lojas-seed.js"></script>
<style>
:root{--cor:#E8580A;--cor2:#c2410c}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{background:#F5F6F8;color:#1A1D23;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;min-height:100vh}
button{cursor:pointer;border:none;font-family:inherit;font-size:inherit;background:none}
input,select{font-family:inherit;font-size:inherit;outline:none}
.hidden{display:none!important}

/* ── LOGIN ───────────────────────────────────── */
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:radial-gradient(ellipse at 50% -10%,color-mix(in srgb,var(--cor) 18%,transparent) 0%,transparent 65%),#F5F6F8}
.login-logo{font-size:48px;font-weight:900;color:var(--cor);letter-spacing:-2px;line-height:1}
.login-tag{font-size:11px;color:#A8AFBB;letter-spacing:3px;text-transform:uppercase;margin:6px 0 32px}
.login-card{background:#FFFFFF;border:1px solid #E1E4E9;border-radius:22px;padding:26px 22px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:13px;box-shadow:0 24px 60px rgba(0,0,0,.12)}
.l-inp,.l-sel{background:#F5F6F8;border:1.5px solid #E1E4E9;border-radius:12px;padding:14px 16px;font-size:15px;color:#1A1D23;width:100%;font-family:inherit;outline:none;transition:border-color .15s}
.l-inp:focus,.l-sel:focus{border-color:var(--cor)}
.l-inp::placeholder{color:#C7CDD6}
.l-btn{background:var(--cor);color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;letter-spacing:.3px}
.l-btn:disabled{opacity:.45;cursor:default}
.l-err{color:#dc2626;font-size:12px;min-height:16px;text-align:center;font-weight:600}

/* ── APP SHELL ───────────────────────────────── */
#app-screen{display:none;flex-direction:column;min-height:100vh;padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))}
.hdr{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;padding:13px 16px;background:rgba(247,248,250,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(0,0,0,.06)}
.hdr-logo{font-size:18px;font-weight:900;color:var(--cor);letter-spacing:-1px}
.hdr-loja{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:700;color:rgba(0,0,0,.55)}
.hdr-sair{background:transparent;border:1px solid rgba(0,0,0,.12);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;color:rgba(0,0,0,.45)}
.content{flex:1;padding:14px 16px 20px}
.card{background:#fff;border:1px solid #E1E4E9;border-radius:16px;padding:14px}
.sec-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:rgba(0,0,0,.4);margin:16px 0 8px}
.sec-title:first-child{margin-top:0}

/* Nav inferior */
.nav-bar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;background:#fff;border-top:1px solid #E1E4E9;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;color:rgba(0,0,0,.4);font-size:10px;font-weight:700}
.nav-btn.active{color:var(--cor);background:color-mix(in srgb,var(--cor) 10%,transparent)}
.nav-btn .ic{font-size:19px}

/* Mesas */
.mesas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.mesa-btn{aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;padding:6px}
.mesa-livre{background:#EEF1F4;border:1.5px solid #E1E4E9;color:#1A1D23}
.mesa-ocupada{background:rgba(232,88,10,.1);border:1.5px solid var(--cor);color:var(--cor2)}
.mesa-num{font-size:17px}
.mesa-info{font-size:9px;font-weight:700;opacity:.85}

/* Comanda */
.comanda-hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.btn-voltar{background:#EEF1F4;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;color:#1A1D23}
.item-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid rgba(0,0,0,.06)}
.item-row:last-child{border-bottom:none}
.item-nome{flex:1;min-width:0;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-sub{font-size:11px;color:rgba(0,0,0,.45)}
.qtd-ctrl{display:flex;align-items:center;gap:6px;flex-shrink:0}
.qtd-btn{width:26px;height:26px;border-radius:8px;background:#EEF1F4;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center}
.qtd-val{min-width:18px;text-align:center;font-weight:800;font-size:13px}
.item-valor{font-size:13px;font-weight:800;width:64px;text-align:right;flex-shrink:0}
.total-box{background:#EEF1F4;border-left:3px solid var(--cor);border-radius:10px;padding:12px;display:flex;justify-content:space-between;align-items:center;margin:12px 0}
.btn-primary{background:var(--cor);color:#fff;border-radius:14px;padding:14px;font-size:14px;font-weight:800;width:100%;text-align:center}
.btn-secondary{background:#EEF1F4;color:#1A1D23;border:1px solid #E1E4E9;border-radius:14px;padding:14px;font-size:14px;font-weight:700;width:100%;text-align:center}
.btn-danger-outline{background:transparent;color:#dc2626;border:1px solid rgba(220,38,38,.35);border-radius:14px;padding:12px;font-size:13px;font-weight:700;width:100%;text-align:center}

/* Modal cardápio / pagamento */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal-box{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:88vh;display:flex;flex-direction:column;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.modal-title{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.modal-close{font-size:20px;color:rgba(0,0,0,.4);padding:4px 8px}
.search-inp{width:100%;background:#F5F6F8;border:1.5px solid #E1E4E9;border-radius:12px;padding:11px 14px;font-size:14px;margin-bottom:10px}
.modal-list{overflow-y:auto;flex:1}
.prato-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid rgba(0,0,0,.05)}
.prato-nome{flex:1;min-width:0;font-size:13px;font-weight:700}
.prato-preco{font-size:12px;font-weight:800;color:var(--cor2);width:70px;text-align:right;flex-shrink:0}
.prato-preco.zero{color:#C7CDD6}

/* Pagamento */
.pag-forma{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid rgba(0,0,0,.06)}
.pag-forma:last-child{border-bottom:none}
.pag-lbl{font-size:13px;font-weight:700;flex:1}
.pag-inp{width:110px;background:#F5F6F8;border:1.5px solid #E1E4E9;border-radius:10px;padding:9px 10px;font-size:13px;text-align:right}

/* Preços */
.preco-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(0,0,0,.05)}
.preco-nome{flex:1;min-width:0;font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preco-inp{width:90px;background:#F5F6F8;border:1.5px solid #E1E4E9;border-radius:10px;padding:8px 10px;font-size:13px;text-align:right}

/* Relatório */
.rel-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(0,0,0,.06)}
.rel-row:last-child{border-bottom:none}
.rel-mesa{font-size:13px;font-weight:800}
.rel-meta{font-size:10px;color:rgba(0,0,0,.45);margin-top:2px}
.rel-valor{font-size:13px;font-weight:800;color:var(--cor2)}
.rel-reabrir{font-size:10px;font-weight:700;color:#dc2626;margin-left:8px}

#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:#1A1D23;color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:999;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:#dc2626}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-logo">🍽️ GN</div>
  <div class="login-tag">Comandas</div>
  <div class="login-card">
    <input class="l-inp" id="loginNome" type="text" placeholder="Seu nome" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('loginSenha').focus()"/>
    <input class="l-inp" id="loginSenha" type="password" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key==='Enter')fazerLogin()"/>
    <div id="lojaPickWrap" class="hidden">
      <select class="l-sel" id="loginLoja"></select>
    </div>
    <button class="l-btn" id="btnLogin" onclick="fazerLogin()">Entrar</button>
    <div class="l-err" id="loginErro"></div>
  </div>
</div>

<div id="app-screen">
  <div class="hdr">
    <span class="hdr-logo">🍽️ GN</span>
    <span class="hdr-loja" id="hdrLoja"></span>
    <button class="hdr-sair" onclick="sair()">Sair</button>
  </div>
  <div class="content" id="content"></div>
  <div class="nav-bar" id="navBar">
    <button class="nav-btn" id="nav-mesas" onclick="irTab('mesas')"><span class="ic">🍽️</span>Mesas</button>
    <button class="nav-btn hidden" id="nav-precos" onclick="irTab('precos')"><span class="ic">💲</span>Preços</button>
    <button class="nav-btn" id="nav-relatorio" onclick="irTab('relatorio')"><span class="ic">📊</span>Relatório</button>
  </div>
</div>

<!-- Modal cardápio -->
<div class="modal-overlay" id="modalCardapio">
  <div class="modal-box">
    <div class="modal-title">Adicionar item<button class="modal-close" onclick="fecharModal('modalCardapio')">×</button></div>
    <input class="search-inp" id="buscaCardapio" placeholder="Buscar prato ou bebida…" oninput="renderCardapioModal()"/>
    <div class="modal-list" id="listaCardapio"></div>
  </div>
</div>

<!-- Modal pagamento -->
<div class="modal-overlay" id="modalPagamento">
  <div class="modal-box">
    <div class="modal-title">Fechar comanda<button class="modal-close" onclick="fecharModal('modalPagamento')">×</button></div>
    <div style="font-size:12px;color:rgba(0,0,0,.5);margin-bottom:10px">Informe o valor recebido em cada forma de pagamento. A soma precisa bater com o total.</div>
    <div id="pagFormas"></div>
    <div class="total-box" style="margin-top:12px">
      <span style="font-size:12px;font-weight:700">Total da comanda</span>
      <span id="pagTotalComanda" style="font-size:16px;font-weight:900"></span>
    </div>
    <div class="total-box" id="pagDiferencaBox">
      <span style="font-size:12px;font-weight:700">Diferença</span>
      <span id="pagDiferenca" style="font-size:14px;font-weight:800"></span>
    </div>
    <button class="btn-primary" onclick="confirmarFechamento()">✅ Confirmar fechamento</button>
  </div>
</div>

<div id="toast"></div>

<script>
const SB_URL = 'https://ncxttwvpafajnilpjbol.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jeHR0d3ZwYWZham5pbHBqYm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4NDcyMDEsImV4cCI6MjA5NzQyMzIwMX0.MGDZNGY8GfSzBKAgdR7OhvOeR71i4fj9YseJRhoh5sE';
const SESSION_KEY = 'gn_comandas_session_v1';
const TTL = 43200000; // 12h

// Comandas ainda não cobre a Maglia (pedido não citou "Maglia" — regra combinada:
// mudanças/apps novos ficam restritos às 11 lojas originais salvo menção explícita).
const LOJAS_COMANDAS = window.GN_LOJAS.filter(l => l.userKey !== 'MAGLIA');
const LOJA_CHK_MAP = Object.fromEntries(window.GN_LOJAS.map(l=>[l.userKey,l.chkKey]));
const CARGOS_ADMIN_COMANDAS = ['mestre','supervisor','administrador','gerente'];

const S = { user:null, loja:null, tab:'mesas', mesasAbertas:[], comandaAtual:null, itensAtual:[], precos:{}, numMesas:30, relData:null, relRows:[] };

function $(id){ return document.getElementById(id); }

async function sb(path, opts = {}) {
  const url = `${SB_URL}/rest/v1/${path}`;
  const headers = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };
  if (opts.prefer) headers['Prefer'] = opts.prefer;
  const res = await fetch(url, { method: opts.method || 'GET', headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (!res.ok) { const t = await res.text(); throw new Error(t); }
  if (res.status === 204) return [];
  const text = await res.text();
  return text ? JSON.parse(text) : [];
}

function toast(msg, isErr){
  const el = $('toast');
  el.textContent = msg;
  el.className = isErr ? 'show err' : 'show';
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.className=''; }, 2600);
}

function money(v){ return 'R$ ' + Number(v||0).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function parseMoney(s){ return parseFloat(String(s).replace(/\./g,'').replace(',','.')) || 0; }

function hojeLocal(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}

function cardapioAll(){ return (window.GN_LOJAS_SEED && window.GN_LOJAS_SEED.pratos_venda) || []; }
function cardapioNomeByCod(cod){ const p = cardapioAll().find(x=>String(x.codigo)===String(cod)); return p ? p.nome : cod; }
function podeAdmin(){ return !!S.user && (CARGOS_ADMIN_COMANDAS.includes(S.user.cargo) || (S.user.permissoes && S.user.permissoes.master)); }

/* ═══════════ LOGIN ═══════════ */
(function initLojaSelect(){
  const sel = $('loginLoja');
  sel.innerHTML = LOJAS_COMANDAS.map(l => `<option value="${l.userKey}">${l.display}</option>`).join('');
})();

async function fazerLogin(){
  const nome = $('loginNome').value.trim();
  const senha = $('loginSenha').value.trim();
  const erroEl = $('loginErro');
  erroEl.textContent = '';
  if (!nome || !senha) { erroEl.textContent = 'Preencha nome e senha.'; return; }
  const btn = $('btnLogin');
  btn.disabled = true; btn.textContent = 'Entrando...';
  try {
    const rows = await sb(`gn_usuarios?nome=ilike.${encodeURIComponent(nome)}&senha=eq.${encodeURIComponent(senha)}&ativo=eq.true&select=id,nome,cargo,loja,permissoes`);
    if (!rows.length) { erroEl.textContent = '❌ Nome ou senha incorretos.'; btn.disabled=false; btn.textContent='Entrar'; return; }
    const u = rows[0];
    const perm = u.permissoes || {};
    const temAcesso = !!perm.comandas || CARGOS_ADMIN_COMANDAS.includes(u.cargo);
    if (!temAcesso) { erroEl.textContent = '🚫 Seu usuário não tem acesso ao GN Comandas.'; btn.disabled=false; btn.textContent='Entrar'; return; }
    let loja = u.loja;
    if (loja === 'MAGLIA') { erroEl.textContent = '🚫 Comandas ainda não disponível pra essa loja.'; btn.disabled=false; btn.textContent='Entrar'; return; }
    if (loja === 'GERAL') {
      $('lojaPickWrap').classList.remove('hidden');
      loja = $('loginLoja').value;
    }
    S.user = u; S.loja = loja;
    localStorage.setItem(SESSION_KEY, JSON.stringify({ user: u, loja, ts: Date.now() }));
    entrarApp();
  } catch(e) {
    erroEl.textContent = '⚠️ Erro de conexão. Tente novamente.';
    btn.disabled = false; btn.textContent = 'Entrar';
  }
}

function sair(){
  localStorage.removeItem(SESSION_KEY);
  location.reload();
}

function tentarSessaoSalva(){
  try {
    const sv = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    if (sv && sv.user && sv.loja && (Date.now() - sv.ts) < TTL) {
      S.user = sv.user; S.loja = sv.loja;
      entrarApp();
      return true;
    }
  } catch(_) {}
  return false;
}

/* ═══════════ APP SHELL ═══════════ */
async function entrarApp(){
  $('login-screen').style.display = 'none';
  $('app-screen').style.display = 'flex';
  const lojaCfg = window.GN_LOJAS.find(l=>l.userKey===S.loja);
  $('hdrLoja').textContent = (lojaCfg ? lojaCfg.display : S.loja) + ' · ' + S.user.nome;
  if (podeAdmin()) $('nav-precos').classList.remove('hidden');
  try { S.numMesas = parseInt(localStorage.getItem('gn_comandas_nummesas_'+S.loja)) || 30; } catch(_) { S.numMesas = 30; }
  await carregarPrecos();
  irTab('mesas');
}

function irTab(tab){
  S.tab = tab;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  $('nav-'+tab).classList.add('active');
  if (tab === 'mesas') renderMesasTab();
  else if (tab === 'precos') renderPrecosTab();
  else if (tab === 'relatorio') renderRelatorioTab();
}

function abrirModal(id){ $(id).classList.add('open'); }
function fecharModal(id){ $(id).classList.remove('open'); }

/* ═══════════ MESAS ═══════════ */
async function carregarMesasAbertas(){
  try {
    S.mesasAbertas = await sb(`gn_comandas?loja=eq.${encodeURIComponent(S.loja)}&status=eq.aberta&select=id,mesa,valor_total,aberta_em,aberta_por&order=mesa`);
  } catch(e) { S.mesasAbertas = []; toast('⚠️ Erro ao carregar mesas.', true); }
}

async function renderMesasTab(){
  $('content').innerHTML = `<div class="sec-title">Mesas</div><div class="mesas-grid" id="mesasGrid"><div class="card" style="grid-column:1/-1;text-align:center;color:rgba(0,0,0,.4);padding:24px">Carregando…</div></div>
    ${podeAdmin() ? '<div style="margin-top:14px"><button class="btn-secondary" onclick="ajustarNumMesas()">⚙️ Nº de mesas (' + S.numMesas + ')</button></div>' : ''}`;
  await carregarMesasAbertas();
  const grid = $('mesasGrid');
  if (!grid) return;
  const porMesa = {};
  S.mesasAbertas.forEach(c => { porMesa[String(c.mesa)] = c; });
  let html = '';
  for (let i = 1; i <= S.numMesas; i++) {
    const c = porMesa[String(i)];
    if (c) {
      const min = Math.max(0, Math.floor((Date.now() - new Date(c.aberta_em).getTime())/60000));
      html += `<button class="mesa-btn mesa-ocupada" onclick="abrirComandaExistente('${c.id}')">
        <span class="mesa-num">${i}</span>
        <span class="mesa-info">${money(c.valor_total)}</span>
        <span class="mesa-info">${min}min</span>
      </button>`;
    } else {
      html += `<button class="mesa-btn mesa-livre" onclick="abrirMesa(${i})">
        <span class="mesa-num">${i}</span>
        <span class="mesa-info">livre</span>
      </button>`;
    }
  }
  grid.innerHTML = html;
}

function ajustarNumMesas(){
  const v = prompt('Quantas mesas essa loja tem?', S.numMesas);
  if (v == null) return;
  const n = parseInt(v);
  if (!n || n < 1 || n > 200) { toast('⚠️ Número inválido.', true); return; }
  S.numMesas = n;
  try { localStorage.setItem('gn_comandas_nummesas_'+S.loja, String(n)); } catch(_) {}
  renderMesasTab();
}

async function abrirMesa(mesa){
  try {
    const [row] = await sb('gn_comandas', { method:'POST', prefer:'return=representation',
      body: { loja:S.loja, mesa:String(mesa), status:'aberta', aberta_por:S.user.nome, aberta_em:new Date().toISOString(), data_operacao:hojeLocal() } });
    S.comandaAtual = row; S.itensAtual = [];
    renderComandaTab();
  } catch(e) { toast('❌ Erro ao abrir mesa.', true); }
}

async function abrirComandaExistente(id){
  try {
    const [comanda] = await sb(`gn_comandas?id=eq.${id}&select=*`);
    if (!comanda) { toast('⚠️ Comanda não encontrada.', true); await renderMesasTab(); return; }
    const itens = await sb(`gn_comanda_itens?comanda_id=eq.${id}&cancelado=eq.false&order=lancado_em&select=id,prato_codigo,prato_nome,quantidade,preco_unit,subtotal`);
    S.comandaAtual = comanda; S.itensAtual = itens || [];
    renderComandaTab();
  } catch(e) { toast('❌ Erro ao abrir comanda.', true); }
}

function voltarMesas(){
  S.comandaAtual = null; S.itensAtual = [];
  irTab('mesas');
}

/* ═══════════ COMANDA (itens) ═══════════ */
function totalComanda(){ return S.itensAtual.reduce((s,i)=>s+(parseFloat(i.subtotal)||0),0); }

function renderComandaTab(){
  const c = S.comandaAtual;
  $('content').innerHTML = `
    <div class="comanda-hdr">
      <button class="btn-voltar" onclick="voltarMesas()">← Mesas</button>
      <div style="font-size:16px;font-weight:900">Mesa ${c.mesa}</div>
    </div>
    <div class="card">
      <div id="itensLista">${itensListaHtml()}</div>
    </div>
    <div class="total-box"><span style="font-size:13px;font-weight:700">Total</span><span style="font-size:19px;font-weight:900" id="comandaTotalTxt">${money(totalComanda())}</span></div>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:4px">
      <button class="btn-secondary" onclick="abrirModalCardapio()">➕ Adicionar item</button>
      <button class="btn-primary" ${S.itensAtual.length?'':'disabled style="opacity:.45"'} onclick="abrirModalPagamento()">✅ Fechar comanda</button>
      ${S.itensAtual.length===0 ? '<button class="btn-danger-outline" onclick="cancelarMesa()">🗑 Cancelar mesa</button>' : ''}
    </div>
  `;
}

function itensListaHtml(){
  if (!S.itensAtual.length) return '<div style="text-align:center;color:rgba(0,0,0,.4);font-size:12px;padding:14px 0">Nenhum item lançado ainda.</div>';
  return S.itensAtual.map(i => `
    <div class="item-row">
      <div style="flex:1;min-width:0">
        <div class="item-nome">${escapeHtml(i.prato_nome||i.prato_codigo)}</div>
        <div class="item-sub">${money(i.preco_unit)} un.</div>
      </div>
      <div class="qtd-ctrl">
        <button class="qtd-btn" onclick="alterarQtd('${i.id}',-1)">−</button>
        <span class="qtd-val">${i.quantidade}</span>
        <button class="qtd-btn" onclick="alterarQtd('${i.id}',1)">+</button>
      </div>
      <div class="item-valor">${money(i.subtotal)}</div>
    </div>`).join('');
}

async function _atualizarValorTotalComanda(){
  const total = totalComanda();
  S.comandaAtual.valor_total = total;
  try { await sb(`gn_comandas?id=eq.${S.comandaAtual.id}`, { method:'PATCH', body:{ valor_total: total } }); } catch(_) {}
}

async function alterarQtd(itemId, delta){
  const item = S.itensAtual.find(i=>String(i.id)===String(itemId));
  if (!item) return;
  const novaQtd = item.quantidade + delta;
  try {
    if (novaQtd <= 0) {
      await sb(`gn_comanda_itens?id=eq.${item.id}`, { method:'DELETE' });
      S.itensAtual = S.itensAtual.filter(i=>String(i.id)!==String(itemId));
    } else {
      const novoSub = novaQtd * item.preco_unit;
      await sb(`gn_comanda_itens?id=eq.${item.id}`, { method:'PATCH', body:{ quantidade: novaQtd, subtotal: novoSub } });
      item.quantidade = novaQtd; item.subtotal = novoSub;
    }
    await _atualizarValorTotalComanda();
    renderComandaTab();
  } catch(e) { toast('❌ Erro ao atualizar item.', true); }
}

async function cancelarMesa(){
  if (!confirm('Cancelar essa mesa? Ela volta a ficar livre.')) return;
  try {
    await sb(`gn_comandas?id=eq.${S.comandaAtual.id}`, { method:'PATCH', body:{ status:'cancelada', fechada_em:new Date().toISOString(), fechada_por:S.user.nome } });
    voltarMesas();
  } catch(e) { toast('❌ Erro ao cancelar mesa.', true); }
}

/* ═══════════ MODAL CARDÁPIO ═══════════ */
function abrirModalCardapio(){
  $('buscaCardapio').value = '';
  renderCardapioModal();
  abrirModal('modalCardapio');
}

function renderCardapioModal(){
  const termo = ($('buscaCardapio').value || '').trim().toUpperCase();
  const lista = cardapioAll().filter(p => !termo || p.nome.toUpperCase().includes(termo) || String(p.codigo).includes(termo));
  const el = $('listaCardapio');
  if (!lista.length) { el.innerHTML = '<div style="text-align:center;color:rgba(0,0,0,.4);font-size:12px;padding:20px 0">Nada encontrado.</div>'; return; }
  el.innerHTML = lista.map(p => {
    const preco = S.precos[p.codigo] || 0;
    return `<div class="prato-row" onclick="adicionarItem('${p.codigo}')">
      <div class="prato-nome">${escapeHtml(p.nome)}</div>
      <div class="prato-preco ${preco>0?'':'zero'}">${preco>0?money(preco):'sem preço'}</div>
    </div>`;
  }).join('');
}

async function adicionarItem(cod){
  const preco = S.precos[cod];
  if (!preco || preco <= 0) { toast('⚠️ Prato sem preço cadastrado. Peça pra um mestre/supervisor cadastrar na aba Preços.', true); return; }
  const nome = cardapioNomeByCod(cod);
  const existente = S.itensAtual.find(i=>i.prato_codigo===cod);
  try {
    if (existente) {
      const novaQtd = existente.quantidade + 1;
      const novoSub = novaQtd * preco;
      await sb(`gn_comanda_itens?id=eq.${existente.id}`, { method:'PATCH', body:{ quantidade: novaQtd, subtotal: novoSub } });
      existente.quantidade = novaQtd; existente.subtotal = novoSub;
    } else {
      const [row] = await sb('gn_comanda_itens', { method:'POST', prefer:'return=representation',
        body:{ comanda_id:S.comandaAtual.id, prato_codigo:cod, prato_nome:nome, quantidade:1, preco_unit:preco, subtotal:preco, lancado_por:S.user.nome } });
      S.itensAtual.push(row);
    }
    await _atualizarValorTotalComanda();
    toast('✅ ' + nome + ' adicionado');
    renderComandaTab();
  } catch(e) { toast('❌ Erro ao adicionar item.', true); }
}

/* ═══════════ MODAL PAGAMENTO ═══════════ */
const FORMAS_PAGAMENTO = [ {k:'dinheiro',lb:'💵 Dinheiro'}, {k:'cartao',lb:'💳 Cartão'}, {k:'pix',lb:'🔑 Pix'} ];

function abrirModalPagamento(){
  const total = totalComanda();
  $('pagTotalComanda').textContent = money(total);
  $('pagFormas').innerHTML = FORMAS_PAGAMENTO.map((f,i) => `
    <div class="pag-forma">
      <span class="pag-lbl">${f.lb}</span>
      <input class="pag-inp" id="pagInp-${f.k}" type="number" step="0.01" min="0" value="${i===0?total.toFixed(2):''}" oninput="atualizarDiferencaPagamento()"/>
    </div>`).join('');
  atualizarDiferencaPagamento();
  abrirModal('modalPagamento');
}

function atualizarDiferencaPagamento(){
  const total = totalComanda();
  const soma = FORMAS_PAGAMENTO.reduce((s,f)=>s + (parseFloat($('pagInp-'+f.k).value)||0), 0);
  const dif = Math.round((total - soma) * 100) / 100;
  const box = $('pagDiferencaBox'), txt = $('pagDiferenca');
  txt.textContent = money(dif);
  box.style.borderLeftColor = Math.abs(dif) < 0.01 ? '#16a34a' : '#dc2626';
  txt.style.color = Math.abs(dif) < 0.01 ? '#16a34a' : '#dc2626';
}

async function confirmarFechamento(){
  const total = totalComanda();
  const formas = FORMAS_PAGAMENTO.map(f => ({ forma:f.k, valor: parseFloat($('pagInp-'+f.k).value)||0 })).filter(f=>f.valor>0);
  const soma = formas.reduce((s,f)=>s+f.valor,0);
  if (Math.abs(total - soma) >= 0.01) { toast('⚠️ A soma das formas de pagamento precisa bater com o total.', true); return; }
  try {
    await sb(`gn_comandas?id=eq.${S.comandaAtual.id}`, { method:'PATCH', body:{ status:'fechada', fechada_em:new Date().toISOString(), fechada_por:S.user.nome, forma_pagamento:formas, valor_total:total } });
    fecharModal('modalPagamento');
    toast('✅ Comanda fechada!');
    sincronizarComandasChecklist(S.loja, S.comandaAtual.data_operacao);
    voltarMesas();
  } catch(e) { toast('❌ Erro ao fechar comanda.', true); }
}

/* ═══════════ INTEGRAÇÃO COM O CHECK-LIST ═══════════
   Ao fechar uma comanda, dá baixa só nos pratos: recalcula do zero (idempotente)
   as quantidades vendidas nas comandas fechadas do dia e mescla no jsonb "vendas"
   do Check-list, sem apagar lançamentos manuais de pratos que não passaram por
   comanda. O valor em dinheiro (venda_salao) continua vindo só do app Caixa —
   Comandas não mexe nisso por enquanto. */
async function sincronizarComandasChecklist(lojaUserKey, dataOperacao){
  try {
    const comandas = await sb(`gn_comandas?loja=eq.${encodeURIComponent(lojaUserKey)}&data_operacao=eq.${dataOperacao}&status=eq.fechada&select=id`);
    if (!comandas || !comandas.length) return;
    const ids = comandas.map(c=>c.id).join(',');
    const itens = await sb(`gn_comanda_itens?comanda_id=in.(${ids})&cancelado=eq.false&select=prato_codigo,quantidade`);
    const vendasAgg = {};
    (itens||[]).forEach(i => { vendasAgg[i.prato_codigo] = (vendasAgg[i.prato_codigo]||0) + (parseInt(i.quantidade)||0); });
    const lojaChk = LOJA_CHK_MAP[lojaUserKey] || lojaUserKey;
    let vendasExistentes = {};
    try {
      const ex = await sb(`checklist_diario?loja=eq.${encodeURIComponent(lojaChk)}&data_operacao=eq.${dataOperacao}&select=vendas`);
      if (ex && ex[0] && ex[0].vendas && typeof ex[0].vendas === 'object') vendasExistentes = ex[0].vendas;
    } catch(_) {}
    const vendasFinal = { ...vendasExistentes, ...vendasAgg };
    await sb(`checklist_diario?on_conflict=data_operacao,loja`, { method:'POST', prefer:'return=minimal,resolution=merge-duplicates',
      body: { loja:lojaChk, data_operacao:dataOperacao, vendas:vendasFinal } });
  } catch(e) { console.error('[GN:comandas-sync]', e); }
}

/* ═══════════ PREÇOS ═══════════ */
async function carregarPrecos(){
  try {
    const rows = await sb('gn_comanda_precos?select=prato_codigo,preco');
    S.precos = {};
    (rows||[]).forEach(r => { S.precos[r.prato_codigo] = parseFloat(r.preco)||0; });
  } catch(e) { S.precos = {}; }
}

function renderPrecosTab(){
  if (!podeAdmin()) { irTab('mesas'); return; }
  $('content').innerHTML = `
    <div class="sec-title">Preços do cardápio</div>
    <div style="font-size:11px;color:rgba(0,0,0,.5);margin-bottom:10px">Mesmo preço pra rede toda. Pratos sem preço não podem ser lançados nas comandas.</div>
    <input class="search-inp" id="buscaPrecos" placeholder="Buscar prato ou bebida…" oninput="renderListaPrecos()"/>
    <div class="card"><div id="listaPrecos"></div></div>
  `;
  renderListaPrecos();
}

function renderListaPrecos(){
  const termo = ($('buscaPrecos').value || '').trim().toUpperCase();
  const lista = cardapioAll().filter(p => !termo || p.nome.toUpperCase().includes(termo) || String(p.codigo).includes(termo));
  $('listaPrecos').innerHTML = lista.map(p => `
    <div class="preco-row">
      <div class="preco-nome">${escapeHtml(p.nome)}</div>
      <input class="preco-inp" type="number" step="0.01" min="0" value="${S.precos[p.codigo]||''}" placeholder="0,00"
        onblur="salvarPreco('${p.codigo}', this.value)"/>
    </div>`).join('');
}

async function salvarPreco(cod, valorStr){
  const valor = parseFloat(valorStr) || 0;
  const nome = cardapioNomeByCod(cod);
  try {
    await sb('gn_comanda_precos?on_conflict=prato_codigo', { method:'POST', prefer:'return=minimal,resolution=merge-duplicates',
      body:{ prato_codigo:cod, prato_nome:nome, preco:valor, ativo:true, atualizado_em:new Date().toISOString(), atualizado_por:S.user.nome } });
    S.precos[cod] = valor;
    toast('✅ Preço salvo');
  } catch(e) { toast('❌ Erro ao salvar preço.', true); }
}

/* ═══════════ RELATÓRIO DO DIA ═══════════ */
function renderRelatorioTab(){
  S.relData = S.relData || hojeLocal();
  $('content').innerHTML = `
    <div class="sec-title">Relatório de comandas</div>
    <input class="search-inp" id="relDataInp" type="date" value="${S.relData}" onchange="mudarDataRelatorio(this.value)"/>
    <div class="card"><div id="relLista">Carregando…</div></div>
    <div class="total-box" id="relTotalBox" style="display:none"><span style="font-size:13px;font-weight:700">Total do dia</span><span id="relTotalTxt" style="font-size:17px;font-weight:900"></span></div>
    <div id="relFormasBox"></div>
  `;
  carregarRelatorio();
}

function mudarDataRelatorio(v){ S.relData = v; carregarRelatorio(); }

async function carregarRelatorio(){
  try {
    S.relRows = await sb(`gn_comandas?loja=eq.${encodeURIComponent(S.loja)}&data_operacao=eq.${S.relData}&status=eq.fechada&select=id,mesa,valor_total,forma_pagamento,fechada_em,fechada_por,aberta_por&order=fechada_em`);
  } catch(e) { S.relRows = []; toast('⚠️ Erro ao carregar relatório.', true); }
  const lista = $('relLista');
  if (!lista) return;
  if (!S.relRows.length) { lista.innerHTML = '<div style="text-align:center;color:rgba(0,0,0,.4);font-size:12px;padding:14px 0">Nenhuma comanda fechada nesse dia.</div>'; $('relTotalBox').style.display='none'; $('relFormasBox').innerHTML=''; return; }
  lista.innerHTML = S.relRows.map(c => {
    const hora = new Date(c.fechada_em).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    const formasTxt = (c.forma_pagamento||[]).map(f=>f.forma).join(' + ') || '—';
    return `<div class="rel-row">
      <div>
        <div class="rel-mesa">Mesa ${c.mesa}</div>
        <div class="rel-meta">${hora} · ${escapeHtml(c.fechada_por||'—')} · ${formasTxt}</div>
      </div>
      <div style="display:flex;align-items:center">
        <span class="rel-valor">${money(c.valor_total)}</span>
        ${podeAdmin() ? `<button class="rel-reabrir" onclick="reabrirComanda('${c.id}')">reabrir</button>` : ''}
      </div>
    </div>`;
  }).join('');
  const total = S.relRows.reduce((s,c)=>s+(parseFloat(c.valor_total)||0),0);
  $('relTotalBox').style.display = 'flex';
  $('relTotalTxt').textContent = money(total);
  const porForma = {};
  S.relRows.forEach(c => (c.forma_pagamento||[]).forEach(f => { porForma[f.forma] = (porForma[f.forma]||0) + (parseFloat(f.valor)||0); }));
  const lbl = { dinheiro:'💵 Dinheiro', cartao:'💳 Cartão', pix:'🔑 Pix' };
  $('relFormasBox').innerHTML = Object.keys(porForma).length ? `<div class="sec-title">Por forma de pagamento</div><div class="card">${
    Object.entries(porForma).map(([k,v]) => `<div class="rel-row"><span class="rel-mesa" style="font-size:12px">${lbl[k]||k}</span><span class="rel-valor">${money(v)}</span></div>`).join('')
  }</div>` : '';
}

async function reabrirComanda(id){
  if (!confirm('Reabrir essa comanda? Ela volta pra mesa como aberta.')) return;
  try {
    await sb(`gn_comandas?id=eq.${id}`, { method:'PATCH', body:{ status:'aberta', fechada_em:null, fechada_por:null } });
    toast('✅ Comanda reaberta.');
    carregarRelatorio();
  } catch(e) { toast('❌ Erro ao reabrir comanda.', true); }
}

/* ═══════════ UTIL ═══════════ */
function escapeHtml(str){
  if (str == null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ═══════════ INIT ═══════════ */
tentarSessaoSalva();
</script>
</body>
</html>
