  ],
  "Cozinha": [
    { t: "Fidelidade \xE0 Ficha T\xE9cnica", o: [{ p: 5, tx: "Segue 100% a ficha t\xE9cnica com gramatura correta. Prato id\xEAntico ao padr\xE3o." }, { p: 4, tx: "Respeita a ficha t\xE9cnica com varia\xE7\xF5es m\xEDnimas que n\xE3o afetam o resultado final." }, { p: 3, tx: "Segue as fichas na maioria das vezes, mas improvisa em itens pontuais." }, { p: 2, tx: "Improvisa com frequ\xEAncia. Pratos saem fora do padr\xE3o de por\xE7\xE3o e apresenta\xE7\xE3o." }, { p: 1, tx: "N\xE3o usa ficha t\xE9cnica. Cada prato sai diferente do outro." }] },
    { t: "Tempo de Produ\xE7\xE3o dos Pratos", o: [{ p: 5, tx: "Entrega todos os pratos dentro do tempo ideal. Nunca atrasa mesmo com sal\xE3o cheio." }, { p: 4, tx: "Tempo bom na maior parte. Atrasos m\xEDnimos apenas em picos extremos." }, { p: 3, tx: "Tempo razo\xE1vel. Atrasa em dias de alto volume, mas sem causar grande problema." }, { p: 2, tx: "Atrasos frequentes. Pedidos saem fora do tempo e clientes reclamam." }, { p: 1, tx: "Sempre atrasado. Comanda engarrafa e cozinha perde o controle no rush." }] },
    { t: "Limpeza e Organiza\xE7\xE3o da Pra\xE7a", o: [{ p: 5, tx: "Pra\xE7a sempre limpa durante e ap\xF3s o servi\xE7o. Higieniza bancada entre preparo." }, { p: 4, tx: "Mant\xE9m a pra\xE7a organizada. Pequenas sujeiras durante o rush s\xE3o resolvidas logo." }, { p: 3, tx: "Limpa ao final, mas durante o pico acumula sujeira na bancada." }, { p: 2, tx: "Pra\xE7a sempre suja e desorganizada. Precisa de cobran\xE7a para limpar." }, { p: 1, tx: "Nunca limpa a pra\xE7a. Trabalha em total desorganiza\xE7\xE3o e sujeira." }] },
    { t: "Controle de Desperd\xEDcio e Aproveitamento", o: [{ p: 5, tx: "Aproveitamento m\xE1ximo dos insumos. Quebra e perda abaixo da meta. Sem desperd\xEDcio." }, { p: 4, tx: "Bom aproveitamento. Pequenas perdas dentro do aceit\xE1vel." }, { p: 3, tx: "Desperd\xEDcio dentro da m\xE9dia. Pode melhorar em itens de alto custo." }, { p: 2, tx: "Alto \xEDndice de desperd\xEDcio. Joga fora insumos que poderiam ser aproveitados." }, { p: 1, tx: "Desperd\xEDcio cr\xEDtico. Custo de insumo elevado por falta de cuidado." }] },
    { t: "Higiene Pessoal e Manipula\xE7\xE3o de Alimentos", o: [{ p: 5, tx: "Lava as m\xE3os constantemente, usa EPI completo e segue todas as normas de vigil\xE2ncia." }, { p: 4, tx: "Boa higiene. Segue protocolos com poucas exce\xE7\xF5es rapidamente corrigidas." }, { p: 3, tx: "Higiene razo\xE1vel. Precisa de lembrete em situa\xE7\xF5es espec\xEDficas." }, { p: 2, tx: "Higiene abaixo do padr\xE3o. J\xE1 foi orientado mais de uma vez." }, { p: 1, tx: "N\xE3o cumpre normas de higiene. Risco de contamina\xE7\xE3o cruzada." }] },
    { t: "Qualidade e Apresenta\xE7\xE3o dos Pratos", o: [{ p: 5, tx: "Prato delicioso, bem apresentado e dentro do padr\xE3o visual sempre. Clientes elogiam." }, { p: 4, tx: "Boa qualidade e apresenta\xE7\xE3o. Pequenas varia\xE7\xF5es sem impacto na experi\xEAncia." }, { p: 3, tx: "Qualidade ok, mas apresenta\xE7\xE3o poderia ser mais caprichada." }, { p: 2, tx: "Qualidade oscilante. Pratos \xE0s vezes saem sem capricho na montagem." }, { p: 1, tx: "Pratos sem qualidade e sem apresenta\xE7\xE3o. Retornos frequentes da mesa." }] },
    { t: "Trabalho em Equipe na Cozinha", o: [{ p: 5, tx: "Colabora com todas as pra\xE7as. Ajuda colegas sem ser pedido e mant\xE9m harmonia." }, { p: 4, tx: "Boa integra\xE7\xE3o com a equipe. Colabora quando solicitado e mant\xE9m clima positivo." }, { p: 3, tx: "Trabalha bem na pr\xF3pria pra\xE7a, mas raramente ajuda outras esta\xE7\xF5es." }, { p: 2, tx: "Individualista. Conflitos ocasionais com colegas de cozinha." }, { p: 1, tx: "Cria confus\xE3o na cozinha. Atritos frequentes e recusa ajudar a equipe." }] },
    { t: "Controle de Temperatura e Armazenamento", o: [{ p: 5, tx: "Verifica temperatura dos equipamentos e faz armazenamento correto por categoria e PEPS." }, { p: 4, tx: "Bom controle de armazenamento. Segue PEPS e verifica temperatura com regularidade." }, { p: 3, tx: "Segue o b\xE1sico de armazenamento, mas tem falhas pontuais no PEPS." }, { p: 2, tx: "Armazenamento incorreto com frequ\xEAncia. J\xE1 houve produto fora do padr\xE3o de temperatura." }, { p: 1, tx: "N\xE3o controla temperatura nem armazenamento. Alto risco de perda e contamina\xE7\xE3o." }] },
    { t: "Proatividade no Mise en Place", o: [{ p: 5, tx: "Mise en place sempre completo antes do servi\xE7o. Nunca falta insumo preparado." }, { p: 4, tx: "Boa prepara\xE7\xE3o pr\xE9via. Raramente falta algo por descuido." }, { p: 3, tx: "Faz o mise en place do b\xE1sico. \xC0s vezes falta item por falta de antecipa\xE7\xE3o." }, { p: 2, tx: "Mise en place incompleto com frequ\xEAncia, gerando atraso no in\xEDcio do servi\xE7o." }, { p: 1, tx: "N\xE3o faz mise en place. Cozinha come\xE7a o servi\xE7o sem prepara\xE7\xE3o." }] },
    { t: "Cumprimento das Normas de Seguran\xE7a", o: [{ p: 5, tx: "Usa EPI, manuseia facas e equipamentos com total seguran\xE7a. Nunca gera risco." }, { p: 4, tx: "Boa postura de seguran\xE7a. Raridade de descuido com EPI ou equipamento." }, { p: 3, tx: "Segue normas b\xE1sicas, mas tem pontos de melhoria em equipamentos espec\xEDficos." }, { p: 2, tx: "Descuida de EPI ou manuseio seguro com alguma frequ\xEAncia." }, { p: 1, tx: "N\xE3o usa EPI, manuseio de facas perigoso. Risco real de acidente." }] }
  ],
  "Gar\xE7om/Gar\xE7onete": [
    { t: "Simpatia e Abordagem ao Cliente", o: [{ p: 5, tx: "Sempre sorridente, cumprimenta todos e cria conex\xE3o genu\xEDna com o cliente." }, { p: 4, tx: "Abordagem simp\xE1tica e cort\xEAs na grande maioria das mesas." }, { p: 3, tx: "Atende de forma educada, mas sem calor humano. Cliente n\xE3o se sente especial." }, { p: 2, tx: "Abordagem fria ou impaciente com clientes em determinados momentos." }, { p: 1, tx: "Atende de cara fechada. J\xE1 recebeu reclama\xE7\xE3o formal de clientes." }] },
    { t: "Conhecimento do Card\xE1pio", o: [{ p: 5, tx: "Conhece todos os pratos, bebidas, ingredientes e alerg\xEAnicos. Faz sugest\xF5es certeiras." }, { p: 4, tx: "Conhece bem o card\xE1pio e responde a maioria das d\xFAvidas com seguran\xE7a." }, { p: 3, tx: "Conhece os pratos principais, mas tem d\xFAvidas em itens sazonais ou especiais." }, { p: 2, tx: "Conhecimento limitado. Precisa verificar com a cozinha ou lideran\xE7a com frequ\xEAncia." }, { p: 1, tx: "N\xE3o sabe o card\xE1pio. N\xE3o consegue responder perguntas b\xE1sicas do cliente." }] },
    { t: "Agilidade no Atendimento das Mesas", o: [{ p: 5, tx: "Nenhuma mesa esquecida. Atende com agilidade mesmo gerenciando v\xE1rias mesas." }, { p: 4, tx: "Atendimento \xE1gil na maioria do tempo. Mesas raramente esperam al\xE9m do ideal." }, { p: 3, tx: "Atendimento regular. \xC0s vezes demora para ver a mesa em momentos de pico." }, { p: 2, tx: "Clientes frequentemente esperando. Mesas esquecidas com alguma regularidade." }, { p: 1, tx: "Mesas abandonadas. Clientes precisam levantar para chamar o gar\xE7om." }] },
    { t: "Lan\xE7amento Correto dos Pedidos", o: [{ p: 5, tx: "Zero erro de lan\xE7amento. Pedido sempre correto, com observa\xE7\xF5es e modifica\xE7\xF5es anotadas." }, { p: 4, tx: "Raramente erra pedido. Quando acontece, resolve com agilidade e sem atrito." }, { p: 3, tx: "Erra ocasionalmente. Resolve na maioria das vezes sem grande problema." }, { p: 2, tx: "Erros frequentes de pedido. Clientes recebem prato errado com regularidade." }, { p: 1, tx: "Muitos erros de pedido. Clientes frustrados e cozinha retrabalha." }] },
    { t: "Venda Sugestiva (Entradas, Sobremesas, Bebidas)", o: [{ p: 5, tx: "Oferece entradas, sobremesas e bebidas naturalmente. Aumenta ticket com leveza." }, { p: 4, tx: "Faz sugest\xF5es na maioria das mesas. Boa taxa de convers\xE3o." }, { p: 3, tx: "Oferece quando se lembra. N\xE3o \xE9 consistente na abordagem de venda." }, { p: 2, tx: "Raramente sugere. Tem vergonha ou receio de oferecer itens adicionais." }, { p: 1, tx: "Nunca faz venda sugestiva. S\xF3 anota o que o cliente pede." }] },
    { t: "Organiza\xE7\xE3o e Limpeza das Mesas", o: [{ p: 5, tx: "Mesas sempre limpas, organizadas e repostas entre clientes sem precisar ser lembrado." }, { p: 4, tx: "Boa manuten\xE7\xE3o das mesas. Organiza com regularidade durante o servi\xE7o." }, { p: 3, tx: "Limpa quando percebe ou quando cliente sinaliza. Razo\xE1vel." }, { p: 2, tx: "Mesas ficam com restos ou sem reposi\xE7\xE3o de itens com frequ\xEAncia." }, { p: 1, tx: "Mesas sujas e sem mise en place. Clientes incomodados." }] },
    { t: "Acompanhamento do Tempo dos Pedidos", o: [{ p: 5, tx: "Acompanha o tempo dos pedidos e informa o cliente sobre o prazo com proatividade." }, { p: 4, tx: "Boa gest\xE3o do tempo dos pedidos. Raramente cliente reclama de demora." }, { p: 3, tx: "\xC0s vezes esquece de acompanhar o pedido e cliente precisa perguntar." }, { p: 2, tx: "Pedidos atrasam por falta de acompanhamento do gar\xE7om na comanda." }, { p: 1, tx: "N\xE3o acompanha pedidos. Clientes reclamam de tempo e esquecimento." }] },
    { t: "Trabalho em Equipe no Sal\xE3o", o: [{ p: 5, tx: "Ajuda colegas sem ser pedido, divide mesas em situa\xE7\xF5es de press\xE3o." }, { p: 4, tx: "Colabora bem com a equipe. Ajuda quando solicitado sem reclamar." }, { p: 3, tx: "Foca nas pr\xF3prias mesas. Ajuda eventualmente mas n\xE3o \xE9 proativo." }, { p: 2, tx: "Pouco colaborativo. S\xF3 cuida das pr\xF3prias mesas, mesmo quando colegas precisam." }, { p: 1, tx: "Cria conflito no sal\xE3o. N\xE3o colabora e gera atrito com a equipe." }] },
    { t: "Fechamento da Conta com o Cliente", o: [{ p: 5, tx: "Fecha a conta com agilidade, confere valores, oferece troco e agradece o cliente." }, { p: 4, tx: "Fechamento correto na maior parte das vezes. Erros resolvidos sem tens\xE3o." }, { p: 3, tx: "Fecha a conta, mas \xE0s vezes demora ou esquece de verificar o total." }, { p: 2, tx: "Lento no fechamento, j\xE1 confundiu valores e causou constrangimento." }, { p: 1, tx: "Fechamento desorganizado. Causa atrito com cliente na conta." }] },
    { t: "Postura Profissional Durante o Servi\xE7o", o: [{ p: 5, tx: "Postura impec\xE1vel: sem celular, atento ao sal\xE3o, proativo e sempre dispon\xEDvel." }, { p: 4, tx: "Boa postura. Pequenas distra\xE7\xF5es pontuais sem impacto no atendimento." }, { p: 3, tx: "Postura razo\xE1vel. \xC0s vezes distra\xEDdo, mas corrige quando chamado aten\xE7\xE3o." }, { p: 2, tx: "Usa celular durante o servi\xE7o ou some nos momentos de pico." }, { p: 1, tx: "Sem postura profissional. Desaparece, fica no celular e ignora as mesas." }] }
  ],
  "ASG": [
    { t: "Limpeza do Sal\xE3o durante o Servi\xE7o", o: [{ p: 5, tx: "Sal\xE3o sempre limpo mesmo durante o rush. Varre e organiza entre uma mesa e outra." }, { p: 4, tx: "Sal\xE3o limpo na maior parte do servi\xE7o. Pequenos descuidos resolvidos rapidamente." }, { p: 3, tx: "Limpa com regularidade, mas acumula algumas \xE1reas em momentos de pico." }, { p: 2, tx: "Sal\xE3o suja durante o servi\xE7o. Precisa ser cobrado para agir." }, { p: 1, tx: "Sal\xE3o sujo durante todo o servi\xE7o. N\xE3o age sem ser mandado repetidamente." }] },
    { t: "Limpeza dos Banheiros", o: [{ p: 5, tx: "Banheiros sempre limpos, abastecidos e cheirosos. Vistoria frequente sem cobrar." }, { p: 4, tx: "Banheiros em boa condi\xE7\xE3o na maior parte do tempo. Raridade de reclama\xE7\xE3o." }, { p: 3, tx: "Limpa os banheiros, mas nem sempre no tempo certo. Precisa de lembrete \xE0s vezes." }, { p: 2, tx: "Banheiros frequentemente sem papel ou sujos. Reclama\xE7\xE3o de clientes ocorreu." }, { p: 1, tx: "Banheiros descuidados. Clientes reclamam com regularidade da limpeza." }] },
    { t: "Limpeza da \xC1rea de Cozinha e Copa", o: [{ p: 5, tx: "Cozinha e copa sempre limpas. Higieniza ch\xE3o, paredes e ralos sem ser pedido." }, { p: 4, tx: "Boa limpeza das \xE1reas internas. Pequenos pontos n\xE3o cobertos de forma espor\xE1dica." }, { p: 3, tx: "Limpa o b\xE1sico das \xE1reas internas. Ralos e cantos acumulam em alguns dias." }, { p: 2, tx: "Limpeza superficial nas \xE1reas internas. Cozinha suja ap\xF3s o servi\xE7o com frequ\xEAncia." }, { p: 1, tx: "Nunca limpa cozinha ou copa sem ser mandado. Situa\xE7\xE3o sanit\xE1ria preocupante." }] },
    { t: "Descarte Correto do Lixo", o: [{ p: 5, tx: "Faz o descarte no tempo certo, separa res\xEDduos e mant\xE9m lixeiras limpas e sem odor." }, { p: 4, tx: "Descarta corretamente na maioria das vezes. Raridade de atraso ou erro de separa\xE7\xE3o." }, { p: 3, tx: "Descarta no prazo, mas nem sempre faz a separa\xE7\xE3o correta dos res\xEDduos." }, { p: 2, tx: "Lixeiras acumulam res\xEDduos e transbordamento. Descarte com atraso frequente." }, { p: 1, tx: "N\xE3o controla o lixo. Lixeiras cheias, odor e risco sanit\xE1rio." }] },
    { t: "Organiza\xE7\xE3o de Dep\xF3sito e \xC1rea de Servi\xE7o", o: [{ p: 5, tx: "Dep\xF3sito sempre organizado, materiais separados e identificados por categoria." }, { p: 4, tx: "Boa organiza\xE7\xE3o do dep\xF3sito. Raridade de item fora do lugar." }, { p: 3, tx: "Organiza\xE7\xE3o razo\xE1vel. \xC0s vezes dificulta localizar material de limpeza." }, { p: 2, tx: "Dep\xF3sito bagun\xE7ado. Dificulta trabalho da equipe e gera desperd\xEDcio de produto." }, { p: 1, tx: "Dep\xF3sito em total desordem. Material perdido e produto desperdi\xE7ado." }] },
    { t: "Proatividade nas Tarefas", o: [{ p: 5, tx: "Enxerga o que precisa fazer e age antes de ser pedido. Sempre \xE0 frente da sujeira." }, { p: 4, tx: "Proativo na maioria das situa\xE7\xF5es. Raridade de precisar cobrar." }, { p: 3, tx: "Faz o que \xE9 pedido, mas dificilmente age por conta pr\xF3pria." }, { p: 2, tx: "S\xF3 age quando cobrado diretamente. Sem iniciativa pr\xF3pria." }, { p: 1, tx: "Sem proatividade. Precisa ser mandado para cada tarefa individualmente." }] },
    { t: "Uso Correto dos Produtos de Limpeza", o: [{ p: 5, tx: "Usa dosagem correta de cada produto, sabe onde aplicar e evita desperd\xEDcio e risco." }, { p: 4, tx: "Bom uso dos produtos. Pequenos excessos eventuais sem grande impacto." }, { p: 3, tx: "Usa os produtos b\xE1sicos corretamente, mas exagera em dosagem \xE0s vezes." }, { p: 2, tx: "Mistura produtos ou usa em excesso. J\xE1 houve risco de dano a superf\xEDcie ou sa\xFAde." }, { p: 1, tx: "N\xE3o sabe usar os produtos corretamente. Usa de forma perigosa ou ineficiente." }] },
    { t: "Higiene Pessoal durante o Trabalho", o: [{ p: 5, tx: "Uniforme limpo, luvas nos momentos certos e higiene pessoal impec\xE1vel." }, { p: 4, tx: "Boa higiene pessoal. Usa luvas e EPI corretamente na maioria do tempo." }, { p: 3, tx: "Higiene razo\xE1vel. \xC0s vezes sem EPI adequado em situa\xE7\xF5es que exigem." }, { p: 2, tx: "Higiene abaixo do esperado. EPI esquecido com frequ\xEAncia." }, { p: 1, tx: "N\xE3o usa EPI, higiene prec\xE1ria. Risco de contamina\xE7\xE3o cruzada." }] },
    { t: "Agilidade na Retirada de Mesas Usadas", o: [{ p: 5, tx: "Retira lou\xE7as e limpa mesas imediatamente ap\xF3s o cliente sair. Sem espera." }, { p: 4, tx: "Retirada \xE1gil na maioria das vezes. Mesas livres rapidamente para novo cliente." }, { p: 3, tx: "Demora um pouco para retirar, mas mesa fica dispon\xEDvel sem causar fila." }, { p: 2, tx: "Mesas ocupadas com restos por tempo prolongado. Clientes em espera reclamam." }, { p: 1, tx: "Mesas ficam sujas por longos per\xEDodos. Gera fila desnecess\xE1ria e reclama\xE7\xF5es." }] },
    { t: "Postura e Comprometimento Geral", o: [{ p: 5, tx: "Comprometido, discreto e eficiente. Trabalha com orgulho e sem precisar de supervis\xE3o constante." }, { p: 4, tx: "Bom comprometimento. Eventuais desvios corrigidos rapidamente." }, { p: 3, tx: "Faz o b\xE1sico. N\xE3o vai al\xE9m, mas tamb\xE9m n\xE3o compromete o servi\xE7o." }, { p: 2, tx: "Desatento e pouco comprometido. Precisa de cobran\xE7as constantes." }, { p: 1, tx: "Sem comprometimento. Foge de tarefas e precisa de supervis\xE3o em tudo." }] }
  ],
  "Estoquista": [
    { t: "Organiza\xE7\xE3o por Validade (PEPS/PVPS)", o: [{ p: 5, tx: "Aplica PEPS rigorosamente. Zero produto vencido. Rota\xE7\xE3o exemplar de estoque." }, { p: 4, tx: "Boa aplica\xE7\xE3o do PEPS. Raridade de produto fora da ordem de validade." }, { p: 3, tx: "Aplica PEPS no b\xE1sico, mas tem falhas pontuais em categorias espec\xEDficas." }, { p: 2, tx: "PEPS inconsistente. J\xE1 houve produto vencido por falta de rota\xE7\xE3o." }, { p: 1, tx: "N\xE3o usa PEPS. Produtos vencem com frequ\xEAncia por falta de organiza\xE7\xE3o." }] },
    { t: "Confer\xEAncia de Recebimento de Mercadorias", o: [{ p: 5, tx: "Confere tudo: peso, validade, temperatura, nota fiscal e qualidade visual sem exce\xE7\xE3o." }, { p: 4, tx: "Confer\xEAncia rigorosa na maioria dos recebimentos. Pequenas falhas eventuais." }, { p: 3, tx: "Confere o b\xE1sico, mas pode deixar passar item com diverg\xEAncia em dias cheios." }, { p: 2, tx: "Confer\xEAncia superficial. J\xE1 recebeu produto com diverg\xEAncia de peso ou validade." }, { p: 1, tx: "N\xE3o confere o recebimento. Mercadoria entra sem qualquer verifica\xE7\xE3o." }] },
    { t: "Controle de Invent\xE1rio", o: [{ p: 5, tx: "Invent\xE1rio sempre preciso. Diverg\xEAncias abaixo de 1%. Registros organizados e atualizados." }, { p: 4, tx: "Bom controle de invent\xE1rio. Diverg\xEAncias m\xEDnimas dentro da margem aceit\xE1vel." }, { p: 3, tx: "Invent\xE1rio razo\xE1vel. Algumas diverg\xEAncias que s\xE3o identificadas na contagem." }, { p: 2, tx: "Diverg\xEAncias frequentes no invent\xE1rio. Dificulta a gest\xE3o de compras." }, { p: 1, tx: "Invent\xE1rio inexato ou n\xE3o atualizado. Imposs\xEDvel confiar nos dados de estoque." }] },
    { t: "Comunica\xE7\xE3o de Ruptura (Falta de Produto)", o: [{ p: 5, tx: "Avisa a lideran\xE7a antes de chegar \xE0 ruptura. Nunca falta insumo por falta de comunica\xE7\xE3o." }, { p: 4, tx: "Comunica rupturas com anteced\xEAncia razo\xE1vel. Raridade de imprevisto." }, { p: 3, tx: "Avisa quando percebe, mas \xE0s vezes a comunica\xE7\xE3o chega tarde." }, { p: 2, tx: "J\xE1 houve falta de insumo no servi\xE7o por atraso na comunica\xE7\xE3o do estoquista." }, { p: 1, tx: "N\xE3o avisa rupturas. Cozinha descobriu falta de produto no meio do servi\xE7o." }] },
    { t: "Organiza\xE7\xE3o F\xEDsica do Estoque", o: [{ p: 5, tx: "Estoque limpo, identificado, separado por categoria e de f\xE1cil localiza\xE7\xE3o para qualquer um." }, { p: 4, tx: "Boa organiza\xE7\xE3o. Item quase sempre f\xE1cil de localizar." }, { p: 3, tx: "Organiza\xE7\xE3o razo\xE1vel. Algumas categorias desorganizadas ou sem identifica\xE7\xE3o." }, { p: 2, tx: "Estoque bagun\xE7ado. Dif\xEDcil localizar itens. Gera perda de tempo da equipe." }, { p: 1, tx: "Estoque em total desordem. Produto perdido e vencido por falta de organiza\xE7\xE3o." }] },
    { t: "Controle de Temperatura de C\xE2maras", o: [{ p: 5, tx: "Verifica temperatura de c\xE2maras e registra diariamente. Alertas imediatos em caso de falha." }, { p: 4, tx: "Verifica temperatura com regularidade. Raridade de falha sem comunica\xE7\xE3o." }, { p: 3, tx: "Verifica com alguma regularidade, mas sem registro sistem\xE1tico." }, { p: 2, tx: "Verifica\xE7\xE3o irregular. J\xE1 houve perda de produto por falta de monitoramento." }, { p: 1, tx: "N\xE3o verifica temperatura. Alto risco de perda e contamina\xE7\xE3o de produtos." }] },
    { t: "Registro de Entradas e Sa\xEDdas", o: [{ p: 5, tx: "Registra todas as entradas e sa\xEDdas corretamente e em tempo real. Dados confi\xE1veis." }, { p: 4, tx: "Registro correto na maioria dos casos. Eventuais atrasos sem impacto relevante." }, { p: 3, tx: "Registra, mas com atrasos ou imprecis\xF5es que precisam ser corrigidas depois." }, { p: 2, tx: "Registros incompletos ou incorretos com frequ\xEAncia. Dificulta o CMV." }, { p: 1, tx: "N\xE3o registra entradas e sa\xEDdas. Gest\xE3o de estoque imposs\xEDvel de realizar." }] },

  "Recepcionista": [

    { t: "Cortesia e Resolu\xE7\xE3o de Conflitos na Entrada", o: [{ p: 5, tx: "Resolve conflitos na fila com tranquilidade, sem expor cliente e sem chamar gerente." }, { p: 4, tx: "Boa postura em situa\xE7\xF5es dif\xEDceis. Resolve a maioria sem escalar." }, { p: 3, tx: "Lida razoavelmente com conflitos, mas \xE0s vezes precisa acionar o gerente." }, { p: 2, tx: "Dificuldade em lidar com clientes insatisfeitos. Clima tenso com frequ\xEAncia." }, { p: 1, tx: "Sem habilidade para conflitos. Piora a situa\xE7\xE3o ao inv\xE9s de resolver." }] },

    { t: "Comunica\xE7\xE3o com o Sal\xE3o e Cozinha", o: [{ p: 5, tx: "Comunica lota\xE7\xE3o, demanda e situa\xE7\xF5es especiais proativamente ao sal\xE3o e cozinha." }, { p: 4, tx: "Boa comunica\xE7\xE3o interna. Informa a equipe com regularidade." }, { p: 3, tx: "Comunica o b\xE1sico. Pode falhar em situa\xE7\xF5es de maior complexidade." }, { p: 2, tx: "Comunica\xE7\xE3o falha. Sal\xE3o e cozinha frequentemente pegos de surpresa." }, { p: 1, tx: "N\xE3o comunica nada. A equipe n\xE3o tem visibilidade da situa\xE7\xE3o da entrada." }] },

  "Sub-Gerente": [

const calcNota = (av) => (av.pontualidade || 0) + (av.uniforme || 0) + (av.criteriosSetor || []).reduce((a, v) => a + (v || 0), 0);
const maxNota = (av) => 10 + (av.cargo && SETORES[av.cargo] ? 50 : 0);
const pct = (av) => {
  const mx = maxNota(av);
  return mx > 0 ? calcNota(av) / mx * 100 : 0;
};
const resultado = (p) => {
  if (p >= 85) return { label: "\u{1F947} FUNCION\xC1RIO OURO", sub: "Pronto para b\xF4nus, promo\xE7\xF5es ou novas fun\xE7\xF5es.", cor: C.gold };
