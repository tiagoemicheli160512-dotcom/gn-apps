<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>GN Apps</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{background:#0e0e1a;color:#E2E8F4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden}

    /* ── LOGIN ── */
    #login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;gap:0}
    .login-logo{font-size:52px;font-weight:900;color:#F26419;letter-spacing:-3px;line-height:1}
    .login-tagline{font-size:13px;color:#666;margin-top:6px;margin-bottom:36px;letter-spacing:1px;text-transform:uppercase}
    .login-card{background:#141420;border:1px solid #252538;border-radius:18px;padding:28px 24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
    .login-title{font-size:16px;font-weight:700;color:#E2E8F4;text-align:center;margin-bottom:4px}
    .login-input{background:#0e0e1a;border:1px solid #2d2d45;border-radius:10px;padding:13px 16px;font-size:15px;color:#E2E8F4;width:100%;font-family:inherit;outline:none;transition:border-color .15s}
    .login-input:focus{border-color:#F26419}
    .login-input::placeholder{color:#44445a}
    .login-btn{background:#F26419;color:#fff;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:opacity .15s;letter-spacing:.3px}
    .login-btn:hover{opacity:.88}
    .login-btn:active{opacity:.75}
    .login-btn:disabled{opacity:.5;cursor:default}
    .login-error{color:#f87171;font-size:13px;min-height:18px;text-align:center}

    /* ── HOME ── */
    #home-screen{display:none;flex-direction:column;min-height:100vh}
    .home-header{position:sticky;top:0;z-index:100;background:rgba(14,14,26,.95);backdrop-filter:blur(10px);border-bottom:1px solid #1e1e2e;padding:12px 16px;display:flex;align-items:center;gap:10px}
    .hdr-logo{font-size:22px;font-weight:900;color:#F26419;letter-spacing:-1px;line-height:1;flex-shrink:0}
    .hdr-divider{width:1px;height:20px;background:#252538;flex-shrink:0}
    .hdr-info{flex:1;min-width:0}
    .hdr-nome{font-size:13px;font-weight:700;color:#E2E8F4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .hdr-loja{font-size:11px;color:#888;margin-top:1px}
    .hdr-logout{background:transparent;border:1px solid #2d2d45;border-radius:8px;padding:6px 12px;font-size:12px;color:#aaa;font-family:inherit;cursor:pointer;flex-shrink:0;transition:border-color .15s,color .15s}
    .hdr-logout:hover{border-color:#F26419;color:#F26419}

    .home-hero{padding:20px 16px 12px;background:linear-gradient(180deg,#121222 0%,transparent 100%)}
    .hero-greeting{font-size:20px;font-weight:800;color:#E2E8F4;line-height:1.2}
    .hero-sub{font-size:13px;color:#666;margin-top:4px}

    .home-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px 24px}
    @media(min-width:480px){.home-grid{grid-template-columns:1fr 1fr 1fr}}

    .mod-card{background:#141420;border:1px solid #1e1e2e;border-radius:16px;padding:18px 14px 14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:border-color .15s,transform .1s,background .15s;user-select:none;position:relative;overflow:hidden}
    .mod-card:not(.disabled):active{transform:scale(.96);background:#1a1a2e}
    .mod-card:not(.disabled):hover{border-color:#2d2d50}
    .mod-card.disabled{opacity:.38;cursor:not-allowed}
    .mod-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:16px 16px 0 0;background:var(--accent,#333)}
    .card-icon{font-size:28px;line-height:1;margin-bottom:2px}
    .card-name{font-size:14px;font-weight:800;color:#E2E8F4;line-height:1.2}
    .card-sub{font-size:11px;color:#555;line-height:1.3}
    .card-badge{margin-top:4px;display:inline-flex;align-items:center;background:rgba(255,255,255,.06);border-radius:6px;padding:3px 8px;font-size:10px;font-weight:700;color:#888;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .badge-green{background:rgba(34,197,94,.12);color:#22c55e}
    .badge-orange{background:rgba(242,100,25,.12);color:#F26419}
    .badge-blue{background:rgba(59,130,246,.12);color:#60a5fa}
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-logo">GN</div>
  <div class="login-tagline">Sistema de Gestão</div>
  <div class="login-card">
    <div class="login-title">Entrar</div>
    <input id="inp-nome" class="login-input" type="text" placeholder="Nome de usuário" autocomplete="username" autocorrect="off" autocapitalize="none" onkeydown="if(event.key==='Enter')document.getElementById('inp-senha').focus()">
    <input id="inp-senha" class="login-input" type="password" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <div id="login-erro" class="login-error"></div>
    <button id="login-btn" class="login-btn" onclick="doLogin()">Entrar →</button>
  </div>
</div>

<!-- HOME -->
<div id="home-screen">
  <header class="home-header">
    <div class="hdr-logo">GN</div>
    <div class="hdr-divider"></div>
    <div class="hdr-info">
      <div class="hdr-nome" id="hdr-nome">—</div>
      <div class="hdr-loja" id="hdr-loja">—</div>
    </div>
    <button class="hdr-logout" onclick="doLogout()">Sair</button>
  </header>
  <div class="home-hero">
    <div class="hero-greeting" id="hero-greeting">Olá!</div>
    <div class="hero-sub" id="hero-sub">Selecione um módulo para continuar</div>
  </div>
  <div class="home-grid" id="module-grid"></div>
</div>

<script>
const SB_URL = "https://ncxttwvpafajnilpjbol.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jeHR0d3ZwYWZham5pbHBqYm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4NDcyMDEsImV4cCI6MjA5NzQyMzIwMX0.MGDZNGY8GfSzBKAgdR7OhvOeR71i4fj9YseJRhoh5sE";
const SESSION_KEY = 'gn_session_v1';
const TTL = 43200000; // 12h

const LOJA_DISPLAY = {
  'BANGU':'Bangu','CAXIAS':'Caxias','SÃO GONÇALO':'São Gonçalo',
  'NORTE SHOPPING':'Norte Shopping','BOULEVARD':'Boulevard','RANCHO':'Rancho',
  'PEDREIRA':'Pedreira','NOVA AMERICA':'Nova América','CAMPO GRANDE':'Campo Grande',
  'ITAQUERA':'Itaquera','GUARULHOS':'Guarulhos','GERAL':'Mestre'
};

// gn_usuarios.loja → gn_comissoes LOJA key
const LOJA_COM_KEY = {
  'BANGU':'BANGU','CAXIAS':'CAXIAS','SÃO GONÇALO':'SAO_GONCALO',
  'NORTE SHOPPING':'NORTE','BOULEVARD':'BOULEVARD','RANCHO':'RANCHO',
  'PEDREIRA':'PEDREIRA','NOVA AMERICA':'NOVA_AMERICA',
  'CAMPO GRANDE':'CAMPO_GRANDE','ITAQUERA':'ITAQUERA','GUARULHOS':'GUARULHOS'
};

const MODULES = [
  {id:'checklist', name:'Check-list',  sub:'Operacional diário',   icon:'✅', perm:'checklist', url:'gn-checklist.html',        accent:'#3b82f6'},
  {id:'avaliacoes',name:'Avaliações',  sub:'Desempenho da equipe', icon:'⭐', perm:'avaliacoes',url:'gn-avaliacoes.html',       accent:'#f59e0b'},
  {id:'comissoes', name:'Comissões',   sub:'Folha semanal',        icon:'💰', perm:'comissoes', url:'gn-comissoes.html',        accent:'#10b981'},
  {id:'estoque',   name:'Estoque',     sub:'Inventário e pedidos', icon:'📦', perm:'estoque',   url:'gn-estoque.html',          accent:'#8b5cf6'},
  {id:'lojas',     name:'Lojas',       sub:'Ficha operacional',    icon:'🏪', perm:'lojas',     url:'gn-lojas.html',            accent:'#ec4899'},
  {id:'mestra',    name:'Comissões Mestra', sub:'Todas as lojas',  icon:'🏆', perm:'master',    url:'gn-comissoes-mestra.html', accent:'#F26419', masterOnly:true},
];

let session = null;
try {
  const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
  if (s && Date.now() - s.ts < TTL) session = s;
} catch(e) {}

if (session) showHome(session);
else showLoginScreen();

function showLoginScreen() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('home-screen').style.display  = 'none';
  setTimeout(() => document.getElementById('inp-nome').focus(), 100);
}

function showHome(sess) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('home-screen').style.display  = 'flex';
  const disp = LOJA_DISPLAY[sess.loja] || sess.loja;
  const first = sess.nome.split(' ')[0];
  const h = new Date().getHours();
  const saudacao = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
  document.getElementById('hdr-nome').textContent  = sess.nome;
  document.getElementById('hdr-loja').textContent  = disp;
  document.getElementById('hero-greeting').textContent = saudacao + ', ' + first + '!';
  document.getElementById('hero-sub').textContent  = disp === 'Mestre' ? 'Acesso a todas as lojas' : 'Loja ' + disp;
  renderModules(sess);
  loadBadges(sess);
}

async function doLogin() {
  const nome  = document.getElementById('inp-nome').value.trim();
  const senha = document.getElementById('inp-senha').value;
  const erroEl = document.getElementById('login-erro');
  const btn    = document.getElementById('login-btn');
  erroEl.textContent = '';
  if (!nome || !senha) { erroEl.textContent = 'Preencha usuário e senha.'; return; }
  btn.textContent = 'Verificando...'; btn.disabled = true;
  try {
    const res = await fetch(
      `${SB_URL}/rest/v1/gn_usuarios?nome=eq.${encodeURIComponent(nome)}&senha=eq.${encodeURIComponent(senha)}&ativo=eq.true`,
      { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY } }
    );
    const data = await res.json();
    if (!data || !data.length) {
      erroEl.textContent = '❌ Nome ou senha incorretos.';
      btn.textContent = 'Entrar →'; btn.disabled = false;
      return;
    }
    const u = data[0];
    session = { id: u.id, nome: u.nome, loja: u.loja, cargo: u.cargo, permissoes: u.permissoes || {}, ts: Date.now() };
    localStorage.setItem(SESSION_KEY, JSON.stringify(session));
    btn.textContent = 'Entrar →'; btn.disabled = false;
    showHome(session);
  } catch(e) {
    erroEl.textContent = '⚠️ Erro de conexão. Tente novamente.';
    btn.textContent = 'Entrar →'; btn.disabled = false;
  }
}

function doLogout() {
  localStorage.removeItem(SESSION_KEY);
  // Clear bridge keys
  try {
    localStorage.removeItem('gn_aval_bridge');
    localStorage.removeItem('gn_comissoes_bridge');
  } catch(e) {}
  session = null;
  document.getElementById('inp-nome').value = '';
  document.getElementById('inp-senha').value = '';
  showLoginScreen();
}

function renderModules(sess) {
  const perms = sess.permissoes || {};
  const isMaster = sess.loja === 'GERAL' || !!perms.master;
  const grid = document.getElementById('module-grid');
  grid.innerHTML = MODULES
    .filter(m => !m.masterOnly || isMaster)
    .map(m => {
      const enabled = !!perms[m.perm];
      const style = `--accent:${m.accent}`;
      const onclick = enabled ? `openModule('${m.url}','${m.id}')` : '';
      return `<div class="mod-card${enabled?'':' disabled'}" style="${style}" onclick="${onclick}">
        <div class="card-icon">${m.icon}</div>
        <div class="card-name">${m.name}</div>
        <div class="card-sub">${m.sub}</div>
        <div class="card-badge" id="badge-${m.id}">${enabled ? '⋯' : 'Sem acesso'}</div>
      </div>`;
    }).join('');
}

function plantBridge(moduleId) {
  if (!session) return;
  const loja = session.loja;
  const lojaDisp = LOJA_DISPLAY[loja] || loja;
  const isMaster = loja === 'GERAL' || !!session.permissoes?.master;
  const ts = Date.now();

  if (moduleId === 'checklist' && !isMaster) {
    localStorage.setItem('gn_chk_user_' + lojaDisp, JSON.stringify({
      id: session.id, nome: session.nome, cargo: session.cargo,
      loja, lojaDisplay: lojaDisp
    }));
  }

  if (moduleId === 'avaliacoes') {
    localStorage.setItem('gn_aval_bridge', JSON.stringify({
      loja: lojaDisp, isMaster, nome: session.nome, ts
    }));
  }

  if (moduleId === 'comissoes' && !isMaster) {
    const comKey = LOJA_COM_KEY[loja] || loja;
    localStorage.setItem('gn_' + comKey + '_usuario', JSON.stringify(session.nome));
    localStorage.setItem('gn_comissoes_bridge', JSON.stringify({ comKey, comNome: lojaDisp, ts }));
  }

  if (moduleId === 'mestra') {
    localStorage.setItem('gn_mestra_usuario', JSON.stringify(session.nome));
  }

  if (moduleId === 'estoque' || moduleId === 'lojas') {
    sessionStorage.setItem('gn_usuario', JSON.stringify({
      id: session.id, nome: session.nome, cargo: session.cargo,
      loja, validado: true
    }));
    sessionStorage.setItem('gn_loja_sessao', loja);
  }
}

function openModule(url, moduleId) {
  plantBridge(moduleId);
  window.location.href = url;
}

// ── LIVE BADGES ──────────────────────────────────────────────────────────────

async function loadBadges(sess) {
  const perms = sess.permissoes || {};
  const loja  = sess.loja;
  const lojaDisp = LOJA_DISPLAY[loja] || loja;
  const isMaster = loja === 'GERAL' || !!perms.master;

  if (perms.checklist && !isMaster)
    loadChecklistBadge(loja).catch(() => setBadge('checklist', '—'));

  if (perms.avaliacoes)
    loadAvaliacoesBadge(lojaDisp, isMaster);

  if (perms.comissoes && !isMaster)
    loadComissoesBadge(LOJA_COM_KEY[loja] || loja).catch(() => setBadge('comissoes', '—'));

  if (perms.estoque)  setBadge('estoque', 'Online', 'green');
  if (perms.lojas)    setBadge('lojas', 'Online', 'green');
  if (perms.master)   setBadge('mestra', 'Todas as lojas', 'orange');
}

async function loadChecklistBadge(loja) {
  const hoje = new Date().toISOString().split('T')[0];
  const res = await fetch(
    `${SB_URL}/rest/v1/checklist_diario?data_operacao=eq.${hoje}&loja=eq.${encodeURIComponent(loja)}&select=id`,
    { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY } }
  );
  const data = await res.json();
  if (data && data.length) setBadge('checklist', 'Hoje ✓', 'green');
  else setBadge('checklist', 'Novo', 'blue');
}

function loadAvaliacoesBadge(lojaDisp, isMaster) {
  try {
    if (isMaster) { setBadge('avaliacoes', 'Todas as lojas', 'orange'); return; }
    const norm = (lojaDisp || '').toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'');
    const raw = localStorage.getItem('gn_aval_v5_' + norm);
    const avs = raw ? JSON.parse(raw) : [];
    const fin = avs.filter(a => a.finalizada).length;
    setBadge('avaliacoes', fin > 0 ? `${fin} finalizadas` : 'Nenhuma ainda', fin > 0 ? 'green' : '');
  } catch(e) { setBadge('avaliacoes', '—'); }
}

async function loadComissoesBadge(comKey) {
  const res = await fetch(
    `${SB_URL}/rest/v1/gn_comissoes?loja=eq.${comKey}&select=updated_at`,
    { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY } }
  );
  const data = await res.json();
  if (data && data.length && data[0]?.updated_at) {
    const d = new Date(data[0].updated_at);
    const df = d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});
    setBadge('comissoes', 'Atualizado ' + df, 'green');
  } else {
    setBadge('comissoes', 'Sem dados');
  }
}

function setBadge(moduleId, text, color) {
  const el = document.getElementById('badge-' + moduleId);
  if (!el) return;
  el.textContent = text;
  el.className = 'card-badge' + (color ? ' badge-' + color : '');
}
</script>
</body>
</html>
