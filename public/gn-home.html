            const fatCells=wr.dates.map((dt,i)=>{const fv=(fatDL&&fatDL[dt])||0;const isH=dt===_hoje;const fut=dt>_hoje;return `<td style="text-align:center;padding:1px 1px;font-size:7px;font-weight:700;color:${fv?'#e2e8f0':'rgba(255,255,255,.15)'};${isH?'background:rgba(242,100,25,.09);':''}${fut?'opacity:.3;':''}">${fmtV(fv)}</td>`;}).join('');
            const comCells=hasCom?wr.dates.map((dt,i)=>{const cv=(comDL&&comDL[i])||0;const isH=dt===_hoje;const fut=dt>_hoje;return `<td style="text-align:center;padding:1px 1px;font-size:7px;font-weight:700;color:${cv?'#60a5fa':'rgba(255,255,255,.15)'};${isH?'background:rgba(242,100,25,.09);':''}${fut?'opacity:.3;':''}">${fmtV(cv)}</td>`;}).join(''):'';
            diaGrid=`<div style="margin-top:6px;border-top:1px solid rgba(255,255,255,.06);padding-top:5px"><table style="width:100%;border-collapse:collapse;table-layout:fixed"><thead><tr><th style="width:16px;font-size:6px;color:rgba(255,255,255,.18);text-align:left;padding:0 1px"></th>${hdrs}</tr></thead><tbody><tr><td style="font-size:6px;color:rgba(255,255,255,.2);padding:0 1px">Fat</td>${fatCells}</tr>${hasCom?`<tr><td style="font-size:6px;color:rgba(255,255,255,.2);padding:0 1px">Com</td>${comCells}</tr>`:''}</tbody></table></div>`;
          }
        }
        // status badges
        const badges=[];
        if(chkOk===true) badges.push(`<span style="font-size:9px;color:#4ade80">✅ chk</span>`);
        else if(chkOk===false) badges.push(`<span style="font-size:9px;color:rgba(255,255,255,.22)">⚠ chk</span>`);
        if(manut>0) badges.push(`<span style="font-size:9px;color:#f87171">🔧 ${manut}</span>`);
        const badgeRow=badges.length?`<div style="display:flex;gap:6px;margin-top:4px">${badges.join('')}</div>`:'';
        const selMode=_dashRelSel.size>0;
        const isSel=_dashRelSel.has(k);
        const selBorder=selMode?(isSel?'border:2px solid rgba(242,100,25,.75);box-shadow:0 0 0 1px rgba(242,100,25,.25);':'opacity:.38;border:2px solid transparent;'):'';
        const selBadge=isSel?`<span style="position:absolute;top:5px;right:6px;font-size:8px;font-weight:800;color:#f97316;background:rgba(242,100,25,.15);border-radius:4px;padding:1px 4px">✓</span>`:'';
        return `
          <div class="store-card${hasData?' has-data':' no-data'}" onclick="_toggleDashSel('${k}')" style="cursor:pointer;position:relative;${selBorder}transition:all .15s">
            ${selBadge}
            <div class="sc-nome" style="justify-content:space-between"><span style="display:flex;align-items:center;gap:5px;min-width:0"><span class="sc-dot" style="background:${cor}"></span><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${nome}</span></span>${rankBadge}</div>
            ${loading?`<div class="sc-empty">⟳</div>`
              :hasData?`<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:4px"><div class="sc-val">${_fmtBRLs(v)}${diffHtml}</div>${spark?`<div style="margin-top:2px;flex-shrink:0">${spark}</div>`:''}</div>${bar}${diaGrid}${badgeRow}`
              :`<div class="sc-empty">Sem dados</div>${diaGrid}${badgeRow}`}
          </div>`;
      }).join('');
      mainView=`<div class="cons-card">
        <div class="cons-ttl">${consTitle}</div>
        <div class="cons-lbl">FATURAMENTO TOTAL</div>
        <div class="cons-val">${loading?'—':_fmtBRL(total)}</div>
        <div class="cons-sub">${subLine}</div>
      </div>
      <div class="store-grid">${cards}</div>`;
    }
    content=`
      ${_buildKPIRow()}
      ${_buildDiaGrid()}
      ${manutBanner}
      ${viewTog}
      ${mainView}`;

  } else if (_dashTab==='att') {
    if(!fat){ content='<div style="padding:28px;text-align:center;color:rgba(255,255,255,.28);font-size:12px">⟳ Carregando…</div>'; }
    else { content=manutBanner+_buildAlertsFeed(); }

  } else { // ⚙ Metas
    const perLabel=_dashPer==='sem'?'semana':'mês';
    content=`
      <div style="font-size:11px;color:rgba(255,255,255,.35);margin-bottom:12px">
        Meta de faturamento por loja (${perLabel}) — aparece como barra de progresso nos cards.</div>
      ${LOJAS_LISTA.map(k=>`
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;background:#363636;border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:10px 12px">
          <span style="width:8px;height:8px;border-radius:50%;background:${COR_LOJA[k]||'#888'};flex-shrink:0;display:inline-block"></span>
          <span style="font-size:12px;font-weight:700;color:rgba(255,255,255,.65);flex:1">${LOJA_DISPLAY[k]||k}</span>
          <input type="number" value="${_dashMetas[k]||''}" placeholder="Meta R$"
            style="width:110px;background:#2C2C2C;border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;color:#fff;font-family:inherit;text-align:right;outline:none"
            oninput="_saveMeta('${k}',this.value)">
        </div>`).join('')}`;
  }

  const updTxt = _dashLoadedAt
    ? `${String(_dashLoadedAt.getHours()).padStart(2,'0')}:${String(_dashLoadedAt.getMinutes()).padStart(2,'0')}`
    : null;
  el.innerHTML=`
    <div class="dash-wrap">
      <div style="display:flex;align-items:center;gap:10px;padding:12px 0 14px;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:14px">
        <span style="width:32px;height:32px;border-radius:10px;background:rgba(242,100,25,.12);border:1px solid rgba(242,100,25,.22);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0">📊</span>
        <div>
          <div style="font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.65)">Painel de Gestão</div>
          <div style="font-size:10px;color:rgba(255,255,255,.3);margin-top:1px">Visão consolidada · todas as lojas${updTxt?` · atualizado às ${updTxt}`:''}</div>
        </div>
      </div>
      <div class="dash-tabs">
        <button class="dash-tab${_dashTab==='fat'?' on':''}" onclick="_setDashTab('fat')">↓ Faturamento</button>
        <button class="dash-tab${_dashTab==='att'?' on':''}" onclick="_setDashTab('att')">⚠ Atenção</button>
        <button class="dash-tab${_dashTab==='metas'?' on':''}" onclick="_setDashTab('metas')">⚙ Metas</button>
      </div>
      ${_dashTab!=='metas'?periodRow:''}
      ${content}
    </div>`;
}

function _setDashTab(t){ _dashTab=t; renderDashboard(); }
function _navToAtt(){ const el=document.getElementById('dash-section'); if(el)el.scrollIntoView({behavior:'smooth'}); _setDashTab('att'); }
function _setPer(p){ _dashPer=p; _dashFat=null; _dashFatPrev=null; _dashFatDia=null; _dashComDia=null; _dashFatDiaLoja=null; _dashComDiaLoja=null; _dashRelSel.clear(); renderDashboard(); _loadDashAll(); }
function _toggleDashSel(k){ if(_dashRelSel.has(k)) _dashRelSel.delete(k); else _dashRelSel.add(k); renderDashboard(); }
function _dashNav(dir){
  if(_dashPer==='sem') _dashWoff=Math.min(0,_dashWoff+dir);
  else                 _dashMoff=Math.min(0,_dashMoff+dir);
  _dashFat=null; _dashFatPrev=null; _dashFatDia=null; _dashComDia=null; _dashFatDiaLoja=null; _dashComDiaLoja=null;
  renderDashboard(); _loadDashAll();
}

// ── RELATÓRIOS ────────────────────────────────────────────────────────────────
function _gerarRelatorio() {
  if (!_dashFat) { alert('Aguarde os dados carregarem.'); return; }
  const range   = _dashPer==='sem' ? _weekRange(_dashWoff) : _monthRange(_dashMoff);
  const perTipo = _dashPer==='sem' ? 'Semanal' : 'Mensal';
  let total = 0;
  const lojasDados = [];
  const lojasFiltro = _dashRelSel.size > 0 ? [..._dashRelSel] : LOJAS_LISTA;
  lojasFiltro.forEach(k => {
    const v    = _dashFat[k]||0;
    const vP   = _dashFatPrev?(_dashFatPrev[k]||0):0;
    const meta = _dashMetas[k]||0;
    const manut= _dashManut?(_dashManut[k]||0):0;
    const chkOk= _dashChk?_dashChk.has(k):null;
    total += v;
    lojasDados.push({ k, v, vP, meta, manut, chkOk, nome: LOJA_DISPLAY[k]||k });
  });
  lojasDados.sort((a,b) => b.v - a.v);
  const now = new Date();
  const dtGer = `${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  window._relData = { range, perTipo, total, lojasDados, dtGer };

  const ex = document.getElementById('_rel-modal');
  if (ex) ex.remove();
  const modal = document.createElement('div');
  modal.id = '_rel-modal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9999;display:flex;align-items:flex-end;justify-content:center';
  modal.innerHTML = `
    <div style="background:#0f0f1a;border:1px solid rgba(255,255,255,.1);border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:480px;padding-bottom:calc(20px + env(safe-area-inset-bottom))">
      <div style="width:36px;height:3px;background:rgba(255,255,255,.18);border-radius:2px;margin:0 auto 16px"></div>
      <div style="font-size:14px;font-weight:700;color:#e2e8f0;margin-bottom:2px">📄 Relatório ${perTipo}</div>
      <div style="font-size:11px;color:rgba(255,255,255,.35);margin-bottom:16px">${range.label}</div>
      <button onclick="_relPDF()" style="display:block;width:100%;background:rgba(124,131,253,.1);border:1px solid rgba(124,131,253,.3);border-radius:10px;color:#a5b4fc;padding:13px 16px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:10px;text-align:left;font-family:inherit">
        📥 Gerar PDF
      </button>
      <button onclick="_relWhatsApp()" style="display:block;width:100%;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);border-radius:10px;color:#86efac;padding:13px 16px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:14px;text-align:left;font-family:inherit">
        💬 Compartilhar via WhatsApp
      </button>
      <button onclick="document.getElementById('_rel-modal').remove()" style="display:block;width:100%;background:transparent;border:1px solid rgba(255,255,255,.08);border-radius:10px;color:rgba(255,255,255,.35);padding:11px;font-size:12px;cursor:pointer;font-family:inherit">
        Cancelar
      </button>
    </div>`;
  modal.addEventListener('click', e => { if (e.target===modal) modal.remove(); });
  document.body.appendChild(modal);
}

function _relPDF() {
  const { range, perTipo, total, lojasDados, dtGer } = window._relData || {};
  if (!range) return;
  document.getElementById('_rel-modal')?.remove();
  const storesWithData = lojasDados.filter(l => l.v > 0).length;
  const rows = lojasDados.map(({ nome, v, vP, meta, manut, chkOk }) => {
    const pct  = meta>0 ? Math.round(v/meta*100) : null;
    const diff = vP>0  ? Math.round((v-vP)/vP*100) : null;
    const pctC = !pct?'#888':pct>=100?'#15803d':pct>=75?'#b45309':'#b91c1c';
    const difC = diff===null?'#888':diff>=0?'#15803d':'#b91c1c';
    return `<tr>
      <td style="padding:7px 10px;font-weight:600;border-bottom:1px solid #f0f0f0">${nome}</td>
      <td style="padding:7px 10px;text-align:right;font-weight:700;border-bottom:1px solid #f0f0f0;font-family:monospace">${v>0?_fmtBRL(v):'—'}</td>
      <td style="padding:7px 10px;text-align:right;border-bottom:1px solid #f0f0f0;color:${difC};font-weight:700">${diff!==null?(diff>=0?'+':'')+diff+'%':'—'}</td>
      <td style="padding:7px 10px;text-align:right;border-bottom:1px solid #f0f0f0;color:${pctC};font-weight:700">${pct!==null?pct+'%':'—'}</td>
      <td style="padding:7px 10px;text-align:center;border-bottom:1px solid #f0f0f0">${chkOk===true?'✅':chkOk===false?'⚠':'—'}</td>
      <td style="padding:7px 10px;text-align:center;border-bottom:1px solid #f0f0f0">${manut>0?'🔧 '+manut:'—'}</td>
    </tr>`;
  }).join('');
  const html = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
    <title>GN Gestão — ${perTipo} ${range.label}</title>
    <style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:11pt;color:#111;background:#fff;padding:28px}
    h1{font-size:17pt;font-weight:800;color:#f26419;margin-bottom:2px}.sub{font-size:9pt;color:#666;margin-bottom:20px}
    .kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
    .kpi{border:1px solid #e5e7eb;border-radius:8px;padding:12px;text-align:center}
    .kpi-label{font-size:7.5pt;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
    .kpi-val{font-size:14pt;font-weight:700;color:#f26419;font-family:monospace}
    table{width:100%;border-collapse:collapse;margin-bottom:16px}
    thead{background:#f26419}thead th{padding:8px 10px;text-align:left;color:#fff;font-size:8pt;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
    thead th:not(:first-child){text-align:right}thead th:nth-child(5),thead th:nth-child(6){text-align:center}
    .footer{font-size:7.5pt;color:#aaa;border-top:1px solid #eee;padding-top:8px;margin-top:4px}
    @media print{body{padding:0}@page{margin:1.5cm}}</style>
  </head><body>
    <h1>📊 GN Gestão — ${perTipo}</h1>
    <div class="sub">${range.label} · gerado em ${dtGer}</div>
    <div class="kpi-row">
      <div class="kpi"><div class="kpi-label">Faturamento Total</div><div class="kpi-val">${_fmtBRL(total)}</div></div>
      <div class="kpi"><div class="kpi-label">Lojas com dados</div><div class="kpi-val">${storesWithData}/${lojasDados.length}</div></div>
      <div class="kpi"><div class="kpi-label">Período</div><div class="kpi-val" style="font-size:10pt">${range.label}</div></div>
    </div>
    <table><thead><tr><th>Loja</th><th>Faturamento</th><th>Δ vs Ant.</th><th>% Meta</th><th>CHK</th><th>Manut.</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <div class="footer">GN Operações · ${perTipo} · ${range.label}</div>
    <script>window.onload=function(){window.print()}<\/script>
  </body></html>`;
  const w = window.open('','_blank');
  if (w) { w.document.write(html); w.document.close(); }
}

function _relWhatsApp() {
  const { range, perTipo, total, lojasDados, dtGer } = window._relData || {};
  if (!range) return;
  document.getElementById('_rel-modal')?.remove();
  const comDados  = lojasDados.filter(l => l.v > 0);
  const semDados  = lojasDados.filter(l => l.v === 0);
  const comManut  = lojasDados.filter(l => l.manut > 0);
  let txt = `📊 *GN Gestão — ${perTipo} ${range.label}*\n\n`;
  txt += `💰 *Total: ${_fmtBRL(total)}*\n`;
  txt += `${comDados.length} de ${lojasDados.length} lojas com dados\n\n`;
  if (comDados.length) {
    txt += `📍 *Por loja:*\n`;
    comDados.forEach(({ nome, v, vP, meta }) => {
      const pct  = meta>0 ? ` · meta ${Math.round(v/meta*100)}%` : '';
      const diff = vP>0  ? ` (${v>=vP?'+':''}${Math.round((v-vP)/vP*100)}% vs ant.)` : '';
      txt += `• ${nome}: ${_fmtBRL(v)}${pct}${diff}\n`;
    });
    txt += '\n';
  }
  if (semDados.length)  txt += `⚠ *Sem dados:* ${semDados.map(l=>l.nome).join(', ')}\n`;
  if (comManut.length)  txt += `🔧 *Manutenção:* ${comManut.map(l=>`${l.nome} (${l.manut})`).join(', ')}\n`;
  txt += `\n_GN Operações · ${dtGer}_`;
  if (navigator.share) {
    navigator.share({ text: txt }).catch(() => {});
  } else {
    window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent(txt), '_blank');
  }
}

}

function _scrollTop() { window.scrollTo({top:0,behavior:'smooth'}); }

// ── TROCAR LOGIN/SENHA ────────────────────────────────────────────────────────
function abrirTrocarSenha() {
  if (!session) return;
  document.getElementById('ts-nome').value = session.nome;
  document.getElementById('ts-senha').value = '';
  document.getElementById('ts-conf').value = '';
  document.getElementById('ts-loja').textContent = LOJA_DISPLAY[session.loja] || session.loja;
  document.getElementById('ts-err').textContent = '';
  const btn = document.getElementById('ts-btn');
  btn.textContent = 'Salvar'; btn.disabled = false;
  document.getElementById('senha-overlay').classList.add('open');
}

function fecharTrocarSenha() {
  document.getElementById('senha-overlay').classList.remove('open');
}

async function salvarTrocarSenha() {
  const nome  = document.getElementById('ts-nome').value.trim();
  const senha = document.getElementById('ts-senha').value;
  const conf  = document.getElementById('ts-conf').value;
  const errEl = document.getElementById('ts-err');
  const btn   = document.getElementById('ts-btn');
  errEl.textContent = '';
  if (!nome) { errEl.textContent = 'Nome não pode ser vazio.'; return; }
  if (senha && senha !== conf) { errEl.textContent = 'Senhas não conferem.'; return; }
  const payload = { nome, atualizado_em: new Date().toISOString() };
  if (senha) payload.senha = senha;
  btn.textContent = 'Salvando...'; btn.disabled = true;
  try {
    const res = await fetch(
      `${SB_URL}/rest/v1/gn_usuarios?id=eq.${session.id}`,
      { method: 'PATCH', headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' }, body: JSON.stringify(payload) }
    );
    if (!res.ok) { errEl.textContent = '⚠️ Erro ao salvar. Tente novamente.'; btn.textContent = 'Salvar'; btn.disabled = false; return; }
    session.nome = nome;
    localStorage.setItem(SESSION_KEY, JSON.stringify(session));
    fecharTrocarSenha();
    showHome(session);
  } catch(e) {
    errEl.textContent = '⚠️ Erro de conexão.';
    btn.textContent = 'Salvar'; btn.disabled = false;
  }
}

// ── NOTIFICAÇÕES DE ALERTA ────────────────────────────────────────────────────
function _gnDispararAlertas() {
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.ready.then(reg => {
    if (reg.active) reg.active.postMessage({ type: 'GN_CHECK_ALERTS' });
  }).catch(() => {});
}

async function _gnPedirPermissao() {
  if (!('Notification' in window)) return;
  try {
    const p = await Notification.requestPermission();
    const banner = document.getElementById('notif-banner');
    if (banner) banner.style.display = 'none';
    if (p === 'granted') _gnDispararAlertas();
  } catch(e) {}
}

function _gnIniciarAlertas() {
  if (!session) return;
  if (!('Notification' in window)) return;
  if (Notification.permission === 'granted') {
    _gnDispararAlertas();
  } else if (Notification.permission === 'default') {
    const banner = document.getElementById('notif-banner');
    if (banner) banner.style.display = 'flex';
  }
}

// ── SERVICE WORKER ────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').then(reg => {
    reg.update();
    _gnIniciarAlertas();
  }).catch(() => {});
}

// Restore dashboard when browser restores page from bfcache (back/forward nav)
window.addEventListener('pageshow', event => {
  if (!event.persisted) return;
  if (!session) return;
  const isMaster = session.loja === 'GERAL' || !!(session.permissoes||{}).master;
  if (isMaster && !masterLoja) {
    const el = document.getElementById('dash-section');
    if (el) {
      el.style.display = 'block'; // garante visível após bfcache
      if (_dashFat === null && !_dashLoading) {
        renderDashboard();
        _loadDashAll();
      }
    }
  }
  _gnIniciarAlertas();
});
</script>
