<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#F26419">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GN Gestão">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <title>GN Gestão</title>
  <style>
    :root{--cor:#F26419;--cor2:#cc4a00}
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{background:#2C2C2C;color:#e8e8f4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden}

    /* ── LOGIN ───────────────────────────────────── */
    #login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:radial-gradient(ellipse at 50% -10%,color-mix(in srgb,var(--cor) 18%,transparent) 0%,transparent 65%),#2C2C2C}
    .login-logo{font-size:54px;font-weight:900;color:var(--cor);letter-spacing:-3px;line-height:1}
    .login-tag{font-size:11px;color:#44445a;letter-spacing:3px;text-transform:uppercase;margin:6px 0 36px}
    .login-card{background:#363636;border:1px solid #505050;border-radius:22px;padding:28px 24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 60px #00000080}
    .l-title{font-size:15px;font-weight:700;color:#e8e8f4;text-align:center;margin-bottom:2px}
    .l-inp{background:#2C2C2C;border:1.5px solid #505050;border-radius:12px;padding:14px 16px;font-size:15px;color:#e8e8f4;width:100%;font-family:inherit;outline:none;transition:border-color .15s}
    .l-inp:focus{border-color:var(--cor)}
    .l-inp::placeholder{color:#33334a}
    .l-btn{background:var(--cor);color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;letter-spacing:.3px;transition:opacity .15s}
    .l-btn:disabled{opacity:.45;cursor:default}
    .l-err{color:#f87171;font-size:12px;min-height:16px;text-align:center}

    /* ── HOME ───────────────────────────────────── */
    #home-screen{display:none;flex-direction:column;min-height:100vh}

    /* Header */
    .app-hdr{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:8px;padding:13px 16px;background:rgba(8,8,15,.92);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.04)}
    .hdr-gn{font-size:20px;font-weight:900;color:var(--cor);letter-spacing:-1px;line-height:1}
    .hdr-gestao{font-size:9px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.22);align-self:flex-end;margin-bottom:2px}
    .hdr-sep{width:1px;height:18px;background:rgba(255,255,255,.06);flex-shrink:0}
    .hdr-user{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:600;color:rgba(255,255,255,.5)}
    .hdr-sair{background:transparent;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:6px 13px;font-size:12px;font-weight:600;color:rgba(255,255,255,.4);font-family:inherit;cursor:pointer;flex-shrink:0;transition:border-color .15s,color .15s}
    .hdr-sair:hover{border-color:var(--cor);color:var(--cor)}
    .hdr-chave{background:transparent;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:5px 9px;font-size:14px;line-height:1;color:rgba(255,255,255,.35);font-family:inherit;cursor:pointer;flex-shrink:0;transition:border-color .15s,color .15s}
    .hdr-chave:hover{border-color:var(--cor);color:var(--cor)}
    .ts-inp{width:100%;padding:10px 12px;background:#404040;border:1px solid rgba(255,255,255,.12);border-radius:8px;color:#fff;font-size:14px;font-family:inherit;box-sizing:border-box;outline:none;transition:border-color .15s}
    .ts-inp:focus{border-color:var(--cor)}
    .ts-lbl{font-size:11px;color:#7A7A9A;display:block;margin-bottom:4px}

    /* Hero */
    .hero{position:relative;padding:24px 20px 36px;overflow:hidden}
    .hero-bg{position:absolute;inset:0;background:linear-gradient(155deg,var(--cor) 0%,color-mix(in srgb,var(--cor) 40%,#000) 60%,#2C2C2C 100%);opacity:.22;transition:background .4s}
    .hero-blob{position:absolute;top:-40px;right:-40px;width:180px;height:180px;border-radius:50%;background:var(--cor);opacity:.08;filter:blur(40px);transition:background .4s}
    .hero-fade{position:absolute;bottom:0;left:0;right:0;height:48px;background:linear-gradient(0deg,#2C2C2C,transparent)}
    .hero-inner{position:relative;z-index:1}
    .hero-row{display:flex;align-items:center;gap:8px;margin-bottom:3px}
    .hero-loja-name{font-size:22px;font-weight:900;color:#fff;line-height:1}
    .hero-sel-btn{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:4px 10px 4px 11px;font-size:11px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit;flex-shrink:0;transition:background .15s}
    .hero-sel-btn:active{background:rgba(255,255,255,.18)}
    .hero-date{font-size:11px;color:rgba(255,255,255,.42);margin-bottom:10px}
    .hero-greeting{font-size:20px;font-weight:800;color:#fff}
    .hero-sub{font-size:12px;color:rgba(255,255,255,.45);margin-top:3px}

    /* Module list */
    .mod-list{padding:4px 14px 40px;display:flex;flex-direction:column;gap:7px}
    .sec-label{font-size:10px;font-weight:700;color:#33335a;letter-spacing:2px;text-transform:uppercase;padding:6px 2px 2px}
    .mod-row{display:flex;align-items:center;gap:12px;background:#363636;border:1px solid #505050;border-radius:16px;padding:13px 14px;cursor:pointer;transition:border-color .15s,background .1s;-webkit-user-select:none;user-select:none}
    .mod-row:not(.disabled):active{background:#3A3A3A;transform:scale(.985)}
    .mod-row.disabled{opacity:.28;cursor:not-allowed;pointer-events:none}
    .mod-icon-box{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
    .mod-body{flex:1;min-width:0}
    .mod-name{font-size:13px;font-weight:800;color:#e8e8f4;letter-spacing:.2px}
    .mod-sub{font-size:11px;color:#3a3a5a;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .mod-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
    .mod-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:7px;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
    .bg{background:rgba(34,197,94,.1);color:#22c55e}
    .bb{background:rgba(59,130,246,.1);color:#60a5fa}
    .bo{background:rgba(242,100,25,.1);color:#F26419}
    .bx{background:rgba(255,255,255,.04);color:#44445a}
    .br{background:rgba(239,68,68,.1);color:#ef4444}
    .mod-arrow{font-size:20px;color:rgba(255,255,255,.12);line-height:1;margin-left:2px}

    /* Loja picker sheet */
    .picker-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:300;align-items:flex-end;animation:fadeIn .15s}
    .picker-overlay.open{display:flex}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}70%{box-shadow:0 0 0 6px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
    .chip-live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#22c55e;animation:livePulse 1.6s infinite}
    .picker-sheet{background:#363636;border-radius:24px 24px 0 0;border-top:1px solid #505050;padding:20px 16px 40px;width:100%;max-height:82vh;overflow-y:auto;animation:slideUp .2s cubic-bezier(.22,1,.36,1)}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .picker-title{font-size:13px;font-weight:700;color:rgba(255,255,255,.4);text-align:center;letter-spacing:1px;text-transform:uppercase;margin-bottom:16px}
    .picker-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .pick-btn{display:flex;align-items:center;gap:9px;background:#2C2C2C;border:1.5px solid #505050;border-radius:13px;padding:11px 13px;cursor:pointer;font-family:inherit;transition:border-color .15s;text-align:left}
    .pick-btn.active{border-color:var(--cor)}
    .pick-btn:active{opacity:.7}
    .pick-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
    .pick-name{font-size:12px;font-weight:700;color:#e8e8f4}
    .pick-cancel{margin-top:10px;width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:13px;padding:14px;font-size:14px;font-weight:600;color:#555;font-family:inherit;cursor:pointer}

    /* ── DASHBOARD ───────────────────────────────── */
    .dash-wrap{padding:0 14px 10px}
    .dash-tabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
    .dash-tabs::-webkit-scrollbar{display:none}
    .dash-tab{padding:7px 14px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:rgba(255,255,255,.38);cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0;transition:all .15s}
    .dash-tab.on{background:var(--cor);border-color:var(--cor);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.3)}
    .period-row{display:flex;align-items:center;gap:7px;margin-bottom:12px}
    .period-toggle{display:flex;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:8px;overflow:hidden;flex-shrink:0}
    .period-toggle button{padding:5px 10px;font-size:11px;font-weight:700;background:none;border:none;color:rgba(255,255,255,.35);font-family:inherit;cursor:pointer;transition:all .15s}
    .period-toggle button.on{background:var(--cor);color:#fff}
    .period-arrow{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:5px 11px;font-size:16px;line-height:1;color:rgba(255,255,255,.45);font-family:inherit;cursor:pointer;flex-shrink:0;transition:background .15s}
    .period-arrow:active{background:rgba(255,255,255,.12)}
    .period-arrow:disabled{opacity:.25;cursor:default}
    .period-label{flex:1;text-align:center;font-size:11px;font-weight:600;color:rgba(255,255,255,.45);white-space:nowrap}
    .period-label b{color:rgba(255,255,255,.75);font-weight:700}
    .period-curr{font-size:9px;color:var(--cor);font-weight:800;margin-left:3px}
    .cons-card{background:#363636;border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:16px;margin-bottom:12px}
    .cons-ttl{font-size:8px;font-weight:800;color:rgba(255,255,255,.22);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:6px}
    .cons-ttl::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.05)}
    .cons-lbl{font-size:9px;color:rgba(255,255,255,.32);font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:3px}
    .cons-val{font-size:26px;font-weight:900;color:#fff;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1.1}
    .cons-sub{font-size:11px;color:rgba(255,255,255,.3);margin-top:6px}
    .store-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
    .store-card{background:#363636;border:1px solid rgba(255,255,255,.05);border-radius:13px;padding:12px;transition:border-color .2s}
    .store-card.has-data{border-color:rgba(255,255,255,.09)}
    .store-card.no-data{opacity:.38}
    .sc-nome{font-size:10px;font-weight:700;color:rgba(255,255,255,.6);margin-bottom:5px;display:flex;align-items:center;gap:5px;overflow:hidden}
    .sc-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
    .sc-val{font-size:15px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
    .sc-empty{font-size:11px;color:rgba(255,255,255,.2);font-weight:500}
    .sc-bar{height:3px;background:rgba(255,255,255,.05);border-radius:2px;margin-top:5px;overflow:hidden}
    .sc-bar-fill{height:100%;border-radius:2px;transition:width .4s}
    .att-item{background:#363636;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:11px 13px;margin-bottom:7px;display:flex;align-items:center;gap:10px}
    .att-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .att-nm{font-size:12px;font-weight:700;color:rgba(255,255,255,.65)}
    .att-rs{font-size:10px;color:rgba(255,255,255,.28);margin-top:2px}

    /* ── BI PANEL ────────────────────────────────── */
    .kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
    .kpi-tile{background:#363636;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:12px 13px}
    .kpi-tile-lbl{font-size:8px;font-weight:800;color:rgba(255,255,255,.25);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px}
    .kpi-tile-val{font-size:18px;font-weight:900;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1.1}
    .kpi-tile-sub{font-size:9px;color:rgba(255,255,255,.28);margin-top:3px;line-height:1.3}
    .view-tog{display:flex;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:9px;overflow:hidden;margin-bottom:12px}
    .view-tog button{flex:1;padding:7px 4px;font-size:10px;font-weight:700;background:none;border:none;color:rgba(255,255,255,.28);font-family:inherit;cursor:pointer;transition:all .15s;white-space:nowrap}
    .view-tog button.on{background:rgba(255,255,255,.09);color:rgba(255,255,255,.82)}
    .bi-table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:4px}
    .bi-table th{padding:6px 7px;text-align:right;font-size:8px;font-weight:800;color:rgba(255,255,255,.25);letter-spacing:.6px;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,.06);white-space:nowrap;cursor:pointer;user-select:none;-webkit-user-select:none}
    .bi-table th:first-child{text-align:left}
    .bi-table th.sort-cur{color:rgba(255,255,255,.55)}
    .bi-table td{padding:7px 7px;text-align:right;border-bottom:1px solid rgba(255,255,255,.04);font-variant-numeric:tabular-nums;vertical-align:middle}
    .bi-table td:first-child{text-align:left;font-weight:700;color:rgba(255,255,255,.7)}
    .bi-table tbody tr:last-child td{border-bottom:none}
    .bi-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .bi-bar-name{font-size:11px;font-weight:700;color:rgba(255,255,255,.65);width:90px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .bi-bar-track{flex:1;height:22px;background:rgba(255,255,255,.04);border-radius:6px;overflow:hidden;position:relative}
    .bi-bar-fill{height:100%;border-radius:6px;transition:width .5s cubic-bezier(.22,1,.36,1)}
    .bi-bar-val{font-size:10px;font-weight:700;color:rgba(255,255,255,.55);width:54px;flex-shrink:0;text-align:right;font-variant-numeric:tabular-nums;line-height:1.3}
    .rank-badge{display:inline-flex;align-items:center;gap:2px;font-size:8px;font-weight:800;padding:1px 5px;border-radius:4px;background:rgba(255,255,255,.05);color:rgba(255,255,255,.38);line-height:1.5;flex-shrink:0}
    .alrt{background:#363636;border-left:3px solid;border-radius:0 10px 10px 0;padding:9px 11px;margin-bottom:6px;display:flex;align-items:flex-start;gap:8px}
    .alrt-ico{font-size:14px;flex-shrink:0;line-height:1.5}
    .alrt-msg{font-size:11px;font-weight:600;color:rgba(255,255,255,.72);line-height:1.4}
    .alrt-sub{font-size:10px;color:rgba(255,255,255,.28);margin-top:2px}

    /* ── BOTTOM NAV ───────────────────────────────── */
    .bot-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(8,8,15,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.07);z-index:80;padding:7px 0 max(7px,env(safe-area-inset-bottom));display:none}
    .bot-nav-inner{display:flex;justify-content:space-around;max-width:520px;margin:0 auto}
    .bot-nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 6px;background:none;border:none;cursor:pointer;font-family:inherit;flex:1;-webkit-tap-highlight-color:transparent;min-width:0}
    .bni{font-size:20px;line-height:1;display:block}
    .bnl{font-size:9px;font-weight:700;color:rgba(255,255,255,.28);letter-spacing:.2px;display:block;white-space:nowrap}

    /* ── DESKTOP SIDEBAR ──────────────────────────── */
    #sidebar-nav{display:none}
    @media(min-width:768px){
      .bot-nav{display:none!important}
      body.home-active{padding-left:224px}
      body.home-active #sidebar-nav{display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;width:224px;background:#363636;border-right:1px solid rgba(255,255,255,.12);overflow-y:auto;z-index:50}
      body.home-active .app-hdr{display:none!important}
      .sbn-brand{padding:16px 14px 12px;border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0}
      .sbn-gn{font-size:22px;font-weight:900;color:var(--cor);letter-spacing:-1px}
      .sbn-gestao{font-size:9px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,.22);margin-top:1px}
      .sbn-info{padding:8px 14px 10px;border-bottom:1px solid rgba(255,255,255,.04);flex-shrink:0}
      .sbn-user{font-size:12px;font-weight:600;color:rgba(255,255,255,.65);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .sbn-loja{font-size:10px;color:rgba(255,255,255,.28);margin-top:2px}
      .sbn-section{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:rgba(255,255,255,.18);padding:10px 14px 4px}
      .sbn-mod{display:flex;align-items:center;gap:8px;width:100%;padding:7px 14px;background:none;border:none;font-family:inherit;font-size:12px;font-weight:500;color:rgba(255,255,255,.4);cursor:pointer;text-align:left;transition:color .12s,background .12s}
      .sbn-mod:hover{color:rgba(255,255,255,.75);background:rgba(255,255,255,.04)}
      .sbn-mod-icon{font-size:13px;width:18px;text-align:center;flex-shrink:0}
      .sbn-footer{padding:12px 14px;border-top:1px solid rgba(255,255,255,.06);flex-shrink:0}
      .sbn-sair{width:100%;padding:9px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;color:rgba(255,255,255,.4);font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;transition:border-color .15s,color .15s}
      .sbn-sair:hover{border-color:var(--cor);color:var(--cor)}
      .mod-list{display:grid!important;grid-template-columns:1fr 1fr;gap:8px;padding:4px 20px 40px;max-width:800px;margin:0 auto}
      .sec-label{grid-column:1/-1}
    }
  </style>
<script src="gn-lojas-config.js"></script>
</head>
<body>

<nav id="sidebar-nav" aria-label="Navegação">
  <div class="sbn-brand">
    <div class="sbn-gn">GN</div>
    <div class="sbn-gestao">Gestão</div>
  </div>
  <div class="sbn-info">
    <div class="sbn-user" id="sb-user">—</div>
    <div class="sbn-loja" id="sb-loja"></div>
  </div>
  <div class="sbn-section">Módulos</div>
  <div id="sb-modules" style="flex:1;overflow-y:auto;padding-bottom:8px"></div>
  <div class="sbn-footer">
    <button class="sbn-sair" id="sbn-btn-instalar" onclick="instalarApp()" style="display:none;margin-bottom:6px;border-color:rgba(242,100,25,.45);color:var(--cor)">⬇ Instalar app</button>
    <button class="sbn-sair" id="sbn-btn-atualizar" onclick="forcarAtualizacao()" style="margin-bottom:6px;border-color:rgba(255,255,255,.06)">↻ Atualizar app</button>
    <button class="sbn-sair" onclick="doLogout()">Sair</button>
  </div>
</nav>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-logo">GN</div>
  <div class="login-tag">Sistema de Gestão</div>
  <div class="login-card">
    <div class="l-title">Entrar no sistema</div>
    <input id="inp-nome" class="l-inp" type="text" placeholder="Nome de usuário"
      autocomplete="username" autocorrect="off" autocapitalize="none"
      onkeydown="if(event.key==='Enter')document.getElementById('inp-senha').focus()">
    <input id="inp-senha" class="l-inp" type="password" placeholder="Senha"
      autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <div id="l-err" class="l-err"></div>
    <button id="l-btn" class="l-btn" onclick="doLogin()">Entrar →</button>
  </div>

<script>
const APP_VERSION = 'v113';
const SB_URL = "https://ncxttwvpafajnilpjbol.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jeHR0d3ZwYWZham5pbHBqYm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4NDcyMDEsImV4cCI6MjA5NzQyMzIwMX0.MGDZNGY8GfSzBKAgdR7OhvOeR71i4fj9YseJRhoh5sE";
const SESSION_KEY = 'gn_session_v1';
const TTL = 43200000;

// ── PWA INSTALL PROMPT ────────────────────────────────────────────────────────
let _pwaPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  _pwaPrompt = e;
  ['btn-instalar','sbn-btn-instalar'].forEach(id => { const el=document.getElementById(id); if(el) el.style.display=''; });
  // Upgrade manual banner to a real install button
  const bbn = document.getElementById('pwa-install-banner');
  const bbtn = document.getElementById('pwa-banner-btn');
  if (bbn && !bbn.dataset.dismissed) {
    bbn.style.display = 'flex';
    if (bbtn) { bbtn.style.display = ''; bbn.querySelector('div:last-of-type')?.remove(); }
    // hide the manual text instructions since we now have a real prompt
    const manualTxt = bbn.querySelector('div:nth-child(3)');
    if (manualTxt) manualTxt.style.display = 'none';
  }
});
window.addEventListener('appinstalled', () => {
  _pwaPrompt = null;
  ['btn-instalar','sbn-btn-instalar'].forEach(id => { const el=document.getElementById(id); if(el) el.style.display='none'; });
  const bbn = document.getElementById('pwa-install-banner');
  if (bbn) bbn.style.display = 'none';
  localStorage.setItem('pwa_banner_dismissed', '1');
});
async function instalarApp() {
  if (!_pwaPrompt) return;
  _pwaPrompt.prompt();
  await _pwaPrompt.userChoice;
  _pwaPrompt = null;
  ['btn-instalar','sbn-btn-instalar'].forEach(id => { const el=document.getElementById(id); if(el) el.style.display='none'; });
  const bbn = document.getElementById('pwa-install-banner');
  if (bbn) bbn.style.display = 'none';
}

function dismissPwaBanner() {
  localStorage.setItem('pwa_banner_dismissed', '1');
  const bbn = document.getElementById('pwa-install-banner');
  if (bbn) { bbn.style.display = 'none'; bbn.dataset.dismissed = '1'; }
}

// Show install banner on Android when not in standalone mode
(function() {
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches
                    || window.navigator.standalone === true;
  const isAndroid = /Android/i.test(navigator.userAgent);
  const dismissed = localStorage.getItem('pwa_banner_dismissed') === '1';
  if (isStandalone || !isAndroid || dismissed) return;
  // Small delay so page renders first; if beforeinstallprompt fires it will
  // upgrade the banner before this timeout resolves
  setTimeout(() => {
    const bbn = document.getElementById('pwa-install-banner');
    if (bbn && !bbn.dataset.dismissed) bbn.style.display = 'flex';
  }, 2000);
})();

const COR_LOJA = Object.fromEntries([...GN_LOJAS.map(l=>[l.userKey,l.cor]),['GERAL','#F26419']]);
const LOJA_DISPLAY = Object.fromEntries([...GN_LOJAS.map(l=>[l.userKey,l.display]),['GERAL','Mestre']]);
const LOJA_COM_KEY = Object.fromEntries(GN_LOJAS.map(l=>[l.userKey,l.comKey]));
const LOJA_DB_KEY = Object.fromEntries(GN_LOJAS.map(l=>[l.userKey,l.chkKey]));
function _normLoja(n) {
  if (n === 'SAO_GONCALO') return 'SÃO GONÇALO';
  return (n || '').toUpperCase();
}

const LOJAS_TODAS = GN_LOJAS.map(l=>l.userKey);
let LOJAS_LISTA = LOJAS_TODAS;
let _lojasRestritas = false; // true quando a sessão é de um supervisor com rota de lojas cadastrada

// Cargo supervisor só enxerga/abre as lojas cadastradas na rota dele (permissoes.lojas_supervisor,
// definido no app Usuários). Sem rota cadastrada, mantém acesso a todas (comportamento anterior,
// evita travar contas antigas até o mestre configurar a rota). Cargo mestre sempre vê tudo.
function _lbTodasLojas() { return _lojasRestritas ? 'Todas as lojas (rota)' : 'Todas as lojas'; }

function _computeLojasVisiveis(sess) {
  if (!sess) { _lojasRestritas = false; return LOJAS_TODAS; }
  const cargo = (sess.cargo || '').toLowerCase();
  if (cargo === 'supervisor') {
    const rota = Array.isArray((sess.permissoes||{}).lojas_supervisor) ? (sess.permissoes||{}).lojas_supervisor.filter(Boolean) : [];
    if (rota.length) {
      _lojasRestritas = true;
      return LOJAS_TODAS.filter(k => rota.includes(k));
    }
  }
  _lojasRestritas = false;
  return LOJAS_TODAS;
}

// geralOnly: só aparece no Painel de Gestão (masterLoja vazio) para sessões
// master/mestre — some do menu quando uma loja específica está aberta.
// Não afeta usuários não-master (para eles masterLoja nunca é setado).
const MODULES = [
  {id:'caixa',     name:'Caixa',             sub:'Controle de turno e fechamento',     icon:'💵', bg:'#E8580A', perm:'caixa',     cargoBypass:['gerente','mestre','admin'], url:'gn-caixa.html'},
  {id:'checklist', name:'Check-list',       sub:'Check-lists diários e pendências',   icon:'✅', bg:'#22c55e', perm:'checklist', url:'gn-checklist.html'},
  {id:'pedidos',   name:'Pedidos',           sub:'Catálogo, pedidos e provisões',      icon:'🛒', bg:'#0e7490', perm:'pedidos',   url:'gn-pedidos.html', geralOnly:true},
  {id:'avaliacoes',name:'Avaliações',        sub:'Desempenho da equipe',               icon:'⭐', bg:'#8b5cf6', perm:'avaliacoes',url:'gn-avaliacoes.html'},
  {id:'comissoes', name:'Comissões',         sub:'Folha semanal de pagamentos',        icon:'💰', bg:'#f59e0b', perm:'comissoes', url:'gn-comissoes.html'},
  {id:'lojas',     name:'Lojas',             sub:'Ficha operacional da loja',          icon:'🏪', bg:'#ec4899', perm:'lojas',     url:'gn-lojas.html'},
  {id:'mestra',    name:'Comissões Mestra',  sub:'Visão consolidada — todas as lojas', icon:'🏆', bg:'#F26419', perm:'mestra',    url:'gn-comissoes-mestra.html', masterOnly:true, geralOnly:true},
  {id:'rh',        name:'RH / Financeiro',  sub:'Consolidador de RH e dados financeiros', icon:'👥', bg:'#0284c7', perm:'rh',        url:'gn-rh.html', geralOnly:true},
  {id:'manutencao',name:'Manutenção',       sub:'Acompanhamento de manutenções das lojas', icon:'🔧', bg:'#e85d04', perm:'manutencao', url:'gn-manutencao.html', geralOnly:true},
  {id:'inventario',name:'Inventário',       sub:'Inventário e marketing das lojas',        icon:'📦', bg:'#0d9488', perm:'inventario', cargoBypass:['mestre','supervisor','admin','gerente'], url:'gn-inventario.html'},
  {id:'usuarios',  name:'Senhas',           sub:'Cadastro e permissões de usuários',       icon:'🔐', bg:'#7c3aed', perm:'master',     masterOnly:true, geralOnly:true, url:'gn-usuarios.html'},
];

let session = null;
let masterLoja = null; // loja ativa selecionada pelo mestre

try {
  const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
  if (s && Date.now() - s.ts < TTL) session = s;
} catch(e) {}

// Restore last selected loja using gn_home_loja (home-only key, not shared with sub-pages).
// Sub-pages write to gn_last_loja for their own context — reading it here would wrongly
// restore a loja the user merely opened inside a sub-page while in "Todas as lojas" mode.
if (session && (session.loja === 'GERAL' || !!(session.permissoes||{}).master)) {
  try {
    const homeState = JSON.parse(localStorage.getItem('gn_home_loja') || 'null');
    if (homeState && homeState.loja && Date.now() - homeState.ts < TTL) masterLoja = homeState.loja;
  } catch(e) {}
}

if (session) showHome(session);
else showLoginScreen();

// Silently refresh permissions from DB on every load so permission
// changes by the admin take effect without requiring a manual logout.
if (session) {
  fetch(`${SB_URL}/rest/v1/gn_usuarios?id=eq.${session.id}&ativo=eq.true&select=id,nome,loja,cargo,permissoes`,
    { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY } })
  .then(r => r.json()).then(data => {
    if (!data || !data.length) return;
    const u = data[0];
    // Exclude dashboard_metas from comparison — it's local UI data, not a permission
    const stripMeta = p => { const c = Object.assign({}, p||{}); delete c.dashboard_metas; return c; };
    const changed = JSON.stringify(stripMeta(session.permissoes)) !== JSON.stringify(stripMeta(u.permissoes))
                 || session.nome !== u.nome || session.cargo !== u.cargo;
    if (changed) {
      // Preserve local dashboard_metas when merging from Supabase
      const localMetas = (session.permissoes||{}).dashboard_metas;
      session.permissoes = u.permissoes || {};
      if (localMetas && !session.permissoes.dashboard_metas) session.permissoes.dashboard_metas = localMetas;
      session.nome  = u.nome;
      session.cargo = u.cargo;
      localStorage.setItem(SESSION_KEY, JSON.stringify(session));
      // Re-render only user-visible elements that changed, without touching the
      // dashboard (which resets _dashFat and triggers a new fetch, causing the
      // race condition where the dashboard loads then disappears).
      _refreshPermUI(session);
    }
  }).catch(() => {});
}

// Lightweight UI refresh after a background permission update.
// Updates header, sidebar, modules, and badges WITHOUT resetting the dashboard.
function _refreshPermUI(sess) {
  if (!document.getElementById('home-screen') || document.getElementById('home-screen').style.display === 'none') return;
  LOJAS_LISTA = _computeLojasVisiveis(sess);
  if (masterLoja && !LOJAS_LISTA.includes(masterLoja)) masterLoja = null;
  const isMaster = sess.loja === 'GERAL' || !!(sess.permissoes||{}).master;
  // Header / sidebar user info
  const nameStr = sess.nome + (sess.cargo ? ' · ' + sess.cargo : '');
  const hdUser = document.getElementById('hdr-user'); if (hdUser) hdUser.textContent = nameStr;
  const sbUser = document.getElementById('sb-user');  if (sbUser) sbUser.textContent = nameStr;
  const permsNav = sess.permissoes || {};
  const sbMods = document.getElementById('sb-modules');
  if (sbMods) sbMods.innerHTML = MODULES
    .filter(m => !m.masterOnly || isMaster)
    .filter(m => !(m.geralOnly && isMaster && masterLoja))
    .filter(m => m.free || (isMaster ? permsNav[m.perm] !== false : (!!permsNav[m.perm] || (m.cargoBypass && m.cargoBypass.includes(sess.cargo)))))
    .map(m => `<button class="sbn-mod" onclick="navTo('${m.url}')"><span class="sbn-mod-icon">${m.icon}</span>${m.name}</button>`)
    .join('');
  // Re-render module list and reload badges (permissions may have changed)
  renderModules(sess, isMaster);
  loadBadges(sess, isMaster);
  _renderBotNav(sess, isMaster);
}

// ── FORCE UPDATE ──────────────────────────────────────────────────────────────
// Recarrega apenas os DADOS da tela atual — nunca toca em visibilidade de
// elementos nem chama showHome. Isso evita qualquer risco de sumir o dashboard.
async function forcarAtualizacao() {
  if (!session) return;
  const btns = [document.getElementById('btn-atualizar'), document.getElementById('sbn-btn-atualizar')];
  btns.forEach(b => { if (b) { b.textContent = '⟳'; b.disabled = true; } });

  // 1. Limpa caches e recarrega página para pegar HTML mais recente
  try {
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch(e) {}
  setTimeout(() => location.reload(true), 150);
  return;

  // 2. Recarrega dados conforme a vista atual — sem chamar showHome
  const isMaster = session.loja === 'GERAL' || !!(session.permissoes||{}).master;
  if (isMaster && !masterLoja) {
    // Vista "Todas as lojas": garante visibilidade do painel e recarrega dados
    const dashEl = document.getElementById('dash-section');
    if (dashEl) dashEl.style.display = 'block'; // força visível caso tenha sumido por qualquer motivo
    _dashFat = null; _dashFatPrev = null;
    _dashLoading = false; // reseta guard para permitir nova carga mesmo se anterior travou
    renderDashboard();
    _loadDashAll();
    _renderHealthChips();
  } else if (isMaster && masterLoja) {
    // Vista loja específica: recarrega chips da loja
    _loadLojaHealthChips(masterLoja);
  }
  loadBadges(session, isMaster);

  // 3. Reabilita botões imediatamente (dados carregam em background)
  btns.forEach(b => { if (b) { b.textContent = b.id === 'sbn-btn-atualizar' ? '↻ Atualizar app' : '↻ Atualizar'; b.disabled = false; } });

  // 4. Atualiza permissões em background (usa _refreshPermUI, nunca showHome)
  fetch(`${SB_URL}/rest/v1/gn_usuarios?id=eq.${session.id}&ativo=eq.true&select=id,nome,loja,cargo,permissoes`,
    { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY } })
  .then(r => r.json()).then(data => {
    if (!data || !data.length) return;
    const u = data[0];
    const localMetas = (session.permissoes||{}).dashboard_metas;
    const stripMeta = p => { const c = Object.assign({}, p||{}); delete c.dashboard_metas; return c; };
    const changed = JSON.stringify(stripMeta(session.permissoes)) !== JSON.stringify(stripMeta(u.permissoes))
                 || session.nome !== u.nome || session.cargo !== u.cargo;
    if (changed) {
      session.permissoes = u.permissoes || {};
      if (localMetas && !session.permissoes.dashboard_metas) session.permissoes.dashboard_metas = localMetas;
      session.nome  = u.nome;
      session.cargo = u.cargo;
      localStorage.setItem(SESSION_KEY, JSON.stringify(session));
      _refreshPermUI(session);
    }
  }).catch(() => {});
}

// ── THEME ─────────────────────────────────────────────────────────────────────
function setTheme(loja) {
  const cor = COR_LOJA[loja] || '#F26419';
  document.documentElement.style.setProperty('--cor', cor);
}

// ── LOGIN ─────────────────────────────────────────────────────────────────────
function showLoginScreen() {
  document.body.classList.remove('home-active');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('home-screen').style.display  = 'none';
  setTheme('GERAL');
  setTimeout(() => document.getElementById('inp-nome').focus(), 100);
}

async function doLogin() {
  const nome  = document.getElementById('inp-nome').value.trim();
  const senha = document.getElementById('inp-senha').value;
  const errEl = document.getElementById('l-err');
  const btn   = document.getElementById('l-btn');
  errEl.textContent = '';
  if (!nome || !senha) { errEl.textContent = 'Preencha usuário e senha.'; return; }
  btn.textContent = 'Verificando...'; btn.disabled = true;
  try {
    const res = await fetch(
      `${SB_URL}/rest/v1/gn_usuarios?nome=eq.${encodeURIComponent(nome)}&senha=eq.${encodeURIComponent(senha)}&ativo=eq.true`,
      { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY } }
    );
    const data = await res.json();
    if (!data || !data.length) {
      errEl.textContent = '❌ Nome ou senha incorretos.';
      btn.textContent = 'Entrar →'; btn.disabled = false;
      return;
    }
    const u = data[0];
    session = { id: u.id, nome: u.nome, loja: u.loja, cargo: u.cargo, permissoes: u.permissoes || {}, ts: Date.now() };
    localStorage.setItem(SESSION_KEY, JSON.stringify(session));
    btn.textContent = 'Entrar →'; btn.disabled = false;
    if (['mestre','gerente','admin'].includes((u.cargo||'').toLowerCase()) || u.loja === 'GERAL' || !!(u.permissoes||{}).master) {
      try {
        if ('caches' in window) {
          const ks = await caches.keys();
          await Promise.all(ks.map(k => caches.delete(k)));
        }
      } catch(e) {}
    }
    showHome(session);
  } catch(e) {
    errEl.textContent = '⚠️ Erro de conexão. Tente novamente.';
    btn.textContent = 'Entrar →'; btn.disabled = false;
  }
}

function doLogout() {
  localStorage.removeItem(SESSION_KEY);
  localStorage.removeItem('gn_nav_loja');
  localStorage.removeItem('gn_last_loja');
  session = null; masterLoja = null;
  document.getElementById('inp-nome').value = '';
  document.getElementById('inp-senha').value = '';
  showLoginScreen();
}

// ── HOME ──────────────────────────────────────────────────────────────────────
function showHome(sess) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('home-screen').style.display  = 'flex';
  const verEl = document.getElementById('hdr-ver');
  if (verEl) verEl.textContent = APP_VERSION;

  LOJAS_LISTA = _computeLojasVisiveis(sess);
  if (masterLoja && !LOJAS_LISTA.includes(masterLoja)) masterLoja = null; // loja fora da rota atual (ex.: rota editada pelo mestre)

  const isMaster = sess.loja === 'GERAL' || !!(sess.permissoes||{}).master;
  const lojaEfetiva = masterLoja || sess.loja;
  setTheme(lojaEfetiva);

  // Header: nome do usuário
  document.getElementById('hdr-user').textContent = sess.nome + (sess.cargo ? ' · ' + sess.cargo : '');

  // Sidebar desktop
  document.body.classList.add('home-active');
  document.getElementById('sb-user').textContent = sess.nome + (sess.cargo ? ' · ' + sess.cargo : '');
  document.getElementById('sb-loja').textContent = isMaster
    ? (masterLoja ? 'Loja ' + (LOJA_DISPLAY[masterLoja] || masterLoja) : _lbTodasLojas())
    : 'Loja ' + (LOJA_DISPLAY[sess.loja] || sess.loja);
  const permsNav = sess.permissoes || {};
  document.getElementById('sb-modules').innerHTML = MODULES
    .filter(m => !m.masterOnly || isMaster)
    .filter(m => !(m.geralOnly && isMaster && masterLoja))
    .filter(m => m.free || (isMaster ? permsNav[m.perm] !== false : (!!permsNav[m.perm] || (m.cargoBypass && m.cargoBypass.includes(sess.cargo)))))
    .map(m => `<button class="sbn-mod" onclick="navTo('${m.url}')"><span class="sbn-mod-icon">${m.icon}</span>${m.name}</button>`)
    .join('');

  // Hero
  const h = new Date().getHours();
  const saudacao = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
  const now = new Date();
  const dias = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  document.getElementById('hero-date').textContent =
    `${now.getDate()} de ${meses[now.getMonth()]} de ${now.getFullYear()}, ${dias[now.getDay()]}`;
  document.getElementById('hero-greeting').textContent = `${saudacao}, ${sess.nome.split(' ')[0]}!`;

  if (isMaster) {
    const dispLoja = masterLoja ? 'Loja ' + (LOJA_DISPLAY[masterLoja] || masterLoja) : _lbTodasLojas();
    document.getElementById('hero-loja-name').textContent = dispLoja;
    document.getElementById('hero-sel-btn').style.display = 'flex';
    // Chip de loja ativa
    let lojaChipEl = document.getElementById('hero-loja-chip');
    if (!lojaChipEl) {
      lojaChipEl = document.createElement('div');
      lojaChipEl.id = 'hero-loja-chip';
      lojaChipEl.style.cssText = 'margin-top:6px;display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.5px';
      document.getElementById('hero-inner').insertBefore(lojaChipEl, document.getElementById('hero-date'));
    }
    if (masterLoja) {
      const cor = COR_LOJA[masterLoja] || '#F26419';
      lojaChipEl.style.background = cor + '22';
      lojaChipEl.style.border = '1px solid ' + cor + '55';
      lojaChipEl.style.color = cor;
      lojaChipEl.innerHTML = `<span style="width:7px;height:7px;border-radius:50%;background:${cor};display:inline-block"></span> LOJA ATIVA`;
      lojaChipEl.style.display = 'inline-flex';
    } else {
      lojaChipEl.style.display = 'none';
    }
    document.getElementById('hero-sub').textContent = masterLoja
      ? 'Navegando como mestre na loja selecionada'
      : 'Acesso mestre — selecione uma loja ou acesse a Mestra';
    renderLojaPickerGrid();
    if (!masterLoja) _renderHealthChips();
  } else {
    document.getElementById('hero-loja-name').textContent = 'Loja ' + (LOJA_DISPLAY[sess.loja] || sess.loja);
    document.getElementById('hero-sel-btn').style.display = 'none';
    document.getElementById('hero-sub').textContent = sess.cargo || '';
  }

  renderModules(sess, isMaster);
  loadBadges(sess, isMaster);

  // Health chips: reset when switching lojas
  const hcEl = document.getElementById('health-chips');
  if (hcEl) hcEl.innerHTML = '';
  if (isMaster && masterLoja) _loadLojaHealthChips(masterLoja);

  // Dashboard: visible for master users when "Todas as lojas" is selected
  const dashEl = document.getElementById('dash-section');
  if (dashEl) {
    if (isMaster && !masterLoja) {
      dashEl.style.display = 'block';
      _dashFat = null; _dashFatPrev = null;
      renderDashboard();
      _loadDashAll();
    } else {
      dashEl.style.display = 'none';
    }
  }
  _renderBotNav(sess, isMaster);

// ── MODULES ───────────────────────────────────────────────────────────────────
function renderModules(sess, isMaster) {
  const perms = sess.permissoes || {};
  const list = document.getElementById('mod-list');

  list.innerHTML = MODULES
    .filter(m => !m.masterOnly || isMaster)
    .filter(m => !(m.geralOnly && isMaster && masterLoja))
    .map(m => {
      const cargoBypassed = m.cargoBypass && m.cargoBypass.includes(sess.cargo);
      const enabled = m.free || (isMaster ? perms[m.perm] !== false : (!!perms[m.perm] || cargoBypassed));
      if (!enabled) return '';
      return `
        <div class="mod-row" onclick="navTo('${m.url}')">
          <div class="mod-icon-box" style="background:${m.bg}1a;border:1px solid ${m.bg}33">${m.icon}</div>
          <div class="mod-body">
            <div class="mod-name">${m.name}</div>
            <div class="mod-sub">${m.sub}</div>
          </div>
          <div class="mod-right">
            <span class="mod-badge bx" id="badge-${m.id}">⋯</span>
          </div>
          <div class="mod-arrow">›</div>
        </div>`;
    }).join('');
}

function navTo(url) {
  const ts = Date.now();
  if (masterLoja) {
    // Loja específica selecionada: propaga para sub-páginas via gn_nav_loja (60s) e gn_last_loja (12h)
    localStorage.setItem('gn_nav_loja',  JSON.stringify({ loja: masterLoja, ts }));
    localStorage.setItem('gn_last_loja', JSON.stringify({ loja: masterLoja, ts }));
    localStorage.setItem('gn_home_loja', JSON.stringify({ loja: masterLoja, ts }));
  } else {
    // "Todas as lojas": remove token de trânsito e estado da home
    // gn_last_loja é preservado — sub-páginas usam para lembrar a última loja trabalhada
    localStorage.removeItem('gn_nav_loja');
    localStorage.removeItem('gn_home_loja');
  }
  window.location.href = url;
}

// ── BADGES ────────────────────────────────────────────────────────────────────
async function loadBadges(sess, isMaster) {
  const perms = sess.permissoes || {};
  const loja  = masterLoja || sess.loja;
  const disp  = LOJA_DISPLAY[loja] || loja;

  if (perms.caixa) {
    if (isMaster && !masterLoja) setBadge('caixa', 'Todas as lojas', 'o');
    else loadCaixaBadge(loja).catch(() => setBadge('caixa', '—'));
  }
  if (perms.checklist) {
    if (isMaster && !masterLoja) setBadge('checklist', 'Todas as lojas', 'o');
    else loadChkBadge(loja).catch(() => setBadge('checklist', '—'));
  }
  if (perms.pedidos)  loadFaltasBadge().catch(()=>setBadge('pedidos','Online','g'));
  if (perms.avaliacoes) {
    if (isMaster && !masterLoja) setBadge('avaliacoes', 'Todas as lojas', 'o');
    else loadAvalBadge(disp, isMaster && !masterLoja);
  }
  if (perms.comissoes) {
    if (isMaster && !masterLoja) setBadge('comissoes', 'Todas as lojas', 'o');
    else loadComBadge(LOJA_COM_KEY[loja] || loja).catch(() => setBadge('comissoes', '—'));
  }
  if (perms.lojas)    setBadge('lojas', 'Online', 'g');
  if (perms.master)   setBadge('mestra', 'Visão consolidada', 'o');
  if (perms.rh)       setBadge('rh', 'Online', 'b');
  if (perms.manutencao || ['gerente','mestre','admin'].includes(sess.cargo)) {
    loadManutBadge().catch(()=>setBadge('manutencao','—'));
  }
}

async function loadManutBadge() {
  const hoje=(d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'))(new Date());
  const res=await fetch(
    `${SB_URL}/rest/v1/checklist_diario?select=manutencao&data_operacao=eq.${hoje}`,
    {headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}}
  );
  const rows=await res.json();
  let pend=0;
  for(const r of (rows||[])){
    if(Array.isArray(r.manutencao)) pend+=r.manutencao.filter(m=>m.status!=='Resolvido').length;
  }
  if(pend>0) setBadge('manutencao',`${pend} pendente${pend>1?'s':''}`, 'o');
  else setBadge('manutencao','Tudo resolvido','g');
}

async function loadFaltasBadge() {
  const hojeStr=(d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'))(new Date());
  try{
    const cached=JSON.parse(localStorage.getItem('gn_faltas_hoje')||'null');
    if(cached&&cached.date===hojeStr){ const n=cached.count; setBadge('pedidos',n>0?`${n} falta${n>1?'s':''} hoje`:'Online',n>0?'o':'g'); return; }
  }catch(_){}
  const res=await fetch(`${SB_URL}/rest/v1/checklist_diario?select=faltas&data_operacao=eq.${hojeStr}`,{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});
  const d=await res.json();
  const n=(d||[]).reduce((t,r)=>t+(Array.isArray(r.faltas)?r.faltas.length:0),0);
  setBadge('pedidos',n>0?`${n} falta${n>1?'s':''} hoje`:'Online',n>0?'o':'g');
}

async function loadCaixaBadge(loja) {
  const hoje = (d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'))(new Date());
  const res = await fetch(
    `${SB_URL}/rest/v1/gn_caixa_fechamento?loja=eq.${encodeURIComponent(loja)}&data=eq.${hoje}&select=status,turno&order=turno.asc`,
    { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY } }
  );
  const d = await res.json();
  if (!d || !d.length) { setBadge('caixa', 'Sem turno hoje', 'x'); return; }
  const fechados = d.filter(r => r.status === 'FECHADO').length;
  if (fechados === d.length) setBadge('caixa', `${d.length} turno${d.length>1?'s':''} fechado${d.length>1?'s':''}`, 'g');
  else setBadge('caixa', `${fechados}/${d.length} fechado${d.length>1?'s':''}`, fechados > 0 ? 'o' : 'b');
}

async function loadChkBadge(loja) {
  const hoje = (d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'))(new Date());
  const lojaDb = LOJA_DB_KEY[loja] || loja;
  const d7 = new Date(); d7.setDate(d7.getDate() - 6);
  const d7s = d7.getFullYear()+'-'+String(d7.getMonth()+1).padStart(2,'0')+'-'+String(d7.getDate()).padStart(2,'0');
  const res = await fetch(
    `${SB_URL}/rest/v1/checklist_diario?data_operacao=gte.${d7s}&loja=eq.${encodeURIComponent(lojaDb)}&select=data_operacao,checklist_pct`,
    { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY } }
  );
  const d = await res.json();
  if (!d || !d.length) { setBadge('checklist', 'Novo hoje', 'b'); return; }
  const todayFilled = d.some(r => r.data_operacao === hoje);
  const pcts = d.filter(r => r.checklist_pct != null).map(r => r.checklist_pct);
  if (pcts.length > 0) {
    const avg = Math.round(pcts.reduce((s,v) => s+v, 0) / pcts.length);
    const col = avg >= 80 ? 'g' : avg >= 60 ? 'o' : 'r';
    setBadge('checklist', `${avg}% · ${todayFilled ? 'Hoje ✓' : 'Pendente'}`, col);
  } else {
    setBadge('checklist', todayFilled ? 'Hoje ✓' : 'Novo hoje', todayFilled ? 'g' : 'b');
  }
}

function loadAvalBadge(disp) {
  try {
    const norm = (disp||'').toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'');
    const avs = JSON.parse(localStorage.getItem('gn_aval_v5_' + norm) || '[]');
    const fin = avs.filter(a => a.finalizada).length;
    // Check for collaborators overdue 90+ days without evaluation
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 90);
    const cutoffStr = cutoff.toISOString().slice(0,10);
    const lastAv = {};
    avs.forEach(a => { if (a.colaborador && a.data > (lastAv[a.colaborador]||'')) lastAv[a.colaborador] = a.data; });
    const overdue = Object.values(lastAv).filter(d => d < cutoffStr).length;
    if (overdue > 0) setBadge('avaliacoes', `${overdue} atrasada${overdue>1?'s':''}`, 'o');
    else setBadge('avaliacoes', fin > 0 ? `${fin} finalizada${fin>1?'s':''}` : 'Nenhuma ainda', fin > 0 ? 'g' : 'x');
  } catch(e) { setBadge('avaliacoes', '—'); }
}

async function loadComBadge(comKey) {
  const res = await fetch(
    `${SB_URL}/rest/v1/gn_comissoes?loja=eq.${comKey}&select=updated_at,all_data&limit=1`,
    { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY } }
  );
  const d = await res.json();
  if (!d || !d.length || !d[0]?.updated_at) { setBadge('comissoes', 'Sem dados', 'x'); return; }
  const row = d[0];
  const ad = typeof row.all_data === 'string' ? JSON.parse(row.all_data) : (row.all_data || {});
  // semIdx = weeks since anchor Mon Jan 5 2026
  const anchor = new Date(2026, 0, 5, 12);
  const today = new Date(); today.setHours(12,0,0,0);
  const curIdx = Math.max(0, Math.floor((today - anchor) / (7 * 86400000)));
  // Find most recent semana with bruto data (last 8 weeks)
  let bestIdx = -1, bestWd = null;
  for (let i = curIdx; i >= Math.max(0, curIdx - 8); i--) {
    const wd = ad[String(i)];
    if (wd && Array.isArray(wd.brutos) && wd.brutos.some(v => (parseFloat(v)||0) > 0)) {
      bestIdx = i; bestWd = wd; break;
    }
  }
  const dt = new Date(row.updated_at);
  const dtStr = dt.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
  if (!bestWd) { setBadge('comissoes', `Sem dados · ${dtStr}`, 'x'); return; }
  try {
    const wd = {
      brutos: bestWd.brutos,
      funcs: (bestWd.funcs||[]).map(f => ({
        nome: f.nome||'', tipo: f.tipo||'CLT / MENSALISTA',
        dias: Array.isArray(f.dias)&&f.dias.length===7 ? f.dias : Array(7).fill('PRESENTE')
      })),
      dist: bestWd.dist || 'NAO', vDist: bestWd.vDist || 0
    };
    const calc = calcSemana(wd, 0);
    const retido = calc.retido;
    const semLabel = bestIdx === curIdx ? 'Sem. atual' : 'Última sem.';
    if (retido > 1) {
      const retStr = Math.round(retido).toLocaleString('pt-BR');
      setBadge('comissoes', `R$ ${retStr} retido`, 'o');
    } else {
      setBadge('comissoes', `${semLabel} ✓ · ${dtStr}`, 'g');
    }
  } catch(e) {
    setBadge('comissoes', `Atualizado ${dtStr}`, 'g');
  }
}

function setBadge(id, text, color) {
  const el = document.getElementById('badge-' + id);
  if (!el) return;
  el.textContent = text;
  el.className = 'mod-badge b' + (color||'x');
}

    ]);
    // Une visitas de gn_chk_visitas (visitantes externos, app check-list) e gn_manut_visitas
    // (equipe de manutenção, app manutenção) num único feed. hora_saida nula = em andamento.
    // hora_chegada 'PLAN' em gn_chk_visitas é apenas um agendamento/provisão, não uma visita real — exclui.

        .filter(r => r.hora_chegada !== 'PLAN' && r.loja !== 'FOLGA' && r.loja !== 'FÉRIAS')
        .map(r => ({ loja: r.loja, nome: r.visitante, cargo: r.cargo, horaChegada: r.hora_chegada, horaSaida: r.hora_saida, origem: 'Visitante' })),
      ...(visitasManutRows || []).map(r => ({ loja: r.loja, nome: r.oficial, cargo: 'Manutenção', horaChegada: r.hora_chegada, horaSaida: r.hora_saida, origem: 'Manutenção' })),
    ].filter(r => LOJAS_LISTA.includes(_normLoja(r.loja)));

    const lojasComCaixa = new Set((cxRows || []).filter(r => r.status === 'FECHADO').map(r => r.loja));
    const lojasComChk   = new Set((clRows  || []).map(r => _normLoja(r.loja)));
    let manutPend = 0;
    const manutPorLoja = {};
    (clRows || []).forEach(r => {
      if (!Array.isArray(r.manutencao)) return;
      const mk = _normLoja(r.loja);
      if (!LOJAS_LISTA.includes(mk)) return;
      const n = r.manutencao.filter(m => m && m.status !== 'Resolvido').length;
      manutPend += n;
      if (n > 0) manutPorLoja[mk] = (manutPorLoja[mk] || 0) + n;
    });
    const visitasAndamento = (visitasRows || []).filter(r => !r.horaSaida);

    const fatTotal = fatData ? LOJAS_LISTA.reduce((s,k) => s + (fatData[k]||0), 0) : null;

    const totalLojas = LOJAS_LISTA.length;
    const cxOk  = LOJAS_LISTA.filter(l => lojasComCaixa.has(l)).length;
    const chkOk = LOJAS_LISTA.filter(l => lojasComChk.has(l)).length;
    const verdes = LOJAS_LISTA.filter(l => lojasComCaixa.has(l) && lojasComChk.has(l)).length;
    const atencao = totalLojas - verdes;

    const chip = (txt, bg, clr) =>
      `<span style="display:inline-flex;align-items:center;gap:4px;background:${bg};border-radius:20px;padding:4px 10px;font-size:10px;font-weight:700;color:${clr}">${txt}</span>`;
    const chipLink = (txt, bg, clr, fn) =>
      `<span onclick="${fn}" style="cursor:pointer;display:inline-flex;align-items:center;gap:4px;background:${bg};border-radius:20px;padding:4px 10px;font-size:10px;font-weight:700;color:${clr}">${txt}</span>`;
    // Registra os detalhes por loja de cada chip pra abrir no toque
    window._chipDetail = {
      ok: { title: '⚠️ Lojas que precisam de atenção', lines: LOJAS_LISTA.filter(l => !(lojasComCaixa.has(l) && lojasComChk.has(l))).map(l => ({
        nome: LOJA_DISPLAY[l] || l,
        extra: [!lojasComCaixa.has(l)?'sem caixa':'', !lojasComChk.has(l)?'sem checklist':''].filter(Boolean).join(' · ')
      })) },
      cx: { title: '💵 Lojas sem caixa fechado hoje', lines: LOJAS_LISTA.filter(l => !lojasComCaixa.has(l)).map(l => ({ nome: LOJA_DISPLAY[l] || l })) },
      chk: { title: '📋 Lojas sem checklist hoje', lines: LOJAS_LISTA.filter(l => !lojasComChk.has(l)).map(l => ({ nome: LOJA_DISPLAY[l] || l })) },
      manut: { title: '🔧 Manutenções pendentes por loja', lines: Object.entries(manutPorLoja).sort((a,b)=>b[1]-a[1]).map(([k,n]) => ({ nome: LOJA_DISPLAY[k] || k, extra: n+(n>1?' itens':' item') })), actionUrl: 'gn-manutencao.html', actionLabel: 'Ver no app Manutenção' },
      visitas: { title: '📍 Visitas hoje', lines: (visitasRows || [])
        .slice()
        .sort((a,b) => (a.horaSaida?1:0) - (b.horaSaida?1:0) || String(b.horaChegada||'').localeCompare(String(a.horaChegada||'')))
        .map(r => {
          const k = _normLoja(r.loja);
          const nome = window.escapeHtml ? window.escapeHtml(r.nome || '?') : (r.nome || '?');
          const status = r.horaSaida ? `saiu ${r.horaSaida}` : `🟢 desde ${r.horaChegada || '?'}`;
          return { nome: `${nome} · ${LOJA_DISPLAY[k] || k}`, extra: `${r.origem} · ${status}` };
        }) },
    };
    const chips = [];
    if (fatTotal > 0) chips.push(chip(`📈 ${_fmtBRLs(fatTotal)} / sem`, 'rgba(242,100,25,.15)', '#fb923c'));
    const okBg  = verdes===totalLojas?'rgba(34,197,94,.15)':verdes===0?'rgba(239,68,68,.15)':'rgba(251,191,36,.12)';
    const okClr = verdes===totalLojas?'#22c55e':verdes===0?'#f87171':'#fbbf24';
    const okIco = verdes===totalLojas?'✅':verdes===0?'⛔':'⚠️';
    chips.push(atencao > 0 ? chipLink(`${okIco} ${verdes}/${totalLojas} lojas ok`, okBg, okClr, "_openChipDetail('ok')") : chip(`${okIco} ${verdes}/${totalLojas} lojas ok`, okBg, okClr));
    if (atencao > 0) chips.push(chipLink(`⚠️ ${atencao} atenção`, 'rgba(251,191,36,.12)', '#fbbf24', '_navToAtt()'));
    if (cxOk < totalLojas) chips.push(chipLink(`💵 ${cxOk}/${totalLojas} cx`, 'rgba(255,255,255,.07)', '#5a5a9a', "_openChipDetail('cx')"));
    if (chkOk < totalLojas) chips.push(chipLink(`📋 ${chkOk}/${totalLojas} chk`, 'rgba(255,255,255,.07)', '#5a5a9a', "_openChipDetail('chk')"));
    if (manutPend > 0) chips.push(chipLink(`🔧 ${manutPend} manut.`, 'rgba(249,115,22,.12)', '#f97316', "_openChipDetail('manut')"));
    const visitasHoje = (visitasRows||[]).length;
    const andamentoCount = visitasAndamento.length;
    if (andamentoCount > 0) chips.push(chipLink(`<span class="chip-live-dot"></span> ${andamentoCount} em andamento`, 'rgba(34,197,94,.12)', '#22c55e', "_openChipDetail('visitas')"));
    if (visitasHoje > 0) chips.push(chipLink(`📍 ${visitasHoje} visita${visitasHoje>1?'s':''} hoje`, 'rgba(124,131,253,.12)', '#a5b4fc', "_openChipDetail('visitas')"));

    el.innerHTML = chips.join('');

    // Enquanto o Painel de Gestão ("Todas as lojas") estiver aberto, atualiza os chips
    // periodicamente pra refletir visitas em andamento em tempo (quase) real.
    const isMasterNow = session && (session.loja === 'GERAL' || !!(session.permissoes||{}).master);
    if (isMasterNow && !masterLoja) {
      _healthChipsTimer = setTimeout(() => {
        if (session && !masterLoja) _renderHealthChips();
      }, 30000);
    }
  } catch(e) {
    el.innerHTML = '';
  }
}

function _p2(n){ return String(n).padStart(2,'0'); }

function _loadMetas() {
  try { _dashMetas = JSON.parse(localStorage.getItem('gn_home_metas')||'{}'); } catch(e) { _dashMetas={}; }
  // Merge with Supabase-persisted metas from session (fills in missing keys)
  const supaMetas = session && session.permissoes && session.permissoes.dashboard_metas;
  if (supaMetas && typeof supaMetas === 'object') {
    let changed = false;
    Object.keys(supaMetas).forEach(k => { if (!_dashMetas[k]) { _dashMetas[k] = supaMetas[k]; changed = true; } });
    if (changed) try { localStorage.setItem('gn_home_metas', JSON.stringify(_dashMetas)); } catch(e) {}
  }
}

let _metasSaveTimer = null;
function _saveMeta(loja, val) {
  _dashMetas[loja] = parseFloat(val)||0;
  try { localStorage.setItem('gn_home_metas', JSON.stringify(_dashMetas)); } catch(e) {}
  if (_metasSaveTimer) clearTimeout(_metasSaveTimer);
  _metasSaveTimer = setTimeout(_saveMetasToSupa, 1500);
}

async function _saveMetasToSupa() {
  if (!session || !session.id) return;
  const updated = Object.assign({}, session.permissoes || {}, { dashboard_metas: _dashMetas });
  try {
    const res = await fetch(`${SB_URL}/rest/v1/gn_usuarios?id=eq.${session.id}`, {
      method: 'PATCH',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify({ permissoes: updated })
    });
    if (res.ok) {
      session.permissoes = updated;
      try { localStorage.setItem(SESSION_KEY, JSON.stringify(session)); } catch(e) {}
    }
  } catch(e) {}
}

function _weekRange(off) {
  const now = new Date(), dow = now.getDay();
  const mon = new Date(now);
  mon.setDate(now.getDate() + (dow===0?-6:1-dow) + off*7);
  const dates = [];
  for (let i=0; i<7; i++) {
    const dd = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate()+i);
    dates.push(`${dd.getFullYear()}-${_p2(dd.getMonth()+1)}-${_p2(dd.getDate())}`);
  }
  const fd = s => s.slice(8)+'/'+s.slice(5,7);
  return { dates, from:dates[0], to:dates[6], label:fd(dates[0])+'–'+fd(dates[6]), isCurrent:off===0 };
}

function _monthRange(off) {
  const now = new Date();
  const first = new Date(now.getFullYear(), now.getMonth()+off, 1);
  const last  = new Date(now.getFullYear(), now.getMonth()+off+1, 0);
  const dates = [];
  for (let d=1; d<=last.getDate(); d++)
    dates.push(`${first.getFullYear()}-${_p2(first.getMonth()+1)}-${_p2(d)}`);
  const M=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return { dates, from:dates[0], to:dates[dates.length-1],
           label:M[first.getMonth()]+' '+first.getFullYear(), isCurrent:off===0 };
}

function _fmtBRL(n) {
  if (!n) return 'R$ 0,00';
  return 'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function _fmtBRLs(n) {
  if (!n) return '—';
  if (n>=1000000) return 'R$ '+(n/1000000).toFixed(1).replace('.',',')+'M';
  if (n>=1000)    return 'R$ '+(n/1000).toFixed(1).replace('.',',')+'k';
  return _fmtBRL(n);
}

async function _fetchFat(dates) {
  if (!dates || !dates.length) return {};
  const from = dates[0], to = dates[dates.length - 1];
  const res = await fetch(
    `${SB_URL}/rest/v1/checklist_diario?data_operacao=gte.${from}&data_operacao=lte.${to}&select=loja,venda_salao,venda_delivery`,
    { headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY} }
  );
  if (!res.ok) throw new Error('HTTP '+res.status);
  const rows = await res.json();
  const byLoja = {};
  LOJAS_LISTA.forEach(k=>{ byLoja[k]=0; });
  (rows||[]).forEach(r=>{
    const key=_normLoja(r.loja);
    const v=(parseFloat(r.venda_salao)||0)+(parseFloat(r.venda_delivery)||0);
    if (Object.prototype.hasOwnProperty.call(byLoja,key)) byLoja[key]+=v;
  });
  return byLoja;
}

function _comSemIdx(mondayISO) {
  const mon = new Date(mondayISO + 'T12:00:00');
  const anchor = new Date(2026, 0, 5, 12, 0, 0); // Jan 5, 2026 – mesma âncora do gn-comissoes-mestra
  return Math.max(0, Math.floor((mon - anchor) / (7 * 86400000)));
}

const _COM_KEY_TO_LOJA = Object.fromEntries(Object.entries(LOJA_COM_KEY).map(([k,v])=>[v,k]));

async function _fetchFatByDay(dates) {
  if (!dates || !dates.length) return { byDay: {}, byLojaDay: {} };
  const from = dates[0], to = dates[dates.length - 1];
  const res = await fetch(
    `${SB_URL}/rest/v1/checklist_diario?data_operacao=gte.${from}&data_operacao=lte.${to}&select=loja,data_operacao,venda_salao,venda_delivery`,
    { headers: {apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY} }
  );
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const rows = await res.json();
  const byDay = {}, byLojaDay = {};
  (rows || []).forEach(r => {
    const v = (parseFloat(r.venda_salao) || 0) + (parseFloat(r.venda_delivery) || 0);
    byDay[r.data_operacao] = (byDay[r.data_operacao] || 0) + v;
    const lk = _normLoja(r.loja);
    if (LOJAS_LISTA.includes(lk)) {
      if (!byLojaDay[lk]) byLojaDay[lk] = {};
      byLojaDay[lk][r.data_operacao] = (byLojaDay[lk][r.data_operacao] || 0) + v;
    }
  });
  return { byDay, byLojaDay };
}

async function _fetchComDia(mondayISO) {
  const semIdx = String(_comSemIdx(mondayISO));
  const comKeys = Object.values(LOJA_COM_KEY).join(',');
  const res = await fetch(
    `${SB_URL}/rest/v1/gn_comissoes?loja=in.(${comKeys})&select=loja,all_data`,
    { headers: {apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY} }
  );
  if (!res.ok) return { totals: Array(7).fill(0), byLoja: {} };
  const rows = await res.json();
  const totals = Array(7).fill(0);
  const byLoja = {};
  (rows || []).forEach(r => {
    if (!r.all_data || !r.all_data[semIdx]) return;
    const brutos = r.all_data[semIdx].brutos;
    if (!Array.isArray(brutos)) return;
    const lk = _COM_KEY_TO_LOJA[r.loja];
    if (!lk || !LOJAS_LISTA.includes(lk)) return;
    byLoja[lk] = brutos.map(v => parseFloat(v) || 0);
    for (let d = 0; d < 7; d++) totals[d] += parseFloat(brutos[d]) || 0;
  });
  return { totals, byLoja };
}

async function _loadDashAll() {
  if (_dashLoading) return;
  _dashLoading = true;
  const range     = _dashPer==='sem' ? _weekRange(_dashWoff)   : _monthRange(_dashMoff);
  const prevRange = _dashPer==='sem' ? _weekRange(_dashWoff-1) : _monthRange(_dashMoff-1);
  const range2    = _dashPer==='sem' ? _weekRange(_dashWoff-2)  : _monthRange(_dashMoff-2);
  const range3    = _dashPer==='sem' ? _weekRange(_dashWoff-3)  : _monthRange(_dashMoff-3);
  const hoje  = new Date().toISOString().slice(0,10);
  const H     = {apikey:SB_KEY,Authorization:'Bearer '+SB_KEY};
  try {
    const weekRange = _weekRange(_dashPer==='sem' ? _dashWoff : 0);
    const [fatCur, fatPrv, fat2, fat3, manutRows, chkRows, manutItemsRows, fatDia, comDia] = await Promise.all([
      _fetchFat(range.dates).catch(()=>({})),
      _fetchFat(prevRange.dates).catch(()=>({})),
      _fetchFat(range2.dates).catch(()=>({})),
      _fetchFat(range3.dates).catch(()=>({})),
      fetch(`${SB_URL}/rest/v1/checklist_diario?data_operacao=eq.${hoje}&select=loja,manutencao`,{headers:H})
        .then(r=>r.ok?r.json():[]).catch(()=>[]),
      fetch(`${SB_URL}/rest/v1/checklist_diario?data_operacao=eq.${hoje}&select=loja`,{headers:H})
        .then(r=>r.ok?r.json():[]).catch(()=>[]),
      fetch(`${SB_URL}/rest/v1/gn_manut_itens?status=neq.Resolvido&select=criado_em`,{headers:H})
        .then(r=>r.ok?r.json():[]).catch(()=>[]),
      _fetchFatByDay(_dashPer==='sem' ? range.dates : weekRange.dates).catch(()=>({byDay:{},byLojaDay:{}})),
      _fetchComDia(_dashPer==='sem' ? range.dates[0] : weekRange.dates[0]).catch(()=>({totals:Array(7).fill(0),byLoja:{}})),
    ]);
    _dashFat = fatCur; _dashFatPrev = fatPrv;
    _dashFatDia = fatDia.byDay || {}; _dashFatDiaLoja = fatDia.byLojaDay || {};
    _dashComDia = comDia.totals || Array(7).fill(0); _dashComDiaLoja = comDia.byLoja || {};
    // count pending maintenance from today's checklist only (dia a dia, sem acumular)
    const byManut = {}; LOJAS_LISTA.forEach(k=>{byManut[k]=0;});
    (manutRows||[]).forEach(row=>{
      if(!Array.isArray(row.manutencao)) return;
      const pend = row.manutencao.filter(m=>m&&m.status!=='Resolvido').length;
      const mk=_normLoja(row.loja);
      if(Object.prototype.hasOwnProperty.call(byManut,mk)) byManut[mk]+=pend;
    });
    _dashManut = byManut;
    _dashChk   = new Set((chkRows||[]).map(r=>_normLoja(r.loja)).filter(l=>LOJAS_LISTA.includes(l)));
    const old5 = new Date(); old5.setDate(old5.getDate()-5);
    _dashManutCrit = (manutItemsRows||[]).filter(r=>r.criado_em&&new Date(r.criado_em)<old5).length;
    const spark={}; LOJAS_LISTA.forEach(k=>{spark[k]=[(fat3[k]||0),(fat2[k]||0),(fatPrv[k]||0),(fatCur[k]||0)];});
    _dashSparkData=spark;
  } catch(e) {
    _dashFat=_dashFat||{}; _dashFatPrev=_dashFatPrev||{};
    _dashManut=_dashManut||{}; _dashChk=_dashChk||new Set();
  } finally { _dashLoading=false; _dashLoadedAt=new Date(); }
  renderDashboard();
}

function _sparkSVG(vals) {
  if (!vals || vals.every(v=>v===0)) return '';
  const w=60, h=18;
  const max=Math.max(...vals,1);
  const xs=vals.map((_,i)=>i/(vals.length-1)*w);
  const ys=vals.map(v=>h-(v/max)*(h-4)-2);
  const pts=xs.map((x,i)=>`${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
  const lc=vals[vals.length-1]>=(vals[vals.length-2]||0)?'#4ade80':'#f87171';
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;overflow:visible">
    <polyline points="${pts}" fill="none" stroke="${lc}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".65"/>
    <circle cx="${xs[xs.length-1].toFixed(1)}" cy="${ys[ys.length-1].toFixed(1)}" r="2" fill="${lc}"/>
  </svg>`;
}

function _buildKPIRow() {
  if(!_dashFat) return `<div class="kpi-row">${['Faturamento','Variação','% Média Meta','CHK Hoje'].map(lbl=>`<div class="kpi-tile"><div class="kpi-tile-lbl">${lbl}</div><div class="kpi-tile-val" style="color:rgba(255,255,255,.2)">—</div></div>`).join('')}</div>`;
  const fat=_dashFat, fatP=_dashFatPrev;
  const total=LOJAS_LISTA.reduce((s,k)=>s+(fat[k]||0),0);
  const totalP=fatP?LOJAS_LISTA.reduce((s,k)=>s+(fatP[k]||0),0):0;
  const delta=totalP>0?Math.round((total-totalP)/totalP*100):null;
  const dStr=delta===null?'—':(delta>=0?'+':'')+delta+'%';
  const dClr=delta===null?'rgba(255,255,255,.3)':delta>=0?'#4ade80':'#f87171';
  let mSum=0,mN=0;
  LOJAS_LISTA.forEach(k=>{if(_dashMetas[k]>0){mSum+=Math.min(100,Math.round((fat[k]||0)/_dashMetas[k]*100));mN++;}});
  const avgM=mN>0?Math.round(mSum/mN):null;
  const mClr=avgM===null?'rgba(255,255,255,.3)':avgM>=100?'#4ade80':avgM>=75?'#fbbf24':'#f87171';
  const stAbove=LOJAS_LISTA.filter(k=>_dashMetas[k]>0&&(fat[k]||0)>=_dashMetas[k]).length;
  const stMN=LOJAS_LISTA.filter(k=>_dashMetas[k]>0).length;
  const chkN=_dashChk?LOJAS_LISTA.filter(l=>_dashChk.has(l)).length:null;
  const chkClr=chkN===null?'rgba(255,255,255,.3)':chkN===LOJAS_LISTA.length?'#4ade80':chkN>0?'#fbbf24':'#f87171';
  const t=(lbl,val,sub,vc='#fff')=>`<div class="kpi-tile">
    <div class="kpi-tile-lbl">${lbl}</div>
    <div class="kpi-tile-val" style="color:${vc}">${val}</div>
    ${sub?`<div class="kpi-tile-sub">${sub}</div>`:''}
  </div>`;
  return `<div class="kpi-row">
    ${t('Faturamento',_fmtBRLs(total)||'—',delta!==null?`<span style="color:${dClr}">${dStr} vs anterior</span>`:'')}
    ${t('Variação',dStr,'vs período anterior',dClr)}
    ${avgM!==null?t('% Média Meta',avgM+'%',`${stAbove}/${stMN} acima da meta`,mClr):t('% Média Meta','—','configure em Metas')}
    ${t('CHK Hoje',chkN!==null?chkN+'/'+LOJAS_LISTA.length:'—',chkN===LOJAS_LISTA.length?'todas em dia':chkN>0?'algumas sem checklist':'nenhum hoje',chkClr)}
  </div>`;
}

function _buildBarChart(sorted) {
  const fat=_dashFat, fatP=_dashFatPrev;
  const max=Math.max(...LOJAS_LISTA.map(k=>fat?(fat[k]||0):0),1);
  return sorted.map(k=>{
    const v=fat?(fat[k]||0):0; if(!v) return '';
    const cor=COR_LOJA[k]||'#888';
    const meta=_dashMetas[k]||0;
    const vP=fatP?(fatP[k]||0):0;
    const d=vP>0?Math.round((v-vP)/vP*100):null;
    const dClr=d===null?'rgba(255,255,255,.3)':d>=0?'#4ade80':'#f87171';
    const mp=meta>0?Math.min(100,v/meta*100):null;
    const bc=mp!==null?(mp>=100?'#4ade80':mp>=75?'#fbbf24':'#f87171'):cor;
    const pct=v/max*100;
    const metaMarkerPct=meta>0?Math.min(100,meta/max*100):null;
    return `<div class="bi-bar-row">
      <div class="bi-bar-name" title="${LOJA_DISPLAY[k]||k}">${LOJA_DISPLAY[k]||k}</div>
      <div class="bi-bar-track">
        <div class="bi-bar-fill" style="width:${pct.toFixed(1)}%;background:${bc}99"></div>
        ${metaMarkerPct!==null?`<div style="position:absolute;top:0;bottom:0;left:${metaMarkerPct.toFixed(1)}%;width:2px;background:${bc};opacity:.7"></div>`:''}
      </div>
      <div class="bi-bar-val">${_fmtBRLs(v)}<br><span style="color:${dClr};font-size:9px">${d!==null?(d>=0?'+':'')+d+'%':'—'}</span></div>
    </div>`;
  }).join('');
}

function _buildTableView(sorted) {
  const fat=_dashFat, fatP=_dashFatPrev;
  const thS=(col)=>`onclick="_sortTable('${col}')" class="${_dashSortBy===col?'sort-cur':''}"`;
  const sortIco=(col)=>_dashSortBy===col?(_dashSortDir==='desc'?' ↓':' ↑'):'';
  const rows=sorted.map(k=>{
    const v=fat?(fat[k]||0):0;
    const vP=fatP?(fatP[k]||0):0;
    const meta=_dashMetas[k]||0;
    const d=vP>0?Math.round((v-vP)/vP*100):null;
    const mp=meta>0?Math.round(v/meta*100):null;
    const mpC=mp===null?'rgba(255,255,255,.3)':mp>=100?'#4ade80':mp>=75?'#fbbf24':'#f87171';
    const dC=d===null?'rgba(255,255,255,.3)':d>=0?'#4ade80':'#f87171';
    const chk=_dashChk?_dashChk.has(k):null;
    const manut=_dashManut?(_dashManut[k]||0):0;
    const cor=COR_LOJA[k]||'#888';
    return `<tr>
      <td><span style="width:7px;height:7px;border-radius:50%;background:${cor};display:inline-block;margin-right:5px"></span>${LOJA_DISPLAY[k]||k}</td>
      <td style="color:${v>0?'#fff':'rgba(255,255,255,.25)'};font-weight:700">${v>0?_fmtBRLs(v):'—'}</td>
      <td style="color:${dC};font-weight:700">${d!==null?(d>=0?'+':'')+d+'%':'—'}</td>
      <td style="color:${mpC};font-weight:700">${mp!==null?mp+'%':'—'}</td>
      <td>${chk===true?'✅':chk===false?'⚠':'—'}</td>
      <td>${manut>0?`<span style="color:#f87171">🔧${manut}</span>`:'—'}</td>
    </tr>`;
  }).join('');
  return `<div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
    <table class="bi-table">
      <thead><tr>
        <th ${thS('nome')} style="text-align:left">Loja${sortIco('nome')}</th>
        <th ${thS('fat')}>Fat.${sortIco('fat')}</th>
        <th ${thS('delta')}>Δ%${sortIco('delta')}</th>
        <th ${thS('meta')}>Meta%${sortIco('meta')}</th>
        <th>CHK</th>
        <th>Manut.</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function _buildAlertsFeed() {
  const fat=_dashFat, fatP=_dashFatPrev, metas=_dashMetas;
  const alerts=[];
  LOJAS_LISTA.forEach(k=>{
    const v=fat?(fat[k]||0):0;
    const vP=fatP?(fatP[k]||0):0;
    const meta=metas[k]||0;
    const nome=LOJA_DISPLAY[k]||k;
    const d=vP>0?Math.round((v-vP)/vP*100):null;
    if(d!==null&&d<=-15) alerts.push({sev:0,cor:'#f87171',ico:'📉',msg:`${nome} caiu ${Math.abs(d)}% vs período anterior`,sub:`${_fmtBRLs(v)} vs ${_fmtBRLs(vP)} ant.`});
    if(meta>0&&v>0){const mp=Math.round(v/meta*100);if(mp<60)alerts.push({sev:1,cor:'#fbbf24',ico:'🎯',msg:`${nome} em ${mp}% da meta`,sub:`${_fmtBRLs(v)} de ${_fmtBRLs(meta)}`});}
    if(_dashManut&&(_dashManut[k]||0)>0)alerts.push({sev:1,cor:'#f97316',ico:'🔧',msg:`${nome} com ${_dashManut[k]} manut. pendente${_dashManut[k]>1?'s':''}`,sub:'Toque no banner para ver'});
    if(_dashChk&&!_dashChk.has(k))alerts.push({sev:2,cor:'#60a5fa',ico:'📋',msg:`${nome} sem checklist hoje`,sub:'Checklist do dia não enviado'});
    if(!v)alerts.push({sev:3,cor:'rgba(255,255,255,.15)',ico:'⚠️',msg:`${nome} sem faturamento no período`,sub:'Dados não enviados'});
  });
  alerts.sort((a,b)=>a.sev-b.sev);
  if(!alerts.length) return '<div style="padding:24px;text-align:center;font-size:13px;color:#4ade80">✅ Nenhum alerta</div>';
  return `<div style="margin-bottom:8px;font-size:10px;font-weight:700;color:rgba(255,255,255,.3);letter-spacing:.5px;text-transform:uppercase">${alerts.length} alerta${alerts.length>1?'s':''} · mais crítico primeiro</div>`
    +alerts.map(a=>`<div class="alrt" style="border-left-color:${a.cor}">
      <span class="alrt-ico">${a.ico}</span>
      <div><div class="alrt-msg">${a.msg}</div><div class="alrt-sub">${a.sub}</div></div>
    </div>`).join('');
}

function _sortTable(col){
  if(_dashSortBy===col)_dashSortDir=_dashSortDir==='desc'?'asc':'desc';

  renderDashboard();
}

function _setViewMode(m){ _dashViewMode=m; renderDashboard(); }

function _buildDiaGrid() {
  const wr = _weekRange(_dashPer === 'sem' ? _dashWoff : 0);
  const hoje = new Date().toISOString().slice(0, 10);
  const dias = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
  let fatTotal = 0, comTotal = 0;
  const cols = wr.dates.map((dt, i) => {
    const fat = _dashFatDia ? (_dashFatDia[dt] || 0) : null;
    const com = _dashComDia ? (_dashComDia[i] || 0) : null;
    if (fat) fatTotal += fat;
    if (com) comTotal += com;
    const isHoje = dt === hoje;
    const isFuturo = dt > hoje;
    const ddmm = dt.slice(8) + '/' + dt.slice(5, 7);
    return { dt, dia: dias[i], ddmm, fat, com, isHoje, isFuturo };
  });

  const cellStyle = (isHoje, isFuturo) => {
    if (isHoje) return 'background:rgba(242,100,25,.13);border-color:rgba(242,100,25,.35)';
    if (isFuturo) return 'opacity:.35';
    return '';
  };

  const fmtK = v => {
    if (!v) return '—';
    if (v >= 1000000) return 'R$' + (v / 1000000).toFixed(1).replace('.', ',') + 'M';
    if (v >= 1000) return 'R$' + (v / 1000).toFixed(1).replace('.', ',') + 'k';
    return 'R$' + v.toFixed(0);
  };

  const headers = cols.map(c =>
    `<th style="text-align:center;font-size:9px;font-weight:700;color:${c.isHoje ? '#f97316' : 'rgba(255,255,255,.4)'};padding:5px 3px 3px;white-space:nowrap">${c.dia}<br><span style="font-weight:400;font-size:8px">${c.ddmm}</span></th>`
  ).join('');

  const fatRow = cols.map(c => {
    const v = c.fat;
    return `<td style="text-align:center;font-size:9px;font-weight:700;color:${v ? '#e2e8f0' : 'rgba(255,255,255,.18)'};padding:4px 2px;${cellStyle(c.isHoje, c.isFuturo)}">${fmtK(v)}</td>`;
  }).join('');

  const comRow = cols.map(c => {
    const v = c.com;
    return `<td style="text-align:center;font-size:9px;font-weight:700;color:${v ? '#60a5fa' : 'rgba(255,255,255,.18)'};padding:4px 2px;${cellStyle(c.isHoje, c.isFuturo)}">${fmtK(v)}</td>`;
  }).join('');

  const loadingMsg = _dashFatDia === null ? '<div style="text-align:center;font-size:10px;color:rgba(255,255,255,.3);padding:8px 0">Carregando…</div>' : '';

  return `<div style="background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:10px 10px 8px;margin-bottom:10px">
    <div style="font-size:9px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:7px">Dia a Dia · Semana Atual</div>
    ${loadingMsg}
    <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
      <table style="width:100%;border-collapse:collapse;table-layout:fixed;min-width:300px">
        <thead>
          <tr>
            <th style="text-align:left;font-size:9px;font-weight:700;color:rgba(255,255,255,.25);padding:5px 3px 3px;width:42px"></th>
            ${headers}
          </tr>
        </thead>
        <tbody>
          <tr>
            <td style="font-size:9px;font-weight:700;color:rgba(255,255,255,.3);padding:4px 3px;white-space:nowrap">💰 Fat.</td>
            ${fatRow}
          </tr>
          <tr>
            <td style="font-size:9px;font-weight:700;color:rgba(255,255,255,.3);padding:4px 3px;white-space:nowrap">💼 Com.</td>
            ${comRow}
          </tr>
        </tbody>
      </table>
    </div>
    ${fatTotal > 0 || comTotal > 0 ? `<div style="display:flex;gap:12px;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.06)">
      <span style="font-size:9px;color:rgba(255,255,255,.35)">Total semana: <b style="color:#e2e8f0">${fmtK(fatTotal)}</b></span>
      ${comTotal > 0 ? `<span style="font-size:9px;color:rgba(255,255,255,.35)">Comissão: <b style="color:#60a5fa">${fmtK(comTotal)}</b></span>` : ''}
    </div>` : ''}
  </div>`;
}

function renderDashboard() {
  const el = document.getElementById('dash-section');

  _loadMetas();

  const range   = _dashPer==='sem' ? _weekRange(_dashWoff) : _monthRange(_dashMoff);
  const fat     = _dashFat;
  const loading = fat===null;
  let total=0, storesWithData=0, maxVal=0;

        <div style="font-size:10px;margin-top:1px">${_dashManutCrit>0?`<span style="color:#f87171;font-weight:700">${_dashManutCrit} há mais de 5 dias</span> · <span style="color:rgba(255,255,255,.28)">toque para ver</span>`:'<span style="color:rgba(255,255,255,.28)">toque para ver</span>'}</div></div>

    </div>`;

  let content='';

  if (_dashTab==='fat') {
    const perLabel = _dashPer==='sem' ? 'esta semana' : 'este mês';

    const missLojas = fat ? LOJAS_LISTA.filter(k=>!(fat[k]&&fat[k]>0)) : [];
    const subLine = loading ? 'Carregando dados…'
      : missLojas.length===0 ? 'Todas as lojas com dados ' + perLabel
      : storesWithData + ' de ' + LOJAS_LISTA.length + ' · sem dados: ' + missLojas.map(k=>LOJA_DISPLAY[k]||k).join(', ');
    // Ranking
