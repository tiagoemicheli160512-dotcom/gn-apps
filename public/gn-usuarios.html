<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>GN Usuários</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0D0D1E;color:#E8E8F0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
input,select,button{font-family:inherit}
button{cursor:pointer}
.hidden{display:none!important}
/* Login */
#tela-login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.logo{text-align:center;margin-bottom:32px}
.logo-icon{font-size:48px;margin-bottom:8px}
.logo-tag{font-size:11px;letter-spacing:4px;color:#FF6B35;text-transform:uppercase;margin-bottom:4px}
.logo-title{font-size:22px;font-weight:800;color:#FFD700}
.card{width:100%;max-width:380px;background:#12122A;border:1px solid #2A2A50;border-radius:16px;padding:28px 24px;box-shadow:0 8px 32px #00000060}
.card-title{font-size:13px;font-weight:700;color:#FFD700;margin-bottom:20px;text-align:center}
.field{margin-bottom:16px}
.field label{font-size:11px;color:#7A7A9A;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:6px}
.field input,.field select{width:100%;background:#1A1A35;border:1px solid #2A2A50;border-radius:10px;color:#E8E8F0;padding:12px 14px;font-size:14px;outline:none}
.field input:focus,.field select:focus{border-color:#FF6B35}
.field .pw-wrap{position:relative}
.field .pw-wrap input{padding-right:44px}
.field .pw-wrap button{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#7A7A9A;font-size:16px;padding:0;line-height:1}
.btn-primary{width:100%;padding:14px;background:#FF6B35;border:none;border-radius:10px;color:#fff;font-weight:800;font-size:15px;transition:opacity .2s}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.err-box{background:#FF444418;border:1px solid #FF444444;border-radius:8px;padding:10px 12px;margin-bottom:16px;font-size:12px;color:#FF4444;text-align:center}
/* App shell */
#app{display:none;flex-direction:column;min-height:100vh}
header{background:#12122A;border-bottom:2px solid #FF6B35;padding:13px 16px;display:flex;align-items:center;gap:10;position:sticky;top:0;z-index:100}
header .hd-info{flex:1}
header .hd-tag{font-size:9px;color:#FF6B35;letter-spacing:3px;text-transform:uppercase}
header .hd-title{font-size:17px;font-weight:800;color:#FFD700}
header .hd-user{font-size:11px;color:#7A7A9A;margin-top:1px}
header .btn-sair{background:none;border:1px solid #2A2A50;border-radius:6px;color:#7A7A9A;font-size:10px;padding:5px 10px}
main{flex:1;padding:16px;padding-bottom:80px;max-width:600px;margin:0 auto;width:100%}
/* Stats bar */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.stat-card{background:#1A1A35;border:1px solid #2A2A50;border-radius:10px;padding:12px 8px;text-align:center}
.stat-val{font-size:24px;font-weight:800;font-family:Consolas,monospace}
.stat-lbl{font-size:10px;color:#7A7A9A;margin-top:2px}
/* Section */
.section{margin-bottom:24px}
.section-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-hd h2{font-size:12px;font-weight:700;color:#FF6B35;text-transform:uppercase;letter-spacing:2px}
.btn-add{background:#FF6B35;color:#fff;border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:700}
/* User card */
.user-card{background:#1A1A35;border:1px solid #2A2A50;border-radius:12px;padding:14px 15px;margin-bottom:8px;display:flex;align-items:center;gap:12}
.user-card.inactive{opacity:.5}
.user-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-cargo{font-size:11px;color:#7A7A9A;margin-top:1px}
.user-actions{display:flex;gap:6px;flex-shrink:0}
.btn-sm{padding:5px 10px;border-radius:7px;border:none;font-size:11px;font-weight:600}
.btn-edit{background:#FFD70022;color:#FFD700;border:1px solid #FFD70044}
.btn-block{background:#FF444422;color:#FF4444;border:1px solid #FF444444}
.btn-unblock{background:#00C85122;color:#00C851;border:1px solid #00C85144}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:9px;font-weight:700;text-transform:uppercase;margin-left:6px}
.badge-on{background:#00C85122;color:#00C851}
.badge-off{background:#FF444422;color:#FF4444}
/* Loja group header */
.loja-group{margin-bottom:20px}
.loja-hd{font-size:11px;font-weight:700;color:#7A7A9A;text-transform:uppercase;letter-spacing:2px;padding:4px 0 8px;border-bottom:1px solid #2A2A50;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
/* Modal */
.overlay{position:fixed;inset:0;background:#00000088;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#12122A;border:1px solid #2A2A50;border-radius:16px;padding:24px;width:100%;max-width:380px;max-height:90vh;overflow-y:auto}
.modal h3{font-size:15px;font-weight:800;color:#FFD700;margin-bottom:20px}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.btn-cancel{flex:1;padding:12px;background:none;border:1px solid #2A2A50;border-radius:10px;color:#7A7A9A;font-weight:700;font-size:13px}
.btn-save{flex:1;padding:12px;background:#FF6B35;border:none;border-radius:10px;color:#fff;font-weight:800;font-size:13px}
/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#00C851;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:700;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.toast.err{background:#FF4444}
/* Search */
.search-wrap{position:relative;margin-bottom:16px}
.search-wrap input{width:100%;background:#1A1A35;border:1px solid #2A2A50;border-radius:10px;color:#E8E8F0;padding:10px 14px 10px 36px;font-size:13px;outline:none}
.search-wrap input:focus{border-color:#FF6B35}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#7A7A9A;font-size:14px;pointer-events:none}
/* Permissões */
.perm-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.perm-row span{font-size:12px;color:#E8E8F0}
.perm-row select{flex:0 0 140px;background:#1A1A35;border:1px solid #2A2A50;border-radius:8px;color:#E8E8F0;padding:7px 8px;font-size:12px;outline:none}
.perm-row select:focus{border-color:#FF6B35}
/* Abas */
.abas-app{margin-bottom:12px}
.abas-app-title{font-size:10px;color:#7A7A9A;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:6px}
.abas-grid{display:flex;flex-wrap:wrap;gap:4px}
.aba-chip{display:flex;align-items:center;gap:4px;background:#1A1A35;border:1px solid #2A2A50;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:11px;color:#E8E8F0;user-select:none}
.aba-chip input{accent-color:#FF6B35;cursor:pointer}

/* ── DESKTOP SIDEBAR ──────────────────────────── */
#sidebar-nav{display:none}
@media(min-width:768px){
  body.usuarios-active{padding-left:224px}
  body.usuarios-active #sidebar-nav{display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;width:224px;background:#12122A;border-right:1px solid #2A2A50;overflow-y:auto;z-index:50}
  body.usuarios-active main{max-width:none;padding-bottom:24px}
  .sbn-brand{padding:16px 14px 14px;border-bottom:1px solid #2A2A50;flex-shrink:0}
  .sbn-icon{font-size:28px;margin-bottom:6px}
  .sbn-tag{font-size:9px;color:#FF6B35;letter-spacing:3px;text-transform:uppercase;font-weight:700}
  .sbn-title{font-size:14px;font-weight:800;color:#FFD700;margin-top:3px}
  .sbn-info{padding:12px 14px;border-bottom:1px solid #2A2A50;flex-shrink:0}
  .sbn-user{font-size:12px;font-weight:600;color:#E8E8F0}
  .sbn-role{font-size:10px;color:#7A7A9A;margin-top:2px}
  .sbn-spacer{flex:1}
  .sbn-footer{padding:14px;border-top:1px solid #2A2A50;flex-shrink:0}
  .sbn-sair{width:100%;padding:10px;background:none;border:1px solid #2A2A50;border-radius:8px;color:#7A7A9A;font-size:12px;font-weight:700;cursor:pointer;transition:border-color .15s,color .15s;font-family:inherit}
  .sbn-sair:hover{border-color:#FF6B35;color:#FF6B35}
}
</style>
</head>

<div class="toast" id="toast"></div>

<script>
const SB_URL = "https://ncxttwvpafajnilpjbol.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jeHR0d3ZwYWZham5pbHBqYm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4NDcyMDEsImV4cCI6MjA5NzQyMzIwMX0.MGDZNGY8GfSzBKAgdR7OhvOeR71i4fj9YseJRhoh5sE";

const SB_HEADERS = { "apikey": SB_KEY, "Authorization": `Bearer ${SB_KEY}`, "Content-Type": "application/json", "Prefer": "return=representation" };

async function sbFetch(path, opts = {}) {
  const res = await fetch(`${SB_URL}/rest/v1/${path}`, { headers: SB_HEADERS, ...opts });
  if (!res.ok) { const e = await res.text(); throw new Error(e); }
  const ct = res.headers.get("content-type") || "";
  if (ct.includes("json")) return res.json();
  return null;
}

let usuarioLogado = null;
let todosUsuarios = [];
let buscaTerm = "";

// ─── AUTH ─────────────────────────────────────────────────────────────────────

const elLogin = document.getElementById("tela-login");
const elApp = document.getElementById("app");
const elLoginNome = document.getElementById("login-nome");
const elLoginSenha = document.getElementById("login-senha");
const elLoginErr = document.getElementById("login-err");
const elBtnEntrar = document.getElementById("btn-entrar");
const elBtnVis = document.getElementById("btn-vis");
let senhaVis = false;

elBtnVis.addEventListener("click", () => {
  senhaVis = !senhaVis;
  elLoginSenha.type = senhaVis ? "text" : "password";
  elBtnVis.textContent = senhaVis ? "🙈" : "👁️";
});

function showLoginErr(msg) {
  elLoginErr.textContent = msg;
  elLoginErr.classList.remove("hidden");
}

async function fazerLogin() {
  const nome = elLoginNome.value.trim();
  const senha = elLoginSenha.value;
  if (!nome) { showLoginErr("Digite o usuário."); return; }
  if (!senha) { showLoginErr("Digite a senha."); return; }
  elLoginErr.classList.add("hidden");
  elBtnEntrar.disabled = true;
  elBtnEntrar.textContent = "Verificando...";
  try {
    const data = await sbFetch(`gn_usuarios?nome=ilike.${encodeURIComponent(nome)}&senha=eq.${encodeURIComponent(senha)}&ativo=eq.true&select=*`);
    if (!data || data.length === 0) {
      showLoginErr("Usuário ou senha incorretos.");
      elLoginSenha.value = "";
      return;
    }
    const user = data[0];
    if (user.cargo !== "mestre") {
      showLoginErr("Acesso negado. Apenas usuários mestre podem acessar este painel.");
      return;
    }
    usuarioLogado = user;
    iniciarApp();
  } catch(e) {
    showLoginErr("Erro de conexão. Tente novamente.");
  } finally {
    elBtnEntrar.disabled = false;
    elBtnEntrar.textContent = "Entrar";
  }
}

elBtnEntrar.addEventListener("click", fazerLogin);
elLoginSenha.addEventListener("keydown", e => { if (e.key === "Enter") fazerLogin(); });
elLoginNome.addEventListener("keydown", e => { if (e.key === "Enter") elLoginSenha.focus(); });

// ─── APP ──────────────────────────────────────────────────────────────────────

async function iniciarApp() {
  elLogin.style.display = "none";
  elApp.style.display = "flex";
  document.getElementById("hd-user").textContent = `Mestre: ${usuarioLogado.nome}`;
  document.body.classList.add('usuarios-active');
  const sbUser = document.getElementById('sb-user');
  if (sbUser) sbUser.textContent = usuarioLogado.nome;
  await carregarUsuarios();
}

document.getElementById("btn-sair").addEventListener("click", () => {
  usuarioLogado = null;
  todosUsuarios = [];
  document.body.classList.remove('usuarios-active');
  elApp.style.display = "none";
  elLogin.style.display = "flex";
  elLoginNome.value = "";
  elLoginSenha.value = "";
  elLoginErr.classList.add("hidden");
});

async function carregarUsuarios() {
  try {
    const data = await sbFetch("gn_usuarios?select=*&order=loja,nome");
    todosUsuarios = data || [];
    renderizarUsuarios();
  } catch(e) {
    mostrarToast("Erro ao carregar usuários", true);
  }
}

document.getElementById("busca").addEventListener("input", e => {
  buscaTerm = e.target.value.toLowerCase();
  renderizarUsuarios();
});

const CARGO_LABELS = {
  gerente: "Gerente", sub_gerente: "Sub-Gerente", estoquista: "Estoquista",
  supervisor: "Supervisor", compras: "Compras", mestre: "Mestre",
  caixa: "Caixa", manutencao: "Manutenção", rh: "RH", marketing: "Marketing"
};

const CARGO_COLORS = {
  gerente: "#FFD700", sub_gerente: "#FF6B35", estoquista: "#4FC3F7",
  supervisor: "#CE93D8", compras: "#80CBC4", mestre: "#FF4081",
  caixa: "#34D399", manutencao: "#F59E0B", rh: "#60A5FA", marketing: "#E879F9"
};

function renderizarUsuarios() {
  const lista = document.getElementById("lista-usuarios");
  const filtrados = todosUsuarios.filter(u =>
    !buscaTerm ||
    u.nome.toLowerCase().includes(buscaTerm) ||
    (u.loja || "").toLowerCase().includes(buscaTerm) ||
    (CARGO_LABELS[u.cargo] || "").toLowerCase().includes(buscaTerm)
  );

  document.getElementById("stat-total").textContent = todosUsuarios.length;
  document.getElementById("stat-ativos").textContent = todosUsuarios.filter(u => u.ativo).length;
  document.getElementById("stat-bloq").textContent = todosUsuarios.filter(u => !u.ativo).length;

  if (filtrados.length === 0) {
    lista.innerHTML = `<div style="text-align:center;padding:40px;color:#7A7A9A;font-size:14px">Nenhum usuário encontrado.</div>`;
    return;
  }

  // Group by loja
  const grupos = {};
  filtrados.forEach(u => {
    const loja = u.loja || "SEM LOJA";
    if (!grupos[loja]) grupos[loja] = [];
    grupos[loja].push(u);
  });

  const lojaOrder = ["GERAL", "BANGU", "CAXIAS", "SÃO GONÇALO", "NORTE SHOPPING",
    "BOULEVARD", "RANCHO", "PEDREIRA", "ITAQUERA", "GUARULHOS", "CAMPO GRANDE", "NOVA AMERICA"];

  const lojas = Object.keys(grupos).sort((a, b) => {
    const ia = lojaOrder.indexOf(a), ib = lojaOrder.indexOf(b);
    if (ia === -1 && ib === -1) return a.localeCompare(b);
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });

  lista.innerHTML = lojas.map(loja => {
    const users = grupos[loja];
    const usersHtml = users.map(u => {
      const cor = CARGO_COLORS[u.cargo] || "#FF6B35";
      const inicial = u.nome.charAt(0).toUpperCase();
      const cargoLabel = CARGO_LABELS[u.cargo] || u.cargo;
      const badgeHtml = u.ativo
        ? `<span class="badge badge-on">Ativo</span>`
        : `<span class="badge badge-off">Bloqueado</span>`;
      const btnBlock = u.ativo
        ? `<button class="btn-sm btn-block" onclick="toggleAtivo(${u.id}, false)">Bloquear</button>`
        : `<button class="btn-sm btn-unblock" onclick="toggleAtivo(${u.id}, true)">Ativar</button>`;
      return `<div class="user-card${u.ativo ? '' : ' inactive'}">
        <div class="user-avatar" style="background:${cor}22;color:${cor}">${inicial}</div>
        <div class="user-info">
          <div class="user-name">${u.nome}${badgeHtml}</div>
          <div class="user-cargo">${cargoLabel}</div>
          <div style="font-size:11px;color:rgba(255,255,255,.3);margin-top:2px">🔑 ${u.senha||'—'}</div>
        </div>
        <div class="user-actions">
          <button class="btn-sm btn-edit" onclick="abrirEdicao(${u.id})">Editar</button>
          ${btnBlock}
        </div>
      </div>`;
    }).join("");

    return `<div class="loja-group">
      <div class="loja-hd">
        <span>${loja}</span>
        <span style="font-size:10px;color:#7A7A9A">${users.length} usuário${users.length !== 1 ? "s" : ""}</span>
      </div>
      ${usersHtml}
    </div>`;
  }).join("");
}

// ─── TOGGLE ATIVO ──────────────────────────────────────────────────────────────

async function toggleAtivo(id, novoStatus) {
  try {
    await sbFetch(`gn_usuarios?id=eq.${id}`, {
      method: "PATCH",
      body: JSON.stringify({ ativo: novoStatus, atualizado_em: new Date().toISOString() })
    });
    const idx = todosUsuarios.findIndex(u => u.id === id);
    if (idx >= 0) todosUsuarios[idx].ativo = novoStatus;
    renderizarUsuarios();
    mostrarToast(novoStatus ? "Usuário ativado!" : "Usuário bloqueado!");
  } catch(e) {
    mostrarToast("Erro ao atualizar usuário", true);
  }
}

// ─── MODAL ────────────────────────────────────────────────────────────────────

const elOverlay = document.getElementById("modal-overlay");
const elModalTitle = document.getElementById("modal-title");
const elModalId = document.getElementById("modal-id");
const elModalNome = document.getElementById("modal-nome");
const elModalSenha = document.getElementById("modal-senha");
const elModalCargo = document.getElementById("modal-cargo");
const elModalLoja = document.getElementById("modal-loja");
const elModalErr = document.getElementById("modal-err");
const elModalPermissoes = document.getElementById("modal-permissoes");

const APP_KEYS = [
  ["lojas", "GN Lojas"],
  ["estoque", "GN Estoque"],
  ["pedidos", "GN Pedidos"],
  ["checklist", "GN Check-list"],
  ["comissoes", "GN Comissões"],
  ["mestra", "Comissões Mestra"],
  ["avaliacoes", "GN Avaliações"],
  ["caixa", "GN Caixa"],
  ["manutencao", "GN Manutenção"],
  ["rh", "GN RH"],
];
const ABAS_CONFIG = [
  { key: "checklist", label: "Check-list", abas: [
    {id:"dados",lb:"Dados"},{id:"abertura",lb:"Abertura"},{id:"checklist",lb:"Check-list"},
    {id:"fechamento",lb:"Fechamento"},{id:"carnes",lb:"Carnes"},{id:"faltas",lb:"Insumos"},
    {id:"manutencao",lb:"Manutenção"},{id:"caixa",lb:"Caixa"},{id:"fichas",lb:"Fichas"},
    {id:"banco",lb:"Banco Hrs"},{id:"supervisao",lb:"Supervisão"},{id:"historico",lb:"Histórico"},
    {id:"banda",lb:"Banda"},{id:"vendas",lb:"Vendas"},{id:"escala",lb:"Escala"},{id:"gestao",lb:"Gestão"}
  ]},
  { key: "estoque", label: "Estoque", abas: [
    {id:"home",lb:"Home"},{id:"pedido",lb:"Pedido"},{id:"fichas",lb:"Fichas"},
    {id:"estoque",lb:"Estoque"},{id:"vendas",lb:"Vendas"},{id:"contagem",lb:"Contagem"},
    {id:"entradas",lb:"Entradas"},{id:"transf",lb:"Transfer."},{id:"relatorio",lb:"Relatório"}
  ]},
  { key: "pedidos", label: "Pedidos", abas: [
    {id:"pedido",lb:"Pedido"},{id:"catalogo",lb:"Catálogo"},{id:"fornecedores",lb:"Fornecedores"},
    {id:"provisoes",lb:"Provisões"},{id:"entrega",lb:"Entrega"},{id:"fichas",lb:"Fichas"},
    {id:"faltas-dia",lb:"Faltas Dia"}
  ]},
  { key: "avaliacoes", label: "Avaliações", abas: [
    {id:"lista",lb:"Avaliações"},{id:"relatorio",lb:"Relatórios"},{id:"mestre",lb:"Mestre"}
  ]},
  { key: "comissoes", label: "Comissões", abas: [
    {id:"semana",lb:"Semana"},{id:"funcs",lb:"Funcionários"},{id:"pool",lb:"Pool"},
    {id:"resumo",lb:"Resumo"},{id:"relatorio",lb:"Relatório"},{id:"whatsapp",lb:"WhatsApp"},
    {id:"saldo",lb:"Saldo"},{id:"backup",lb:"Dados"},{id:"log",lb:"Log"}
  ]},
  { key: "lojas", label: "Lojas", abas: [
    {id:"home",lb:"Home"},{id:"pedido",lb:"Pedido"},{id:"fichas",lb:"Fichas"},
    {id:"estoque",lb:"Estoque"},{id:"vendas",lb:"Vendas"},{id:"contagem",lb:"Contagem"},
    {id:"entradas",lb:"Entradas"},{id:"transf",lb:"Transfer."},
    {id:"entrega",lb:"Entrega"},{id:"relatorio",lb:"Relatório"}
  ]},
  { key: "rh", label: "GN RH", abas: [
    {id:"operacoes",lb:"Operações"},{id:"financeiro",lb:"Financeiro"},{id:"rh",lb:"RH / BH"},{id:"comparativo",lb:"Comparativo"}
  ]},
];

function valorParaSelect(v) {
  if (v === "view") return "view";
  if (v === "admin") return "admin";
  if (v === true) return "true";
  return "";
}

function renderizarPermissoes(permissoes) {
  const p = permissoes || {};
  elModalPermissoes.innerHTML = APP_KEYS.map(([key, label]) => `
    <div class="perm-row">
      <span>${label}</span>
      <select id="perm-${key}" onchange="atualizarAbas()">
        <option value="">Sem acesso</option>
        <option value="true">Acesso</option>
        <option value="view">Visualização</option>
        <option value="admin">Admin</option>
      </select>
    </div>
  `).join("");
  APP_KEYS.forEach(([key]) => {
    document.getElementById(`perm-${key}`).value = valorParaSelect(p[key]);
  });
  renderizarAbas(p);
}

function renderizarAbas(p) {
  const elAbas = document.getElementById("modal-abas");
  if (!elAbas) return;
  elAbas.innerHTML = ABAS_CONFIG.map(app => {
    const abasArr = p[app.key + "_abas"];
    const allChecked = !Array.isArray(abasArr);
    return `
    <div class="abas-app" id="abas-bloco-${app.key}">
      <div class="abas-app-title">${app.label}</div>
      <div class="abas-grid">
        ${app.abas.map(aba => `
          <label class="aba-chip">
            <input type="checkbox" id="aba-${app.key}-${aba.id}" value="${aba.id}"
              ${allChecked || (Array.isArray(abasArr) && abasArr.includes(aba.id)) ? "checked" : ""}>
            ${aba.lb}
          </label>
        `).join("")}
      </div>
    </div>`;
  }).join("");
  atualizarAbas();
}

function atualizarAbas() {
  ABAS_CONFIG.forEach(app => {
    const bloco = document.getElementById("abas-bloco-" + app.key);
    if (!bloco) return;
    const temAcesso = document.getElementById("perm-" + app.key).value !== "";
    bloco.style.display = temAcesso ? "" : "none";
  });
}

function coletarPermissoes() {
  const permissoes = {};
  APP_KEYS.forEach(([key]) => {
    const v = document.getElementById(`perm-${key}`).value;
    permissoes[key] = v === "true" ? true : v === "" ? false : v;
  });
  ABAS_CONFIG.forEach(app => {
    const temAcesso = permissoes[app.key];
    if (!temAcesso) return;
    const bloco = document.getElementById("abas-bloco-" + app.key);
    if (!bloco) return;
    const checks = [...bloco.querySelectorAll('input[type="checkbox"]')];
    const marcados = checks.filter(c => c.checked).map(c => c.value);
    if (marcados.length < checks.length) {
      permissoes[app.key + "_abas"] = marcados;
    }
  });
  return permissoes;
}

function abrirModal(titulo, user = null) {
  elModalTitle.textContent = titulo;
  elModalId.value = user ? user.id : "";
  elModalNome.value = user ? user.nome : "";
  elModalSenha.value = "";
  elModalCargo.value = user ? user.cargo : "";
  elModalLoja.value = user ? user.loja : "";
  renderizarPermissoes(user ? user.permissoes : null);
  elModalErr.classList.add("hidden");
  elOverlay.classList.remove("hidden");
  elModalNome.focus();
}

function fecharModal() { elOverlay.classList.add("hidden"); }

document.getElementById("btn-novo").addEventListener("click", () => abrirModal("Novo Usuário"));
document.getElementById("modal-cancel").addEventListener("click", fecharModal);
elOverlay.addEventListener("click", e => { if (e.target === elOverlay) fecharModal(); });

function abrirEdicao(id) {
  const user = todosUsuarios.find(u => u.id === id);
  if (!user) return;
  abrirModal("Editar Usuário", user);
}

document.getElementById("modal-save").addEventListener("click", async () => {
  const id = elModalId.value;
  const nome = elModalNome.value.trim();
  const senha = elModalSenha.value.trim();
  const cargo = elModalCargo.value;
  const loja = elModalLoja.value;

  if (!nome) { showModalErr("Digite o nome."); return; }
  if (!id && !senha) { showModalErr("Digite a senha para novo usuário."); return; }
  if (!cargo) { showModalErr("Selecione o cargo."); return; }
  if (!loja) { showModalErr("Selecione a loja."); return; }

  elModalErr.classList.add("hidden");
  const btn = document.getElementById("modal-save");
  btn.disabled = true; btn.textContent = "Salvando...";

  try {
    const permissoes = coletarPermissoes();
    const payload = { nome, cargo, loja, permissoes, atualizado_em: new Date().toISOString() };
    if (senha) payload.senha = senha;
    if (id) {
      await sbFetch(`gn_usuarios?id=eq.${id}`, { method: "PATCH", body: JSON.stringify(payload) });
      const idx = todosUsuarios.findIndex(u => u.id === Number(id));
      if (idx >= 0) todosUsuarios[idx] = { ...todosUsuarios[idx], ...payload };
      mostrarToast("Usuário atualizado!");
    } else {
      const criado = await sbFetch("gn_usuarios", {
        method: "POST",
        body: JSON.stringify({ ...payload, ativo: true, criado_em: new Date().toISOString() })
      });
      if (criado && criado[0]) todosUsuarios.push(criado[0]);
      mostrarToast("Usuário criado!");
    }
    fecharModal();
    renderizarUsuarios();
  } catch(e) {
    showModalErr("Erro ao salvar. Verifique os dados.");
  } finally {
    btn.disabled = false; btn.textContent = "Salvar";
  }
});

function showModalErr(msg) {
  elModalErr.textContent = msg;
  elModalErr.classList.remove("hidden");
}

// ─── TOAST ────────────────────────────────────────────────────────────────────

let toastTimer;
function mostrarToast(msg, isErr = false) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = `toast${isErr ? " err" : ""}`;
  clearTimeout(toastTimer);
  requestAnimationFrame(() => {
    el.classList.add("show");
    toastTimer = setTimeout(() => el.classList.remove("show"), 2800);
  });
}
</script>
