name: Supabase Migration

on:
  workflow_dispatch:

env:
  SB_URL: https://ncxttwvpafajnilpjbol.supabase.co
  SB_ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jeHR0d3ZwYWZham5pbHBqYm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4NDcyMDEsImV4cCI6MjA5NzQyMzIwMX0.MGDZNGY8GfSzBKAgdR7OhvOeR71i4fj9YseJRhoh5sE
  SB_SERVICE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SB_REF: ncxttwvpafajnilpjbol

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Probe endpoints and create table
        run: |
          SQL='CREATE TABLE IF NOT EXISTS gn_trios_agenda (id uuid PRIMARY KEY DEFAULT gen_random_uuid(), data date NOT NULL, horario_inicio text, horario_fim text, loja text NOT NULL, artista text NOT NULL, cache numeric DEFAULT 0, confirmado boolean DEFAULT false, confirmado_por text, confirmado_em timestamptz, created_at timestamptz DEFAULT now()); ALTER TABLE gn_trios_agenda ENABLE ROW LEVEL SECURITY; DO $$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_policies WHERE tablename='"'"'gn_trios_agenda'"'"' AND policyname='"'"'anon_all'"'"') THEN EXECUTE '"'"'CREATE POLICY anon_all ON gn_trios_agenda FOR ALL TO anon USING (true) WITH CHECK (true)'"'"'; END IF; END $$;'

          KEY="${SB_SERVICE:-$SB_ANON}"
          echo "=== Tentativa 1: Management API com service key ==="
          R=$(curl -s -o /tmp/r1.txt -w "%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/${SB_REF}/database/query" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d "{\"query\": $(echo "$SQL" | jq -Rs .)}")
          echo "HTTP $R: $(cat /tmp/r1.txt)"
          [ "$R" = "200" ] && echo "✅ Sucesso via Management API!" && exit 0

          echo "=== Tentativa 2: RPC exec_sql ==="
          R=$(curl -s -o /tmp/r2.txt -w "%{http_code}" -X POST \
            "${SB_URL}/rest/v1/rpc/exec_sql" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d "{\"sql\": $(echo "$SQL" | jq -Rs .)}")
          echo "HTTP $R: $(cat /tmp/r2.txt)"
          [ "$R" = "200" ] || [ "$R" = "204" ] && echo "✅ Sucesso via RPC exec_sql!" && exit 0

          echo "=== Tentativa 3: pg endpoint ==="
          R=$(curl -s -o /tmp/r3.txt -w "%{http_code}" -X POST \
            "${SB_URL}/pg/query" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d "{\"query\": $(echo "$SQL" | jq -Rs .)}")
          echo "HTTP $R: $(cat /tmp/r3.txt)"
          [ "$R" = "200" ] && echo "✅ Sucesso via pg/query!" && exit 0

          echo "=== Tentativa 4: Node.js com @supabase/supabase-js ==="
          npm install -q @supabase/supabase-js 2>/dev/null
          node -e "
          const { createClient } = require('@supabase/supabase-js');
          const db = createClient('${SB_URL}', '$KEY', { db: { schema: 'public' } });
          db.rpc('exec_sql', { sql: \`$SQL\` })
            .then(r => { console.log(JSON.stringify(r)); process.exit(r.error ? 1 : 0); })
            .catch(e => { console.error(e); process.exit(1); });
          " && echo "✅ Sucesso via SDK!" && exit 0

          echo "❌ Nenhuma tentativa funcionou. Verifique os logs acima."
          exit 1
